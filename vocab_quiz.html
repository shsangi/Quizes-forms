<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Compact Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .card-hover { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px -8px rgba(0,0,0,0.12); }
        .url-link { color: #2563eb; text-decoration: none; border-bottom: 1px dashed #93c5fd; transition: all 0.2s; }
        .url-link:hover { color: #1d4ed8; border-bottom-color: #2563eb; background: #eff6ff; padding: 0 4px; border-radius: 4px; }
        .search-btn { transition: all 0.2s; }
        .search-btn:hover { transform: scale(1.1); background: #e0e7ff; }
        .tab-active { background: white; color: #4f46e5; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15); }
        .tab-inactive { color: #6b7280; }
        .tab-inactive:hover { background: rgba(255,255,255,0.5); color: #1f2937; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a78bfa; }
        .card-field { transition: background 0.15s; padding: 6px 10px; margin: 0 -10px; border-radius: 6px; }
        .card-field:hover { background: #f8fafc; }
        .heading-gradient-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .heading-gradient-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .heading-gradient-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .heading-gradient-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .heading-gradient-5 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .heading-gradient-6 { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        .heading-gradient-7 { background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%); }
        .heading-gradient-8 { background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); }
        .heading-gradient-9 { background: linear-gradient(135deg, #fddb92 0%, #d1fdff 100%); }
        .heading-gradient-10 { background: linear-gradient(135deg, #c1f1c6 0%, #f9d976 100%); }
        
        .tabs-only { 
            background: rgba(255,255,255,0.7); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 16px;
            padding: 6px 10px;
            display: inline-flex;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .tabs-wrapper {
            display: flex;
            justify-content: center;
            padding: 12px 0 18px 0;
        }
        /* Compact card styles - increased size */
        .compact-card .card-body { padding: 12px 16px !important; }
        .compact-card .card-heading { padding: 10px 16px !important; }
        .compact-card .card-heading h3 { font-size: 1rem !important; }
        .compact-card .field-label { font-size: 0.65rem !important; letter-spacing: 0.04em; }
        .compact-card .field-value { font-size: 0.85rem !important; }
        .compact-card .field-row { padding: 4px 0 !important; margin: 0 !important; border-bottom: none !important; }
        .compact-card .field-row + .field-row { border-top: 1px solid #f3f4f6; }
        .compact-card .url-link { font-size: 0.85rem !important; }
        .compact-card .search-btn { width: 22px !important; height: 22px !important; }
        .compact-card .search-btn i { font-size: 10px !important; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 min-h-screen p-4 md:p-6">

    <div class="max-w-7xl mx-auto">
        
        <!-- Horizontal Tabs Only -->
        <div class="tabs-wrapper">
            <div id="view-tabs" class="hidden tabs-only">
                <button id="btn-cards" onclick="switchView('cards')" class="px-5 py-2 text-sm font-medium rounded-lg tab-active transition-all flex items-center gap-2">
                    <i class="fas fa-th-large"></i> Data Cards
                </button>
                <button id="btn-table" onclick="switchView('table')" class="px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2">
                    <i class="fas fa-list-ul"></i> Table View
                </button>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="flex flex-col items-center justify-center py-24 bg-white/60 rounded-2xl backdrop-blur-sm border border-white/30">
            <div class="relative">
                <div class="animate-spin rounded-full h-14 w-14 border-4 border-indigo-200 border-t-indigo-600"></div>
            </div>
            <span class="mt-3 text-sm font-medium text-gray-500 animate-pulse">Loading...</span>
        </div>

        <!-- Error -->
        <div id="error" class="hidden bg-red-50/90 backdrop-blur-sm border-l-4 border-red-500 p-4 rounded-xl shadow-lg mb-6">
            <div class="flex items-start gap-3">
                <i class="fas fa-exclamation-circle text-red-500 text-lg mt-0.5"></i>
                <div>
                    <h4 class="font-semibold text-red-800">Failed to load</h4>
                    <p class="text-sm text-red-700 mt-1" id="error-message">Please check your connection.</p>
                    <button onclick="retryLoad()" class="mt-2 text-sm bg-red-100 hover:bg-red-200 text-red-700 px-4 py-1 rounded-lg transition flex items-center gap-2">
                        <i class="fas fa-redo"></i> Retry
                    </button>
                </div>
            </div>
        </div>

        <!-- Table View -->
        <div id="table-view" class="hidden bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl border border-white/50 overflow-hidden">
            <div class="overflow-x-auto p-2">
                <table class="min-w-full divide-y divide-gray-200/60">
                    <thead id="table-head" class="bg-gradient-to-r from-indigo-50 to-purple-50"></thead>
                    <tbody id="table-body" class="bg-white divide-y divide-gray-100"></tbody>
                </table>
            </div>
            <div class="bg-gray-50/50 px-5 py-2 text-xs text-gray-400 border-t border-gray-200/50 flex justify-between items-center">
                <span><i class="fas fa-mouse-pointer mr-1"></i> Click URLs · <i class="fas fa-search text-indigo-400 mx-1"></i> Search</span>
                <span id="table-count">0 rows</span>
            </div>
        </div>

        <!-- Cards View - Compact +1 size -->
        <div id="cards-view" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">
            <!-- Cards injected here -->
        </div>
    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQwqiqAHnqVpS5790H4PQl0gkl3UwaM1-AvSfHRAv8lIQTmWzl2q8OuV9z9Gk42cMCq_xbiKCyyCePQ/pub?output=csv";

        let sheetData = [];
        let sheetHeaders = [];
        let currentView = 'cards';

        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const errorMessageEl = document.getElementById('error-message');
        const viewTabsEl = document.getElementById('view-tabs');
        
        const tableViewEl = document.getElementById('table-view');
        const cardsViewEl = document.getElementById('cards-view');
        
        const btnCards = document.getElementById('btn-cards');
        const btnTable = document.getElementById('btn-table');
        const tableHeadEl = document.getElementById('table-head');
        const tableBodyEl = document.getElementById('table-body');
        const tableCountEl = document.getElementById('table-count');

        const headingGradients = [
            'heading-gradient-1', 'heading-gradient-2', 'heading-gradient-3', 
            'heading-gradient-4', 'heading-gradient-5', 'heading-gradient-6',
            'heading-gradient-7', 'heading-gradient-8', 'heading-gradient-9', 
            'heading-gradient-10'
        ];

        function isURL(str) {
            if (!str || typeof str !== 'string') return false;
            const pattern = /^(https?:\/\/|www\.)[^\s]+$/i;
            return pattern.test(str.trim());
        }

        function getDomain(url) {
            try {
                const u = new URL(url.startsWith('http') ? url : 'https://' + url);
                return u.hostname.replace('www.', '');
            } catch { return url; }
        }

        function renderCellContent(value, header) {
            if (!value) return '';
            const trimmed = String(value).trim();
            
            if (isURL(trimmed)) {
                const displayUrl = trimmed.length > 35 ? trimmed.substring(0, 35) + '…' : trimmed;
                return `
                    <a href="${trimmed.startsWith('http') ? trimmed : 'https://' + trimmed}" 
                       target="_blank" 
                       class="url-link inline-flex items-center gap-1 group"
                       title="Open: ${trimmed}">
                        <i class="fas fa-external-link-alt text-[10px] text-indigo-400"></i>
                        ${displayUrl}
                    </a>
                `;
            }
            
            const isSearchable = trimmed.length > 2 && !/^[\d\s,.]+$/.test(trimmed);
            if (isSearchable) {
                return `
                    <span class="flex items-center gap-1.5">
                        <span>${value}</span>
                        <button onclick="searchGoogle('${encodeURIComponent(trimmed)}')" 
                                class="search-btn text-gray-400 hover:text-indigo-600 text-xs w-5 h-5 rounded-full hover:bg-indigo-50 flex items-center justify-center transition-all">
                            <i class="fas fa-search text-[9px]"></i>
                        </button>
                    </span>
                `;
            }
            return `<span>${value}</span>`;
        }

        function searchGoogle(query) {
            window.open('https://www.google.com/search?q=' + query, '_blank');
        }
        window.searchGoogle = searchGoogle;

        function loadData() {
            loadingEl.style.display = 'flex';
            errorEl.classList.add('hidden');
            
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    loadingEl.style.display = 'none';

                    if (results.errors.length > 0) {
                        showError("Error parsing the CSV data.");
                        return;
                    }

                    sheetData = results.data;
                    if (sheetData.length === 0) {
                        showError("The spreadsheet is empty.");
                        return;
                    }

                    sheetHeaders = Object.keys(sheetData[0]).filter(h => h && h.trim() !== '');

                    tableCountEl.textContent = sheetData.length + ' rows';

                    renderTable();
                    renderCards();

                    viewTabsEl.classList.remove('hidden');
                    switchView('cards');
                },
                error: function(err) {
                    loadingEl.style.display = 'none';
                    showError("Failed to fetch Google Sheet.");
                    console.error(err);
                }
            });
        }

        function retryLoad() { loadData(); }
        window.retryLoad = retryLoad;

        function showError(msg) {
            errorEl.classList.remove('hidden');
            errorMessageEl.textContent = msg;
        }

        function switchView(view) {
            currentView = view;
            if (view === 'cards') {
                cardsViewEl.classList.remove('hidden');
                tableViewEl.classList.add('hidden');
                btnCards.className = "px-5 py-2 text-sm font-medium rounded-lg tab-active transition-all flex items-center gap-2";
                btnTable.className = "px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";
            } else {
                tableViewEl.classList.remove('hidden');
                cardsViewEl.classList.add('hidden');
                btnTable.className = "px-5 py-2 text-sm font-medium rounded-lg tab-active transition-all flex items-center gap-2";
                btnCards.className = "px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";
            }
        }
        window.switchView = switchView;

        function renderTable() {
            if (sheetHeaders.length === 0) return;
            
            let headerHtml = '<tr>';
            sheetHeaders.forEach(header => {
                headerHtml += `<th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">${header}</th>`;
            });
            headerHtml += '</tr>';
            tableHeadEl.innerHTML = headerHtml;

            let bodyHtml = '';
            sheetData.forEach((row, index) => {
                const rowBg = index % 2 === 0 ? 'bg-white' : 'bg-gray-50/60';
                bodyHtml += `<tr class="${rowBg} hover:bg-indigo-50/50 transition-colors">`;
                sheetHeaders.forEach(header => {
                    const cellValue = row[header] !== undefined && row[header] !== null ? row[header] : '';
                    bodyHtml += `<td class="px-4 py-3 text-sm text-gray-700">${renderCellContent(cellValue, header)}</td>`;
                });
                bodyHtml += `</tr>`;
            });
            tableBodyEl.innerHTML = bodyHtml;
        }

        function renderCards() {
            if (sheetHeaders.length === 0) return;
            
            let cardsHtml = '';
            const colA = sheetHeaders[0] || 'Item';
            const colB = sheetHeaders.length > 1 ? sheetHeaders[1] : sheetHeaders[0];
            
            sheetData.forEach((row, index) => {
                const valueA = row[colA] !== undefined && row[colA] !== null ? row[colA] : '';
                const valueB = row[colB] !== undefined && row[colB] !== null ? row[colB] : '';
                const headingText = `${valueA} ${valueB}`.trim() || 'Untitled';
                const gradientClass = headingGradients[index % headingGradients.length];

                cardsHtml += `
                    <div class="bg-white rounded-xl shadow-md border border-gray-200/60 card-hover overflow-hidden compact-card">
                        <!-- Compact Heading -->
                        <div class="${gradientClass} card-heading px-4 py-2.5 border-b border-white/20 flex items-center justify-between">
                            <h3 class="text-base font-bold text-white flex items-center gap-1.5 truncate">
                                <i class="fas fa-tag text-white/60 text-[11px]"></i>
                                <span class="truncate">${headingText}</span>
                            </h3>
                            <button onclick="searchGoogle('${encodeURIComponent(headingText)}')" 
                                    class="text-white/60 hover:text-white text-xs w-7 h-7 rounded-full hover:bg-white/20 flex items-center justify-center transition-all flex-shrink-0">
                                <i class="fas fa-search text-[11px]"></i>
                            </button>
                        </div>
                        
                        <!-- Compact Body -->
                        <div class="card-body px-4 py-2.5 space-y-0">
                `;

                for (let i = 0; i < sheetHeaders.length; i++) {
                    const header = sheetHeaders[i];
                    let val = row[header] !== undefined && row[header] !== null ? row[header] : '';
                    if (val !== '') {
                        const isUrl = isURL(String(val).trim());
                        let displayVal = val;
                        
                        if (isUrl) {
                            const domain = getDomain(val);
                            displayVal = `<a href="${val.startsWith('http') ? val : 'https://' + val}" target="_blank" class="url-link text-sm inline-flex items-center gap-1">
                                <i class="fas fa-external-link-alt text-[9px]"></i> ${domain}
                            </a>`;
                        } else {
                            const searchable = String(val).length > 2 && !/^[\d\s,.]+$/.test(String(val));
                            if (searchable) {
                                displayVal = `
                                    <span class="flex items-center gap-1.5 flex-wrap">
                                        <span class="text-sm">${val}</span>
                                        <button onclick="searchGoogle('${encodeURIComponent(String(val).trim())}')" 
                                                class="text-gray-400 hover:text-indigo-500 text-[11px] transition-all">
                                            <i class="fas fa-search text-[9px]"></i>
                                        </button>
                                    </span>
                                `;
                            }
                        }
                        
                        cardsHtml += `
                            <div class="field-row flex justify-between items-center gap-2 py-1.5">
                                <span class="field-label font-medium text-gray-400 text-[11px] uppercase tracking-wider flex-shrink-0">
                                    ${header}
                                </span>
                                <span class="field-value text-gray-700 text-right break-all max-w-[60%]">${displayVal}</span>
                            </div>
                        `;
                    }
                }

                cardsHtml += `
                        </div>
                    </div>
                `;
            });
            cardsViewEl.innerHTML = cardsHtml;
        }

        loadData();
    </script>
</body>
</html>
