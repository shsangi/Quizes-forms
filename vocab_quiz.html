<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets Data Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #f0f4f8;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 1300px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            padding: 30px;
            overflow-x: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-bottom: 2px solid #e9edf2;
            padding-bottom: 15px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0b2b4a;
            margin: 0;
        }
        .status {
            color: #2c5778;
            background: #e7f1fa;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            min-width: 600px;
        }
        th {
            background: #f7fafc;
            color: #1a3a5a;
            font-weight: 600;
            padding: 14px 18px;
            text-align: left;
            border-bottom: 2px solid #dce2ea;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            padding: 12px 18px;
            border-bottom: 1px solid #eef2f6;
            color: #1e2a3a;
        }
        tr:nth-child(even) {
            background: #fafcfe;
        }
        tr:hover {
            background: #eef6ff;
        }
        .loading, .error, .empty {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.1rem;
        }
        .loading {
            color: #2c5778;
        }
        .error {
            background: #fef2f2;
            color: #991b1b;
            border-radius: 12px;
            padding: 30px;
        }
        .error strong {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        .error ul {
            text-align: left;
            max-width: 500px;
            margin: 15px auto;
        }
        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e4a7a;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #6b7a8f;
            text-align: center;
            border-top: 1px solid #e9edf2;
            padding-top: 18px;
        }
        @media (max-width: 700px) {
            .container { padding: 16px; }
            .header { flex-direction: column; align-items: flex-start; gap: 10px; }
            h1 { font-size: 1.4rem; }
            th, td { padding: 8px 12px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Spreadsheet Viewer</h1>
            <div class="status" id="statusMessage">⏳ Connecting to data...</div>
        </div>
        <div class="table-wrapper" id="tableContainer">
            <div class="loading">⏳ Loading your spreadsheet data...</div>
        </div>
        <div class="footer-note">
            Data loaded directly from Google Sheets &bull; 
            <span id="rowCount">0</span> rows displayed
        </div>
    </div>

    <script>
        // ============================================================
        //  STEP 1: REPLACE THIS URL WITH YOUR PUBLISHED CSV LINK
        //  Go to File → Share → Publish to web → CSV format
        // ============================================================
        const PUBLISHED_CSV_URL = "https://docs.google.com/spreadsheets/d/e/YOUR_SHEET_ID/pub?output=csv";
        
        // If you get CORS errors, uncomment the line below and comment the one above:
        // const PUBLISHED_CSV_URL = "https://api.allorigins.win/raw?url=" + 
        //     encodeURIComponent("https://docs.google.com/spreadsheets/d/e/YOUR_SHEET_ID/pub?output=csv");

        // ============================================================
        //  NO NEED TO EDIT BELOW THIS LINE
        // ============================================================

        const statusEl = document.getElementById('statusMessage');
        const container = document.getElementById('tableContainer');
        const rowCountEl = document.getElementById('rowCount');

        async function fetchAndDisplayCSV() {
            try {
                statusEl.textContent = '⏳ Fetching data...';
                const response = await fetch(PUBLISHED_CSV_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status} — ${response.statusText}`);
                }
                
                const csvText = await response.text();
                
                if (!csvText || csvText.trim() === '') {
                    throw new Error('The CSV file is empty.');
                }

                const rows = parseCSV(csvText);
                
                if (rows.length === 0) {
                    container.innerHTML = `<div class="empty">📭 No data found in the spreadsheet.</div>`;
                    statusEl.textContent = '❌ No data';
                    rowCountEl.textContent = '0';
                    return;
                }

                // Build the table
                let html = `<table><thead><tr>`;
                // Header row
                rows[0].forEach(header => {
                    html += `<th>${escapeHTML(header || '')}</th>`;
                });
                html += `</tr></thead><tbody>`;
                
                // Data rows (skip header)
                for (let i = 1; i < rows.length; i++) {
                    html += `<tr>`;
                    const rowData = rows[i];
                    // Ensure each row has the same number of cells as header
                    for (let j = 0; j < rows[0].length; j++) {
                        html += `<td>${escapeHTML(rowData[j] || '')}</td>`;
                    }
                    html += `</tr>`;
                }
                html += `</tbody></table>`;

                container.innerHTML = html;
                const dataRows = rows.length - 1;
                rowCountEl.textContent = dataRows;
                statusEl.textContent = `✅ Loaded ${dataRows} rows from ${rows[0].length} columns`;
                statusEl.style.background = '#e6f7e6';

            } catch (error) {
                console.error('CSV Fetch Error:', error);
                container.innerHTML = `
                    <div class="error">
                        <strong>⚠️ Failed to load spreadsheet</strong>
                        <p>${error.message}</p>
                        <hr style="margin: 20px 0; border-color: #fecaca;">
                        <div style="text-align: left; max-width: 600px; margin: 0 auto;">
                            <strong>🔧 Troubleshooting:</strong>
                            <ul>
                                <li><strong>Step 1:</strong> Open your Google Sheet</li>
                                <li><strong>Step 2:</strong> Go to <code>File → Share → Publish to web</code></li>
                                <li><strong>Step 3:</strong> Click "Publish" and copy the CSV link</li>
                                <li><strong>Step 4:</strong> Replace <code>PUBLISHED_CSV_URL</code> in the code with that link</li>
                                <li><strong>If you see CORS errors:</strong> Uncomment the proxy line in the code</li>
                            </ul>
                        </div>
                    </div>
                `;
                statusEl.textContent = '❌ Error loading data';
                statusEl.style.background = '#fee2e2';
                rowCountEl.textContent = '0';
            }
        }

        // CSV parser that handles quoted fields with commas
        function parseCSV(text) {
            const lines = [];
            let currentLine = [];
            let currentField = '';
            let insideQuotes = false;
            
            // Normalize line endings and add a trailing newline for simpler parsing
            const data = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n') + '\n';
            
            for (let i = 0; i < data.length; i++) {
                const char = data[i];
                
                if (char === '"') {
                    // Handle double quotes inside quoted fields
                    if (insideQuotes && data[i + 1] === '"') {
                        currentField += '"';
                        i++; // skip the next quote
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === ',' && !insideQuotes) {
                    currentLine.push(currentField.trim());
                    currentField = '';
                } else if (char === '\n' && !insideQuotes) {
                    currentLine.push(currentField.trim());
                    if (currentLine.some(field => field !== '')) {
                        lines.push(currentLine);
                    }
                    currentLine = [];
                    currentField = '';
                } else {
                    currentField += char;
                }
            }
            
            // Remove empty lines
            return lines.filter(line => line.length > 0 && line.some(field => field !== ''));
        }

        function escapeHTML(str) {
            if (!str) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(str).replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Start the process
        fetchAndDisplayCSV();
    </script>
</body>
</html>
