<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Quiz & Data Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .card-hover { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px -8px rgba(0,0,0,0.12); }
        .url-link { color: #2563eb; text-decoration: none; border-bottom: 1px dashed #93c5fd; transition: all 0.2s; }
        .url-link:hover { color: #1d4ed8; border-bottom-color: #2563eb; background: #eff6ff; padding: 0 4px; border-radius: 4px; }
        .search-btn { transition: all 0.2s; }
        .search-btn:hover { transform: scale(1.1); background: #e0e7ff; }
        .tab-active { background: white; color: #4f46e5; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15); }
        .tab-inactive { color: #6b7280; }
        .tab-inactive:hover { background: rgba(255,255,255,0.5); color: #1f2937; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a78bfa; }
        .card-field { transition: background 0.15s; padding: 6px 10px; margin: 0 -10px; border-radius: 6px; }
        .card-field:hover { background: #f8fafc; }
        .heading-gradient-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .heading-gradient-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .heading-gradient-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .heading-gradient-4 { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        .heading-gradient-5 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .heading-gradient-6 { background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%); }
        .heading-gradient-7 { background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%); }
        .heading-gradient-8 { background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); }
        .heading-gradient-9 { background: linear-gradient(135deg, #fddb92 0%, #d1fdff 100%); }
        .heading-gradient-10 { background: linear-gradient(135deg, #c1f1c6 0%, #f9d976 100%); }
        
        .tabs-only { 
            background: rgba(255,255,255,0.7); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 16px;
            padding: 6px 10px;
            display: inline-flex;
            flex-wrap: wrap;
            gap: 2px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .tabs-wrapper {
            display: flex;
            justify-content: center;
            padding: 12px 0 18px 0;
        }
        .compact-card .card-body { padding: 12px 16px !important; }
        .compact-card .card-heading { padding: 10px 16px !important; }
        .compact-card .card-heading h3 { font-size: 1rem !important; }
        .compact-card .field-label { font-size: 0.65rem !important; letter-spacing: 0.04em; }
        .compact-card .field-value { font-size: 0.85rem !important; }
        .compact-card .field-row { padding: 4px 0 !important; margin: 0 !important; border-bottom: none !important; }
        .compact-card .field-row + .field-row { border-top: 1px solid #f3f4f6; }
        .compact-card .url-link { font-size: 0.85rem !important; }
        .compact-card .search-btn { width: 22px !important; height: 22px !important; }
        .compact-card .search-btn i { font-size: 10px !important; }
        
        .quiz-option {
            transition: all 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .quiz-option:hover { background: #f1f5f9; border-color: #e2e8f0; }
        .quiz-option.selected { border-color: #4f46e5; background: #eef2ff; }
        .quiz-option.correct { border-color: #22c55e; background: #dcfce7; }
        .quiz-option.wrong { border-color: #ef4444; background: #fee2e2; }
        .quiz-option.show-correct { border-color: #22c55e; background: #dcfce7; }
        .quiz-card { max-width: 700px; margin: 0 auto; }
        .quiz-progress { height: 4px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        .quiz-progress-bar { height: 100%; background: linear-gradient(135deg, #667eea, #764ba2); transition: width 0.3s ease; }

        /* Quiz2 styles - Self Learners format */
        .quiz2-wrapper {
            max-width: 880px;
            margin: 0 auto;
            background: white;
            border-radius: 2rem;
            padding: 2rem 2rem 1.8rem;
            box-shadow: 0 25px 50px -10px rgba(0, 20, 30, 0.15);
        }
        .quiz2-brand { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.5rem; }
        .quiz2-brand h1 { font-size: 1.6rem; font-weight: 700; background: linear-gradient(145deg, #0b2a3b, #1b5a7a); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .quiz2-brand .subtitle { font-size: 0.7rem; font-weight: 500; color: #6c8a9e; text-transform: uppercase; }
        .quiz2-timer { text-align: center; padding: 0.2rem 0 0.8rem; font-weight: 500; color: #1f4d66; }
        .quiz2-progress-block { background: #e6edf5; height: 8px; border-radius: 20px; margin: 0.6rem 0 0.3rem; overflow: hidden; }
        .quiz2-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2f7b9e, #4ba3c7); border-radius: 20px; transition: width 0.35s ease; }
        .quiz2-progress-label { text-align: center; font-size: 0.8rem; font-weight: 600; color: #1f4d66; margin-bottom: 0.8rem; }
        .quiz2-q-item { background: #fafcfe; border: 1px solid #e2eaf2; border-radius: 1.2rem; padding: 1rem 1.2rem; margin-bottom: 1.2rem; transition: 0.1s; cursor: pointer; }
        .quiz2-q-item:hover { border-color: #6fa6c7; box-shadow: 0 2px 8px rgba(47, 123, 158, 0.08); }
        .quiz2-q-item.correct-item { border-color: #1f8b4c; background: #f0faf4; }
        .quiz2-q-item.wrong-item { border-color: #b33c3c; background: #fdf2f2; }
        .quiz2-q-text { font-weight: 600; font-size: 1.05rem; margin-bottom: 0.6rem; color: #0a212b; }
        .quiz2-options { display: flex; flex-direction: column; gap: 0.4rem; }
        .quiz2-option { background: white; border: 1.5px solid #dce6ef; border-radius: 60px; padding: 0.5rem 1.4rem; font-size: 0.95rem; font-weight: 500; color: #1d3847; text-align: left; cursor: pointer; transition: all 0.12s; display: flex; align-items: center; gap: 0.8rem; }
        .quiz2-option:hover:not(:disabled) { background: #f5faff; border-color: #6fa6c7; }
        .quiz2-option .letter { background: #e7f0f7; color: #1a5a7a; font-weight: 700; width: 28px; height: 28px; border-radius: 30px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .quiz2-option.correct { background: #d8eddf; border-color: #1f8b4c; }
        .quiz2-option.correct .letter { background: #1f8b4c; color: white; }
        .quiz2-option.wrong { background: #f5dddd; border-color: #b33c3c; }
        .quiz2-option.wrong .letter { background: #b33c3c; color: white; }
        .quiz2-option.selected-opt { border-color: #2f7b9e; background: #e6f0f7; }
        .quiz2-option:disabled { cursor: default; opacity: 0.8; }
        .quiz2-action-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 1rem; margin: 0.4rem 0 0.2rem; }
        .quiz2-btn-primary { background: #0b2a3b; border: none; color: white; font-weight: 600; font-size: 1rem; padding: 0.7rem 2.2rem; border-radius: 60px; cursor: pointer; box-shadow: 0 6px 14px rgba(11,42,59,0.16); transition: 0.15s; }
        .quiz2-btn-primary:hover:not(:disabled) { background: #1a4b62; transform: scale(1.02); }
        .quiz2-btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .quiz2-btn-success { background: #1f8b4c; border: none; color: white; font-weight: 600; font-size: 1rem; padding: 0.7rem 2.2rem; border-radius: 60px; cursor: pointer; box-shadow: 0 6px 14px rgba(31,139,76,0.25); transition: 0.15s; }
        .quiz2-btn-success:hover:not(:disabled) { background: #167a3e; transform: scale(1.02); }
        .quiz2-btn-success:disabled { opacity: 0.4; cursor: not-allowed; }
        .quiz2-dot-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin-top: 0.2rem; }
        .quiz2-dot { width: 32px; height: 32px; border-radius: 30px; background: #dce6ef; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.7rem; color: #1d4b61; transition: 0.1s; cursor: pointer; border: 2px solid transparent; font-family: inherit; }
        .quiz2-dot:hover { transform: scale(1.08); filter: brightness(0.92); }
        .quiz2-dot.done-dot { background: #2f7b9e; color: white; }
        .quiz2-dot.correct-dot { background: #1f8b4c; color: white; }
        .quiz2-dot.wrong-dot { background: #b33c3c; color: white; }
        .quiz2-dot.active-dot { border-color: #0b2a3b; transform: scale(1.1); }
        .quiz2-legend { display: flex; gap: 1rem; font-size: 0.8rem; font-weight: 500; color: #2d5a72; flex-wrap: wrap; }
        .quiz2-legend-item { display: flex; align-items: center; gap: 0.3rem; }
        .quiz2-legend-dot { width: 14px; height: 14px; border-radius: 30px; display: inline-block; flex-shrink: 0; }
        .quiz2-legend-dot.done-dot { background: #2f7b9e; }
        .quiz2-legend-dot.pending-dot { background: #dce6ef; }
        .quiz2-legend-dot.correct-dot { background: #1f8b4c; }
        .quiz2-legend-dot.wrong-dot { background: #b33c3c; }
        .quiz2-result { text-align: center; padding: 0.5rem; display: none; }
        .quiz2-result h2 { font-size: 2.2rem; font-weight: 700; color: #0b2a3b; }
        .quiz2-result-score { font-size: 3.6rem; font-weight: 800; background: linear-gradient(135deg, #1a5a7a, #48a0c7); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .quiz2-result-details { text-align: left; margin: 1.5rem 0 1rem; max-height: 400px; overflow-y: auto; }
        .quiz2-result-detail { background: #fafcfe; border: 1px solid #e2eaf2; border-radius: 1rem; padding: 0.8rem 1rem; margin-bottom: 0.8rem; }
        .quiz2-result-detail.correct-detail { border-left: 6px solid #1f8b4c; }
        .quiz2-result-detail.wrong-detail { border-left: 6px solid #b33c3c; }
        .quiz2-overview { margin-top: 1.2rem; border-top: 1px solid #e2eaf2; padding-top: 1rem; }
        .quiz2-overview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; flex-wrap: wrap; gap: 0.4rem; }
        .quiz2-overview-header span { font-weight: 600; font-size: 0.9rem; color: #1f4d66; }
        .quiz2-submitted { text-align: center; padding: 0.5rem; background: #d8eddf; border-radius: 60px; margin-bottom: 1rem; font-weight: 600; color: #1f8b4c; }
        .quiz2-search-badge { display: inline-block; background: #eaf1f8; color: #1f4d66; font-size: 0.65rem; font-weight: 600; padding: 0.1rem 0.6rem; border-radius: 30px; margin-left: 0.5rem; opacity: 0.6; }
        .quiz2-q-item:hover .quiz2-search-badge { opacity: 1; background: #d4e3f0; }
        .quiz2-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .quiz2-modal-overlay.active { display: flex; }
        .quiz2-modal-box { background: white; max-width: 440px; width: 90%; border-radius: 1.5rem; padding: 2rem 1.8rem 1.8rem; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.25); animation: modalIn 0.3s ease; }
        @keyframes modalIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .quiz2-modal-actions { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
        .quiz2-btn-secondary { background: #dce6ef; border: none; color: #1f4d66; font-weight: 600; font-size: 0.95rem; padding: 0.6rem 2rem; border-radius: 60px; cursor: pointer; transition: 0.15s; }
        .quiz2-btn-secondary:hover { background: #c8d4df; }
        .quiz2-refresh-spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 min-h-screen p-4 md:p-6">

    <div class="max-w-7xl mx-auto">
        
        <!-- Tabs: Quiz, Quiz2, Cards, Table -->
        <div class="tabs-wrapper">
            <div id="view-tabs" class="hidden tabs-only">
                <button id="btn-quiz" onclick="switchView('quiz')" class="px-5 py-2 text-sm font-medium rounded-lg tab-active transition-all flex items-center gap-2">
                    <i class="fas fa-question-circle"></i> Quiz
                </button>
                <button id="btn-quiz2" onclick="switchView('quiz2')" class="px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2">
                    <i class="fas fa-brain"></i> Quiz2
                </button>
                <button id="btn-cards" onclick="switchView('cards')" class="px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2">
                    <i class="fas fa-th-large"></i> Cards
                </button>
                <button id="btn-table" onclick="switchView('table')" class="px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2">
                    <i class="fas fa-list-ul"></i> Table
                </button>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="flex flex-col items-center justify-center py-24 bg-white/60 rounded-2xl backdrop-blur-sm border border-white/30">
            <div class="relative">
                <div class="animate-spin rounded-full h-14 w-14 border-4 border-indigo-200 border-t-indigo-600"></div>
            </div>
            <span class="mt-3 text-sm font-medium text-gray-500 animate-pulse">Loading...</span>
        </div>

        <!-- Error -->
        <div id="error" class="hidden bg-red-50/90 backdrop-blur-sm border-l-4 border-red-500 p-4 rounded-xl shadow-lg mb-6">
            <div class="flex items-start gap-3">
                <i class="fas fa-exclamation-circle text-red-500 text-lg mt-0.5"></i>
                <div>
                    <h4 class="font-semibold text-red-800">Failed to load</h4>
                    <p class="text-sm text-red-700 mt-1" id="error-message">Please check your connection.</p>
                    <button onclick="retryLoad()" class="mt-2 text-sm bg-red-100 hover:bg-red-200 text-red-700 px-4 py-1 rounded-lg transition flex items-center gap-2">
                        <i class="fas fa-redo"></i> Retry
                    </button>
                </div>
            </div>
        </div>

        <!-- Quiz View -->
        <div id="quiz-view">
            <div id="quiz-container" class="quiz-card">
                <!-- Quiz content injected here -->
            </div>
        </div>

        <!-- Quiz2 View -->
        <div id="quiz2-view" class="hidden">
            <div id="quiz2-container" class="quiz2-wrapper">
                <!-- Quiz2 content injected here -->
            </div>
        </div>

        <!-- Cards View -->
        <div id="cards-view" class="hidden grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">
            <!-- Cards injected here -->
        </div>

        <!-- Table View -->
        <div id="table-view" class="hidden bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl border border-white/50 overflow-hidden">
            <div class="overflow-x-auto p-2">
                <table class="min-w-full divide-y divide-gray-200/60">
                    <thead id="table-head" class="bg-gradient-to-r from-indigo-50 to-purple-50"></thead>
                    <tbody id="table-body" class="bg-white divide-y divide-gray-100"></tbody>
                </table>
            </div>
            <div class="bg-gray-50/50 px-5 py-2 text-xs text-gray-400 border-t border-gray-200/50 flex justify-between items-center">
                <span><i class="fas fa-mouse-pointer mr-1"></i> Click URLs · <i class="fas fa-search text-indigo-400 mx-1"></i> Search</span>
                <span id="table-count">0 rows</span>
            </div>
        </div>
    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQwqiqAHnqVpS5790H4PQl0gkl3UwaM1-AvSfHRAv8lIQTmWzl2q8OuV9z9Gk42cMCq_xbiKCyyCePQ/pub?output=csv";

        let sheetData = [];
        let sheetHeaders = [];
        let currentView = 'quiz';
        let quizIndex = 0;
        let quizQuestions = [];
        let quizAnswered = false;
        let quizScore = 0;
        let quizTotal = 0;

        // Quiz2 state
        let quiz2Questions = [];
        let quiz2Selected = [];
        let quiz2AnswerStatus = [];
        let quiz2IsSubmitted = false;
        let quiz2Completed = false;
        let quiz2Score = 0;
        let quiz2Timer = null;
        let quiz2TimeRemaining = 0;
        let quiz2Total = 0;

        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const errorMessageEl = document.getElementById('error-message');
        const viewTabsEl = document.getElementById('view-tabs');
        
        const quizViewEl = document.getElementById('quiz-view');
        const quiz2ViewEl = document.getElementById('quiz2-view');
        const cardsViewEl = document.getElementById('cards-view');
        const tableViewEl = document.getElementById('table-view');
        const quizContainerEl = document.getElementById('quiz-container');
        const quiz2ContainerEl = document.getElementById('quiz2-container');
        
        const btnQuiz = document.getElementById('btn-quiz');
        const btnQuiz2 = document.getElementById('btn-quiz2');
        const btnCards = document.getElementById('btn-cards');
        const btnTable = document.getElementById('btn-table');
        const tableHeadEl = document.getElementById('table-head');
        const tableBodyEl = document.getElementById('table-body');
        const tableCountEl = document.getElementById('table-count');

        const headingGradients = [
            'heading-gradient-1', 'heading-gradient-2', 'heading-gradient-3', 
            'heading-gradient-4', 'heading-gradient-5', 'heading-gradient-6',
            'heading-gradient-7', 'heading-gradient-8', 'heading-gradient-9', 
            'heading-gradient-10'
        ];

        function isURL(str) {
            if (!str || typeof str !== 'string') return false;
            const pattern = /^(https?:\/\/|www\.)[^\s]+$/i;
            return pattern.test(str.trim());
        }

        function getDomain(url) {
            try {
                const u = new URL(url.startsWith('http') ? url : 'https://' + url);
                return u.hostname.replace('www.', '');
            } catch { return url; }
        }

        function renderCellContent(value, header) {
            if (!value) return '';
            const trimmed = String(value).trim();
            
            if (isURL(trimmed)) {
                const displayUrl = trimmed.length > 35 ? trimmed.substring(0, 35) + '…' : trimmed;
                return `
                    <a href="${trimmed.startsWith('http') ? trimmed : 'https://' + trimmed}" 
                       target="_blank" 
                       class="url-link inline-flex items-center gap-1 group"
                       title="Open: ${trimmed}">
                        <i class="fas fa-external-link-alt text-[10px] text-indigo-400"></i>
                        ${displayUrl}
                    </a>
                `;
            }
            
            const isSearchable = trimmed.length > 2 && !/^[\d\s,.]+$/.test(trimmed);
            if (isSearchable) {
                return `
                    <span class="flex items-center gap-1.5">
                        <span>${value}</span>
                        <button onclick="searchGoogle('${encodeURIComponent(trimmed)}')" 
                                class="search-btn text-gray-400 hover:text-indigo-600 text-xs w-5 h-5 rounded-full hover:bg-indigo-50 flex items-center justify-center transition-all">
                            <i class="fas fa-search text-[9px]"></i>
                        </button>
                    </span>
                `;
            }
            return `<span>${value}</span>`;
        }

        function searchGoogle(query) {
            window.open('https://www.google.com/search?q=' + query, '_blank');
        }
        window.searchGoogle = searchGoogle;

        function loadData() {
            loadingEl.style.display = 'flex';
            errorEl.classList.add('hidden');
            
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    loadingEl.style.display = 'none';

                    if (results.errors.length > 0) {
                        showError("Error parsing the CSV data.");
                        return;
                    }

                    sheetData = results.data;
                    if (sheetData.length === 0) {
                        showError("The spreadsheet is empty.");
                        return;
                    }

                    sheetHeaders = Object.keys(sheetData[0]).filter(h => h && h.trim() !== '');

                    tableCountEl.textContent = sheetData.length + ' rows';

                    buildQuizQuestions();
                    buildQuiz2Questions();
                    renderTable();
                    renderCards();

                    viewTabsEl.classList.remove('hidden');
                    switchView('quiz');
                },
                error: function(err) {
                    loadingEl.style.display = 'none';
                    showError("Failed to fetch Google Sheet.");
                    console.error(err);
                }
            });
        }

        function buildQuizQuestions() {
            quizQuestions = [];
            const wordCol = findColumn('word');
            const option1Col = findColumn('option1');
            const option2Col = findColumn('option2');
            const option3Col = findColumn('option3');
            const option4Col = findColumn('option4');
            const answerCol = findColumn('answer');
            
            if (!wordCol || !option1Col || !answerCol) {
                console.warn('Quiz columns not found.');
                return;
            }

            sheetData.forEach(row => {
                const word = row[wordCol] || '';
                const options = [
                    row[option1Col] || '',
                    row[option2Col] || '',
                    row[option3Col] || '',
                    row[option4Col] || ''
                ].filter(o => o.trim() !== '');
                
                const answer = row[answerCol] || '';
                const synonym = row[findColumn('synonym')] || '';
                const antonym = row[findColumn('antonym')] || '';
                const urdu = row[findColumn('urdu meaning')] || '';
                const sentence = row[findColumn('sentence usage')] || '';
                const refLink = row[findColumn('ref link')] || '';

                if (word && options.length > 0 && answer) {
                    quizQuestions.push({
                        word: word,
                        options: options,
                        answer: answer,
                        synonym: synonym,
                        antonym: antonym,
                        urdu: urdu,
                        sentence: sentence,
                        refLink: refLink
                    });
                }
            });
        }

        function buildQuiz2Questions() {
            quiz2Questions = [];
            // Try to find columns for Quiz2 format
            const qCol = findColumn('question') || findColumn('word');
            const opt1Col = findColumn('option1');
            const opt2Col = findColumn('option2');
            const opt3Col = findColumn('option3');
            const opt4Col = findColumn('option4');
            const ansCol = findColumn('answer');
            
            if (!qCol || !opt1Col || !ansCol) {
                console.warn('Quiz2 columns not found.');
                return;
            }

            sheetData.forEach(row => {
                const q = row[qCol] || '';
                const options = [
                    row[opt1Col] || '',
                    row[opt2Col] || '',
                    row[opt3Col] || '',
                    row[opt4Col] || ''
                ].filter(o => o.trim() !== '');
                const answer = row[ansCol] || '';
                let correctIdx = -1;
                if (answer) {
                    for (let j = 0; j < options.length; j++) {
                        if (options[j] === answer) { correctIdx = j; break; }
                    }
                }
                if (q && options.length > 0) {
                    quiz2Questions.push({
                        question: q,
                        options: options,
                        correct: correctIdx,
                        correctText: answer
                    });
                }
            });
            quiz2Total = quiz2Questions.length;
            quiz2Selected = new Array(quiz2Total).fill(null);
            quiz2AnswerStatus = new Array(quiz2Total).fill(null);
            quiz2TimeRemaining = quiz2Total * 60;
        }

        function findColumn(keyword) {
            const lowerKeyword = keyword.toLowerCase();
            for (let h of sheetHeaders) {
                if (h.toLowerCase().includes(lowerKeyword)) {
                    return h;
                }
            }
            return null;
        }

        function retryLoad() { loadData(); }
        window.retryLoad = retryLoad;

        function showError(msg) {
            errorEl.classList.remove('hidden');
            errorMessageEl.textContent = msg;
        }

        function switchView(view) {
            currentView = view;
            
            if (view === 'quiz') {
                quizIndex = 0;
                quizScore = 0;
                quizTotal = quizQuestions.length;
                quizAnswered = false;
                renderQuiz();
            } else if (view === 'quiz2') {
                renderQuiz2();
            }
            
            // Hide all views
            quizViewEl.classList.add('hidden');
            quiz2ViewEl.classList.add('hidden');

            if (view === 'quiz') {
                quizViewEl.classList.remove('hidden');
                btnQuiz.className = "px-5 py-2 text-sm font-medium rounded-lg tab-active transition-all flex items-center gap-2";
                btnQuiz2.className = "px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";
                btnCards.className = "px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";

                btnQuiz.className = "px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";
                btnCards.className = "px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";
                btnTable.className = "px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";
            } else if (view === 'cards') {
                cardsViewEl.classList.remove('hidden');
                btnCards.className = "px-5 py-2 text-sm font-medium rounded-lg tab-active transition-all flex items-center gap-2";
                btnQuiz.className = "px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";
                btnQuiz2.className = "px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";
                btnTable.className = "px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";
            } else {
                tableViewEl.classList.remove('hidden');
                btnTable.className = "px-5 py-2 text-sm font-medium rounded-lg tab-active transition-all flex items-center gap-2";
                btnQuiz.className = "px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";
                btnQuiz2.className = "px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";
                btnCards.className = "px-5 py-2 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";
            }
        }
        window.switchView = switchView;

        function renderTable() {
            if (sheetHeaders.length === 0) return;
            
            let headerHtml = '<tr>';
            sheetHeaders.forEach(header => {
                headerHtml += `<th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">${header}</th>`;
            });
            headerHtml += '</tr>';
            tableHeadEl.innerHTML = headerHtml;

            let bodyHtml = '';
            sheetData.forEach((row, index) => {
                const rowBg = index % 2 === 0 ? 'bg-white' : 'bg-gray-50/60';
                bodyHtml += `<tr class="${rowBg} hover:bg-indigo-50/50 transition-colors">`;
                sheetHeaders.forEach(header => {
                    const cellValue = row[header] !== undefined && row[header] !== null ? row[header] : '';
                    bodyHtml += `<td class="px-4 py-3 text-sm text-gray-700">${renderCellContent(cellValue, header)}</td>`;
                });
                bodyHtml += `</tr>`;

        }

        function renderCards() {
            if (sheetHeaders.length === 0) return;
            
            let cardsHtml = '';
            const colA = sheetHeaders[0] || 'Item';
            const colB = sheetHeaders.length > 1 ? sheetHeaders[1] : sheetHeaders[0];
            
            sheetData.forEach((row, index) => {
                const valueA = row[colA] !== undefined && row[colA] !== null ? row[colA] : '';
                const valueB = row[colB] !== undefined && row[colB] !== null ? row[colB] : '';
                const headingText = `${valueA} ${valueB}`.trim() || 'Untitled';
                const gradientClass = headingGradients[index % headingGradients.length];

                cardsHtml += `
                    <div class="bg-white rounded-xl shadow-md border border-gray-200/60 card-hover overflow-hidden compact-card">
                        <div class="${gradientClass} card-heading px-4 py-2.5 border-b border-white/20 flex items-center justify-between">
                            <h3 class="text-base font-bold text-white flex items-center gap-1.5 truncate">
                                <i class="fas fa-tag text-white/60 text-[11px]"></i>
                                <span class="truncate">${headingText}</span>
                            </h3>
                            <button onclick="searchGoogle('${encodeURIComponent(headingText)}')" 
                                    class="text-white/60 hover:text-white text-xs w-7 h-7 rounded-full hover:bg-white/20 flex items-center justify-center transition-all flex-shrink-0">
                                <i class="fas fa-search text-[11px]"></i>
                            </button>
                        </div>
                        
                        <div class="card-body px-4 py-2.5 space-y-0">
                `;

                for (let i = 0; i < sheetHeaders.length; i++) {

                        const isUrl = isURL(String(val).trim());
                        let displayVal = val;
                        
                        if (isUrl) {
                            const domain = getDomain(val);
                            displayVal = `<a href="${val.startsWith('http') ? val : 'https://' + val}" target="_blank" class="url-link text-sm inline-flex items-center gap-1">
                                <i class="fas fa-external-link-alt text-[9px]"></i> ${domain}
                            </a>`;
                        } else {
                            const searchable = String(val).length > 2 && !/^[\d\s,.]+$/.test(String(val));
                            if (searchable) {
                                displayVal = `
                                    <span class="flex items-center gap-1.5 flex-wrap">
                                        <span class="text-sm">${val}</span>
                                        <button onclick="searchGoogle('${encodeURIComponent(String(val).trim())}')" 
                                                class="text-gray-400 hover:text-indigo-500 text-[11px] transition-all">

                                        </button>

                        cardsHtml += `
                            <div class="field-row flex justify-between items-center gap-2 py-1.5">

                                    ${header}

                                <span class="field-value text-gray-700 text-right break-all max-w-[60%]">${displayVal}</span>
                            </div>
                        `;
                    }
                }

                cardsHtml += `
                        </div>
                    </div>
                `;
            });
            cardsViewEl.innerHTML = cardsHtml;
        }

        // ============ QUIZ 1 FUNCTIONS ============
        function renderQuiz() {
            if (quizQuestions.length === 0) {
                quizContainerEl.innerHTML = `
                    <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl border border-white/50 p-8 text-center">
                        <i class="fas fa-book-open text-4xl text-gray-300 mb-4"></i>
                        <h3 class="text-lg font-semibold text-gray-700">No Quiz Questions Found</h3>
                        <p class="text-sm text-gray-500 mt-2">Make sure your sheet has columns: word, option1-4, answer</p>
                    </div>
                `;
                return;
            }

            if (quizIndex >= quizQuestions.length) {
                showQuizResults();
                return;
            }

            const q = quizQuestions[quizIndex];
            const progress = ((quizIndex) / quizQuestions.length) * 100;
            
            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                optionsHtml += `
                    <button onclick="selectQuizOption(${idx})" 
                            id="quiz-opt-${idx}"
                            class="quiz-option w-full text-left px-4 py-3 rounded-lg bg-white border border-gray-200 hover:bg-gray-50 transition-all flex items-center gap-3">
                        <span class="w-6 h-6 rounded-full bg-gray-100 text-gray-600 text-xs font-bold flex items-center justify-center flex-shrink-0">${String.fromCharCode(65 + idx)}</span>
                        <span class="text-sm text-gray-700">${opt}</span>
                    </button>
                `;
            });

            const refLink = q.refLink && q.refLink.trim() !== '' ? q.refLink : '';
            const refHtml = refLink ? `
                <div class="mt-3 text-xs text-gray-400 flex items-center gap-2">
                    <i class="fas fa-link"></i>
                    <a href="${refLink.startsWith('http') ? refLink : 'https://' + refLink}" target="_blank" class="url-link">Reference</a>
                </div>
            ` : '';

            quizContainerEl.innerHTML = `
                <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl border border-white/50 p-6 md:p-8">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-sm font-medium text-gray-500">Question ${quizIndex + 1} of ${quizQuestions.length}</span>
                        <span class="text-sm font-medium text-indigo-600">Score: ${quizScore}</span>
                    </div>
                    <div class="quiz-progress mb-6">
                        <div class="quiz-progress-bar" style="width: ${progress}%"></div>
                    </div>
                    
                    <div class="mb-6">
                        <h2 class="text-2xl font-bold text-gray-800">${q.word}</h2>
                        ${q.urdu ? `<p class="text-sm text-gray-500 mt-1">${q.urdu}</p>` : ''}
                    </div>
                    
                    <div class="space-y-2.5" id="quiz-options">
                        ${optionsHtml}
                    </div>
                    
                    <div id="quiz-details" class="mt-4 hidden">
                        <div class="bg-gray-50 rounded-lg p-4 space-y-2 text-sm">
                            ${q.synonym ? `<div><span class="font-medium text-gray-500">Synonym:</span> <span class="text-gray-700">${q.synonym}</span></div>` : ''}
                            ${q.antonym ? `<div><span class="font-medium text-gray-500">Antonym:</span> <span class="text-gray-700">${q.antonym}</span></div>` : ''}
                            ${q.sentence ? `<div><span class="font-medium text-gray-500">Example:</span> <span class="text-gray-700">"${q.sentence}"</span></div>` : ''}
                            ${refHtml}
                        </div>
                        <button onclick="nextQuizQuestion()" 
                                class="mt-4 w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-all flex items-center justify-center gap-2">
                            <i class="fas fa-arrow-right"></i> Next Question
                        </button>
                    </div>
                </div>
            `;
            
            quizAnswered = false;
        }

        function selectQuizOption(idx) {
            if (quizAnswered) return;
            
            const q = quizQuestions[quizIndex];
            const selected = q.options[idx];
            const isCorrect = selected === q.answer;
            
            if (isCorrect) quizScore++;
            
            const allOpts = document.querySelectorAll('.quiz-option');
            allOpts.forEach((el, i) => {
                const opt = q.options[i];
                if (opt === q.answer) {
                    el.classList.add('show-correct');
                }
                if (i === idx && !isCorrect) {
                    el.classList.add('wrong');
                }
                if (i === idx && isCorrect) {
                    el.classList.add('correct');
                }
                el.style.cursor = 'default';
                el.onclick = null;
            });
            
            quizAnswered = true;
            document.getElementById('quiz-details').classList.remove('hidden');
            document.getElementById('quiz-details').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function nextQuizQuestion() {
            quizIndex++;
            renderQuiz();
        }

        function showQuizResults() {
            const total = quizQuestions.length;
            const pct = Math.round((quizScore / total) * 100);
            let emoji = '😢';
            let color = 'text-red-600';
            if (pct >= 90) { emoji = '🎉'; color = 'text-green-600'; }
            else if (pct >= 70) { emoji = '😊'; color = 'text-blue-600'; }
            else if (pct >= 50) { emoji = '🤔'; color = 'text-yellow-600'; }
            
            quizContainerEl.innerHTML = `
                <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl border border-white/50 p-8 text-center max-w-lg mx-auto">
                    <div class="text-5xl mb-4">${emoji}</div>
                    <h2 class="text-2xl font-bold text-gray-800">Quiz Complete!</h2>
                    <div class="mt-4">
                        <span class="text-4xl font-extrabold ${color}">${quizScore}</span>
                        <span class="text-xl text-gray-400"> / ${total}</span>
                    </div>
                    <p class="text-sm text-gray-500 mt-2">${pct}% correct</p>
                    
                    <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
                        <button onclick="resetQuiz()" 
                                class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-all flex items-center justify-center gap-2">
                            <i class="fas fa-redo"></i> Restart Quiz
                        </button>
                        <button onclick="switchView('cards')" 
                                class="px-6 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium rounded-lg transition-all flex items-center justify-center gap-2">
                            <i class="fas fa-th-large"></i> View Cards
                        </button>
                    </div>
                </div>
            `;
        }

        function resetQuiz() {
            quizIndex = 0;
            quizScore = 0;
            renderQuiz();
        }
        window.resetQuiz = resetQuiz;
        window.selectQuizOption = selectQuizOption;
        window.nextQuizQuestion = nextQuizQuestion;

        // ============ QUIZ 2 FUNCTIONS ============
        function renderQuiz2() {
            if (quiz2Questions.length === 0) {
                quiz2ContainerEl.innerHTML = `
                    <div class="bg-white/80 rounded-2xl p-8 text-center">
                        <i class="fas fa-book-open text-4xl text-gray-300 mb-4"></i>
                        <h3 class="text-lg font-semibold text-gray-700">No Quiz2 Questions Found</h3>
                        <p class="text-sm text-gray-500 mt-2">Make sure your sheet has columns: question, option1-4, answer</p>
                    </div>
                `;
                return;
            }

            if (quiz2Completed) {
                showQuiz2Results();
                return;
            }

            const total = quiz2Questions.length;
            const attempted = quiz2Selected.filter(a => a !== null).length;
            const progress = (attempted / total) * 100;

            let questionsHtml = '';
            const letters = ['A', 'B', 'C', 'D'];
            
            quiz2Questions.forEach((q, idx) => {
                const isCorrect = quiz2AnswerStatus[idx] === true;
                const isWrong = quiz2AnswerStatus[idx] === false;
                let itemClass = 'quiz2-q-item';
                if (quiz2IsSubmitted || quiz2Completed) {
                    if (isCorrect) itemClass += ' correct-item';
                    else if (isWrong) itemClass += ' wrong-item';
                }

                questionsHtml += `
                    <div class="${itemClass}" data-qidx="${idx}" onclick="searchQuiz2Question(${idx})">
                        <div class="quiz2-q-text">
                            ${idx+1}. ${q.question}
                            <span class="quiz2-search-badge">🔍 search</span>
                        </div>
                        <div class="quiz2-options">
                `;

                q.options.forEach((opt, optIdx) => {
                    let btnClass = 'quiz2-option';
                    if (quiz2Selected[idx] === optIdx) btnClass += ' selected-opt';
                    if (quiz2IsSubmitted || quiz2Completed) {
                        if (q.correct === optIdx) btnClass += ' correct';
                        else if (quiz2Selected[idx] === optIdx && quiz2Selected[idx] !== q.correct) btnClass += ' wrong';
                        btnClass += ' disabled';
                    }
                    const disabled = (quiz2IsSubmitted || quiz2Completed) ? 'disabled' : '';

                    questionsHtml += `
                        <button class="${btnClass}" ${disabled} onclick="event.stopPropagation(); selectQuiz2Option(${idx}, ${optIdx})">
                            <span class="letter">${letters[optIdx]}</span> ${opt || '(Empty)'}
                        </button>
                    `;
                });

                questionsHtml += `</div></div>`;
            });

            const mins = Math.floor(quiz2TimeRemaining / 60);
            const secs = quiz2TimeRemaining % 60;

            quiz2ContainerEl.innerHTML = `
                <div class="quiz2-brand">
                    <div>
                        <h1>Self Learners · Quiz</h1>
                        <span class="subtitle">Self Learners</span>
                    </div>
                </div>
                <div class="quiz2-timer">⏱️ <span class="timer">${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</span></div>
                <div class="quiz2-progress-block">
                    <div class="quiz2-progress-fill" style="width:${progress}%"></div>
                </div>
                <div class="quiz2-progress-label">Attempted: <span class="attempted">${attempted}</span> / <span class="total">${total}</span></div>
                
                ${quiz2IsSubmitted ? '<div class="quiz2-submitted">✅ Submitted — You can review your answers below. Click "End Quiz" to see your final score.</div>' : ''}
                
                <div id="quiz2-questions-container">${questionsHtml}</div>
                
                <div class="quiz2-action-bar">
                    <button class="quiz2-btn-primary" id="quiz2-submit-btn" ${quiz2IsSubmitted || quiz2Completed ? 'disabled' : ''}>
                        ✅ Submit
                    </button>
                    <button class="quiz2-btn-success" id="quiz2-end-btn" ${quiz2Completed ? 'disabled' : ''}>
                        🏁 End Quiz
                    </button>
                </div>
                
                <div class="quiz2-overview">
                    <div class="quiz2-overview-header">
                        <span>OVERVIEW</span>
                        <div class="quiz2-legend">
                            <span class="quiz2-legend-item"><span class="quiz2-legend-dot done-dot"></span> Done <span class="count" id="quiz2-done-count">${attempted}</span></span>
                            <span class="quiz2-legend-item"><span class="quiz2-legend-dot pending-dot"></span> Pending <span class="count" id="quiz2-pending-count">${total - attempted}</span></span>
                            ${quiz2IsSubmitted || quiz2Completed ? `
                                <span class="quiz2-legend-item"><span class="quiz2-legend-dot correct-dot"></span> Correct <span class="count" id="quiz2-correct-count">${quiz2AnswerStatus.filter(s => s === true).length}</span></span>
                                <span class="quiz2-legend-item"><span class="quiz2-legend-dot wrong-dot"></span> Wrong <span class="count" id="quiz2-wrong-count">${quiz2AnswerStatus.filter(s => s === false).length}</span></span>
                            ` : ''}
                        </div>
                    </div>
                    <div class="quiz2-dot-grid" id="quiz2-dot-grid"></div>
                </div>
                
                <div class="quiz2-result" id="quiz2-result-area">
                    <h2>🏁 Quiz Complete</h2>
                    <div class="quiz2-result-score" id="quiz2-final-score">0 / 0</div>
                    <p class="result-msg" id="quiz2-result-msg">Keep learning!</p>
                    <div class="quiz2-result-details" id="quiz2-result-details"></div>
                    <button class="quiz2-btn-primary" onclick="restartQuiz2()">⟳ Try again</button>
                </div>
            `;

            renderQuiz2Dots();

            document.getElementById('quiz2-submit-btn').addEventListener('click', handleQuiz2Submit);
            document.getElementById('quiz2-end-btn').addEventListener('click', handleQuiz2End);

            if (!quiz2IsSubmitted && !quiz2Completed) {
                if (quiz2Timer) clearInterval(quiz2Timer);
                quiz2Timer = setInterval(() => {
                    quiz2TimeRemaining--;
                    if (quiz2TimeRemaining <= 0) {
                        clearInterval(quiz2Timer);
                        quiz2Timer = null;
                        handleQuiz2Timeout();
                    }
                    renderQuiz2Timer();
                }, 1000);
            }
        }

        function renderQuiz2Timer() {
            const mins = Math.floor(quiz2TimeRemaining / 60);
            const secs = quiz2TimeRemaining % 60;
            const timerEl = quiz2ContainerEl.querySelector('.quiz2-timer .timer');
            if (timerEl) {
                timerEl.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            }
        }

        function renderQuiz2Dots() {
            const grid = document.getElementById('quiz2-dot-grid');
            if (!grid) return;
            grid.innerHTML = '';
            quiz2Questions.forEach((q, idx) => {
                const dot = document.createElement('button');
                dot.className = 'quiz2-dot';
                dot.textContent = idx + 1;
                const hasAnswer = quiz2Selected[idx] !== null;
                if (quiz2IsSubmitted || quiz2Completed) {
                    if (quiz2AnswerStatus[idx] === true) dot.classList.add('correct-dot');
                    else if (quiz2AnswerStatus[idx] === false) dot.classList.add('wrong-dot');
                } else {
                    if (hasAnswer) dot.classList.add('done-dot');
                }
                dot.addEventListener('click', () => {
                    const el = document.querySelector(`.quiz2-q-item[data-qidx="${idx}"]`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });
                grid.appendChild(dot);
            });
        }

        function selectQuiz2Option(qIdx, optIdx) {
            if (quiz2IsSubmitted || quiz2Completed) return;
            quiz2Selected[qIdx] = optIdx;
            renderQuiz2();
        }

        function searchQuiz2Question(idx) {
            const q = quiz2Questions[idx];
            if (q) {
                window.open(`https://www.google.com/search?q=${encodeURIComponent(q.question)}`, '_blank');
            }
        }
        window.searchQuiz2Question = searchQuiz2Question;

        function handleQuiz2Submit() {
            if (quiz2IsSubmitted || quiz2Completed) return;
            quiz2IsSubmitted = true;
            gradeQuiz2();
            renderQuiz2();
        }

        function handleQuiz2End() {
            if (quiz2Completed) return;
            if (!quiz2IsSubmitted) {
                quiz2IsSubmitted = true;
                gradeQuiz2();
            }
            quiz2Completed = true;
            if (quiz2Timer) { clearInterval(quiz2Timer); quiz2Timer = null; }
            showQuiz2Results();
        }

        function handleQuiz2Timeout() {
            quiz2IsSubmitted = true;
            quiz2Completed = true;
            gradeQuiz2();
            renderQuiz2();
            setTimeout(showQuiz2Results, 600);
        }

        function gradeQuiz2() {
            let correct = 0;
            quiz2Questions.forEach((q, idx) => {
                const selected = quiz2Selected[idx];
                if (selected !== null && selected === q.correct) {
                    quiz2AnswerStatus[idx] = true;
                    correct++;
                } else if (selected !== null && selected !== q.correct) {
                    quiz2AnswerStatus[idx] = false;
                } else {
                    quiz2AnswerStatus[idx] = null;
                }
            });
            quiz2Score = correct;
        }

        function showQuiz2Results() {
            const total = quiz2Questions.length;
            const pct = Math.round((quiz2Score / total) * 100);
            let emoji = '😢';
            let color = '#b33c3c';
            if (pct >= 90) { emoji = '🎉'; color = '#1f8b4c'; }
            else if (pct >= 70) { emoji = '😊'; color = '#2f7b9e'; }
            else if (pct >= 50) { emoji = '🤔'; color = '#856404'; }

            const resultArea = document.getElementById('quiz2-result-area');
            const finalScore = document.getElementById('quiz2-final-score');
            const resultMsg = document.getElementById('quiz2-result-msg');
            const resultDetails = document.getElementById('quiz2-result-details');

            resultArea.style.display = 'block';
            finalScore.textContent = `${quiz2Score} / ${total}`;
            resultMsg.textContent = `${emoji} ${pct}% correct — ${getQuiz2Message(pct)}`;

            resultDetails.innerHTML = '';
            quiz2Questions.forEach((q, idx) => {
                const div = document.createElement('div');
                div.className = 'quiz2-result-detail';
                const isCorrect = quiz2AnswerStatus[idx] === true;
                const isWrong = quiz2AnswerStatus[idx] === false;
                if (isCorrect) div.classList.add('correct-detail');
                else if (isWrong) div.classList.add('wrong-detail');
                else div.style.borderLeft = '6px solid #999';

                const userAns = (quiz2Selected[idx] !== null && q.options[quiz2Selected[idx]]) ? q.options[quiz2Selected[idx]] : 'Not answered';
                const correctAns = (q.correct !== -1 && q.options[q.correct]) ? q.options[q.correct] : 'Not available';

                div.innerHTML = `
                    <div class="detail-q">${idx+1}. ${q.question}</div>
                    <div class="detail-answer">
                        ${isCorrect ? `✅ Your answer: <span style="color:#1f8b4c;font-weight:600;">${userAns}</span>` :
                          isWrong ? `❌ Your answer: <span style="color:#b33c3c;font-weight:600;">${userAns}</span> &nbsp; Correct: <span style="color:#1f8b4c;font-weight:600;">${correctAns}</span>` :
                          `⏭️ Skipped &nbsp; Correct: <span style="color:#1f8b4c;font-weight:600;">${correctAns}</span>`}
                    </div>
                `;
                resultDetails.appendChild(div);
            });

            document.getElementById('quiz2-submit-btn').disabled = true;
            document.getElementById('quiz2-end-btn').disabled = true;
        }

        function getQuiz2Message(pct) {
            if (pct >= 90) return 'Perfect! You are a true Self Learner.';
            if (pct >= 70) return 'Great job! Keep growing every day.';
            if (pct >= 40) return 'Good effort! Review and try again.';
            return 'Learning is a journey. Keep practicing!';
        }

        function restartQuiz2() {
            quiz2Selected = new Array(quiz2Total).fill(null);
            quiz2AnswerStatus = new Array(quiz2Total).fill(null);
            quiz2IsSubmitted = false;
            quiz2Completed = false;
            quiz2Score = 0;
            quiz2TimeRemaining = quiz2Total * 60;
            if (quiz2Timer) { clearInterval(quiz2Timer); quiz2Timer = null; }
            renderQuiz2();
        }
        window.restartQuiz2 = restartQuiz2;

        loadData();
    </script>
</body>
</html>
