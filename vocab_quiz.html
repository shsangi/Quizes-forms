<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets Data Viewer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for easy CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-p-6">

    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-900">Spreadsheet Data</h1>
            <p class="text-sm text-gray-500 mt-1">Data is fetched live from your Google Sheet.</p>
        </div>

        <!-- Loading State -->
        <div id="loading" class="flex justify-center items-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
            <span class="ml-3 text-lg font-medium text-gray-600">Loading data...</span>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden bg-red-50 border-l-4 border-red-400 p-4 mb-6 rounded-md">
            <div class="flex">
                <div class="ml-3">
                    <p class="text-sm text-red-700" id="error-message">Failed to load data. Please check your network or spreadsheet link.</p>
                </div>
            </div>
        </div>

        <!-- Table Container -->
        <div id="table-container" class="hidden bg-white shadow-md rounded-lg overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table id="data-table" class="min-w-full divide-y divide-gray-200">
                    <thead id="table-head" class="bg-gray-100">
                        <!-- Table headers will be injected here -->
                    </thead>
                    <tbody id="table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Table rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script to Fetch and Render CSV -->
    <script>
        // Your Google Sheet CSV URL
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQwqiqAHnqVpS5790H4PQl0gkl3UwaM1-AvSfHRAv8lIQTmWzl2q8OuV9z9Gk42cMCq_xbiKCyyCePQ/pub?output=csv";

        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const errorMessageEl = document.getElementById('error-message');
        const tableContainerEl = document.getElementById('table-container');
        const tableHeadEl = document.getElementById('table-head');
        const tableBodyEl = document.getElementById('table-body');

        // Fetch and parse CSV using PapaParse
        Papa.parse(csvUrl, {
            download: true,
            header: true, // Set to true if the first row of your sheet contains column headers
            skipEmptyLines: true,
            complete: function(results) {
                loadingEl.style.display = 'none';

                if (results.errors.length > 0) {
                    console.error(results.errors);
                    errorEl.classList.remove('hidden');
                    errorMessageEl.textContent = "Error parsing the CSV data.";
                    return;
                }

                const data = results.data;

                if (data.length === 0) {
                    errorEl.classList.remove('hidden');
                    errorMessageEl.textContent = "The spreadsheet is empty.";
                    return;
                }

                // Generate Table Headers
                const headers = Object.keys(data[0]);
                let headerHtml = '<tr>';
                headers.forEach(header => {
                    headerHtml += `<th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">${header}</th>`;
                });
                headerHtml += '</tr>';
                tableHeadEl.innerHTML = headerHtml;

                // Generate Table Rows
                let bodyHtml = '';
                data.forEach((row, index) => {
                    const rowBg = index % 2 === 0 ? 'bg-white' : 'bg-gray-50'; // Zebra striping
                    bodyHtml += `<tr class="${rowBg} hover:bg-indigo-50 transition-colors">`;
                    headers.forEach(header => {
                        const cellValue = row[header] !== undefined ? row[header] : '';
                        bodyHtml += `<td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${cellValue}</td>`;
                    });
                    bodyHtml += `</tr>`;
                });
                tableBodyEl.innerHTML = bodyHtml;

                // Show Table
                tableContainerEl.classList.remove('hidden');
            },
            error: function(err) {
                loadingEl.style.display = 'none';
                errorEl.classList.remove('hidden');
                errorMessageEl.textContent = "Failed to fetch Google Sheet. Make sure the sheet is published to the web as a CSV.";
                console.error(err);
            }
        });
    </script>
</body>
</html>
