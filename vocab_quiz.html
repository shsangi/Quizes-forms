<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Smart Spreadsheet Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); }
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15); }
        .url-link { color: #2563eb; text-decoration: none; border-bottom: 1px dashed #93c5fd; transition: all 0.2s; }
        .url-link:hover { color: #1d4ed8; border-bottom-color: #2563eb; background: #eff6ff; padding: 0 4px; border-radius: 4px; }
        .search-btn { transition: all 0.2s; }
        .search-btn:hover { transform: scale(1.1); background: #e0e7ff; }
        .badge-pulse { animation: pulse-badge 2s infinite; }
        @keyframes pulse-badge {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .tab-active { background: white; color: #4f46e5; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15); }
        .tab-inactive { color: #6b7280; }
        .tab-inactive:hover { background: rgba(255,255,255,0.5); color: #1f2937; }
        .cell-highlight { transition: background 0.2s; }
        .cell-highlight:hover { background: #dbeafe !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a78bfa; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="glass-card rounded-2xl shadow-xl border border-white/50 p-6 md:p-8 mb-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <div class="flex items-center gap-3">
                        <div class="gradient-bg w-12 h-12 rounded-xl flex items-center justify-center shadow-lg">
                            <i class="fas fa-table text-white text-xl"></i>
                        </div>
                        <div>
                            <h1 class="text-3xl font-extrabold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                                Data Dashboard
                            </h1>
                            <p class="text-sm text-gray-500 mt-0.5 flex items-center gap-2">
                                <i class="fas fa-sync-alt text-xs text-green-500 badge-pulse"></i>
                                Live from Google Sheets
                            </p>
                        </div>
                    </div>
                </div>
                
                <div id="view-tabs" class="hidden bg-white/70 backdrop-blur-sm p-1 rounded-xl shadow-sm border border-gray-200/50">
                    <button id="btn-table" onclick="switchView('table')" class="px-5 py-2.5 text-sm font-medium rounded-lg tab-active transition-all flex items-center gap-2">
                        <i class="fas fa-list-ul"></i> Table
                    </button>
                    <button id="btn-cards" onclick="switchView('cards')" class="px-5 py-2.5 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2">
                        <i class="fas fa-th-large"></i> Cards
                    </button>
                </div>
            </div>
            
            <!-- Stats Bar -->
            <div id="stats-bar" class="hidden mt-6 flex flex-wrap gap-4 pt-4 border-t border-gray-200/50">
                <div class="flex items-center gap-2 text-sm text-gray-600">
                    <i class="fas fa-database text-indigo-400"></i>
                    <span id="row-count">0</span> rows
                </div>
                <div class="flex items-center gap-2 text-sm text-gray-600">
                    <i class="fas fa-columns text-indigo-400"></i>
                    <span id="col-count">0</span> columns
                </div>
                <div class="flex items-center gap-2 text-sm text-gray-600">
                    <i class="fas fa-clock text-indigo-400"></i>
                    <span id="update-time">Just now</span>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="flex flex-col items-center justify-center py-32 bg-white/60 rounded-2xl backdrop-blur-sm border border-white/30">
            <div class="relative">
                <div class="animate-spin rounded-full h-16 w-16 border-4 border-indigo-200 border-t-indigo-600"></div>
                <i class="fas fa-spinner absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-indigo-400 text-sm"></i>
            </div>
            <span class="mt-4 text-sm font-medium text-gray-500 animate-pulse">Loading your data...</span>
        </div>

        <!-- Error -->
        <div id="error" class="hidden bg-red-50/90 backdrop-blur-sm border-l-4 border-red-500 p-5 rounded-xl shadow-lg mb-6">
            <div class="flex items-start gap-3">
                <i class="fas fa-exclamation-circle text-red-500 text-xl mt-0.5"></i>
                <div>
                    <h4 class="font-semibold text-red-800">Failed to load data</h4>
                    <p class="text-sm text-red-700 mt-1" id="error-message">Please check your connection and try again.</p>
                    <button onclick="retryLoad()" class="mt-3 text-sm bg-red-100 hover:bg-red-200 text-red-700 px-4 py-1.5 rounded-lg transition flex items-center gap-2">
                        <i class="fas fa-redo"></i> Retry
                    </button>
                </div>
            </div>
        </div>

        <!-- Table View -->
        <div id="table-view" class="hidden bg-white/80 backdrop-blur-sm rounded-2xl shadow-xl border border-white/50 overflow-hidden">
            <div class="overflow-x-auto p-2">
                <table class="min-w-full divide-y divide-gray-200/60">
                    <thead id="table-head" class="bg-gradient-to-r from-indigo-50 to-purple-50"></thead>
                    <tbody id="table-body" class="bg-white divide-y divide-gray-100"></tbody>
                </table>
            </div>
            <div class="bg-gray-50/50 px-6 py-3 text-xs text-gray-400 border-t border-gray-200/50 flex justify-between items-center">
                <span><i class="fas fa-mouse-pointer mr-1"></i> Click URLs to open · Click <i class="fas fa-search text-indigo-400 mx-1"></i> to search</span>
                <span id="table-count">0 rows</span>
            </div>
        </div>

        <!-- Cards View -->
        <div id="cards-view" class="hidden grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
            <!-- Cards injected here -->
        </div>
    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQwqiqAHnqVpS5790H4PQl0gkl3UwaM1-AvSfHRAv8lIQTmWzl2q8OuV9z9Gk42cMCq_xbiKCyyCePQ/pub?output=csv";

        let sheetData = [];
        let sheetHeaders = [];
        let currentView = 'table';

        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const errorMessageEl = document.getElementById('error-message');
        const viewTabsEl = document.getElementById('view-tabs');
        const statsBarEl = document.getElementById('stats-bar');
        
        const tableViewEl = document.getElementById('table-view');
        const cardsViewEl = document.getElementById('cards-view');
        
        const btnTable = document.getElementById('btn-table');
        const btnCards = document.getElementById('btn-cards');
        const tableHeadEl = document.getElementById('table-head');
        const tableBodyEl = document.getElementById('table-body');
        const rowCountEl = document.getElementById('row-count');
        const colCountEl = document.getElementById('col-count');
        const updateTimeEl = document.getElementById('update-time');
        const tableCountEl = document.getElementById('table-count');

        // Detect if a string is a URL
        function isURL(str) {
            if (!str || typeof str !== 'string') return false;
            const pattern = /^(https?:\/\/|www\.)[^\s]+$/i;
            return pattern.test(str.trim());
        }

        // Extract domain for display
        function getDomain(url) {
            try {
                const u = new URL(url.startsWith('http') ? url : 'https://' + url);
                return u.hostname.replace('www.', '');
            } catch { return url; }
        }

        // Render cell content with clickable URLs and search buttons
        function renderCellContent(value, header) {
            if (!value) return '';
            const trimmed = String(value).trim();
            
            // If it's a URL
            if (isURL(trimmed)) {
                const displayUrl = trimmed.length > 40 ? trimmed.substring(0, 40) + '…' : trimmed;
                return `
                    <a href="${trimmed.startsWith('http') ? trimmed : 'https://' + trimmed}" 
                       target="_blank" 
                       class="url-link inline-flex items-center gap-1.5 group"
                       title="Open: ${trimmed}">
                        <i class="fas fa-external-link-alt text-[10px] text-indigo-400 group-hover:text-indigo-600"></i>
                        ${displayUrl}
                        <span class="text-[10px] text-gray-400 group-hover:text-indigo-400">↗</span>
                    </a>
                `;
            }
            
            // Check if it might be searchable (text with multiple words or looks like a name/title)
            const isSearchable = trimmed.length > 2 && !/^[\d\s,.]+$/.test(trimmed);
            if (isSearchable) {
                return `
                    <span class="flex items-center gap-2">
                        <span>${value}</span>
                        <button onclick="searchGoogle('${encodeURIComponent(trimmed)}')" 
                                class="search-btn text-gray-400 hover:text-indigo-600 text-xs w-6 h-6 rounded-full hover:bg-indigo-50 flex items-center justify-center transition-all"
                                title="Search Google for '${trimmed}'">
                            <i class="fas fa-search text-[10px]"></i>
                        </button>
                    </span>
                `;
            }
            
            return value;
        }

        // Google Search function
        function searchGoogle(query) {
            window.open('https://www.google.com/search?q=' + query, '_blank');
        }

        // Make search function globally accessible
        window.searchGoogle = searchGoogle;

        // Fetch and parse CSV
        function loadData() {
            loadingEl.style.display = 'flex';
            errorEl.classList.add('hidden');
            
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    loadingEl.style.display = 'none';

                    if (results.errors.length > 0) {
                        showError("Error parsing the CSV data. Please check the format.");
                        return;
                    }

                    sheetData = results.data;
                    if (sheetData.length === 0) {
                        showError("The spreadsheet is empty.");
                        return;
                    }

                    sheetHeaders = Object.keys(sheetData[0]).filter(h => h && h.trim() !== '');

                    // Update stats
                    rowCountEl.textContent = sheetData.length;
                    colCountEl.textContent = sheetHeaders.length;
                    updateTimeEl.textContent = new Date().toLocaleTimeString();
                    tableCountEl.textContent = sheetData.length + ' rows';
                    statsBarEl.classList.remove('hidden');

                    // Render views
                    renderTable();
                    renderCards();

                    // Show tabs and default view
                    viewTabsEl.classList.remove('hidden');
                    switchView('table');
                },
                error: function(err) {
                    loadingEl.style.display = 'none';
                    showError("Failed to fetch Google Sheet. Ensure it is published as a CSV and accessible.");
                    console.error(err);
                }
            });
        }

        function retryLoad() {
            loadData();
        }
        window.retryLoad = retryLoad;

        function showError(msg) {
            errorEl.classList.remove('hidden');
            errorMessageEl.textContent = msg;
        }

        // Switch between views
        function switchView(view) {
            currentView = view;
            if (view === 'table') {
                tableViewEl.classList.remove('hidden');
                cardsViewEl.classList.add('hidden');
                btnTable.className = "px-5 py-2.5 text-sm font-medium rounded-lg tab-active transition-all flex items-center gap-2";
                btnCards.className = "px-5 py-2.5 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";
            } else {
                cardsViewEl.classList.remove('hidden');
                tableViewEl.classList.add('hidden');
                btnCards.className = "px-5 py-2.5 text-sm font-medium rounded-lg tab-active transition-all flex items-center gap-2";
                btnTable.className = "px-5 py-2.5 text-sm font-medium rounded-lg tab-inactive transition-all flex items-center gap-2";
            }
        }
        window.switchView = switchView;

        // Render Table View
        function renderTable() {
            if (sheetHeaders.length === 0) return;
            
            let headerHtml = '<tr>';
            sheetHeaders.forEach(header => {
                headerHtml += `<th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">${header}</th>`;
            });
            headerHtml += '</tr>';
            tableHeadEl.innerHTML = headerHtml;

            let bodyHtml = '';
            sheetData.forEach((row, index) => {
                const rowBg = index % 2 === 0 ? 'bg-white' : 'bg-gray-50/60';
                bodyHtml += `<tr class="${rowBg} cell-highlight transition-colors">`;
                sheetHeaders.forEach(header => {
                    const cellValue = row[header] !== undefined && row[header] !== null ? row[header] : '';
                    bodyHtml += `<td class="px-6 py-4 text-sm text-gray-700">${renderCellContent(cellValue, header)}</td>`;
                });
                bodyHtml += `</tr>`;
            });
            tableBodyEl.innerHTML = bodyHtml;
        }

        // Render Cards View
        function renderCards() {
            if (sheetHeaders.length === 0) return;
            
            let cardsHtml = '';
            const titleHeader = sheetHeaders[0] || 'Item';
            
            sheetData.forEach((row, index) => {
                const titleValue = row[titleHeader] || 'Untitled';
                const colorVariants = ['from-indigo-100 to-purple-100', 'from-blue-100 to-cyan-100', 'from-emerald-100 to-teal-100', 'from-rose-100 to-pink-100', 'from-amber-100 to-orange-100'];
                const color = colorVariants[index % colorVariants.length];

                cardsHtml += `
                    <div class="bg-white rounded-xl shadow-md border border-gray-200/60 card-hover overflow-hidden">
                        <div class="bg-gradient-to-r ${color} px-5 py-4 border-b border-gray-200/40">
                            <h3 class="text-lg font-bold text-gray-800 flex items-center justify-between">
                                <span>${titleValue}</span>
                                <button onclick="searchGoogle('${encodeURIComponent(titleValue)}')" 
                                        class="text-gray-500 hover:text-indigo-600 text-sm w-7 h-7 rounded-full hover:bg-white/50 flex items-center justify-center transition-all">
                                    <i class="fas fa-search"></i>
                                </button>
                            </h3>
                        </div>
                        <div class="p-5 space-y-2.5">
                `;

                for (let i = 1; i < sheetHeaders.length; i++) {
                    const header = sheetHeaders[i];
                    let val = row[header] !== undefined && row[header] !== null ? row[header] : '';
                    if (val !== '') {
                        const isUrl = isURL(String(val).trim());
                        let displayVal = val;
                        if (isUrl) {
                            const domain = getDomain(val);
                            displayVal = `<a href="${val.startsWith('http') ? val : 'https://' + val}" target="_blank" class="url-link text-sm inline-flex items-center gap-1">
                                <i class="fas fa-external-link-alt text-[10px]"></i> ${domain}
                            </a>`;
                        } else {
                            // Add search button to card values too
                            const searchable = String(val).length > 2 && !/^[\d\s,.]+$/.test(String(val));
                            if (searchable) {
                                displayVal = `
                                    <span class="flex items-center gap-2">
                                        <span>${val}</span>
                                        <button onclick="searchGoogle('${encodeURIComponent(String(val).trim())}')" 
                                                class="text-gray-400 hover:text-indigo-500 text-xs">
                                            <i class="fas fa-search"></i>
                                        </button>
                                    </span>
                                `;
                            }
                        }
                        cardsHtml += `
                            <div class="text-sm flex justify-between items-start gap-2 py-1 border-b border-gray-50 last:border-0">
                                <span class="font-medium text-gray-500 text-xs uppercase tracking-wider">${header}</span>
                                <span class="text-gray-800 text-right break-all max-w-[65%]">${displayVal}</span>
                            </div>
                        `;
                    }
                }
                cardsHtml += `
                        </div>
                    </div>
                `;
            });
            cardsViewEl.innerHTML = cardsHtml;
        }

        // Initial load
        loadData();
    </script>
</body>
</html>
