<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pirah Periods Dashboard</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --primary: #3b4df0;
    --primary-light: #6a7bf5;
    --bg: #f4f6f9;
    --text: #222;
    --pink: #d4528b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 10px;
  }

  /* --- TOP HEADER --- */
  .header-card {
    background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
    border-radius: 20px;
    padding: 15px;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(59, 77, 240, 0.25);
    position: relative;
    flex-shrink: 0;
    height: 32%;
  }

  .live-clock {
    position: absolute;
    top: 12px;
    right: 15px;
    background: rgba(0,0,0,0.3);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .main-title {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 2px;
    margin-top: 15px;
  }
  
  .duration-text { 
    font-size: 13px; 
    text-align: center; 
    margin-bottom: 15px; 
    color: #e0e0e0;
  }
  
  .stats-row { 
    display: flex; 
    width: 100%; 
    justify-content: space-between; 
    padding: 0 5px;
  }
  
  .stat-box { 
    text-align: center; 
    flex: 1;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 8px 2px;
    margin: 0 4px;
    backdrop-filter: blur(5px);
  }
  
  .stat-label { font-size: 9px; font-weight: 500; text-transform: uppercase; opacity: 0.8; }
  .stat-value { font-size: 16px; font-weight: 700; color: white; margin-top: 2px; }
  .stat-value.small { font-size: 11px; }

  /* --- BOTTOM SECTION --- */
  .bottom-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    margin-top: 10px;
    height: 66%;
  }

  /* Chart Container */
  .chart-wrapper {
    flex: 1.2;
    background: white;
    border-radius: 16px;
    padding: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    position: relative;
    min-height: 160px;
  }

  .chart-title {
    font-size: 12px;
    font-weight: 600;
    color: #555;
    margin-bottom: 8px;
    text-align: center;
  }

  /* Table Container */
  .table-container {
    flex: 1;
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    display: flex;
    flex-direction: column;
  }
  
  .scroll-area { 
    overflow-y: auto; 
    flex: 1; 
    -webkit-overflow-scrolling: touch;
  }

  /* Custom Scrollbar */
  .scroll-area::-webkit-scrollbar { width: 4px; }
  .scroll-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

  table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: left; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; }
  th { background: #f9f9f9; font-weight: 600; position: sticky; top: 0; color: #444; z-index: 1; }
  td { color: #333; }
  .highlight-row td { color: var(--pink); font-weight: 600; }

  /* Desktop adjustments */
  @media (min-width: 768px) {
    body { padding: 20px; }
    .header-card { height: 250px; }
    .main-title { font-size: 32px; margin-top: 20px; }
    .duration-text { font-size: 18px; margin-bottom: 25px; }
    .stat-label { font-size: 12px; }
    .stat-value { font-size: 24px; }
    .stat-value.small { font-size: 18px; }
    
    .bottom-section { flex-direction: row; }
    .chart-wrapper, .table-container { flex: 1; }
    table { font-size: 14px; }
    th, td { padding: 12px 15px; }
    .chart-title { font-size: 16px; text-align: left; }
  }
</style>
</head>
<body>

  <!-- HEADER -->
  <div class="header-card">
    <div class="live-clock" id="liveClock">PKT: Loading...</div>
    
    <div class="main-title">Pirah Periods Dashboard</div>
    <div class="duration-text">Latest Period: <span id="latestDate">...</span></div>
    
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">Days</div>
        <div class="stat-value" id="statDays">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Weeks</div>
        <div class="stat-value" id="statWeeks">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Months</div>
        <div class="stat-value" id="statMonths">-</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Total Duration</div>
        <div class="stat-value small" id="statDuration">-</div>
      </div>
    </div>
  </div>

  <!-- BOTTOM -->
  <div class="bottom-section">
    
    <!-- BAR CHART -->
    <div class="chart-wrapper">
      <div class="chart-title">Recent Periods Duration (Days)</div>
      <canvas id="barChart"></canvas>
    </div>

    <!-- TABLE -->
    <div class="table-container">
      <div class="scroll-area">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Days</th>
              <th>Weeks</th>
              <th>Months</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

<script>
  // --- 1. LIVE PKT CLOCK ---
  function updateClock() {
    const options = { 
      timeZone: 'Asia/Karachi', 
      weekday: 'short', month: 'short', day: 'numeric', 
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true 
    };
    const now = new Date().toLocaleString('en-US', options);
    document.getElementById('liveClock').innerText = "PKT: " + now;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // --- 2. YOUR CSV DATA ---
  // Parsed from the exact CSV you provided (Skipping empty rows and headers)
  const csvData = [
    { date: "Oct 9, 2026", days: 9, weeks: 1, months: 0, duration: "0 Months 9 Days" },
    { date: "Sep 8, 2026", days: 31, weeks: 4, months: 1, duration: "1 Month 1 Day" },
    { date: "Aug 6, 2026", days: 33, weeks: 4, months: 1, duration: "1 Month 3 Days" },
    { date: "Jul 2, 2026", days: 35, weeks: 5, months: 1, duration: "1 Month 5 Days" },
    { date: "May 25, 2026", days: 38, weeks: 5, months: 1, duration: "1 Month 8 Days" },
    { date: "Apr 21, 2026", days: 34, weeks: 4, months: 1, duration: "1 Month 4 Days" },
    { date: "Mar 16, 2026", days: 36, weeks: 5, months: 1, duration: "1 Month 6 Days" },
    { date: "Feb 11, 2026", days: 33, weeks: 4, months: 1, duration: "1 Month 3 Days" },
    { date: "Jan 9, 2026", days: 33, weeks: 4, months: 1, duration: "1 Month 3 Days" },
    { date: "Dec 9, 2025", days: 31, weeks: 4, months: 1, duration: "1 Month 1 Day" }
  ];

  // --- 3. UPDATE UI & TABLE ---
  function initDashboard() {
    const latest = csvData[0];

    // Update Top Stats
    document.getElementById('latestDate').innerText = latest.date;
    document.getElementById('statDays').innerText = latest.days;
    document.getElementById('statWeeks').innerText = latest.weeks;
    document.getElementById('statMonths').innerText = latest.months;
    document.getElementById('statDuration').innerText = latest.duration;

    // Populate Table
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    
    csvData.forEach((row, index) => {
      const tr = document.createElement('tr');
      if (index === 0) tr.classList.add('highlight-row'); // Highlight the latest
      
      tr.innerHTML = `
        <td>${row.date}</td>
        <td>${row.days}</td>
        <td>${row.weeks}</td>
        <td>${row.months}</td>
      `;
      tbody.appendChild(tr);
    });

    // Draw Chart
    renderBarChart();
  }

  // --- 4. RENDER BAR CHART ---
  function renderBarChart() {
    const ctx = document.getElementById('barChart').getContext('2d');
    
    // Take the 7 most recent records for the chart to keep it clean
    const chartData = csvData.slice(0, 7).reverse();

    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: chartData.map(d => d.date.split(',')[0]), // Just show "Oct 9" to save space
        datasets: [{
          data: chartData.map(d => d.days),
          backgroundColor: chartData.map((d, i) => i === chartData.length - 1 ? '#d4528b' : '#a8b8e6'), // Highlight recent in pink
          borderRadius: 6,
          barThickness: 14
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { right: 25 } }, // Space for numbers at the end
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) { return context.raw + ' Days'; }
            }
          }
        },
        scales: {
          x: { 
            beginAtZero: true, 
            display: false // Hide X axis grid for clean mobile look
          },
          y: { 
            grid: { display: false },
            ticks: { 
              font: { size: 10, family: 'Poppins', weight: '500' }, 
              color: '#666' 
            }
          }
        },
        animation: {
          onComplete: function() {
            const chartInstance = this;
            const ctx = chartInstance.ctx;
            ctx.font = '10px Poppins';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#333';

            this.data.datasets.forEach(function(dataset, i) {
              const meta = chartInstance.getDatasetMeta(i);
              meta.data.forEach(function(bar, index) {
                const data = dataset.data[index];
                ctx.fillText(data + 'd', bar.x + 5, bar.y); // Draw "31d" next to the bar
              });
            });
          }
        }
      }
    });
  }

  // Initialize on load
  initDashboard();

</script>
</body>
</html>
