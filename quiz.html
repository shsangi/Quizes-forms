<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Self Learners">
<title>Self Learners · Quiz</title>
<link rel="icon" href="https://lh3.googleusercontent.com/d/1NRgM5kUkl8A0R5QrklfvdhwYlVj6OY27">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1NRgM5kUkl8A0R5QrklfvdhwYlVj6OY27">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f4f8;--sf:#fff;--sf2:#f8fafc;--bd:#e2e8f0;--tx:#0f172a;--tx2:#475569;--tx3:#64748b;--pr:#0f766e;--pr2:#0d9488;--ok:#10b981;--okb:#d1fae5;--er:#ef4444;--erb:#fee2e2;--wr:#f59e0b;--wrb:#fef3c7;--iv:#ec4899;--ivb:#fce7f3;--r:20px;--rf:9999px;--sh:0 25px 50px -12px rgba(15,23,42,.18)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.25rem;color:var(--tx);-webkit-font-smoothing:antialiased}
input{user-select:text;-webkit-user-select:text}

/* LOGIN */
.login{max-width:400px;width:100%;background:var(--sf);border-radius:28px;padding:2.75rem 2rem;box-shadow:var(--sh);display:none}
.login.on{display:block}
.login img{width:72px;height:72px;border-radius:18px;object-fit:contain;background:var(--sf2);padding:10px;margin:0 auto 1.25rem;display:block}
.login h1{font-size:1.85rem;font-weight:800;letter-spacing:-.03em;background:linear-gradient(135deg,#0f766e,#0ea5e9);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;margin-bottom:.25rem}
.login .sub{color:var(--tx3);font-size:.9rem;text-align:center;margin-bottom:2rem}
.login label{display:block;font-weight:600;font-size:.8rem;color:var(--tx2);margin-bottom:.35rem}
.ipg{position:relative;margin-bottom:1.15rem}
.ipg input{width:100%;padding:.9rem 1.15rem;padding-right:3rem;border:1.5px solid var(--bd);border-radius:var(--rf);font-size:.95rem;font-family:inherit;background:var(--sf2);outline:none;transition:.2s}
.ipg input:focus{border-color:var(--pr);background:#fff;box-shadow:0 0 0 4px rgba(15,118,110,.12)}
.tp{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.15rem;color:var(--tx3);padding:.25rem}
.btnl{width:100%;background:linear-gradient(135deg,#0f766e,#0d9488);border:none;color:#fff;font-weight:600;font-size:1rem;padding:.95rem;border-radius:var(--rf);cursor:pointer;box-shadow:0 8px 20px rgba(15,118,110,.25);margin-top:.5rem;font-family:inherit}
.btnl:disabled{opacity:.5;cursor:not-allowed}
.lf{text-align:center;font-size:.8rem;color:var(--tx3);margin-top:1.25rem}

/* TOAST */
.tc{position:fixed;top:1.25rem;right:1.25rem;z-index:9999;display:flex;flex-direction:column;gap:.6rem;max-width:360px;width:100%}
.tst{padding:.9rem 1.1rem;border-radius:14px;font-size:.875rem;font-weight:500;box-shadow:var(--sh);animation:sl .35s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;gap:.7rem;border-left:4px solid}
.tst.ok{background:var(--okb);color:#065f46;border-color:var(--ok)}
.tst.er{background:var(--erb);color:#991b1b;border-color:var(--er)}
.tst.wr{background:var(--wrb);color:#92400e;border-color:var(--wr)}
.tst.in{background:#e0f2fe;color:#075985;border-color:#0ea5e9}
.tst button{margin-left:auto;background:none;border:none;font-size:1.1rem;cursor:pointer;color:inherit;opacity:.5}
@keyframes sl{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* CONFIRM */
.cfo{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(6px);z-index:10000;display:none;align-items:center;justify-content:center}
.cfo.on{display:flex}
.cfb{background:var(--sf);border-radius:24px;padding:2rem;max-width:420px;width:90%;box-shadow:var(--sh);text-align:center}
.cfb h3{font-size:1.25rem;margin-bottom:.4rem}
.cfb p{color:var(--tx2);font-size:.925rem;margin-bottom:1.5rem}
.cfb .bg{display:flex;gap:.75rem;justify-content:center}
.cfb button{padding:.65rem 1.75rem;border-radius:var(--rf);font-weight:600;font-size:.9rem;border:none;cursor:pointer;font-family:inherit}
.cfb .ca{background:var(--sf2);color:var(--tx2);border:1px solid var(--bd)}
.cfb .ck{background:var(--er);color:#fff}

/* QUIZ */
.qw{max-width:860px;width:100%;background:var(--sf);border-radius:24px;padding:1.5rem 1.75rem;box-shadow:var(--sh);display:none}
.qw.on{display:block}
.tb{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.5rem .9rem;margin-bottom:.55rem}
.br{display:flex;gap:.55rem;min-width:0;flex:1 1 auto}
.br img{width:34px;height:34px;border-radius:9px;object-fit:contain;background:var(--sf2);padding:3px;flex-shrink:0;margin-top:2px}
.br h1{font-size:1.05rem;font-weight:700;background:linear-gradient(135deg,#0f766e,#0ea5e9);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:320px}
.ss{font-size:.72rem;color:var(--tx3);margin-top:.15rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:320px}
.ss:empty{display:none}
.ss b{color:var(--pr)}
.ta{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.pl{display:inline-flex;align-items:center;gap:.35rem;background:linear-gradient(135deg,#ecfeff,#f0fdfa);border:1.5px solid #99f6e4;padding:.28rem .75rem;border-radius:var(--rf);font-size:.78rem;font-weight:600;color:#0e7490;white-space:nowrap}
.pl b{color:#0f766e;font-weight:800}
.tm{display:inline-flex;align-items:center;gap:.35rem;background:var(--sf2);border:1.5px solid var(--bd);padding:.28rem .75rem;border-radius:var(--rf);font-size:.78rem;font-weight:600;color:var(--tx2);white-space:nowrap}
.tm b{color:var(--tx);font-weight:700}
.tm.wr{background:var(--wrb);border-color:var(--wr);color:#92400e}
.tm.dg{background:var(--erb);border-color:var(--er);color:#991b1b;animation:pls 1s infinite}
@keyframes pls{50%{opacity:.55}}
.bi{background:transparent;border:none;font-size:1.05rem;cursor:pointer;padding:.3rem;border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.bi:hover{background:var(--sf2)}
.bi:disabled{opacity:.4;cursor:not-allowed}
.pb{background:#e2e8f0;height:6px;border-radius:var(--rf);margin:.35rem 0 .4rem;overflow:hidden}
.pf{height:100%;width:0;background:linear-gradient(90deg,#0f766e,#0ea5e9);transition:width .35s}
.qc{background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:1.75rem 1.75rem 1rem;margin:.7rem 0 1.1rem;position:relative}
.qb{max-height:52vh;overflow-y:auto;padding-right:.6rem;scrollbar-width:thin}
.qt{font-weight:600;font-size:1.2rem;margin-bottom:1.1rem;line-height:1.5;cursor:pointer}
.qt:hover{color:var(--pr);text-decoration:underline}
.ol{display:flex;flex-direction:column;gap:.65rem}
.ob{background:#fff;border:1.5px solid var(--bd);border-radius:var(--rf);padding:.85rem 1.35rem;font-size:1rem;font-weight:500;text-align:left;cursor:pointer;display:flex;align-items:center;gap:.8rem;width:100%;font-family:inherit;transition:.15s}
.ob:hover:not(:disabled){background:#f0fdfa;border-color:#5eead4}
.ob .lt{background:#e0f2fe;color:#0369a1;font-weight:700;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.82rem}
.ob.ok{background:var(--okb);border-color:var(--ok)}
.ob.ok .lt{background:var(--ok);color:#fff}
.ob.no{background:var(--erb);border-color:var(--er)}
.ob.no .lt{background:var(--er);color:#fff}
.ob.sel{border-color:var(--pr);background:#f0fdfa}
.ob:disabled{cursor:default;opacity:.85}
.fb{margin-top:1.1rem;padding:1rem 1.15rem;border-radius:14px;font-weight:600;font-size:.92rem}
.fb.ok{background:var(--okb);border:1.5px solid var(--ok);color:#065f46}
.fb.no{background:var(--erb);border:1.5px solid var(--er);color:#991b1b}
.mc{margin-top:.85rem;display:flex;flex-wrap:wrap;gap:.45rem}
.mc span{display:inline-flex;gap:.35rem;background:#fff;border:1px solid var(--bd);padding:.32rem .75rem;border-radius:var(--rf);font-size:.72rem;font-weight:600;color:var(--tx2)}
.mc .sc{background:#ecfeff;color:#0e7490;border-color:#a5f3fc}
.mc .tc{background:#fef3c7;color:#92400e;border-color:#fde68a}
.mc .jc{background:#ede9fe;color:#5b21b6;border-color:#ddd6fe}
.ab{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.9rem;margin:1rem 0 .15rem}
.ab .lb{display:flex;gap:.55rem}
.bp{background:#0f766e;border:none;color:#fff;font-weight:600;font-size:.95rem;padding:.7rem 1.75rem;border-radius:var(--rf);cursor:pointer;font-family:inherit}
.bp:disabled{opacity:.4;cursor:not-allowed}
.bs{background:var(--ok);border:none;color:#fff;font-weight:600;font-size:.95rem;padding:.7rem 1.75rem;border-radius:var(--rf);cursor:pointer;font-family:inherit}
.bs:disabled{opacity:.4;cursor:not-allowed}
.sh{text-align:center;padding:.55rem 1rem;background:var(--okb);border-radius:var(--rf);margin-bottom:1rem;font-weight:600;color:#065f46;font-size:.9rem}

/* OVERVIEW */
.os{margin-top:1.5rem;border-top:1px solid var(--bd);padding-top:1rem}
.oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;flex-wrap:wrap;gap:.4rem}
.oh>span{font-weight:600;font-size:.85rem;color:var(--tx2)}
.lg{display:flex;gap:.9rem;font-size:.75rem;font-weight:500;color:var(--tx2);flex-wrap:wrap}
.lg span{display:flex;align-items:center;gap:.3rem}
.lg b{font-weight:700;font-size:.85rem}
.dt{width:12px;height:12px;border-radius:50%;display:inline-block}
.gd{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:.3rem}
.g{width:30px;height:30px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.7rem;color:var(--tx2);cursor:pointer;border:2px solid transparent;font-family:inherit}
.g.act{border-color:#0f172a;transform:scale(1.12)}
.g.ok{background:var(--ok);color:#fff}
.g.no{background:var(--er);color:#fff}
.g.dn{background:#0ea5e9;color:#fff}
.g.iv{background:var(--iv);color:#fff}

/* RESULT */
.rc{text-align:center;padding:.5rem;display:none}
.rc.on{display:block}
.rc h2{font-size:1.9rem;font-weight:700}
.rs{font-size:3.4rem;font-weight:800;background:linear-gradient(135deg,#0f766e,#0ea5e9);-webkit-background-clip:text;background-clip:text;color:transparent;margin:.3rem 0 .2rem}
.rm{color:var(--tx2);font-size:1.05rem;margin-bottom:1.5rem}
.rd{text-align:left;margin:1.4rem 0 1rem;display:flex;flex-direction:column;gap:.9rem;max-height:380px;overflow-y:auto}
.di{background:var(--sf2);border:1px solid var(--bd);border-radius:14px;padding:.85rem 1rem;border-left:5px solid #94a3b8}
.di.ok{border-color:var(--ok)}
.di.no{border-color:var(--er)}
.di.iv{border-color:var(--iv);background:var(--ivb)}
.dq{font-weight:600;font-size:.9rem;margin-bottom:.25rem;cursor:pointer}
.dq:hover{color:var(--pr);text-decoration:underline}
.da{font-size:.875rem;color:var(--tx2)}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(6px)}
.mo.on{display:flex}
.mb{background:var(--sf);max-width:440px;width:90%;border-radius:22px;padding:1.9rem 1.7rem;text-align:center;box-shadow:var(--sh);max-height:90vh;overflow-y:auto}
.mb h3{font-size:1.25rem;margin-bottom:.9rem}
.ui{display:flex;align-items:center;justify-content:space-between;background:var(--sf2);border-radius:14px;padding:.6rem 1rem;margin-bottom:1rem;border:1px solid var(--bd)}
.ui .l{display:flex;align-items:center;gap:.6rem}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0f766e,#0ea5e9);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.un{font-weight:600;font-size:.9rem}
.lo{background:transparent;border:1.5px solid var(--er);color:var(--er);font-weight:600;font-size:.78rem;padding:.4rem 1rem;border-radius:var(--rf);cursor:pointer;font-family:inherit}
.ml{display:block;text-align:left;font-weight:600;font-size:.8rem;color:var(--tx2);margin:.7rem 0 .25rem}
.ys{width:100%;padding:.65rem 1rem;border-radius:var(--rf);border:1.5px solid var(--bd);font-family:inherit;font-size:.9rem;background:#fff;outline:none;cursor:pointer}
.cw{border:1.5px solid var(--bd);border-radius:14px;background:#fff;max-height:180px;overflow-y:auto;padding:.5rem;margin-bottom:.35rem;text-align:left}
.cr{display:flex;align-items:center;gap:.5rem;padding:.4rem .55rem;border-radius:10px;cursor:pointer;font-size:.85rem}
.cr:hover{background:var(--sf2)}
.cr input{width:16px;height:16px;accent-color:var(--pr);cursor:pointer}
.cr.al{font-weight:700;color:var(--pr);border-bottom:1px dashed var(--bd);border-radius:10px 10px 0 0;margin-bottom:.2rem;padding-bottom:.5rem}
.cr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ma{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.ma .bp{padding:.6rem 1.75rem;font-size:.9rem}
.mc2{background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);font-weight:600;font-size:.9rem;padding:.6rem 1.75rem;border-radius:var(--rf);cursor:pointer;font-family:inherit}

/* M-COL BADGE */
.mcb{position:absolute;top:8px;right:10px;width:20px;height:20px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;z-index:5;pointer-events:none}
.mcb svg{width:13px;height:13px}
.mcb.t{background:#e0f2fe}
.mcb.f{background:#fee2e2}
.mcb .q{font-size:.85rem;font-weight:700;color:#9ca3af}

@media(max-width:560px){
.qw{padding:1.15rem .85rem}
.br h1{font-size:.88rem;max-width:180px}
.qc{padding:1.15rem 1.05rem .75rem}
.qt{font-size:1.05rem}
.ob{padding:.7rem 1.05rem;font-size:.92rem}
.g{width:28px;height:28px;font-size:.65rem}
.ab{flex-direction:column}
.ab .lb{justify-content:center}
.bp,.bs{width:100%}
.qb{max-height:46vh}
body{align-items:flex-start;padding-top:1rem}
.login{padding:1.75rem 1.25rem;border-radius:22px}
}
</style>
</head>
<body>

<div class="tc" id="tc"></div>

<!-- CONFIRM -->
<div class="cfo" id="cfo">
<div class="cfb">
<h3 id="cft">Are you sure?</h3>
<p id="cfm">This action cannot be undone.</p>
<div class="bg">
<button class="ca" id="cfc">Cancel</button>
<button class="ck" id="cfk">Confirm</button>
</div>
</div>
</div>

<!-- LOGIN -->
<div class="login on" id="lg">
<img id="lgi" src="https://lh3.googleusercontent.com/d/1NRgM5kUkl8A0R5QrklfvdhwYlVj6OY27" alt="Logo">
<h1>Self Learners</h1>
<p class="sub">Sign in to continue your quiz</p>
<label>Email / Username</label>
<div class="ipg"><input type="text" id="eu" placeholder="Enter your email or username" autocomplete="username"></div>
<label>Password</label>
<div class="ipg">
<input type="password" id="pw" placeholder="Enter your password" autocomplete="current-password">
<button class="tp" id="tpb" type="button">👁️</button>
</div>
<button class="btnl" id="lb">Sign In</button>
<div class="lf" id="ls">Loading...</div>
</div>

<!-- QUIZ -->
<div class="qw" id="qa">
<div class="tb">
<div class="br">
<img src="https://lh3.googleusercontent.com/d/1NRgM5kUkl8A0R5QrklfvdhwYlVj6OY27" alt="Logo">
<div>
<h1 id="qt2">All Jobs MCQs</h1>
<div class="ss" id="ssl"></div>
</div>
</div>
<div class="ta">
<span class="pl" id="pl">📝 <b id="ac">0</b>/<span id="tc2">0</span></span>
<span class="tm" id="tm2">⏱️ <b id="td">00:00</b></span>
<button class="bi" id="rb">⚙️</button>
</div>
</div>

<div class="pb"><div class="pf" id="pf"></div></div>

<div id="sqv">
<div class="sh" id="sb" style="display:none">✅ Submitted — Click "End Quiz" for final score.</div>
<div class="qc" id="qc"></div>
<div class="ab">
<div class="lb">
<button class="bp" id="pv">◀ Back</button>
<button class="bp" id="nx">Next ▶</button>
</div>
<button class="bs" id="eq">🏁 End Quiz</button>
</div>
</div>

<div class="os">
<div class="oh">
<span>OVERVIEW</span>
<div class="lg">
<span><span class="dt" style="background:#0ea5e9"></span>Done <b id="dc">0</b></span>
<span><span class="dt" style="background:#cbd5e1"></span>Pending <b id="pc">0</b></span>
<span><span class="dt" style="background:#10b981"></span>Correct <b id="cc">0</b></span>
<span><span class="dt" style="background:#ef4444"></span>Wrong <b id="wc">0</b></span>
<span id="il" style="display:none"><span class="dt" style="background:#ec4899"></span>Invalid <b id="ic">0</b></span>
</div>
</div>
<div class="gd" id="gd"></div>
</div>

<div class="rc" id="ra">
<h2>🏁 Quiz Complete</h2>
<div class="rs" id="fs">0 / 0</div>
<p class="rm" id="rm"></p>
<div class="rd" id="rd"></div>
<button class="bp" id="rr">⟳ Try again</button>
</div>

<!-- MODAL -->
<div class="mo" id="mo">
<div class="mb">
<h3>⚙️ Filter &amp; Refresh</h3>
<div class="ui">
<div class="l"><span class="av" id="ua">U</span><span class="un" id="un2">User</span></div>
<button class="lo" id="lo">🚪 Logout</button>
</div>
<label class="ml">💼 Job</label>
<select class="ys" id="js"><option value="all">All Jobs</option></select>
<label class="ml">📚 Subjects</label>
<div class="cw" id="sc"></div>
<div class="ma">
<button class="mc2" id="mc">Cancel</button>
<button class="bp" id="mf">Load &amp; Refresh</button>
</div>
</div>
</div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const LOGO='https://lh3.googleusercontent.com/d/1NRgM5kUkl8A0R5QrklfvdhwYlVj6OY27';
const QURL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQyB_I39SsLmQC5C8O1KkzZEUgFPAIJQ95k0vFj9M-HX8vI9hsdLh0GFYYO8O1QFnvP4vWkAh3nmbd3/pub?output=csv';
const LURL='https://docs.google.com/spreadsheets/d/17yY_LUiqMsABz7tbtAXFpZIYpHN2TJTZSxo7oJWzckI/export?format=csv&gid=2076597807';
const SK='sl_state', UK='sl_user';

// STATE
let qs=[],orig=[],idx=0,sc=0,done=false,sub=false,st=[],ans=[],lck=[],total=0,tmr=null,rem=0,subj=[],jobs=[],curS=[],curJ='all',inv=[],users=[],usr=null,loading=true,confRes=null;

// ============ PWA ============
const man={name:'Self Learners Quiz',short_name:'Self Learners',start_url:location.href.split('?')[0],display:'standalone',background_color:'#f0f4f8',theme_color:'#0f766e',icons:[{src:LOGO,sizes:'192x192',type:'image/png',purpose:'any'},{src:LOGO,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
const mlink=document.createElement('link');mlink.rel='manifest';mlink.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/json'}));document.head.appendChild(mlink);

if('serviceWorker' in navigator){const sw=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',e=>{if(!e.request.url.startsWith(self.location.origin))return;e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))})`;navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{})}

let dp=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
addEventListener('appinstalled',()=>{dp=null;toast('App installed! 📱','ok')});

// ============ UTILS ============
const cc=v=>v==null?'':String(v).replace(/[\u200B-\u200D\uFEFF\u00A0\u202F]/g,' ').replace(/\s+/g,' ').trim();
const eq=(a,b)=>a&&b&&cc(a).toLowerCase()===cc(b).toLowerCase();
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const TC_SMALL=new Set(['a','an','and','as','at','but','by','for','from','in','into','nor','of','on','onto','or','per','the','to','vs','via','with']);
function title(s){if(!s)return'';s=cc(s);if(!s)return'';return s.split(/(\s+|\/|-)/).map((c,i)=>{if(/^[\s\/-]+$/.test(c))return c;const l=c.toLowerCase();if(/^[A-Z]{2,5}$/.test(c))return c;if(/\d/.test(c))return c[0].toUpperCase()+c.slice(1).toLowerCase();if(i>0&&TC_SMALL.has(l))return l;return l[0].toUpperCase()+l.slice(1)}).join('')}

function toast(m,t='in',d=3500){const c=$('tc');c.innerHTML='';const el=document.createElement('div');el.className='tst '+t;el.innerHTML=`<span>${m}</span><button>✕</button>`;c.appendChild(el);el.querySelector('button').onclick=()=>el.remove();setTimeout(()=>el.remove(),d)}

function confirmBox(t,m){return new Promise(r=>{confRes=r;$('cft').textContent=t;$('cfm').textContent=m;$('cfo').classList.add('on')})}
$('cfc').onclick=()=>{$('cfo').classList.remove('on');confRes&&confRes(false)};
$('cfk').onclick=()=>{$('cfo').classList.remove('on');confRes&&confRes(true)};

function parseCSV(line){const r=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'&&line[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else{if(ch==='"')q=true;else if(ch===','){r.push(cc(cur));cur=''}else cur+=ch}}r.push(cc(cur));return r}

// ============ LOGIN ============
$('tpb').onclick=function(){const p=$('pw');const v=p.type==='password';p.type=v?'text':'password';this.textContent=v?'🙈':'👁️'};

async function loadUsers(){
try{const r=await fetch(LURL+'&_t='+Date.now());const t=await r.text();const lines=t.split('\n').filter(l=>l.trim());users=lines.slice(1).map(l=>{const c=parseCSV(l);return c[0]&&c[1]?{u:c[0],p:c[1]}:null}).filter(Boolean);loading=false;$('ls').textContent='🔐 Sign in to continue';$('lb').disabled=false;
try{const s=sessionStorage.getItem(UK);if(s){const sv=JSON.parse(s);const m=users.find(x=>x.u.toLowerCase()===sv.u.toLowerCase()&&x.p===sv.p);if(m){usr=m;toast('Welcome back, '+m.u,'in');showQuiz();return}}}catch(e){}
}catch(e){$('ls').textContent='⚠️ Cannot connect';$('lb').disabled=true;toast('Failed to load users','er')}}

$('lb').onclick=async()=>{
const u=$('eu').value.trim(),p=$('pw').value.trim();
if(!u||!p)return toast('Enter username & password','wr');
if(loading)return toast('Still loading...','wr');
const m=users.find(x=>x.u.toLowerCase()===u.toLowerCase()&&x.p===p);
if(m){usr=m;try{sessionStorage.setItem(UK,JSON.stringify(m))}catch(e){}toast('Welcome, '+m.u,'ok');showQuiz()}
else{toast('Invalid credentials','er');$('ls').textContent='❌ Login failed'}};

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('lg').classList.contains('on')&&!$('lb').disabled){const a=document.activeElement;if(a===$('eu')||a===$('pw'))$('lb').click()}});

function showQuiz(){$('lg').classList.remove('on');$('qa').classList.add('on');$('ua').textContent=usr.u[0].toUpperCase();$('un2').textContent=usr.u;loadQ(false)}

// ============ LOGOUT ============
$('lo').onclick=async()=>{
if(!await confirmBox('Logout?','Your progress will NOT be saved.'))return;
sessionStorage.removeItem(UK);usr=null;localStorage.removeItem(SK);
qs=[];orig=[];idx=0;sc=0;done=false;sub=false;st=[];ans=[];lck=[];total=0;rem=0;subj=[];jobs=[];curS=[];curJ='all';inv=[];
if(tmr)clearInterval(tmr);tmr=null;
$('qa').classList.remove('on');$('lg').classList.add('on');
$('eu').value='';$('pw').value='';$('pw').type='password';$('tpb').textContent='👁️';
$('ls').textContent='🔐 Sign in to continue';
$('mo').classList.remove('on');
toast('Logged out','in')};

// ============ SAVE/LOAD ============
const save=()=>{try{localStorage.setItem(SK,JSON.stringify({qs,ans,st,sub,done,sc,total,lck,orig,idx,rem,curS,curJ,subj,jobs,inv}))}catch(e){}};
const load=()=>{try{const s=localStorage.getItem(SK);if(!s)return null;const d=JSON.parse(s);if(!d.qs||!d.qs.length)return null;return d}catch(e){return null}};

// ============ TIMER ============
function startTimer(){if(tmr)clearInterval(tmr);tmr=setInterval(()=>{if(!done&&!sub){rem--;updTimer();if(rem<=0){clearInterval(tmr);tmr=null;grade();done=true;$('eq').disabled=true;showResult()}save()}},1000)}
function updTimer(){const m=Math.floor(rem/60),s=rem%60;$('td').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');const t=$('tm2');t.className='tm';if(rem<60)t.classList.add('dg');else if(rem<300)t.classList.add('wr')}

// ============ SUBJECTS ============
function subjectsForJob(j){const p=orig.length?orig:qs;if(!p.length)return[];if(!j||j==='all'){const s=new Set();p.forEach(q=>{const v=cc(q.subject);if(v)s.add(v)});return[...s]}const s=new Set();p.forEach(q=>{if(eq(q.job,j)){const v=cc(q.subject);if(v)s.add(v)}});return[...s]}

function buildChecks(list,sel){const c=$('sc');c.innerHTML='';if(!list.length){c.innerHTML='<div style="padding:1rem;text-align:center;color:#64748b;font-size:.8rem">No subjects</div>';return}
const ar=document.createElement('label');ar.className='cr al';const acb=document.createElement('input');acb.type='checkbox';acb.checked=!sel.some(s=>list.some(x=>eq(x,s)));ar.appendChild(acb);const al=document.createElement('span');al.textContent='All Subjects';ar.appendChild(al);c.appendChild(ar);
acb.onchange=function(){if(this.checked)c.querySelectorAll('input:not(:first-child)').forEach(x=>x.checked=false);else if(!c.querySelectorAll('input:not(:first-child):checked').length)this.checked=true};
list.forEach(sj=>{const r=document.createElement('label');r.className='cr';const cb=document.createElement('input');cb.type='checkbox';cb.value=sj;cb.checked=sel.some(s=>eq(s,sj));r.appendChild(cb);const l=document.createElement('span');l.textContent=title(sj);l.title=sj;r.appendChild(l);c.appendChild(r);
cb.onchange=function(){if(this.checked)acb.checked=false;if(!c.querySelectorAll('input:not(:first-child):checked').length)acb.checked=true}})}

const checkedSubjects=()=>[...$('sc').querySelectorAll('input:not(:first-child):checked')].map(x=>x.value);

$('js').onchange=()=>{const av=subjectsForJob($('js').value);const ck=checkedSubjects().filter(s=>av.some(a=>eq(a,s)));buildChecks(av,ck)};

// ============ FETCH QUESTIONS ============
function showLoading(){$('qc').innerHTML='<div style="padding:2rem;text-align:center;color:#475569">🔄 Loading...</div>';$('pv').disabled=true;$('nx').disabled=true;$('eq').disabled=true;$('rb').disabled=true;$('rb').textContent='⟳'}

async function loadQ(force=false,sel=null,job=null){
showLoading();
if(sel!==null)curS=sel;
if(job!==null)curJ=job;

if(!force){const s=load();if(s){qs=s.qs;orig=s.orig||s.qs.map(q=>({...q}));total=s.total||qs.length;ans=s.ans||new Array(qs.length).fill(null);st=s.st||new Array(qs.length).fill(null);lck=s.lck||new Array(qs.length).fill(false);sub=s.sub||false;done=s.done||false;sc=s.sc||0;idx=s.idx||0;rem=s.rem||(total*60);curS=s.curS||[];curJ=s.curJ||'all';subj=s.subj||[];jobs=s.jobs||[];inv=s.inv||[];
$('qt2').textContent=curJ==='all'?'All Jobs MCQs':title(curJ)+' MCQs';
renderSSL();$('tc2').textContent=total;$('ac').textContent=ans.filter(a=>a!==null).length;populate(subj,jobs);$('rb').disabled=false;$('rb').textContent='⚙️';updTimer();
if(done){showResult();return}
$('ra').classList.remove('on');$('sqv').style.display='block';$('sb').style.display='none';$('eq').disabled=false;$('eq').textContent='🏁 End Quiz';
startTimer();render();renderDots();updOverview();return}}

try{const r=await fetch(QURL+(force?'&_t='+Date.now():''));const t=await r.text();const lines=t.split('\n').filter(l=>l.trim());
orig=[];for(let i=1;i<lines.length;i++){const c=parseCSV(lines[i]);if(c.length<9)continue;const q=c[1];if(!q)continue;
const opts=[c[2]||'',c[3]||'',c[4]||'',c[5]||''];const raw=c[6]||'';
let ci=-1;for(let j=0;j<opts.length;j++){if(cc(opts[j])===cc(raw)){ci=j;break}}
if(ci===-1&&/^[A-Da-d]$/.test(raw)){const k='abcd'.indexOf(raw.toLowerCase());if(k>=0&&k<opts.length)ci=k}
if(ci===-1&&/^[1-4]$/.test(raw)){const k=parseInt(raw)-1;if(k>=0&&k<opts.length)ci=k}
orig.push({question:q,options:opts,correct:ci,correctText:raw,category:c[8]||'',topic:c[7]||'',subject:c[8]||'',job:c[10]||'',mcol:c[12]||''})}

subj=[...new Set(orig.map(q=>q.subject).filter(x=>x&&x.trim()))];
jobs=[...new Set(orig.map(q=>q.job).filter(x=>x&&x.trim()))];

let f=orig;
if(curS.length)f=f.filter(q=>curS.some(s=>eq(q.subject,s)));
if(curJ!=='all')f=f.filter(q=>eq(q.job,curJ));
if(!f.length){toast('No match, loading all','wr');f=orig;curS=[];curJ='all'}

qs=f.map(q=>{const s=shuf(q.options);const ni=s.indexOf(q.options[q.correct]);return{...q,options:s,correct:ni}});
inv=[];qs.forEach((q,i)=>{if(q.correct===-1&&q.correctText&&q.correctText.trim())inv.push(i)});

total=qs.length;ans=new Array(total).fill(null);st=new Array(total).fill(null);lck=new Array(total).fill(false);sub=false;done=false;sc=0;idx=0;rem=total*60;localStorage.removeItem(SK);

$('qt2').textContent=curJ==='all'?'All Jobs MCQs':title(curJ)+' MCQs';
renderSSL();populate(subj,jobs);$('tc2').textContent=total;$('ac').textContent=0;
$('rb').disabled=false;$('rb').textContent='⚙️';
$('ra').classList.remove('on');$('sqv').style.display='block';$('sb').style.display='none';$('eq').disabled=false;$('eq').textContent='🏁 End Quiz';
updTimer();startTimer();render();renderDots();updOverview();$('mo').classList.remove('on');
window.scrollTo({top:0,behavior:'smooth'})
}catch(e){console.error(e);$('qc').innerHTML='<div style="padding:2rem;text-align:center;color:#ef4444">❌ Failed to load</div>';$('rb').disabled=false;$('rb').textContent='⚙️';$('mo').classList.remove('on')}}

function renderSSL(){const e=$('ssl');if(!curS.length){e.innerHTML='';e.style.display='none';return}e.innerHTML='<span style="color:#64748b;font-weight:600">Subjects:</span> <b>'+curS.map(title).join(', ')+'</b>';e.style.display='-webkit-box'}

function populate(s,j){subj=s;jobs=j;const js=$('js');js.innerHTML='<option value="all">All Jobs</option>';j.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=title(x);js.appendChild(o)});js.value=curJ!=='all'&&j.includes(curJ)?curJ:'all';buildChecks(subjectsForJob(js.value),curS)}

// ============ RENDER QUESTION ============
function render(){
if(!qs.length){$('qc').innerHTML='<div style="padding:2rem;text-align:center">No questions</div>';return}
const q=qs[idx],L=['A','B','C','D'];
const ansd=lck[idx]||sub||done;
const mBadge=q.mcol==='true'?`<div class="mcb t"><svg viewBox="0 0 16 16" fill="none"><path d="M13.5 4.5L6 12L2.5 8.5" stroke="#0969da" stroke-width="2.8" stroke-linecap="round"/></svg></div>`:q.mcol==='false'?`<div class="mcb f"><svg viewBox="0 0 16 16" fill="none"><path d="M4 4L12 12M12 4L4 12" stroke="#cf222e" stroke-width="2.8" stroke-linecap="round"/></svg></div>`:`<div class="mcb"><span class="q">?</span></div>`;

let html=`<div class="qt" data-q="${encodeURIComponent(q.question)}">${idx+1}. ${q.question}</div><div class="ol">`;
q.options.forEach((o,i)=>{let c='ob';let ic='';if(ans[idx]===i)c+=' sel';
if(ansd){if(q.correct!==-1&&i===q.correct){c+=' ok';ic='<span style="margin-left:auto">✓</span>'}if(ans[idx]===i&&ans[idx]!==q.correct){c+=' no';ic='<span style="margin-left:auto">✗</span>'}}
html+=`<button class="${c}" data-i="${i}" ${ansd?'disabled':''}><span class="lt">${L[i]}</span><span>${o||'(Empty)'}</span>${ic}</button>`});
html+='</div>';

if(lck[idx]&&!sub&&!done){const ok=ans[idx]===q.correct;html+=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ Correct!':'❌ Incorrect. Answer: '+(q.options[q.correct]||'N/A')}</div>`;
const mc=[];if(q.subject)mc.push(`<span class="sc">📚 ${title(q.subject)}</span>`);if(q.topic)mc.push(`<span class="tc">🏷️ ${title(q.topic)}</span>`);if(q.job)mc.push(`<span class="jc">💼 ${title(q.job)}</span>`);if(mc.length)html+=`<div class="mc">${mc.join('')}</div>`}

$('qc').innerHTML=mBadge+`<div class="qb">${html}</div>`;

$('qc').querySelector('.qt').onclick=function(e){e.stopPropagation();const t=decodeURIComponent(this.dataset.q);if(!t)return;let sq=t;const p=[];if(q.subject&&q.subject.trim())p.push(q.subject.trim());if(q.topic&&q.topic.trim())p.push(q.topic.trim());if(p.length)sq=t+' '+p.join(' ');window.open('https://www.google.com/search?q='+encodeURIComponent(sq.substring(0,2000)),'_blank')};

if(!sub&&!done){$('qc').querySelectorAll('.ob:not([disabled])').forEach(b=>{b.onclick=function(e){e.stopPropagation();const i=parseInt(this.dataset.i);if(lck[idx]||sub||done)return;lck[idx]=true;ans[idx]=i;render();renderDots();updProgress();updOverview();save()}})}

updProgress();$('pv').disabled=idx===0||done;$('nx').disabled=idx===total-1||done;$('eq').disabled=done;
$('sb').style.display=(sub&&!done)?'block':'none';
save()}

function updProgress(){const a=ans.filter(x=>x!==null).length;$('ac').textContent=a;$('pf').style.width=(total?(a/total)*100:0)+'%';$('tc2').textContent=total}

function renderDots(active){const g=$('gd');g.innerHTML='';for(let i=0;i<total;i++){const d=document.createElement('button');d.className='g';d.textContent=i+1;
if(inv.includes(i))d.classList.add('iv');
else{const has=ans[i]!==null;if(sub||done){if(st[i]===true)d.classList.add('ok');else if(st[i]===false)d.classList.add('no');else if(has)d.classList.add('dn')}
else if(has){const q=qs[i];if(q&&ans[i]===q.correct)d.classList.add('ok');else d.classList.add('no')}}
if(active===i)d.classList.add('act');
d.onclick=e=>{e.stopPropagation();idx=i;render();renderDots(i);updProgress()};g.appendChild(d)}}

function updOverview(){let dn=0,pd=0,co=0,wr=0,iv=0;for(let i=0;i<total;i++){if(inv.includes(i)){iv++;continue}if(ans[i]!==null){dn++;if(sub||done){if(st[i]===true)co++;else if(st[i]===false)wr++}else{const q=qs[i];if(q&&ans[i]===q.correct)co++;else wr++}}else pd++}
$('dc').textContent=dn;$('pc').textContent=pd;$('cc').textContent=co;$('wc').textContent=wr;$('ic').textContent=iv;$('il').style.display=iv>0?'inline-flex':'none'}

// ============ GRADE ============
function grade(){let c=0;for(let i=0;i<qs.length;i++){const q=qs[i],a=ans[i];if(inv.includes(i)){st[i]=null;continue}if(q.correct===-1){st[i]=null;continue}if(a!==null&&a===q.correct){st[i]=true;c++}else if(a!==null)st[i]=false;else st[i]=null}
sc=c;sub=true;if(tmr)clearInterval(tmr);tmr=null;$('sb').style.display='block';render();renderDots();updOverview();save()}

$('eq').onclick=()=>{if(done)return;if(!sub)grade();done=true;if(tmr)clearInterval(tmr);tmr=null;$('eq').disabled=true;showResult()};

// ============ RESULT ============
function showResult(){done=true;if(tmr)clearInterval(tmr);tmr=null;$('sqv').style.display='none';$('ra').classList.add('on');
$('fs').textContent=sc+' / '+total;
$('rm').textContent=sc===total?'🌟 Perfect!':sc>=total*.7?'👏 Great job!':'💪 Keep practicing!';
const rd=$('rd');rd.innerHTML='';
qs.forEach((q,i)=>{const d=document.createElement('div');d.className='di';
if(inv.includes(i))d.classList.add('iv');else if(st[i]===true)d.classList.add('ok');else if(st[i]===false)d.classList.add('no');
const qt=document.createElement('div');qt.className='dq';qt.textContent=(i+1)+'. '+q.question;
qt.onclick=e=>{e.stopPropagation();let sq=q.question;const p=[];if(q.subject&&q.subject.trim())p.push(q.subject.trim());if(q.topic&&q.topic.trim())p.push(q.topic.trim());if(p.length)sq=q.question+' '+p.join(' ');window.open('https://www.google.com/search?q='+encodeURIComponent(sq.substring(0,2000)),'_blank')};
d.appendChild(qt);
const da=document.createElement('div');da.className='da';
if(inv.includes(i))da.innerHTML=`⚠️ <span style="color:#ec4899;font-weight:600">Invalid: "${q.correctText}" no match</span>`;
else{const ua=ans[i]!==null&&q.options[ans[i]]?q.options[ans[i]]:'Not answered';const ca=q.correct!==-1&&q.options[q.correct]?q.options[q.correct]:'N/A';
if(q.correct===-1)da.innerHTML='⚠️ No answer';
else if(st[i]===true)da.innerHTML=`✅ <span style="color:#10b981">${ua}</span> (Correct)`;
else if(st[i]===false)da.innerHTML=`❌ <span style="color:#ef4444">${ua}</span> &nbsp; Correct: <b style="color:#10b981">${ca}</b>`;
else da.innerHTML=`⏭️ Skipped &nbsp; Correct: <b style="color:#10b981">${ca}</b>`}
d.appendChild(da);rd.appendChild(d)});
updOverview();renderDots();updProgress();save();window.scrollTo({top:0,behavior:'smooth'})}

$('rr').onclick=()=>{localStorage.removeItem(SK);ans=new Array(qs.length).fill(null);st=new Array(qs.length).fill(null);lck=new Array(qs.length).fill(false);sub=false;done=false;sc=0;idx=0;rem=total*60;
if(tmr)clearInterval(tmr);$('ra').classList.remove('on');$('sqv').style.display='block';$('sb').style.display='none';$('eq').textContent='🏁 End Quiz';$('eq').disabled=false;
qs=qs.map(q=>{const s=shuf(q.options);const ni=s.indexOf(q.options[q.correct]);return{...q,options:s,correct:ni}});
updTimer();startTimer();render();renderDots();updOverview();save();window.scrollTo({top:0,behavior:'smooth'})};

// ============ NAV ============
$('pv').onclick=()=>{if(idx>0){idx--;render();renderDots(idx);updProgress()}};
$('nx').onclick=()=>{if(idx<total-1){idx++;render();renderDots(idx);updProgress()}};

// ============ MODAL ============
$('rb').onclick=()=>{const js=$('js');js.innerHTML='<option value="all">All Jobs</option>';jobs.forEach(j=>{const o=document.createElement('option');o.value=j;o.textContent=title(j);js.appendChild(o)});js.value=curJ!=='all'&&jobs.includes(curJ)?curJ:'all';buildChecks(subjectsForJob(js.value),curS);$('ua').textContent=usr?usr.u[0].toUpperCase():'U';$('un2').textContent=usr?usr.u:'User';$('mo').classList.add('on')};

$('mc').onclick=()=>$('mo').classList.remove('on');
$('mf').onclick=()=>{const s=checkedSubjects();const j=$('js').value;$('mo').classList.remove('on');if(tmr)clearInterval(tmr);tmr=null;loadQ(true,s,j)};
$('mo').onclick=e=>{if(e.target===$('mo'))$('mo').classList.remove('on')};

loadUsers();
})();
</script>
</body>
</html>
