<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>CSS · syllabus with study dates</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f0f4fa;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 16px 14px 40px;
            color: #0b1e32;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 680px;
            width: 100%;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            gap: 6px 4px;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 span {
            background: #d4e2f5;
            padding: 0 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1b3f69;
            line-height: 1.8;
        }
        .count-badge {
            background: #e0e9f3;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1a3857;
            white-space: nowrap;
        }

        /* ----- modern controls ----- */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .search-box {
            flex: 2;
            position: relative;
            min-width: 160px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 2px solid #d5dfea;
            border-radius: 60px;
            background: white;
            font-size: 1rem;
            font-family: inherit;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: 0.2s;
        }
        .search-box input:focus {
            outline: none;
            border-color: #2a6df4;
            box-shadow: 0 0 0 4px rgba(42,109,244,0.12);
        }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
            font-size: 1.1rem;
        }

        /* modern multi-select dropdown */
        .multi-select-wrapper {
            flex: 1;
            min-width: 180px;
            position: relative;
        }
        .multi-select-wrapper .selected-display {
            width: 100%;
            padding: 12px 40px 12px 16px;
            border: 2px solid #d5dfea;
            border-radius: 60px;
            background: white;
            font-size: 0.95rem;
            font-family: inherit;
            color: #1a2e4a;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            min-height: 48px;
        }
        .multi-select-wrapper .selected-display:hover {
            border-color: #b0c4dd;
        }
        .multi-select-wrapper .selected-display .placeholder {
            color: #8a9bb0;
        }
        .multi-select-wrapper .selected-display .tag {
            background: #e5edf8;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1a3a5a;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .multi-select-wrapper .selected-display .tag .remove {
            cursor: pointer;
            font-weight: 700;
            color: #6a7a8a;
            font-size: 0.7rem;
            margin-left: 2px;
        }
        .multi-select-wrapper .selected-display .tag .remove:hover {
            color: #c0392b;
        }
        .multi-select-wrapper .selected-display::after {
            content: "▾";
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6a7a8a;
            font-size: 1rem;
            pointer-events: none;
        }
        .multi-select-wrapper .selected-display.active::after {
            content: "▴";
        }

        .dropdown-options {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #d5dfea;
            border-radius: 16px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            padding: 6px 0;
        }
        .dropdown-options.open {
            display: block;
        }
        .dropdown-options .option-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #1a2e4a;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.1s;
        }
        .dropdown-options .option-item:hover {
            background: #eef3fa;
        }
        .dropdown-options .option-item .check {
            width: 18px;
            height: 18px;
            border: 2px solid #c5d2e3;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: white;
            flex-shrink: 0;
        }
        .dropdown-options .option-item.selected .check {
            background: #2a6df4;
            border-color: #2a6df4;
        }
        .dropdown-options .option-item.selected .check::after {
            content: "✓";
            color: white;
            font-weight: 700;
        }
        .dropdown-options .option-item .label {
            flex: 1;
        }
        .dropdown-options .option-item .count {
            font-size: 0.7rem;
            color: #8a9bb0;
        }
        .dropdown-options .clear-all {
            padding: 8px 16px;
            font-size: 0.8rem;
            color: #c0392b;
            cursor: pointer;
            border-top: 1px solid #e5edf8;
            text-align: center;
            font-weight: 500;
        }
        .dropdown-options .clear-all:hover {
            background: #fdf0ee;
        }

        /* ----- cards with colors ----- */
        .syllabus {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .paper-block {
            border-radius: 24px;
            padding: 20px 18px 16px;
            margin-bottom: 18px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 4px 16px rgba(0,20,30,0.06);
            transition: 0.2s;
        }
        .paper-block:last-child {
            margin-bottom: 0;
        }
        /* colorful card backgrounds */
        .paper-block:nth-child(1) { background: linear-gradient(145deg, #ffffff, #f5f9ff); border-color: #d6e4f5; }
        .paper-block:nth-child(2) { background: linear-gradient(145deg, #ffffff, #f5fff5); border-color: #d4edda; }
        .paper-block:nth-child(3) { background: linear-gradient(145deg, #ffffff, #fef5f5); border-color: #f5d6d6; }
        .paper-block:nth-child(4) { background: linear-gradient(145deg, #ffffff, #f5f5ff); border-color: #d6d6f5; }
        .paper-block:nth-child(5) { background: linear-gradient(145deg, #ffffff, #fff5f0); border-color: #f5e0d6; }
        .paper-block:nth-child(6) { background: linear-gradient(145deg, #ffffff, #f0faff); border-color: #d6ecf5; }
        .paper-block:nth-child(7) { background: linear-gradient(145deg, #ffffff, #fafff0); border-color: #e0f5d6; }
        .paper-block:nth-child(8) { background: linear-gradient(145deg, #ffffff, #fff5fa); border-color: #f5d6e4; }

        .paper-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0b2b4a;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 8px;
            padding-bottom: 4px;
        }
        .paper-title .marks {
            font-weight: 500;
            font-size: 0.85rem;
            color: #3d6185;
            background: rgba(255,255,255,0.6);
            padding: 0 14px;
            border-radius: 40px;
            line-height: 2;
        }
        .paper-title .subject-link {
            color: #0b2b4a;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .paper-title .subject-link:hover {
            color: #2a6df4;
        }
        .paper-title .subject-link::after {
            content: "🔗";
            font-size: 0.8rem;
            opacity: 0.5;
        }

        .last-studied {
            font-size: 0.85rem;
            color: #2a4a6a;
            background: rgba(255,255,255,0.7);
            padding: 4px 16px;
            border-radius: 40px;
            display: inline-block;
            margin: 4px 0 10px 0;
            font-weight: 450;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .last-studied span {
            font-weight: 500;
            color: #1a4a7a;
        }
        .last-studied .pkt-badge {
            font-weight: 400;
            color: #5a7a9a;
            font-size: 0.7rem;
            margin-left: 4px;
        }

        .subject-divider {
            border: none;
            border-top: 2px solid rgba(255,255,255,0.6);
            margin: 6px 0 14px 0;
        }

        .module-group {
            margin-bottom: 14px;
        }
        .module-group:last-child {
            margin-bottom: 0;
        }
        .module-head {
            font-weight: 600;
            font-size: 1rem;
            color: #1f406a;
            margin-bottom: 6px;
            display: flex;
            align-items: baseline;
            gap: 6px;
            flex-wrap: wrap;
        }
        .module-head .module-marks {
            font-weight: 400;
            font-size: 0.8rem;
            color: #3f6187;
            background: rgba(255,255,255,0.5);
            padding: 0 12px;
            border-radius: 40px;
            line-height: 1.8;
        }
        .topic-item {
            padding: 8px 0 8px 18px;
            border-left: 3px solid rgba(42,109,244,0.25);
            margin-left: 4px;
            margin-bottom: 10px;
        }
        .topic-item:last-child {
            margin-bottom: 0;
        }
        .topic-item .topic-label {
            font-weight: 600;
            font-size: 1rem;
            color: #0b2b4a;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px 10px;
        }
        .topic-item .topic-label .topic-link {
            color: #0b2b4a;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .topic-item .topic-label .topic-link:hover {
            color: #2a6df4;
        }
        .topic-item .topic-label .topic-link::after {
            content: "🔗";
            font-size: 0.7rem;
            opacity: 0.4;
        }
        .subtopic-list {
            margin: 6px 0 4px 10px;
            padding-left: 4px;
            list-style: none;
            counter-reset: sub-counter;
        }
        .subtopic-list li {
            counter-increment: sub-counter;
            font-size: 0.92rem;
            color: #1f3d60;
            line-height: 1.6;
            padding: 2px 0 2px 28px;
            position: relative;
            margin-bottom: 2px;
        }
        .subtopic-list li::before {
            content: counter(sub-counter) ".";
            position: absolute;
            left: 2px;
            font-weight: 500;
            color: #2a6df4;
            font-size: 0.85rem;
        }
        .subtopic-list li .sub-link {
            color: #1f3d60;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .subtopic-list li .sub-link:hover {
            color: #2a6df4;
        }
        .subtopic-list li .sub-link::after {
            content: "🔗";
            font-size: 0.6rem;
            opacity: 0.35;
        }
        .sub-subtopic-list {
            margin: 2px 0 2px 24px;
            padding-left: 4px;
            list-style: none;
        }
        .sub-subtopic-list li {
            font-size: 0.88rem;
            color: #1f3d60;
            line-height: 1.6;
            padding: 1px 0 1px 20px;
            position: relative;
            margin-bottom: 0px;
        }
        .sub-subtopic-list li::before {
            content: attr(data-letter) ")";
            position: absolute;
            left: 0px;
            font-weight: 450;
            color: #3a6a9a;
            font-size: 0.8rem;
        }
        .sub-subtopic-list li .sub-link {
            color: #1f3d60;
            text-decoration: none;
            cursor: pointer;
        }
        .sub-subtopic-list li .sub-link:hover {
            color: #2a6df4;
        }
        .sub-subtopic-list li .sub-link::after {
            content: "🔗";
            font-size: 0.55rem;
            opacity: 0.3;
            margin-left: 2px;
        }
        .topic-item .book-ref {
            font-size: 0.85rem;
            color: #3d6185;
            margin-top: 4px;
        }
        .topic-item .book-ref .book-link {
            color: #3d6185;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .topic-item .book-ref .book-link:hover {
            color: #2a6df4;
        }
        .topic-item .book-ref .book-link::after {
            content: "🔗";
            font-size: 0.6rem;
            opacity: 0.35;
        }
        .empty-state {
            padding: 40px 16px;
            text-align: center;
            background: white;
            border-radius: 40px;
            color: #3b5f82;
            border: 1px solid #e3eaf3;
            font-size: 1.1rem;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 50px 0;
            color: #2f557a;
            font-size: 1.1rem;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #d5dfea;
            border-top: 3px solid #2a6df4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #5f7c99;
            text-align: right;
            border-top: 1px solid #dce5ef;
            padding-top: 14px;
        }
        .search-hint {
            font-size: 0.8rem;
            color: #5f7c99;
            text-align: center;
            margin-top: 4px;
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            .controls-row { flex-direction: column; }
            .multi-select-wrapper { min-width: 100%; }
            .search-box { min-width: 100%; }
            .paper-title { font-size: 1.1rem; }
            .topic-item .topic-label { font-size: 0.95rem; }
            .subtopic-list li { font-size: 0.88rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>📘 CSS <span>syllabus</span></h1>
        <span class="count-badge" id="countDisplay">0</span>
    </div>

    <div class="controls">
        <div class="controls-row">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search topics, books…" />
            </div>
            <div class="multi-select-wrapper" id="multiSelectWrapper">
                <div class="selected-display" id="selectedDisplay">
                    <span class="placeholder">All subjects</span>
                </div>
                <div class="dropdown-options" id="dropdownOptions">
                    <!-- options populated by JS -->
                    <div class="clear-all" id="clearAll">✕ Clear all</div>
                </div>
            </div>
        </div>
        <div class="search-hint">🔗 Click any subject, topic, subtopic, or book to search Google</div>
    </div>

    <div class="syllabus" id="syllabusContainer">
        <div class="loading"><span class="spinner"></span> loading…</div>
    </div>
    <div class="footer">FPSC syllabus · live from Google Sheets</div>
</div>

<script>
    (function() {
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSficiiXO39uzMxJ7TUSd_2GNxZaX8R_ZlIjr_CUIpG2DTbMfw3eXJH3b1wJdbeX6ZUCykDg82uAiac/pub?output=csv';

        const container = document.getElementById('syllabusContainer');
        const searchInput = document.getElementById('searchInput');
        const selectedDisplay = document.getElementById('selectedDisplay');
        const dropdownOptions = document.getElementById('dropdownOptions');
        const clearAllBtn = document.getElementById('clearAll');
        const countDisplay = document.getElementById('countDisplay');
        const wrapper = document.getElementById('multiSelectWrapper');

        let allRecords = [];
        let filtered = [];
        let selectedSubjects = [];
        let allSubjects = [];

        // ---------- CSV parse ----------
        function parseLine(line) {
            const res = [];
            let cur = '', inside = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (inside) {
                    if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
                    else if (ch === '"') inside = false;
                    else cur += ch;
                } else {
                    if (ch === ',') { res.push(cur.trim()); cur = ''; }
                    else if (ch === '"') inside = true;
                    else cur += ch;
                }
            }
            res.push(cur.trim());
            return res;
        }

        function parseCSV(text) {
            const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
            if (lines.length < 2) return [];
            const h = parseLine(lines[0]);
            const idx = {
                srno: h.indexOf('srno'),
                subject: h.indexOf('subjectPaper') !== -1 ? h.indexOf('subjectPaper') : h.indexOf('subject'),
                Module: h.indexOf('Module'),
                topicNumber: h.indexOf('Topic Number'),
                topicName: h.indexOf('Topic Name / Detail'),
                inFPSC: h.indexOf('Given in FPSC CSS Syllabus?'),
                book: h.indexOf('Recommended Book / Source to Study'),
                dateRead: h.indexOf('date_read'),
                subtopics: h.indexOf('Possible Subtopics (FPSC Syllabus Past Papers & Recent Topics)')
            };
            const subtopicsIdx = idx.subtopics !== -1 ? idx.subtopics : idx.topicName;

            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                const c = parseLine(lines[i]);
                if (c.length < 8) continue;
                const r = {
                    srno: c[idx.srno] || '',
                    subject: c[idx.subject] || '',
                    Module: c[idx.Module] || '',
                    topicNumber: c[idx.topicNumber] || '',
                    topicName: c[idx.topicName] || '',
                    inFPSC: c[idx.inFPSC] || '',
                    book: c[idx.book] || '',
                    dateRead: c[idx.dateRead] || '',
                    subtopics: c[subtopicsIdx] || ''
                };
                if (!isNaN(parseFloat(r.srno)) && r.srno.trim() !== '') rows.push(r);
            }
            return rows;
        }

        // ---------- Google search ----------
        function googleSearch(query) {
            const clean = query.trim();
            if (!clean) return;
            const url = `https://www.google.com/search?q=css+${encodeURIComponent(clean)}`;
            window.open(url, '_blank');
        }

        // ---------- smart split ----------
        function smartSplit(text) {
            if (!text || text.trim() === '') return [];
            const numberedMatch = text.match(/\d+\.\s*[^.]*?(?:\.\s*(?=\d+\.)|$)/g);
            if (numberedMatch && numberedMatch.length > 1) return numberedMatch.map(s => s.trim());
            const letterMatch = text.match(/[a-z]\)\s*[^,;.]*?(?:[.,;]\s*(?=[a-z]\))|$)/gi);
            if (letterMatch && letterMatch.length > 1) return letterMatch.map(s => s.trim());
            if (text.includes(';')) {
                const parts = text.split(';').map(s => s.trim()).filter(s => s.length > 0);
                if (parts.length > 1) return parts;
            }
            if (text.includes(',')) {
                const parts = text.split(',').map(s => s.trim()).filter(s => s.length > 0);
                if (parts.length > 1) return parts;
            }
            if (text.includes('. ')) {
                const parts = text.split('. ').map(s => s.trim()).filter(s => s.length > 0);
                if (parts.length > 1) return parts;
            }
            return [text.trim()];
        }

        function hasSubLetters(text) {
            if (!text) return false;
            return /[a-z]\)\s*[^,;.]*?(?:[.,;]\s*(?=[a-z]\))|$)/gi.test(text) && 
                   (text.match(/[a-z]\)/gi) || []).length > 1;
        }

        function extractSubLetters(text) {
            if (!text) return [];
            const matches = text.match(/[a-z]\)\s*[^,;.]*?(?:[.,;]\s*(?=[a-z]\))|$)/gi);
            if (!matches) return [];
            return matches.map(s => s.trim());
        }

        function formatDateInPKT(dateStr) {
            if (!dateStr || dateStr.trim() === '') return '';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                const pktOffset = 5 * 60;
                const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
                const pktDate = new Date(utc + (pktOffset * 60000));
                const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const day = days[pktDate.getUTCDay()];
                const month = months[pktDate.getUTCMonth()];
                const date = pktDate.getUTCDate();
                const year = pktDate.getUTCFullYear();
                let hours = pktDate.getUTCHours();
                const minutes = String(pktDate.getUTCMinutes()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                return `${day}, ${date} ${month}, ${year}, ${hours}:${minutes} ${ampm}`;
            } catch (e) { return dateStr; }
        }

        // ---------- render ----------
        function render(records) {
            if (!records || records.length === 0) {
                container.innerHTML = `<div class="empty-state">✨ No topics match</div>`;
                countDisplay.textContent = '0';
                return;
            }

            const groups = {};
            for (const r of records) {
                const key = r.subject || 'Uncategorized';
                if (!groups[key]) groups[key] = [];
                groups[key].push(r);
            }

            let html = '';
            let cardIndex = 0;
            for (const [subject, items] of Object.entries(groups)) {
                cardIndex++;
                items.sort((a,b) => parseInt(a.srno) - parseInt(b.srno));

                let latestDate = '';
                for (const item of items) {
                    if (item.dateRead && item.dateRead.trim() !== '') {
                        const d = new Date(item.dateRead);
                        if (!isNaN(d.getTime())) {
                            if (!latestDate || d > new Date(latestDate)) latestDate = item.dateRead;
                        }
                    }
                }

                html += `<div class="paper-block" style="animation: fadeIn 0.3s ease;">`;
                const subjectSearch = subject;
                html += `<div class="paper-title">
                            <span class="subject-link" onclick="googleSearch('${subjectSearch.replace(/'/g, "\\'")}')">📄 ${subject}</span>
                            <span class="marks">${items.length} topics</span>
                        </div>`;

                if (latestDate) {
                    const formatted = formatDateInPKT(latestDate);
                    html += `<div class="last-studied">📅 Last studied: <span>${formatted}</span> <span class="pkt-badge">(PKT)</span></div>`;
                } else {
                    html += `<div class="last-studied" style="opacity:0.6;">📅 Not studied yet</div>`;
                }

                html += `<hr class="subject-divider" />`;

                const moduleMap = {};
                for (const item of items) {
                    const mod = item.Module || 'General';
                    if (!moduleMap[mod]) moduleMap[mod] = [];
                    moduleMap[mod].push(item);
                }

                for (const [mod, topics] of Object.entries(moduleMap)) {
                    html += `<div class="module-group">`;
                    html += `<div class="module-head">${mod}</div>`;
                    for (const t of topics) {
                        const topicNum = t.topicNumber ? `${t.topicNumber}` : '';
                        const topicSearch = t.topicName || '';

                        html += `<div class="topic-item">`;
                        html += `<div class="topic-label">
                                    <span class="topic-link" onclick="googleSearch('${topicSearch.replace(/'/g, "\\'")}')">${topicNum} ${t.topicName || '—'}</span>
                                </div>`;

                        const subText = t.subtopics || t.topicName || '';
                        const subItems = smartSplit(subText);
                        
                        if (subItems.length > 0) {
                            html += `<ul class="subtopic-list">`;
                            for (const sub of subItems) {
                                if (hasSubLetters(sub)) {
                                    const subLetters = extractSubLetters(sub);
                                    const mainPart = sub.replace(/[a-z]\)\s*[^,;.]*?(?:[.,;]\s*(?=[a-z]\))|$)/gi, '').trim();
                                    const cleanMain = mainPart.replace(/[:–-]\s*$/, '').trim();
                                    if (cleanMain) {
                                        html += `<li><span class="sub-link" onclick="googleSearch('${cleanMain.replace(/'/g, "\\'")}')">${cleanMain}</span></li>`;
                                    }
                                    if (subLetters.length > 0) {
                                        html += `<ul class="sub-subtopic-list">`;
                                        const letters = 'abcdefghijklmnopqrstuvwxyz';
                                        for (let i = 0; i < subLetters.length; i++) {
                                            const letter = letters[i] || '?';
                                            const cleanSub = subLetters[i].replace(/^[a-z]\)\s*/, '').trim();
                                            html += `<li data-letter="${letter}"><span class="sub-link" onclick="googleSearch('${cleanSub.replace(/'/g, "\\'")}')">${cleanSub}</span></li>`;
                                        }
                                        html += `</ul>`;
                                    }
                                } else {
                                    let cleanSub = sub.replace(/^\d+\.\s*/, '').trim();
                                    cleanSub = cleanSub.replace(/[;,:]\s*$/, '').trim();
                                    if (cleanSub) {
                                        html += `<li><span class="sub-link" onclick="googleSearch('${cleanSub.replace(/'/g, "\\'")}')">${cleanSub}</span></li>`;
                                    }
                                }
                            }
                            html += `</ul>`;
                        }

                        if (t.book && t.book !== '—') {
                            const bookSearch = t.book;
                            html += `<div class="book-ref">📖 <span class="book-link" onclick="googleSearch('${bookSearch.replace(/'/g, "\\'")}')">${t.book}</span></div>`;
                        }

                        html += `</div>`;
                    }
                    html += `</div>`;
                }
                html += `</div>`;
            }

            container.innerHTML = html;
            countDisplay.textContent = records.length;
        }

        // ---------- filter (case-insensitive) ----------
        function applyFilters() {
            const search = searchInput.value.trim().toLowerCase();
            const subjects = selectedSubjects.length > 0 ? selectedSubjects : null;
            
            filtered = allRecords.filter(r => {
                if (search) {
                    const all = `${r.srno} ${r.subject} ${r.Module} ${r.topicNumber} ${r.topicName} ${r.book} ${r.subtopics}`.toLowerCase();
                    if (!all.includes(search)) return false;
                }
                if (subjects && !subjects.includes(r.subject)) return false;
                return true;
            });
            render(filtered);
            updateDropdownUI();
        }

        // ---------- dropdown UI ----------
        function updateDropdownUI() {
            // update selected display
            if (selectedSubjects.length === 0) {
                selectedDisplay.innerHTML = `<span class="placeholder">All subjects</span>`;
            } else if (selectedSubjects.length <= 2) {
                selectedDisplay.innerHTML = selectedSubjects.map(s => 
                    `<span class="tag">${s} <span class="remove" data-subject="${s}">✕</span></span>`
                ).join('');
            } else {
                selectedDisplay.innerHTML = `<span class="tag">${selectedSubjects.length} selected <span class="remove" id="clearAllTags">✕</span></span>`;
            }

            // update option items
            const items = dropdownOptions.querySelectorAll('.option-item');
            items.forEach(item => {
                const subj = item.dataset.subject;
                if (selectedSubjects.includes(subj)) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });

            // re-bind remove events
            document.querySelectorAll('.tag .remove').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const subj = this.dataset.subject;
                    if (subj) {
                        selectedSubjects = selectedSubjects.filter(s => s !== subj);
                        applyFilters();
                    }
                });
            });
            const clearTags = document.getElementById('clearAllTags');
            if (clearTags) {
                clearTags.addEventListener('click', function(e) {
                    e.stopPropagation();
                    selectedSubjects = [];
                    applyFilters();
                });
            }
        }

        function buildDropdown() {
            const subjects = [...new Set(allRecords.map(r => r.subject).filter(Boolean))].sort();
            allSubjects = subjects;
            
            let html = `<div class="clear-all" id="clearAll">✕ Clear all</div>`;
            for (const s of subjects) {
                const count = allRecords.filter(r => r.subject === s).length;
                html += `<div class="option-item" data-subject="${s}">
                            <span class="check"></span>
                            <span class="label">${s}</span>
                            <span class="count">${count}</span>
                        </div>`;
            }
            dropdownOptions.innerHTML = html;

            // bind option clicks
            dropdownOptions.querySelectorAll('.option-item').forEach(el => {
                el.addEventListener('click', function() {
                    const subj = this.dataset.subject;
                    if (selectedSubjects.includes(subj)) {
                        selectedSubjects = selectedSubjects.filter(s => s !== subj);
                    } else {
                        selectedSubjects.push(subj);
                    }
                    applyFilters();
                });
            });

            clearAllBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                selectedSubjects = [];
                applyFilters();
            });

            // toggle dropdown
            selectedDisplay.addEventListener('click', function(e) {
                e.stopPropagation();
                dropdownOptions.classList.toggle('open');
                this.classList.toggle('active');
            });

            document.addEventListener('click', function() {
                dropdownOptions.classList.remove('open');
                selectedDisplay.classList.remove('active');
            });
        }

        // ---------- load ----------
        async function load() {
            try {
                container.innerHTML = `<div class="loading"><span class="spinner"></span> loading…</div>`;
                const resp = await fetch(CSV_URL);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const text = await resp.text();
                const parsed = parseCSV(text);
                if (parsed.length === 0) {
                    container.innerHTML = `<div class="empty-state">⚠️ No data found</div>`;
                    countDisplay.textContent = '0';
                    return;
                }
                allRecords = parsed;
                buildDropdown();
                applyFilters();
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="empty-state" style="color:#b33;">❌ ${e.message}</div>`;
                countDisplay.textContent = 'err';
            }
        }

        window.googleSearch = googleSearch;

        searchInput.addEventListener('input', applyFilters);

        load();
    })();
</script>
</body>
</html>
