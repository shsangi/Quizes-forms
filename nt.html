<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0f" id="tc"><title>My Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme=localStorage.getItem('mn-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark')</script>
<style>
:root,[data-theme=dark]{--bg:#0a0b0f;--el:#111319;--s:#16181f;--s2:#1c1f28;--b:#252832;--b2:#333847;--t:#eceef3;--t2:#9498a5;--t3:#6a6f7e;--br:#0ea5e9;--bt:#7dd3fc;--ok:#22c55e;--er:#ef4444;--wa:#f59e0b;--in:#38bdf8;--sh:0 20px 40px -12px rgba(0,0,0,.55)}
[data-theme=light]{--bg:#f5f8fc;--el:#fff;--s:#fff;--s2:#eef4fb;--b:#dde6f1;--b2:#c3d2e3;--t:#0a1520;--t2:#4a5b6e;--t3:#7a8b9e;--br:#0284c7;--bt:#0284c7;--ok:#16a34a;--er:#dc2626;--wa:#d97706;--in:#0284c7;--sh:0 20px 40px -12px rgba(15,23,42,.25)}
:root{--bs:color-mix(in srgb,var(--br) 12%,transparent);--bb:color-mix(in srgb,var(--br) 30%,transparent)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.55 Inter,system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0)}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
.chip,.ib,.cnum,.ref,.badge,.rc,.cnt,.pct,.tabs small{font-family:'JetBrains Mono',monospace}
.w{max-width:1100px;margin:0 auto;padding:0 14px}
.fbar{display:grid;grid-template-columns:1fr 50px 50px;gap:8px;margin-top:14px}
input,select{width:100%;background:var(--s);border:1.5px solid var(--b);border-radius:12px;outline:0;padding:0 14px;height:48px;font-size:.9rem}
input:focus,select:focus{border-color:var(--br);box-shadow:0 0 0 3px var(--bs)}
.ft,.rf{position:relative;height:48px;border-radius:14px;background:var(--s);border:1.5px solid var(--b);color:var(--t2);font-size:18px}
.ft.on{background:var(--br);border-color:var(--br);color:#fff}
.rf.spin{animation:sp .8s linear}@keyframes sp{to{transform:rotate(360deg)}}
#ftN{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:99px;background:var(--br);color:#fff;font:700 .64rem 'JetBrains Mono';display:none;place-items:center;border:2px solid var(--bg)}#ftN.show{display:grid}
.panel{display:none;margin:8px 0 10px;background:var(--s);border:1px solid var(--b);border-radius:14px;padding:12px;flex-direction:column;gap:10px}.panel.show{display:flex}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.row2{grid-template-columns:1fr}}
.panel select,.ms-m input{height:42px;background:var(--el);border-radius:10px;border-width:1px;font-size:.86rem}
.ms{position:relative}.ms.open{z-index:200}
.ms-t{width:100%;min-height:42px;padding:6px 28px 6px 12px;background:var(--el);border:1px solid var(--b);border-radius:10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;text-align:left;position:relative;font-size:.86rem}
.ms-t.has,.ms.open .ms-t{border-color:var(--br)}.ms-t::after{content:"▾";position:absolute;right:11px;color:var(--t3)}.ms.open .ms-t::after{content:"▴"}
.ph{color:var(--t3)}
.pill,.tag2{display:inline-flex;align-items:center;gap:4px;padding:2px 6px 2px 8px;border-radius:6px;background:var(--bs);border:1px solid var(--bb);color:var(--bt);font-size:.7rem;font-weight:600;white-space:nowrap}
.pill b,.tag2 b{cursor:pointer;opacity:.7;font-style:normal}
.ms-m{display:none;position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:1000;background:var(--el);border:1px solid var(--b2);border-radius:12px;box-shadow:var(--sh);padding:5px;max-height:min(360px,65vh);flex-direction:column;gap:5px}.ms.open .ms-m{display:flex}
.ms-l{overflow-y:auto;flex:1;min-height:0}
.opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.84rem;color:var(--t2);user-select:none}
.opt:hover{background:var(--s2);color:var(--t)}.opt.on{background:var(--bs);color:var(--bt)}
.ck{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--b2);display:grid;place-items:center;font-size:10px;color:transparent;flex-shrink:0}.opt.on .ck{background:var(--br);border-color:var(--br);color:#fff}
.opt span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:.7rem;color:var(--t3);padding:1px 6px;background:var(--s2);border-radius:99px}.cnt.hi{background:var(--bs);color:var(--bt);font-weight:700}

.empty{padding:14px;text-align:center;color:var(--t3);font-size:.76rem}
#reset{padding:11px;border-radius:10px;background:color-mix(in srgb,var(--er) 11%,transparent);border:1px solid color-mix(in srgb,var(--er) 32%,transparent);color:var(--er);font-weight:700;font-size:.82rem}
#reset:hover:not(:disabled){background:var(--er);color:#fff}#reset:disabled{opacity:.4;cursor:not-allowed}
.af{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.72rem;color:var(--t3)}.af:empty{display:none}
.lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);font-weight:700}

.tabs small{font-size:.58rem;color:var(--t3)}.tabs .on{background:var(--br);color:#fff}.tabs .on small{color:rgba(255,255,255,.75)}

.ib b{color:var(--t2)}.ib b.rdn{color:var(--br)}
.pct{padding:1px 6px;margin-left:6px;border-radius:99px;background:var(--bs);border:1px solid var(--bb);color:var(--bt);font-weight:700;font-size:.64rem}.pct.z{background:var(--s2);border-color:var(--b2);color:var(--t3)}
#out{display:flex;flex-direction:column;gap:8px}
#more{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 0 8px;font-size:.72rem;color:var(--t3);text-align:center}
#lm{padding:11px 22px;background:var(--br);border:0;color:#fff;border-radius:10px;font-weight:600}
#ob{margin:8px 0;padding:10px 14px;background:color-mix(in srgb,var(--wa) 11%,transparent);border:1px solid color-mix(in srgb,var(--wa) 32%,transparent);border-radius:10px;font-size:.76rem;color:var(--wa)}
.vimp{--c:var(--er)}.imp{--c:var(--wa)}.note{--c:var(--in)}.other{--c:var(--t3)}
.card{background:var(--s);border:1px solid var(--b);border-radius:11px;padding:12px 14px 10px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:7px;cursor:pointer}
.card:hover{border-color:var(--b2)}.card.open{border-color:var(--br)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--b2))}
.card.rd{background:color-mix(in srgb,var(--ok) 6%,var(--s));border-color:color-mix(in srgb,var(--ok) 32%,transparent)}.card.rd::before{background:var(--ok)}
.ctop,.bot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bot{padding-top:8px;border-top:1px dashed var(--b)}.bl,.br{display:flex;gap:6px;align-items:center}

.badge{padding:3px 8px;border-radius:99px;font-size:.58rem;font-weight:700;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
.ref,.cat{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.ref{padding:3px 9px;border-radius:6px;background:var(--bs);border:1px solid var(--bb);color:var(--bt);font-size:.66rem}
.cat{text-transform:uppercase;font-size:.58rem;letter-spacing:.06em;background:var(--s2);border:1px solid var(--b2);color:var(--t2);padding:3px 8px;border-radius:6px}
.mem{display:-webkit-box;-webkit-line-clamp:20;-webkit-box-orient:vertical;overflow:hidden;font-size:.9rem;font-weight:500;color:var(--t);padding:7px 9px;margin:-2px -3px;border-radius:8px;text-decoration:none;overflow-wrap:anywhere}.mem:hover{background:var(--bs)}
.ric{width:32px;height:32px;border-radius:8px;border:1px solid var(--b);background:var(--s2);color:var(--t2);display:grid;place-items:center;font-size:14px}
.ric.like.on{background:color-mix(in srgb,var(--ok) 15%,transparent);border-color:var(--ok)}.ric.dislike.on{background:color-mix(in srgb,var(--er) 15%,transparent);border-color:var(--er)}
.exp{border:0;background:0}.open .exp{color:var(--br);transform:rotate(180deg)}
.rc{padding:2px 8px;border-radius:99px;background:var(--s2);font-size:.62rem;color:var(--t3);font-weight:700}.rc.h{background:color-mix(in srgb,var(--ok) 11%,transparent);color:var(--ok)}
.st{font-size:.64rem;white-space:nowrap;font-weight:600;color:var(--t3)}.st.read{color:var(--ok)}
.det{display:none;padding-top:10px;border-top:1px solid var(--b)}.open .det{display:block}
.dr{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:6px 0;font-size:.8rem;color:var(--t2)}.dr+.dr{border-top:1px solid var(--b)}
.dr small{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);padding-top:3px}
.state{padding:60px 20px;text-align:center;color:var(--t3)}.state h3{color:var(--t);margin-bottom:6px}
footer{margin:40px 0 20px;padding-top:20px;border-top:1px solid var(--b);text-align:center;color:var(--t3);font-size:.74rem}
.fabs{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));z-index:80;display:flex;flex-direction:column;gap:8px}
.fab{width:42px;height:42px;border-radius:12px;border:1px solid var(--b2);background:var(--el);color:var(--t2);box-shadow:var(--sh);font-size:18px;display:none;place-items:center}.fab.show{display:grid}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);background:var(--el);border:1px solid var(--b2);padding:11px 18px;border-radius:10px;font-size:.82rem;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.25s;z-index:500;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}.toast.ok{border-color:var(--ok)}.toast.err{border-color:var(--er)}
@media(max-width:640px){.w{padding:0 12px}.mem{font-size:.85rem}}
</style></head><body>
<div class="w">
 <div class="fbar"><input id="q" type="search" placeholder="Search rules, sections, memory…" autocomplete="off" spellcheck="false">
  <button class="rf" id="refresh" type="button" title="Refresh">⟳</button>
  <button class="ft" id="ft" type="button" title="Filters">⚙<span id="ftN">0</span></button></div>
 <div class="panel" id="panel">
  <div class="row2"><div class="ms" data-f="category" id="ms-category"></div><div class="ms" data-f="status" id="ms-status"></div></div>
  <div class="row2"><div class="ms" data-f="reference" id="ms-reference"></div>
   <select id="sort"><option value="default">Default order</option><option value="priority">Priority first</option><option value="unread">Unread first</option><option value="most">Most read first</option></select></div>
  <div class="af" id="af"></div>
  <button id="reset" type="button">Reset all filters (<span id="rN">0</span>)</button>
  <div class="lbl">Show</div><div class="tabs" id="tabs"></div>
 </div>
 <div class="infobar"><div class="ib" id="ibL">Loading…</div><div class="ib" id="ibR"></div></div>
 <div id="out"><div class="state">Fetching memory cards…</div></div><div id="more"></div>
 <footer>Data · Google Sheets · Times in Pakistan Standard Time (UTC+5)</footer>
</div>
<div class="fabs"><button class="fab" id="bot">⌄</button><button class="fab" id="topb">⌃</button></div><div class="toast" id="toast"></div>

<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTR3op0RZuTMJ-HegiLJYV18VR97DAnZpcUPRWwMYRfr5pVVf_x6ZOYMfiS8aXIJQcTh2hHpsgqJ8ks/pub?output=csv",
PAGE=200,
RK="mn-read-v2",XK="mn-react-v1",FK="mn-filters-v1",TK="mn-notes-tab-v1",PK="mn-fpanel-open-v1",DK="mn-cache-db-v1",SK="mn-db-synced-v1",SC="mn-scroll-pos-v1";
const $=i=>document.getElementById(i),
esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),
lj=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
sj=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
TZ={timeZone:"Asia/Karachi"},
fmt=(ms,s)=>new Date(ms).toLocaleString("en-US",{...TZ,...(s?{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}:{weekday:"short",month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"})}),
today=()=>new Date().toLocaleDateString("en-CA",TZ),
key=r=>r.category+"||"+r.reference,
gs=a=>"https://www.google.com/search?q="+encodeURIComponent(a.filter(Boolean).join(" ")),
sm=s=>{const l=String(s||"").toLowerCase().replace(/\s/g,"");return["v.imp","vimp","veryimportant","v.important"].includes(l)?["vimp","Very Imp",0]:["imp","important"].includes(l)?["imp","Important",1]:["note","notes"].includes(l)?["note","Note",2]:["other",s||"—",3]},
norm=h=>{h=String(h).trim().toLowerCase();return/^(row|s ?no|sr ?no)$/.test(h)?"row":/^cat/.test(h)?"category":/^ref/.test(h)?"reference":/memory|one.?lin/.test(h)?"memory":/status/.test(h)?"status":h},
FIELDS=["category","status","reference"],PH={category:"All Categories",status:"All Priority",reference:"All References"},LBL={category:"Category",status:"Priority",reference:"Ref"},
TABS=["all","read","unread","liked","disliked"];
let ALL=[],VIEW=[],N=0,busy=0,NOSAVE=0,READ=lj(RK,{}),REACT=lj(XK,{}),TAB=lj(TK,"all"),OPEN=lj(PK,false),
F={q:"",status:[],category:[],reference:[],sort:"default",...lj(FK,{})};
F.reference??=[];delete F.reaction;delete F.read;

let tt;const toast=(m,k="")=>{const e=$("toast");e.className="toast show "+k;e.textContent=m;clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2600)};

/* PWA */
(()=>{const u="data:image/svg+xml;base64,"+btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0ea5e9"/><text x="256" y="350" font-size="300" text-anchor="middle" fill="#fff">✎</text></svg>'),
a=(r,h,t)=>{const l=document.createElement("link");l.rel=r;l.href=h;t&&(l.type=t);document.head.appendChild(l)};
a("icon",u,"image/svg+xml");a("apple-touch-icon",u);
a("manifest",URL.createObjectURL(new Blob([JSON.stringify({name:"My Notes",short_name:"Notes",start_url:".",scope:".",display:"standalone",background_color:"#0a0b0f",theme_color:"#0ea5e9",icons:[{src:u,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]})],{type:"application/manifest+json"})))})();

/* scroll */
const ss=()=>{if(!NOSAVE)try{sessionStorage.setItem(SC,JSON.stringify({y:scrollY,loaded:N,ts:Date.now()}))}catch{}};
let sT;addEventListener("scroll",()=>{clearTimeout(sT);sT=setTimeout(ss,200);const m=document.documentElement.scrollHeight-innerHeight;$("topb").classList.toggle("show",scrollY>300);$("bot").classList.toggle("show",scrollY<m-300&&m>300)},{passive:true});
addEventListener("pagehide",ss);
$("topb").onclick=()=>scrollTo({top:0,behavior:"smooth"});$("bot").onclick=()=>scrollTo({top:1e9,behavior:"smooth"});

/* csv */
function parseCSV(t){const R=[];let r=[],f="",q=0;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'&&t[i+1]=='"'){f+='"';i++}else if(c=='"')q=0;else f+=c}
 else if(c=='"')q=1;else if(c==","){r.push(f);f=""}else if(c=="\n"){r.push(f);R.push(r);r=[];f=""}else if(c!="\r")f+=c}
 if(f||r.length){r.push(f);R.push(r)}return R.filter(r=>r.some(c=>c&&c.trim()))}

/* filtering */
const tabOk=r=>{const k=key(r),x=REACT[k];return TAB=="all"||(TAB=="liked"?x?.type=="like":TAB=="disliked"?x?.type=="dislike":TAB=="read"?!!READ[k]:!READ[k])},
pass=(r,ig)=>FIELDS.every(f=>f==ig||!F[f].length||F[f].includes(r[f]))&&tabOk(r),
nF=()=>(F.q?1:0)+FIELDS.reduce((a,f)=>a+F[f].length,0)+(F.sort!="default"?1:0);
function avail(f){
 const c={};ALL.forEach(r=>{r[f]&&pass(r,f)&&(c[r[f]]=(c[r[f]]||0)+1)});F[f].forEach(v=>c[v]??=0);
 const o=["V.Imp","Imp","Note"],ix=x=>{const i=o.indexOf(x);return i<0?99:i};
 return Object.keys(c).sort((a,b)=>f=="reference"?c[b]-c[a]||a.localeCompare(b):f=="status"?ix(a)-ix(b)||a.localeCompare(b):a.localeCompare(b)).map(v=>({v,n:c[v]}))}

/* multi-selects */
FIELDS.forEach(f=>$("ms-"+f).innerHTML=`<button type="button" class="ms-t"></button><div class="ms-m"><input placeholder="Search…"><div class="ms-l"></div><div class="ms-a"><button data-a="all">Select all</button><button data-a="clear">Clear</button></div></div>`);
function renderMS(f){
 const el=$("ms-"+f),a=avail(f),sel=F[f],q=el.querySelector("input").value.toLowerCase(),mx=Math.max(0,...a.map(o=>o.n)),t=el.querySelector(".ms-t");
 t.classList.toggle("has",!!sel.length);
 t.innerHTML=sel.length?sel.slice(0,2).map(v=>`<span class="pill">${esc(v)}<b data-v="${esc(v)}">✕</b></span>`).join("")+(sel.length>2?`<span class="pill">+${sel.length-2}</span>`:""):`<span class="ph">${PH[f]}</span>`;
 el.querySelector(".ms-l").innerHTML=a.filter(o=>o.v.toLowerCase().includes(q)).map(o=>`<div class="opt${sel.includes(o.v)?" on":""}" data-v="${esc(o.v)}"><span class="ck">✓</span><span>${esc(o.v)}</span><span class="cnt${o.n==mx&&mx>1?" hi":""}">${o.n}</span></div>`).join("")||'<div class="empty">No matches</div>'}
const closeMS=()=>document.querySelectorAll(".ms.open").forEach(m=>m.classList.remove("open"));
document.addEventListener("click",e=>{
 const t=e.target,c=s=>t.closest(s),m=c(".ms"),f=m?.dataset.f;
 if(c(".pill b")){F[f]=F[f].filter(x=>x!=t.dataset.v);return apply()}
 if(c(".ms-t")){const o=m.classList.contains("open");closeMS();if(!o){m.classList.add("open");m.querySelector("input").value="";renderMS(f)}return}
 if(c(".ms-m")){const op=c(".opt"),a=t.dataset.a;
  if(op){const v=op.dataset.v;F[f]=F[f].includes(v)?F[f].filter(x=>x!=v):[...F[f],v];apply()}
  else if(a=="all"){const q=m.querySelector("input").value.toLowerCase();F[f]=[...new Set([...F[f],...avail(f).filter(o=>o.n>0&&o.v.toLowerCase().includes(q)).map(o=>o.v)])];apply()}
  else if(a=="clear"){F[f]=[];apply()}
  return}
 closeMS()});
document.addEventListener("input",e=>{const m=e.target.closest(".ms");m&&renderMS(m.dataset.f)});

/* panel */
const setP=(o,save=1)=>{OPEN=o;$("panel").classList.toggle("show",o);$("ft").classList.toggle("on",o||nF()>0);save&&sj(PK,o);o&&FIELDS.forEach(renderMS)};
$("ft").onclick=()=>setP(!OPEN);setP(OPEN,0);
$("q").oninput=e=>{F.q=e.target.value;apply()};
$("sort").onchange=e=>{F.sort=e.target.value;apply()};
$("reset").onclick=()=>{F={q:"",status:[],category:[],reference:[],sort:"default"};$("q").value="";$("sort").value="default";apply();toast("Filters cleared.","ok")};
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){TAB=b.dataset.t;sj(TK,TAB);apply()}};
$("af").onclick=e=>{const b=e.target.closest("b[data-f]");if(!b)return;const f=b.dataset.f;f=="sort"?(F.sort="default",$("sort").value="default"):F[f]=F[f].filter(x=>x!=b.dataset.v);apply()};
$("more").onclick=e=>e.target.id=="lm"&&grow(N+PAGE);

/* cards */
const det=(r,i)=>{const k=key(r),x=READ[k],rx=REACT[k];return[["Position",`${i+1} of ${VIEW.length}`],["Row",r.row],["Category",r.category],["Reference",r.reference],["Memory",r.memory],["Status",r.status],["Read count",x?`${x.count} day${x.count==1?"":"s"}`:"0"],["First read",x?fmt(x.first):"—"],["Last read",x?fmt(x.last):"—"],["Reaction",rx?(rx.type=="like"?"👍 Liked":"👎 Disliked"):"—"]].map(([l,v])=>`<div class="dr"><small>${l}</small><div>${esc(v||"—")}</div></div>`).join("")},
card=(r,i)=>{const[c,l]=sm(r.status);return`<article class="card ${c}" data-i="${i}"><div class="ctop"><span class="cnum">${i+1} / ${VIEW.length}</span><span class="badge">${esc(l)}</span></div>

<div class="br"><span class="rc"></span><span class="st"></span><button class="ric exp" data-a="exp">▾</button></div></div><div class="det"></div></article>`};
function upd(c){

 if(!x)x={count:1,first:n,last:n,lastDay:d};else{if(x.lastDay!=d){x.count++;x.lastDay=d}x.last=n}
 READ[k]=x;sj(RK,READ)}
$("out").onclick=e=>{

/* info, tabs, tags, badge */
function meta(){
 const rd=VIEW.filter(r=>READ[key(r)]).length,pc=VIEW.length?Math.round(rd*100/VIEW.length):0,

 const tags=[...FIELDS.flatMap(f=>F[f].map(v=>[f,v,LBL[f]+": "+v])),...(F.sort!="default"?[["sort","","Sort: "+$("sort").selectedOptions[0].textContent]]:[])];

 FIELDS.forEach(renderMS)}

function apply(skip){
 const s=F.q.toLowerCase().trim(),cn=r=>READ[key(r)]?.count||0;
 VIEW=ALL.filter(r=>pass(r)&&(!s||[r.category,r.reference,r.memory,r.status,r.row].join(" ").toLowerCase().includes(s)));
 if(F.sort=="priority")VIEW.sort((a,b)=>sm(a.status)[2]-sm(b.status)[2]);

/* data */
function setAll(rows){ALL=rows;FIELDS.forEach(f=>F[f]=F[f].filter(v=>ALL.some(r=>r[f]==v)))}
function banner(on){$("ob")?.remove();if(on){const t=+localStorage.getItem(SK);$("out").insertAdjacentHTML("beforebegin",`<div id="ob">📡 You're offline. Showing <b>${ALL.length}</b> cards from local cache${t?" · last synced "+fmt(t):""}.</div>`)}}
async function fetchData(show){
 if(busy)return;busy=1;const c=lj(DK,null);
 if(c?.rows&&!ALL.length){setAll(c.rows);apply(1)}
 try{
  const res=await fetch(CSV+"&_="+Date.now(),{cache:"no-store"});if(!res.ok)throw Error("HTTP "+res.status);
  const R=parseCSV(await res.text());if(R.length<2)throw Error("Sheet is empty");
  const H=R[0].map(norm);
  setAll(R.slice(1).map(r=>{const o={row:"",category:"",reference:"",memory:"",status:""};H.forEach((h,i)=>h in o&&(o[h]=(r[i]||"").trim()));return o}).filter(o=>o.memory||o.reference));
  sj(DK,{ts:Date.now(),rows:ALL});localStorage.setItem(SK,Date.now());banner(0);apply(1);
  show&&toast(`Refreshed — ${ALL.length} cards loaded & cached.`,"ok");
 }catch(err){
  if(!ALL.length)$("out").innerHTML=`<div class="state"><h3>Could not load data</h3><p>${esc(err.message)}<br><br>No local cache available either. Connect to internet once to save data locally.</p></div>`;
  else if(!$("ob"))banner(1);
  show&&toast("Refresh failed — using cached data","err");
 }finally{busy=0}}
$("refresh").onclick=async function(){this.classList.add("spin");try{await fetchData(1)}finally{setTimeout(()=>this.classList.remove("spin"),850)}};
