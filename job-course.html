<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📊 Subject & Topic Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f4f7fb;
            color: #1a2b3c;
            padding: 0.6rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .app-container { max-width: 1280px; width: 100%; }

        /* TOP BAR */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.4rem;
        }
        .top-bar h1 {
            font-size: 1rem; font-weight: 700; color: #0f2b3d;
            display: flex; align-items: center; gap: 0.3rem;
            letter-spacing: -0.01em;
            transition: 0.2s;
        }
        .top-bar h1 i { color: #2a6b8f; font-size: 0.9rem; }

        .top-bar h1.job-active { color: #0c4b6b; }
        .top-bar h1.job-active i { color: #146a8a; }
        .top-bar h1 .job-title {
            background: linear-gradient(135deg, #d9eaf5, #e0f0fa);
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            color: #0c4b6b;
            font-weight: 700;
            margin-left: 0.2rem;
            border: 1px solid #b8d4e8;
        }

        .sheet-link {
            background: #ffffff; border-radius: 30px; padding: 0.25rem 0.75rem;
            font-size: 0.65rem; font-weight: 600; color: #0f2b3d;
            text-decoration: none; box-shadow: 0 2px 8px rgba(0, 20, 30, 0.06);
            border: 1px solid #e2edf5; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 0.3rem;
            white-space: nowrap;
        }
        .sheet-link i { color: #1a7a5e; font-size: 0.65rem; }
        .sheet-link:hover { background: #f0f7ff; border-color: #b8d4e8; }

        /* STATS */
        .stats-row {
            display: flex; flex-direction: row; gap: 0.4rem;
            margin-bottom: 0.6rem; width: 100%;
            overflow-x: auto; -webkit-overflow-scrolling: touch;
            scrollbar-width: none; padding-bottom: 1px;
        }
        .stats-row::-webkit-scrollbar { display: none; }
        .stat-chip {
            flex: 1 1 0; min-width: 0; background: white;
            border-radius: 10px; padding: 0.35rem 0.4rem;
            box-shadow: 0 2px 8px -4px rgba(0, 30, 50, 0.1);
            border: 1px solid #eef4fa;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; gap: 0.02rem;
        }
        .stat-chip .chip-label {
            font-size: 0.45rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.2px; color: #6a8ba5;
            display: flex; align-items: center; gap: 0.15rem;
            white-space: nowrap; line-height: 1;
        }
        .stat-chip .chip-label i { font-size: 0.45rem; }
        .stat-chip .chip-value {
            font-size: 0.95rem; font-weight: 700; color: #0c334a; line-height: 1.1;
        }
        .stat-chip .chip-value.covered { color: #147a4a; }
        .stat-chip .chip-value.pending { color: #a8690e; }

        /* FILTER BAR */
        .filter-bar {
            background: white; border-radius: 14px;
            padding: 0.6rem 0.8rem;
            box-shadow: 0 3px 12px -5px rgba(0, 30, 50, 0.08);
            border: 1px solid #eef4fa; margin-bottom: 0.8rem;
            display: flex; flex-direction: column; gap: 0.5rem;
        }
        .filter-row-top {
            display: flex; flex-direction: row; gap: 0.5rem;
            align-items: flex-end; flex-wrap: wrap;
        }
        .filter-group {
            flex: 1 1 0; min-width: 100px;
            display: flex; flex-direction: column; gap: 0.05rem;
        }
        .filter-group label {
            font-size: 0.5rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.2px;
            color: #4a6a80; margin-left: 0.15rem;
            display: flex; align-items: center; justify-content: space-between;
        }
        .filter-group label i { margin-right: 2px; font-size: 0.5rem; }
        .filter-group label .count-hint {
            font-size: 0.5rem;
            font-weight: 700;
            color: #8aa4b8;
            background: #f0f5fa;
            padding: 0.05rem 0.35rem;
            border-radius: 30px;
            margin-left: auto;
        }

        /* MULTI-SELECT */
        .multi-select-wrap { position: relative; width: 100%; }
        .multi-select-trigger {
            width: 100%; padding: 0.35rem 0.5rem; border-radius: 10px;
            border: 1.5px solid #d9e6f0; background: #ffffff;
            font-family: 'Inter', sans-serif; font-size: 0.7rem; font-weight: 500;
            color: #1a2b3c; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between;
            gap: 0.3rem; transition: 0.2s; user-select: none; min-height: 30px;
        }
        .multi-select-trigger:hover { border-color: #b0cde0; background: #fafdff; }
        .multi-select-trigger.open {
            border-color: #2a6b8f;
            box-shadow: 0 0 0 2px rgba(42, 107, 143, 0.1);
        }
        .multi-select-trigger .placeholder { color: #8aa4b8; font-weight: 400; }
        .multi-select-trigger .selected-text {
            white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; max-width: 80%;
        }
        .multi-select-trigger i.chevron {
            font-size: 0.6rem; color: #4a6a80; transition: 0.2s;
        }
        .multi-select-trigger.open i.chevron { transform: rotate(180deg); }

        .multi-select-dropdown {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0;
            background: white; border-radius: 10px;
            box-shadow: 0 10px 30px -8px rgba(0, 30, 50, 0.2);
            border: 1px solid #e2edf5; max-height: 200px; overflow-y: auto;
            z-index: 100; display: none; padding: 0.3rem;
        }
        .multi-select-dropdown.open { display: block; }
        .multi-select-search {
            width: 100%; padding: 0.3rem 0.5rem; border-radius: 7px;
            border: 1.5px solid #d9e6f0; font-family: 'Inter', sans-serif;
            font-size: 0.7rem; font-weight: 500; color: #1a2b3c;
            outline: none; transition: 0.2s; margin-bottom: 0.2rem;
            background: #fafdff;
        }
        .multi-select-search:focus {
            border-color: #2a6b8f; background: #ffffff;
            box-shadow: 0 0 0 2px rgba(42, 107, 143, 0.1);
        }
        .multi-select-search::placeholder { color: #8aa4b8; font-weight: 400; }

        .multi-select-option {
            display: flex; align-items: center; gap: 0.35rem;
            padding: 0.3rem 0.4rem; border-radius: 7px; cursor: pointer;
            font-size: 0.7rem; font-weight: 500; color: #1a2b3c;
            transition: 0.15s; user-select: none; word-break: break-word;
        }
        .multi-select-option:hover { background: #f0f7ff; }
        .multi-select-option.selected { background: #e8f2fc; color: #0c4b6b; }
        .multi-select-option .check {
            width: 14px; height: 14px; border-radius: 4px;
            border: 1.5px solid #c0d4e4; display: flex;
            align-items: center; justify-content: center;
            flex-shrink: 0; transition: 0.15s; background: white;
        }
        .multi-select-option.selected .check {
            background: #2a6b8f; border-color: #2a6b8f;
        }
        .multi-select-option .check i {
            font-size: 0.45rem; color: white; opacity: 0; transition: 0.15s;
        }
        .multi-select-option.selected .check i { opacity: 1; }

        .multi-select-actions {
            display: flex; gap: 0.3rem;
            padding: 0.2rem 0.3rem 0.1rem;
            border-top: 1px solid #eef4fa; margin-top: 0.1rem;
        }
        .multi-select-actions button {
            flex: 1; padding: 0.25rem; border-radius: 6px;
            border: 1px solid #d9e6f0; background: white;
            font-family: 'Inter', sans-serif; font-size: 0.6rem;
            font-weight: 600; color: #2c5777; cursor: pointer;
            transition: 0.15s;
        }
        .multi-select-actions button:hover {
            background: #f0f7ff; border-color: #b0cde0;
        }

        /* STATUS CHECKBOXES */
        .status-checkboxes {
            display: flex; align-items: center; gap: 0.6rem;
            flex-wrap: wrap; padding: 0.1rem 0;
        }
        .status-checkboxes .cb-label {
            font-size: 0.5rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.2px;
            color: #4a6a80; display: flex; align-items: center;
            gap: 0.2rem; margin-right: 0.1rem;
        }
        .status-checkboxes .cb-label i { font-size: 0.5rem; }
        .checkbox-item {
            display: flex; align-items: center; gap: 0.3rem;
            cursor: pointer; font-size: 0.7rem; font-weight: 500;
            color: #1a2b3c; user-select: none;
            padding: 0.15rem 0.5rem 0.15rem 0.2rem;
            border-radius: 20px; transition: 0.15s;
            border: 1px solid transparent;
        }
        .checkbox-item:hover { background: #f0f7ff; }
        .checkbox-item .cb-box {
            width: 16px; height: 16px; border-radius: 4px;
            border: 2px solid #c0d4e4;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: 0.15s; background: white;
        }
        .checkbox-item.checked .cb-box {
            background: #2a6b8f; border-color: #2a6b8f;
        }
        .checkbox-item .cb-box i {
            font-size: 0.5rem; color: white; opacity: 0; transition: 0.15s;
        }
        .checkbox-item.checked .cb-box i { opacity: 1; }
        .checkbox-item.covered .cb-box { border-color: #2e9b6e; }
        .checkbox-item.covered.checked .cb-box {
            background: #2e9b6e; border-color: #2e9b6e;
        }
        .checkbox-item.pending .cb-box { border-color: #e6a017; }
        .checkbox-item.pending.checked .cb-box {
            background: #e6a017; border-color: #e6a017;
        }
        .checkbox-item .cb-text { font-size: 0.7rem; font-weight: 500; }

        /* CARDS GRID */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 0.6rem; width: 100%;
        }

        /* CARD */
        .topic-card {
            background: white; border-radius: 12px;
            padding: 0.6rem 0.75rem;
            box-shadow: 0 3px 12px -6px rgba(0, 30, 50, 0.1);
            border: 1px solid #eef4fa; transition: 0.2s;
            display: flex; flex-direction: column; gap: 0.25rem;
            font-size: 0.75rem; line-height: 1.3; position: relative;
            overflow: hidden; word-break: break-word; overflow-wrap: break-word;
        }
        .topic-card:hover {
            box-shadow: 0 6px 18px -6px rgba(0, 50, 80, 0.15);
            transform: translateY(-1px); border-color: #d9e6f2;
        }
        .topic-card.covered { border-left: 3px solid #2e9b6e; }
        .topic-card.pending { border-left: 3px solid #e6a017; cursor: pointer; }
        .topic-card.pending:hover { background: #fffdf7; }

        .card-job-badge {
            position: absolute;
            top: 0.4rem;
            right: 0.5rem;
            background: #f0f7ff;
            color: #18668a;
            font-size: 0.5rem;
            font-weight: 700;
            padding: 0.1rem 0.4rem;
            border-radius: 30px;
            border: 1px solid #cfe2f0;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            max-width: 45%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 1;
        }

        /* Row 1 */
        .card-top-row {
            display: flex; align-items: flex-start; gap: 0.4rem;
            margin-bottom: 0.05rem; flex-wrap: wrap;
            padding-right: 0.2rem;
        }
        .card-subtopic {
            display: flex; align-items: flex-start; gap: 0.3rem;
            min-width: 0; flex: 1 1 auto;
            overflow-wrap: break-word; word-break: break-word;
        }
        .card-srno {
            background: #e9f0f7; border-radius: 30px;
            padding: 0.05rem 0.4rem; font-size: 0.55rem;
            font-weight: 700; color: #1a4a66;
            white-space: nowrap; flex-shrink: 0; margin-top: 0.1rem;
        }
        .subtopic-name {
            font-weight: 700; color: #0c334a; font-size: 0.85rem;
            word-break: break-word; overflow-wrap: break-word; line-height: 1.25;
            text-decoration: none;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
        }
        .subtopic-name:hover {
            color: #18668a;
            text-decoration: underline;
        }
        .subtopic-name .search-icon {
            font-size: 0.6rem;
            opacity: 0.5;
            transition: 0.15s;
        }
        .subtopic-name:hover .search-icon { opacity: 1; }

        /* Row 2 */
        .card-main-topic-row {
            display: flex; align-items: center; gap: 0.3rem;
            flex-wrap: wrap; margin-bottom: 0.02rem;
            word-break: break-word; overflow-wrap: break-word;
        }
        .main-topic-group {
            display: inline-flex; align-items: center; gap: 0.3rem;
            flex-wrap: wrap; max-width: 100%;
        }
        .main-topic-name {
            font-weight: 600; color: #1f3d51; font-size: 0.78rem;
            word-break: break-word; overflow-wrap: break-word;
        }
        .count-badge-style {
            background: #e0f0fa; color: #146a8a;
            font-size: 0.55rem; font-weight: 700;
            padding: 0.05rem 0.4rem; border-radius: 30px;
            white-space: nowrap; flex-shrink: 0;
        }

        /* Row 3: Subject + status + PDF (right-aligned) */
        .card-subject-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 0.4rem; flex-wrap: wrap;
            word-break: break-word; overflow-wrap: break-word;
        }
        .card-subject-left {
            display: flex; align-items: center; flex-wrap: wrap;
            gap: 0.25rem 0.4rem; flex: 1 1 auto; min-width: 0;
        }
        .card-subject {
            font-weight: 500; color: #1f3d51; font-size: 0.7rem;
            display: flex; align-items: center; gap: 0.2rem;
            flex: 1 1 auto; word-break: break-word; overflow-wrap: break-word;
        }

        /* Subject coverage percentage pill (replaces marks %) */
        .card-coverage {
            background: #e2f5ec;
            color: #147a4a;
            padding: 0.05rem 0.4rem;
            border-radius: 30px;
            font-size: 0.55rem;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
            border: 1px solid #b8e0cd;
        }
        .card-coverage.full {
            background: #d0ede0;
            border-color: #9fd4b9;
        }
        .card-coverage.low {
            background: #fef3e0;
            color: #a8690e;
            border-color: #f2d9a8;
        }

        /* Right-side cluster: status badge + PDF link */
        .card-right-cluster {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-shrink: 0;
            margin-left: auto;
        }

        /* Status badges */
        .status-badge-inline {
            display: inline-flex; align-items: center; gap: 0.2rem;
            padding: 0.1rem 0.5rem 0.1rem 0.25rem;
            border-radius: 30px; font-size: 0.6rem; font-weight: 700;
            white-space: nowrap; flex-shrink: 0; text-decoration: none;
            transition: 0.2s; border: 1px solid transparent;
        }
        .status-badge-inline.covered {
            background: #e2f5ec; color: #147a4a; border-color: #b8e0cd;
        }
        .status-badge-inline.covered:hover {
            background: #d0ede0; border-color: #9fd4b9;
        }
        .status-badge-inline.pending {
            background: #fef3e0; color: #a8690e; border-color: #f2d9a8;
        }
        .status-badge-inline.pending:hover {
            background: #fde9c8; border-color: #e8c892;
        }
        .status-badge-inline .status-check {
            display: inline-flex; align-items: center; justify-content: center;
            width: 13px; height: 13px; border-radius: 50%;
            flex-shrink: 0; font-size: 0.45rem;
        }
        .status-badge-inline.covered .status-check {
            background: #2e9b6e; color: white;
        }
        .status-badge-inline.pending .status-check {
            background: #e6a017; color: white;
        }
        .status-badge-inline .external-icon {
            font-size: 0.45rem; margin-left: 0.05rem; opacity: 0.7;
        }
        .status-badge-inline.pending .copy-icon {
            font-size: 0.45rem; margin-left: 0.1rem; opacity: 0.75;
        }

        /* PDF link (right-most) */
        .pdf-link {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background: #fff0f0;
            color: #b91c1c;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.1rem 0.5rem 0.1rem 0.3rem;
            border-radius: 30px;
            text-decoration: none;
            border: 1px solid #f3c0c0;
            transition: 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .pdf-link:hover {
            background: #ffe0e0;
            border-color: #e89a9a;
            color: #991b1b;
        }
        .pdf-link i {
            font-size: 0.55rem;
        }
        .pdf-link .pdf-label {
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            background: #0f2b3d;
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            box-shadow: 0 8px 24px -6px rgba(0, 20, 40, 0.4);
            z-index: 1000;
            display: none;
            align-items: center;
            gap: 0.5rem;
            max-width: 90vw;
            word-break: break-word;
            pointer-events: none;
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast.show {
            display: flex;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast i { color: #4ade80; font-size: 0.85rem; }

        /* STATE MESSAGES */
        .state-message {
            padding: 2.5rem 1.5rem; text-align: center;
            background: white; border-radius: 24px;
            font-weight: 500; color: #2c5777;
            box-shadow: 0 6px 20px -8px rgba(0, 30, 50, 0.1);
            border: 1px solid #eef4fa; grid-column: 1 / -1;
        }
        .state-message i {
            font-size: 1.8rem; color: #6f9cbb;
            margin-bottom: 0.6rem; display: block;
        }
        .spinner {
            display: inline-block; width: 1.6rem; height: 1.6rem;
            border: 3px solid #d3e6f2; border-radius: 50%;
            border-top-color: #2a6b8f;
            animation: spin 0.8s linear infinite; margin-bottom: 0.8rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* MOBILE */
        @media (max-width: 640px) {
            body { padding: 0.4rem; }
            .top-bar h1 { font-size: 0.85rem; }
            .top-bar h1 .job-title { font-size: 0.8rem; }
            .stat-chip { padding: 0.3rem 0.25rem; border-radius: 8px; }
            .stat-chip .chip-value { font-size: 0.85rem; }
            .stat-chip .chip-label { font-size: 0.4rem; }
            .stat-chip .chip-label i { font-size: 0.4rem; }
            .filter-row-top {
                flex-direction: row; gap: 0.4rem;
                align-items: flex-end; flex-wrap: wrap;
            }
            .filter-group { flex: 1 1 0; min-width: 80px; }
            .cards-grid { grid-template-columns: 1fr; gap: 0.5rem; }
            .topic-card { padding: 0.5rem 0.65rem; }
            .subtopic-name { font-size: 0.8rem; }
            .status-checkboxes { gap: 0.4rem; }
            .filter-bar { padding: 0.5rem 0.6rem; }
            .card-job-badge { font-size: 0.45rem; }
        }

        @media (max-width: 380px) {
            .stat-chip .chip-label { font-size: 0.35rem; }
            .stat-chip .chip-value { font-size: 0.75rem; }
            .checkbox-item .cb-text { font-size: 0.65rem; }
            .subtopic-name { font-size: 0.75rem; }
            .card-srno { font-size: 0.5rem; padding: 0.05rem 0.3rem; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-bar">
            <h1 id="pageTitle"><i class="fas fa-graduation-cap"></i> <span id="titleText">Subject & Topic Tracker</span></h1>
            <a href="https://docs.google.com/spreadsheets/d/1D_wCGy3Rks9MXt84qpC4Ea2Qjo3uSgm0b-JBIh2_mmc/edit?gid=0#gid=0"
               class="sheet-link" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-table"></i> Sheet
            </a>
        </div>

        <div class="stats-row">
            <div class="stat-chip">
                <div class="chip-label"><i class="fas fa-layer-group"></i> Total</div>
                <div class="chip-value" id="statTotal">0</div>
            </div>
            <div class="stat-chip">
                <div class="chip-label"><i class="fas fa-check-circle"></i> Done</div>
                <div class="chip-value covered" id="statCovered">0</div>
            </div>
            <div class="stat-chip">
                <div class="chip-label"><i class="fas fa-clock"></i> Pending</div>
                <div class="chip-value pending" id="statPending">0</div>
            </div>
            <div class="stat-chip">
                <div class="chip-label"><i class="fas fa-book"></i> Subjects</div>
                <div class="chip-value" id="statSubjects">0</div>
            </div>
        </div>

        <div class="filter-bar">
            <div class="filter-row-top">
                <div class="filter-group">
                    <label><i class="fas fa-book"></i> Subject <span class="count-hint" id="subjectCountHint">0</span></label>
                    <div class="multi-select-wrap" id="subjectMultiWrap">
                        <div class="multi-select-trigger" id="subjectTrigger">
                            <span class="placeholder" id="subjectPlaceholder">All subjects</span>
                            <i class="fas fa-chevron-down chevron"></i>
                        </div>
                        <div class="multi-select-dropdown" id="subjectDropdown"></div>
                    </div>
                </div>

                <div class="filter-group">
                    <label><i class="fas fa-tag"></i> Topic <span class="count-hint" id="topicCountHint">0</span></label>
                    <div class="multi-select-wrap" id="topicMultiWrap">
                        <div class="multi-select-trigger" id="topicTrigger">
                            <span class="placeholder" id="topicPlaceholder">All topics</span>
                            <i class="fas fa-chevron-down chevron"></i>
                        </div>
                        <div class="multi-select-dropdown" id="topicDropdown"></div>
                    </div>
                </div>

                <div class="filter-group">
                    <label><i class="fas fa-briefcase"></i> Job <span class="count-hint" id="jobCountHint">0</span></label>
                    <div class="multi-select-wrap" id="jobMultiWrap">
                        <div class="multi-select-trigger" id="jobTrigger">
                            <span class="placeholder" id="jobPlaceholder">All jobs</span>
                            <i class="fas fa-chevron-down chevron"></i>
                        </div>
                        <div class="multi-select-dropdown" id="jobDropdown"></div>
                    </div>
                </div>
            </div>

            <div class="status-checkboxes">
                <span class="cb-label"><i class="fas fa-check-circle"></i> Status</span>
                <div class="checkbox-item covered checked" id="cbCovered" data-status="covered">
                    <span class="cb-box"><i class="fas fa-check"></i></span>
                    <span class="cb-text">Done</span>
                </div>
                <div class="checkbox-item pending checked" id="cbPending" data-status="pending">
                    <span class="cb-box"><i class="fas fa-check"></i></span>
                    <span class="cb-text">Pending</span>
                </div>
            </div>
        </div>

        <div id="cardsContainer" class="cards-grid"></div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Copied!</span>
    </div>

    <script>
        (function() {
            const SHEET_ID = '1D_wCGy3Rks9MXt84qpC4Ea2Qjo3uSgm0b-JBIh2_mmc';
            const GID = '0';
            const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;

            const cardsContainer = document.getElementById('cardsContainer');
            const statTotal = document.getElementById('statTotal');
            const statCovered = document.getElementById('statCovered');
            const statPending = document.getElementById('statPending');
            const statSubjects = document.getElementById('statSubjects');
            const cbCovered = document.getElementById('cbCovered');
            const cbPending = document.getElementById('cbPending');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const pageTitle = document.getElementById('pageTitle');
            const titleText = document.getElementById('titleText');

            const subjectCountHint = document.getElementById('subjectCountHint');
            const topicCountHint = document.getElementById('topicCountHint');
            const jobCountHint = document.getElementById('jobCountHint');

            let rawData = [];
            let filteredData = [];
            let selectedSubjects = new Set();
            let selectedTopics = new Set();
            let selectedJobs = new Set();
            let selectedStatuses = new Set(['covered', 'pending']);

            let subjectCounts = {};
            let mainTopicCounts = {};
            // Coverage map: per subject → { total, done }
            let subjectCoverage = {};

            let toastTimer = null;
            let lastToastTime = 0;
            const TOAST_DEBOUNCE_MS = 800;

            let rebuildSubjectSelect = null;
            let rebuildTopicSelect = null;
            let rebuildJobSelect = null;

            function parseCSV(csvText) {
                const rows = [];
                let currentRow = [];
                let currentField = '';
                let insideQuotes = false;

                for (let i = 0; i < csvText.length; i++) {
                    const char = csvText[i];
                    const nextChar = csvText[i + 1];

                    if (char === '"') {
                        if (insideQuotes && nextChar === '"') {
                            currentField += '"';
                            i++;
                        } else {
                            insideQuotes = !insideQuotes;
                        }
                    } else if (char === ',' && !insideQuotes) {
                        currentRow.push(currentField);
                        currentField = '';
                    } else if (char === '\n' && !insideQuotes) {
                        currentRow.push(currentField);
                        if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0].trim() !== '')) {
                            rows.push(currentRow);
                        }
                        currentRow = [];
                        currentField = '';
                    } else if (char === '\r') {
                        continue;
                    } else {
                        currentField += char;
                    }
                }
                if (currentField !== '' || currentRow.length > 0) {
                    currentRow.push(currentField);
                    if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0].trim() !== '')) {
                        rows.push(currentRow);
                    }
                }
                return rows;
            }

            // ============ 7-COLUMN PARSER ============
            // A: Srno | B: Subject with Marks | C: Topic | D: Subtopic
            // E: job | F: URL | G: pdf files url
            function mapRowsToObjects(rows) {
                if (!rows.length) return [];
                const dataRows = rows.slice(1);
                const result = [];

                for (const row of dataRows) {
                    if (row.length < 3) continue;

                    const srno = (row[0] || '').trim();
                    const subjectWithMarks = (row[1] || '').trim();
                    const mainTopic = (row[2] || '').trim();
                    const subTopic = (row[3] || '').trim();
                    const job = (row[4] || '').trim();
                    const url = (row[5] || '').trim();
                    const pdfUrl = (row[6] || '').trim();

                    // Marks parsing kept internally for legacy, but not displayed
                    let subject = subjectWithMarks;
                    let marks = '';
                    const marksMatch = subjectWithMarks.match(/;\s*(\d+)\s*$/);
                    if (marksMatch) {
                        marks = marksMatch[1];
                        subject = subjectWithMarks.replace(/;\s*\d+\s*$/, '').trim();
                    }

                    const hasUrl = url && url !== '#' && url !== '—' && url.trim() !== '';
                    const hasPdf = pdfUrl && pdfUrl !== '#' && pdfUrl !== '—' && pdfUrl.trim() !== '';
                    const status = hasUrl ? 'covered' : 'pending';
                    const displayTopic = subTopic || mainTopic;

                    result.push({
                        srno: srno || '—',
                        subject: subject || '—',
                        marks: marks || '—',
                        mainTopic: mainTopic || '—',
                        subTopic: subTopic || '—',
                        displayTopic: displayTopic || '—',
                        url: hasUrl ? url : '#',
                        hasUrl: hasUrl,
                        pdfUrl: hasPdf ? pdfUrl : '',
                        hasPdf: hasPdf,
                        status: status,
                        job: job || '—'
                    });
                }
                return result;
            }

            function computeCounts(data) {
                subjectCounts = {};
                mainTopicCounts = {};
                subjectCoverage = {};

                data.forEach(item => {
                    if (item.subject && item.subject !== '—') {
                        subjectCounts[item.subject] = (subjectCounts[item.subject] || 0) + 1;
                        if (!subjectCoverage[item.subject]) {
                            subjectCoverage[item.subject] = { total: 0, done: 0 };
                        }
                        subjectCoverage[item.subject].total += 1;
                        if (item.status === 'covered') {
                            subjectCoverage[item.subject].done += 1;
                        }
                    }
                    const key = item.mainTopic;
                    if (key && key !== '—') {
                        mainTopicCounts[key] = (mainTopicCounts[key] || 0) + 1;
                    }
                });
            }

            function getSubjectCoveragePct(subject) {
                const c = subjectCoverage[subject];
                if (!c || c.total === 0) return 0;
                return Math.round((c.done / c.total) * 100);
            }

            function updateStats(data) {
                const total = data.length;
                const covered = data.filter(d => d.status === 'covered').length;
                const pending = data.filter(d => d.status === 'pending').length;
                const subjects = new Set(data.map(d => d.subject).filter(s => s !== '—')).size;

                statTotal.textContent = total;
                statCovered.textContent = covered;
                statPending.textContent = pending;
                statSubjects.textContent = subjects;
            }

            function updatePageTitle() {
                if (selectedJobs.size === 1) {
                    const jobName = Array.from(selectedJobs)[0];
                    pageTitle.classList.add('job-active');
                    titleText.innerHTML = `Topic Tracker: <span class="job-title">${escapeHtml(jobName)}</span>`;
                } else {
                    pageTitle.classList.remove('job-active');
                    titleText.textContent = 'Subject & Topic Tracker';
                }
            }

            function getAvailableOptions(excludeFilter) {
                const activeSubjects = excludeFilter === 'subject' ? new Set() : selectedSubjects;
                const activeTopics = excludeFilter === 'topic' ? new Set() : selectedTopics;
                const activeJobs = excludeFilter === 'job' ? new Set() : selectedJobs;

                const subjects = new Set();
                const topics = new Set();
                const jobs = new Set();

                rawData.forEach(item => {
                    if (activeSubjects.size > 0 && !activeSubjects.has(item.subject)) return;
                    if (activeTopics.size > 0 && !activeTopics.has(item.displayTopic)) return;
                    if (activeJobs.size > 0 && !activeJobs.has(item.job)) return;
                    if (selectedStatuses.size > 0 && !selectedStatuses.has(item.status)) return;

                    if (item.subject && item.subject !== '—') subjects.add(item.subject);
                    if (item.displayTopic && item.displayTopic !== '—') topics.add(item.displayTopic);
                    if (item.job && item.job !== '—') jobs.add(item.job);
                });

                return {
                    subjects: Array.from(subjects).sort(),
                    topics: Array.from(topics).sort(),
                    jobs: Array.from(jobs).sort()
                };
            }

            function pruneSelections() {
                const available = getAvailableOptions('none');
                let changed = false;

                Array.from(selectedSubjects).forEach(s => {
                    if (!available.subjects.includes(s)) {
                        selectedSubjects.delete(s);
                        changed = true;
                    }
                });
                Array.from(selectedTopics).forEach(t => {
                    if (!available.topics.includes(t)) {
                        selectedTopics.delete(t);
                        changed = true;
                    }
                });
                Array.from(selectedJobs).forEach(j => {
                    if (!available.jobs.includes(j)) {
                        selectedJobs.delete(j);
                        changed = true;
                    }
                });

                return changed;
            }

            function buildMultiSelect(container, options, selectedSet, onUpdate, enableSearch) {
                const dropdown = container.querySelector('.multi-select-dropdown');
                const trigger = container.querySelector('.multi-select-trigger');
                const placeholder = container.querySelector('.placeholder');

                function rebuild(newOptions) {
                    dropdown.innerHTML = '';

                    let searchInput = null;
                    if (enableSearch) {
                        searchInput = document.createElement('input');
                        searchInput.type = 'text';
                        searchInput.className = 'multi-select-search';
                        searchInput.placeholder = 'Search...';
                        searchInput.addEventListener('input', () => renderDropdown(searchInput.value));
                        searchInput.addEventListener('click', (e) => e.stopPropagation());
                        dropdown.appendChild(searchInput);
                    }

                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'multi-select-actions';
                    const selectAllBtn = document.createElement('button');
                    selectAllBtn.textContent = 'All';
                    selectAllBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const visibleOpts = newOptions.filter(opt => {
                            if (!searchInput || !searchInput.value) return true;
                            return opt.label.toLowerCase().includes(searchInput.value.toLowerCase());
                        });
                        visibleOpts.forEach(opt => selectedSet.add(opt.value));
                        onUpdate(); updateTriggerText();
                        renderDropdown(searchInput ? searchInput.value : '');
                    });
                    const clearAllBtn = document.createElement('button');
                    clearAllBtn.textContent = 'Clear';
                    clearAllBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectedSet.clear();
                        onUpdate(); updateTriggerText();
                        renderDropdown(searchInput ? searchInput.value : '');
                    });
                    actionsDiv.appendChild(selectAllBtn);
                    actionsDiv.appendChild(clearAllBtn);
                    dropdown.appendChild(actionsDiv);

                    function renderDropdown(filterText) {
                        const existingOptions = dropdown.querySelectorAll('.multi-select-option');
                        existingOptions.forEach(el => el.remove());

                        let filteredOptions = newOptions;
                        if (filterText && filterText.trim() !== '') {
                            const q = filterText.toLowerCase().trim();
                            filteredOptions = newOptions.filter(opt => opt.label.toLowerCase().includes(q));
                        }

                        if (filteredOptions.length === 0) {
                            const emptyDiv = document.createElement('div');
                            emptyDiv.className = 'multi-select-option';
                            emptyDiv.style.opacity = '0.5';
                            emptyDiv.style.cursor = 'default';
                            emptyDiv.innerHTML = `<span style="padding: 0.2rem 0;">No matches</span>`;
                            dropdown.appendChild(emptyDiv);
                            return;
                        }

                        filteredOptions.forEach(opt => {
                            const div = document.createElement('div');
                            div.className = 'multi-select-option' + (selectedSet.has(opt.value) ? ' selected' : '');
                            div.innerHTML = `
                                <span class="check"><i class="fas fa-check"></i></span>
                                <span>${escapeHtml(opt.label)}</span>
                            `;
                            div.addEventListener('click', (e) => {
                                e.stopPropagation();
                                if (selectedSet.has(opt.value)) {
                                    selectedSet.delete(opt.value);
                                } else {
                                    selectedSet.add(opt.value);
                                }
                                onUpdate(); updateTriggerText();
                                renderDropdown(searchInput ? searchInput.value : '');
                            });
                            dropdown.appendChild(div);
                        });
                    }

                    function updateTriggerText() {
                        if (selectedSet.size === 0) {
                            placeholder.textContent = 'All ' + (container.dataset.type || 'items');
                            placeholder.style.display = 'inline';
                            let existing = trigger.querySelector('.selected-text');
                            if (existing) existing.remove();
                        } else {
                            placeholder.style.display = 'none';
                            let selectedText = trigger.querySelector('.selected-text');
                            if (!selectedText) {
                                selectedText = document.createElement('span');
                                selectedText.className = 'selected-text';
                                trigger.insertBefore(selectedText, trigger.querySelector('.chevron'));
                            }
                            selectedText.textContent = `${selectedSet.size} sel`;
                            selectedText.style.display = 'inline';
                        }
                    }

                    if (!trigger.dataset.listenerAttached) {
                        trigger.dataset.listenerAttached = '1';
                        trigger.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const isOpen = dropdown.classList.contains('open');
                            document.querySelectorAll('.multi-select-dropdown.open').forEach(d => d.classList.remove('open'));
                            document.querySelectorAll('.multi-select-trigger.open').forEach(t => t.classList.remove('open'));
                            if (!isOpen) {
                                dropdown.classList.add('open');
                                trigger.classList.add('open');
                                if (searchInput) {
                                    searchInput.value = '';
                                    setTimeout(() => searchInput.focus(), 50);
                                }
                                renderDropdown('');
                            }
                        });

                        document.addEventListener('click', (e) => {
                            if (!container.contains(e.target)) {
                                dropdown.classList.remove('open');
                                trigger.classList.remove('open');
                            }
                        });
                    }

                    rebuild._render = renderDropdown;
                    rebuild._updateText = updateTriggerText;

                    renderDropdown('');
                    updateTriggerText();
                }

                rebuild(options);
                return rebuild;
            }

            function setupStatusCheckboxes() {
                cbCovered.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleStatus('covered', cbCovered);
                });
                cbPending.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleStatus('pending', cbPending);
                });
            }

            function toggleStatus(status, el) {
                if (selectedStatuses.has(status)) {
                    selectedStatuses.delete(status);
                    el.classList.remove('checked');
                } else {
                    selectedStatuses.add(status);
                    el.classList.add('checked');
                }
                refreshAllFilters();
                applyFiltersAndRender();
            }

            function refreshAllFilters() {
                pruneSelections();

                const availForSubject = getAvailableOptions('subject');
                const availForTopic = getAvailableOptions('topic');
                const availForJob = getAvailableOptions('job');

                const subjectOpts = availForSubject.subjects.map(s => ({ value: s, label: s }));
                const topicOpts = availForTopic.topics.map(t => ({ value: t, label: t }));
                const jobOpts = availForJob.jobs.map(j => ({ value: j, label: j }));

                subjectCountHint.textContent = subjectOpts.length;
                topicCountHint.textContent = topicOpts.length;
                jobCountHint.textContent = jobOpts.length;

                if (rebuildSubjectSelect) rebuildSubjectSelect(subjectOpts);
                if (rebuildTopicSelect) rebuildTopicSelect(topicOpts);
                if (rebuildJobSelect) rebuildJobSelect(jobOpts);
            }

            function applyFiltersAndRender() {
                filteredData = rawData.filter(item => {
                    if (selectedSubjects.size > 0 && !selectedSubjects.has(item.subject)) return false;
                    if (selectedTopics.size > 0 && !selectedTopics.has(item.displayTopic)) return false;
                    if (selectedJobs.size > 0 && !selectedJobs.has(item.job)) return false;
                    if (selectedStatuses.size > 0 && !selectedStatuses.has(item.status)) return false;
                    return true;
                });
                updateStats(filteredData);
                updatePageTitle();
                renderCards(filteredData);
            }

            function onFilterChange() {
                refreshAllFilters();
                applyFiltersAndRender();
            }

            function buildGoogleSearchQuery(item) {
                const parts = [];
                if (item.subTopic && item.subTopic !== '—') parts.push(item.subTopic);
                if (item.mainTopic && item.mainTopic !== '—') parts.push(item.mainTopic);
                if (item.subject && item.subject !== '—') parts.push(item.subject);
                if (item.job && item.job !== '—') parts.push(item.job);
                return parts.join(' ');
            }

            function buildPrompt(item) {
                const jobTitle = (item.job && item.job !== '—') ? item.job : null;
                const fallbackTitle = (item.mainTopic && item.mainTopic !== '—') ? item.mainTopic : 'this topic';
                const title = jobTitle || fallbackTitle;

                return `Prepare me on ${item.subTopic} 20 mcqs with detail solution for ${title} exam.

It should be:
Srno
Mcq question
Choices
Detail solution
Correct answer as per choices`;
            }

            function copyPrompt(item) {
                const text = buildPrompt(item);
                const success = fallbackCopy(text);
                if (success) {
                    showToast(`Copied "${item.subTopic}" prompt`);
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast(`Copied "${item.subTopic}" prompt`);
                    }).catch((err) => {
                        console.error('Clipboard write failed:', err);
                        showToast('Copy failed — please copy manually');
                    });
                } else {
                    showToast('Copy failed — please copy manually');
                }
            }

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.top = '0';
                textarea.style.left = '0';
                textarea.style.width = '2em';
                textarea.style.height = '2em';
                textarea.style.padding = '0';
                textarea.style.border = 'none';
                textarea.style.outline = 'none';
                textarea.style.boxShadow = 'none';
                textarea.style.background = 'transparent';
                textarea.style.opacity = '0';
                textarea.setAttribute('readonly', '');
                textarea.setAttribute('aria-hidden', 'true');
                document.body.appendChild(textarea);
                let success = false;
                try {
                    textarea.focus();
                    textarea.select();
                    textarea.setSelectionRange(0, text.length);
                    success = document.execCommand('copy');
                } catch (err) {
                    console.warn('execCommand copy failed:', err);
                    success = false;
                }
                document.body.removeChild(textarea);
                return success;
            }

            function showToast(msg) {
                const now = Date.now();
                if (now - lastToastTime < TOAST_DEBOUNCE_MS && toast.classList.contains('show')) {
                    toastMessage.textContent = msg;
                    if (toastTimer) clearTimeout(toastTimer);
                    toastTimer = setTimeout(() => {
                        toast.classList.remove('show');
                    }, 1800);
                    lastToastTime = now;
                    return;
                }
                lastToastTime = now;
                toastMessage.textContent = msg;
                toast.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 1800);
            }

            function renderCards(data) {
                if (!data.length) {
                    cardsContainer.innerHTML = `
                        <div class="state-message">
                            <i class="fas fa-search"></i>
                            No matching topics found.<br>
                            <span style="font-size:0.75rem; opacity:0.7;">Try adjusting filters</span>
                        </div>`;
                    return;
                }

                const showJobBadge = selectedJobs.size === 0;
                const fragment = document.createDocumentFragment();

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `topic-card ${item.status === 'covered' ? 'covered' : 'pending'}`;

                    if (item.status === 'pending') {
                        card.title = 'Click to copy DeepSeek prompt';
                        card.addEventListener('click', (e) => {
                            if (e.target.closest('.status-badge-inline')) return;
                            if (e.target.closest('.subtopic-name')) return;
                            if (e.target.closest('.pdf-link')) return;
                            copyPrompt(item);
                        });
                    }

                    if (showJobBadge && item.job && item.job !== '—') {
                        const jobBadge = document.createElement('span');
                        jobBadge.className = 'card-job-badge';
                        jobBadge.textContent = item.job;
                        jobBadge.title = `Job: ${item.job}`;
                        card.appendChild(jobBadge);
                    }

                    // ROW 1: Srno + Subtopic
                    const topRow = document.createElement('div');
                    topRow.className = 'card-top-row';
                    const subtopicDiv = document.createElement('div');
                    subtopicDiv.className = 'card-subtopic';

                    const srnoSpan = document.createElement('span');
                    srnoSpan.className = 'card-srno';
                    srnoSpan.textContent = `#${item.srno}`;
                    subtopicDiv.appendChild(srnoSpan);

                    const subtopicLink = document.createElement('a');
                    subtopicLink.className = 'subtopic-name';
                    subtopicLink.href = `https://www.google.com/search?q=${encodeURIComponent(buildGoogleSearchQuery(item))}`;
                    subtopicLink.target = '_blank';
                    subtopicLink.rel = 'noopener noreferrer';
                    subtopicLink.title = 'Search on Google: ' + buildGoogleSearchQuery(item);
                    subtopicLink.innerHTML = `
                        ${escapeHtml(item.subTopic !== '—' ? item.subTopic : '—')}
                        <i class="fas fa-search search-icon"></i>
                    `;
                    subtopicLink.addEventListener('click', (e) => e.stopPropagation());
                    subtopicDiv.appendChild(subtopicLink);

                    topRow.appendChild(subtopicDiv);
                    card.appendChild(topRow);

                    // ROW 2: Main topic + count
                    const mainTopicRow = document.createElement('div');
                    mainTopicRow.className = 'card-main-topic-row';
                    const mainCount = mainTopicCounts[item.mainTopic] || 1;
                    const mainGroup = document.createElement('span');
                    mainGroup.className = 'main-topic-group';
                    mainGroup.innerHTML = `
                        <span class="main-topic-name">${escapeHtml(item.mainTopic)}</span>
                        <span class="count-badge-style">${mainCount}</span>
                    `;
                    mainTopicRow.appendChild(mainGroup);
                    card.appendChild(mainTopicRow);

                    // ===== ROW 3: Subject + coverage% + status + PDF (right-most) =====
                    const subjectRow = document.createElement('div');
                    subjectRow.className = 'card-subject-row';

                    const leftSide = document.createElement('div');
                    leftSide.className = 'card-subject-left';

                    // Subject coverage percentage pill (replaces marks)
                    const covPct = getSubjectCoveragePct(item.subject);
                    const covClass = covPct === 100 ? 'full' : (covPct < 50 ? 'low' : '');
                    const covPill = `<span class="card-coverage ${covClass}" title="Subject coverage: ${covPct}%">${covPct}%</span>`;

                    const subjCount = subjectCounts[item.subject] || 1;
                    leftSide.innerHTML = `
                        ${covPill}
                        <span class="card-subject">
                            ${escapeHtml(item.subject)}
                            <span class="count-badge-style">${subjCount}</span>
                        </span>
                    `;
                    subjectRow.appendChild(leftSide);

                    // Right cluster: status badge + PDF (PDF last → right-most)
                    const rightCluster = document.createElement('div');
                    rightCluster.className = 'card-right-cluster';

                    if (item.hasUrl) {
                        const coveredBadge = document.createElement('a');
                        coveredBadge.href = item.url;
                        coveredBadge.target = '_blank';
                        coveredBadge.rel = 'noopener noreferrer';
                        coveredBadge.className = 'status-badge-inline covered';
                        coveredBadge.title = 'Click to open the complete chat';
                        coveredBadge.innerHTML = `
                            <span class="status-check"><i class="fas fa-check"></i></span>
                            <span>Done</span>
                            <i class="fas fa-external-link-alt external-icon"></i>
                        `;
                        rightCluster.appendChild(coveredBadge);
                    } else {
                        const pendingBadge = document.createElement('span');
                        pendingBadge.className = 'status-badge-inline pending';
                        pendingBadge.title = 'Click card to copy DeepSeek prompt';
                        pendingBadge.innerHTML = `
                            <span class="status-check"><i class="fas fa-clock"></i></span>
                            <span>Pending</span>
                            <i class="fas fa-copy copy-icon"></i>
                        `;
                        pendingBadge.addEventListener('click', (e) => {
                            e.stopPropagation();
                            copyPrompt(item);
                        });
                        rightCluster.appendChild(pendingBadge);
                    }

                    // PDF link at the very right
                    if (item.hasPdf) {
                        const pdfLink = document.createElement('a');
                        pdfLink.href = item.pdfUrl;
                        pdfLink.target = '_blank';
                        pdfLink.rel = 'noopener noreferrer';
                        pdfLink.className = 'pdf-link';
                        pdfLink.title = 'Open PDF: sol.pdf';
                        pdfLink.innerHTML = `
                            <i class="fas fa-file-pdf"></i>
                            <span class="pdf-label">sol.pdf</span>
                        `;
                        pdfLink.addEventListener('click', (e) => e.stopPropagation());
                        rightCluster.appendChild(pdfLink);
                    }

                    subjectRow.appendChild(rightCluster);
                    card.appendChild(subjectRow);

                    fragment.appendChild(card);
                });

                cardsContainer.innerHTML = '';
                cardsContainer.appendChild(fragment);
            }

            function escapeHtml(unsafe) {
                if (unsafe === null || unsafe === undefined) return '';
                return String(unsafe)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            function populateFilters(data) {
                const subjects = new Set();
                const topics = new Set();
                const jobs = new Set();

                data.forEach(item => {
                    if (item.subject && item.subject !== '—') subjects.add(item.subject);
                    if (item.displayTopic && item.displayTopic !== '—') topics.add(item.displayTopic);
                    if (item.job && item.job !== '—') jobs.add(item.job);
                });

                const subjectOptions = Array.from(subjects).sort().map(s => ({ value: s, label: s }));
                const topicOptions = Array.from(topics).sort().map(t => ({ value: t, label: t }));
                const jobOptions = Array.from(jobs).sort().map(j => ({ value: j, label: j }));

                const subjectWrap = document.getElementById('subjectMultiWrap');
                subjectWrap.dataset.type = 'subjects';
                rebuildSubjectSelect = buildMultiSelect(subjectWrap, subjectOptions, selectedSubjects, onFilterChange, false);

                const topicWrap = document.getElementById('topicMultiWrap');
                topicWrap.dataset.type = 'topics';
                rebuildTopicSelect = buildMultiSelect(topicWrap, topicOptions, selectedTopics, onFilterChange, true);

                const jobWrap = document.getElementById('jobMultiWrap');
                jobWrap.dataset.type = 'jobs';
                rebuildJobSelect = buildMultiSelect(jobWrap, jobOptions, selectedJobs, onFilterChange, true);

                subjectCountHint.textContent = subjectOptions.length;
                topicCountHint.textContent = topicOptions.length;
                jobCountHint.textContent = jobOptions.length;
            }

            async function loadData() {
                cardsContainer.innerHTML = `
                    <div class="state-message">
                        <div class="spinner"></div>
                        <div style="font-size:0.85rem;">Loading topics…</div>
                    </div>`;

                try {
                    const response = await fetch(CSV_URL);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const csvText = await response.text();

                    if (csvText.trim().startsWith('<!DOCTYPE') || csvText.trim().startsWith('<html')) {
                        throw new Error('Received HTML instead of CSV');
                    }

                    const rows = parseCSV(csvText);
                    if (rows.length < 2) throw new Error('No data rows');

                    rawData = mapRowsToObjects(rows);
                    if (rawData.length === 0) throw new Error('No parsed data');

                    computeCounts(rawData);
                    populateFilters(rawData);
                    setupStatusCheckboxes();

                    selectedStatuses.clear();
                    selectedStatuses.add('covered');
                    selectedStatuses.add('pending');
                    selectedSubjects.clear();
                    selectedTopics.clear();
                    selectedJobs.clear();

                    cbCovered.classList.add('checked');
                    cbPending.classList.add('checked');

                    refreshAllFilters();
                    applyFiltersAndRender();

                } catch (error) {
                    console.error('Load error:', error);
                    cardsContainer.innerHTML = `
                        <div class="state-message">
                            <i class="fas fa-exclamation-triangle" style="color:#c06b4a;"></i>
                            <div style="margin-bottom:0.3rem;"><strong>Couldn't load sheet</strong></div>
                            <div style="font-size:0.75rem; opacity:0.8;">${escapeHtml(error.message)}</div>
                            <div style="margin-top:0.8rem; font-size:0.75rem;">Showing sample cards.</div>
                        </div>`;

                    setTimeout(() => {
                        const sample = [
                            { srno: '1', subject: 'General Abilities', marks: '60', mainTopic: 'Basic Arithmetic', subTopic: 'Percentages', displayTopic: 'Percentages', url: 'https://chat.deepseek.com/share/x2gdwyy9txdzvcadm', hasUrl: true, pdfUrl: 'https://example.com/sol1.pdf', hasPdf: true, status: 'covered', job: 'css-2027-mpt' },
                            { srno: '2', subject: 'General Abilities', marks: '60', mainTopic: 'Basic Arithmetic', subTopic: 'Ratios', displayTopic: 'Ratios', url: 'https://chat.deepseek.com/share/530rmdlusu59699v7s', hasUrl: true, pdfUrl: 'https://example.com/sol2.pdf', hasPdf: true, status: 'covered', job: 'css-2027-mpt' },
                            { srno: '3', subject: 'General Abilities', marks: '60', mainTopic: 'Basic Arithmetic', subTopic: 'Averages', displayTopic: 'Averages', url: 'https://chat.deepseek.com/share/mamnna7iv3btqf2wb3', hasUrl: true, pdfUrl: '', hasPdf: false, status: 'covered', job: 'css-2027-mpt' },
                            { srno: '4', subject: 'General Abilities', marks: '60', mainTopic: 'Basic Arithmetic', subTopic: 'Profit/Loss', displayTopic: 'Profit/Loss', url: '#', hasUrl: false, pdfUrl: '', hasPdf: false, status: 'pending', job: 'css-2027-mpt' },
                            { srno: '5', subject: 'English', marks: '50', mainTopic: 'Vocabulary', subTopic: 'Synonyms', displayTopic: 'Synonyms', url: '#', hasUrl: false, pdfUrl: 'https://example.com/sol5.pdf', hasPdf: true, status: 'pending', job: 'css-2027-mpt' }
                        ];
                        rawData = sample;
                        computeCounts(rawData);
                        populateFilters(rawData);
                        setupStatusCheckboxes();
                        selectedStatuses.clear();
                        selectedStatuses.add('covered');
                        selectedStatuses.add('pending');
                        selectedSubjects.clear();
                        selectedTopics.clear();
                        selectedJobs.clear();
                        cbCovered.classList.add('checked');
                        cbPending.classList.add('checked');
                        refreshAllFilters();
                        applyFiltersAndRender();
                    }, 200);
                }
            }

            loadData();
        })();
    </script>
</body>
