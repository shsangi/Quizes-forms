        <span id="toastMessage">Copied!</span>
    </div>

    <script>
        (function() {
            const SHEET_ID = '1D_wCGy3Rks9MXt84qpC4Ea2Qjo3uSgm0b-JBIh2_mmc';
            const GID = '0';
            const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

            const EXPECTED_COLUMNS = 9;

            const LS_DATA_KEY = 'tracker_data_v1';
            const LS_FILTERS_KEY = 'tracker_filters_v1';
            const LS_SCROLL_KEY = 'tracker_scroll_v1';
            const LS_TS_KEY = 'tracker_ts_v1';

            const cardsContainer = document.getElementById('cardsContainer');
            const statTotal = document.getElementById('statTotal');
            const statCovered = document.getElementById('statCovered');
            const statPending = document.getElementById('statPending');
            const statSubjects = document.getElementById('statSubjects');
            const cbCovered = document.getElementById('cbCovered');
            const cbPending = document.getElementById('cbPending');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const pageTitle = document.getElementById('pageTitle');
            const titleText = document.getElementById('titleText');
            const fabRefresh = document.getElementById('fabRefresh');
            const fabScrollTop = document.getElementById('fabScrollTop');
            const fabScrollBottom = document.getElementById('fabScrollBottom');
            const resetFiltersBtn = document.getElementById('resetFiltersBtn');

            const subjectCountHint = document.getElementById('subjectCountHint');
            const topicCountHint = document.getElementById('topicCountHint');
            const jobCountHint = document.getElementById('jobCountHint');

            // Global search elements
            const globalSearchInput = document.getElementById('globalSearchInput');
            const globalSearchClear = document.getElementById('globalSearchClear');

            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitleText = document.getElementById('modalTitleText');
            const modalSubtitle = document.getElementById('modalSubtitle');
            const modalBody = document.getElementById('modalBody');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalCloseBtn2 = document.getElementById('modalCloseBtn2');
            const modalCopyBtn = document.getElementById('modalCopyBtn');

            let currentModalMarkdown = '';
            let currentModalTitle = '';

            let rawData = [];
            let filteredData = [];
            let selectedSubjects = new Set();
            let selectedTopics = new Set();
            let selectedJobs = new Set();
            let selectedStatuses = new Set(['covered', 'pending']);
            let globalSearchTerm = '';

            let subjectCounts = {};
            let mainTopicCounts = {};

            let subjectCoverageScoped = {};

            let toastTimer = null;
            let lastToastTime = 0;
            const TOAST_DEBOUNCE_MS = 800;

            let rebuildSubjectSelect = null;
            let rebuildTopicSelect = null;
            let rebuildJobSelect = null;

            let filterRefreshScheduled = false;
            let isLoading = false;

            /* ============================================ */
            /* ========== PERSISTENCE ===================== */
            /* ============================================ */
            function saveFiltersToStorage() {
                try {
                    localStorage.setItem(LS_FILTERS_KEY, JSON.stringify({
                        subjects: Array.from(selectedSubjects),
                        topics: Array.from(selectedTopics),
                        jobs: Array.from(selectedJobs),
                        statuses: Array.from(selectedStatuses),
                        search: globalSearchTerm
                    }));
                } catch (e) { console.warn('saveFilters failed:', e); }
            }

            function loadFiltersFromStorage() {
                try {
                    const raw = localStorage.getItem(LS_FILTERS_KEY);
                    if (!raw) return false;
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed.subjects)) selectedSubjects = new Set(parsed.subjects);
                    if (Array.isArray(parsed.topics)) selectedTopics = new Set(parsed.topics);
                    if (Array.isArray(parsed.jobs)) selectedJobs = new Set(parsed.jobs);
                    if (Array.isArray(parsed.statuses) && parsed.statuses.length > 0) {
                        selectedStatuses = new Set(parsed.statuses);
                    }
                    if (typeof parsed.search === 'string') {
                        globalSearchTerm = parsed.search;
                    }
                    return true;
                } catch (e) {
                    console.warn('loadFilters failed:', e);
                    return false;
                }
            }

            function saveDataToStorage(data) {
                try {
                    localStorage.setItem(LS_DATA_KEY, JSON.stringify(data));
                    localStorage.setItem(LS_TS_KEY, String(Date.now()));
                } catch (e) { console.warn('saveData failed:', e); }
            }

            function loadDataFromStorage() {
                try {
                    const raw = localStorage.getItem(LS_DATA_KEY);
                    if (!raw) return null;
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    return null;
                } catch (e) {
                    console.warn('loadData failed:', e);
                    return null;
                }
            }

            function saveScrollPosition() {
                try { localStorage.setItem(LS_SCROLL_KEY, String(window.scrollY || 0)); }
                catch (e) { /* ignore */ }
            }

            function getSavedScrollPosition() {
                try {
                    const v = localStorage.getItem(LS_SCROLL_KEY);
                    if (!v) return 0;
                    return parseInt(v, 10) || 0;
                } catch (e) { return 0; }
            }

            function clearPersistedData() {
                try {
                    localStorage.removeItem(LS_DATA_KEY);
                    localStorage.removeItem(LS_TS_KEY);
                } catch (e) { /* ignore */ }
            }

            /* ============================================ */
            /* ========== HELPERS ========================= */
            /* ============================================ */
            function extractFileName(url) {
                if (!url || url === '#') return 'sol';
                try {
                    let clean = url.split('#')[0].split('?')[0];
                    const parts = clean.split('/');
                    let last = parts[parts.length - 1] || '';
                    try { last = decodeURIComponent(last); } catch (e) {}
                    if (!last || (last.indexOf('.') === -1 && !/\w/.test(last))) return 'sol';
                    if (last.length > 24) last = last.slice(0, 21) + '…';
                    return last || 'sol';
                } catch (e) { return 'sol'; }
            }

            function buildJobScopeKey(jobsSet) {
                if (!jobsSet || jobsSet.size === 0) return 'ALL';
                const arr = Array.from(jobsSet).sort();
                return 'JOB::' + arr.join('|');
            }

            function scopedCoverageKey(subject, jobScopeKey) {
                return subject + '||' + jobScopeKey;
            }

            /* ============================================ */
            /* ========== GLOBAL SEARCH MATCH ============= */
            /* ============================================ */
            function matchesGlobalSearch(item, term) {
                if (!term || term.trim() === '') return true;
                const q = term.toLowerCase().trim();
                const fields = [
                    String(item.srno),
                    String(item.subject),
                    String(item.marks),
                    String(item.mainTopic),
                    String(item.subTopic),
                    String(item.displayTopic),
                    String(item.job),
                    String(item.lastUpdate),
                    String(item.markdownNotes).substring(0, 500),
                    String(item.url),
                    String(item.solFileName)
                ];
                return fields.some(f => f.toLowerCase().includes(q));
            }

            /* ============================================ */
            /* ========== FAST FILTER REFRESH ============= */
            /* ============================================ */
            function scheduleFastFilterRefresh() {
                if (filterRefreshScheduled) return;
                filterRefreshScheduled = true;
                requestAnimationFrame(() => {
                    filterRefreshScheduled = false;
                    refreshAllFilters();
                    applyFiltersAndRender();
                    saveFiltersToStorage();
                });
            }

            /* ============================================ */
            /* ========== CSV PARSER ====================== */
            /* ============================================ */
            function parseCSV(csvText) {
                const rows = [];
                let currentRow = [];
                let currentField = '';
                let insideQuotes = false;

                for (let i = 0; i < csvText.length; i++) {
                    const char = csvText[i];
                    const nextChar = csvText[i + 1];

                    if (char === '"') {
                        if (insideQuotes && nextChar === '"') {
                            currentField += '"';
                            i++;
                        } else {
                            insideQuotes = !insideQuotes;
                        }
                    } else if (char === ',' && !insideQuotes) {
                        currentRow.push(currentField);
                        currentField = '';
                    } else if ((char === '\n' || char === '\r') && !insideQuotes) {
                        if (char === '\r' && nextChar === '\n') i++;
                        currentRow.push(currentField);
                        if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0].trim() !== '')) {
                            rows.push(currentRow);
                        }
                        currentRow = [];
                        currentField = '';
                    } else {
                        currentField += char;
                    }
                }
                if (currentField !== '' || currentRow.length > 0) {
                    currentRow.push(currentField);
                    if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0].trim() !== '')) {
                        rows.push(currentRow);
                    }
                }
                return rows;
            }

            function looksLikeMarkdown(text) {
                if (!text) return false;
                const t = text.trim();
                if (t.length < 15) return false;
                if (t === '—' || t === '-' || t === 'N/A' || t === 'na' || t === 'NA') return false;
                if (/^https?:\/\/\S+$/.test(t)) return false;

                let signals = 0;
                if (/^#{1,6}\s/m.test(t)) signals++;
                if (/\*\*[^*]+\*\*/.test(t)) signals++;
                if (/^\s*[-*+]\s+/m.test(t)) signals++;
                if (/^\s*\d+\.\s+/m.test(t)) signals++;
                if (/^\s*\|.*\|\s*$/m.test(t)) signals++;
                if (/```/.test(t)) signals++;
                if (/^\s*>\s/m.test(t)) signals++;
                if (/\[[^\]]+\]\([^)]+\)/.test(t)) signals++;

                return signals >= 2 || (signals >= 1 && t.length > 100);
            }

            function mapRowsToObjects(rows) {
                if (!rows.length) return [];
                const dataRows = rows.slice(1);
                const result = [];

                const paddedRows = dataRows.map(r => {
                    const copy = r.slice();
                    while (copy.length < EXPECTED_COLUMNS) copy.push('');
                    return copy;
                });

                for (const row of paddedRows) {
                    if (row.length < 3) continue;

                    const srno = (row[0] || '').trim();
                    const subjectWithMarks = (row[1] || '').trim();
                    const mainTopic = (row[2] || '').trim();
                    const subTopic = (row[3] || '').trim();
                    const job = (row[4] || '').trim();
                    const url = (row[5] || '').trim();
                    const solUrl = (row[6] || '').trim();
                    const lastUpdate = (row[7] || '').trim();
                    const markdownNotes = (row[8] || '').trim();

                    let subject = subjectWithMarks;
                    let marks = '';
                    const marksMatch = subjectWithMarks.match(/;\s*(\d+)\s*$/);
                    if (marksMatch) {
                        marks = marksMatch[1];
                        subject = subjectWithMarks.replace(/;\s*\d+\s*$/, '').trim();
                    }

                    const hasUrl = url && url !== '#' && url !== '—' && url.trim() !== '';
                    const hasSol = solUrl && solUrl !== '#' && solUrl !== '—' && solUrl.trim() !== '';
                    const hasMarkdown = looksLikeMarkdown(markdownNotes);
                    const status = (hasUrl || hasSol || hasMarkdown) ? 'covered' : 'pending';
                    const displayTopic = subTopic || mainTopic;

                    result.push({
                        srno: srno || '—',
                        subject: subject || '—',
                        marks: marks || '—',
                        mainTopic: mainTopic || '—',
                        subTopic: subTopic || '—',
                        displayTopic: displayTopic || '—',
                        url: hasUrl ? url : '#',
                        hasUrl: hasUrl,
                        solUrl: hasSol ? solUrl : '',
                        hasSol: hasSol,
                        solFileName: hasSol ? extractFileName(solUrl) : '',
                        markdownNotes: hasMarkdown ? markdownNotes : '',
                        hasMarkdown: hasMarkdown,
                        status: status,
                        job: job || '—',
                        lastUpdate: lastUpdate || ''
                    });
                }

                return result;
            }

            /* ============================================ */
            /* ========== COMPUTE COUNTS ================== */
            /* ============================================ */
            function computeCounts(data) {
                subjectCounts = {};
                mainTopicCounts = {};
                subjectCoverageScoped = {};

                const allJobs = new Set();

                data.forEach(item => {
                    if (item.subject && item.subject !== '—') {
                        subjectCounts[item.subject] = (subjectCounts[item.subject] || 0) + 1;
                    }
                    const key = item.mainTopic;
                    if (key && key !== '—') {
                        mainTopicCounts[key] = (mainTopicCounts[key] || 0) + 1;
                    }
                    if (item.job && item.job !== '—') allJobs.add(item.job);
                });

                const scopes = ['ALL'];
                allJobs.forEach(j => scopes.push('JOB::' + j));

                scopes.forEach(scopeKey => {
                    data.forEach(item => {
                        if (!item.subject || item.subject === '—') return;

                        if (scopeKey !== 'ALL') {
                            const jobName = scopeKey.slice(5);
                            if (item.job !== jobName) return;
                        }

                        const key = scopedCoverageKey(item.subject, scopeKey);
                        if (!subjectCoverageScoped[key]) {
                            subjectCoverageScoped[key] = { total: 0, done: 0 };
                        }
                        subjectCoverageScoped[key].total += 1;
                        if (item.status === 'covered') {
                            subjectCoverageScoped[key].done += 1;
                        }
                    });
                });
            }

            function getSubjectCoveragePctForScope(subject, jobsSet) {
                if (!subject || subject === '—') return 0;

                if (!jobsSet || jobsSet.size <= 1) {
                    const scopeKey = buildJobScopeKey(jobsSet);
                    const c = subjectCoverageScoped[scopedCoverageKey(subject, scopeKey)];
                    if (!c || c.total === 0) return 0;
                    return Math.round((c.done / c.total) * 100);
                }

                let total = 0, done = 0;
                rawData.forEach(item => {
                    if (item.subject !== subject) return;
                    if (!jobsSet.has(item.job)) return;
                    total += 1;
                    if (item.status === 'covered') done += 1;
                });
                if (total === 0) return 0;
                return Math.round((done / total) * 100);
            }

            function getSubjectCountForScope(subject, jobsSet) {
                if (!subject || subject === '—') return 0;
                if (!jobsSet || jobsSet.size === 0) {
                    return subjectCounts[subject] || 0;
                }
                let count = 0;
                rawData.forEach(item => {
                    if (item.subject === subject && jobsSet.has(item.job)) count++;
                });
                return count;
            }

            function updateStats(data) {
                const total = data.length;
                const covered = data.filter(d => d.status === 'covered').length;
                const pending = data.filter(d => d.status === 'pending').length;
                const subjects = new Set(data.map(d => d.subject).filter(s => s !== '—')).size;

                statTotal.textContent = total;
                statCovered.textContent = covered;
                statPending.textContent = pending;
                statSubjects.textContent = subjects;
            }

            function updatePageTitle() {
                if (selectedJobs.size === 1) {
                    const jobName = Array.from(selectedJobs)[0];
                    pageTitle.classList.add('job-active');
                    titleText.innerHTML = `Topic Tracker: <span class="job-title">${escapeHtml(jobName)}</span>`;
                } else if (selectedJobs.size > 1) {
                    pageTitle.classList.add('job-active');
                    titleText.innerHTML = `Topic Tracker: <span class="job-title">${selectedJobs.size} jobs</span>`;
                } else {
                    pageTitle.classList.remove('job-active');
                    titleText.textContent = 'Subject & Topic Tracker';
                }
            }

            function getAvailableOptions(excludeFilter) {
                const applySubjects = excludeFilter === 'subject' ? new Set() : selectedSubjects;
                const applyTopics   = excludeFilter === 'topic'   ? new Set() : selectedTopics;
                const applyJobs     = excludeFilter === 'job'     ? new Set() : selectedJobs;

                const subjects = new Set();
                const topics = new Set();
                const jobs = new Set();

                rawData.forEach(item => {
                    if (selectedStatuses.size > 0 && !selectedStatuses.has(item.status)) return;
                    if (!matchesGlobalSearch(item, globalSearchTerm)) return;

                    if (applySubjects.size > 0 && !applySubjects.has(item.subject)) return;
                    if (applyTopics.size > 0 && !applyTopics.has(item.displayTopic)) return;
                    if (applyJobs.size > 0 && !applyJobs.has(item.job)) return;

                    if (excludeFilter === 'subject') {
                        if (selectedSubjects.size > 0 && !selectedSubjects.has(item.subject)) return;
                        if (item.subject && item.subject !== '—') subjects.add(item.subject);
                    }
                    else if (excludeFilter === 'topic') {
                        if (selectedTopics.size > 0 && !selectedTopics.has(item.displayTopic)) return;
                        if (item.displayTopic && item.displayTopic !== '—') topics.add(item.displayTopic);
                    }
                    else if (excludeFilter === 'job') {
                        if (selectedJobs.size > 0 && !selectedJobs.has(item.job)) return;
                        if (item.job && item.job !== '—') jobs.add(item.job);
                    }
                    else {
                        if (item.subject && item.subject !== '—') subjects.add(item.subject);
                        if (item.displayTopic && item.displayTopic !== '—') topics.add(item.displayTopic);
                        if (item.job && item.job !== '—') jobs.add(item.job);
                    }
                });

                return {
                    subjects: Array.from(subjects).sort(),
                    topics: Array.from(topics).sort(),
                    jobs: Array.from(jobs).sort()
                };
            }

            function pruneSelections() {
                const available = getAvailableOptions('none');
                Array.from(selectedSubjects).forEach(s => {
                    if (!available.subjects.includes(s)) selectedSubjects.delete(s);
                });
                Array.from(selectedTopics).forEach(t => {
                    if (!available.topics.includes(t)) selectedTopics.delete(t);
                });
                Array.from(selectedJobs).forEach(j => {
                    if (!available.jobs.includes(j)) selectedJobs.delete(j);
                });
            }

            /* ============================================ */
            /* ========== MULTI-SELECT BUILD ============== */
            /* ============================================ */
            function buildMultiSelect(container, options, selectedSet, onUpdate, enableSearch) {
                const dropdown = container.querySelector('.multi-select-dropdown');
                const trigger = container.querySelector('.multi-select-trigger');
                const placeholder = container.querySelector('.placeholder');

                function closeDropdown() {
                    dropdown.classList.remove('open');
                    trigger.classList.remove('open');
                }

                if (!trigger.dataset.listenerAttached) {
                    trigger.dataset.listenerAttached = '1';

                    trigger.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const isOpen = dropdown.classList.contains('open');
                        document.querySelectorAll('.multi-select-dropdown.open').forEach(d => d.classList.remove('open'));
                        document.querySelectorAll('.multi-select-trigger.open').forEach(t => t.classList.remove('open'));

                        if (!isOpen) {
                            dropdown.classList.add('open');
                            trigger.classList.add('open');

                            const latest = container._latestRebuild;
                            if (latest && latest._render) {
                                const searchInput = dropdown.querySelector('.multi-select-search');
                                if (searchInput) {
                                    searchInput.value = '';
                                    setTimeout(() => searchInput.focus(), 50);
                                }
                                latest._render('');
                            }
                        }
                    });

                    document.addEventListener('click', (e) => {
                        if (!container.contains(e.target)) {
                            closeDropdown();
                        }
                    });
                }

                function rebuild(newOptions) {
                    dropdown.innerHTML = '';

                    let searchInput = null;
                    if (enableSearch) {
                        searchInput = document.createElement('input');
                        searchInput.type = 'text';
                        searchInput.className = 'multi-select-search';
                        searchInput.placeholder = 'Search...';
                        searchInput.addEventListener('input', () => renderDropdown(searchInput.value));
                        searchInput.addEventListener('click', (e) => e.stopPropagation());
                        dropdown.appendChild(searchInput);
                    }

                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'multi-select-actions';
                    const selectAllBtn = document.createElement('button');
                    selectAllBtn.textContent = 'All';
                    selectAllBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const visibleOpts = newOptions.filter(opt => {
                            if (!searchInput || !searchInput.value) return true;
                            return opt.label.toLowerCase().includes(searchInput.value.toLowerCase());
                        });
                        visibleOpts.forEach(opt => selectedSet.add(opt.value));
                        onUpdate(); updateTriggerText();
                        renderDropdown(searchInput ? searchInput.value : '');
                    });
                    const clearAllBtn = document.createElement('button');
                    clearAllBtn.textContent = 'Clear';
                    clearAllBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectedSet.clear();
                        onUpdate(); updateTriggerText();
                        renderDropdown(searchInput ? searchInput.value : '');
                    });
                    actionsDiv.appendChild(selectAllBtn);
                    actionsDiv.appendChild(clearAllBtn);
                    dropdown.appendChild(actionsDiv);

                    function renderDropdown(filterText) {
                        dropdown.querySelectorAll('.multi-select-option').forEach(el => el.remove());

                        let filteredOptions = newOptions;
                        if (filterText && filterText.trim() !== '') {
                            const q = filterText.toLowerCase().trim();
                            filteredOptions = newOptions.filter(opt => opt.label.toLowerCase().includes(q));
                        }

                        if (filteredOptions.length === 0) {
                            const emptyDiv = document.createElement('div');
                            emptyDiv.className = 'multi-select-option';
                            emptyDiv.style.opacity = '0.5';
                            emptyDiv.style.cursor = 'default';
                            emptyDiv.innerHTML = `<span style="padding: 0.2rem 0;">No matches</span>`;
                            dropdown.appendChild(emptyDiv);
                            return;
                        }

                        filteredOptions.forEach(opt => {
                            const div = document.createElement('div');
                            div.className = 'multi-select-option' + (selectedSet.has(opt.value) ? ' selected' : '');
                            div.innerHTML = `
                                <span class="check"><i class="fas fa-check"></i></span>
                                <span>${escapeHtml(opt.label)}</span>
                            `;
                            div.addEventListener('click', (e) => {
                                e.stopPropagation();
                                if (selectedSet.has(opt.value)) {
                                    selectedSet.delete(opt.value);
                                } else {
                                    selectedSet.add(opt.value);
                                }
                                onUpdate();
                                updateTriggerText();
                                closeDropdown();
                            });
                            dropdown.appendChild(div);
                        });
                    }

                    function updateTriggerText() {
                        if (selectedSet.size === 0) {
                            placeholder.textContent = 'All ' + (container.dataset.type || 'items');
                            placeholder.style.display = 'inline';
                            let existing = trigger.querySelector('.selected-text');
                            if (existing) existing.remove();
                        } else {
                            placeholder.style.display = 'none';
                            let selectedText = trigger.querySelector('.selected-text');
                            if (!selectedText) {
                                selectedText = document.createElement('span');
                                selectedText.className = 'selected-text';
                                trigger.insertBefore(selectedText, trigger.querySelector('.chevron'));
                            }
                            selectedText.textContent = `${selectedSet.size} sel`;
                            selectedText.style.display = 'inline';
                        }
                    }

                    rebuild._render = renderDropdown;
                    rebuild._updateText = updateTriggerText;
                    container._latestRebuild = rebuild;

                    renderDropdown('');
                    updateTriggerText();
                }

                rebuild(options);
                return rebuild;
            }

            function setupStatusCheckboxes() {
                if (cbCovered.dataset.listenerAttached) return;
                cbCovered.dataset.listenerAttached = '1';
                cbPending.dataset.listenerAttached = '1';

                cbCovered.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleStatus('covered', cbCovered);
                });
                cbPending.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleStatus('pending', cbPending);
                });
            }

            function toggleStatus(status, el) {
                if (selectedStatuses.has(status)) {
                    selectedStatuses.delete(status);
                    el.classList.remove('checked');
                } else {
                    selectedStatuses.add(status);
                    el.classList.add('checked');
                }
                scheduleFastFilterRefresh();
            }

            function refreshAllFilters() {
                pruneSelections();

                const availForSubject = getAvailableOptions('subject');
                const availForTopic = getAvailableOptions('topic');
                const availForJob = getAvailableOptions('job');

                const subjectOpts = availForSubject.subjects.map(s => ({ value: s, label: s }));
                const topicOpts = availForTopic.topics.map(t => ({ value: t, label: t }));
                const jobOpts = availForJob.jobs.map(j => ({ value: j, label: j }));

                subjectCountHint.textContent = subjectOpts.length;
                topicCountHint.textContent = topicOpts.length;
                jobCountHint.textContent = jobOpts.length;

                if (rebuildSubjectSelect) rebuildSubjectSelect(subjectOpts);
                if (rebuildTopicSelect) rebuildTopicSelect(topicOpts);
                if (rebuildJobSelect) rebuildJobSelect(jobOpts);
            }

            function applyFiltersAndRender() {
                filteredData = rawData.filter(item => {
                    if (selectedSubjects.size > 0 && !selectedSubjects.has(item.subject)) return false;
                    if (selectedTopics.size > 0 && !selectedTopics.has(item.displayTopic)) return false;
                    if (selectedJobs.size > 0 && !selectedJobs.has(item.job)) return false;
                    if (selectedStatuses.size > 0 && !selectedStatuses.has(item.status)) return false;
                    if (!matchesGlobalSearch(item, globalSearchTerm)) return false;
                    return true;
                });
                updateStats(filteredData);
                updatePageTitle();
                renderCards(filteredData);
            }

            function onFilterChange() {
                scheduleFastFilterRefresh();
            }

            function resetAllFilters(silent) {
                selectedSubjects.clear();
                selectedTopics.clear();
                selectedJobs.clear();
                selectedStatuses.clear();
                selectedStatuses.add('covered');
                selectedStatuses.add('pending');
                globalSearchTerm = '';
                globalSearchInput.value = '';
                updateSearchClearButton();

                cbCovered.classList.add('checked');
                cbPending.classList.add('checked');

                refreshAllFilters();
                applyFiltersAndRender();
                saveFiltersToStorage();

                if (!silent) showToast('Filters reset to default');
            }

            resetFiltersBtn.addEventListener('click', () => {
                resetAllFilters(false);
            });

            function buildGoogleSearchQuery(item) {
                const parts = [];
                if (item.subTopic && item.subTopic !== '—') parts.push(item.subTopic);
                if (item.mainTopic && item.mainTopic !== '—') parts.push(item.mainTopic);
                if (item.subject && item.subject !== '—') parts.push(item.subject);
                if (item.job && item.job !== '—') parts.push(item.job);
                return parts.join(' ');
            }

            function buildPrompt(item) {
                const jobTitle = (item.job && item.job !== '—') ? item.job : null;
                const fallbackTitle = (item.mainTopic && item.mainTopic !== '—') ? item.mainTopic : 'this topic';
                const title = jobTitle || fallbackTitle;

                return `Prepare me on ${item.subTopic} 20 mcqs with detail solution for ${title} exam.

It should be:
Srno
Mcq question
Choices
Detail solution
Correct answer as per choices`;
            }

            function copyPrompt(item) {
                const text = buildPrompt(item);
                const success = fallbackCopy(text);
                if (success) {
                    showToast(`Copied "${item.subTopic}" prompt`);
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast(`Copied "${item.subTopic}" prompt`);
                    }).catch((err) => {
                        console.error('Clipboard write failed:', err);
                        showToast('Copy failed — please copy manually');
                    });
                } else {
                    showToast('Copy failed — please copy manually');
                }
            }

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.top = '0';
                textarea.style.left = '0';
                textarea.style.width = '2em';
                textarea.style.height = '2em';
                textarea.style.padding = '0';
                textarea.style.border = 'none';
                textarea.style.outline = 'none';
                textarea.style.boxShadow = 'none';
                textarea.style.background = 'transparent';
                textarea.style.opacity = '0';
                textarea.setAttribute('readonly', '');
                textarea.setAttribute('aria-hidden', 'true');
                document.body.appendChild(textarea);
                let success = false;
                try {
                    textarea.focus();
                    textarea.select();
                    textarea.setSelectionRange(0, text.length);
                    success = document.execCommand('copy');
                } catch (err) {
                    console.warn('execCommand copy failed:', err);
                    success = false;
                }
                document.body.removeChild(textarea);
                return success;
            }

            function showToast(msg) {
                const now = Date.now();
                if (now - lastToastTime < TOAST_DEBOUNCE_MS && toast.classList.contains('show')) {
                    toastMessage.textContent = msg;
                    if (toastTimer) clearTimeout(toastTimer);
                    toastTimer = setTimeout(() => {
                        toast.classList.remove('show');
                    }, 1800);
                    lastToastTime = now;
                    return;
                }
                lastToastTime = now;
                toastMessage.textContent = msg;
                toast.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 1800);
            }

            /* ============================================ */
            /* ========== MARKDOWN RENDERER =============== */
            /* ============================================ */
            function renderMarkdown(md) {
                if (!md) return '';
                let html = md;
                html = html.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

                html = html
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');

                const codeBlocks = [];
                html = html.replace(/```([\s\S]*?)```/g, (match, code) => {
                    const idx = codeBlocks.length;
                    codeBlocks.push(code);
                    return `\u0000CODEBLOCK${idx}\u0000`;
                });

                const lines = html.split('\n');
                const output = [];
                let inTable = false;
                let inList = false;
                let listType = null;
                let inBlockquote = false;

                function closeList() {
                    if (inList) {
                        output.push(listType === 'ol' ? '</ol>' : '</ul>');
                        inList = false;
                        listType = null;
                    }
                }
                function closeTable() {
                    if (inTable) {
                        output.push('</tbody></table>');
                        inTable = false;
                    }
                }
                function closeBlockquote() {
                    if (inBlockquote) {
                        output.push('</blockquote>');
                        inBlockquote = false;
                    }
                }

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i];

                    const cbMatch = line.match(/^\u0000CODEBLOCK(\d+)\u0000\s*$/);
                    if (cbMatch) {
                        closeList(); closeTable(); closeBlockquote();
                        const code = codeBlocks[parseInt(cbMatch[1], 10)];
                        output.push(`<pre><code>${code}</code></pre>`);
                        continue;
                    }

                    const isTableRow = /^\s*\|.*\|\s*$/.test(line);
                    const nextLine = lines[i + 1] || '';
                    const isSeparator = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(nextLine);

                    if (isTableRow && isSeparator && !inTable) {
                        closeList(); closeBlockquote();
                        inTable = true;
                        output.push('<table><thead>');
                        const cells = parseTableRow(line);
                        output.push('<tr>' + cells.map(c => `<th>${inlineFormat(c.trim())}</th>`).join('') + '</tr>');
                        output.push('</thead><tbody>');
                        i++;
                        continue;
                    }

                    if (inTable && isTableRow) {
                        const cells = parseTableRow(line);
                        output.push('<tr>' + cells.map(c => `<td>${inlineFormat(c.trim())}</td>`).join('') + '</tr>');
                        continue;
                    }

                    if (inTable && !isTableRow) closeTable();

                    if (/^\s*>\s?/.test(line)) {
                        if (!inBlockquote) {
                            closeList();
                            output.push('<blockquote>');
                            inBlockquote = true;
                        }
                        output.push(inlineFormat(line.replace(/^\s*>\s?/, '')));
                        continue;
                    } else if (inBlockquote) {
                        closeBlockquote();
                    }

                    const h1 = line.match(/^#\s+(.*)$/);
                    const h2 = line.match(/^##\s+(.*)$/);
                    const h3 = line.match(/^###\s+(.*)$/);
                    const h4 = line.match(/^####\s+(.*)$/);
                    if (h1) { closeList(); closeTable(); closeBlockquote(); output.push(`<h1>${inlineFormat(h1[1])}</h1>`); continue; }
                    if (h2) { closeList(); closeTable(); closeBlockquote(); output.push(`<h2>${inlineFormat(h2[1])}</h2>`); continue; }
                    if (h3) { closeList(); closeTable(); closeBlockquote(); output.push(`<h3>${inlineFormat(h3[1])}</h3>`); continue; }
                    if (h4) { closeList(); closeTable(); closeBlockquote(); output.push(`<h4>${inlineFormat(h4[1])}</h4>`); continue; }

                    if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) {
                        closeList(); closeTable(); closeBlockquote();
                        output.push('<hr>');
                        continue;
                    }

                    const ulMatch = line.match(/^\s*[-*+]\s+(.*)$/);
                    if (ulMatch) {
                        closeTable(); closeBlockquote();
                        if (!inList || listType !== 'ul') {
                            closeList();
                            output.push('<ul>');
                            inList = true;
                            listType = 'ul';
                        }
                        output.push(`<li>${inlineFormat(ulMatch[1])}</li>`);
                        continue;
                    }

                    const olMatch = line.match(/^\s*\d+\.\s+(.*)$/);
                    if (olMatch) {
                        closeTable(); closeBlockquote();
                        if (!inList || listType !== 'ol') {
                            closeList();
                            output.push('<ol>');
                            inList = true;
                            listType = 'ol';
                        }
                        output.push(`<li>${inlineFormat(olMatch[1])}</li>`);
                        continue;
                    }

                    if (line.trim() === '') {
                        closeList(); closeTable(); closeBlockquote();
                        continue;
                    }

                    closeList(); closeTable(); closeBlockquote();
                    output.push(`<p>${inlineFormat(line)}</p>`);
                }

                closeList(); closeTable(); closeBlockquote();
                return output.join('\n');
            }

            function parseTableRow(line) {
                let trimmed = line.trim();
                if (trimmed.startsWith('|')) trimmed = trimmed.slice(1);
                if (trimmed.endsWith('|')) trimmed = trimmed.slice(0, -1);
                return trimmed.split('|');
            }

            function inlineFormat(text) {
                if (!text) return '';
                let s = text;
                s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
                s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
                s = s.replace(/_([^_\n]+)_/g, '<em>$1</em>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
                return s;
            }

            /* ============================================ */
            /* ========== MODAL =========================== */
            /* ============================================ */
            function openNotesModal(item) {
                if (!item.hasMarkdown) return;

                currentModalMarkdown = item.markdownNotes;
                currentModalTitle = item.subTopic !== '—' ? item.subTopic : item.displayTopic;

                modalTitleText.textContent = currentModalTitle;

                const parts = [];
                if (item.mainTopic && item.mainTopic !== '—') parts.push(item.mainTopic);
                if (item.subject && item.subject !== '—') parts.push(item.subject);
                if (item.job && item.job !== '—') parts.push(item.job);
                modalSubtitle.textContent = parts.join('  •  ');

                modalBody.innerHTML = renderMarkdown(item.markdownNotes);
                modalOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
                modalBody.scrollTop = 0;
            }

            function closeNotesModal() {
                modalOverlay.classList.remove('open');
                document.body.style.overflow = '';
                currentModalMarkdown = '';
                currentModalTitle = '';
            }

            modalCloseBtn.addEventListener('click', closeNotesModal);
            modalCloseBtn2.addEventListener('click', closeNotesModal);

            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeNotesModal();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modalOverlay.classList.contains('open')) {
                    closeNotesModal();
                }
            });

            modalCopyBtn.addEventListener('click', () => {
                if (!currentModalMarkdown) return;
                const success = fallbackCopy(currentModalMarkdown);
                if (success) {
                    showToast('Notes copied to clipboard');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(currentModalMarkdown).then(() => {
                        showToast('Notes copied to clipboard');
                    }).catch(() => {
                        showToast('Copy failed — please copy manually');
                    });
                } else {
                    showToast('Copy failed — please copy manually');
                }
            });

            /* ============================================ */
            /* ========== CARD RENDERING ================== */
            /* ============================================ */
            function renderCards(data) {
                if (!data.length) {
                    cardsContainer.innerHTML = `
                        <div class="state-message">
                            <i class="fas fa-search"></i>
                            No matching topics found.<br>
                            <span style="font-size:0.75rem; opacity:0.7;">Try adjusting filters or search</span>
                        </div>`;
                    return;
                }

                const showJobBadge = selectedJobs.size === 0;
                const fragment = document.createDocumentFragment();

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `topic-card ${item.status === 'covered' ? 'covered' : 'pending'}`;

                    if (item.status === 'pending') {
                        card.title = 'Click to copy DeepSeek prompt';
                        card.addEventListener('click', (e) => {
                            if (e.target.closest('.status-badge-inline')) return;
                            if (e.target.closest('.subtopic-name')) return;
                            if (e.target.closest('.sol-link')) return;
                            if (e.target.closest('.read-btn')) return;
                            copyPrompt(item);
                        });
                    }

                    if ((showJobBadge && item.job && item.job !== '—') || item.lastUpdate) {
                        const corner = document.createElement('div');
                        corner.className = 'card-corner';

                        if (showJobBadge && item.job && item.job !== '—') {
                            const jobBadge = document.createElement('span');
                            jobBadge.className = 'card-job-badge';
                            jobBadge.textContent = item.job;
                            jobBadge.title = `Job: ${item.job}`;
                            corner.appendChild(jobBadge);
                        }

                        if (item.lastUpdate) {
                            const dateEl = document.createElement('span');
                            dateEl.className = 'card-last-update';
                            dateEl.textContent = item.lastUpdate;
                            dateEl.title = `Last update: ${item.lastUpdate}`;
                            corner.appendChild(dateEl);
                        }

                        card.appendChild(corner);
                    }

                    const subtopicHeader = document.createElement('div');
                    subtopicHeader.className = 'card-subtopic-header';

                    const srnoSpan = document.createElement('span');
                    srnoSpan.className = 'card-srno';
                    srnoSpan.textContent = `#${item.srno}`;
                    subtopicHeader.appendChild(srnoSpan);

                    const subtopicLink = document.createElement('a');
                    subtopicLink.className = 'subtopic-name';
                    subtopicLink.href = `https://www.google.com/search?q=${encodeURIComponent(buildGoogleSearchQuery(item))}`;
                    subtopicLink.target = '_blank';
                    subtopicLink.rel = 'noopener noreferrer';
                    subtopicLink.title = 'Search on Google: ' + buildGoogleSearchQuery(item);
                    subtopicLink.innerHTML = `
                        ${escapeHtml(item.subTopic !== '—' ? item.subTopic : '—')}
                        <i class="fas fa-search search-icon"></i>
                    `;
                    subtopicLink.addEventListener('click', (e) => e.stopPropagation());
                    subtopicHeader.appendChild(subtopicLink);

                    card.appendChild(subtopicHeader);

                    const mainTopicRow = document.createElement('div');
                    mainTopicRow.className = 'card-main-topic-row';
                    const mainCount = mainTopicCounts[item.mainTopic] || 1;
                    const mainGroup = document.createElement('span');
                    mainGroup.className = 'main-topic-group';
                    mainGroup.innerHTML = `
                        <span class="main-topic-name">${escapeHtml(item.mainTopic)}</span>
                        <span class="count-badge-style">${mainCount}</span>
                    `;
                    mainTopicRow.appendChild(mainGroup);
                    card.appendChild(mainTopicRow);

                    const subjectRow = document.createElement('div');
                    subjectRow.className = 'card-subject-row';

                    const leftSide = document.createElement('div');
                    leftSide.className = 'card-subject-left';

                    const covPct = getSubjectCoveragePctForScope(item.subject, selectedJobs);
                    const covClass = covPct === 100 ? 'full' : (covPct < 50 ? 'low' : '');
                    const covPill = `<span class="card-coverage ${covClass}" title="Subject coverage${selectedJobs.size ? ' for selected job(s)' : ''}: ${covPct}%">${covPct}%</span>`;

                    const subjCount = getSubjectCountForScope(item.subject, selectedJobs);

                    leftSide.innerHTML = `
                        ${covPill}
                        <span class="card-subject">
                            ${escapeHtml(item.subject)}
                            <span class="count-badge-style">${subjCount}</span>
                        </span>
                    `;
                    subjectRow.appendChild(leftSide);

                    const rightCluster = document.createElement('div');
                    rightCluster.className = 'card-right-cluster';

                    if (item.hasMarkdown) {
                        const readBtn = document.createElement('button');
                        readBtn.type = 'button';
                        readBtn.className = 'read-btn';
                        readBtn.title = `Read notes for "${item.subTopic}"`;
                        readBtn.innerHTML = `<i class="fas fa-book-open"></i> Read`;
                        readBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            openNotesModal(item);
                        });
                        rightCluster.appendChild(readBtn);
                    }

                    if (item.hasUrl) {
                        const coveredBadge = document.createElement('a');
                        coveredBadge.href = item.url;
                        coveredBadge.target = '_blank';
                        coveredBadge.rel = 'noopener noreferrer';
                        coveredBadge.className = 'status-badge-inline covered';
                        coveredBadge.title = 'Click to open the complete chat';
                        coveredBadge.innerHTML = `
                            <span class="status-check"><i class="fas fa-check"></i></span>
                            <span>Done</span>
                            <i class="fas fa-external-link-alt external-icon"></i>
                        `;
                        rightCluster.appendChild(coveredBadge);
                    } else {
                        const isCovered = item.status === 'covered';
                        const pendingBadge = document.createElement('span');
                        pendingBadge.className = 'status-badge-inline ' + (isCovered ? 'covered' : 'pending');
                        pendingBadge.title = isCovered
                            ? 'Marked done (has sol / notes)'
                            : 'Click card to copy DeepSeek prompt';
                        pendingBadge.innerHTML = isCovered
                            ? `<span class="status-check"><i class="fas fa-check"></i></span><span>Done</span>`
                            : `<span class="status-check"><i class="fas fa-clock"></i></span><span>Pending</span><i class="fas fa-copy copy-icon"></i>`;
                        if (!isCovered) {
                            pendingBadge.addEventListener('click', (e) => {
                                e.stopPropagation();
                                copyPrompt(item);
                            });
                        }
                        rightCluster.appendChild(pendingBadge);
                    }

                    if (item.hasSol) {
                        const solLink = document.createElement('a');
                        solLink.href = item.solUrl;
                        solLink.target = '_blank';
                        solLink.rel = 'noopener noreferrer';
                        solLink.className = 'sol-link';
                        solLink.title = 'Open solution file: ' + item.solFileName;
                        solLink.innerHTML = `
                            <i class="fas fa-file-alt"></i>
                            <span class="sol-label">${escapeHtml(item.solFileName)}</span>
                        `;
                        solLink.addEventListener('click', (e) => e.stopPropagation());
                        rightCluster.appendChild(solLink);
                    }

                    subjectRow.appendChild(rightCluster);
                    card.appendChild(subjectRow);

                    fragment.appendChild(card);
                });

                cardsContainer.innerHTML = '';
                cardsContainer.appendChild(fragment);
            }

            function escapeHtml(unsafe) {
                if (unsafe === null || unsafe === undefined) return '';
                return String(unsafe)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            function populateFilters(data) {
                const subjects = new Set();
                const topics = new Set();
                const jobs = new Set();

                data.forEach(item => {
                    if (item.subject && item.subject !== '—') subjects.add(item.subject);
                    if (item.displayTopic && item.displayTopic !== '—') topics.add(item.displayTopic);
                    if (item.job && item.job !== '—') jobs.add(item.job);
                });

                const subjectOptions = Array.from(subjects).sort().map(s => ({ value: s, label: s }));
                const topicOptions = Array.from(topics).sort().map(t => ({ value: t, label: t }));
                const jobOptions = Array.from(jobs).sort().map(j => ({ value: j, label: j }));

                // ★★★ SUBJECT DROPDOWN NOW HAS SEARCH ENABLED (last arg = true) ★★★
                const subjectWrap = document.getElementById('subjectMultiWrap');
                subjectWrap.dataset.type = 'subjects';
                if (!rebuildSubjectSelect) {
                    rebuildSubjectSelect = buildMultiSelect(subjectWrap, subjectOptions, selectedSubjects, onFilterChange, true);
                } else {
                    rebuildSubjectSelect(subjectOptions);
                }

                const topicWrap = document.getElementById('topicMultiWrap');
                topicWrap.dataset.type = 'topics';
                if (!rebuildTopicSelect) {
                    rebuildTopicSelect = buildMultiSelect(topicWrap, topicOptions, selectedTopics, onFilterChange, true);
                } else {
                    rebuildTopicSelect(topicOptions);
                }

                const jobWrap = document.getElementById('jobMultiWrap');
                jobWrap.dataset.type = 'jobs';
                if (!rebuildJobSelect) {
                    rebuildJobSelect = buildMultiSelect(jobWrap, jobOptions, selectedJobs, onFilterChange, true);
                } else {
                    rebuildJobSelect(jobOptions);
                }

                subjectCountHint.textContent = subjectOptions.length;
                topicCountHint.textContent = topicOptions.length;
                jobCountHint.textContent = jobOptions.length;
            }

            /* ============================================ */
            /* ========== FLOATING ACTIONS ================ */
            /* ============================================ */
            function setRefreshLoading(loading) {
                isLoading = loading;
                if (loading) {
                    fabRefresh.classList.add('loading');
                    fabRefresh.title = 'Refreshing…';
                } else {
                    fabRefresh.classList.remove('loading');
                    fabRefresh.title = 'Refresh data from sheet (clears cache)';
                }
            }

            fabScrollTop.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                try { localStorage.setItem(LS_SCROLL_KEY, '0'); } catch (e) {}
            });

            fabScrollBottom.addEventListener('click', () => {
                const target = document.documentElement.scrollHeight || document.body.scrollHeight;
                window.scrollTo({ top: target, behavior: 'smooth' });
                try { localStorage.setItem(LS_SCROLL_KEY, String(target)); } catch (e) {}
            });

            function updateScrollButtons() {
                const y = window.scrollY || window.pageYOffset || 0;
                const maxY = (document.documentElement.scrollHeight || document.body.scrollHeight) - window.innerHeight;

                if (y < 40) {
                    fabScrollTop.classList.add('fab-hidden');
                } else {
                    fabScrollTop.classList.remove('fab-hidden');
                }

                if (maxY <= 0 || y >= maxY - 40) {
                    fabScrollBottom.classList.add('fab-hidden');
                } else {
                    fabScrollBottom.classList.remove('fab-hidden');
                }
            }

            let scrollTick = false;
            window.addEventListener('scroll', () => {
                if (scrollTick) return;
                scrollTick = true;
                requestAnimationFrame(() => {
                    scrollTick = false;
                    updateScrollButtons();
                    saveScrollPosition();
                });
            }, { passive: true });

            function restoreScrollPosition() {
                const y = getSavedScrollPosition();
                if (y > 0) {
                    requestAnimationFrame(() => {
                        window.scrollTo(0, y);
                    });
                }
            }

            /* ============================================ */
            /* ========== LOAD / REFRESH ================== */
            /* ============================================ */
            async function fetchFreshData() {
                const bust = `&_=${Date.now()}`;
                const response = await fetch(CSV_URL + bust, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const csvText = await response.text();

                if (csvText.trim().startsWith('<!DOCTYPE') || csvText.trim().startsWith('<html')) {
                    throw new Error('Sheet is not public. Share it as "Anyone with link can view".');
                }

                const rows = parseCSV(csvText);
                if (rows.length < 2) throw new Error('No data rows');

                const data = mapRowsToObjects(rows);
                if (data.length === 0) throw new Error('No parsed data');
                return data;
            }

            function applyDataAndRender(data, opts) {
                opts = opts || {};
                rawData = data;
                computeCounts(rawData);
                populateFilters(rawData);

                if (opts.isFirstLoad) {
                    setupStatusCheckboxes();

                    cbCovered.classList.toggle('checked', selectedStatuses.has('covered'));
                    cbPending.classList.toggle('checked', selectedStatuses.has('pending'));

                    refreshAllFilters();
                    applyFiltersAndRender();
                    restoreScrollPosition();
                } else {
                    refreshAllFilters();
                    applyFiltersAndRender();
                }

                requestAnimationFrame(updateScrollButtons);
            }

            async function refreshFromNetwork(opts) {
                opts = opts || {};
                if (isLoading) return;

                if (opts.isManual) {
                    setRefreshLoading(true);
                } else {
                    cardsContainer.innerHTML = `
                        <div class="state-message">
                            <div class="spinner"></div>
                            <div style="font-size:0.85rem;">Loading topics…</div>
                        </div>`;
                }

                try {
                    const fresh = await fetchFreshData();
                    saveDataToStorage(fresh);
                    applyDataAndRender(fresh, { isFirstLoad: opts.isFirstLoad });
                    if (opts.isManual) showToast('Data refreshed from sheet');
                } catch (error) {
                    console.error('Fetch error:', error);
                    if (opts.isManual) {
                        showToast('Refresh failed — check console');
                    } else {
                        cardsContainer.innerHTML = `
                            <div class="state-message">
                                <i class="fas fa-exclamation-triangle" style="color:#c06b4a;"></i>
                                <div style="margin-bottom:0.3rem;"><strong>Couldn't load sheet</strong></div>
                                <div style="font-size:0.75rem; opacity:0.8;">${escapeHtml(error.message)}</div>
                                <div style="margin-top:0.8rem; font-size:0.75rem;">Check browser console (F12) for details.</div>
                            </div>`;
                    }
                } finally {
                    if (opts.isManual) setRefreshLoading(false);
                }
            }

            /* ============================================ */
            /* ========== SEARCH HANDLERS ================= */
            /* ============================================ */
            function updateSearchClearButton() {
                if (globalSearchTerm && globalSearchTerm.trim() !== '') {
                    globalSearchClear.classList.add('visible');
                } else {
                    globalSearchClear.classList.remove('visible');
                }
            }

            function onGlobalSearchInput() {
                const val = globalSearchInput.value;
                if (val === globalSearchTerm) return;
                globalSearchTerm = val;
                updateSearchClearButton();
                scheduleFastFilterRefresh();
            }

            globalSearchInput.addEventListener('input', onGlobalSearchInput);

            globalSearchClear.addEventListener('click', () => {
                globalSearchInput.value = '';
                globalSearchTerm = '';
                updateSearchClearButton();
                scheduleFastFilterRefresh();
                globalSearchInput.focus();
            });

            /* ============================================ */
            /* ========== INIT ============================ */
            /* ============================================ */
            (async function init() {
                loadFiltersFromStorage();

                cbCovered.classList.toggle('checked', selectedStatuses.has('covered'));
                cbPending.classList.toggle('checked', selectedStatuses.has('pending'));

                if (globalSearchTerm) {
                    globalSearchInput.value = globalSearchTerm;
                }
                updateSearchClearButton();

                const cached = loadDataFromStorage();
                if (cached) {
                    applyDataAndRender(cached, { isFirstLoad: true });
                } else {
                    cardsContainer.innerHTML = `
                        <div class="state-message">
                            <div class="spinner"></div>
                            <div style="font-size:0.85rem;">Loading topics…</div>
                        </div>`;
                    try {
                        const fresh = await fetchFreshData();
                        saveDataToStorage(fresh);
                        applyDataAndRender(fresh, { isFirstLoad: true });
                    } catch (error) {
                        console.error('Initial fetch error:', error);
                        cardsContainer.innerHTML = `
                            <div class="state-message">
                                <i class="fas fa-exclamation-triangle" style="color:#c06b4a;"></i>
                                <div style="margin-bottom:0.3rem;"><strong>Couldn't load sheet</strong></div>
                                <div style="font-size:0.75rem; opacity:0.8;">${escapeHtml(error.message)}</div>
                                <div style="margin-top:0.8rem; font-size:0.75rem;">Check browser console (F12) for details.</div>
                            </div>`;
                    }
                }
            })();

            fabRefresh.addEventListener('click', () => {
                clearPersistedData();
                refreshFromNetwork({ isManual: true, isFirstLoad: false });
            });

            window.addEventListener('beforeunload', saveScrollPosition);
        })();
    </script>
</body>
</html>
