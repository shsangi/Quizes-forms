function startOfDayMs(ms){
  const p = new Date(ms);
  p.setHours(0,0,0,0);
  return p.getTime();
}
function endOfDayMs(ms){
  const p = new Date(ms);
  p.setHours(23,59,59,999);
  return p.getTime();
}
function getRange(period){
  const now = Date.now();
  if(period === "daily"){
    return { from: startOfDayMs(now), to: endOfDayMs(now), label: "Today" };
  }
  if(period === "weekly"){
    const p = new Date(now);
    const dow = p.getDay();
    const mon = new Date(p);
    mon.setDate(p.getDate() - ((dow + 6) % 7));
    mon.setHours(0,0,0,0);
    const sun = new Date(mon);
    sun.setDate(mon.getDate() + 6);
    sun.setHours(23,59,59,999);
    return { from: mon.getTime(), to: sun.getTime(), label: "This week" };
  }
  if(period === "monthly"){
    const p = new Date(now);
    const first = new Date(p.getFullYear(), p.getMonth(), 1, 0,0,0,0);
    const last = new Date(p.getFullYear(), p.getMonth()+1, 0, 23,59,59,999);
    return { from: first.getTime(), to: last.getTime(), label: "This month" };
  }
  return { from: 0, to: Date.now(), label: "All time" };
}

function getLastReadDayKey(){
  if(!HISTORY.length) return null;
  let latest = 0;
  for(const h of HISTORY){ if(h.ts > latest) latest = h.ts; }
  return latest ? dayKeyFromTs(latest) : null;
}

function eventsInRange(period){
  if(period === "last"){
    const dayKey = getLastReadDayKey();
    if(!dayKey) return [];
    return HISTORY.filter(h => dayKeyFromTs(h.ts) === dayKey);
  }
  const { from, to } = getRange(period);
  return HISTORY.filter(h => h.ts >= from && h.ts <= to);
}

function renderReport(){
  const period = RPT.period;
  const events = eventsInRange(period);
  const counted = events.filter(e => e.counted);
  const uniqueCountedKeys = new Set(counted.map(e=>e.key));

  let periodLabel = "";
  if(period === "last"){
    const dayKey = getLastReadDayKey();
    if(dayKey){
      const [y,m,d] = dayKey.split("-");
      periodLabel = "Last read · " + formatDayLabel(new Date(+y, +m-1, +d));
    } else {
      periodLabel = "Last read";
    }
  } else if(period === "daily"){
    periodLabel = "Today · " + formatDayLabel(new Date());
  } else if(period === "weekly"){
    const { from, to } = getRange("weekly");
    periodLabel = "This week · " + shortDate(from) + " → " + shortDate(to);
  } else if(period === "monthly"){
    const { from } = getRange("monthly");
    periodLabel = new Date(from).toLocaleString(undefined,{month:"long", year:"numeric"});
  }
  reportSubtitle.textContent = periodLabel;

  const allCatCount = {};
  ALL.forEach(r=>{
    const c = String(r.category||"").trim() || "Uncategorized";
    allCatCount[c] = (allCatCount[c]||0) + 1;
  });
  const periodCatReads = {};
  counted.forEach(e=>{
    const c = e.cat || "Uncategorized";
    periodCatReads[c] = (periodCatReads[c]||0) + 1;
  });
  const allCatKeys = Object.keys(allCatCount).sort((a,b)=>a.localeCompare(b));
  const maxAll = allCatKeys.length ? Math.max(...allCatKeys.map(k=>allCatCount[k])) : 1;

  const byDay = {};
  events.forEach(e=>{
    const dk = dayKeyFromTs(e.ts);
    (byDay[dk] = byDay[dk] || []).push(e);
  });
  const dayKeys = Object.keys(byDay).sort((a,b)=>b.localeCompare(a));

  const totalEvents = events.length;
  const totalCounted = counted.length;
  const uniqueTopics = uniqueCountedKeys.size;
  const categoriesCount = allCatKeys.length;
  const hasAnyActivity = HISTORY.length > 0;

  if(!hasAnyActivity){
    reportSubtitle.textContent = "No reading activity yet";
    reportBody.innerHTML = `
      <div class="report-tabs">${renderTabsHTML(period)}</div>
      <div class="report-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-7"/>
        </svg>
        <p style="font-weight:600;color:var(--text-2)">No reading activity yet</p>
        <p>Open a memory card to start tracking your progress.</p>
      </div>
    `;
    bindReportTabs();
    return;
  }

  reportBody.innerHTML = `
    <div class="report-tabs">${renderTabsHTML(period)}</div>
    <div class="report-stats">
      <div class="stat-card ok">
        <span class="stat-label">Topics Read</span>
        <div class="stat-value">${uniqueTopics}</div>
        <div class="stat-sub">unique cards</div>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total Reads</span>
        <div class="stat-value">${totalEvents}</div>
        <div class="stat-sub">${totalCounted} new · ${totalEvents-totalCounted} repeat</div>
      </div>
      <div class="stat-card info">
        <span class="stat-label">Categories</span>
        <div class="stat-value">${categoriesCount}</div>
        <div class="stat-sub">${categoriesCount} total in sheet</div>
      </div>
    </div>
    ${allCatKeys.length ? `
      <div class="report-section">
        <div class="report-sec-title">
          <span>All Categories (sheet)</span>
          <span class="count-badge">${categoriesCount}</span>
        </div>
        <div class="cat-list">
          ${allCatKeys.map(c=>{
            const total = allCatCount[c];
            const reads = periodCatReads[c] || 0;
            const pct = Math.round(total / maxAll * 100);
            return `
              <div class="cat-row">
                <span class="cat-name" title="${esc(c)} — ${reads} read in period">${esc(c)}</span>
                <span class="cat-bar" title="${reads} of ${total} read in period">
                  <span class="cat-bar-inner" style="width:${pct}%"></span>
                </span>
                <span class="cat-count" title="${reads} read of ${total} total">${reads}/${total}</span>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    ` : ""}
    ${dayKeys.length ? `
      <div class="report-section">
        <div class="report-sec-title">
          <span>Read Items</span>
          <span class="count-badge">${totalEvents}</span>
        </div>
        <div class="read-list">
          ${dayKeys.map(dk=>`
            <div class="day-group">
              <div class="day-head">
                <span class="dh-left">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  ${esc(formatDayLabelKey(dk))}
                </span>
                <span class="dh-count">${byDay[dk].length}</span>
              </div>
              ${byDay[dk].slice().reverse().map(e=>`
                <a class="read-item" href="https://www.google.com/search?q=${encodeURIComponent([e.ref, e.mem, e.cat].filter(Boolean).join(" "))}" target="_blank" rel="noopener">
                  <span class="read-item-ref" title="${esc(e.ref||"—")}">${esc(e.ref||"—")}</span>
                  <span class="read-item-body">
                    <div class="read-item-mem">${esc(e.mem||"")}</div>
                    <div class="read-item-meta">
                      <span>${esc(e.cat||"Uncategorized")}</span>
                      <span class="dot">·</span>
                      <span class="read-item-time">${formatTime(e.ts)}</span>
                      ${e.counted ? '<span class="dot">·</span><span style="color:var(--ok);font-weight:600">new</span>' : ''}
                    </div>
                  </span>
                </a>
              `).join("")}
            </div>
          `).join("")}
        </div>
      </div>
    ` : `
      <div class="report-section">
        <div class="report-empty" style="padding:26px 12px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>
          </svg>
          <p style="font-weight:600;color:var(--text-2)">No reads in this period</p>
          <p>Try a different tab.</p>
        </div>
      </div>
    `}
  `;
  bindReportTabs();
}

function renderTabsHTML(activePeriod){
  return `
    <button class="report-tab ${activePeriod==="last"?'on':''}" data-period="last" data-short="L" aria-label="Last read">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
      <span class="tab-label">Last</span>
    </button>
    <button class="report-tab ${activePeriod==="daily"?'on':''}" data-period="daily" data-short="D" aria-label="Daily">
      <span class="tab-label">Daily</span>
    </button>
    <button class="report-tab ${activePeriod==="weekly"?'on':''}" data-period="weekly" data-short="W" aria-label="Weekly">
      <span class="tab-label">Weekly</span>
    </button>
    <button class="report-tab ${activePeriod==="monthly"?'on':''}" data-period="monthly" data-short="M" aria-label="Monthly">
      <span class="tab-label">Monthly</span>
    </button>
  `;
}

function bindReportTabs(){
  reportBody.querySelectorAll(".report-tab").forEach(t=>{
    t.addEventListener("click", ()=>{
      RPT.period = t.dataset.period;
      renderReport();
    });
  });
}

function formatDayLabel(date){
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate()-1);
  const sameDay = (a,b)=> a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  if(sameDay(date, today)) return "Today";
  if(sameDay(date, yest)) return "Yesterday";
  return date.toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short", year:"numeric"});
}
function formatDayLabelKey(key){
  const [y,m,d] = key.split("-").map(Number);
  const date = new Date(y, m-1, d);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate()-1);
  const sameDay = (a,b)=> a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  if(sameDay(date, today)) return "Today";
  if(sameDay(date, yest)) return "Yesterday";
  return date.toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short", year:"numeric"});
}
function formatTime(ms){
  return new Date(ms).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function shortDate(ms){
  return new Date(ms).toLocaleDateString(undefined,{day:"numeric",month:"short"});
}

/* ============================================================
   EXPORT / IMPORT
   ============================================================ */
document.getElementById("exportBtn").addEventListener("click",()=>{
  const rows=[["row","reference","category","count","last","lastDay"]];
  ALL.forEach(r=>{
    const k=rowKey(r);
    const rec=READ[k];
    if(rec && rec.count>0){
      rows.push([
        r.row||"", r.reference||"", r.category||"",
        rec.count,
        rec.last?new Date(rec.last).toISOString():"",
        rec.lastDay||""
      ]);
    }
  });
  if(rows.length<2){ toast("Nothing read yet — open a card first.", "err"); return; }
  const csv=rows.map(row=>row.map(field=>{
    const s=String(field==null?"":field);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const stamp=new Date().toISOString().slice(0,10);
  a.href=url; a.download=`my-notes-progress-${stamp}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(`Downloaded ${rows.length-1} read record${rows.length-1===1?"":"s"}.`, "ok");
});

document.getElementById("importBtn").addEventListener("click",()=>{
  document.getElementById("fileInput").click();
});
document.getElementById("fileInput").addEventListener("change",(e)=>{
  const file=e.target.files && e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const txt=String(ev.target.result||"");
      const rows=parseCSV(txt);
      if(rows.length<2) throw new Error("Empty CSV");
      const H=rows[0].map(h=>h.trim().toLowerCase());
      const idxRef=H.indexOf("reference");
      const idxCat=H.indexOf("category");
      const idxCount=H.indexOf("count");
      const idxLast=H.indexOf("last");
      const idxDay=H.indexOf("lastday");
      if(idxRef<0 && idxCat<0) throw new Error("Missing reference/category columns");
      const merged = Object.assign({}, READ);
      let added=0;
      rows.slice(1).forEach(r=>{
        const ref=(idxRef>=0?(r[idxRef]||""):"").trim();
        const cat=(idxCat>=0?(r[idxCat]||""):"").trim();
        const key=cat+"||"+ref;
        const cnt=idxCount>=0?parseInt(r[idxCount]||"0",10)||0:1;
        const last=idxLast>=0?(Date.parse(r[idxLast])||Date.now()):Date.now();
        const day=idxDay>=0?(r[idxDay]||"").trim():"";
        const prev=merged[key];
        if(!prev || cnt>prev.count){
          merged[key]={count:cnt,last:Math.max(last, prev?prev.last:0),lastDay:day||(prev?prev.lastDay:"")};
          added++;
        }
      });
      READ=merged;
      saveReadStore(READ);
      buildStatusSelect();
      apply();
      toast(`Loaded ${added} record${added===1?"":"s"} from ${file.name}`, "ok");
    }catch(err){
      toast("Could not read file: "+err.message, "err");
    }
    e.target.value="";
  };
  reader.readAsText(file);
});

function rowToObject(rawHeaders, rawRow){
  const obj={row:"",category:"",reference:"",memory:"",status:""};
  rawHeaders.forEach((h,i)=>{
    const key=normalizeHeader(h);
    const val=(rawRow[i]||"").trim();
    if(key in obj) obj[key]=val;
  });
  return obj;
}

let isFetching=false;

async function fetchData(showToast){
  if(isFetching) return;
  isFetching=true;
  const out=document.getElementById("out");
  try{
    const res=await fetch(CSV_URL+"&_="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const txt=await res.text();
    const rows=parseCSV(txt);
    if(rows.length<2) throw new Error("Sheet is empty");
    const rawHeaders=rows[0];
    ALL=rows.slice(1)
      .map(r=>rowToObject(rawHeaders,r))
      .filter(o=>o.memory || o.reference);
    buildCategorySelect();
    buildPrioritySelect();
    buildStatusSelect();
    apply(true); /* skip persist — we'll handle restore separately */
    if(showToast) toast(`Refreshed — ${ALL.length} cards loaded.`, "ok");
  } catch(err){
    out.innerHTML=`<div class="state">
      <div class="state-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/>
        </svg>
      </div>
      <h3>Could not load data</h3>
      <p>${esc(err.message)}<br><br>Serve this page over a local HTTP server, or verify the sheet is published to the web as CSV.</p>
    </div>`;
    if(showToast) toast("Refresh failed — "+err.message, "err");
  } finally {
    isFetching=false;
  }
}

const refreshBtn=document.getElementById("refreshBtn");
refreshBtn.addEventListener("click",async()=>{
  refreshBtn.classList.add("spinning");
  /* Clear saved scroll on manual refresh */
  clearScrollPos();
  try{ await fetchData(true); }
  finally{ setTimeout(()=>refreshBtn.classList.remove("spinning"), 850); }
});

const scrollTopBtn=document.getElementById("scrollTopBtn");
const scrollBottomBtn=document.getElementById("scrollBottomBtn");
function updateScrollButtons(){
  const y=window.scrollY;
  const max=document.documentElement.scrollHeight - window.innerHeight;
  scrollTopBtn.classList.toggle("show", y>300);
  scrollBottomBtn.classList.toggle("show", y < max-300 && max>300);
}
window.addEventListener("scroll",updateScrollButtons,{passive:true});
window.addEventListener("resize",updateScrollButtons);
updateScrollButtons();
scrollTopBtn.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
scrollBottomBtn.addEventListener("click",()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"}));

/* Restore toast controls */
const restoreToastEl = document.getElementById("restoreToast");
let restoreToastTimer = null;
function showRestoreToast(){
  restoreToastEl.classList.add("show");
  clearTimeout(restoreToastTimer);
  restoreToastTimer = setTimeout(()=>restoreToastEl.classList.remove("show"), 4000);
}
function hideRestoreToast(){
  restoreToastEl.classList.remove("show");
  clearTimeout(restoreToastTimer);
}
document.getElementById("restoreTopBtn").addEventListener("click", ()=>{
  window.scrollTo({top:0, behavior:"smooth"});
  clearScrollPos();
  hideRestoreToast();
});

/* ============================================================
   INIT — restore filters + scroll, then fetch
   ============================================================ */
(function init(){
  /* Restore filters first so apply() yields the same view */
  const savedF = loadFilters();
  if(savedF){
    F = savedF;
    const qEl = document.getElementById("q");
    if(qEl) qEl.value = F.q || "";
    const sortEl = document.getElementById("fSort");
    if(sortEl) sortEl.value = F.sort || "default";
  }

  /* Check if there's a scroll position to restore */
  const saved = loadScrollPos();
  const willRestore = !!(saved && saved.y > 40);

  fetchData(false).then(()=>{
    /* After data is loaded and cards are rendered, restore scroll */
    if(!willRestore) return;

    /* If we need more cards loaded than default page, load them until we reach saved count */
    const needLoaded = Math.min(saved.loaded || PAGE_SIZE, VIEW.length);
    if(needLoaded > LOADED){
      const prev = LOADED;
      LOADED = needLoaded;
      appendCards(prev, LOADED);
      renderLoadMore();
      renderInfoBar();
    }

    /* Apply filters to multiselect triggers so UI matches F state */
    if(MS_CATEGORY && F.category.length) MS_CATEGORY.setSelected(F.category);
    if(MS_PRIORITY && F.status.length) MS_PRIORITY.setSelected(F.status);
    if(MS_STATUS && F.read) MS_STATUS.setSelected([F.read]);

    /* Restore scroll position after layout settles */
    SUPPRESS_SCROLL_SAVE = true;
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        window.scrollTo({top: saved.y, behavior: "instant" in window ? "instant" : "auto"});
        /* Show restore notice only if position is meaningfully far down */
        if(saved.y > 200) showRestoreToast();
        /* Re-enable saving after a short delay */
        setTimeout(()=>{ SUPPRESS_SCROLL_SAVE = false; }, 500);
      });
    });
  });
})();

/* Also persist scroll when user backgrounds the tab on mobile */
window.addEventListener("blur", saveScrollPos);
</script>
