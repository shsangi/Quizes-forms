<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0b0f" id="themeColorMeta" />
<title>CS Act · Memory Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
  (function(){
    var t = localStorage.getItem('mc-theme');
    if(!t){ t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
:root,
[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-elev:#111319;
  --surface:#16181f;
  --surface-2:#1c1f28;
  --border:#252832;
  --border-2:#333847;
  --text:#eceef3;
  --text-2:#9498a5;
  --text-3:#6a6f7e;
  --brand:#6366f1;
  --brand-2:#8b5cf6;
  --brand-soft:rgba(99,102,241,.14);
  --brand-border:rgba(99,102,241,.32);
  --brand-text:#a5b1ff;
  --brand-shadow:rgba(99,102,241,.55);
  --ok:#22c55e;--ok-bg:rgba(34,197,94,.11);--ok-br:rgba(34,197,94,.32);
  --err:#ef4444;--err-bg:rgba(239,68,68,.11);--err-br:rgba(239,68,68,.32);
  --warn:#f59e0b;--warn-bg:rgba(245,158,11,.11);--warn-br:rgba(245,158,11,.32);
  --info:#38bdf8;--info-bg:rgba(56,189,248,.11);--info-br:rgba(56,189,248,.32);
  --muted-bg:rgba(148,152,165,.09);--muted-br:rgba(148,152,165,.22);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --amb-a:rgba(99,102,241,.14);
  --amb-b:rgba(139,92,246,.11);
}
[data-theme="light"]{
  --bg:#f6f7fb;--bg-elev:#ffffff;--surface:#ffffff;--surface-2:#f2f3f8;
  --border:#e4e6ee;--border-2:#cfd3df;
  --text:#0d1017;--text-2:#5a5f6e;--text-3:#8a8f9e;
  --brand:#4f46e5;--brand-2:#7c3aed;
  --brand-soft:rgba(79,70,229,.09);
  --brand-border:rgba(79,70,229,.24);
  --brand-text:#4f46e5;
  --brand-shadow:rgba(79,70,229,.35);
  --ok:#16a34a;--ok-bg:rgba(22,163,74,.09);--ok-br:rgba(22,163,74,.28);
  --err:#dc2626;--err-bg:rgba(220,38,38,.09);--err-br:rgba(220,38,38,.28);
  --warn:#d97706;--warn-bg:rgba(217,119,6,.09);--warn-br:rgba(217,119,6,.28);
  --info:#0284c7;--info-bg:rgba(2,132,199,.09);--info-br:rgba(2,132,199,.28);
  --muted-bg:rgba(90,95,110,.08);--muted-br:rgba(90,95,110,.2);
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --amb-a:rgba(79,70,229,.09);
  --amb-b:rgba(124,58,237,.07);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;
  font-feature-settings:"cv11","ss01";
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  line-height:1.55;letter-spacing:-.011em;
  overflow-x:hidden;
  transition:background .3s ease,color .3s ease;
}

.amb{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.amb::before{
  content:"";position:absolute;width:900px;height:900px;top:-400px;left:-200px;
  background:radial-gradient(circle,var(--amb-a),transparent 62%);
  filter:blur(60px);transition:background .4s ease;
}
.amb::after{
  content:"";position:absolute;width:700px;height:700px;top:-260px;right:-200px;
  background:radial-gradient(circle,var(--amb-b),transparent 60%);
  filter:blur(60px);transition:background .4s ease;
}

.shell{max-width:1100px;margin:0 auto;padding:0 20px}

/* TOPBAR */
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(22px) saturate(1.4);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  border-bottom:1px solid var(--border);
  transition:background .3s ease,border-color .3s ease;
}
.topbar-in{
  max-width:1100px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:12px;
}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  display:grid;place-items:center;
  box-shadow:0 4px 14px -4px var(--brand-shadow);
  flex-shrink:0;
}
.brand-mark svg{width:17px;height:17px}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-txt b{font-weight:700;font-size:.92rem;letter-spacing:-.02em}
.brand-txt span{font-size:.68rem;font-weight:500;color:var(--text-3);letter-spacing:.01em}
.topbar-spacer{flex:1}

.clock{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 11px;border-radius:8px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);
  font-size:.72rem;font-weight:600;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:.02em;
  white-space:nowrap;
  transition:all .2s ease;
}
.clock:hover{border-color:var(--border-2);color:var(--text)}
.clock-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 6px var(--ok);
  animation:pulse 2s ease-in-out infinite;flex-shrink:0;
}
@keyframes pulse{50%{opacity:.4}}
.clock .ampm{color:var(--brand-text);font-size:.62rem;font-weight:700;letter-spacing:.06em}

.icon-btn{
  width:36px;height:36px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);cursor:pointer;
  display:grid;place-items:center;
  transition:all .2s ease;flex-shrink:0;
  text-decoration:none;position:relative;overflow:hidden;
}
.icon-btn:hover{
  background:var(--surface-2);border-color:var(--border-2);
  color:var(--text);transform:translateY(-1px);
}
.icon-btn:active{transform:translateY(0)}
.icon-btn svg{width:16px;height:16px}

.theme-btn svg{
  transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;
  position:absolute;
}
[data-theme="dark"] .theme-btn .icon-moon{opacity:0;transform:rotate(-90deg) scale(.6)}
[data-theme="dark"] .theme-btn .icon-sun{opacity:1;transform:rotate(0) scale(1)}
[data-theme="light"] .theme-btn .icon-sun{opacity:0;transform:rotate(90deg) scale(.6)}
[data-theme="light"] .theme-btn .icon-moon{opacity:1;transform:rotate(0) scale(1)}

.sheet-btn{
  background:var(--brand-soft);
  border-color:var(--brand-border);
  color:var(--brand-text);
}
.sheet-btn:hover{
  background:var(--brand);border-color:var(--brand);color:#fff;
}

.version{
  display:inline-flex;align-items:center;
  padding:5px 10px;border-radius:8px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);font-size:.72rem;font-weight:600;
  letter-spacing:.02em;font-family:'JetBrains Mono',monospace;
  transition:all .2s ease;white-space:nowrap;
}
.version:hover{border-color:var(--border-2);color:var(--text)}

.page-top{padding:26px 0 8px}

/* SEARCH */
.searchrow{
  display:grid;grid-template-columns:1fr auto;gap:10px;
  margin-bottom:16px;
}
.field{position:relative}
.field-icon{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--text-3);pointer-events:none;display:flex;
}
.field-icon svg{width:15px;height:15px}
input{
  width:100%;padding:11px 14px 11px 37px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;color:var(--text);
  font-size:.87rem;font-family:inherit;font-weight:450;
  outline:none;transition:all .18s ease;
  appearance:none;-webkit-appearance:none;
}
input::placeholder{color:var(--text-3)}
input:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 3px var(--brand-soft);
}
.btn-clear{
  padding:0 14px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;color:var(--text-2);
  font-size:.8rem;font-family:inherit;font-weight:600;
  cursor:pointer;transition:all .18s ease;
  white-space:nowrap;
}
.btn-clear:hover{border-color:var(--border-2);color:var(--text);background:var(--surface-2)}

/* CHIPS */
.chips{
  display:flex;gap:6px;flex-wrap:wrap;
  margin-bottom:16px;
  padding-bottom:2px;
}
.chip{
  padding:5px 11px;border-radius:7px;
  background:transparent;border:1px solid var(--border);
  color:var(--text-2);
  font-size:.72rem;font-weight:600;
  cursor:pointer;transition:all .15s ease;
  letter-spacing:-.003em;
  white-space:nowrap;
  font-family:inherit;
}
.chip:hover{border-color:var(--border-2);color:var(--text);background:var(--surface)}
.chip.on{
  background:var(--brand);border-color:var(--brand);color:#fff;
  box-shadow:0 3px 10px -4px var(--brand-shadow);
}
.chip .n{
  font-family:'JetBrains Mono',monospace;
  margin-left:5px;opacity:.7;font-size:.68rem;
}

/* INFO BAR */
.infobar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2px 12px;
  color:var(--text-3);font-size:.78rem;font-weight:500;
}
.infobar b{color:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums}

/* LIST */
.list{display:flex;flex-direction:column;gap:8px}

/* CARD */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:11px;
  padding:14px 16px;
  cursor:pointer;
  transition:all .18s cubic-bezier(.32,.72,0,1);
  animation:rise .25s cubic-bezier(.32,.72,0,1) both;
  position:relative;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  display:flex;
  flex-direction:column;
  gap:10px;
}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.card:hover{
  border-color:var(--border-2);
  background:var(--surface-2);
  box-shadow:var(--shadow-sm);
}
.card:active{transform:scale(.998)}
.card:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* priority stripe */
.card::before{
  content:"";
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--muted-br);
  transition:background .2s ease;
}
.card.V\.Imp::before{background:var(--err)}
.card.Imp::before{background:var(--warn)}
.card.Note::before{background:var(--info)}

/* row 1: tags + status */
.card-head{
  display:flex;align-items:center;gap:8px;
  min-width:0;
}
.card-tags{
  display:flex;gap:5px;flex-wrap:nowrap;
  flex:1;min-width:0;overflow:hidden;
}
.tag{
  padding:3px 8px;border-radius:5px;
  font-size:.6rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;
  background:var(--bg-elev);border:1px solid var(--border);
  color:var(--text-3);
  white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
  min-width:0;max-width:100%;
  transition:all .2s ease;
}
.tag.ref{
  background:var(--brand-soft);
  border-color:var(--brand-border);
  color:var(--brand-text);
  font-family:'JetBrains Mono',monospace;
  flex-shrink:0;
  letter-spacing:0;
  text-transform:none;
  font-size:.66rem;
}
.tag.cat{flex-shrink:1}

/* memory text */
.card-memory{
  font-size:.92rem;font-weight:500;line-height:1.5;
  color:var(--text);
  letter-spacing:-.008em;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.card.open .card-memory,
.card.expanded .card-memory{
  -webkit-line-clamp:unset;
  display:block;
}
.card-memory::after{
  content:"";
  /* chevron indicator via mask on ::before of card-foot */
}

/* status pill */
.badge{
  flex-shrink:0;
  padding:3px 9px;border-radius:999px;
  font-size:.6rem;font-weight:700;
  letter-spacing:.05em;
  border:1px solid;
  display:inline-flex;align-items:center;gap:4px;
  white-space:nowrap;line-height:1.5;
  text-transform:uppercase;
}
.badge::before{
  content:"";width:4px;height:4px;border-radius:50%;
  background:currentColor;flex-shrink:0;
}
.badge.vimp{color:var(--err);background:var(--err-bg);border-color:var(--err-br)}
.badge.imp{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-br)}
.badge.note{color:var(--info);background:var(--info-bg);border-color:var(--info-br)}
.badge.other{color:var(--text-3);background:var(--muted-bg);border-color:var(--muted-br)}

/* expand hint chevron */
.card-foot{
  display:flex;align-items:center;justify-content:flex-end;
  color:var(--text-3);font-size:.68rem;font-weight:500;
  gap:6px;
  transition:color .2s ease;
}
.card-foot svg{
  width:12px;height:12px;
  transition:transform .22s ease;
}
.card.open .card-foot svg{transform:rotate(90deg)}

/* full detail block (expanded) */
.card-detail{
  display:none;
  padding-top:10px;
  margin-top:2px;
  border-top:1px solid var(--border);
  animation:fade .25s ease both;
}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.card.open .card-detail{display:block}
.card.open .card-foot span{color:var(--brand)}
.card.open .card-foot svg{color:var(--brand)}
.detail-row{
  display:grid;grid-template-columns:100px 1fr;gap:12px;
  padding:6px 0;
  font-size:.82rem;
  line-height:1.6;
}
.detail-row + .detail-row{border-top:1px solid var(--border)}
.detail-l{
  font-size:.62rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-3);
  padding-top:3px;
}
.detail-v{color:var(--text-2)}
.detail-v strong{color:var(--text);font-weight:600}

/* EMPTY */
.state{padding:70px 20px;text-align:center}
.state-ico{
  width:52px;height:52px;border-radius:13px;margin:0 auto 15px;
  background:var(--surface);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--text-3);
}
.state-ico svg{width:22px;height:22px}
.state h3{font-size:1rem;font-weight:600;margin-bottom:6px;letter-spacing:-.02em}
.state p{color:var(--text-3);font-size:.85rem;max-width:420px;margin:0 auto;line-height:1.6}
.loader{
  width:26px;height:26px;margin:0 auto 13px;
  border:2px solid var(--border);border-top-color:var(--brand);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

footer{
  margin-top:44px;padding:22px 0;
  border-top:1px solid var(--border);
  text-align:center;color:var(--text-3);font-size:.76rem;
}

/* RESPONSIVE */
@media (max-width:640px){
  .shell{padding:0 14px}
  .topbar-in{padding:11px 14px;gap:8px}
  .brand-txt span{display:none}
  .clock{padding:4px 9px;font-size:.68rem}
  .clock .ampm{font-size:.58rem}
  .icon-btn{width:34px;height:34px}
  .version{padding:4px 8px;font-size:.68rem}
  .page-top{padding:18px 0 6px}
  .searchrow{grid-template-columns:1fr}
  .btn-clear{display:none}
  .card{padding:12px 14px;gap:8px}
  .card-memory{font-size:.87rem;-webkit-line-clamp:3}
  .detail-row{grid-template-columns:80px 1fr;gap:10px;font-size:.78rem}
  .tag{font-size:.56rem;padding:2px 6px}
  .tag.ref{font-size:.62rem}
  .badge{font-size:.56rem;padding:2px 7px}
  .chip{font-size:.68rem;padding:4px 9px}
}
@media (max-width:400px){
  .version{display:none}
  .tag.cat{display:none}
}

::selection{background:var(--brand-soft);color:var(--text)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
</style>
</head>
<body>

<div class="amb"></div>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div class="brand-txt">
        <b>CS Act · Memory Cards</b>
        <span>Civil Servants Laws</span>
      </div>
    </div>
    <div class="topbar-spacer"></div>

    <div class="clock" title="Pakistan Standard Time (UTC+5)">
      <span class="clock-dot"></span>
      <span id="pktClock">--:--</span>
      <span class="ampm" id="pktAmPm">--</span>
    </div>

    <a class="icon-btn sheet-btn" id="sheetBtn" href="#" target="_blank" rel="noopener" aria-label="Open Google Sheet" title="Open sheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="8" y1="13" x2="16" y2="13"/>
        <line x1="8" y1="17" x2="13" y2="17"/>
      </svg>
    </a>

    <button class="icon-btn theme-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2"/><path d="M12 20v2"/>
        <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
        <path d="M2 12h2"/><path d="M20 12h2"/>
        <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    <div class="version" title="App version">
      <span class="v-num">v1.0.0</span>
    </div>
  </div>
</div>

<div class="shell">
  <div class="page-top"></div>

  <div class="searchrow">
    <div class="field">
      <span class="field-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </span>
      <input id="q" type="search" placeholder="Search rules, sections, memory…" />
    </div>
    <button class="btn-clear" id="clearBtn" title="Clear filters">Clear</button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="infobar">
    <div id="info">Loading…</div>
  </div>

  <div class="list" id="out">
    <div class="state">
      <div class="loader"></div>
      <p>Fetching memory cards…</p>
    </div>
  </div>

  <footer>Data · Google Sheets · Times shown in Pakistan Standard Time (UTC+5)</footer>
</div>

<script>
/* ============================================================
   LIVE DATA — reads published CSV
   ============================================================ */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTR3op0RZuTMJ-HegiLJYV18VR97DAnZpcUPRWwMYRfr5pVVf_x6ZOYMfiS8aXIJQcTh2hHpsgqJ8ks/pub?output=csv";
const SHEET_EDIT_URL = "https://docs.google.com/spreadsheets/d/1SJRPdkff35aF60k--P-_Mf7s7m0TM1BFlLSPhdkUuK4/edit";

/* Pakistan Standard Time */
const PKT_OFFSET_MIN = 5 * 60;
function nowInPKT(){
  const now = new Date();
  const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utcMs + PKT_OFFSET_MIN * 60000);
}
function pad2(n){ return String(n).padStart(2,"0"); }
function tickClock(){
  const pkt = nowInPKT();
  let h = pkt.getHours();
  const m = pkt.getMinutes();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12; if(h === 0) h = 12;
  const timeEl = document.getElementById("pktClock");
  const ampmEl = document.getElementById("pktAmPm");
  if(timeEl) timeEl.textContent = `${pad2(h)}:${pad2(m)}`;
  if(ampmEl) ampmEl.textContent = ampm;
}
tickClock();
setInterval(tickClock, 15000);

/* Sheet link */
document.getElementById("sheetBtn").href = SHEET_EDIT_URL;

/* theme */
const themeBtn=document.getElementById("themeBtn");
const themeColorMeta=document.getElementById("themeColorMeta");
function applyThemeColor(){
  const t=document.documentElement.getAttribute("data-theme");
  themeColorMeta.setAttribute("content",t==="light"?"#f6f7fb":"#0a0b0f");
}
applyThemeColor();
themeBtn.addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  localStorage.setItem("mc-theme",next);
  applyThemeColor();
});

/* CSV parser */
function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i],n=t[i+1];
    if(q){
      if(c==='"'&&n==='"'){f+='"';i++;}
      else if(c==='"'){q=false;}
      else f+=c;
    } else {
      if(c==='"')q=true;
      else if(c===','){row.push(f);f="";}
      else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";}
      else if(c==='\r'){}
      else f+=c;
    }
  }
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(c=>c&&c.trim()!==""));
}
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* header normalization for the memory-cards sheet */
function normalizeHeader(h){
  let s=String(h||"").trim().toLowerCase().replace(/\s+/g," ");
  if(s==="row"||s==="s no"||s==="sr no"||s==="sno") return "row";
  if(s==="category") return "category";
  if(s==="reference"||s==="ref") return "reference";
  if(s==="one-line memory"||s==="one line memory"||s==="memory"||s==="one-liner"||s==="oneliner") return "memory";
  if(s==="mcq status"||s==="status"||s==="mcqstatus"||s==="mcq_status") return "status";
  return s;
}

/* status → class + label + priority */
function statusMeta(raw){
  const s=String(raw||"").trim();
  const low=s.toLowerCase().replace(/\s+/g,"");
  if(low==="v.imp"||low==="vimp"||low==="veryimportant"||low==="v.important"){
    return {cls:"vimp",label:"Very Imp",sort:0};
  }
  if(low==="imp"||low==="important"){
    return {cls:"imp",label:"Important",sort:1};
  }
  if(low==="note"||low==="notes"){
    return {cls:"note",label:"Note",sort:2};
  }
  return {cls:s?`${s}`:"—",cls:"other",label:s||"—",sort:3};
}

/* state */
let ALL=[];
let VIEW=[];
let F={q:"", status:""};

/* render */
function render(){
  const out=document.getElementById("out");
  const info=document.getElementById("info");

  if(!VIEW.length){
    out.innerHTML=`<div class="state">
      <div class="state-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </div>
      <h3>No cards found</h3>
      <p>Try a different search or clear the status filter.</p>
    </div>`;
    info.innerHTML=`Showing <b>0</b> of <b>${ALL.length}</b>`;
    return;
  }
  info.innerHTML=`Showing <b>${VIEW.length}</b> of <b>${ALL.length}</b> cards`;

  out.innerHTML=VIEW.map((r,i)=>{
    const sm=statusMeta(r.status);
    return `<article class="card ${sm.cls} ${esc(r.status||"")}" data-idx="${i}" tabindex="0" role="button" aria-label="Open card ${esc(r.row||i+1)}" style="animation-delay:${Math.min(i*14,200)}ms">
      <div class="card-head">
        <div class="card-tags">
          <span class="tag ref">${esc(r.reference||"—")}</span>
          ${r.category?`<span class="tag cat">${esc(r.category)}</span>`:""}
        </div>
        <span class="badge ${sm.cls}">${esc(sm.label)}</span>
      </div>
      <div class="card-memory">${esc(r.memory||"")}</div>
      <div class="card-detail">
        <div class="detail-row">
          <div class="detail-l">Row</div>
          <div class="detail-v"><strong>${esc(r.row||"—")}</strong></div>
        </div>
        <div class="detail-row">
          <div class="detail-l">Category</div>
          <div class="detail-v"><strong>${esc(r.category||"—")}</strong></div>
        </div>
        <div class="detail-row">
          <div class="detail-l">Reference</div>
          <div class="detail-v"><strong>${esc(r.reference||"—")}</strong></div>
        </div>
        <div class="detail-row">
          <div class="detail-l">Memory</div>
          <div class="detail-v">${esc(r.memory||"")}</div>
        </div>
        <div class="detail-row">
          <div class="detail-l">Status</div>
          <div class="detail-v"><strong>${esc(r.status||"—")}</strong></div>
        </div>
      </div>
      <div class="card-foot">
        <span>Tap for full detail</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>
    </article>`;
  }).join("");

  out.querySelectorAll(".card").forEach(el=>{
    const toggle=()=>el.classList.toggle("open");
    el.addEventListener("click",toggle);
    el.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}
    });
  });
}

/* filter + chips */
function apply(){
  const s=F.q.toLowerCase().trim();
  VIEW=ALL.filter(r=>{
    if(F.status && String(r.status||"").trim()!==F.status) return false;
    if(s){
      const hay=[r.category,r.reference,r.memory,r.status,r.row].join(" ").toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });
  render();
}

function buildChips(){
  const counts={};
  ALL.forEach(r=>{
    const k=String(r.status||"Other").trim()||"Other";
    counts[k]=(counts[k]||0)+1;
  });
  // sort by priority: V.Imp, Imp, Note, other
  const order=["V.Imp","Imp","Note"];
  const keys=Object.keys(counts).sort((a,b)=>{
    const ai=order.indexOf(a), bi=order.indexOf(b);
    if(ai>=0&&bi>=0) return ai-bi;
    if(ai>=0) return -1;
    if(bi>=0) return 1;
    return a.localeCompare(b);
  });

  const chips=document.getElementById("chips");
  chips.innerHTML=
    `<button class="chip on" data-status="">All <span class="n">${ALL.length}</span></button>` +
    keys.map(k=>`<button class="chip" data-status="${esc(k)}">${esc(k)} <span class="n">${counts[k]}</span></button>`).join("");

  chips.querySelectorAll(".chip").forEach(c=>{
    c.addEventListener("click",()=>{
      chips.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
      c.classList.add("on");
      F.status=c.dataset.status;
      apply();
    });
  });
}

/* events */
document.getElementById("q").addEventListener("input",e=>{F.q=e.target.value;apply();});
document.getElementById("clearBtn").addEventListener("click",()=>{
  document.getElementById("q").value="";
  F.q=""; F.status="";
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.status===""));
  apply();
});

/* map row → object using normalized headers */
function rowToObject(rawHeaders, rawRow){
  const obj={row:"",category:"",reference:"",memory:"",status:""};
  rawHeaders.forEach((h,i)=>{
    const key=normalizeHeader(h);
    const val=(rawRow[i]||"").trim();
    if(key in obj) obj[key]=val;
  });
  return obj;
}

/* boot */
async function boot(){
  const out=document.getElementById("out");
  let txt="";
  try{
    const res=await fetch(CSV_URL,{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    txt=await res.text();
  } catch(err){
    out.innerHTML=`<div class="state">
      <div class="state-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/>
        </svg>
      </div>
      <h3>Could not load data</h3>
      <p>${esc(err.message)}<br><br>Serve this page over a local HTTP server, or verify the sheet is published to the web as CSV.</p>
    </div>`;
    return;
  }

  const rows=parseCSV(txt);
  if(rows.length<2){
    out.innerHTML=`<div class="state">
      <div class="state-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/>
        </svg>
      </div>
      <h3>Sheet is empty</h3>
      <p>Add a header row and at least one data row.</p>
    </div>`;
    return;
  }

  const rawHeaders=rows[0];
  ALL=rows.slice(1)
    .map(r=>rowToObject(rawHeaders,r))
    .filter(o=>o.memory || o.reference);

  buildChips();
  apply();
}
boot();
</script>
