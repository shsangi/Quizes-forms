<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0b0f" id="themeColorMeta" />
<title>My Jobs · Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
  (function(){
    var t = localStorage.getItem('jt-theme');
    if(!t){ t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
:root,
[data-theme="dark"]{
  --bg:#0a0b0f;
  --bg-elev:#111319;
  --surface:#16181f;
  --surface-2:#1c1f28;
  --border:#252832;
  --border-2:#333847;
  --text:#eceef3;
  --text-2:#9498a5;
  --text-3:#6a6f7e;

  --brand:#6366f1;
  --brand-2:#8b5cf6;
  --brand-soft:rgba(99,102,241,.14);
  --brand-border:rgba(99,102,241,.32);
  --brand-text:#a5b1ff;
  --brand-shadow:rgba(99,102,241,.55);

  --ok:#22c55e;
  --ok-bg:rgba(34,197,94,.11);
  --ok-br:rgba(34,197,94,.32);

  --err:#ef4444;
  --err-bg:rgba(239,68,68,.11);
  --err-br:rgba(239,68,68,.32);

  --warn:#f59e0b;
  --warn-bg:rgba(245,158,11,.11);
  --warn-br:rgba(245,158,11,.32);

  --info:#38bdf8;
  --info-bg:rgba(56,189,248,.11);
  --info-br:rgba(56,189,248,.32);

  --muted-bg:rgba(148,152,165,.09);
  --muted-br:rgba(148,152,165,.22);

  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --amb-a:rgba(99,102,241,.14);
  --amb-b:rgba(139,92,246,.11);
}
[data-theme="light"]{
  --bg:#f6f7fb;
  --bg-elev:#ffffff;
  --surface:#ffffff;
  --surface-2:#f2f3f8;
  --border:#e4e6ee;
  --border-2:#cfd3df;
  --text:#0d1017;
  --text-2:#5a5f6e;
  --text-3:#8a8f9e;

  --brand:#4f46e5;
  --brand-2:#7c3aed;
  --brand-soft:rgba(79,70,229,.09);
  --brand-border:rgba(79,70,229,.24);
  --brand-text:#4f46e5;
  --brand-shadow:rgba(79,70,229,.35);

  --ok:#16a34a;
  --ok-bg:rgba(22,163,74,.09);
  --ok-br:rgba(22,163,74,.28);

  --err:#dc2626;
  --err-bg:rgba(220,38,38,.09);
  --err-br:rgba(220,38,38,.28);

  --warn:#d97706;
  --warn-bg:rgba(217,119,6,.09);
  --warn-br:rgba(217,119,6,.28);

  --info:#0284c7;
  --info-bg:rgba(2,132,199,.09);
  --info-br:rgba(2,132,199,.28);

  --muted-bg:rgba(90,95,110,.08);
  --muted-br:rgba(90,95,110,.2);

  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --amb-a:rgba(79,70,229,.09);
  --amb-b:rgba(124,58,237,.07);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  font-feature-settings:"cv11","ss01";
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  line-height:1.55;
  letter-spacing:-.011em;
  overflow-x:hidden;
  transition:background .3s ease,color .3s ease;
}

.amb{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.amb::before{
  content:"";position:absolute;width:900px;height:900px;top:-400px;left:-200px;
  background:radial-gradient(circle,var(--amb-a),transparent 62%);
  filter:blur(60px);transition:background .4s ease;
}
.amb::after{
  content:"";position:absolute;width:700px;height:700px;top:-260px;right:-200px;
  background:radial-gradient(circle,var(--amb-b),transparent 60%);
  filter:blur(60px);transition:background .4s ease;
}

.shell{max-width:900px;margin:0 auto;padding:0 20px}

.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(22px) saturate(1.4);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  border-bottom:1px solid var(--border);
  transition:background .3s ease,border-color .3s ease;
}
.topbar-in{
  max-width:900px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:12px;
}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  display:grid;place-items:center;
  box-shadow:0 4px 14px -4px var(--brand-shadow);
  flex-shrink:0;
}
.brand-mark svg{width:18px;height:18px}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-txt b{font-weight:700;font-size:.92rem;letter-spacing:-.02em}
.brand-txt span{font-size:.68rem;font-weight:500;color:var(--text-3);letter-spacing:.01em}
.topbar-spacer{flex:1}

.clock{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 11px;border-radius:8px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);
  font-size:.72rem;font-weight:600;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:.02em;
  white-space:nowrap;
  transition:all .2s ease;
}
.clock:hover{border-color:var(--border-2);color:var(--text)}
.clock-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 6px var(--ok);
  animation:pulse 2s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes pulse{50%{opacity:.4}}
.clock .ampm{
  color:var(--brand-text);
  font-size:.62rem;
  font-weight:700;
  letter-spacing:.06em;
}

.icon-btn{
  width:36px;height:36px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);cursor:pointer;
  display:grid;place-items:center;
  transition:all .2s ease;flex-shrink:0;
  text-decoration:none;
  position:relative;overflow:hidden;
}
.icon-btn:hover{
  background:var(--surface-2);border-color:var(--border-2);
  color:var(--text);transform:translateY(-1px);
}
.icon-btn:active{transform:translateY(0)}
.icon-btn svg{width:16px;height:16px}

.theme-btn svg{
  transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;
  position:absolute;
}
[data-theme="dark"] .theme-btn .icon-moon{opacity:0;transform:rotate(-90deg) scale(.6)}
[data-theme="dark"] .theme-btn .icon-sun{opacity:1;transform:rotate(0) scale(1)}
[data-theme="light"] .theme-btn .icon-sun{opacity:0;transform:rotate(90deg) scale(.6)}
[data-theme="light"] .theme-btn .icon-moon{opacity:1;transform:rotate(0) scale(1)}

.sheet-btn{
  background:var(--brand-soft);
  border-color:var(--brand-border);
  color:var(--brand-text);
}
.sheet-btn:hover{
  background:var(--brand);
  border-color:var(--brand);
  color:#fff;
}

/* Version badge — no dot */
.version{
  display:inline-flex;align-items:center;
  padding:5px 10px;border-radius:8px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-2);font-size:.72rem;font-weight:600;
  letter-spacing:.02em;font-family:'JetBrains Mono',monospace;
  transition:all .2s ease;white-space:nowrap;
}
.version:hover{border-color:var(--border-2);color:var(--text)}

.page-top{padding:28px 0 8px}

.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  margin-bottom:26px;
}
.stat{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:13px 15px;transition:all .2s ease;
}
.stat:hover{border-color:var(--border-2)}
.stat-l{
  font-size:.64rem;font-weight:600;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;
}
.stat-v{
  font-size:1.35rem;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
  font-family:'JetBrains Mono',monospace;
}
.stat-v.muted{color:var(--text-3)}
.stat-v.ok{color:var(--ok)}

.section-h{
  display:flex;align-items:center;gap:10px;
  margin:24px 0 10px;padding:0 2px;
}
.section-h h2{
  font-size:.7rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;
  color:var(--text-3);
  display:flex;align-items:center;gap:8px;
}
.section-h h2 svg{width:12px;height:12px}
.section-h::after{content:"";flex:1;height:1px;background:var(--border)}
.section-h .count{
  font-family:'JetBrains Mono',monospace;
  font-size:.68rem;font-weight:600;
  padding:2px 7px;border-radius:5px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-3);
}

.list{display:flex;flex-direction:column;gap:6px}

.job{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  transition:all .18s cubic-bezier(.32,.72,0,1);
  animation:rise .28s cubic-bezier(.32,.72,0,1) both;
  position:relative;
  overflow:hidden;
}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.job:hover{
  border-color:var(--border-2);
  background:var(--surface-2);
  box-shadow:var(--shadow-sm);
}
.job::before{
  content:"";
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--stripe,var(--muted-br));
  transition:background .2s ease;
}
.job.urgent-near::before{background:var(--err)}
.job.urgent-soon::before{background:var(--warn)}
.job.urgent-far::before{background:var(--ok)}
.job.urgent-past::before{background:var(--border-2)}

.job-date{
  flex-shrink:0;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 9px;
  border-radius:8px;
  background:var(--bg-elev);
  border:1px solid var(--border);
  font-family:'JetBrains Mono',monospace;
  font-size:.72rem;
  font-weight:600;
  letter-spacing:.01em;
  color:var(--text-2);
  transition:all .18s ease;
  min-width:82px;
  justify-content:center;
}
.job-date .d-day{color:var(--text);font-weight:700}
.job-date .d-mon{color:var(--text-3);font-size:.66rem;text-transform:uppercase}
.job-date .d-year{color:var(--text-3);font-size:.62rem}
.job.urgent-near .job-date{border-color:var(--err-br);background:var(--err-bg)}
.job.urgent-near .job-date .d-day{color:var(--err)}
.job.urgent-soon .job-date{border-color:var(--warn-br);background:var(--warn-bg)}
.job.urgent-soon .job-date .d-day{color:var(--warn)}
.job.urgent-far .job-date .d-day{color:var(--ok)}
.job.urgent-past .job-date{opacity:.6}

.job-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.job-title{
  font-size:.9rem;font-weight:600;
  letter-spacing:-.012em;line-height:1.3;
  color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.job-meta{
  display:flex;gap:12px;
  font-size:.72rem;color:var(--text-3);
  min-width:0;overflow:hidden;
}
.job-meta .m{display:inline-flex;align-items:center;gap:5px;min-width:0}
.job-meta .m svg{width:11px;height:11px;opacity:.7;flex-shrink:0}
.job-meta .m b{
  color:var(--text-2);font-weight:500;
  font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.job-meta .m.empty b{color:var(--text-3);font-style:italic}

.job-badge{
  flex-shrink:0;
  display:inline-flex;align-items:center;gap:6px;
}
.badge{
  padding:3px 9px;border-radius:999px;
  font-size:.6rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;
  border:1px solid;
  display:inline-flex;align-items:center;gap:4px;
  white-space:nowrap;line-height:1.5;
}
.badge::before{
  content:"";width:4px;height:4px;border-radius:50%;
  background:currentColor;flex-shrink:0;
}
.badge.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-br)}
.badge.err{color:var(--err);background:var(--err-bg);border-color:var(--err-br)}
.badge.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-br)}
.badge.info{color:var(--info);background:var(--info-bg);border-color:var(--info-br)}
.badge.muted{color:var(--text-3);background:var(--muted-bg);border-color:var(--muted-br)}

.badge-sub{
  font-size:.62rem;font-weight:500;
  color:var(--text-3);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.state{padding:70px 20px;text-align:center}
.state-ico{
  width:52px;height:52px;border-radius:13px;margin:0 auto 15px;
  background:var(--surface);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--text-3);
}
.state-ico svg{width:22px;height:22px}
.state h3{font-size:1rem;font-weight:600;margin-bottom:6px;letter-spacing:-.02em}
.state p{color:var(--text-3);font-size:.85rem;max-width:420px;margin:0 auto;line-height:1.6}
.loader{
  width:26px;height:26px;margin:0 auto 13px;
  border:2px solid var(--border);border-top-color:var(--brand);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

footer{
  margin-top:44px;padding:22px 0;
  border-top:1px solid var(--border);
  text-align:center;color:var(--text-3);font-size:.76rem;
}

@media (max-width:640px){
  .shell{padding:0 14px}
  .topbar-in{padding:11px 14px;gap:8px}
  .brand-txt span{display:none}
  .clock{padding:4px 9px;font-size:.68rem}
  .clock .ampm{font-size:.58rem}
  .icon-btn{width:34px;height:34px}
  .version{padding:4px 8px;font-size:.68rem}
  .page-top{padding:18px 0 6px}

  .stats{grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:20px}
  .stat{padding:9px 11px}
  .stat-l{font-size:.58rem;margin-bottom:3px}
  .stat-v{font-size:1.05rem}

  .section-h{margin:20px 0 9px}

  .job{padding:10px 12px;gap:10px;flex-wrap:wrap}
  .job-date{min-width:70px;padding:4px 8px;font-size:.68rem}
  .job-date .d-mon{font-size:.62rem}
  .job-date .d-year{font-size:.58rem}
  .job-body{flex:1 1 100%;order:2}
  .job-badge{order:3;width:100%;justify-content:flex-start;margin-top:1px}
  .job-title{font-size:.86rem}
  .job-meta{font-size:.68rem;gap:10px}
}
@media (max-width:400px){
  .version .v-num{display:none}
  .job-meta .m:nth-child(3){display:none}
}

::selection{background:var(--brand-soft);color:var(--text)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
</style>
</head>
<body>

<div class="amb"></div>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M12 4V2"/>
          <path d="M14 3.5a2.5 2.5 0 1 1 0 5"/>
          <path d="M4 21a8 8 0 0 1 16 0"/>
        </svg>
      </div>
      <div class="brand-txt">
        <b>My Jobs</b>
        <span>Application Tracker</span>
      </div>
    </div>
    <div class="topbar-spacer"></div>

    <div class="clock" title="Pakistan Standard Time (UTC+5)">
      <span class="clock-dot"></span>
      <span id="pktClock">--:--</span>
      <span class="ampm" id="pktAmPm">--</span>
    </div>

    <a class="icon-btn sheet-btn" id="sheetBtn" href="https://docs.google.com/spreadsheets/d/1SJRPdkff35aF60k--P-_Mf7s7m0TM1BFlLSPhdkUuK4/edit" target="_blank" rel="noopener" aria-label="Open Google Sheet" title="Open sheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="8" y1="13" x2="16" y2="13"/>
        <line x1="8" y1="17" x2="13" y2="17"/>
      </svg>
    </a>

    <button class="icon-btn theme-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2"/><path d="M12 20v2"/>
        <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
        <path d="M2 12h2"/><path d="M20 12h2"/>
        <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    <div class="version" title="App version">
      <span class="v-num">v1.0.0</span>
    </div>
  </div>
</div>

<div class="shell">
  <div class="page-top"></div>

  <section class="stats" id="stats">
    <div class="stat">
      <div class="stat-l">Total</div>
      <div class="stat-v" id="sTotal">—</div>
    </div>
    <div class="stat">
      <div class="stat-l">Upcoming</div>
      <div class="stat-v ok" id="sUpcoming">—</div>
    </div>
    <div class="stat">
      <div class="stat-l">Past</div>
      <div class="stat-v muted" id="sPast">—</div>
    </div>
  </section>

  <div id="out">
    <div class="state">
      <div class="loader"></div>
      <p>Fetching applications…</p>
    </div>
  </div>

  <footer>Data · Google Sheets · Times shown in Pakistan Standard Time (UTC+5)</footer>
</div>

<script>
/* ============================================================
   LIVE DATA from your jobs sheet
   ============================================================ */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSUBCdhjwLbdOb968RwtVQYOy_0xLl1x9OQDoctPsD-wfO_c6ob5zUElpUpUxPeyhrwKOt321WiXTSa/pub?output=csv";

/* Pakistan Standard Time */
const PKT_OFFSET_MIN = 5 * 60;
function nowInPKT(){
  const now = new Date();
  const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utcMs + PKT_OFFSET_MIN * 60000);
}
function pad2(n){ return String(n).padStart(2,"0"); }
function tickClock(){
  const pkt = nowInPKT();
  let h = pkt.getHours();
  const m = pkt.getMinutes();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12; if(h === 0) h = 12;
  const timeEl = document.getElementById("pktClock");
  const ampmEl = document.getElementById("pktAmPm");
  if(timeEl) timeEl.textContent = `${pad2(h)}:${pad2(m)}`;
  if(ampmEl) ampmEl.textContent = ampm;
}
tickClock();
setInterval(tickClock, 1000 * 15);

/* theme */
const themeBtn=document.getElementById("themeBtn");
const themeColorMeta=document.getElementById("themeColorMeta");
function applyThemeColor(){
  const t=document.documentElement.getAttribute("data-theme");
  themeColorMeta.setAttribute("content",t==="light"?"#f6f7fb":"#0a0b0f");
}
applyThemeColor();
themeBtn.addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  localStorage.setItem("jt-theme",next);
  applyThemeColor();
});

/* CSV parser */
function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i],n=t[i+1];
    if(q){
      if(c==='"'&&n==='"'){f+='"';i++;}
      else if(c==='"'){q=false;}
      else f+=c;
    } else {
      if(c==='"')q=true;
      else if(c===','){row.push(f);f="";}
      else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";}
      else if(c==='\r'){}
      else f+=c;
    }
  }
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(c=>c&&c.trim()!==""));
}
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function normalizeHeader(h){
  let s = String(h||"").trim().toLowerCase();
  s = s.replace(/\s+/g," ");
  s = s.replace(/aplied/g,"applied");
  if(/test ?date.*applied ?on/.test(s)) return "TEST_DATE_APPLIED_ON_COLLAPSED";
  if(s==="sr no"||s==="srno"||s==="sr_no"||s==="sno"||s==="no") return "sr_no";
  if(s==="applied job"||s==="job"||s==="applied jobs") return "applied_job";
  if(s==="test date"||s==="testdate"||s==="test_date") return "test_date";
  if(s==="applied on"||s==="appliedon"||s==="applied_on"||s==="apply date") return "applied_on";
  if(s==="venue"||s==="test venue"||s==="center"||s==="centre") return "venue";
  return s;
}

function parseDate(str){
  if(!str) return null;
  const s=String(str).trim();
  if(!s) return null;
  let m=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})$/);
  if(m){
    let d=+m[1], mo=+m[2], y=+m[3];
    if(y<100) y+=2000;
    if(mo>12 && d<=12){ const t=d; d=mo; mo=t; }
    const dt=new Date(y,mo-1,d);
    if(isNaN(dt.getTime())) return null;
    if(dt.getDate()!==d || dt.getMonth()!==mo-1) return null;
    return dt;
  }
  m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(m){
    const dt=new Date(+m[1],+m[2]-1,+m[3]);
    return isNaN(dt.getTime())?null:dt;
  }
  const dt=new Date(s);
  return isNaN(dt.getTime())?null:dt;
}
function fmtDate(dt){
  if(!dt) return null;
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return {
    day:dt.getDate(),
    mon:months[dt.getMonth()],
    year:dt.getFullYear(),
    full:`${dt.getDate()} ${months[dt.getMonth()]} ${dt.getFullYear()}`
  };
}
function daysBetween(a,b){
  const ms=24*60*60*1000;
  const a0=new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const b0=new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((b0-a0)/ms);
}
function todayPKT(){
  const p=nowInPKT();
  return new Date(p.getFullYear(),p.getMonth(),p.getDate());
}
function urgencyFor(testDate, today){
  if(!testDate) return {kind:"none",cls:"urgent-past",badge:"muted",label:"No date",sub:""};
  const diff=daysBetween(today,testDate);
  if(diff<0) return {kind:"past",cls:"urgent-past",badge:"muted",label:"Past",sub:`${Math.abs(diff)} day${Math.abs(diff)===1?"":"s"} ago`};
  if(diff===0) return {kind:"today",cls:"urgent-near",badge:"err",label:"Today",sub:""};
  if(diff===1) return {kind:"tomorrow",cls:"urgent-near",badge:"err",label:"Tomorrow",sub:""};
  if(diff<=7) return {kind:"week",cls:"urgent-soon",badge:"warn",label:"This week",sub:`in ${diff} days`};
  if(diff<=30) return {kind:"month",cls:"urgent-far",badge:"info",label:"Upcoming",sub:`in ${diff} days`};
  return {kind:"far",cls:"urgent-far",badge:"ok",label:"Upcoming",sub:`in ${diff} days`};
}

const SVG_CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
const SVG_SEND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
const SVG_PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
const SVG_UP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
const SVG_PAST='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';

function render(rows){
  const out=document.getElementById("out");
  const today=todayPKT();

  if(!rows.length){
    out.innerHTML=`<div class="state">
      <div class="state-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
        </svg>
      </div>
      <h3>No applications yet</h3>
      <p>Add rows to your sheet — they'll appear here automatically.</p>
    </div>`;
    return;
  }

  const withDates = rows.map(r=>{
    const testDate=parseDate(r.test_date);
    const appliedOn=parseDate(r.applied_on);
    const urg=urgencyFor(testDate, today);
    return {...r, _testDate:testDate, _appliedOn:appliedOn, _urg:urg};
  });

  const upcoming = withDates
    .filter(r=>r._testDate && r._urg.kind!=="past")
    .sort((a,b)=>a._testDate-b._testDate);
  const past = withDates
    .filter(r=>r._testDate && r._urg.kind==="past")
    .sort((a,b)=>b._testDate-a._testDate);
  const noDate = withDates.filter(r=>!r._testDate);

  document.getElementById("sTotal").textContent=withDates.length;
  document.getElementById("sUpcoming").textContent=upcoming.length;
  document.getElementById("sPast").textContent=past.length;

  function cardHTML(r,i){
    const u=r._urg;
    const fDate=r._testDate?fmtDate(r._testDate):{day:"—",mon:"TBD",year:""};
    const applied=r._appliedOn?fmtDate(r._appliedOn).full:null;
    const venue=r.venue||null;

    return `<article class="job ${u.cls}" style="animation-delay:${Math.min(i*22,200)}ms">
      <div class="job-date">
        <span class="d-day">${fDate.day}</span>
        <span class="d-mon">${fDate.mon}</span>
        ${fDate.year?`<span class="d-year">${fDate.year}</span>`:""}
      </div>
      <div class="job-body">
        <div class="job-title" title="${esc(r.applied_job||"")}">${esc(r.applied_job||"Untitled")}</div>
        <div class="job-meta">
          <span class="m">
            ${SVG_CAL}
            <span>Test:</span>
            <b>${r._testDate?fmtDate(r._testDate).full:"Not set"}</b>
          </span>
          <span class="m ${applied?'':'empty'}">
            ${SVG_SEND}
            <span>Applied:</span>
            <b>${applied||"Not set"}</b>
          </span>
          ${venue?`<span class="m">
            ${SVG_PIN}
            <span>Venue:</span>
            <b title="${esc(venue)}">${esc(venue)}</b>
          </span>`:""}
        </div>
      </div>
      <div class="job-badge">
        <span class="badge ${u.badge}">${u.label}</span>
        ${u.sub?`<span class="badge-sub">${u.sub}</span>`:""}
      </div>
    </article>`;
  }

  let html="";
  if(upcoming.length){
    html+=`<div class="section-h"><h2>${SVG_UP} Upcoming Tests</h2><span class="count">${upcoming.length}</span></div>`;
    html+=`<div class="list">${upcoming.map(cardHTML).join("")}</div>`;
  }
  if(noDate.length){
    html+=`<div class="section-h"><h2>${SVG_CAL} Date Not Set</h2><span class="count">${noDate.length}</span></div>`;
    html+=`<div class="list">${noDate.map(cardHTML).join("")}</div>`;
  }
  if(past.length){
    html+=`<div class="section-h"><h2>${SVG_PAST} Past Tests</h2><span class="count">${past.length}</span></div>`;
    html+=`<div class="list">${past.map(cardHTML).join("")}</div>`;
  }

  out.innerHTML=html;
}

function rowToObject(rawHeaders, rawRow){
  const obj={ sr_no:"", applied_job:"", test_date:"", applied_on:"", venue:"" };
  rawHeaders.forEach((h,i)=>{
    const key=normalizeHeader(h);
    const val=(rawRow[i]||"").trim();

    if(key==="TEST_DATE_APPLIED_ON_COLLAPSED"){
      const combined=val.replace(/\s+/g,"");
      const m=combined.match(/^(\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4})(\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4})$/);
      if(m){ obj.test_date=m[1]; obj.applied_on=m[2]; }
      else { obj.test_date=val; }
      return;
    }
    if(key in obj) obj[key]=val;
  });
  return obj;
}

async function boot(){
  const out=document.getElementById("out");
  let txt="";
  try{
    const res=await fetch(CSV_URL,{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    txt=await res.text();
  } catch(err){
    out.innerHTML=`<div class="state">
      <div class="state-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/>
        </svg>
      </div>
      <h3>Could not load data</h3>
      <p>${esc(err.message)}<br><br>Serve this page over a local HTTP server, or verify the sheet is published to the web as CSV.</p>
    </div>`;
    return;
  }

  const rows=parseCSV(txt);
  if(rows.length<2){
    out.innerHTML=`<div class="state">
      <div class="state-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/>
        </svg>
      </div>
      <h3>Sheet is empty</h3>
      <p>Add a header row and at least one data row.</p>
    </div>`;
    return;
  }

  const rawHeaders=rows[0];
  const objs=rows.slice(1)
    .map(r=>rowToObject(rawHeaders,r))
    .filter(o=>o.applied_job || o.test_date);

  render(objs);
}
boot();
</script>
