<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0ea5e9">
  <title>Self Learners · MCQs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
    body{background:#f4f6fa;display:flex;justify-content:center;min-height:100vh;color:#0f1419}
    .wrap{width:100%;max-width:920px;padding:16px}
    .top{position:sticky;top:0;z-index:10;background:#fff;border:1px solid #e2e8f0;
         border-radius:16px;padding:10px 14px;margin-bottom:12px;
         box-shadow:0 8px 20px -6px rgba(10,30,63,.12);display:flex;
         justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .title{font-weight:800;color:#0a1e3f;font-size:.95rem;flex:1;min-width:120px}
    .right{display:flex;gap:6px;align-items:center}
    .pill{background:#e0f2fe;color:#0284c7;font-weight:800;font-size:.62rem;
          padding:.28rem .6rem;border-radius:9999px;border:1px solid #7dd3fc}
    .timer{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;
           font-weight:800;font-size:.62rem;padding:.28rem .6rem;border-radius:9999px}
    .dots-btn{background:#f8fafc;border:1.5px solid #e2e8f0;width:32px;height:32px;
              border-radius:10px;cursor:pointer;font-size:1rem;color:#475569;
              display:flex;align-items:center;justify-content:center;transition:all .15s;
              font-family:inherit;font-weight:800;line-height:1}
    .dots-btn:hover{background:#0ea5e9;border-color:#0ea5e9;color:#fff}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;
          padding:22px;box-shadow:0 20px 40px -12px rgba(10,30,63,.18)}
    .q{font-weight:700;font-size:1.1rem;color:#0a1e3f;line-height:1.55;margin-bottom:16px}
    .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
         background:#fff;border:1.5px solid #e2e8f0;border-radius:9999px;
         padding:14px 18px;font-size:.95rem;font-weight:600;cursor:pointer;
         margin-bottom:10px;font-family:inherit;transition:all .15s;color:#0f1419}
    .opt:hover:not(:disabled){background:#e0f2fe;border-color:#0ea5e9}
    .opt .k{background:#e0f2fe;color:#0284c7;font-weight:800;width:28px;height:28px;
            border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .opt.ok{background:#d1fae5;border-color:#059669}
    .opt.ok .k{background:#059669;color:#fff}
    .opt.bad{background:#fee2e2;border-color:#dc2626}
    .opt.bad .k{background:#dc2626;color:#fff}
    .opt:disabled{cursor:default}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:14px;
           border-top:1px dashed #e2e8f0}
    .chip{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;
          padding:.3rem .7rem;border-radius:9999px}
    .chip.subject{background:#e0f2fe;color:#0284c7;border:1px solid #7dd3fc}
    .chip.topic{background:#fff7dd;color:#92400e;border:1px solid #fcd34d}
    .chip.job{background:#0a1e3f;color:#f5b800}
    .invalid-msg{margin-top:10px;padding:10px 14px;background:#fee2e2;
                 border:1.5px solid #dc2626;border-left:5px solid #dc2626;
                 border-radius:12px;color:#dc2626;font-weight:800;
                 font-size:.85rem;display:flex;align-items:center;gap:8px}
    .bar{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
         background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border:none;
         font-weight:700;font-size:.9rem;padding:.7rem 1.4rem;border-radius:9999px;
         cursor:pointer;font-family:inherit;transition:all .15s;
         box-shadow:0 4px 12px rgba(2,132,199,.25)}
    .btn:active{transform:scale(.96)}
    .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
    .btn-outline{background:#fff;color:#0284c7;border:1.5px solid #bae6fd;
                 box-shadow:0 2px 8px rgba(2,132,199,.08)}
    .btn-outline:hover:not(:disabled){background:#f0f9ff}
    .btn-green{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 12px rgba(5,150,105,.3)}
    .btn svg{width:18px;height:18px;flex-shrink:0}
    .load{padding:60px;text-align:center;color:#475569;font-weight:600}
    .grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
    .dot{width:28px;height:28px;border-radius:50%;background:#f4f6fa;border:2px solid transparent;
         font-size:.68rem;font-weight:700;color:#94a3b8;display:flex;align-items:center;
         justify-content:center;cursor:pointer;font-family:inherit;transition:transform .15s}
    .dot:hover{transform:scale(1.12)}
    .dot.ok{background:#059669;color:#fff}
    .dot.bad{background:#dc2626;color:#fff}
    .dot.inv{background:#f5b800;color:#0a1e3f}
    .dot.cur{border-color:#0284c7;transform:scale(1.2);box-shadow:0 0 0 3px rgba(2,132,199,.2)}
    .end-wrap{display:flex;justify-content:center;margin-top:16px;padding-top:16px;
              border-top:1px solid #e2e8f0}
    .stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
    .stat{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:800;
          padding:.32rem .7rem;border-radius:9999px;border:1.5px solid;background:#fff}
    .stat .n{font-weight:900;font-size:.75rem}
    .stat.ok{background:#d1fae5;border-color:#10b981;color:#059669}
    .stat.bad{background:#fee2e2;border-color:#fca5a5;color:#dc2626}
    .stat.pend{background:#f8fafc;border-color:#cbd5e1;color:#475569}
    .stat.inv{background:#fef3c7;border-color:#fcd34d;color:#92400e}
    .result-icon{font-size:3rem;margin-bottom:8px}

    /* DRAWER */
    .overlay{position:fixed;inset:0;background:rgba(10,30,63,.55);backdrop-filter:blur(6px);
             z-index:900;opacity:0;pointer-events:none;transition:opacity .25s}
    .overlay.on{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;right:0;bottom:0;width:min(92vw,400px);background:#fff;
            z-index:901;transform:translateX(105%);transition:transform .35s cubic-bezier(.16,1,.3,1);
            display:flex;flex-direction:column;box-shadow:-20px 0 60px -12px rgba(10,30,63,.35)}
    .drawer.on{transform:translateX(0)}
    .dhead{padding:14px 18px;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;
           display:flex;justify-content:space-between;align-items:center}
    .dhead h3{font-size:1rem;font-weight:800}
    .dclose{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);
            color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;
            font-family:inherit;font-weight:800;font-size:.9rem}
    .dbody{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
    .flabel{font-size:.72rem;font-weight:800;color:#0a1e3f;text-transform:uppercase;
            letter-spacing:.06em;margin-bottom:6px;display:block}
    .finput{width:100%;padding:.7rem .9rem;border:1.5px solid #e2e8f0;border-radius:12px;
            font-family:inherit;font-size:.85rem;outline:none;background:#f8fafc}
    .finput:focus{border-color:#0ea5e9;background:#fff;box-shadow:0 0 0 3px rgba(14,165,233,.12)}
    .chips-box{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
    .cchip{display:inline-flex;align-items:center;gap:4px;background:#0ea5e9;color:#fff;
           font-size:.68rem;font-weight:700;padding:.25rem .55rem;border-radius:9999px}
    .cchip button{background:0 0;border:none;color:#fff;font-size:.85rem;cursor:pointer;
                  font-weight:800;padding:0;line-height:1;font-family:inherit}
    .dd{position:relative}
    .dd-box{border:1.5px solid #e2e8f0;border-radius:12px;background:#fff;
            padding:.55rem .7rem;min-height:42px;cursor:pointer;
            display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.82rem;font-weight:600;color:#475569}
    .dd-box:hover{border-color:#0ea5e9}
    .dd-box .arrow{margin-left:auto;font-size:.6rem;color:#94a3b8;transition:transform .2s}
    .dd.on .arrow{transform:rotate(180deg)}
    .dd-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;
             border:1.5px solid #e2e8f0;border-radius:12px;box-shadow:0 16px 40px -10px rgba(10,30,63,.25);
             max-height:240px;overflow-y:auto;padding:.35rem;z-index:10;display:none}
    .dd.on .dd-menu{display:block}
    .dd-item{padding:.5rem .7rem;border-radius:8px;font-size:.8rem;font-weight:600;
             cursor:pointer;display:flex;align-items:center;gap:.5rem;color:#0f1419}
    .dd-item:hover{background:#e0f2fe;color:#0284c7}
    .dd-item.sel{background:#0ea5e9;color:#fff}
    .dd-item .chk{width:16px;height:16px;border:1.5px solid #cbd5e1;border-radius:4px;
                  display:flex;align-items:center;justify-content:center;font-size:.7rem;
                  color:#fff;flex-shrink:0}
    .dd-item.sel .chk{background:#fff;color:#0284c7;border-color:#fff}
    .count-row{display:flex;gap:6px;flex-wrap:wrap}
    .cb{padding:.5rem .85rem;border:1.5px solid #e2e8f0;border-radius:9999px;background:#fff;
        cursor:pointer;font-family:inherit;font-weight:700;font-size:.78rem;color:#475569;transition:all .15s}
    .cb:hover{border-color:#0ea5e9;color:#0284c7}
    .cb.on{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border-color:#0284c7}
    .dload{width:100%;padding:.85rem;border:none;border-radius:9999px;font-family:inherit;
           font-weight:800;font-size:.9rem;color:#fff;cursor:pointer;
           background:linear-gradient(135deg,#10b981,#059669);
           box-shadow:0 4px 12px rgba(5,150,105,.3)}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title" id="title">Loading…</div>
    <div class="right">
      <span class="pill" id="count">0/0</span>
      <span class="timer" id="timer">00:00</span>
      <button class="dots-btn" id="dotsBtn" title="Filters">⋯</button>
    </div>
  </div>

  <div class="card">
    <div id="body"><div class="load">🔄 Loading questions…</div></div>
    <div class="grid" id="grid"></div>
    <div class="end-wrap" id="endWrap"></div>
    <div class="stats" id="stats"></div>
  </div>
</div>

<!-- DRAWER -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="dhead">
    <h3>⚙️ Filters</h3>
    <button class="dclose" id="dClose">✕</button>
  </div>
  <div class="dbody">
    <div>
      <label class="flabel">🔍 Search (case-insensitive)</label>
      <input class="finput" id="searchBox" placeholder="Search question, topic, subject…" autocomplete="off">
    </div>

    <div>
      <label class="flabel">💼 Jobs</label>
      <div class="chips-box" id="jobChips"></div>
      <div class="dd" id="jobDd">
        <div class="dd-box" id="jobBox"><span id="jobText">All jobs</span><span class="arrow">▼</span></div>
        <div class="dd-menu" id="jobMenu"></div>
      </div>
    </div>

    <div>
      <label class="flabel">📚 Subjects</label>
      <div class="chips-box" id="subjChips"></div>
      <div class="dd" id="subjDd">
        <div class="dd-box" id="subjBox"><span id="subjText">All subjects</span><span class="arrow">▼</span></div>
        <div class="dd-menu" id="subjMenu"></div>
      </div>
    </div>

    <div>
      <label class="flabel"># MCQs to load</label>
      <div class="count-row" id="countRow">
        <button class="cb" data-n="5">5</button>
        <button class="cb" data-n="10">10</button>
        <button class="cb on" data-n="20">20</button>
        <button class="cb" data-n="100">100</button>
        <button class="cb" data-n="200">200</button>
        <button class="cb" data-n="0">All</button>
      </div>
    </div>

    <button class="dload" id="loadBtn">🔄 Load Quiz</button>
  </div>
</aside>

<script>
const QUIZ_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQyB_I39SsLmQC5C8O1KkzZEUgFPAIJQ95k0vFj9M-HX8vI9hsdLh0GFYYO8O1QFnvP4vWkAh3nmbd3/pub?output=csv';
let all=[],qs=[],ans=[],cur=0,time=0,timer=null,total=0,invalidSet=new Set();
let selJobs=new Set(),selSubjs=new Set(),pickN=20,searchQ='';

const $=id=>document.getElementById(id);
const clean=s=>String(s??'').replace(/[\u200B-\u200D\uFEFF\u00A0]/g,' ').replace(/\s+/g,' ').trim();
const parseCSV=l=>{const r=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];
  if(q){if(ch==='"'&&l[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}
  else{if(ch==='"')q=true;else if(ch===','){r.push(clean(c));c=''}else c+=ch}}
  r.push(clean(c));return r};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const findCorrect=(raw,opts)=>{if(!raw)return -1;const r=clean(raw);
  for(let i=0;i<opts.length;i++)if(clean(opts[i])===r)return i;
  if(/^[A-Da-d]$/.test(r))return 'abcd'.indexOf(r.toLowerCase());
  if(/^[1-4]$/.test(r))return +r-1;return -1};
const titleCase=s=>!s?'':clean(s).split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const eq=(a,b)=>clean(a).toLowerCase()===clean(b).toLowerCase();

const SPECIAL=[/all\s+of\s+(the\s+)?above/i,/none\s+of\s+(the\s+)?above/i,/above\s+all/i,/\bboth\b/i,/^\s*none\s*$/i,/all\s+of\s+these/i];
const isSpecial=o=>{const t=clean(o);return t&&SPECIAL.some(p=>p.test(t))};

function shuffleOpts(opts){
  const fixed={},free=[];
  opts.forEach((o,i)=>{ if(isSpecial(o))fixed[i]=o; else free.push(o); });
  const sh=shuffle(free);
  const out=new Array(opts.length);
  Object.keys(fixed).forEach(k=>out[+k]=fixed[k]);
  let p=0;
  for(let i=0;i<out.length;i++) if(out[i]===undefined) out[i]=sh[p++];
  return out;
}

function shuffleByCategory(list){
  const b=new Map();
  list.forEach(it=>{
    const k=[it.job,it.subject,it.topic].map(s=>clean(s).toLowerCase()).join('|||');
    if(!b.has(k))b.set(k,[]);
    b.get(k).push(it);
  });
  const keys=shuffle([...b.keys()]),out=[];
  keys.forEach(k=>out.push(...shuffle(b.get(k))));
  return out;
}

async function load(){
  try{
    const r=await fetch(QUIZ_URL+'&_t='+Date.now(),{cache:'no-store'});
    const text=await r.text();
    const lines=text.split('\n').filter(l=>l.trim());
    all=[];
    for(let i=1;i<lines.length;i++){
      const c=parseCSV(lines[i]);
      if(c.length<9||!c[1])continue;
      const show=(c[13]||'').toLowerCase();
      if(show==='0'||show==='false'||show==='no')continue;
      const opts=[c[2]||'',c[3]||'',c[4]||'',c[5]||''].map(clean);
      const correct=findCorrect(c[6],opts);
      all.push({q:c[1],opts,correct,subject:c[8]||'',topic:c[7]||'',job:c[10]||''});
    }
    buildMenus();
    applyAndLoad();
  }catch(e){console.error(e);$('body').innerHTML='<div class="load">❌ Failed to load</div>'}
}

function applyAndLoad(){
  // filter
  let list=all.slice();
  if(selJobs.size) list=list.filter(x=>[...selJobs].some(j=>eq(j,x.job)));
  if(selSubjs.size) list=list.filter(x=>[...selSubjs].some(s=>eq(s,x.subject)));
  if(searchQ){
    const q=searchQ.toLowerCase();
    list=list.filter(x=>
      (x.q||'').toLowerCase().includes(q) ||
      (x.subject||'').toLowerCase().includes(q) ||
      (x.topic||'').toLowerCase().includes(q) ||
      (x.job||'').toLowerCase().includes(q) ||
      x.opts.some(o=>(o||'').toLowerCase().includes(q))
    );
  }
  list=shuffleByCategory(list);
  if(pickN>0) list=list.slice(0,pickN);
  qs=list.map(x=>{
    const newOpts=shuffleOpts(x.opts);
    const ct=x.opts[x.correct];
    const nc=ct!==undefined? newOpts.findIndex(o=>eq(o,ct)) : -1;
    return {...x,opts:newOpts,correct:nc};
  });
  invalidSet=new Set();
  qs.forEach((x,i)=>{if(x.correct===-1)invalidSet.add(i)});
  total=qs.length;ans=Array(total).fill(null);cur=0;time=total*60;
  $('title').textContent=`${selJobs.size?[...selJobs].map(titleCase).join(', '):'All Jobs'} MCQs`;
  $('count').textContent='0/'+total;
  closeDrawer();
  clearInterval(timer);startTimer();render();grid();renderEnd();stats();
  scrollTo({top:0,behavior:'smooth'});
}

function buildMenus(){
  const jobs=[...new Set(all.map(x=>clean(x.job)).filter(Boolean))].sort();
  $('jobMenu').innerHTML=
    `<div class="dd-item" data-v=""><span class="chk">✓</span>All jobs</div>`+
    jobs.map(j=>`<div class="dd-item" data-v="${j}"><span class="chk"></span>${titleCase(j)}</div>`).join('');
  $('jobMenu').querySelectorAll('.dd-item').forEach(el=>{
    el.onclick=e=>{
      e.stopPropagation();
      const v=el.dataset.v;
      if(!v){ selJobs.clear(); }
      else { if(selJobs.has(v))selJobs.delete(v); else selJobs.add(v); }
      refreshJobMenu();refreshSubjectMenu();
    };
  });
  refreshJobMenu();refreshSubjectMenu();
}

function refreshJobMenu(){
  const items=$('jobMenu').querySelectorAll('.dd-item');
  items.forEach(el=>{
    const v=el.dataset.v;
    const on=v? selJobs.has(v) : selJobs.size===0;
    el.classList.toggle('sel',on);
    el.querySelector('.chk').textContent=on?'✓':'';
  });
  $('jobText').textContent=selJobs.size===0?'All jobs':`${selJobs.size} selected`;
  renderChips('jobChips',selJobs,v=>{selJobs.delete(v);refreshJobMenu();refreshSubjectMenu()});
}

function refreshSubjectMenu(){
  // subjects limited to currently selected jobs (or all if none)
  const pool = selJobs.size===0
    ? all
    : all.filter(x=>[...selJobs].some(j=>eq(j,x.job)));
  const subs=[...new Set(pool.map(x=>clean(x.subject)).filter(Boolean))].sort();
  // drop selected subjects no longer in pool
  [...selSubjs].forEach(s=>{if(!subs.some(x=>eq(x,s)))selSubjs.delete(s)});
  $('subjMenu').innerHTML=
    `<div class="dd-item" data-v=""><span class="chk">✓</span>All subjects</div>`+
    subs.map(s=>`<div class="dd-item" data-v="${s}"><span class="chk"></span>${titleCase(s)}</div>`).join('');
  $('subjMenu').querySelectorAll('.dd-item').forEach(el=>{
    el.onclick=e=>{
      e.stopPropagation();
      const v=el.dataset.v;
      if(!v){ selSubjs.clear(); }
      else { if(selSubjs.has(v))selSubjs.delete(v); else selSubjs.add(v); }
      refreshSubjectMenu();
    };
  });
  const items=$('subjMenu').querySelectorAll('.dd-item');
  items.forEach(el=>{
    const v=el.dataset.v;
    const on=v? selSubjs.has(v) : selSubjs.size===0;
    el.classList.toggle('sel',on);
    el.querySelector('.chk').textContent=on?'✓':'';
  });
  $('subjText').textContent=selSubjs.size===0?'All subjects':`${selSubjs.size} selected`;
  renderChips('subjChips',selSubjs,v=>{selSubjs.delete(v);refreshSubjectMenu()});
}

function renderChips(containerId,set,onRemove){
  const box=$(containerId);
  box.innerHTML=[...set].map(v=>
    `<span class="cchip">${titleCase(v)} <button data-v="${v}">×</button></span>`
  ).join('');
  box.querySelectorAll('button').forEach(b=>{
    b.onclick=e=>{e.stopPropagation();onRemove(b.dataset.v)};
  });
}

// Drawer wiring
const overlay=$('overlay'),drawer=$('drawer');
function openDrawer(){overlay.classList.add('on');drawer.classList.add('on')}
function closeDrawer(){overlay.classList.remove('on');drawer.classList.remove('on')}
$('dotsBtn').onclick=openDrawer;
$('dClose').onclick=closeDrawer;
overlay.onclick=closeDrawer;

// Dropdown toggles
$('jobBox').onclick=e=>{e.stopPropagation();$('jobDd').classList.toggle('on');$('subjDd').classList.remove('on')};
$('subjBox').onclick=e=>{e.stopPropagation();$('subjDd').classList.toggle('on');$('jobDd').classList.remove('on')};
document.addEventListener('click',()=>{$('jobDd').classList.remove('on');$('subjDd').classList.remove('on')});
$('jobMenu').addEventListener('click',e=>e.stopPropagation());
$('subjMenu').addEventListener('click',e=>e.stopPropagation());

// Search
$('searchBox').addEventListener('input',()=>{searchQ=$('searchBox').value.trim()});

// Count selector
$('countRow').querySelectorAll('.cb').forEach(b=>{
  b.onclick=()=>{
    $('countRow').querySelectorAll('.cb').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    pickN=+b.dataset.n;
  };
});

// Load button
$('loadBtn').onclick=applyAndLoad;

// ===== Quiz rendering =====
function startTimer(){
  clearInterval(timer);
  timer=setInterval(()=>{
    time--;const m=Math.floor(time/60),s=time%60;
    $('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    if(time<=0){clearInterval(timer);end()}
  },1000);
}

function stats(){
  let ok=0,bad=0,pend=0,inv=0;
  for(let i=0;i<total;i++){
    if(invalidSet.has(i)){inv++;continue}
    if(ans[i]===null){pend++;continue}
    if(ans[i]===qs[i].correct)ok++;else bad++;
  }
  let h='';
  h+=`<span class="stat ok">🎯 Correct <span class="n">${ok}</span></span>`;
  h+=`<span class="stat bad">❌ Wrong <span class="n">${bad}</span></span>`;
  h+=`<span class="stat pend">⏳ Pending <span class="n">${pend}</span></span>`;
  if(inv>0)h+=`<span class="stat inv">⚠️ Invalid <span class="n">${inv}</span></span>`;
  $('stats').innerHTML=h;
}

function render(){
  const x=qs[cur];if(!x){$('body').innerHTML='<div class="load">No questions match filters</div>';return}
  const isInv=invalidSet.has(cur);
  const done=ans[cur]!==null||isInv;
  const L=['A','B','C','D'];
  let h=`<div class="q">${cur+1}. ${x.q}</div>`;
  x.opts.forEach((o,i)=>{
    let cls='opt';
    if(done && !isInv){
      if(i===x.correct)cls+=' ok';
      else if(i===ans[cur])cls+=' bad';
    }
    h+=`<button class="${cls}" data-i="${i}" ${done?'disabled':''}>
      <span class="k">${L[i]}</span><span>${o||'(Empty)'}</span></button>`;
  });
  if(done&&(x.subject||x.topic||x.job)){
    h+='<div class="chips">';
    if(x.subject)h+=`<span class="chip subject">📚 ${titleCase(x.subject)}</span>`;
    if(x.topic)h+=`<span class="chip topic">🏷️ ${titleCase(x.topic)}</span>`;
    if(x.job)h+=`<span class="chip job">💼 ${titleCase(x.job)}</span>`;
    h+='</div>';
  }
  if(isInv)h+=`<div class="invalid-msg">⚠️ Invalid question — correct answer not found in options</div>`;
  h+=`<div class="bar">
    <button class="btn btn-outline" id="prev" ${cur===0?'disabled':''}>◀ Back</button>
    <button class="btn" id="next" ${cur===total-1?'disabled':''}>Next ▶</button>
  </div>`;
  $('body').innerHTML=h;
  if(!isInv)$('body').querySelectorAll('.opt:not([disabled])').forEach(b=>{
    b.onclick=()=>{ans[cur]=+b.dataset.i;$('count').textContent=(ans.filter(a=>a!==null).length)+'/'+total;render();grid();stats()};
  });
  $('prev')&&($('prev').onclick=()=>{cur--;render();grid();stats()});
  $('next')&&($('next').onclick=()=>{cur++;render();grid();stats()});
}

function renderEnd(){
  $('endWrap').innerHTML=`<button class="btn btn-green" id="end">🏁 End Quiz</button>`;
  $('end').onclick=end;
}

function grid(){
  let h='';
  qs.forEach((x,i)=>{
    let c='dot';
    if(invalidSet.has(i))c+=' inv';
    else if(ans[i]!==null)c+=(ans[i]===x.correct?' ok':' bad');
    if(i===cur)c+=' cur';
    h+=`<button class="${c}" data-i="${i}">${i+1}</button>`;
  });
  $('grid').innerHTML=h;
  $('grid').querySelectorAll('.dot').forEach(d=>{
    d.onclick=()=>{cur=+d.dataset.i;render();grid();stats();scrollTo({top:0,behavior:'smooth'})};
  });
}

function end(){
  clearInterval(timer);
  const right=qs.filter((x,i)=>ans[i]===x.correct).length;
  const pct=Math.round((right/total)*100);
  let icon,msg;
  if(right===total){icon='🌟';msg='Perfect score!'}
  else if(pct>=70){icon='👏';msg='Great job!'}
  else{icon='💪';msg='Keep practicing!'}
  $('body').innerHTML=`
    <div style="text-align:center;padding:20px">
      <div class="result-icon">${icon}</div>
      <div style="font-size:2.6rem;font-weight:900;color:#0284c7">${right} / ${total}</div>
      <div style="color:#475569;margin:10px 0 20px;font-weight:600">${msg} — ${pct}% correct</div>
      <button class="btn" onclick="location.reload()">⟳ Try again</button>
    </div>`;
  $('grid').innerHTML='';
  $('endWrap').innerHTML='';
  $('stats').innerHTML='';
}

load();
</script>
</body>
</html>
