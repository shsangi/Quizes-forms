<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0ea5e9">
  <title>Self Learners · MCQs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
    body{background:#f4f6fa;display:flex;justify-content:center;min-height:100vh;color:#0f1419}
    .wrap{width:100%;max-width:920px;padding:16px}
    .top{position:sticky;top:0;z-index:10;background:#fff;border:1px solid #e2e8f0;
         border-radius:16px;padding:10px 14px;margin-bottom:12px;
         box-shadow:0 8px 20px -6px rgba(10,30,63,.12);display:flex;
         justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .title{font-weight:800;color:#0a1e3f;font-size:1rem;flex:1;min-width:0}
    .top-right{display:flex;gap:6px;align-items:center}
    .pill{background:#e0f2fe;color:#0284c7;font-weight:800;font-size:.6rem;
          padding:.24rem .55rem;border-radius:9999px;border:1px solid #7dd3fc}
    .timer{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;
           font-weight:800;font-size:.6rem;padding:.24rem .55rem;border-radius:9999px}
    .menu-btn{background:#e0f2fe;color:#0284c7;border:1.5px solid #7dd3fc;
              width:32px;height:32px;border-radius:10px;font-size:1rem;cursor:pointer;
              display:flex;align-items:center;justify-content:center;font-family:inherit}
    .menu-btn:hover{background:#0ea5e9;color:#fff;border-color:#0ea5e9}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;
          padding:22px;box-shadow:0 20px 40px -12px rgba(10,30,63,.18)}
    .q{font-weight:700;font-size:1.1rem;color:#0a1e3f;line-height:1.55;margin-bottom:16px}
    .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
         background:#fff;border:1.5px solid #e2e8f0;border-radius:9999px;
         padding:14px 18px;font-size:.95rem;font-weight:600;cursor:pointer;
         margin-bottom:10px;font-family:inherit;transition:all .15s;color:#0f1419}
    .opt:hover:not(:disabled){background:#e0f2fe;border-color:#0ea5e9}
    .opt .k{background:#e0f2fe;color:#0284c7;font-weight:800;width:28px;height:28px;
            border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .opt.ok{background:#d1fae5;border-color:#059669}
    .opt.ok .k{background:#059669;color:#fff}
    .opt.bad{background:#fee2e2;border-color:#dc2626}
    .opt.bad .k{background:#dc2626;color:#fff}
    .opt:disabled{cursor:default}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:14px;
           border-top:1px dashed #e2e8f0}
    .chip{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;
          padding:.3rem .7rem;border-radius:9999px}
    .chip.subject{background:#e0f2fe;color:#0284c7;border:1px solid #7dd3fc}
    .chip.topic{background:#fff7dd;color:#92400e;border:1px solid #fcd34d}
    .chip.job{background:#0a1e3f;color:#f5b800}
    .invalid-msg{margin-top:10px;padding:10px 14px;background:#fee2e2;
                 border:1.5px solid #dc2626;border-left:5px solid #dc2626;
                 border-radius:12px;color:#dc2626;font-weight:800;
                 font-size:.85rem;display:flex;align-items:center;gap:8px}
    .bar{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
         background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border:none;
         font-weight:700;font-size:.9rem;padding:.7rem 1.4rem;border-radius:9999px;
         cursor:pointer;font-family:inherit;transition:all .15s;
         box-shadow:0 4px 12px rgba(2,132,199,.25)}
    .btn:active{transform:scale(.96)}
    .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
    .btn-outline{background:#fff;color:#0284c7;border:1.5px solid #bae6fd;
                 box-shadow:0 2px 8px rgba(2,132,199,.08)}
    .btn-outline:hover:not(:disabled){background:#f0f9ff}
    .btn-green{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 12px rgba(5,150,105,.3)}
    .btn svg{width:18px;height:18px;flex-shrink:0}
    .load{padding:60px;text-align:center;color:#475569;font-weight:600}
    .grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
    .dot{width:28px;height:28px;border-radius:50%;background:#f4f6fa;border:2px solid transparent;
         font-size:.68rem;font-weight:700;color:#94a3b8;display:flex;align-items:center;
         justify-content:center;cursor:pointer;font-family:inherit;transition:transform .15s}
    .dot:hover{transform:scale(1.12)}
    .dot.ok{background:#059669;color:#fff}
    .dot.bad{background:#dc2626;color:#fff}
    .dot.inv{background:#f5b800;color:#0a1e3f}
    .dot.cur{border-color:#0284c7;transform:scale(1.2);box-shadow:0 0 0 3px rgba(2,132,199,.2)}
    .end-wrap{display:flex;justify-content:center;margin-top:16px;padding-top:16px;
              border-top:1px solid #e2e8f0}
    .stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
    .stat{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:800;
          padding:.32rem .7rem;border-radius:9999px;border:1.5px solid;background:#fff}
    .stat .n{font-weight:900;font-size:.75rem}
    .stat.ok{background:#d1fae5;border-color:#10b981;color:#059669}
    .stat.bad{background:#fee2e2;border-color:#fca5a5;color:#dc2626}
    .stat.pend{background:#f8fafc;border-color:#cbd5e1;color:#475569}
    .stat.inv{background:#fef3c7;border-color:#fcd34d;color:#92400e}
    .result-icon{font-size:3rem;margin-bottom:8px}

    /* ---------- DRAWER ---------- */
    .ovl{position:fixed;inset:0;background:rgba(10,30,63,.55);backdrop-filter:blur(6px);
         z-index:100;opacity:0;pointer-events:none;transition:opacity .25s}
    .ovl.open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;right:0;bottom:0;width:min(92vw,400px);background:#fff;
            box-shadow:-20px 0 60px -12px rgba(10,30,63,.35);z-index:101;
            transform:translateX(105%);transition:transform .35s cubic-bezier(.16,1,.3,1);
            display:flex;flex-direction:column;overflow:hidden}
    .drawer.open{transform:translateX(0)}
    .dr-head{padding:14px 18px;background:linear-gradient(135deg,#0ea5e9,#0284c7);
             color:#fff;display:flex;justify-content:space-between;align-items:center}
    .dr-head h3{font-size:1rem;font-weight:800}
    .dr-close{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);
              color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;
              font-size:1rem;font-family:inherit}
    .dr-body{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
    .fl{font-weight:700;font-size:.75rem;color:#0a1e3f;margin-bottom:6px;
        text-transform:uppercase;letter-spacing:.04em;display:block}
    .inp{width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:9999px;
         font-family:inherit;font-size:.85rem;background:#f8fafc;outline:none}
    .inp:focus{border-color:#0ea5e9;background:#fff;box-shadow:0 0 0 4px rgba(14,165,233,.1)}
    .ms-box{position:relative}
    .ms-trigger{width:100%;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:9999px;
                background:#f8fafc;font-family:inherit;font-size:.85rem;font-weight:600;
                text-align:left;cursor:pointer;display:flex;justify-content:space-between;
                align-items:center;gap:8px;color:#0f1419}
    .ms-trigger:hover{border-color:#0ea5e9}
    .ms-trigger .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
                     color:#475569}
    .ms-trigger .lbl.has{color:#0284c7;font-weight:800}
    .ms-trigger .arw{font-size:.6rem;color:#0284c7;transition:transform .2s}
    .ms-box.open .ms-trigger .arw{transform:rotate(180deg)}
    .ms-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;
             border:1.5px solid #e2e8f0;border-radius:14px;
             box-shadow:0 16px 40px -10px rgba(10,30,63,.25);max-height:280px;
             overflow-y:auto;padding:6px;z-index:5;display:none}
    .ms-box.open .ms-menu{display:block}
    .ms-sr{padding:8px 10px;border-bottom:1px dashed #e2e8f0;margin-bottom:4px}
    .ms-sr input{width:100%;padding:8px 12px;border:1.5px solid #e2e8f0;border-radius:9999px;
                 font-family:inherit;font-size:.8rem;outline:none;background:#fff}
    .ms-sr input:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.1)}
    .ms-opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;
            cursor:pointer;font-size:.82rem;font-weight:600;color:#0f1419}
    .ms-opt:hover{background:#e0f2fe}
    .ms-opt.sel{background:#0ea5e9;color:#fff}
    .ms-opt .ck{width:16px;height:16px;border-radius:4px;border:1.5px solid #cbd5e1;
                display:flex;align-items:center;justify-content:center;font-size:.65rem;
                flex-shrink:0}
    .ms-opt.sel .ck{background:#fff;color:#0284c7;border-color:#fff}
    .ms-empty{text-align:center;padding:14px;font-size:.78rem;color:#94a3b8;font-style:italic}
    .cnt-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .cnt-opt{padding:10px 6px;border:1.5px solid #e2e8f0;border-radius:12px;
             background:#f8fafc;font-family:inherit;font-size:.82rem;font-weight:800;
             color:#475569;cursor:pointer;transition:all .15s}
    .cnt-opt:hover{border-color:#0ea5e9;background:#e0f2fe}
    .cnt-opt.sel{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;
                 border-color:#0284c7;box-shadow:0 4px 10px rgba(2,132,199,.3)}
    .dr-foot{padding:14px 18px;border-top:1.5px solid #e2e8f0;display:flex;gap:10px}
    .dr-foot .btn{flex:1}
    .btn-ghost{background:#f8fafc;color:#475569;border:1.5px solid #e2e8f0;box-shadow:none}
    .btn-ghost:hover{background:#e0f2fe;color:#0284c7;border-color:#0ea5e9}
    .dr-info{font-size:.68rem;color:#94a3b8;text-align:center;padding:0 18px 14px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title" id="title">Loading…</div>
    <div class="top-right">
      <span class="pill" id="count">0/0</span>
      <span class="timer" id="timer">00:00</span>
      <button class="menu-btn" id="menuBtn" title="Filter & Search">☰</button>
    </div>
  </div>

  <div class="card">
    <div id="body"><div class="load">🔄 Loading questions…</div></div>
    <div class="grid" id="grid"></div>
    <div class="end-wrap" id="endWrap"></div>
    <div class="stats" id="stats"></div>
  </div>
</div>

<!-- Drawer -->
<div class="ovl" id="ovl"></div>
<aside class="drawer" id="drawer">
  <div class="dr-head">
    <h3>🔍 Filter MCQs</h3>
    <button class="dr-close" id="drClose">✕</button>
  </div>
  <div class="dr-body">
    <div>
      <label class="fl">Search</label>
      <input type="text" class="inp" id="srch" placeholder="Search questions, topics, jobs…">
    </div>

    <div>
      <label class="fl">💼 Jobs</label>
      <div class="ms-box" id="jobBox">
        <button class="ms-trigger" id="jobTrigger">
          <span class="lbl" id="jobLbl">All Jobs</span>
          <span class="arw">▼</span>
        </button>
        <div class="ms-menu" id="jobMenu">
          <div class="ms-sr"><input type="text" id="jobSr" placeholder="Search jobs…"></div>
          <div id="jobOpts"></div>
        </div>
      </div>
    </div>

    <div>
      <label class="fl">📚 Subjects</label>
      <div class="ms-box" id="subjBox">
        <button class="ms-trigger" id="subjTrigger">
          <span class="lbl" id="subjLbl">All Subjects</span>
          <span class="arw">▼</span>
        </button>
        <div class="ms-menu" id="subjMenu">
          <div class="ms-sr"><input type="text" id="subjSr" placeholder="Search subjects…"></div>
          <div id="subjOpts"></div>
        </div>
      </div>
    </div>

    <div>
      <label class="fl">📊 Questions to load</label>
      <div class="cnt-opts" id="cntOpts">
        <button class="cnt-opt" data-n="5">5</button>
        <button class="cnt-opt" data-n="10">10</button>
        <button class="cnt-opt" data-n="20">20</button>
        <button class="cnt-opt" data-n="100">100</button>
        <button class="cnt-opt" data-n="200">200</button>
        <button class="cnt-opt sel" data-n="all">All</button>
      </div>
    </div>
  </div>
  <div class="dr-info" id="drInfo">0 questions match</div>
  <div class="dr-foot">
    <button class="btn btn-ghost" id="drReset">⟲ Reset</button>
    <button class="btn" id="drLoad">Load</button>
  </div>
</aside>

<script>
const QUIZ_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQyB_I39SsLmQC5C8O1KkzZEUgFPAIJQ95k0vFj9M-HX8vI9hsdLh0GFYYO8O1QFnvP4vWkAh3nmbd3/pub?output=csv';

let allRaw=[];            // all questions from sheet (unfiltered)
let qs=[],ans=[],cur=0,time=0,timer=null,total=0,invalidSet=new Set();

// filters
let selJobs=[], selSubjs=[], srchQ='', loadCount='all';
let jobSrText='', subjSrText='';

const $=id=>document.getElementById(id);
const clean=s=>String(s??'').replace(/[\u200B-\u200D\uFEFF\u00A0]/g,' ').replace(/\s+/g,' ').trim();
const parseCSV=l=>{const r=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];
  if(q){if(ch==='"'&&l[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}
  else{if(ch==='"')q=true;else if(ch===','){r.push(clean(c));c=''}else c+=ch}}
  r.push(clean(c));return r};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const findCorrect=(raw,opts)=>{if(!raw)return -1;const r=clean(raw);
  for(let i=0;i<opts.length;i++)if(clean(opts[i])===r)return i;
  if(/^[A-Da-d]$/.test(r))return 'abcd'.indexOf(r.toLowerCase());
  if(/^[1-4]$/.test(r))return +r-1;return -1};
const titleCase=s=>!s?'':clean(s).split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const same=(a,b)=>clean(a).toLowerCase()===clean(b).toLowerCase();

const SPECIAL_PATTERNS=[
  /all\s+of\s+(the\s+)?above/i,
  /none\s+of\s+(the\s+)?above/i,
  /above\s+all/i,
  /\bboth\b/i,
  /^\s*none\s*$/i,
  /all\s+of\s+these/i
];
const isSpecial=o=>{const t=clean(o);return t&&SPECIAL_PATTERNS.some(p=>p.test(t))};

function shuffleOptionsKept(opts){
  const fixed={},free=[];
  opts.forEach((o,i)=>{if(isSpecial(o))fixed[i]=o;else free.push({text:o})});
  const sh=shuffle(free);
  const result=new Array(opts.length);
  Object.keys(fixed).forEach(k=>{result[+k]=fixed[k]});
  let p=0;
  for(let i=0;i<result.length;i++) if(result[i]===undefined) result[i]=sh[p++].text;
  return result;
}

function shuffleByCategory(list){
  const buckets=new Map();
  list.forEach(it=>{
    const k=[it.job||'',it.subject||'',it.topic||''].join('|||');
    if(!buckets.has(k)) buckets.set(k,[]);
    buckets.get(k).push(it);
  });
  const keys=shuffle([...buckets.keys()]);
  const out=[];
  keys.forEach(k=>out.push(...shuffle(buckets.get(k))));
  return out;
}

/* ---------------- DRAWER LOGIC ---------------- */
function openDrawer(){$('ovl').classList.add('open');$('drawer').classList.add('open');document.body.style.overflow='hidden'}
function closeDrawer(){$('ovl').classList.remove('open');$('drawer').classList.remove('open');document.body.style.overflow='';closeAllMs()}
function closeAllMs(){['jobBox','subjBox'].forEach(id=>$(id).classList.remove('open'))}

function jobsList(){
  const set=new Set();allRaw.forEach(q=>{if(q.job)set.add(q.job)});
  return [...set].sort((a,b)=>titleCase(a).localeCompare(titleCase(b)));
}
function subjectsForSelectedJobs(){
  const set=new Set();
  allRaw.forEach(q=>{
    if(selJobs.length && !selJobs.some(j=>same(j,q.job)))return;
    if(q.subject)set.add(q.subject);
  });
  return [...set].sort((a,b)=>titleCase(a).localeCompare(titleCase(b)));
}

function renderJobOpts(){
  const list=jobsList().filter(j=>titleCase(j).toLowerCase().includes(jobSrText.toLowerCase()));
  const el=$('jobOpts');
  if(!list.length){el.innerHTML='<div class="ms-empty">No jobs found</div>';return}
  el.innerHTML=list.map(j=>{
    const s=selJobs.some(x=>same(x,j));
    return `<div class="ms-opt ${s?'sel':''}" data-job="${encodeURIComponent(j)}">
      <span class="ck">${s?'✓':''}</span><span>${titleCase(j)}</span>
    </div>`;
  }).join('');
  el.querySelectorAll('.ms-opt').forEach(o=>{
    o.onclick=e=>{
      e.stopPropagation();
      const j=decodeURIComponent(o.dataset.job);
      if(selJobs.some(x=>same(x,j))) selJobs=selJobs.filter(x=>!same(x,j));
      else selJobs.push(j);
      // Drop subjects that no longer belong to any selected job
      const allowed=subjectsForSelectedJobs();
      selSubjs=selSubjs.filter(s=>allowed.some(a=>same(a,s)));
      updateLbls();renderJobOpts();renderSubjOpts();updateInfo();
    };
  });
}
function renderSubjOpts(){
  const list=subjectsForSelectedJobs().filter(s=>titleCase(s).toLowerCase().includes(subjSrText.toLowerCase()));
  const el=$('subjOpts');
  if(!list.length){el.innerHTML='<div class="ms-empty">${selJobs.length?'No subjects for selected jobs':'No subjects available'}</div>';return}
  el.innerHTML=list.map(s=>{
    const sel=selSubjs.some(x=>same(x,s));
    return `<div class="ms-opt ${sel?'sel':''}" data-subj="${encodeURIComponent(s)}">
      <span class="ck">${sel?'✓':''}</span><span>${titleCase(s)}</span>
    </div>`;
  }).join('');
  el.querySelectorAll('.ms-opt').forEach(o=>{
    o.onclick=e=>{
      e.stopPropagation();
      const s=decodeURIComponent(o.dataset.subj);
      if(selSubjs.some(x=>same(x,s))) selSubjs=selSubjs.filter(x=>!same(x,s));
      else selSubjs.push(s);
      updateLbls();renderSubjOpts();updateInfo();
    };
  });
}
function updateLbls(){
  const jl=$('jobLbl'), sl=$('subjLbl');
  if(selJobs.length===0){jl.textContent='All Jobs';jl.classList.remove('has')}
  else if(selJobs.length===1){jl.textContent=titleCase(selJobs[0]);jl.classList.add('has')}
  else{jl.textContent=selJobs.length+' jobs selected';jl.classList.add('has')}
  if(selSubjs.length===0){sl.textContent='All Subjects';sl.classList.remove('has')}
  else if(selSubjs.length===1){sl.textContent=titleCase(selSubjs[0]);sl.classList.add('has')}
  else{sl.textContent=selSubjs.length+' subjects selected';sl.classList.add('has')}
}

function applyFiltersToRaw(){
  const q=srchQ.toLowerCase().trim();
  return allRaw.filter(x=>{
    if(selJobs.length && !selJobs.some(j=>same(j,x.job)))return false;
    if(selSubjs.length && !selSubjs.some(s=>same(s,x.subject)))return false;
    if(q){
      const hay=[x.q,x.subject,x.topic,x.job,...x.opts].join(' ').toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
}
function updateInfo(){
  const n=applyFiltersToRaw().length;
  $('drInfo').textContent=n+' question'+(n!==1?'s':'')+' match';
}

/* ---------------- LOAD QUIZ ---------------- */
function buildAndStart(){
  let filtered=applyFiltersToRaw();
  filtered=shuffleByCategory(filtered);
  if(loadCount!=='all'){
    const n=parseInt(loadCount,10);
    if(filtered.length>n)filtered=filtered.slice(0,n);
  }
  qs=filtered.map(x=>{
    const newOpts=shuffleOptionsKept(x.opts);
    const correctText=x.opts[x.correct];
    const newCorrect=correctText!==undefined
      ? newOpts.findIndex(o=>clean(o)===clean(correctText))
      : -1;
    return {...x,opts:newOpts,correct:newCorrect};
  });
  invalidSet=new Set();
  qs.forEach((x,i)=>{if(x.correct===-1)invalidSet.add(i)});
  total=qs.length;ans=Array(total).fill(null);cur=0;
  time=total*60;
  $('count').textContent='0/'+total;
  $('title').textContent=(selJobs.length===1?titleCase(selJobs[0])+' MCQs':'All Jobs MCQs');

  clearInterval(timer);
  if(total===0){
    $('body').innerHTML='<div class="load">No questions match filters</div>';
    $('grid').innerHTML='';$('endWrap').innerHTML='';$('stats').innerHTML='';
    $('timer').textContent='00:00';
    return;
  }
  startTimer();render();grid();renderEnd();stats();
}

/* ---------------- ORIGINAL QUIZ LOGIC ---------------- */
async function load(){
  try{
    const r=await fetch(QUIZ_URL+'&_t='+Date.now(),{cache:'no-store'});
    const text=await r.text();
    const lines=text.split('\n').filter(l=>l.trim());
    allRaw=[];
    for(let i=1;i<lines.length;i++){
      const c=parseCSV(lines[i]);
      if(c.length<9||!c[1])continue;
      const show=(c[13]||'').toLowerCase();
      if(show==='0'||show==='false'||show==='no')continue;
      const opts=[c[2]||'',c[3]||'',c[4]||'',c[5]||''].map(clean);
      const correct=findCorrect(c[6],opts);
      allRaw.push({q:c[1],opts,correct,subject:c[8]||'',topic:c[7]||'',job:c[10]||''});
    }
    // initial load = all questions
    buildAndStart();
    renderJobOpts();renderSubjOpts();updateLbls();updateInfo();
  }catch(e){
    console.error(e);
    $('body').innerHTML='<div class="load">❌ Failed to load</div>';
  }
}

function startTimer(){
  clearInterval(timer);
  timer=setInterval(()=>{
    time--;const m=Math.floor(time/60),s=time%60;
    $('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    if(time<=0){clearInterval(timer);end()}
  },1000);
}
function stats(){
  let ok=0,bad=0,pend=0,inv=0;
  for(let i=0;i<total;i++){
    if(invalidSet.has(i)){inv++;continue}
    if(ans[i]===null){pend++;continue}
    if(ans[i]===qs[i].correct)ok++;else bad++;
  }
  let h='';
  h+=`<span class="stat ok">🎯 Correct <span class="n">${ok}</span></span>`;
  h+=`<span class="stat bad">❌ Wrong <span class="n">${bad}</span></span>`;
  h+=`<span class="stat pend">⏳ Pending <span class="n">${pend}</span></span>`;
  if(inv>0)h+=`<span class="stat inv">⚠️ Invalid <span class="n">${inv}</span></span>`;
  $('stats').innerHTML=h;
}
function render(){
  const x=qs[cur];if(!x)return;
  const isInv=invalidSet.has(cur);
  const done=ans[cur]!==null||isInv;
  const letters=['A','B','C','D'];
  let h=`<div class="q">${cur+1}. ${x.q}</div>`;
  x.opts.forEach((o,i)=>{
    let cls='opt';
    if(done && !isInv){
      if(i===x.correct)cls+=' ok';
      else if(i===ans[cur])cls+=' bad';
    }
    h+=`<button class="${cls}" data-i="${i}" ${done?'disabled':''}>
      <span class="k">${letters[i]}</span><span>${o||'(Empty)'}</span></button>`;
  });
  if(done && (x.subject||x.topic||x.job)){
    h+='<div class="chips">';
    if(x.subject)h+=`<span class="chip subject">📚 ${titleCase(x.subject)}</span>`;
    if(x.topic)h+=`<span class="chip topic">🏷️ ${titleCase(x.topic)}</span>`;
    if(x.job)h+=`<span class="chip job">💼 ${titleCase(x.job)}</span>`;
    h+='</div>';
  }
  if(isInv){
    h+=`<div class="invalid-msg">⚠️ Invalid question — correct answer not found in options</div>`;
  }
  h+=`<div class="bar">
    <button class="btn btn-outline" id="prev" ${cur===0?'disabled':''}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>
    <button class="btn" id="next" ${cur===total-1?'disabled':''}>
      Next
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>`;
  $('body').innerHTML=h;
  if(!isInv){
    $('body').querySelectorAll('.opt:not([disabled])').forEach(b=>{
      b.onclick=()=>{
        ans[cur]=+b.dataset.i;
        $('count').textContent=(ans.filter(a=>a!==null).length)+'/'+total;
        render();grid();stats();
      };
    });
  }
  $('prev')&&($('prev').onclick=()=>{cur--;render();grid();stats()});
  $('next')&&($('next').onclick=()=>{cur++;render();grid();stats()});
}
function renderEnd(){
  $('endWrap').innerHTML=`
    <button class="btn btn-green" id="end">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
      End Quiz
    </button>`;
  $('end').onclick=end;
}
function grid(){
  let h='';
  qs.forEach((x,i)=>{
    let c='dot';
    if(invalidSet.has(i))c+=' inv';
    else if(ans[i]!==null)c+=(ans[i]===x.correct?' ok':' bad');
    if(i===cur)c+=' cur';
    h+=`<button class="${c}" data-i="${i}">${i+1}</button>`;
  });
  $('grid').innerHTML=h;
  $('grid').querySelectorAll('.dot').forEach(d=>{
    d.onclick=()=>{cur=+d.dataset.i;render();grid();stats();scrollTo({top:0,behavior:'smooth'})};
  });
}
function end(){
  clearInterval(timer);
  const right=qs.filter((x,i)=>ans[i]===x.correct).length;
  const pct=total?Math.round((right/total)*100):0;
  let icon,msg;
  if(right===total&&total>0){icon='🌟';msg='Perfect score!';}
  else if(pct>=70){icon='👏';msg='Great job!';}
  else{icon='💪';msg='Keep practicing!';}
  $('body').innerHTML=`
    <div style="text-align:center;padding:20px">
      <div class="result-icon">${icon}</div>
      <div style="font-size:2.6rem;font-weight:900;color:#0284c7">${right} / ${total}</div>
      <div style="color:#475569;margin:10px 0 20px;font-weight:600">
        ${msg} — ${pct}% correct
      </div>
      <button class="btn" onclick="location.reload()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Try again
      </button>
    </div>`;
  $('grid').innerHTML='';
  $('endWrap').innerHTML='';
  $('stats').innerHTML='';
}

/* ---------------- UI WIRING ---------------- */
$('menuBtn').onclick=openDrawer;
$('drClose').onclick=closeDrawer;
$('ovl').onclick=closeDrawer;

$('jobTrigger').onclick=e=>{
  e.stopPropagation();
  const wasOpen=$('jobBox').classList.contains('open');
  closeAllMs();
  if(!wasOpen)$('jobBox').classList.add('open');
  $('jobSr').focus();
};
$('subjTrigger').onclick=e=>{
  e.stopPropagation();
  const wasOpen=$('subjBox').classList.contains('open');
  closeAllMs();
  if(!wasOpen)$('subjBox').classList.add('open');
  $('subjSr').focus();
};
document.addEventListener('click',e=>{
  if(!$('jobBox').contains(e.target) && !$('subjBox').contains(e.target))closeAllMs();
});

$('jobSr').oninput=e=>{jobSrText=e.target.value;renderJobOpts()};
$('subjSr').oninput=e=>{subjSrText=e.target.value;renderSubjOpts()};

// count options
document.querySelectorAll('.cnt-opt').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.cnt-opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    loadCount=b.dataset.n;
  };
});

// search (case insensitive, live info update)
$('srch').oninput=e=>{srchQ=e.target.value;updateInfo()};

// reset
$('drReset').onclick=()=>{
  selJobs=[];selSubjs=[];srchQ='';jobSrText='';subjSrText='';loadCount='all';
  $('srch').value='';$('jobSr').value='';$('subjSr').value='';
  document.querySelectorAll('.cnt-opt').forEach(x=>x.classList.toggle('sel',x.dataset.n==='all'));
  updateLbls();renderJobOpts();renderSubjOpts();updateInfo();
};

// load
$('drLoad').onclick=()=>{
  closeDrawer();
  buildAndStart();
  scrollTo({top:0,behavior:'smooth'});
};

load();
</script>
