<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<title>Self Learners</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
:root{--b:#0ea5e9;--d:#0284c7;--n:#0a1e3f;--l:#e2e8f0;--g:#059669;--r:#dc2626;--y:#f5b800;--bg:linear-gradient(135deg,#0ea5e9,#0284c7)}
body{background:#f4f6fa;display:flex;justify-content:center;min-height:100vh;color:#0f1419}
.w{width:100%;max-width:980px;padding:16px}
.top,.card{background:#fff;border:1px solid var(--l)}
.top{position:sticky;top:0;z-index:10;border-radius:16px;padding:10px 14px;margin-bottom:12px;box-shadow:0 8px 20px -6px rgba(10,30,63,.12);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card{border-radius:20px;padding:18px 20px;box-shadow:0 20px 40px -12px rgba(10,30,63,.18)}
.tt{font-weight:800;color:var(--n);font-size:.95rem;flex:1;min-width:120px}
.rt{display:flex;gap:6px;align-items:center}
.pill,.tmr{font-weight:800;font-size:.62rem;padding:.28rem .6rem;border-radius:9999px}
.pill{background:#e0f2fe;color:var(--d);border:1px solid #7dd3fc}.tmr{background:var(--bg);color:#fff}
.dots{background:0;border:0;width:32px;height:32px;border-radius:50%;cursor:pointer;color:#475569;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.dots:hover{background:#f1f5f9}.dots span{width:4px;height:4px;border-radius:50%;background:currentColor}
.q{font-weight:700;font-size:1.1rem;color:var(--n);line-height:1.55;margin-bottom:16px;cursor:pointer;padding-right:22px;position:relative}
.q:hover{color:var(--d);text-decoration:underline;text-underline-offset:3px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--l);border-radius:9999px;padding:14px 18px;font-size:.95rem;font-weight:600;cursor:pointer;margin-bottom:10px;color:#0f1419}
.opt:hover:not(:disabled){background:#e0f2fe;border-color:var(--b)}.opt:disabled{cursor:default}
.k,.lt{background:#e0f2fe;color:var(--d);font-weight:800;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt.ok{background:#d1fae5;border-color:var(--g)}.opt.ok .k{background:var(--g);color:#fff}
.opt.bad{background:#fee2e2;border-color:var(--r)}.opt.bad .k{background:var(--r);color:#fff}
.chips{margin-top:14px;padding-top:14px;border-top:1px dashed var(--l)}
.inv-msg{margin-top:10px;padding:10px 14px;background:#fee2e2;border:1.5px solid var(--r);border-left:5px solid var(--r);border-radius:12px;color:var(--r);font-weight:800;font-size:.85rem}
.bar{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{background:var(--bg);color:#fff;border:0;font-weight:700;font-size:.9rem;padding:.7rem 1.4rem;border-radius:9999px;cursor:pointer;box-shadow:0 4px 12px rgba(2,132,199,.25)}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn-o{background:#fff;color:var(--d);border:1.5px solid #bae6fd}
.btn-g,.dl{background:linear-gradient(135deg,#10b981,#059669)}
.load{padding:60px;text-align:center;color:#475569;font-weight:600}
.grid,.stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.dot{width:28px;height:28px;border-radius:50%;background:#f4f6fa;border:2px solid transparent;font-size:.68rem;font-weight:700;color:#94a3b8;cursor:pointer}
.dot.ok{background:var(--g);color:#fff}.dot.bad{background:var(--r);color:#fff}.dot.inv{background:var(--y);color:var(--n)}
.dot.cur{border-color:var(--d);transform:scale(1.15);box-shadow:0 0 0 3px rgba(2,132,199,.2)}
.stat{font-size:.68rem;font-weight:800;padding:.32rem .7rem;border-radius:9999px;border:1.5px solid #cbd5e1;background:#f8fafc;color:#475569}
.stat.ok{background:#d1fae5;border-color:#10b981;color:var(--g)}.stat.bad{background:#fee2e2;border-color:#fca5a5;color:var(--r)}.stat.inv{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.ov{position:fixed;inset:0;background:rgba(10,30,63,.55);backdrop-filter:blur(6px);z-index:900;opacity:0;pointer-events:none;transition:.25s}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(92vw,400px);background:#fff;z-index:901;transform:translateX(105%);transition:transform .35s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px -12px rgba(10,30,63,.35)}
.dr.on{transform:none}
.dh{padding:14px 18px;background:var(--bg);color:#fff;display:flex;justify-content:space-between;align-items:center}
.dh h3{font-size:1rem;font-weight:800}.ver{font-size:.62rem;font-weight:700;opacity:.75}
.dc{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-weight:800}
.db{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.fl{font-size:.72rem;font-weight:800;color:var(--n);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:block}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.cr{display:flex;flex-wrap:wrap;gap:6px}
.mbtn{padding:.6rem .5rem;border:1.5px solid var(--l);border-radius:12px;background:#fff;cursor:pointer;font-weight:700;font-size:.78rem;color:#475569}
.mbtn.on,.cb.on{background:var(--bg);color:#fff;border-color:var(--d)}
.fi{width:100%;padding:.7rem .9rem;border:1.5px solid var(--l);border-radius:12px;font-size:.85rem;outline:0;background:#f8fafc}
.fi:focus,.ds input:focus{border-color:var(--b);background:#fff}
.cc{display:inline-flex;align-items:center;gap:4px;background:var(--b);color:#fff;font-size:.68rem;font-weight:700;padding:.25rem .55rem;border-radius:9999px}
.cc button{background:0;border:0;color:#fff;font-size:.85rem;cursor:pointer;font-weight:800}
.dd{position:relative}
.ddb{border:1.5px solid var(--l);border-radius:12px;padding:.55rem .7rem;min-height:42px;cursor:pointer;display:flex;align-items:center;font-size:.82rem;font-weight:600;color:#475569}
.ddb:hover{border-color:var(--b)}.ar{margin-left:auto;font-size:.6rem;color:#94a3b8}.dd.on .ar{transform:rotate(180deg)}
.ddm{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--l);border-radius:12px;box-shadow:0 16px 40px -10px rgba(10,30,63,.25);max-height:280px;overflow:hidden;padding:.35rem;z-index:10;display:none;flex-direction:column}
.dd.on .ddm{display:flex}
.ds{padding:.4rem .5rem .35rem;border-bottom:1px solid var(--l);margin-bottom:.3rem}
.ds input{width:100%;border:1.5px solid var(--l);border-radius:8px;padding:.45rem .65rem;font-size:.78rem;outline:0;background:#f8fafc}
.ddl{overflow-y:auto;max-height:200px;display:flex;flex-direction:column;gap:1px}
.ddi{padding:.5rem .7rem;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:.5rem}
.ddi:hover{background:#e0f2fe;color:var(--d)}.ddi.sel{background:var(--b);color:#fff}
.ck{width:16px;height:16px;border:1.5px solid #cbd5e1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0}
.ddi.sel .ck{background:#fff;color:var(--d);border-color:#fff}
.dde{padding:.8rem;text-align:center;font-size:.78rem;color:#94a3b8;font-style:italic}
.cb{padding:.5rem .85rem;border:1.5px solid var(--l);border-radius:9999px;background:#fff;cursor:pointer;font-weight:700;font-size:.78rem;color:#475569}
.cb:hover{border-color:var(--b);color:var(--d)}
.cb.inv.on{background:linear-gradient(135deg,#f5b800,#d99e00);border-color:#d99e00;color:var(--n)}
.cb.vf.on{background:#059669;border-color:#047857}.cb.nvf.on{background:#dc2626;border-color:#991b1b}
.mcq-mode .cb[data-v="exam"].on{background:linear-gradient(135deg,#f59e0b,#d97706);border-color:#d97706;color:#fff}
.mcq-mode .cb[data-v="read"].on{background:linear-gradient(135deg,#0ea5e9,#0284c7);border-color:#0284c7;color:#fff}
.drow{display:flex;gap:8px;margin-top:4px}
.dl{flex:1;padding:.85rem;border:0;border-radius:9999px;font-weight:800;font-size:.9rem;color:#fff;cursor:pointer}
.drs{padding:.85rem 1rem;border:1.5px solid var(--l);border-radius:9999px;font-weight:800;font-size:.9rem;color:#475569;background:#fff;cursor:pointer}
.drs:hover{border-color:var(--r);color:var(--r);background:#fee2e2}
.list{display:flex;flex-direction:column;gap:.75rem;margin-top:14px}
.li{background:#f8fafc;border:1.5px solid var(--l);border-left:4px solid var(--b);border-radius:14px;padding:.85rem 1rem;position:relative;cursor:pointer}
.li:hover{background:#e0f2fe;border-left-color:var(--y)}.li.fact{border-left-color:var(--y)}
.lq{font-weight:700;color:var(--n);font-size:.9rem;line-height:1.5;padding-right:1.4rem}
.sn{background:var(--b);color:#fff;font-weight:800;font-size:.68rem;padding:2px 8px;border-radius:9999px;margin-right:.5rem;display:inline-block}
.lo{margin-top:.5rem;display:flex;flex-direction:column;gap:.3rem}
.lop{display:flex;gap:.4rem;font-size:.82rem;line-height:1.5;padding:.4rem .6rem;background:#fff;border:1px solid var(--l);border-radius:8px;color:#475569}
.lop .lt{width:22px;height:22px;font-size:.68rem}
.lop.ok{background:#d1fae5;border-color:var(--g);color:#065f46;font-weight:700}.lop.ok .lt{background:var(--g);color:#fff}
.lm{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.3rem;font-size:.64rem;font-weight:700}
.mc{padding:.2rem .55rem;border-radius:9999px;background:#fff;border:1px solid var(--l);color:#475569}
.ms{background:#e0f2fe;color:var(--d)}.mt{background:#fff7dd;color:#92400e}.mj{background:var(--n);color:var(--y)}
.ans{margin-top:.5rem;padding-top:.5rem;border-top:1px dashed var(--l);font-size:.83rem;color:#047857;font-weight:600}
.vfy,.qvfy{position:absolute;width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#fff}
.vfy{top:6px;right:6px;box-shadow:0 0 0 1.5px #fff}.qvfy{top:2px;right:0}
.ncard{background:#f8fafc;border:1.5px solid var(--l);border-radius:14px;padding:12px 14px 10px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:7px;cursor:pointer}
.ncard:hover,.ncard.open{border-color:var(--b)}
.ncard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#94a3b8}
.ncard.vimp::before{background:var(--r)}.ncard.imp::before{background:var(--y)}.ncard.note::before{background:var(--b)}
.ncard.rd{background:#d1fae5;border-color:var(--g)}.ncard.rd::before{background:var(--g)}
.ctop,.nbot,.nbot>div,.refrow{display:flex;align-items:center;gap:6px}.ctop,.nbot{justify-content:space-between}.refrow{flex-wrap:wrap}
.cnum{padding:0 6px;height:18px;line-height:16px;border-radius:6px;background:#e2e8f0;color:#64748b;font-size:.6rem;font-weight:800;font-family:monospace}
.nref{padding:3px 9px;border-radius:6px;background:#e0f2fe;border:1px solid #7dd3fc;color:var(--d);font-size:.68rem;font-weight:800}
.ncat{font-size:.58em;letter-spacing:.06em;font-weight:800;background:#fff;border:1px solid var(--l);color:#64748b;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.nbadge{padding:3px 8px;border-radius:99px;font-size:.58rem;font-weight:800;border:1px solid;text-transform:uppercase;color:#64748b;background:#e2e8f0;border-color:#cbd5e1}
.nbadge.vimp{color:var(--r);background:#fee2e2;border-color:#fca5a5}.nbadge.imp{color:#92400e;background:#fef3c7;border-color:#fcd34d}.nbadge.note{color:var(--d);background:#e0f2fe;border-color:#7dd3fc}
.nmem{font-size:.9rem;font-weight:600;color:var(--n);line-height:1.55;padding:7px 9px;margin:-2px -3px;border-radius:8px;word-break:break-word}
.nmem:hover{background:#e0f2fe}
.nbot{padding-top:8px;border-top:1px dashed var(--l);min-height:32px}
.nric,.nxh{width:32px;height:32px;border-radius:8px;border:1px solid var(--l);background:#fff;color:#64748b;cursor:pointer;display:grid;place-items:center;font-size:14px}
.nric:hover{border-color:var(--b)}.nric.like.on{background:#d1fae5;border-color:var(--g)}.nric.dislike.on{background:#fee2e2;border-color:var(--r)}
.nst{font-size:.64rem;font-weight:700;color:#94a3b8}.nst.read{color:var(--g)}
.nrc{padding:2px 8px;border-radius:99px;background:#e2e8f0;font-size:.62rem;color:#64748b;font-weight:800}.nrc.h{background:#d1fae5;color:var(--g);border:1px solid #10b981}
.nxh{background:0;border:0;color:#94a3b8}.nxh:hover{color:var(--b);background:#e0f2fe}.ncard.open .nxh{color:var(--b);transform:rotate(180deg)}
.ndet{display:none;padding-top:10px;border-top:1px solid var(--l);margin-top:8px;cursor:default}.ncard.open .ndet{display:block}
.ndr{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:6px 0;font-size:.8rem;color:#475569}
.ndr small{font-size:.6rem;font-weight:800;text-transform:uppercase;color:#94a3b8}.ndr strong{color:var(--n)}
.ninfo{display:flex;justify-content:space-between;gap:8px;padding:8px 4px 12px;color:#475569;font-size:.7rem;font-weight:600;flex-wrap:wrap}
.ninfo b{color:var(--n)}.pct{padding:2px 8px;margin-left:6px;border-radius:99px;background:#e0f2fe;color:var(--d);font-weight:800;font-size:.66rem}
.nmore{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 0 8px;font-size:.72rem;color:#64748b;text-align:center;font-weight:600}
.nmore button{padding:11px 22px;background:var(--bg);border:0;color:#fff;border-radius:10px;font-size:.84rem;font-weight:700;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w">
  <div class="top">
    <div class="tt" id="tt">Loading…</div>
    <div class="rt">
      <span class="pill" id="cnt">0/0</span>
      <span class="tmr" id="tmr">00:00</span>
      <button class="dots" id="dotsBtn"><span></span><span></span><span></span></button>
    </div>
  </div>
  <div class="card">
    <div id="bd"><div class="load">🔄 Loading…</div></div>
    <div class="grid" id="gd"></div>
    <div class="stats" id="st"></div>
  </div>
</div>
<div class="ov" id="ov"></div>
<aside class="dr" id="dr"></aside>

<script>
/* ============================================================
   1. CONFIG
   ============================================================ */
const V = 'v5.2', PG = 200;
const U = {
  q:'https://docs.google.com/spreadsheets/d/e/2PACX-1vQyB_I39SsLmQC5C8O1KkzZEUgFPAIJQ95k0vFj9M-HX8vI9hsdLh0GFYYO8O1QFnvP4vWkAh3nmbd3/pub?output=csv',
  f:'https://docs.google.com/spreadsheets/d/e/2PACX-1vTRO-FPemOqN9exgEgDyt_x1KfNgTAxf0mOeg16c7THfRaaHg0mbgwuTrObcbIwJKSx2dWtrQCNcrCV/pub?output=csv',
  n:'https://docs.google.com/spreadsheets/d/e/2PACX-1vTR3op0RZuTMJ-HegiLJYV18VR97DAnZpcUPRWwMYRfr5pVVf_x6ZOYMfiS8aXIJQcTh2hHpsgqJ8ks/pub?output=csv'
};
const P0 = { n:20, fn:20, fv:'all', tab:'all', sort:'def', lim:20, mcqMode:'exam' };

const COL = {
  mcq:  { q:1, a:2, b:3, c:4, d:5, correct:6, topic:7, subject:8, job:10, mcol:12, off:13 },
  note: { row:0, category:1, reference:2, memory:3, status:4 }
};

/* ============================================================
   2. HELPERS
   ============================================================ */
const $   = id => document.getElementById(id);
const $$  = sel => document.querySelectorAll(sel);
const clean = s => String(s ?? '').replace(/[\u200B-\u200D\uFEFF\u00A0]/g,' ').replace(/\s+/g,' ').trim();
const normKey = s => clean(s).toLowerCase();
const titleCase = s => clean(s).replace(/(^|\s)\S/g, m => m.toUpperCase());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for (let i=a.length;i>1;){ const j = Math.random()*i--|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const isSpecial = o => /all\s+of\s+(the\s+)?above|none\s+of\s+(the\s+)?above|above\s+all|\bboth\b|^\s*none\s*$|all\s+of\s+these/i.test(clean(o));

const shuffleOptions = (opts, correctIdx) => {
  const free = shuffle([...opts.keys()].filter(i => !isSpecial(opts[i])));
  const order = opts.map((x,i) => isSpecial(x) ? i : free.pop());
  return { opts: order.map(i => opts[i]), correct: correctIdx < 0 ? -1 : order.indexOf(correctIdx) };
};
const shuffleByCategory = list => {
  const buckets = {};
  list.forEach(x => (buckets[[x.job,x.subject,x.topic].map(normKey).join('|')] ??= []).push(x));
  return shuffle(Object.values(buckets)).flatMap(shuffle);
};
const findCorrect = (raw, opts) => {
  const r = clean(raw); if (!r) return -1;
  const i = opts.findIndex(x => clean(x) === r);
  return i >= 0 ? i : /^[A-Da-d]$/.test(r) ? 'abcd'.indexOf(r.toLowerCase()) : /^[1-4]$/.test(r) ? +r-1 : -1;
};

/* CSV */
const parseCSVLine = line => {
  const out = []; let cell = '', q = 0;
  for (let i=0;i<line.length;i++){
    const ch = line[i];
    if (q) { if (ch === '"') { line[i+1] === '"' ? (cell += '"', i++) : q = 0; } else cell += ch; }
    else if (ch === '"') q = 1;
    else if (ch === ',') { out.push(clean(cell)); cell = ''; }
    else cell += ch;
  }
  out.push(clean(cell));
  return out;
};
const loadCSV = async (url, mapper) => {
  const text = await (await fetch(url + '&_t=' + Date.now(), { cache:'no-store' })).text();
  return text.split('\n').filter(l => l.trim()).slice(1).map(parseCSVLine).map(mapper).filter(Boolean);
};

/* Row parsers */
const parseMcq = c => {
  if (!c || !c[COL.mcq.q]) return null;
  if (['0','false','no'].includes((c[COL.mcq.off] || '').toLowerCase())) return null;
  const opts = [COL.mcq.a, COL.mcq.b, COL.mcq.c, COL.mcq.d].map(i => c[i] || '');
  return { q:c[COL.mcq.q], opts, correct:findCorrect(c[COL.mcq.correct], opts),
           topic:c[COL.mcq.topic] || '', subject:c[COL.mcq.subject] || '',
           job:c[COL.mcq.job] || '', mcol:c[COL.mcq.mcol] || '' };
};
const parseFact = c => {
  if (!c[0]) return null;
  const v = (c[4] || '').toLowerCase();
  return { q:c[0], answer:c[1] || '', topic:c[2] || '', subject:c[3] || '',
           verify:['true','yes','1'].includes(v) ? 't' : ['false','no','0'].includes(v) ? 'f' : 'u' };
};
const parseNote = r => {
  if (!r[3] && !r[2]) return null;
  return { row:r[0] || '', category:r[1] || '', reference:r[2] || '', memory:r[3] || '', status:r[4] || '' };
};

/* Verify marker */
const VMAP = { t:{c:'var(--b)',s:'✔'}, f:{c:'var(--r)',s:'✘'} };
const vmark = (v, cls='vfy') => { const m = VMAP[v] || {c:'#94a3b8',s:'?'};
  return `<span class="${cls}" style="background:${m.c}">${m.s}</span>`; }; // FIX: lookup map instead of rebuilding objects

/* Meta chips */
const MQ = [['subject','📚','ms'],['topic','🏷️','mt'],['job','💼','mj']];
const MF = MQ.slice(0,2);
const meta = (defs, x) => defs.map(([k,e,c]) => x[k] ? `<span class="mc ${c}">${e} ${esc(titleCase(x[k]))}</span>` : '').join('');

/* Date helpers */
const pad = n => String(n).padStart(2,'0');
const dateOf = t => new Date(t + (300 + new Date().getTimezoneOffset()) * 6e4);
const dayKey = t => { const d = dateOf(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const today = () => dayKey(Date.now());
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtFull = t => { if (!t) return ''; const d = dateOf(t);
  return `${DY[d.getDay()]}, ${MN[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}, ${pad(d.getHours()%12||12)}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${d.getHours()>=12?'PM':'AM'}`; };
const fmtShort = t => { if (!t) return ''; const d = dateOf(t);
  return `${d.getDate()} ${MN[d.getMonth()]}, ${pad(d.getHours()%12||12)}:${pad(d.getMinutes())} ${d.getHours()>=12?'PM':'AM'}`; };

/* Status meta */
const statusMeta = raw => {
  const l = normKey(raw).replace(/ /g,'');
  if (['v.imp','vimp','veryimportant','v.important'].includes(l)) return { c:'vimp', l:'Very Imp', r:0 };
  if (['imp','important'].includes(l))                       return { c:'imp',  l:'Important', r:1 };
  if (['note','notes'].includes(l))                          return { c:'note', l:'Note', r:2 };
  return { c:'other', l:clean(raw) || '—', r:3 };
};

/* Google search */
const gSearch = terms => open('https://www.google.com/search?q=' + encodeURIComponent(terms.filter(Boolean).join(' ')), '_blank');
const searchMcq = x => gSearch([x.q, x.opts.map((o,i) => `${'ABCD'[i]}) ${o}`).join(' '),
  ...[['topic','Topic'],['subject','Subject'],['job','Job']].map(([k,l]) => x[k] && `${l}: ${x[k]}`)]);

/* ============================================================
   3. STATE
   ============================================================ */
let mode = 'mcq', data = [], qs = [], answers = [], cur = 0, time = 0, timer;
let allMcq = null, allFacts = null, allNotes = null;
const facts = { list:[], filtered:[] };
const notes = { list:[], filtered:[], byKey:{}, read:{}, react:{} };
const P = { ...P0 };
const S = { job:new Set(), subject:new Set(), fs:new Set(), ft:new Set(), cat:new Set(), st:new Set() };
const Q = {};

/* FIX: localStorage persistence for P, read, react */
const STORE_KEY = 'selflearners_v5';
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ P, read: notes.read, react: notes.react })); }
  catch (e) { /* quota or disabled — ignore */ }
}
function restoreState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    if (s.P) Object.assign(P, s.P);
    if (s.read) Object.assign(notes.read, s.read);
    if (s.react) Object.assign(notes.react, s.react);
  } catch (e) { /* corrupt — ignore */ }
}

   4. FILTER FIELD METADATA
   ============================================================ */
const FIELD_DEFS = {
  job:     { label:'💼 Jobs',     group:'mcq',   all:'All jobs' },
  subject: { label:'📚 Subjects', group:'mcq',   all:'All subjects' },
  fs:      { label:'📚 Subjects', group:'facts', all:'All subjects' },
  ft:      { label:'🏷️ Topics',   group:'facts', all:'All topics' },
  cat:     { label:'📚 Category', group:'notes', all:'All Categories' },
  st:      { label:'🏷️ Status',   group:'notes', all:'All Status' }
};

/* ============================================================
   5. VIEW CONFIG
   ============================================================ */
const VIEWS = {
  mcq: {
    label: '📝 MCQs',
    short: 'Quiz',
    fields: ['job','subject'],
    load: async () => {
      // FIX: safe load with user-visible error
      if (allMcq) return allMcq;
      try { return allMcq = await loadCSV(U.q, parseMcq); }
      catch (e) { bd.innerHTML = '<div class="load">❌ Failed to load MCQs.<br><small>Check your connection.</small></div>'; throw e; }
    },
    title: () => P.mcqMode === 'exam'
      ? (S.job.size ? `${S.job.size} Job(s) MCQs` : 'All Jobs MCQs')
      : '📖 MCQs — Read Mode',
    filter: (x, q) => (P.n < 0 ? x.correct < 0 : true)   // FIX: invalids filter lives here
      && setMatch(x, { job:S.job, subject:S.subject }, { job:'job', subject:'subject' })
      && textMatch([x.q, x.subject, x.topic, x.job, ...x.opts], q),
    render: () => P.mcqMode === 'exam' ? renderExam() : renderMcqList()
  },
  facts: {
    label: '💡 Facts',
    short: 'Facts',
    fields: ['fs','ft'],
    load: async () => {
      if (allFacts) return allFacts;
      try { return allFacts = await loadCSV(U.f, parseFact); }
      catch (e) { bd.innerHTML = '<div class="load">❌ Failed to load Facts.</div>'; throw e; }
    },
    title: () => '💡 Facts',
    filter: (f, q) => setMatch(f, { fs:S.fs, ft:S.ft }, { fs:'subject', ft:'topic' })
      && textMatch([f.q, f.answer, f.subject, f.topic], q)
      && (P.fv === 't' ? f.verify === 't' : P.fv === 'f' ? f.verify !== 't' : true),
    render: renderFacts,
    limitKey: 'fn'
  },
  notes: {
    label: '📔 Notes',
    short: 'Notes',
    fields: ['cat','st'],
    load: async () => {
      if (allNotes) return allNotes;
      try {
        const rows = await loadCSV(U.n, parseNote);
        rows.forEach((r,i) => notes.byKey[r._k = `${r.category}||${r.reference}|${i}`] = r);
        notes.list = rows;                    // FIX: assign .list immediately so menus see it
        return allNotes = rows;
      } catch (e) { bd.innerHTML = '<div class="load">❌ Failed to load Notes.</div>'; throw e; }
    },
    title: () => '📔 Notes',
    filter: (r, q) => setMatch(r, { cat:S.cat, st:S.st }, { cat:'category', st:'status' })
      && textMatch([r.reference, r.memory, r.category], q)
      && tabMatch(r),
    render: renderNotes
  }
};

const setMatch = (row, sets, map) => {
  for (const [k, field] of Object.entries(map)) {
    if (sets[k].size && !sets[k].has(normKey(row[field]))) return false;
  }
  return true;
};
const textMatch = (fields, q) => !q || fields.some(f => String(f).toLowerCase().includes(q));
const tabMatch = r => {
  const rd = notes.read[r._k], rx = notes.react[r._k];
  return P.tab === 'all'
    || (P.tab === 'read' && rd)
    || (P.tab === 'unread' && !rd)
    || (P.tab === 'liked' && rx?.type === 'like')
    || (P.tab === 'disliked' && rx?.type === 'dislike');
};

/* ============================================================
   7. FILTER MENUS
   ============================================================ */
const distinctValues = (rows, field) => {
  const m = new Map();
  if (!rows) return m;                                   // FIX: guard null
  rows.forEach(r => { const v = clean(r[field]); if (v && !m.has(normKey(v))) m.set(normKey(v), titleCase(v)); });
  return m;
};
const countValues = (field, def) => {
  const m = new Map();
  notes.list.forEach(r => { const c = clean(r[field]) || def; m.set(c, (m.get(c) || 0) + 1); });
  return m;
};
const labeledMap = m => new Map([...m].map(([v,c]) => [v, `${v} (${c})`]));

const MENU_SOURCES = {
  job:     () => distinctValues(allMcq, 'job'),
  subject: () => distinctValues(allMcq && (S.job.size ? allMcq.filter(x => S.job.has(normKey(x.job))) : allMcq), 'subject'),
  fs:      () => distinctValues(allFacts, 'subject'),    // FIX: was facts.list (never assigned)
  ft:      () => distinctValues(allFacts, 'topic'),      // FIX: same
  cat:     () => labeledMap(countValues('category','Uncategorized')),
  st:      () => labeledMap(new Map([...countValues('status','—')].sort((a,b) => statusMeta(a[0]).r - statusMeta(b[0]).r || a[0].localeCompare(b[0]))))
};

function renderMenu(k) {
  const map = MENU_SOURCES[k](), set = S[k], q = normKey(Q[k] || '');
  [...set].forEach(v => map.has(v) || set.delete(v));
  const def = FIELD_DEFS[k];
  const items = [...map].sort((a,b) => k === 'st' ? 0 : a[1].localeCompare(b[1]))
    .filter(([,v]) => !q || normKey(v).includes(q));
  const row = (v, label) => {
    const on = v ? set.has(v) : !set.size;
    return `<div class="ddi${on ? ' sel' : ''}" data-v="${esc(v)}"><span class="ck">${on ? '✓' : ''}</span>${esc(label)}</div>`;
  };
  $(k + 'm').innerHTML = items.length
    ? row('', def.all) + items.map(e => row(...e)).join('')
    : `<div class="dde">${q ? 'No matches' : 'No options'}</div>`;
  $(k + 't').textContent = set.size ? `${set.size} selected` : def.all;
  $(k + 'c').innerHTML = [...set].map(v => `<span class="cc">${esc(map.get(v) || v)} <button data-v="${esc(v)}">×</button></span>`).join('');
}
const renderMenus = () => Object.keys(FIELD_DEFS).filter(k => FIELD_DEFS[k].group.includes(mode)).forEach(renderMenu);

/* ============================================================
   8. MAIN APPLY
   ============================================================ */
async function apply() {
  clearInterval(timer);
  $('gd').innerHTML = $('st').innerHTML = '';
  const v = VIEWS[mode];
  const loaded = mode === 'mcq' ? allMcq : mode === 'facts' ? allFacts : allNotes;
  if (!loaded) {
    bd.innerHTML = '<div class="load">🔄 Loading…</div>';
    try { await v.load(); } catch (e) { return; }        // FIX: bail on load error
    if (VIEWS[mode] !== v) return;
  }
  // FIX: ensure .list refs are set BEFORE renderMenus (menus read notes.list)
  if (mode === 'facts') facts.list = allFacts;
  if (mode === 'notes') notes.list = allNotes;

  renderMenus();

  const q = $('sq').value.trim().toLowerCase();
  const source = mode === 'notes' ? allNotes : mode === 'facts' ? allFacts : allMcq;
  data = source.filter(x => v.filter(x, q));

  // FIX: apply limit in BOTH exam and read MCQ modes
  if (mode === 'mcq' && P.n > 0) data = data.slice(0, P.n);
  if (v.limitKey && P[v.limitKey]) data = data.slice(0, P[v.limitKey]);

  $('tt').textContent = v.title();
  $('cnt').textContent = `${data.length} ${mode === 'mcq' ? 'items' : mode}`;
  $('tmr').style.display = (mode === 'mcq' && P.mcqMode === 'exam') ? '' : 'none';

  v.render();
}

/* ============================================================
   9. MCQ — Exam mode
   ============================================================ */
function renderExam() {
  // FIX: data is already filtered (including invalids) by apply()
  qs = shuffleByCategory(data).map(x => ({ ...x, ...shuffleOptions(x.opts, x.correct) }));
  answers = Array(qs.length).fill(null);
  cur = 0; time = qs.length * 60;
  if (qs.length) timer = setInterval(tick, 1000);
  $('cnt').textContent = '0/' + qs.length;
  tick(); go(0, 1);
}
function tick() {
  $('tmr').textContent = `${pad(time / 60 | 0)}:${pad(time % 60)}`;
  if (time <= 0) return endExam();
  time--;
}
function go(i, scroll) {
  cur = i; renderQuestion(); renderGrid(); renderStats();
  scroll && window.scrollTo({ top:0, behavior:'smooth' });
}
function renderQuestion() {
  const x = qs[cur];
  if (!x) return bd.innerHTML = '<div class="load">No questions match filters</div>';
  const invalid = x.correct < 0, done = answers[cur] != null || invalid, last = cur === qs.length - 1;
  const chips = meta(MQ, x);
  bd.innerHTML = `
    <div class="q" data-qi="${cur}">${vmark(x.mcol ? 't' : 'u', 'qvfy')}${cur+1}. ${x.q}</div>
    ${x.opts.map((o,i) => {
      const cls = done && !invalid ? (i === x.correct ? ' ok' : i === answers[cur] ? ' bad' : '') : '';
      return `<button class="opt${cls}" data-i="${i}" ${done ? 'disabled' : ''}><span class="k">${'ABCD'[i]}</span><span>${esc(o) || '(Empty)'}</span></button>`;
    }).join('')}
    ${done && chips ? `<div class="lm chips">${chips}</div>` : ''}
    ${invalid ? '<div class="inv-msg">⚠️ Invalid — correct answer not in options</div>' : ''}
    <div class="bar">
      <button class="btn btn-o" id="pv" ${cur ? '' : 'disabled'}>◀ Back</button>
      <button class="btn${last ? ' btn-g' : ''}" id="nx">${last ? '🏁 Finish' : 'Next ▶'}</button>
    </div>`;
}
function renderGrid() {
  $('gd').innerHTML = qs.map((x,i) => {
    const cls = x.correct < 0 ? ' inv' : answers[i] != null ? (answers[i] === x.correct ? ' ok' : ' bad') : '';
    return `<button class="dot${cls}${i === cur ? ' cur' : ''}" data-i="${i}">${i+1}</button>`;
  }).join('');
}
function renderStats() {
  let ok = 0, bad = 0, pending = 0, inv = 0;
  qs.forEach((x,i) => x.correct < 0 ? inv++ : answers[i] == null ? pending++ : answers[i] === x.correct ? ok++ : bad++);
  $('st').innerHTML = [
    ['ok','🎯 Correct',ok], ['bad','❌ Wrong',bad], ['','⏳ Pending',pending],
    ...(inv ? [['inv','⚠️ Invalid',inv]] : [])
  ].map(([c,l,n]) => `<span class="stat ${c}">${l} <span>${n}</span></span>`).join('');
}
function endExam() {
  clearInterval(timer);
  const total = qs.length;
  const right = qs.filter((x,i) => answers[i] === x.correct).length;
  const pct = total ? Math.round(right / total * 100) : 0;
  const icon = right === total ? '🌟' : pct >= 70 ? '👏' : '💪';
  const msg = right === total ? 'Perfect score!' : pct >= 70 ? 'Great job!' : 'Keep practicing!';
  bd.innerHTML = `
    <div style="text-align:center;padding:20px">
      <div style="font-size:3rem;margin-bottom:8px">${icon}</div>
      <div style="font-size:2.6rem;font-weight:900;color:#0284c7">${right} / ${total}</div>
      <div style="color:#475569;margin:10px 0 20px;font-weight:600">${msg} — ${pct}%</div>
      <button class="btn" id="retry">⟳ Try again</button>   <!-- FIX: no location.reload -->
    </div>`;
  $('gd').innerHTML = $('st').innerHTML = '';
}

/* ============================================================
   12. Notes
   ============================================================ */
function renderNotes() {
  if (!notes.list.length) { $('cnt').textContent = '0 notes'; return bd.innerHTML = '<div class="load">⚠️ No notes loaded</div>'; }
  const list = [...data];                                 // FIX: copy so sort doesn't mutate data
  const countRead = r => notes.read[r._k]?.count || 0;
  const rank = r => statusMeta(r.status).r;
  if (P.sort === 'prio') list.sort((a,b) => rank(a) - rank(b));
  else if (P.sort === 'unread') list.sort((a,b) => (countRead(a) > 0) - (countRead(b) > 0));
  else if (P.sort === 'most') list.sort((a,b) => countRead(b) - countRead(a));
  const readCount = list.filter(r => notes.read[r._k]).length;
  $('cnt').textContent = list.length + ' notes';
  bd.innerHTML = `
    <div class="ninfo">
      <div><b id="ns"></b>/<b>${list.length}</b> of <b>${notes.list.length}</b></div>
      <div><b>${readCount}</b>/<b>${list.length}</b><span class="pct">${list.length ? Math.round(readCount * 100 / list.length) : 0}% Read</span></div>
    </div>
    <div class="list" id="nl"></div>
    <div class="nmore" id="nm"></div>`;
  notes.filtered = list;
  moreNotes(0);
}
function moreNotes(from) {
  const list = notes.filtered;
  const to = Math.min(from + (P.lim || PG), list.length);
  $('nl').insertAdjacentHTML('beforeend', list.slice(from, to).map((r,i) => noteCard(r, from + i + 1, list.length)).join(''));
  const ns = $('ns'); if (ns) ns.textContent = to;
  const nm = $('nm'); if (!nm) return;
  nm.innerHTML = to >= list.length
    ? `✓ All ${list.length} loaded`
    : `<div><b>${to}</b> loaded · <b>${list.length - to}</b> remaining</div><button id="mb" data-from="${to}">Load more</button>`;
}
function noteCard(r, i, total, open) {
  const st = statusMeta(r.status), k = r._k;
  const rec = notes.read[k], count = rec ? rec.count : 0, rx = notes.react[k];
  const readBadge = rec
    ? `<span class="nst read">${rec.lastDay === today() ? '● Read today' : '● Read · ' + esc(fmtShort(rec.last))}</span>`
    : '<span class="nst">○ Unread</span>';
  const rows = [
    ['Position', `${i} of ${total}`], ['Row', r.row], ['Category', r.category],
    ['Reference', r.reference], ['Memory', r.memory, 1], ['Status', r.status],
    ['Read count', rec ? `${count} day${count === 1 ? '' : 's'}` : '0'],
    ['First read', fmtFull(rec?.first) || '—'], ['Last read', fmtFull(rec?.last) || '—'],
    ['Reaction', rx ? (rx.type === 'like' ? '👍 Liked' : '👎 Disliked') : '—'],
    ['Reacted at', fmtFull(rx?.ts) || '—']
  ];
  return `<article class="ncard ${st.c}${count ? ' rd' : ''}${open ? ' open' : ''}" data-key="${esc(k)}" data-i="${i}">
    <div class="ctop"><span class="cnum">${i} / ${total}</span><span class="nbadge ${st.c}">${esc(st.l)}</span></div>
    <div class="refrow"><span class="nref">${esc(r.reference || '—')}</span><span class="ncat">${esc(r.category || 'Uncategorized')}</span></div>
    <div class="nmem">${esc(r.memory)}</div>
    <div class="nbot">
      <div>
        <button class="nric like ${rx?.type === 'like' ? 'on' : ''}" data-act="like">👍</button>
        <button class="nric dislike ${rx?.type === 'dislike' ? 'on' : ''}" data-act="dislike">👎</button>
      </div>
      <div>
        <span class="nrc ${count ? 'h' : ''}">👁 ${count}×</span>
        ${readBadge}
        <button class="nxh" data-act="expand">▾</button>
      </div>
    </div>
    <div class="ndet">
      ${rows.map(([l,v,p]) => `<div class="ndr"><small>${l}</small><div>${p ? esc(v) : `<strong>${esc(v || '—')}</strong>`}</div></div>`).join('')}
    </div>
  </article>`;
}
function handleNoteClick(target, card) {
  const k = card.dataset.key, r = notes.byKey[k];
  const act = target.closest('[data-act]')?.dataset.act;
  const onMemory = !!target.closest('.nmem');
  const isReaction = act === 'like' || act === 'dislike';
  const now = Date.now(), day = today();
  let rec = notes.read[k];
  if (!rec) rec = { count:1, first:now, last:now, lastDay:day };
  else { if (rec.lastDay !== day) rec.count++; rec.last = now; rec.lastDay = day; }
  notes.read[k] = rec;
  if (isReaction) {
    if (notes.react[k]?.type === act) delete notes.react[k];
    else notes.react[k] = { type:act, ts:now };
  }
  if (onMemory) gSearch([r.reference, r.memory, r.category]);
  const wasOpen = card.classList.contains('open');
  const shouldToggle = !onMemory && !isReaction;
  card.outerHTML = noteCard(r, +card.dataset.i, notes.filtered.length, shouldToggle ? !wasOpen : wasOpen);
  saveState();                                            // FIX: persist after change
}

/* ============================================================
   13. EVENT HANDLERS
   ============================================================ */
const coerce = v => /^-?\d+$/.test(v) ? +v : v;

const ACTIONS = {
  ddb:   el => { const dd = el.closest('.dd'); $$('.dd.on').forEach(x => x !== dd && x.classList.remove('on')); dd.classList.toggle('on'); },
  'select-filter': el => toggleSetFilter(el.closest('[data-k]').dataset.k, el.dataset.v),  // FIX: merged ddi + cc-remove
  ddi:   el => ACTIONS['select-filter'](el),
  cb:    el => setPref(el.dataset.p, el.dataset.v),
  mbtn:  el => { mode = el.dataset.m; syncDrawer(); apply(); toggleDrawer(false); },
  dotsBtn: () => toggleDrawer(true),
  dc:    () => toggleDrawer(false),
  lb:    () => { apply(); toggleDrawer(false); },
  rb:    resetAll,
  ov:    () => toggleDrawer(false),
  dot:   el => go(+el.dataset.i, 1),
  opt:   el => { answers[cur] = +el.dataset.i; $('cnt').textContent = answers.filter(a => a != null).length + '/' + qs.length; go(cur); },
  pv:    () => go(cur - 1),
  nx:    () => cur === qs.length - 1 ? endExam() : go(cur + 1),
  mb:    el => moreNotes(+el.dataset.from),
  retry: () => apply()                                    // FIX: retry without page reload
};

function toggleSetFilter(k, v) {
  const set = S[k];
  !v ? set.clear() : set.has(v) ? set.delete(v) : set.add(v);
  renderMenu(k);
  if (mode === 'notes') apply();
}
function setPref(p, v) {
  const val = p === 'fv' && P.fv === v ? 'all' : v;
  P[p] = coerce(val);
  markActive();
  saveState();                                            // FIX: persist prefs
  if (['tab','sort','lim','mcqMode','n','fn','fv'].includes(p)) apply();
}
function resetAll() {
  Object.values(S).forEach(s => s.clear());
  Object.keys(Q).forEach(k => Q[k] = '');
  dr.querySelectorAll('.ds input').forEach(i => i.value = '');
  $('sq').value = '';
  Object.assign(P, P0);
  markActive();
  renderMenus();
  saveState();                                            // FIX: persist reset
}

/* ============================================================
   14. GLOBAL CLICK ROUTER
   ============================================================ */
document.addEventListener('click', e => {
  const t = e.target;

  if (mode === 'notes' && bd.contains(t)) {
    const card = t.closest('.ncard');
    if (card && !t.closest('.ndet')) return handleNoteClick(t, card);
  }

  const el = t.closest('[class]');
  if (el) {
    for (const cls of el.classList) {
      if (ACTIONS[cls]) { e.preventDefault(); return ACTIONS[cls](el, e); }
    }
  }

  if (bd.contains(t)) {
    if (mode === 'mcq' && P.mcqMode === 'read') {
      const li = t.closest('[data-qi]'); if (li) return searchMcq(data[+li.dataset.qi]);
    }
    if (mode === 'mcq' && P.mcqMode === 'exam') {
      const q = t.closest('[data-qi]'); if (q) return searchMcq(qs[+q.dataset.qi]);
    }
    if (mode === 'facts') {
      const f = t.closest('[data-fi]');
      if (f) { const x = data[+f.dataset.fi]; return gSearch([x.q, x.subject && `Subject: ${x.subject}`, x.topic && `Topic: ${x.topic}`]); }
    }
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('.ds input')) { const k = t.id.slice(0, -1); Q[k] = t.value; renderMenu(k); }
  else if (t.id === 'sq') apply();
});

/* ============================================================
   15. BOOT
   ============================================================ */
restoreState();                                           // FIX: restore persisted state before first render
syncDrawer();
apply();
</script>
