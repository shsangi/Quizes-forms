            // ---------- SCHEDULE PAGE LOGIC ----------
            function initSchedulePage(container) {
                const scheduleContainer = container.querySelector('#scheduleContainer');
                const currentActivityEl = container.querySelector('#currentActivity');
                const doneCountEl = container.querySelector('#doneCountSchedule');
                const remainingCountEl = container.querySelector('#remainingCountSchedule');
                const remainingMinutesEl = container.querySelector('#remainingTimeMinutes');
                const remainingSecondsEl = container.querySelector('#remainingTimeSeconds');
                const pkTimeEl = container.querySelector('#pkTime');
                const mptDateDisplay = container.querySelector('#mptDateDisplay');
                const writtenDateDisplay = container.querySelector('#writtenDateDisplay');
                const mptDays = container.querySelector('#mptDays');
                const writtenDays = container.querySelector('#writtenDays');

                let scheduleData = [];
                let scheduleMpt = null;
                let scheduleWritten = null;
                let scheduleTimerHandle = null;

                function parseScheduleCSV(txt) {
                    const lines = txt.split('\n').filter(l => l.trim());
                    if (lines.length < 2) return null;
                    const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                    const idx = {
                        subject: headers.findIndex(h => h.includes('activity') || h.includes('subject')),
                        from: headers.findIndex(h => h === 'from' || h === 'start'),
                        to: headers.findIndex(h => h === 'to' || h === 'end'),
                        duration: headers.findIndex(h => h === 'duration' || h === 'time'),
                        type: headers.findIndex(h => h === 'type' || h === 'activitytype'),
                        mpt: headers.findIndex(h => h.includes('mpt') || h.includes('test date')),
                        written: headers.findIndex(h => h.includes('written') || h.includes('exam'))
                    };
                    const data = [];
                    let mptStr = null, writtenStr = null;

                    for (let i = 1; i < lines.length; i++) {
                        const cols = lines[i].split(',').map(x => x.trim());
                        if (cols.length < 4 || cols.every(x => !x)) continue;
                        const subject = idx.subject >= 0 ? cols[idx.subject] : cols[0] || '';
                        let from = (idx.from >= 0 ? cols[idx.from] : cols[1] || '').replace(/\s/g, ''),
                            to = (idx.to >= 0 ? cols[idx.to] : cols[2] || '').replace(/\s/g, ''),
                            duration = (idx.duration >= 0 ? cols[idx.duration] : cols[3] || '').replace(/\s/g, '');
                        if (idx.mpt >= 0 && cols[idx.mpt] && /\d{1,2}\s+[A-Za-z]{3}\s+\d{4}/.test(cols[idx.mpt])) mptStr = cols[idx.mpt];
                        if (idx.written >= 0 && cols[idx.written] && /\d{1,2}\s+[A-Za-z]{3}\s+\d{4}/.test(cols[idx.written])) writtenStr = cols[idx.written];
                        if (!from || !to || !subject) continue;
                        if (from.length === 4) from = '0' + from;
                        if (to.length === 4) to = '0' + to;
                        if (!/^\d{2}:\d{2}$/.test(from) || !/^\d{2}:\d{2}$/.test(to)) continue;
                        if (!duration || !/^\d+[hm]/i.test(duration)) {
                            const diff = parseInt(to.split(':')[0]) - parseInt(from.split(':')[0]);
                            duration = (diff > 0 && diff <= 24) ? diff + 'h' : '1h';
                        }
                        let type = 'compulsory';
                        if (idx.type >= 0 && cols[idx.type]) {
                            const t = cols[idx.type].toLowerCase();
                            if (['core', 'compulsory', 'optional', 'mpt', 'review', 'break', 'sleep'].includes(t)) type = t;
                        } else {
                            const subj = subject.toLowerCase();
                            if (subj.includes('break') || subj.includes('lunch') || subj.includes('dinner')) type = 'break';
                            else if (subj.includes('sleep') || subj.includes('rest')) type = 'sleep';
                            else if (subj.includes('mpt') || subj.includes('practice')) type = 'mpt';
                            else if (subj.includes('review')) type = 'review';
                            else if (subj.includes('essay') || subj.includes('precis')) type = 'core';
                            else if (subj.includes('optional')) type = 'optional';
                        }
                        data.push({ from, to, duration, subject, type });
                    }
                    if (mptStr) {
                        const d = parseScheduleDate(mptStr);
                        if (d) { scheduleMpt = d; if (mptDateDisplay) mptDateDisplay.textContent = mptStr; }
                    }
                    if (writtenStr) {
                        const d = parseScheduleDate(writtenStr);
                        if (d) { scheduleWritten = d; if (writtenDateDisplay) writtenDateDisplay.textContent = writtenStr; }
                    }
                    return data.length ? data : null;
                }

                function getCurrentSchedule(now) {
                    const secs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
                    let idx = -1, remain = 0;
                    for (let i = 0; i < scheduleData.length; i++) {
                        const [fh, fm] = scheduleData[i].from.split(':').map(Number);
                        const [th, tm] = scheduleData[i].to.split(':').map(Number);
                        const from = fh * 3600 + fm * 60;
                        let to = th * 3600 + tm * 60;
                        if (to < from) {
                            if (secs >= from || secs < to) {
                                idx = i;
                                remain = secs >= from ? (86400 - secs) + to : to - secs;
                                break;
                            }
                        } else if (secs >= from && secs < to) {
                            idx = i;
                            remain = to - secs;
                            break;
                        }
                    }
                    if (idx === -1) {
                        let min = Infinity;
                        for (let i = 0; i < scheduleData.length; i++) {
                            const [h, m] = scheduleData[i].from.split(':').map(Number);
                            let diff = h * 3600 + m * 60 - secs;
                            if (diff < 0) diff += 86400;
                            if (diff < min) { min = diff; idx = i; }
                        }
                        remain = min;
                    }
                    return { idx: Math.max(0, idx), remain };
                }

                function renderSchedule() {
                    const now = getPK();
                    if (pkTimeEl) pkTimeEl.textContent = formatDateInPKT(now.toISOString()).split(', ').slice(-1)[0] || now.toLocaleTimeString();
                    if (scheduleMpt && mptDays) mptDays.textContent = daysUntil(scheduleMpt, now);
                    if (scheduleWritten && writtenDays) writtenDays.textContent = daysUntil(scheduleWritten, now);
                    const { idx, remain } = getCurrentSchedule(now);
                    const item = scheduleData[idx] || { subject: 'No schedule', type: '' };
                    if (currentActivityEl) currentActivityEl.textContent = item.subject;
                    if (remainingMinutesEl) remainingMinutesEl.textContent = String(Math.floor(remain / 60)).padStart(2, '0');
                    if (remainingSecondsEl) remainingSecondsEl.textContent = String(Math.floor(remain % 60)).padStart(2, '0');
                    let html = '', done = 0, left = 0;
                    for (let i = 0; i < scheduleData.length; i++) {
                        const row = scheduleData[i];
                        const isBreak = row.type === 'break' || row.type === 'sleep';
                        let cls = 'schedule-row';
                        if (i < idx) { cls += ' done'; done++; }
                        else if (i === idx) { cls += ' current'; left++; }
                        else { left++; }
                        if (isBreak) cls += ' break-row';
                        html += `<div class="${cls}"><span class="srno">${i+1}</span><span class="time">${row.from} - ${row.to}</span><span class="subject">${row.subject}</span><span class="duration-badge">${row.duration}</span></div>`;
                    }
                    if (scheduleContainer) scheduleContainer.innerHTML = html;
                    if (doneCountEl) doneCountEl.textContent = done;
                    if (remainingCountEl) remainingCountEl.textContent = left;
                }

                async function loadSchedule() {
                    try {
                        const r = await fetch(SCHEDULE_URL, { cache: 'no-store' });
                        if (!r.ok) throw new Error();
                        const csv = await r.text();
                        const parsed = parseScheduleCSV(csv);
                        if (parsed && parsed.length) {
                            scheduleData = parsed;
                            renderSchedule();
                            if (scheduleTimerHandle) clearInterval(scheduleTimerHandle);
                            scheduleTimerHandle = setInterval(renderSchedule, 1000);
                        } else {
                            if (scheduleContainer) scheduleContainer.innerHTML = '<div class="schedule-error">No schedule data found</div>';
                        }
                    } catch (e) {
                        if (scheduleContainer) scheduleContainer.innerHTML = '<div class="schedule-error">Failed to load schedule<br><small>Check internet and refresh</small></div>';
                    }
                }

                loadSchedule();

                // Cleanup on removal
                container._cleanup = () => {
                    if (scheduleTimerHandle) clearInterval(scheduleTimerHandle);
                };
            }

            // ---------- SYLLABUS PAGE LOGIC ----------
            function initSyllabusPage(container) {
                const syllabusContainer = container.querySelector('#syllabusContainer');
                const searchInput = container.querySelector('#searchInputSyllabus');
                const subjectSelect = container.querySelector('#subjectSelectSyllabus');
                const countDisplay = container.querySelector('#countDisplay');
                const toggleAllBtn = container.querySelector('#toggleAllBtn');
                const compulsoryCheck = container.querySelector('#compulsoryCheck');
                const optionalCheck = container.querySelector('#optionalCheck');

                let allSyllabusRecords = [], filteredSyllabus = [];
                let syllabusAllCollapsed = false;

                function parseSyllabusLine(line) {
                    const res = []; let cur = '', inside = false;
                    for (let i = 0; i < line.length; i++) {
                        const ch = line[i];
                        if (inside) {
                            if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
                            else if (ch === '"') inside = false;
                            else cur += ch;
                        } else {
                            if (ch === ',') { res.push(cur.trim()); cur = ''; }
                            else if (ch === '"') inside = true;
                            else cur += ch;
                        }
                    }
                    res.push(cur.trim());
                    return res;
                }

                function parseSyllabusCSV(text) {
                    const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
                    if (lines.length < 2) return [];
                    const h = parseSyllabusLine(lines[0]);
                    const idx = {
                        srno: h.indexOf('srno'),
                        subject: h.indexOf('subjectPaper') !== -1 ? h.indexOf('subjectPaper') : h.indexOf('subject'),
                        Module: h.indexOf('Module'),
                        topicNumber: h.indexOf('Topic Number'),
                        topicName: h.indexOf('Topic Name / Detail'),
                        inFPSC: h.indexOf('Given in FPSC CSS Syllabus?'),
                        book: h.indexOf('Recommended Book / Source to Study'),
                        dateRead: h.indexOf('date_read'),
                        subtopics: h.indexOf('Possible Subtopics (FPSC Syllabus Past Papers & Recent Topics)')
                    };
                    const subtopicsIdx = idx.subtopics !== -1 ? idx.subtopics : idx.topicName;
                    const rows = [];
                    for (let i = 1; i < lines.length; i++) {
                        const c = parseSyllabusLine(lines[i]);
                        if (c.length < 8) continue;
                        const r = {
                            srno: c[idx.srno] || '',
                            subject: c[idx.subject] || '',
                            Module: c[idx.Module] || '',
                            topicNumber: c[idx.topicNumber] || '',
                            topicName: c[idx.topicName] || '',
                            inFPSC: c[idx.inFPSC] || '',
                            book: c[idx.book] || '',
                            dateRead: c[idx.dateRead] || '',
                            subtopics: c[subtopicsIdx] || ''
                        };
                        if (!isNaN(parseFloat(r.srno)) && r.srno.trim() !== '') rows.push(r);
                    }
                    return rows;
                }

                function googleSearch(query) {
                    const cleanQuery = query.trim();
                    if (!cleanQuery) return;
                    window.open(`https://www.google.com/search?q=css+${encodeURIComponent(cleanQuery)}`, '_blank');
                }

                function smartSplit(text) {
                    if (!text || text.trim() === '') return [];
                    if (text.includes('\n')) {
                        const parts = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                        if (parts.length > 1) return parts;
                    }
                    const letterMatch = text.match(/[a-z]\)\s*[^,;.]*?(?:[.,;]\s*(?=[a-z]\))|$)/gi);
                    if (letterMatch && letterMatch.length > 1) {
                        const afterLetters = text.replace(/[a-z]\)\s*[^,;.]*?(?:[.,;]\s*(?=[a-z]\))|$)/gi, '').trim();
                        if (afterLetters && /\d+\./.test(afterLetters)) {
                            const result = [...letterMatch];
                            const numberedMatch = afterLetters.match(/\d+\.\s*[^.]*?(?:\.\s*(?=\d+\.)|$)/g);
                            if (numberedMatch) for (const item of numberedMatch) if (item.trim()) result.push(item.trim());
                            return result;
                        }
                        return letterMatch.map(s => s.trim());
                    }
                    const numberedMatch = text.match(/\d+\.\s*[^.]*?(?:\.\s*(?=\d+\.)|$)/g);
                    if (numberedMatch && numberedMatch.length > 1) return numberedMatch.map(s => s.trim());
                    if (text.includes(';')) {
                        const parts = text.split(';').map(s => s.trim()).filter(s => s.length > 0);
                        if (parts.length > 1) return parts;
                    }
                    if (text.includes(',')) {
                        const parts = text.split(',').map(s => s.trim()).filter(s => s.length > 0);
                        if (parts.length > 1) return parts;
                    }
                    if (text.includes('. ')) {
                        const parts = text.split('. ').map(s => s.trim()).filter(s => s.length > 0);
                        if (parts.length > 1) return parts;
                    }
                    return [text.trim()];
                }

                function isNumbered(text) { return /^\d+\./.test(text.trim()); }
                function hasSubLetters(text) {
                    if (!text) return false;
                    return /[a-z]\)\s*[^,;.]*?(?:[.,;]\s*(?=[a-z]\))|$)/gi.test(text) && (text.match(/[a-z]\)/gi) || []).length > 1;
                }
                function extractSubLetters(text) {
                    if (!text) return [];
                    const matches = text.match(/[a-z]\)\s*[^,;.]*?(?:[.,;]\s*(?=[a-z]\))|$)/gi);
                    if (!matches) return [];
                    return matches.map(s => s.trim());
                }

                function cleanSubjectName(rawName) {
                    if (!rawName) return '';
                    let cleaned = rawName;
                    const firstUnderscore = cleaned.indexOf('_');
                    if (firstUnderscore !== -1) cleaned = cleaned.substring(firstUnderscore + 1);
                    cleaned = cleaned.replace(/_/g, ' ');
                    cleaned = cleaned.replace(/\s+/g, ' ').trim();
                    const smallWords = ['of', 'and', 'in', 'the', 'a', 'an', 'to', 'for', 'on', 'at', 'by', 'or', 'as', 'is'];
                    cleaned = cleaned.split(' ').map((w, i) => {
                        if (w.length === 0) return w;
                        if (i > 0 && smallWords.includes(w.toLowerCase())) return w.toLowerCase();
                        return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
                    }).join(' ');
                    return cleaned || rawName;
                }

                function getSubjectType(rawName) {
                    if (!rawName) return 'unknown';
                    const lower = rawName.toLowerCase().trim();
                    if (lower.startsWith('compuls') || lower.includes(' compuls')) return 'compulsory';
                    if (lower.startsWith('option') || lower.includes(' option')) return 'optional';
                    return 'unknown';
                }

                function escapeHtml(str) {
                    if (str == null) return '';
                    return String(str)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#039;');
                }

                function escapeAttr(str) {
                    if (str == null) return '';
                    return String(str)
                        .replace(/\\/g, '\\\\')
                        .replace(/'/g, "\\'")
                        .replace(/"/g, '\\"')
                        .replace(/\n/g, ' ');
                }

                function renderSyllabus(records) {
                    if (!records || records.length === 0) {
                        syllabusContainer.innerHTML = `<div class="empty-state">✨ No topics match your search</div>`;
                        countDisplay.textContent = '0 topics';
                        return;
                    }

                    const groups = {};
                    for (const r of records) {
                        const cleanedName = cleanSubjectName(r.subject);
                        const key = cleanedName || 'Uncategorized';
                        if (!groups[key]) groups[key] = [];
                        groups[key].push(r);
                    }

                    let html = '';
                    let subjectIndex = 0;

                    for (const [subject, items] of Object.entries(groups)) {
                        items.sort((a, b) => parseFloat(a.srno) - parseFloat(b.srno));
                        let latestDate = '';
                        for (const item of items) {
                            if (item.dateRead && item.dateRead.trim() !== '') {
                                const d = new Date(item.dateRead);
                                if (!isNaN(d.getTime())) {
                                    if (!latestDate || d > new Date(latestDate)) latestDate = item.dateRead;
                                }
                            }
                        }

                        const rawSubj = items[0]?.subject || subject;
                        const subjType = getSubjectType(rawSubj);
                        const typeIcon = subjType === 'compulsory' ? '📘' : (subjType === 'optional' ? '📚' : '📄');

                        html += `<div class="paper-block" data-subject-index="${subjectIndex}">`;
                        html += `<div class="paper-header" data-toggle="subject" data-subject-index="${subjectIndex}">`;
                        html += `<div class="paper-header-left">`;
                        html += `<span class="subj-emoji">${typeIcon}</span>`;
                        html += `<span class="subj-name">${escapeHtml(subject)}</span>`;
                        html += `</div>`;
                        html += `<div class="paper-header-right">`;
                        html += `<span class="topic-badge">${items.length} topic${items.length !== 1 ? 's' : ''}</span>`;
                        html += `<span class="collapse-arrow">▼</span>`;
                        html += `</div></div>`;

                        if (latestDate) {
                            html += `<div class="paper-meta">📅 Last studied: <span>${formatDateInPKT(latestDate)}</span></div>`;
                        } else {
                            html += `<div class="paper-meta" style="opacity:.6;">📅 Not studied yet</div>`;
                        }

                        html += `<hr class="subject-divider" />`;
                        html += `<div class="paper-body">`;

                        const moduleMap = {};
                        for (const item of items) {
                            const mod = item.Module || 'General';
                            if (!moduleMap[mod]) moduleMap[mod] = [];
                            moduleMap[mod].push(item);
                        }

                        let moduleIndex = 0;
                        for (const [mod, topics] of Object.entries(moduleMap)) {
                            html += `<div class="module-group" data-subject-index="${subjectIndex}" data-module-index="${moduleIndex}">`;
                            html += `<div class="module-head" data-toggle="module" data-subject-index="${subjectIndex}" data-module-index="${moduleIndex}">`;
                            html += `<span class="module-arrow">▼</span>`;
                            html += `<span class="module-title">${escapeHtml(mod)}</span>`;
                            html += `<span class="module-count">${topics.length}</span>`;
                            html += `</div>`;
                            html += `<div class="module-body">`;

                            for (const t of topics) {
                                const topicNum = t.topicNumber ? `${t.topicNumber}` : '';
                                html += `<div class="topic-item">`;
                                html += `<div class="topic-label">`;
                                html += `<span class="topic-link" onclick="window.syllabusGoogleSearch('${escapeAttr(t.topicName || '')}')">${topicNum} ${escapeHtml(t.topicName || '—')}</span>`;
                                html += `</div>`;

                                const subItems = smartSplit(t.subtopics || t.topicName || '');
                                if (subItems.length > 0) {
                                    html += `<ul class="subtopic-list">`;
                                    for (const sub of subItems) {
                                        if (hasSubLetters(sub)) {
                                            const subLetters = extractSubLetters(sub);
                                            const mainPart = sub.replace(/[a-z]\)\s*[^,;.]*?(?:[.,;]\s*(?=[a-z]\))|$)/gi, '').trim();
                                            const cleanMain = mainPart.replace(/[:–-]\s*$/, '').trim();
                                            if (cleanMain) {
                                                html += `<li><span class="sub-link" onclick="window.syllabusGoogleSearch('${escapeAttr(cleanMain)}')">${escapeHtml(cleanMain)}</span></li>`;
                                            }
                                            if (subLetters.length > 0) {
                                                html += `<ul class="sub-subtopic-list">`;
                                                const letters = 'abcdefghijklmnopqrstuvwxyz';
                                                for (let i = 0; i < subLetters.length; i++) {
                                                    const letter = letters[i] || '?';
                                                    const cleanSub = subLetters[i].replace(/^[a-z]\)\s*/, '').trim();
                                                    html += `<li data-letter="${letter}"><span class="sub-link" onclick="window.syllabusGoogleSearch('${escapeAttr(cleanSub)}')">${escapeHtml(cleanSub)}</span></li>`;
                                                }
                                                html += `</ul>`;
                                            }
                                        } else if (isNumbered(sub)) {
                                            const numClean = sub.replace(/^\d+\.\s*/, '').trim();
                                            html += `<li><span class="sub-link" onclick="window.syllabusGoogleSearch('${escapeAttr(numClean)}')">${escapeHtml(numClean)}</span></li>`;
                                        } else {
                                            let cleanSub = sub.replace(/^\d+\.\s*/, '').replace(/[;,:]\s*$/, '').trim();
                                            if (cleanSub) {
                                                html += `<li><span class="sub-link" onclick="window.syllabusGoogleSearch('${escapeAttr(cleanSub)}')">${escapeHtml(cleanSub)}</span></li>`;
                                            }
                                        }
                                    }
                                    html += `</ul>`;
                                }

                                if (t.book && t.book !== '—') {
                                    html += `<div class="book-ref">📖 <span class="book-link" onclick="window.syllabusGoogleSearch('${escapeAttr(t.book)}')">${escapeHtml(t.book)}</span></div>`;
                                }
                                html += `</div>`;
                            }

                            html += `</div></div>`;
                            moduleIndex++;
                        }

                        html += `</div></div>`;
                        subjectIndex++;
                    }

                    syllabusContainer.innerHTML = html;

                    // Bind collapse/expand events
                    syllabusContainer.querySelectorAll('.paper-header').forEach(header => {

                function updateToggleAllButton() {
                    const blocks = syllabusContainer.querySelectorAll('.paper-block');
                    if (!blocks.length) {
                        toggleAllBtn.style.display = 'none';
                        return;
                    }
                    toggleAllBtn.style.display = '';
                    const anyExpanded = [...blocks].some(b => !b.classList.contains('collapsed'));
                    if (anyExpanded) {
                        toggleAllBtn.textContent = '📂 Collapse All';
                        syllabusAllCollapsed = false;
                    } else {
                        toggleAllBtn.textContent = '📖 Expand All';
                        syllabusAllCollapsed = true;
                    }
                }

                    const moduleGroups = syllabusContainer.querySelectorAll('.module-group');
                    if (syllabusAllCollapsed) {
                        blocks.forEach(b => b.classList.remove('collapsed'));

                function applySyllabusFilters() {
                    const search = searchInput.value.trim().toLowerCase();
                    const subject = subjectSelect.value;
                    const showCompulsory = compulsoryCheck.checked;
                    const showOptional = optionalCheck.checked;

                    filteredSyllabus = allSyllabusRecords.filter(r => {
                        const subjType = getSubjectType(r.subject);
                        if (showCompulsory && !showOptional && subjType !== 'compulsory') return false;
                        if (showOptional && !showCompulsory && subjType !== 'optional') return false;
                        if (showCompulsory && showOptional && subjType === 'unknown') return false;
                        if (subject) {
                            const cleanedSubj = cleanSubjectName(r.subject);
                            if (cleanedSubj !== subject) return false;
                        }
                        if (search) {
                            const all = `${r.srno} ${r.subject} ${r.Module} ${r.topicNumber} ${r.topicName} ${r.book} ${r.subtopics}`.toLowerCase();
                            if (!all.includes(search)) return false;
                        }
                        return true;
                    });
                    renderSyllabus(filteredSyllabus);
                }

                function updateSyllabusSubjects(records) {
                    const subs = new Set();
                    records.forEach(r => {
                        const cleaned = cleanSubjectName(r.subject);
                        if (cleaned) subs.add(cleaned);
                    });
                    const current = subjectSelect.value;
                    subjectSelect.innerHTML = `<option value="">All subjects</option>`;
                    [...subs].sort().forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s;
                        opt.textContent = s;
                        subjectSelect.appendChild(opt);
                    });
                    if ([...subs].includes(current)) subjectSelect.value = current;
                }

                async function loadSyllabus() {
                    try {
                        syllabusContainer.innerHTML = `<div class="loading"><span class="spinner"></span> Loading syllabus…</div>`;
                        const resp = await fetch(SYLLABUS_URL, { cache: 'no-store' });
                        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                        const text = await resp.text();
                        const parsed = parseSyllabusCSV(text);
                        if (parsed.length === 0) {
                            syllabusContainer.innerHTML = `<div class="empty-state">⚠️ No data found</div>`;
                            countDisplay.textContent = '0 topics';
                            return;
                        }
                        allSyllabusRecords = parsed;
                        updateSyllabusSubjects(allSyllabusRecords);
                        applySyllabusFilters();
                    } catch (e) {
                        syllabusContainer.innerHTML = `<div class="empty-state" style="color:#b33;">❌ ${e.message}</div>`;
                        countDisplay.textContent = 'error';
                    }
                }

                // Global for onclick handlers

                searchInput.addEventListener('input', applySyllabusFilters);
                subjectSelect.addEventListener('change', applySyllabusFilters);
                compulsoryCheck.addEventListener('change', applySyllabusFilters);
                optionalCheck.addEventListener('change', applySyllabusFilters);

                loadSyllabus();

                container._cleanup = () => {
                    delete window.syllabusGoogleSearch;
                };
            }

            // ---------- ELIGIBILITY PAGE LOGIC ----------
            function initEligibilityPage(container) {
                const dobInput = container.querySelector('#dob');
                const relaxationSelect = container.querySelector('#relaxation');
                const checkBtn = container.querySelector('#checkEligibilityBtn');
                const yearCardsContainer = container.querySelector('#yearCardsContainer');
                const resultsSection = container.querySelector('#resultsSection');

                function calculateEligibility() {
                    const dobValue = dobInput.value;
                    const relaxation = relaxationSelect.value;
                    let prevAttempts = 0;
                    const radios = container.querySelectorAll('input[name="prevAttempts"]');
                    for (const r of radios) {
                        if (r.checked) {
                            prevAttempts = parseInt(r.value);
                            break;
                        }
                    }
                    if (!dobValue) {
                        alert("Please enter your Date of Birth.");
                        return;
                    }

                    const dob = new Date(dobValue);
                    const minAge = 21;
                    const maxAge = (relaxation === 'none') ? 30 : 32;
                    const maxAttempts = 3;
                    let cardsHtml = "";
                    let simulatedAttemptsUsed = prevAttempts;

                    for (let i = 0; i < 10; i++) {
                        const targetExamYear = CURRENT_CYCLE_YEAR + i;
                        const targetCutoffYear = targetExamYear - 1;
                        const simulatedCutoff = new Date(`${targetCutoffYear}-12-31`);
                        let yearAge = simulatedCutoff.getFullYear() - dob.getFullYear();
                        let yearMonths = simulatedCutoff.getMonth() - dob.getMonth();
                        if (simulatedCutoff.getDate() - dob.getDate() < 0) yearMonths--;
                        if (yearMonths < 0) {
                            yearAge--;
                            yearMonths += 12;
                        }

                        const isSimAgeEligible = (yearAge >= minAge && yearAge < maxAge);
                        let cardClass = "",
                            statusBadge = "",
                            noteText = "";

                        if (isSimAgeEligible) {
                            if (simulatedAttemptsUsed < maxAttempts) {
                                simulatedAttemptsUsed++;
                                let isLastUsable = false;
                                if (simulatedAttemptsUsed === maxAttempts) isLastUsable = true;
                                else {
                                    const nextCutoff = new Date(`${targetExamYear}-12-31`);
                                    let nextAge = nextCutoff.getFullYear() - dob.getFullYear();
                                    if (nextCutoff.getMonth() - dob.getMonth() < 0) nextAge--;
                                    if (nextAge >= maxAge) isLastUsable = true;
                                }
                                cardClass = "eligible";
                                statusBadge = `<span class="eligibility-status-badge eligibility-badge-success">Eligible</span>`;
                                noteText = isLastUsable
                                    ? `<span class="eligibility-year-card-note last-attempt">Last usable attempt (#${simulatedAttemptsUsed})</span>`
                                    : `<span class="eligibility-year-card-note">Attempt #${simulatedAttemptsUsed}</span>`;
                            } else {
                                cardClass = "attempts-finished";
                                statusBadge = `<span class="eligibility-status-badge eligibility-badge-neutral">Age OK</span>`;
                                noteText = `<span class="eligibility-year-card-note">Attempts finished</span>`;
                            }
                        } else if (yearAge < minAge) {
                            cardClass = "underage";
                            statusBadge = `<span class="eligibility-status-badge eligibility-badge-warning">Underage</span>`;
                            noteText = `<span class="eligibility-year-card-note">Below min age (${minAge})</span>`;
                        } else {
                            cardClass = "overage";
                            statusBadge = `<span class="eligibility-status-badge eligibility-badge-danger">Overage</span>`;
                            noteText = `<span class="eligibility-year-card-note">Completed ${maxAge}+ years</span>`;
                        }

                        cardsHtml += `<div class="eligibility-year-card ${cardClass}"><div class="eligibility-year-card-top"><div class="eligibility-year-card-info"><span class="eligibility-year-card-title">CSS ${targetExamYear}</span><span class="eligibility-year-card-age">Cut-off: Dec ${targetCutoffYear} · Age: ${yearAge}y ${yearMonths}m</span></div><div class="eligibility-year-card-status">${statusBadge}</div></div>${noteText}</div>`;
                    }

                    yearCardsContainer.innerHTML = cardsHtml;
                    resultsSection.classList.add('visible');
                }

                if (checkBtn) checkBtn.addEventListener('click', calculateEligibility);
            }

                ui.jobsitesSearchInput.addEventListener('input', () => { jobSitesSearchQuery = ui.jobsitesSearchInput.value; renderJobSites(); });

                // Desktop nav tabs
                document.querySelectorAll('.desktop-nav-tab').forEach((tab) => {
                    tab.addEventListener('click', (e) => {
                        e.stopPropagation();
                        setMode(tab.dataset.desktopMode);
                    });
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (ui.pinOverlay.classList.contains('active')) { cancelPinPrompt(); return; }
                        if (ui.drawer.classList.contains('open')) closeDrawer();
                        else if (ui.modal.classList.contains('active')) closeModal();
                        else if (ui.jobsitesOverlay.classList.contains('active')) closeJobSitesModal();
                        else if (ui.papersYearPillWrap.classList.contains('open')) ui.papersYearPillWrap.classList.remove('open');
                        else if (ui.papersSubjectPillWrap.classList.contains('open')) ui.papersSubjectPillWrap.classList.remove('open');
                    }
                });

                // Scroll listener for top bar
                window.addEventListener('scroll', () => {
                    if (ui.topBar) ui.topBar.classList.toggle('scrolled', window.scrollY > 10);
                }, { passive: true });

                // ---- INSTALL BANNER ----
                function shouldShowInstallBanner() {
                    try {
                        const dismissed = localStorage.getItem(KEY_INSTALL_DISMISSED);
                        if (!dismissed) return true;
                        const dayMs = 24 * 60 * 60 * 1000;
                        return (Date.now() - parseInt(dismissed, 10)) > dayMs;
                    } catch (e) { return true; }
                }
                function hideInstallBanner(persistDismiss) {
                    if (!ui.installBanner) return;
                    ui.installBanner.classList.remove('show');
                    if (persistDismiss) {
                        try { localStorage.setItem(KEY_INSTALL_DISMISSED, String(Date.now())); } catch (e) {}
                    }
                }
                function handleInstallClick() {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        deferredPrompt.userChoice.then((choiceResult) => {
                            if (choiceResult.outcome === 'accepted') {
                                toast('App installed! Check your home screen.', 'success', 3000, false);
                                hideInstallBanner(true);
                            } else {
                                toast('Install cancelled', 'info', 2500, false);
                            }
                            deferredPrompt = null;
                        });
                    } else {
                        const ua = navigator.userAgent || '';
                        const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
                        const isAndroid = /Android/.test(ua);
                        let msg = '📲 To install:\n\n';
                        if (isIOS) msg += '1. Tap the Share button (⬆️) at bottom\n2. Scroll and tap "Add to Home Screen"\n3. Tap "Add"';
                        else if (isAndroid) msg += '1. Tap the menu (⋮) in browser\n2. Tap "Install app" or "Add to Home Screen"\n3. Confirm install';
                        else msg += '1. Look for install icon in address bar\n2. Or use browser menu → "Install App"\n3. Confirm install';
                        alert(msg);
                    }
                }
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    deferredPrompt = e;
                });
                window.addEventListener('appinstalled', () => {
                    hideInstallBanner(true);
                    toast('✅ App installed successfully!', 'success', 3000, false);
                });
                if (ui.installBtn) ui.installBtn.onclick = handleInstallClick;
                if (ui.installClose) ui.installClose.onclick = () => hideInstallBanner(true);
                if (shouldShowInstallBanner()) {
                    setTimeout(() => { if (ui.installBanner) ui.installBanner.classList.add('show'); }, 1500);
                }

                // ---- LOGO ----
                [ui.brandLogo].forEach((img) => {
                    const probe = new Image();
                    probe.onload = () => (img.src = LOGO);
                    probe.src = LOGO;
                });

                // ---- INTRO SEQUENCE ----
                function buildIntroSequence() {
                    setTimeout(() => { if (ui.topBar) ui.topBar.classList.add('run-intro'); }, 3000);
                    setTimeout(() => { if (ui.logoRing) ui.logoRing.classList.add('run'); }, 9000);
                }
                buildIntroSequence();

                // ---- BOOT ----
                // Load facts read set
                try { const saved = JSON.parse(localStorage.getItem(KEY_FACTS_READ) || '[]'); factsReadSet = new Set(saved); } catch (e) { factsReadSet = new Set(); }

                // Fetch questions
                fetchQuestions(false);

                // Determine initial mode
                let savedMode = 'mcq';
                try { const m = localStorage.getItem(KEY_MODE); if (m === 'read' || m === 'facts' || m === 'papers') savedMode = m; } catch (e) {}
                setMode(savedMode, true);

                // Refresh pin
                refreshPinForCurrentUser();

                // Listen for messages from parent
                window.addEventListener('message', (e) => {
                    const d = e.data;
                    if (!d || typeof d !== 'object') return;
                    if (d.type === 'SL_THEME') {}
                    else if (d.type === 'SL_USER') {
                        const prevIsGuest = isGuest;
                        user = d.user || null;
                        isGuest = !!d.isGuest;
                        if (user) updateUserLabels();
                        closeBothPanels();
                        if (ui.jobsitesOverlay) ui.jobsitesOverlay.classList.remove('active');
                        if (ui.progressOverlay) ui.progressOverlay.classList.remove('active');
                        if (ui.papersYearPillWrap) ui.papersYearPillWrap.classList.remove('open');
                        if (ui.papersSubjectPillWrap) ui.papersSubjectPillWrap.classList.remove('open');
                        document.body.style.overflow = '';
                        if (prevIsGuest !== isGuest) {
                            if (mode === 'mcq') { renderDots(currentQ); renderQuestion(); updateProgress(); updateOverview(); }
                            else if (mode === 'read') { renderReadMode(); }
                            else if (mode === 'facts') { renderFactsMode(); }
                            else if (mode === 'papers') { renderPapersCards(); renderSelectedSubjectsLine(); }
                        }
                        refreshPinForCurrentUser();
                    } else if (d.type === 'SL_SET_MODE') {
                        setMode(d.mode, true);
                    } else if (d.type === 'SL_FORCE_CLOSE_OVERLAYS') {
                        closeBothPanels();
                        if (ui.jobsitesOverlay) ui.jobsitesOverlay.classList.remove('active');
                        if (ui.cOverlay) ui.cOverlay.classList.remove('active');
                        if (ui.progressOverlay) ui.progressOverlay.classList.remove('active');
                        if (ui.pinOverlay) ui.pinOverlay.classList.remove('active');
                        if (ui.papersYearPillWrap) ui.papersYearPillWrap.classList.remove('open');
                        if (ui.papersSubjectPillWrap) ui.papersSubjectPillWrap.classList.remove('open');
                        document.body.style.overflow = '';
                    }
                });

                // Expose enterPostLogin for the wrapper
                window.__enterEduPostLogin = function(opts) {
                    if (opts && opts.user) {
                        user = opts.user;
                        isGuest = !!opts.isGuest;
                        updateUserLabels();
                    }
                    if (opts && opts.mode) setMode(opts.mode, true);
                };
            }

            // ---------- ENTER POST LOGIN ----------
            function enterPostLogin(opts) {
                opts = opts || {};
                try { localStorage.setItem(KEY_POST_LOGIN, '1'); } catch (e) {}

                // Hide pre-login navs
                $('topToggleBarPreLogin').style.display = 'none';
                $('bottomNavPreLogin').style.display = 'none';
                $('bottomNavPostLogin').style.display = '';

                // Hide all existing frames
                document.querySelectorAll('.page-frame').forEach(el => {
                    el.style.display = 'none';
                    el.classList.remove('active');
                });

                // Load edu page
                loadPage('edu');

                // After load, send user data
                setTimeout(() => {
                    const eduFrame = document.querySelector('.page-frame[data-page-id="edu"]');
                    if (eduFrame && window.__enterEduPostLogin) {
                        window.__enterEduPostLogin(opts);
                    }
                }, 200);

                // Update active button
                setActivePostLoginButton('mcq');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            // ---------- EXIT TO LOGIN ----------
            function exitToLogin() {
                try { localStorage.removeItem(KEY_POST_LOGIN); } catch (e) {}

                $('bottomNavPostLogin').style.display = 'none';
                $('topToggleBarPreLogin').style.display = '';
                $('bottomNavPreLogin').style.display = '';

                // Remove edu frame
                const eduFrame = document.querySelector('.page-frame[data-page-id="edu"]');
                if (eduFrame) eduFrame.remove();

                activePage = null;

                // Load login page
                loadPage('login');
            }

            // ---------- SET ACTIVE POST LOGIN BUTTON ----------
            function setActivePostLoginButton(mode) {
                document.querySelectorAll('#bottomNavPostLogin .bottom-nav-btn, #topToggleBarPostLogin .toggle-btn').forEach(b => {
                    if (b.dataset.mode) b.classList.toggle('active', b.dataset.mode === mode);
                });
            }

            // ---------- BOOT ----------
            function boot() {
                let loggedIn = false;
                let savedUser = null;
                let lastPage = null;
                try {
                    savedUser = JSON.parse(localStorage.getItem(KEY_USER) || 'null');
                    loggedIn = !!localStorage.getItem(KEY_POST_LOGIN) && !!savedUser;
                    lastPage = localStorage.getItem(KEY_LAST_PAGE);
                } catch (e) {}

                if (loggedIn) {
                    enterPostLogin({ user: savedUser, isGuest: savedUser.user === 'Guest', mode: 'mcq' });
                } else {
                    const validPages = ['login', 'schedule', 'eligibility', 'syllabus'];
                    const startPage = (lastPage && validPages.includes(lastPage)) ? lastPage : 'login';
                    loadPage(startPage);
                }
            }

            // ---------- SETUP NAV EVENT LISTENERS ----------
            function setupNav() {
                // Pre-login top nav
                document.querySelectorAll('#topToggleBarPreLogin .toggle-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (btn.dataset.page) {
                            loadPage(btn.dataset.page);
                        }
                    });
                });
                // Pre-login bottom nav
                document.querySelectorAll('#bottomNavPreLogin .bottom-nav-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (btn.dataset.page) {
                            loadPage(btn.dataset.page);
                        }
                    });
                });
                // Post-login bottom nav
                document.querySelectorAll('#bottomNavPostLogin .bottom-nav-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (!btn.dataset.mode) return;
                        setActivePostLoginButton(btn.dataset.mode);
                        const eduFrame = document.querySelector('.page-frame[data-page-id="edu"]');
                        if (eduFrame && eduFrame.querySelector('#quizApp')) {
                            // Direct access to the edu page's internal setMode function
                            // We'll use the global hook we set up
                            if (window.__enterEduPostLogin) {
                                // We can't call setMode directly, but we can dispatch a custom event
                                // Actually, we can just use the exposed function to send a message
                                // Simpler: post a message to ourselves? No, let's use a custom event.
                                // Let's create a custom event on the container.
                                const event = new CustomEvent('sl-set-mode', { detail: { mode: btn.dataset.mode } });
                                eduFrame.dispatchEvent(event);
                            }
                        }
                    });
                });

                // Listen for custom event inside edu page
                window.addEventListener('sl-set-mode', (e) => {
                    if (e.detail && e.detail.mode) {
                        // This will be caught by the edu page's listener if we add one
                    }
                });
            }

            // ---------- INIT ----------
            setupNav();
            boot();

            // Expose functions globally
            window.__enterPostLogin = enterPostLogin;
            window.__exitToLogin = exitToLogin;
            window.__loadPage = loadPage;
            window.__showToast = toast;

            // Handle messages from parent (if we are the top-level, ignore)
            window.addEventListener('message', (e) => {
                const d = e.data;
                if (!d || typeof d !== 'object') return;
                if (d.type === 'SL_LOGIN') {
                    if (activePage !== 'login') return;
                    try {
                        if (d.user) localStorage.setItem(KEY_USER, JSON.stringify(d.user));
                    } catch (err) {}
                    enterPostLogin({ user: d.user, isGuest: d.isGuest, mode: 'mcq' });
                } else if (d.type === 'SL_LOGOUT') {
                    try { localStorage.removeItem(KEY_USER); } catch (err) {}
                    exitToLogin();
                } else if (d.type === 'SL_SET_MODE_FROM_EDU') {
                    setActivePostLoginButton(d.mode);
                }
            });

            // PWA install button
            (function() {
                const btn = document.getElementById('pwaInstallBtn');
                let deferredPrompt = null;
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    deferredPrompt = e;
                    if (btn) btn.classList.add('show');
                });
                window.addEventListener('appinstalled', () => {
                    deferredPrompt = null;
                    if (btn) btn.classList.remove('show');
                });
                if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
                    if (btn) btn.classList.remove('show');
                }
                if (btn) {
                    btn.addEventListener('click', async () => {
                        if (deferredPrompt) {
                            deferredPrompt.prompt();
                            const choice = await deferredPrompt.userChoice;
                            if (choice.outcome === 'accepted') {
                                btn.classList.remove('show');
                            }
                            deferredPrompt = null;
                        } else {
                            const ua = navigator.userAgent || '';
                            const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
                            const isAndroid = /Android/.test(ua);
                            let msg = '📲 To install this app:\n\n';
                            if (isIOS) {
                                msg += '1. Tap the Share button (⬆️)\n2. Scroll and tap "Add to Home Screen"\n3. Tap "Add"';
                            } else if (isAndroid) {
                                msg += '1. Tap the menu (⋮) in your browser\n2. Tap "Install app" or "Add to Home Screen"\n3. Confirm install';
                            } else {
                                msg += '1. Look for the install icon in the address bar\n2. Or open browser menu → "Install App"\n3. Confirm install';
                            }
                            alert(msg);
                        }
                    });
                }
            })();

            // Service worker registration
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('service-worker.js')
                        .then((reg) => console.log('[PWA] SW registered', reg.scope))
                        .catch((e) => console.warn('[PWA] SW failed', e));
                });
            }

        })();
    </script>
</body>
</html>
