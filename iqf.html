const parseCSV=t=>{const R=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(q){if(c=='"'&&n=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}else if(c=='"')q=true;else if(c==","){r.push(f);f=""}else if(c=="\n"){r.push(f);R.push(r);r=[];f=""}else if(c!="\r")f+=c}if(f||r.length){r.push(f);R.push(r)}return R.filter(r=>r.some(c=>c&&c.trim()))};
const HM={"row":"row","s no":"row","sr no":"row","sno":"row","category":"category","cat":"category","reference":"reference","ref":"reference","one-line memory":"memory","one line memory":"memory","memory":"memory","one-liner":"memory","oneliner":"memory","mcq status":"status","status":"status","mcqstatus":"status","mcq_status":"status"};
const norm=h=>HM[String(h||"").trim().toLowerCase().replace(/\s+/g," ")]||String(h||"").trim().toLowerCase();
const sm=raw=>{const l=String(raw||"").trim().toLowerCase().replace(/\s+/g,"");return["v.imp","vimp","veryimportant","v.important"].includes(l)?{c:"vimp",l:"Very Imp",r:0}:["imp","important"].includes(l)?{c:"imp",l:"Important",r:1}:["note","notes"].includes(l)?{c:"note",l:"Note",r:2}:{c:"other",l:String(raw||"—")||"—",r:3}};
const key=r=>String(r.category||"").trim()+"||"+String(r.reference||"").trim();
const gs=(...a)=>"https://www.google.com/search?q="+encodeURIComponent(a.filter(Boolean).map(x=>String(x).trim()).join(" "));
const markRead=r=>{const k=key(r),n=Date.now(),dn=dk(n);let rec=READ[k];if(!rec)rec={count:1,first:n,last:n,lastDay:dn};else{if(rec.lastDay!==dn)rec.count++;if(!rec.first)rec.first=n;rec.last=n;rec.lastDay=dn}READ[k]=rec};
const setReact=(k,v)=>{const c=REACT[k];if(c&&c.type===v)delete REACT[k];else REACT[k]={type:v,ts:Date.now()}};

const aCount=()=>{let n=0;if(F.q)n++;n+=F.category.length+F.status.length+F.reference.length;if(F.sort!=="default")n++;return n};
const setFP=o=>{FP=o;$("fp").classList.toggle("show",o);$("ft").classList.toggle("on",o||aCount()>0);if(o)refresh()};
const badge=()=>{const n=aCount();$("ftc").textContent=n;$("ftc").classList.toggle("show",n>0);$("ft").classList.toggle("on",FP||n>0);$("rabc").textContent=n;$("rab").disabled=!n};
$("ft").onclick=()=>setFP(!FP);
$("rab").onclick=()=>{F={q:"",status:[],category:[],reference:[],sort:"default"};$("q").value="";$("sort").value="default";[MC,MP,MR].forEach(m=>m&&m.sel([]));apply();toast("Filters cleared.","ok")};

class MSel{constructor(id,o){Object.assign(this,{el:$(id),ph:"Select…",sp:"Search…",opts:[],sel:v=>this._sel=v,on(){},getOptions:null},o);this.el.className="ms";this.el.innerHTML=`<button type="button" class="ms-t"></button><div class="ms-m"><div class="ms-s"><input type="text" placeholder="${esc(this.sp)}"></div><div class="ms-l"></div><div class="ms-a"><button type="button" data-a="all">Select all</button><button type="button" data-a="clear">Clear</button></div></div>`;this.t=this.el.firstChild;this.si=this.el.querySelector("input");this.l=this.el.querySelector(".ms-l");this.S=[];this.rt();this.rl();this.t.onclick=e=>{e.stopPropagation();const o=this.el.classList.contains("open");closeMS();if(!o){if(this.getOptions)this.opts=this.getOptions();this.el.classList.add("open");this.si.value="";this.rl();setTimeout(()=>this.si.focus(),30)}};this.si.oninput=()=>this.rl();this.el.querySelector(".ms-m").onclick=e=>e.stopPropagation();this.el.querySelector('[data-a=all]').onclick=()=>{const q=this.si.value.toLowerCase(),add=this.opts.filter(o=>(typeof o.count!=="number"||o.count>0)&&o.label.toLowerCase().includes(q)).map(o=>o.value);this.S=[...new Set([...this.S,...add])];this.ch()};this.el.querySelector('[data-a=clear]').onclick=()=>{this.S=[];this.ch()}}
sel(v){this.S=v.slice();this.rt();this.rl()}
setOptions(o){this.opts=o;const v=new Set(o.map(x=>x.value));this.S=this.S.filter(x=>v.has(x));this.rt();this.rl()}
ch(){this.rt();this.rl();this.on(this.S.slice())}
tog(v){const i=this.S.indexOf(v);i>=0?this.S.splice(i,1):this.S.push(v);this.ch()}
rt(){this.t.classList.toggle("has",!!this.S.length);if(!this.S.length){this.t.innerHTML=`<span class="ph">${esc(this.ph)}</span>`;return}const rest=this.S.length-2;this.t.innerHTML=this.S.slice(0,2).map(v=>{const o=this.opts.find(x=>x.value===v);return`<span class="pill">${esc(o?o.label:v)}<b data-v="${esc(v)}">✕</b></span>`}).join("")+(rest>0?`<span class="pill">+${rest}</span>`:"");this.t.querySelectorAll("b").forEach(b=>b.onclick=e=>{e.stopPropagation();this.tog(b.dataset.v)})}
rl(){const q=this.si.value.trim().toLowerCase(),f=this.opts.filter(o=>!q||o.label.toLowerCase().includes(q));if(!f.length){this.l.innerHTML='<div class="state" style="padding:14px;font-size:.76rem">No matches</div>';return}const mx=f.reduce((m,o)=>Math.max(m,typeof o.count==="number"?o.count:0),0);this.l.innerHTML=f.map(o=>{const on=this.S.includes(o.value),z=typeof o.count==="number"&&o.count===0&&!on,h=!z&&typeof o.count==="number"&&o.count===mx&&mx>1;return`<div class="opt ${on?"on":""} ${z?"disabled":""}" data-v="${esc(o.value)}"><span class="ck">✓</span><span>${esc(o.label)}</span>${typeof o.count==="number"?`<span class="cnt ${z?"zero":""} ${h?"hi":""}">${o.count}</span>`:""}</div>`}).join("");this.l.querySelectorAll(".opt").forEach(e=>e.onclick=ev=>{ev.stopPropagation();if(!e.classList.contains("disabled"))this.tog(e.dataset.v)})}}
const closeMS=()=>document.querySelectorAll(".ms.open").forEach(m=>m.classList.remove("open"));
document.addEventListener("click",closeMS);

const pass=(r,ig=[])=>{if(F.status.length&&!ig.includes("status")&&!F.status.includes(String(r.status||"").trim()))return false;if(F.category.length&&!ig.includes("category")&&!F.category.includes(String(r.category||"").trim()))return false;if(F.reference.length&&!ig.includes("reference")&&!F.reference.includes(String(r.reference||"").trim()))return false;if(TAB!=="all"&&!ig.includes("tab")){const k=key(r),rx=REACT[k];if(TAB==="liked"&&!(rx&&rx.type==="like"))return false;if(TAB==="disliked"&&!(rx&&rx.type==="dislike"))return false;if(TAB==="read"&&!READ[k])return false;if(TAB==="unread"&&READ[k])return false}return true};
const avail=f=>{const c={};ALL.forEach(r=>{if(!pass(r,[f]))return;let v=f==="category"?String(r.category||"").trim()||"Uncategorized":f==="status"?String(r.status||"").trim()||"Other":String(r.reference||"").trim();if(v)c[v]=(c[v]||0)+1});(f==="category"?F.category:f==="status"?F.status:F.reference).forEach(x=>{if(!(x in c))c[x]=0});const k=Object.keys(c);if(f==="reference")k.sort((a,b)=>(c[b]-c[a])||a.localeCompare(b));else if(f==="status"){const o=["V.Imp","Imp","Note"],ix=x=>{const i=o.indexOf(x);return i<0?99:i};k.sort((a,b)=>ix(a)-ix(b)||a.localeCompare(b))}else k.sort();return k.map(x=>({value:x,label:x,count:c[x]}))};
const refresh=()=>{if(MC){MC.opts=avail("category");MC.rt()}if(MP){MP.opts=avail("status");MP.rt()}if(MR){MR.opts=avail("reference");MR.rt()}};
const tabs=()=>{const T=[["all","All"],["read","Read"],["unread","Unread"],["liked","Liked"],["disliked","Disliked"]],N={all:ALL.length,read:Object.keys(READ).length,unread:ALL.length-Object.keys(READ).length,liked:Object.values(REACT).filter(r=>r&&r.type==="like").length,disliked:Object.values(REACT).filter(r=>r&&r.type==="dislike").length},el=$("tabs");el.innerHTML=T.map(([v,l])=>`<button class="${TAB===v?"on":""}" data-v="${v}"><span>${l}</span><small>${N[v]}</small></button>`).join("");el.querySelectorAll("button").forEach(b=>b.onclick=()=>{TAB=b.dataset.v;el.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.dataset.v===TAB));LOADED=0;apply()})};

function apply(){const s=F.q.toLowerCase().trim();VIEW=ALL.filter(r=>pass(r)&&(!s||[r.category,r.reference,r.memory,r.status,r.row].join(" ").toLowerCase().includes(s)));const cnt=r=>(READ[key(r)]||{}).count||0;if(F.sort==="priority")VIEW.sort((a,b)=>sm(a.status).r-sm(b.status).r);else if(F.sort==="unread")VIEW.sort((a,b)=>(cnt(a)>0)-(cnt(b)>0));else if(F.sort==="most")VIEW.sort((a,b)=>cnt(b)-cnt(a));LOADED=Math.min(PAGE,VIEW.length);if(!VIEW.length){$("out").innerHTML='<div class="state"><h3>No cards found</h3><p>Try a different search or clear filters.</p></div>';$("more").innerHTML=""}else render();info();act();tabs();badge();refresh()}

const card=(r,i,idx,tot)=>{const m=sm(r.status),k=key(r),rec=READ[k],n=rec?rec.count:0,tod=rec&&rec.lastDay===today(),rx=REACT[k],rt=r=>r?r.type:"",sh=!rec||!rec.count?'<span class="st">○ Unread</span>':tod?'<span class="st read">● Read today</span>':`<span class="st read">● Read · ${esc(fS(rec.last))}</span>`,lc=rt(rx)==="like"?"on":"",dc=rt(rx)==="dislike"?"on":"";return`<article class="card ${m.c} ${n?"rd":""}" data-key="${esc(k)}"><div class="ctop"><span class="cnum">${idx} / ${tot}</span><span class="badge ${m.c}">${esc(m.l)}</span></div><span class="ref">${esc(r.reference||"—")}</span><span class="cat">${esc(r.category||"Uncategorized")}</span><a class="mem" href="${gs(r.reference,r.memory,r.category)}" target="_blank" rel="noopener" data-key="${esc(k)}">${esc(r.memory||"")}</a><div class="bot"><div class="bl"><button class="ric like ${lc}" data-act="like" data-key="${esc(k)}">${ico("up",2.2)}</button><button class="ric dislike ${dc}" data-act="dislike" data-key="${esc(k)}">${ico("dn",2.2)}</button></div><div class="br"><span class="rc ${n?"h":""}">${eye}${n}×</span>${sh}<button class="xh" data-act="expand">${ico("chev",2.6)}</button></div></div><div class="det">${[["Position",`${idx} of ${tot}`],["Row",r.row],["Category",r.category],["Reference",r.reference],["Memory",r.memory,1],["Status",r.status],["Read count",rec?`${rec.count} day${rec.count===1?"":"s"}`:"0"],["First read",rec&&rec.first?fT(rec.first):"—"],["Last read",rec&&rec.last?fT(rec.last):"—"],["Reaction",rx?rx.type==="like"?"👍 Liked":"👎 Disliked":"—"],["Reacted at",rx&&rx.ts?fT(rx.ts):"—"]].map(([l,v,p])=>`<div class="dr"><small>${l}</small><div>${p?esc(v||""):`<strong>${esc(v||"—")}</strong>`}</div></div>`).join("")}</div></article>`};

function bind(ct){ct.querySelectorAll(".mem").forEach(a=>a.onclick=e=>{e.stopPropagation();const r=ALL.find(x=>key(x)===a.dataset.key);if(r){markRead(r);upd(a.closest(".card"),a.dataset.key);info()}});
ct.querySelectorAll(".card").forEach(el=>el.onclick=e=>{if(e.target.closest(".mem,.ric,.det,.xh"))return;const r=ALL.find(x=>key(x)===el.dataset.key);if(r){markRead(r);upd(el,el.dataset.key);info()}el.classList.toggle("open")});
ct.querySelectorAll(".xh").forEach(b=>b.onclick=e=>{e.stopPropagation();const c=b.closest(".card"),r=ALL.find(x=>key(x)===c.dataset.key);if(r){markRead(r);upd(c,c.dataset.key);info()}c.classList.toggle("open")});
["like","dislike"].forEach(t=>ct.querySelectorAll(`[data-act=${t}]`).forEach(b=>b.onclick=e=>{e.stopPropagation();e.preventDefault();const k=b.dataset.key,c=b.closest(".card"),r=ALL.find(x=>key(x)===k);if(r){markRead(r);upd(c,k);info()}setReact(k,t);updR(c,k);upd(c,k);tabs();refresh();badge()}));
ct.querySelectorAll(".det").forEach(d=>d.onclick=e=>e.stopPropagation())}

const upd=(el,k)=>{const rec=READ[k];if(!rec)return;el.classList.add("rd");const rc=el.querySelector(".rc");if(rc){rc.innerHTML=eye+rec.count+"×";rc.classList.add("h")}const st=el.querySelector(".st");if(st){st.className="st read";st.textContent=rec.lastDay===today()?"● Read today":"● Read · "+fS(rec.last)}const rows=el.querySelectorAll(".det .dr"),rx=REACT[k];if(rows.length>=11){rows[6].innerHTML=`<small>Read count</small><div><strong>${rec.count} day${rec.count===1?"":"s"}</strong></div>`;rows[7].innerHTML=`<small>First read</small><div><strong>${esc(rec.first?fT(rec.first):"—")}</strong></div>`;rows[8].innerHTML=`<small>Last read</small><div><strong>${esc(rec.last?fT(rec.last):"—")}</strong></div>`;rows[9].innerHTML=`<small>Reaction</small><div><strong>${rx?rx.type==="like"?"👍 Liked":"👎 Disliked":"—"}</strong></div>`;rows[10].innerHTML=`<small>Reacted at</small><div><strong>${esc(rx&&rx.ts?fT(rx.ts):"—")}</strong></div>`}};
const updR=(el,k)=>{const rx=REACT[k],t=rx?rx.type:"";el.querySelector('[data-act=like]')?.classList.toggle("on",t==="like");el.querySelector('[data-act=dislike]')?.classList.toggle("on",t==="dislike")};

function render(){$("out").innerHTML=VIEW.slice(0,LOADED).map((r,i)=>card(r,i,i+1,VIEW.length)).join("");bind($("out"));more();info()}
function more(){const w=$("more");if(!VIEW.length){w.innerHTML="";return}const rem=VIEW.length-LOADED;if(rem<=0){w.innerHTML=`✓ All ${VIEW.length} loaded`;return}w.innerHTML=`<div><b>${LOADED}</b> loaded · <b>${rem}</b> remaining</div><button id="lm">Load ${Math.min(PAGE,rem)} more</button>`;$("lm").onclick=()=>{const p=LOADED;LOADED=Math.min(LOADED+PAGE,VIEW.length);const f=document.createElement("div");f.style.display="contents";f.innerHTML=VIEW.slice(p,LOADED).map((r,i)=>card(r,i,p+i+1,VIEW.length)).join("");$("out").appendChild(f);bind(f);more();info()}}
function info(){const sh=Math.min(LOADED,VIEW.length),rd=VIEW.filter(r=>READ[key(r)]).length,pc=VIEW.length?Math.round(rd*100/VIEW.length):0;$("ibL").innerHTML=`<b>${sh}</b>/<b>${VIEW.length}</b>&nbsp;of&nbsp;<b>${ALL.length}</b>`;$("ibR").innerHTML=`<b class="rd">${rd}</b>/<b>${VIEW.length}</b><span class="pct ${pc?"":"z"}">${pc}% Read</span>`}
function act(){const el=$("af"),T=[];if(F.category.length||F.status.length||F.reference.length||F.sort!=="default"){F.category.forEach(c=>T.push({l:"Category: "+c,u:()=>{F.category=F.category.filter(x=>x!==c);MC.sel(F.category)}}));F.status.forEach(s=>T.push({l:"Priority: "+s,u:()=>{F.status=F.status.filter(x=>x!==s);MP.sel(F.status)}}));F.reference.forEach(r=>T.push({l:"Ref: "+r,u:()=>{F.reference=F.reference.filter(x=>x!==r);MR.sel(F.reference)}}));if(F.sort!=="default")T.push({l:"Sort: "+$("sort").selectedOptions[0].textContent,u:()=>{F.sort="default";$("sort").value="default"}});el.innerHTML="<b>Active:</b>"+T.map((t,i)=>`<span class="tag">${esc(t.l)}<b data-i="${i}">✕</b></span>`).join("");el.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{T[+b.dataset.i].u();apply()})}else el.innerHTML=""}
function build(){if(MC)MC.setOptions(avail("category"));else MC=new MSel("msC",{ph:"All Categories",sp:"Search categories…",getOptions:()=>avail("category"),on:v=>{F.category=v;apply()}});if(MP)MP.setOptions(avail("status"));else MP=new MSel("msP",{ph:"All Priority",sp:"Search priority…",getOptions:()=>avail("status"),on:v=>{F.status=v;apply()}});if(MR)MR.setOptions(avail("reference"));else MR=new MSel("msR",{ph:"All References",sp:"Search references…",getOptions:()=>avail("reference"),on:v=>{F.reference=v;apply()}});MC.rt();MP.rt();MR.rt()}
$("q").oninput=e=>{F.q=e.target.value;apply()};$("sort").onchange=e=>{F.sort=e.target.value;apply()};

let busy=false;
(async()=>{if(busy)return;busy=true;try{const r=await fetch(CSV+"&_="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const R=parseCSV(await r.text());if(R.length<2)throw Error("Sheet is empty");const H=R[0];ALL=R.slice(1).map(row=>{const o={row:"",category:"",reference:"",memory:"",status:""};H.forEach((h,i)=>{const k=norm(h);if(k in o)o[k]=(row[i]||"").trim()});return o}).filter(o=>o.memory||o.reference);build();apply()}catch(e){if(!ALL.length)$("out").innerHTML=`<div class="state"><h3>Could not load data</h3><p>${esc(e.message)}</p></div>`}finally{busy=false}})();
</script></body></html>
