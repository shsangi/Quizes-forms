<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<title>Self Learners</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
:root{--b:#0ea5e9;--d:#0284c7;--n:#0a1e3f;--l:#e2e8f0;--g:#059669;--r:#dc2626;--y:#f5b800;--bg:linear-gradient(135deg,#0ea5e9,#0284c7)}
body{background:#f4f6fa;display:flex;justify-content:center;min-height:100vh;color:#0f1419}
.w{width:100%;max-width:980px;padding:16px}
.top,.card{background:#fff;border:1px solid var(--l)}
.top{position:sticky;top:0;z-index:10;border-radius:16px;padding:10px 14px;margin-bottom:12px;box-shadow:0 8px 20px -6px rgba(10,30,63,.12);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card{border-radius:20px;padding:18px 20px;box-shadow:0 20px 40px -12px rgba(10,30,63,.18)}
.tt{font-weight:800;color:var(--n);font-size:.95rem;flex:1;min-width:120px}
.rt{display:flex;gap:6px;align-items:center}
.pill,.tmr{font-weight:800;font-size:.62rem;padding:.28rem .6rem;border-radius:9999px}
.pill{background:#e0f2fe;color:var(--d);border:1px solid #7dd3fc}
.tmr{background:var(--bg);color:#fff}
.dots{background:0;border:0;width:32px;height:32px;border-radius:50%;cursor:pointer;color:#475569;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.dots:hover{background:#f1f5f9}.dots span{width:4px;height:4px;border-radius:50%;background:currentColor}
.q{font-weight:700;font-size:1.1rem;color:var(--n);line-height:1.55;margin-bottom:16px;cursor:pointer;padding-right:22px;position:relative}
.q:hover{color:var(--d);text-decoration:underline;text-underline-offset:3px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--l);border-radius:9999px;padding:14px 18px;font-size:.95rem;font-weight:600;cursor:pointer;margin-bottom:10px;color:#0f1419}
.opt:hover:not(:disabled){background:#e0f2fe;border-color:var(--b)}.opt:disabled{cursor:default}
.k,.lt{background:#e0f2fe;color:var(--d);font-weight:800;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt.ok{background:#d1fae5;border-color:var(--g)}.opt.ok .k{background:var(--g);color:#fff}
.opt.bad{background:#fee2e2;border-color:var(--r)}.opt.bad .k{background:var(--r);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--l)}
.chip{font-size:.68rem;font-weight:700;padding:.3rem .7rem;border-radius:9999px}
.chip.subject{background:#e0f2fe;color:var(--d);border:1px solid #7dd3fc}
.chip.topic{background:#fff7dd;color:#92400e;border:1px solid #fcd34d}
.chip.job{background:var(--n);color:var(--y)}
.inv-msg{margin-top:10px;padding:10px 14px;background:#fee2e2;border:1.5px solid var(--r);border-left:5px solid var(--r);border-radius:12px;color:var(--r);font-weight:800;font-size:.85rem}
.bar{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{background:var(--bg);color:#fff;border:0;font-weight:700;font-size:.9rem;padding:.7rem 1.4rem;border-radius:9999px;cursor:pointer;box-shadow:0 4px 12px rgba(2,132,199,.25)}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn-o{background:#fff;color:var(--d);border:1.5px solid #bae6fd}
.btn-g,.dl{background:linear-gradient(135deg,#10b981,#059669)}
.load{padding:60px;text-align:center;color:#475569;font-weight:600}
.grid,.stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.dot{width:28px;height:28px;border-radius:50%;background:#f4f6fa;border:2px solid transparent;font-size:.68rem;font-weight:700;color:#94a3b8;cursor:pointer}
.dot.ok{background:var(--g);color:#fff}.dot.bad{background:var(--r);color:#fff}.dot.inv{background:var(--y);color:var(--n)}
.dot.cur{border-color:var(--d);transform:scale(1.15);box-shadow:0 0 0 3px rgba(2,132,199,.2)}
.stat{font-size:.68rem;font-weight:800;padding:.32rem .7rem;border-radius:9999px;border:1.5px solid #cbd5e1;background:#f8fafc;color:#475569}
.stat.ok{background:#d1fae5;border-color:#10b981;color:var(--g)}.stat.bad{background:#fee2e2;border-color:#fca5a5;color:var(--r)}.stat.inv{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.ov{position:fixed;inset:0;background:rgba(10,30,63,.55);backdrop-filter:blur(6px);z-index:900;opacity:0;pointer-events:none;transition:.25s}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(92vw,400px);background:#fff;z-index:901;transform:translateX(105%);transition:transform .35s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px -12px rgba(10,30,63,.35)}
.dr.on{transform:none}
.dh{padding:14px 18px;background:var(--bg);color:#fff;display:flex;justify-content:space-between;align-items:center}
.dh h3{font-size:1rem;font-weight:800;display:flex;gap:6px;align-items:baseline}
.dh .ver{font-size:.62rem;font-weight:700;opacity:.75}
.dc{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-weight:800}
.db{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.fl{font-size:.72rem;font-weight:800;color:var(--n);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:block}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.cr{display:flex;flex-wrap:wrap;gap:6px}
.mbtn{padding:.6rem .5rem;border:1.5px solid var(--l);border-radius:12px;background:#fff;cursor:pointer;font-weight:700;font-size:.78rem;color:#475569}
.mbtn.on,.cb.on{background:var(--bg);color:#fff;border-color:var(--d)}
.fi{width:100%;padding:.7rem .9rem;border:1.5px solid var(--l);border-radius:12px;font-size:.85rem;outline:0;background:#f8fafc}
.fi:focus{border-color:var(--b);background:#fff}
.cc{display:inline-flex;align-items:center;gap:4px;background:var(--b);color:#fff;font-size:.68rem;font-weight:700;padding:.25rem .55rem;border-radius:9999px}
.cc button{background:0;border:0;color:#fff;font-size:.85rem;cursor:pointer;font-weight:800}
.dd{position:relative}
.ddb{border:1.5px solid var(--l);border-radius:12px;padding:.55rem .7rem;min-height:42px;cursor:pointer;display:flex;align-items:center;font-size:.82rem;font-weight:600;color:#475569}
.ddb:hover{border-color:var(--b)}
.ar{margin-left:auto;font-size:.6rem;color:#94a3b8}.dd.on .ar{transform:rotate(180deg)}
.ddm{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--l);border-radius:12px;box-shadow:0 16px 40px -10px rgba(10,30,63,.25);max-height:280px;overflow:hidden;padding:.35rem;z-index:10;display:none;flex-direction:column}
.dd.on .ddm{display:flex}
.ds{padding:.4rem .5rem .35rem;border-bottom:1px solid var(--l);margin-bottom:.3rem}
.ds input{width:100%;border:1.5px solid var(--l);border-radius:8px;padding:.45rem .65rem;font-size:.78rem;outline:0;background:#f8fafc}
.ds input:focus{border-color:var(--b);background:#fff}
.ddl{overflow-y:auto;max-height:200px;display:flex;flex-direction:column;gap:1px}
.ddi{padding:.5rem .7rem;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:.5rem}
.ddi:hover{background:#e0f2fe;color:var(--d)}.ddi.sel{background:var(--b);color:#fff}
.ck{width:16px;height:16px;border:1.5px solid #cbd5e1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0}
.ddi.sel .ck{background:#fff;color:var(--d);border-color:#fff}
.dde{padding:.8rem;text-align:center;font-size:.78rem;color:#94a3b8;font-style:italic}
.cb{padding:.5rem .85rem;border:1.5px solid var(--l);border-radius:9999px;background:#fff;cursor:pointer;font-weight:700;font-size:.78rem;color:#475569}
.cb:hover{border-color:var(--b);color:var(--d)}
.cb.inv.on{background:linear-gradient(135deg,#f5b800,#d99e00);border-color:#d99e00;color:var(--n)}
.cb.vf.on{background:#059669;border-color:#047857}.cb.nvf.on{background:#dc2626;border-color:#991b1b}
.drow{display:flex;gap:8px;margin-top:4px}
.dl{flex:1;padding:.85rem;border:0;border-radius:9999px;font-weight:800;font-size:.9rem;color:#fff;cursor:pointer}
.drs{padding:.85rem 1rem;border:1.5px solid var(--l);border-radius:9999px;font-weight:800;font-size:.9rem;color:#475569;background:#fff;cursor:pointer}
.drs:hover{border-color:var(--r);color:var(--r);background:#fee2e2}
.list{display:flex;flex-direction:column;gap:.75rem;margin-top:14px}
.li{background:#f8fafc;border:1.5px solid var(--l);border-left:4px solid var(--b);border-radius:14px;padding:.85rem 1rem;position:relative;cursor:pointer}
.li:hover{background:#e0f2fe;border-left-color:var(--y)}.li.fact{border-left-color:var(--y)}
.lq{font-weight:700;color:var(--n);font-size:.9rem;line-height:1.5;padding-right:1.4rem}
.sn{background:var(--b);color:#fff;font-weight:800;font-size:.68rem;padding:2px 8px;border-radius:9999px;margin-right:.5rem;display:inline-block}
.lo{margin-top:.5rem;display:flex;flex-direction:column;gap:.3rem}
.lop{display:flex;gap:.4rem;font-size:.82rem;line-height:1.5;padding:.4rem .6rem;background:#fff;border:1px solid var(--l);border-radius:8px;color:#475569}
.lop .lt{width:22px;height:22px;font-size:.68rem}
.lop.ok{background:#d1fae5;border-color:var(--g);color:#065f46;font-weight:700}.lop.ok .lt{background:var(--g);color:#fff}
.lm{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.3rem;font-size:.64rem;font-weight:700}
.mc{padding:.2rem .55rem;border-radius:9999px;background:#fff;border:1px solid var(--l);color:#475569}
.ms{background:#e0f2fe;color:var(--d)}.mt{background:#fff7dd;color:#92400e}.mj{background:var(--n);color:var(--y)}
.ans{margin-top:.5rem;padding-top:.5rem;border-top:1px dashed var(--l);font-size:.83rem;color:#047857;font-weight:600}
.vfy,.qvfy{position:absolute;width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#fff}
.vfy{top:6px;right:6px;box-shadow:0 0 0 1.5px #fff}.qvfy{top:2px;right:0}
.ncard{background:#f8fafc;border:1.5px solid var(--l);border-radius:14px;padding:12px 14px 10px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:7px;cursor:pointer}
.ncard:hover{border-color:var(--b)}
.ncard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#94a3b8}
.ncard.vimp::before{background:var(--r)}.ncard.imp::before{background:var(--y)}.ncard.note::before{background:var(--b)}
.ncard.rd{background:#d1fae5;border-color:var(--g)}.ncard.rd::before{background:var(--g)}
.ncard.open{border-color:var(--b)}
.ncard .ctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ncard .cnum{padding:0 6px;height:18px;line-height:16px;border-radius:6px;background:#e2e8f0;color:#64748b;font-size:.6rem;font-weight:800;font-family:monospace}
.ncard .refrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ncard .nref{padding:3px 9px;border-radius:6px;background:#e0f2fe;border:1px solid #7dd3fc;color:var(--d);font-size:.68rem;font-weight:800}
.ncard .ncat{font-size:.58rem;letter-spacing:.06em;font-weight:800;background:#fff;border:1px solid var(--l);color:#64748b;padding:3px 8px;border-radius:6px;text-transform:uppercase}
.ncard .nbadge{padding:3px 8px;border-radius:99px;font-size:.58rem;font-weight:800;border:1px solid;text-transform:uppercase}
.ncard .nbadge.vimp{color:var(--r);background:#fee2e2;border-color:#fca5a5}
.ncard .nbadge.imp{color:#92400e;background:#fef3c7;border-color:#fcd34d}
.ncard .nbadge.note{color:var(--d);background:#e0f2fe;border-color:#7dd3fc}
.ncard .nbadge.other{color:#64748b;background:#e2e8f0;border-color:#cbd5e1}
.ncard .nmem{font-size:.9rem;font-weight:600;color:var(--n);line-height:1.55;padding:7px 9px;margin:-2px -3px;border-radius:8px;word-break:break-word;cursor:pointer}
.ncard .nmem:hover{background:#e0f2fe}
.ncard .nbot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px;border-top:1px dashed var(--l);min-height:32px}
.ncard .nric{width:32px;height:32px;border-radius:8px;border:1px solid var(--l);background:#fff;color:#64748b;cursor:pointer;display:grid;place-items:center;padding:0;font-size:14px}
.ncard .nric:hover{border-color:var(--b)}
.ncard .nric.like.on{background:#d1fae5;border-color:var(--g);color:var(--g)}
.ncard .nric.dislike.on{background:#fee2e2;border-color:var(--r);color:var(--r)}
.ncard .nst{font-size:.64rem;font-weight:700;color:#94a3b8}
.ncard .nst.read{color:var(--g)}
.ncard .nrc{padding:2px 8px;border-radius:99px;background:#e2e8f0;font-size:.62rem;color:#64748b;font-weight:800}
.ncard .nrc.h{background:#d1fae5;color:var(--g);border:1px solid #10b981}
.ncard .nxh{width:32px;height:32px;border-radius:8px;background:0;border:0;color:#94a3b8;cursor:pointer;font-size:14px}
.ncard .nxh:hover{color:var(--b);background:#e0f2fe}.ncard.open .nxh{color:var(--b);transform:rotate(180deg)}
.ncard .ndet{display:none;padding-top:10px;border-top:1px solid var(--l);margin-top:8px}
.ncard.open .ndet{display:block}
.ncard .ndr{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:6px 0;font-size:.8rem;color:#475569}
.ncard .ndr small{font-size:.6rem;font-weight:800;text-transform:uppercase;color:#94a3b8}
.ncard .ndr strong{color:var(--n)}
.ninfo{display:flex;justify-content:space-between;gap:8px;padding:8px 4px 12px;color:#475569;font-size:.7rem;font-weight:600;flex-wrap:wrap}
.ninfo b{color:var(--n)}.ninfo .pct{padding:2px 8px;margin-left:6px;border-radius:99px;background:#e0f2fe;color:var(--d);font-weight:800;font-size:.66rem}
.nmore{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 0 8px;font-size:.72rem;color:#64748b;text-align:center;font-weight:600}
.nmore button{padding:11px 22px;background:var(--bg);border:0;color:#fff;border-radius:10px;font-size:.84rem;font-weight:700;cursor:pointer}
[hidden]{display:none!important}
</style></head>
<body>
<div class="w">
<div class="top"><div class="tt" id="tt">Loading…</div><div class="rt"><span class="pill" id="cnt">0/0</span><span class="tmr" id="tmr">00:00</span><button class="dots" id="dotsBtn"><span></span><span></span><span></span></button></div></div>
<div class="card"><div id="bd"><div class="load">🔄 Loading…</div></div><div class="grid" id="gd"></div><div class="stats" id="st"></div></div>
</div>
<div class="ov" id="ov"></div><aside class="dr" id="dr"></aside>

<script>
const V='v4.5';
const U='https://docs.google.com/spreadsheets/d/e/2PACX-1vQyB_I39SsLmQC5C8O1KkzZEUgFPAIJQ95k0vFj9M-HX8vI9hsdLh0GFYYO8O1QFnvP4vWkAh3nmbd3/pub?output=csv',
UF='https://docs.google.com/spreadsheets/d/e/2PACX-1vTRO-FPemOqN9exgEgDyt_x1KfNgTAxf0mOeg16c7THfRaaHg0mbgwuTrObcbIwJKSx2dWtrQCNcrCV/pub?output=csv',
UN='https://docs.google.com/spreadsheets/d/e/2PACX-1vTR3op0RZuTMJ-HegiLJYV18VR97DAnZpcUPRWwMYRfr5pVVf_x6ZOYMfiS8aXIJQcTh2hHpsgqJ8ks/pub?output=csv';
const PG=200;
let all=[],qs=[],ans=[],cur=0,time=0,tmr,total=0,pick=20,inv=0,mode='mcq',facts=[],fl=[],fp,fOK=0,fPick=20,fV='all';
let notes=[],nOK=0,np,nView=[],nLoad=0,nRead={},nR={},nTab='all',nSort='def',nF={cat:[],st:[]},nLim=20;
const S={job:new Set,subject:new Set,topic:new Set},Q={job:'',subject:'',fsubject:'',ftopic:''};
const $=i=>document.getElementById(i);
const cl=s=>String(s??'').replace(/[\u200B-\u200D\uFEFF\u00A0]/g,' ').replace(/\s+/g,' ').trim();
const nk=s=>cl(s).toLowerCase();
const TC=s=>cl(s).replace(/(^|\s)\S/g,m=>m.toUpperCase());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>{a=[...a];for(let i=a.length;i>1;){let j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const isSp=o=>/all\s+of\s+(the\s+)?above|none\s+of\s+(the\s+)?above|above\s+all|\bboth\b|^\s*none\s*$|all\s+of\s+these/i.test(cl(o));
const shufOpts=(o,ci)=>{const free=shuf([...o.keys()].filter(i=>!isSp(o[i]))),order=o.map(x=>isSp(x)?free.shift():null);o.forEach((x,i)=>{if(order[i]===null)order[i]=free.pop()});return{opts:order.map(i=>o[i]),correct:ci<0?-1:order.indexOf(ci)}};
const shufCat=l=>{const b={};l.forEach(x=>(b[[x.job,x.subject,x.topic].map(nk).join('|')]??=[]).push(x));return shuf(Object.values(b)).flatMap(g=>shuf(g))};
const findC=(raw,o)=>{const r=cl(raw);if(!r)return-1;const i=o.findIndex(x=>cl(x)===r);return i>=0?i:/^[A-Da-d]$/.test(r)?'abcd'.indexOf(r.toLowerCase()):/^[1-4]$/.test(r)?+r-1:-1};
const pCSV=l=>{const r=[];let c='',q=0;for(let i=0;i<l.length;i++){const h=l[i];if(q){if(h=='"'){l[i+1]=='"'?(c+='"',i++):q=0}else c+=h}else if(h=='"')q=1;else if(h==','){r.push(cl(c));c=''}else c+=h}r.push(cl(c));return r};
const mark=(s,f)=>document.querySelectorAll(s).forEach(b=>b.classList.toggle('on',f(b)));
const vfy=(v,c='vfy')=>`<span class="${c}" style="background:${{t:'var(--b)',f:'var(--r)'}[v]||'#94a3b8'}">${{t:'✔',f:'✘'}[v]||'?'}</span>`;
const meta=(o,x)=>o.map(([k,e,c])=>x[k]?`<span class="mc ${c}">${e} ${esc(TC(x[k]))}</span>`:'').join('');
const gs=a=>open('https://www.google.com/search?q='+encodeURIComponent(a.filter(Boolean).join(' ')),'_blank');
const qSearch=x=>gs([x.q,x.opts.map((o,i)=>`${'ABCD'[i]}) ${o}`).join(' '),...[['topic','Topic'],['subject','Subject'],['job','Job']].map(([k,l])=>x[k]&&`${l}: ${x[k]}`)]);
const off=()=>(300+new Date().getTimezoneOffset())*6e4,p2=n=>String(n).padStart(2,'0');
const dk=t=>{const d=new Date(t+off());return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`},today=()=>dk(Date.now());
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fT=t=>{if(!t)return'';const d=new Date(t+off());let h=d.getHours(),a=h>=12?'PM':'AM';h=h%12||12;return`${DY[d.getDay()]}, ${MN[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}, ${p2(h)}:${p2(d.getMinutes())}:${p2(d.getSeconds())} ${a}`};
const fS=t=>{if(!t)return'';const d=new Date(t+off());let h=d.getHours(),a=h>=12?'PM':'AM';h=h%12||12;return`${d.getDate()} ${MN[d.getMonth()]}, ${p2(h)}:${p2(d.getMinutes())} ${a}`};
const sm=raw=>{const l=cl(raw).toLowerCase().replace(/\s+/g,'');return['v.imp','vimp','veryimportant','v.important'].includes(l)?{c:'vimp',l:'Very Imp',r:0}:['imp','important'].includes(l)?{c:'imp',l:'Important',r:1}:['note','notes'].includes(l)?{c:'note',l:'Note',r:2}:{c:'other',l:cl(raw)||'—',r:3}};
const NK=r=>r._k;

// ---- Generic menu builder (used by jobs/subjects/topics/categories/status) ----
function buildMenu(mountId,titleId,chipsId,srcM,sel,search,label,onPick){
  const q=nk(search);
  const items=[...srcM].sort((a,b)=>a[1].localeCompare(b[1])).filter(([k,v])=>!q||nk(v).includes(q));
  const row=(v,t)=>{const on=v?sel.has(v):!sel.size;return `<div class="ddi${on?' sel':''}" data-v="${v}"><span class="ck">${on?'✓':''}</span>${t}</div>`};
  $(mountId).innerHTML=items.length?row('',label)+items.map(e=>row(...e)).join(''):'<div class="dde">'+(q?'No matches':'No options')+'</div>';
  $(titleId).textContent=sel.size?`${sel.size} selected`:label;
  $(chipsId).innerHTML=[...sel].map(v=>`<span class="cc">${srcM.get(v)||v} <button data-v="${v}">×</button></span>`).join('');
}
function menu(k){
  const s=k=='job'?S.job:k=='subject'?S.subject:S.topic;
  const m=k=='job'?mapOf(all,'job'):k=='subject'?mapOf(S.job.size?all.filter(x=>S.job.has(nk(x.job))):all,'subject'):mapOf(facts,k=='ftopic'?'topic':'subject');
  [...s].forEach(v=>m.has(v)||s.delete(v));
  buildMenu(k+'m',k+'t',k+'c',m,s,Q[k],k=='job'?'All jobs':k=='subject'?'All subjects':k=='ftopic'?'All topics':'All subjects');
}
const mapOf=(a,f)=>{const m=new Map;a.forEach(x=>{const r=cl(x[f]);r&&!m.has(nk(r))&&m.set(nk(r),TC(r))});return m};

    const t=await(await fetch(U+'&_t='+Date.now(),{cache:'no-store'})).text();
    all=t.split('\n').filter(l=>l.trim()).slice(1).map(pCSV).filter(c=>c.length>=9&&c[1]&&!['0','false','no'].includes((c[13]||'').toLowerCase()))
      .map(c=>{const o=[2,3,4,5].map(i=>c[i]||'');return{q:c[1],opts:o,correct:findC(c[6],o),topic:c[7]||'',subject:c[8]||'',job:c[10]||'',mcol:c[12]||''}});

  }catch(e){console.error(e);bd.innerHTML='<div class="load">❌ Failed to load</div>'}

const loadFacts=()=>fp??=(async()=>{
  try{
    const L=(await(await fetch(UF+'&_t='+Date.now(),{cache:'no-store'})).text()).split('\n').filter(l=>l.trim());
    const H=pCSV(L[0]||'').map(h=>h.toLowerCase());
    const fi=(kw,fb)=>{const k=H.findIndex(h=>kw.some(w=>h.includes(w)));return k<0?fb:k};
    const [qi,ai,ti,si,vi]=[fi(['question'],1),fi(['answer'],2),fi(['topic'],3),fi(['subject'],4),fi(['verify','correct'],5)];
    facts=L.slice(1).map(pCSV).filter(c=>c[qi]).map(c=>{const v=(c[vi]||'').toLowerCase();return{q:c[qi],answer:c[ai]||'',topic:c[ti]||'',subject:c[si]||'',verify:['true','yes','1'].includes(v)?'t':['false','no','0'].includes(v)?'f':'u'}});
  }catch(e){console.error(e);fp=null}
  fOK=1;
})();
const loadNotes=()=>np??=(async()=>{
  try{
    const r=await fetch(UN+'&_t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    const t=await r.text();const L=t.split('\n').filter(l=>l.trim());
    if(L.length<2)throw new Error('Empty');
    const H=pCSV(L[0]||'').map(h=>h.toLowerCase().trim().replace(/\s+/g,' ').replace(/\.$/,''));
    const HM={'row':'row','s no':'row','sr no':'row','sno':'row','cat':'category','ref':'reference','one-line memory':'memory','one line memory':'memory','one-liner':'memory','oneliner':'memory','mcq status':'status','mcqstatus':'status','mcq_status':'status'};
    const idx=(kw,fb)=>{for(let k=0;k<H.length;k++){const h=HM[H[k]]||H[k];if(kw.includes(h))return k}return fb};
    const ri=idx(['row'],0),ci=idx(['category'],1),rfi=idx(['reference'],2),mi=idx(['memory'],3),sti=idx(['status'],4);
    notes=L.slice(1).map(pCSV).filter(r=>r.some(c=>c&&c.trim())).map(r=>({row:cl(r[ri]||''),category:cl(r[ci]||''),reference:cl(r[rfi]||''),memory:cl(r[mi]||''),status:cl(r[sti]||'')})).filter(o=>o.memory||o.reference);
    notes.forEach((r,i)=>r._k=(cl(r.category)||'')+'||'+(cl(r.reference)||'')+'|'+i);
    nLoad=0;
  }catch(e){console.error('Notes:',e);notes=[]}
  nOK=1;
})();

// ---- Notes render ----
const nPass=r=>{
  if(nF.cat.length&&!nF.cat.includes(cl(r.category)||'Uncategorized'))return false;
  if(nF.st.length&&!nF.st.includes(cl(r.status)||'—'))return false;
  if(nTab!=='all'){const k=NK(r),rd=nRead[k],rx=nR[k];
    if(nTab==='read'&&!rd)return false;if(nTab==='unread'&&rd)return false;
    if(nTab==='liked'&&!(rx&&rx.type==='like'))return false;
    if(nTab==='disliked'&&!(rx&&rx.type==='dislike'))return false}
  return true;
};
function nApply(){
  nView=notes.filter(nPass);
  const cnt=r=>((nRead[NK(r)]||{}).count)||0;
  if(nSort==='prio')nView.sort((a,b)=>sm(a.status).r-sm(b.status).r);
  else if(nSort==='unread')nView.sort((a,b)=>(cnt(a)>0)-(cnt(b)>0));
  else if(nSort==='most')nView.sort((a,b)=>cnt(b)-cnt(a));
  nLoad=nLim||nView.length;renderNotes();
}
function renderNotes(){
  clearInterval(tmr);$('gd').innerHTML=$('st').innerHTML='';$('tmr').style.display='none';
  $('tt').textContent='📔 Notes';
  if(!nOK){bd.innerHTML='<div class="load">🔄 Loading notes…</div>';return loadNotes().then(()=>{if(mode=='notes'){buildNoteMenus();nApply()}})}

}
function renderNoteList(from){
  const wrap=$('nList'),to=Math.min(from+(nLim||PG),nView.length),frag=document.createElement('div');frag.style.display='contents';
  for(let i=from;i<to;i++)frag.innerHTML+=nCard(nView[i],i+1,nView.length);
  wrap.appendChild(frag);nLoad=to;bindNotes(frag);
  const more=$('nMore');
  if(to>=nView.length)more.innerHTML=`✓ All ${nView.length} loaded`;
  else{more.innerHTML=`<div><b>${to}</b> loaded · <b>${nView.length-to}</b> remaining</div><button id="nMoreBtn">Load more</button>`;$('nMoreBtn').onclick=()=>renderNoteList(to)}
}
function nCard(r,idx,tot){
  const m=sm(r.status),k=NK(r),rec=nRead[k],n=rec?rec.count:0,tod=rec&&rec.lastDay===today(),rx=nR[k];
  const sh=!rec?'<span class="nst">○ Unread</span>':tod?'<span class="nst read">● Read today</span>':`<span class="nst read">● Read · ${esc(fS(rec.last))}</span>`;
  const lc=rx&&rx.type==='like'?'on':'',dc=rx&&rx.type==='dislike'?'on':'';
  const rows=[['Position',`${idx} of ${tot}`],['Row',r.row],['Category',r.category],['Reference',r.reference],['Memory',r.memory,1],['Status',r.status],
    ['Read count',rec?`${rec.count} day${rec.count===1?'':'s'}`:'0'],['First read',rec&&rec.first?fT(rec.first):'—'],
    ['Last read',rec&&rec.last?fT(rec.last):'—'],['Reaction',rx?rx.type==='like'?'👍 Liked':'👎 Disliked':'—'],['Reacted at',rx&&rx.ts?fT(rx.ts):'—']];
  return `<article class="ncard ${m.c} ${n?'rd':''}" data-key="${esc(k)}">
  <div class="ctop"><span class="cnum">${idx} / ${tot}</span><span class="nbadge ${m.c}">${esc(m.l)}</span></div>
  <div class="refrow"><span class="nref">${esc(r.reference||'—')}</span><span class="ncat">${esc(r.category||'Uncategorized')}</span></div>
  <div class="nmem" data-key="${esc(k)}">${esc(r.memory||'')}</div>
  <div class="nbot"><div style="display:flex;gap:6px"><button class="nric like ${lc}" data-act="like" data-key="${esc(k)}">👍</button><button class="nric dislike ${dc}" data-act="dislike" data-key="${esc(k)}">👎</button></div>
  <div style="display:flex;gap:6px;align-items:center"><span class="nrc ${n?'h':''}">👁 ${n}×</span>${sh}<button class="nxh" data-act="expand">▾</button></div></div>
  <div class="ndet">${rows.map(([l,v,p])=>`<div class="ndr"><small>${l}</small><div>${p?esc(v||''):`<strong>${esc(v||'—')}</strong>`}</div></div>`).join('')}</div></article>`;
}
const nMarkRead=r=>{const k=NK(r),now=Date.now(),dn=dk(now);let rec=nRead[k];if(!rec)rec={count:1,first:now,last:now,lastDay:dn};else{if(rec.lastDay!==dn)rec.count++;rec.last=now;rec.lastDay=dn}nRead[k]=rec};
const nReactSet=(k,t)=>{const c=nR[k];if(c&&c.type===t)delete nR[k];else nR[k]={type:t,ts:Date.now()}};
function nUpd(el,k){
  const rec=nRead[k];if(!rec)return;el.classList.add('rd');
  const rc=el.querySelector('.nrc');if(rc){rc.innerHTML='👁 '+rec.count+'×';rc.classList.add('h')}
  const st=el.querySelector('.nst');if(st){st.className='nst read';st.textContent=rec.lastDay===today()?'● Read today':'● Read · '+fS(rec.last)}
  const rows=el.querySelectorAll('.ndet .ndr'),rx=nR[k];
  if(rows.length>=11){
    const upd=(i,html)=>rows[i].innerHTML=html;
    upd(6,`<small>Read count</small><div><strong>${rec.count} day${rec.count===1?'':'s'}</strong></div>`);
    upd(7,`<small>First read</small><div><strong>${esc(rec.first?fT(rec.first):'—')}</strong></div>`);
    upd(8,`<small>Last read</small><div><strong>${esc(rec.last?fT(rec.last):'—')}</strong></div>`);
    upd(9,`<small>Reaction</small><div><strong>${rx?rx.type==='like'?'👍 Liked':'👎 Disliked':'—'}</strong></div>`);
    upd(10,`<small>Reacted at</small><div><strong>${esc(rx&&rx.ts?fT(rx.ts):'—')}</strong></div>`);
  }
}
function bindNotes(scope){
  scope.querySelectorAll('.nmem').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const r=notes.find(x=>NK(x)===el.dataset.key);
    if(r){nMarkRead(r);nUpd(el.closest('.ncard'),el.dataset.key);gs([r.reference,r.memory,r.category])}
  });
  scope.querySelectorAll('.ncard').forEach(el=>el.onclick=e=>{
    if(e.target.closest('.nmem,.nric,.ndet,.nxh'))return;
    const r=notes.find(x=>NK(x)===el.dataset.key);
    if(r){nMarkRead(r);nUpd(el,el.dataset.key)}el.classList.toggle('open')
  });
  scope.querySelectorAll('.nxh').forEach(b=>b.onclick=e=>{
    e.stopPropagation();const c=b.closest('.ncard'),r=notes.find(x=>NK(x)===c.dataset.key);
    if(r){nMarkRead(r);nUpd(c,c.dataset.key)}c.classList.toggle('open')
  });
  ['like','dislike'].forEach(t=>scope.querySelectorAll(`[data-act=${t}]`).forEach(b=>b.onclick=e=>{
    e.stopPropagation();e.preventDefault();
    const k=b.dataset.key,c=b.closest('.ncard'),r=notes.find(x=>NK(x)===k);
    if(r){nMarkRead(r);nUpd(c,k)}nReactSet(k,t);
    const rx=nR[k],tt=rx?rx.type:'';
    c.querySelector('[data-act=like]')?.classList.toggle('on',tt==='like');
    c.querySelector('[data-act=dislike]')?.classList.toggle('on',tt==='dislike');
    nUpd(c,k);
  }));
  scope.querySelectorAll('.ndet').forEach(d=>d.onclick=e=>e.stopPropagation());
}

// ---- MCQs / Facts ----
function apply(){
  $('tmr').style.display=mode=='mcq'?'':'none';
  if(mode=='facts')return renderFacts();
  if(mode=='notes')return nApply();
  const q=$('sq').value.trim().toLowerCase();
  let L=inv?all.filter(x=>x.correct<0):all.filter(x=>
    (!S.job.size||S.job.has(nk(x.job)))&&(!S.subject.size||S.subject.has(nk(x.subject)))&&
    (!q||[x.q,x.subject,x.topic,x.job,...x.opts].some(s=>s.toLowerCase().includes(q))));
  L=shufCat(L);if(pick)L=L.slice(0,pick);
  qs=L.map(x=>({...x,...shufOpts(x.opts,x.correct)}));
  total=qs.length;ans=Array(total).fill(null);cur=0;time=total*60;clearInterval(tmr);
  if(mode=='solved'){$('tt').textContent='📖 Solved';$('cnt').textContent=total+' items';$('gd').innerHTML=$('st').innerHTML='';return renderSolved()}
  $('tt').textContent=inv?'⚠️ Invalid Questions':S.job.size?`${S.job.size} Job(s) MCQs`:'All Jobs MCQs';
  $('cnt').textContent='0/'+total;
  if(total){tmr=setInterval(tick,1000);tick()}
  go(0,1);
}
function tick(){$('tmr').textContent=`${String(time/60|0).padStart(2,'0')}:${String(time%60).padStart(2,'0')}`;if(time<=0)return end();time--}
function go(i,s){cur=i;render();grid();stats();s&&scrollTo({top:0,behavior:'smooth'})}
function render(){
  const x=qs[cur];if(!x)return bd.innerHTML='<div class="load">No questions match filters</div>';
  const I=x.correct<0,d=ans[cur]!=null||I,last=cur==total-1;
  bd.innerHTML=`<div class="q" data-qi="${cur}">${vfy(x.mcol?'t':'u','qvfy')}${cur+1}. ${x.q}</div>`+
    x.opts.map((o,i)=>`<button class="opt${d&&!I?(i==x.correct?' ok':i==ans[cur]?' bad':''):''}" data-i="${i}" ${d?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${esc(o)||'(Empty)'}</span></button>`).join('')+
    (d&&(x.subject||x.topic||x.job)?`<div class="chips">${[['subject','📚'],['topic','🏷️'],['job','💼']].map(([k,e])=>x[k]?`<span class="chip ${k}">${e} ${TC(x[k])}</span>`:'').join('')}</div>`:'')+
    (I?'<div class="inv-msg">⚠️ Invalid — correct answer not in options</div>':'')+
    `<div class="bar"><button class="btn btn-o" id="pv" ${cur?'':'disabled'}>◀ Back</button><button class="btn${last?' btn-g':''}" id="nx">${last?'🏁 Finish':'Next ▶'}</button></div>`;
}
function grid(){$('gd').innerHTML=qs.map((x,i)=>`<button class="dot${x.correct<0?' inv':ans[i]!=null?(ans[i]==x.correct?' ok':' bad'):''}${i==cur?' cur':''}" data-i="${i}">${i+1}</button>`).join('')}
function stats(){let k=0,w=0,p=0,v=0;qs.forEach((x,i)=>x.correct<0?v++:ans[i]==null?p++:ans[i]==x.correct?k++:w++);
  $('st').innerHTML=`<span class="stat ok">🎯 Correct <span class="n">${k}</span></span><span class="stat bad">❌ Wrong <span class="n">${w}</span></span><span class="stat">⏳ Pending <span class="n">${p}</span></span>`+(v?`<span class="stat inv">⚠️ Invalid <span class="n">${v}</span></span>`:'')}
function end(){clearInterval(tmr);const r=qs.filter((x,i)=>ans[i]===x.correct).length,p=total?Math.round(r/total*100):0;
  bd.innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:3rem;margin-bottom:8px">${r==total?'🌟':p>=70?'👏':'💪'}</div><div style="font-size:2.6rem;font-weight:900;color:#0284c7">${r} / ${total}</div><div style="color:#475569;margin:10px 0 20px;font-weight:600">${r==total?'Perfect score!':p>=70?'Great job!':'Keep practicing!'} — ${p}%</div><button class="btn" onclick="location.reload()">⟳ Try again</button></div>`;
  $('gd').innerHTML=$('st').innerHTML=''}
function renderSolved(){
  if(!qs.length)return bd.innerHTML='<div class="load">No questions match filters</div>';
  bd.innerHTML='<div class="list">'+qs.map((x,i)=>
    `<div class="li" data-qi="${i}">${vfy(x.mcol?'t':'u')}<div class="lq"><span class="sn">${i+1}</span>${esc(x.q)}</div>
    <div class="lo">${x.opts.map((o,j)=>`<div class="lop${j==x.correct?' ok':''}"><span class="lt">${'ABCD'[j]}</span><span>${esc(o)||'(Empty)'}</span></div>`).join('')}</div>${meta(MQ,x)?`<div class="lm">${meta(MQ,x)}</div>`:''}</div>`
  ).join('')+'</div>'}
function renderFacts(){
  clearInterval(tmr);$('gd').innerHTML=$('st').innerHTML='';$('tt').textContent='💡 Facts';
  if(!fOK){bd.innerHTML='<div class="load">🔄 Loading facts…</div>';return loadFacts().then(()=>{if(mode=='facts'){menus();renderFacts()}})}
  const q=$('sq').value.trim().toLowerCase();
  fl=facts.filter(f=>(!S.subject.size||S.subject.has(nk(f.subject)))&&(!S.topic.size||S.topic.has(nk(f.topic)))&&
    (!q||[f.q,f.answer,f.subject,f.topic].some(s=>s.toLowerCase().includes(q)))&&
    (fV=='t'?f.verify=='t':fV=='f'?f.verify!='t':1));
  if(fPick)fl=fl.slice(0,fPick);
  $('cnt').textContent=fl.length+' facts';
  if(!fl.length)return bd.innerHTML='<div class="load">No facts match</div>';
  bd.innerHTML='<div class="list">'+fl.map((f,i)=>
    `<div class="li fact" data-fi="${i}">${vfy(f.verify)}<div class="lq"><span class="sn">${i+1}</span>${esc(f.q)}</div>
    <div class="ans"><strong>Answer:</strong> ${esc(f.answer)||'—'}</div>${meta(MF,{...f,topic:f.topic!==f.subject?f.topic:''})?`<div class="lm">${meta(MF,{...f,topic:f.topic!==f.subject?f.topic:''})}</div>`:''}</div>`
  ).join('')+'</div>'}

// ---- Drawer click handling ----
dr.addEventListener('click',e=>{
  e.stopPropagation();
  const t=e.target,c=s=>t.closest(s);
  const dd=c('.dd');
  dr.querySelectorAll('.dd.on').forEach(x=>x!=dd&&x.classList.remove('on'));
  if(c('.ddb'))dd?.classList.toggle('on');
  const it=c('.ddi,.cc button');
  if(it){
    const sec=c('[data-k]'),nSec=c('.no .ddi,.no .cc button');
    if(sec){const s=K(sec.dataset.k),v=it.dataset.v;!v?s.clear():s.has(v)?s.delete(v):s.add(v);menu(sec.dataset.k)}
    if(nSec){
      const v=it.dataset.v,parent=it.closest('.dd'),key=parent.id==='ncatD'?'cat':'st',set=nF[key];
      set.includes(v)?set.splice(set.indexOf(v),1):set.push(v);
      buildNoteMenus();if(mode==='notes')nApply();
    }
    return;
  }
  if(c('#cr .cb')){setPick(+c('#cr .cb').dataset.n);return}
  if(c('#fr [data-n]')){setFPick(+c('#fr [data-n]').dataset.n);return}
  if(c('#fr [data-v]')){const v=c('#fr [data-v]').dataset.v;setFV(fV==v?'all':v);return}
  if(c('#nTabC .cb')){setNTab(c('#nTabC .cb').dataset.tab);if(mode==='notes')nApply();return}
  if(c('#nSortC .cb')){setNSort(c('#nSortC .cb').dataset.sort);if(mode==='notes')nApply();return}
  if(c('#nLimC .cb')){setNLim(+c('#nLimC .cb').dataset.lim);if(mode==='notes')nApply();return}
  const m=c('.mbtn');
  if(m){
    mode=m.dataset.m;mark('.mbtn',b=>b.dataset.m==mode);sync();
    if(mode=='facts')loadFacts().then(()=>{menus();apply()});
    else if(mode=='notes')loadNotes().then(()=>{buildNoteMenus();apply()});
    else{menus();apply()}
    return;
  }
  if(c('#dc')){tgl(0);return}
  if(c('#lb')){apply();tgl(0);return}
  if(c('#rb')){
    Object.values(S).forEach(s=>s.clear());
    Object.keys(Q).forEach(k=>Q[k]='');
    dr.querySelectorAll('.ds input').forEach(i=>i.value='');
    nF={cat:[],st:[]};setNTab('all');setNSort('def');setNLim(20);
    $('sq').value='';setPick(20);setFPick(20);setFV('all');
    buildNoteMenus();menus();
    return;
  }
});
const K=k=>k=='job'?S.job:k=='subject'?S.subject:S.topic;

// ---- Document click handling ----
document.addEventListener('click',e=>{
  const t=e.target;
  if(t===ov){tgl(0);return}
  if(t.closest('#dotsBtn')){tgl(1);return}
  if(dr.contains(t))return;
  if(!bd.contains(t))return;
  const c=s=>t.closest(s);
  const o=c('.opt');
  if(o&&!o.disabled){ans[cur]=+o.dataset.i;$('cnt').textContent=ans.filter(a=>a!=null).length+'/'+total;go(cur);return}
  if(mode==='mcq'||mode==='solved'){const q=c('.q,.li[data-qi]');if(q)qSearch(qs[+q.dataset.qi])}
  if(mode==='facts'){const f=c('.li[data-fi]');if(f){const x=fl[+f.dataset.fi];gs([x.q,x.subject&&`Subject: ${x.subject}`,x.topic&&`Topic: ${x.topic}`])}}
  if(c('#pv'))go(cur-1);
  if(c('#nx'))cur==total-1?end():go(cur+1);
  if(c('.dot'))go(+c('.dot').dataset.i,1);
});

// ---- Search input dispatch ----
document.addEventListener('input',e=>{
  const t=e.target,c=s=>t.closest(s);
  const ds=c('.ds input');
  if(ds){
    const k=ds.id.replace(/s$/,'');
    if(k==='ncat'||k==='nst')buildNoteMenus();
    else{Q[k]=ds.value;menu(k)}
    return;
  }
  if(t.id==='sq'){
    if(mode==='notes')nApply();else if(mode==='facts')renderFacts();else apply();
  }
});

setPick(20);setFPick(20);setFV('all');setNTab('all');setNSort('def');setNLim(20);sync();load();
</script>
</body></html>
