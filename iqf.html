<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0ea5e9">
  <title>Self Learners · MCQs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
    body{background:#f4f6fa;display:flex;justify-content:center;min-height:100vh;color:#0f1419}
    .wrap{width:100%;max-width:920px;padding:16px}
    .top{position:sticky;top:0;z-index:10;background:#fff;border:1px solid #e2e8f0;
         border-radius:16px;padding:12px 16px;margin-bottom:12px;
         box-shadow:0 8px 20px -6px rgba(10,30,63,.12);display:flex;
         justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .title{font-weight:800;color:#0a1e3f;font-size:1rem}
    .pill{background:#e0f2fe;color:#0284c7;font-weight:800;font-size:.72rem;
          padding:.35rem .75rem;border-radius:9999px;border:1px solid #7dd3fc}
    .timer{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;
           font-weight:800;font-size:.72rem;padding:.35rem .75rem;border-radius:9999px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;
          padding:22px;box-shadow:0 20px 40px -12px rgba(10,30,63,.18)}
    .q{font-weight:700;font-size:1.1rem;color:#0a1e3f;line-height:1.55;margin-bottom:16px}
    .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
         background:#fff;border:1.5px solid #e2e8f0;border-radius:9999px;
         padding:14px 18px;font-size:.95rem;font-weight:600;cursor:pointer;
         margin-bottom:10px;font-family:inherit;transition:all .15s;color:#0f1419}
    .opt:hover:not(:disabled){background:#e0f2fe;border-color:#0ea5e9}
    .opt .k{background:#e0f2fe;color:#0284c7;font-weight:800;width:28px;height:28px;
            border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .opt.ok{background:#d1fae5;border-color:#059669}
    .opt.ok .k{background:#059669;color:#fff}
    .opt.bad{background:#fee2e2;border-color:#dc2626}
    .opt.bad .k{background:#dc2626;color:#fff}
    .opt:disabled{cursor:default}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:14px;
           border-top:1px dashed #e2e8f0}
    .chip{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;
          padding:.3rem .7rem;border-radius:9999px}
    .chip.subject{background:#e0f2fe;color:#0284c7;border:1px solid #7dd3fc}
    .chip.topic{background:#fff7dd;color:#92400e;border:1px solid #fcd34d}
    .chip.job{background:#0a1e3f;color:#f5b800}
    .invalid-msg{margin-top:10px;padding:10px 14px;background:#fee2e2;
                 border:1.5px solid #dc2626;border-left:5px solid #dc2626;
                 border-radius:12px;color:#dc2626;font-weight:800;
                 font-size:.85rem;display:flex;align-items:center;gap:8px}
    .bar{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
         background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border:none;
         font-weight:700;font-size:.9rem;padding:.7rem 1.4rem;border-radius:9999px;
         cursor:pointer;font-family:inherit;transition:all .15s;
         box-shadow:0 4px 12px rgba(2,132,199,.25)}
    .btn:active{transform:scale(.96)}
    .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
    .btn-outline{background:#fff;color:#0284c7;border:1.5px solid #bae6fd;
                 box-shadow:0 2px 8px rgba(2,132,199,.08)}
    .btn-outline:hover:not(:disabled){background:#f0f9ff}
    .btn-green{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 12px rgba(5,150,105,.3)}
    .btn svg{width:18px;height:18px;flex-shrink:0}
    .load{padding:60px;text-align:center;color:#475569;font-weight:600}
    .grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
    .dot{width:28px;height:28px;border-radius:50%;background:#f4f6fa;border:2px solid transparent;
         font-size:.68rem;font-weight:700;color:#94a3b8;display:flex;align-items:center;
         justify-content:center;cursor:pointer;font-family:inherit;transition:transform .15s}
    .dot:hover{transform:scale(1.12)}
    .dot.ok{background:#059669;color:#fff}
    .dot.bad{background:#dc2626;color:#fff}
    .dot.inv{background:#f5b800;color:#0a1e3f}
    .dot.cur{border-color:#0284c7;transform:scale(1.2);box-shadow:0 0 0 3px rgba(2,132,199,.2)}
    .end-wrap{display:flex;justify-content:center;margin-top:16px;padding-top:16px;
              border-top:1px solid #e2e8f0}
    .stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
    .stat{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:800;
          padding:.32rem .7rem;border-radius:9999px;border:1.5px solid;background:#fff}
    .stat .n{font-weight:900;font-size:.75rem}
    .stat.ok{background:#d1fae5;border-color:#10b981;color:#059669}
    .stat.bad{background:#fee2e2;border-color:#fca5a5;color:#dc2626}
    .stat.pend{background:#f8fafc;border-color:#cbd5e1;color:#475569}
    .stat.inv{background:#fef3c7;border-color:#fcd34d;color:#92400e}
    .result-icon{font-size:3rem;margin-bottom:8px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title" id="title">Loading…</div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="pill" id="count">0/0</span>
      <span class="timer" id="timer">00:00</span>
    </div>
  </div>

  <div class="card">
    <div id="body"><div class="load">🔄 Loading questions…</div></div>
    <div class="grid" id="grid"></div>
    <div class="end-wrap" id="endWrap"></div>
    <div class="stats" id="stats"></div>
  </div>
</div>

<script>
const QUIZ_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQyB_I39SsLmQC5C8O1KkzZEUgFPAIJQ95k0vFj9M-HX8vI9hsdLh0GFYYO8O1QFnvP4vWkAh3nmbd3/pub?output=csv';
let qs=[],ans=[],cur=0,time=0,timer=null,total=0,invalidSet=new Set();

const $=id=>document.getElementById(id);
const clean=s=>String(s??'').replace(/[\u200B-\u200D\uFEFF\u00A0]/g,' ').replace(/\s+/g,' ').trim();
const parseCSV=l=>{const r=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];
  if(q){if(ch==='"'&&l[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}
  else{if(ch==='"')q=true;else if(ch===','){r.push(clean(c));c=''}else c+=ch}}
  r.push(clean(c));return r};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const findCorrect=(raw,opts)=>{if(!raw)return -1;const r=clean(raw);
  for(let i=0;i<opts.length;i++)if(clean(opts[i])===r)return i;
  if(/^[A-Da-d]$/.test(r))return 'abcd'.indexOf(r.toLowerCase());
  if(/^[1-4]$/.test(r))return +r-1;return -1};
const titleCase=s=>!s?'':clean(s).split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');

// Detect special "fixed position" options
const SPECIAL_PATTERNS=[
  /all\s+of\s+(the\s+)?above/i,
  /none\s+of\s+(the\s+)?above/i,
  /above\s+all/i,
  /\bboth\b/i,
  /^\s*none\s*$/i,
  /all\s+of\s+these/i
];
const isSpecial=o=>{const t=clean(o);return t&&SPECIAL_PATTERNS.some(p=>p.test(t))};

// Shuffle options — keep special ones at their original index
function shuffleOptionsKept(opts){
  const fixed={};   // index -> option text (must stay)
  const free=[];    // {text, originalIndex} — can move
  opts.forEach((o,i)=>{
    if(isSpecial(o)) fixed[i]=o;
    else free.push({text:o,idx:i});
  });
  const shuffled=shuffle(free);
  const result=new Array(opts.length);
  // place fixed first
  Object.keys(fixed).forEach(k=>{result[+k]=fixed[k]});
  // fill remaining slots in order
  let p=0;
  for(let i=0;i<result.length;i++){
    if(result[i]===undefined) result[i]=shuffled[p++].text;
  }
  return result;
}

// Group-wise shuffle: Job → Subject → Topic, shuffled inside each group
function shuffleByCategory(list){
  // bucket by job|subject|topic
  const buckets=new Map();
  list.forEach(item=>{
    const key=[item.job||'',item.subject||'',item.topic||''].join('|||');
    if(!buckets.has(key)) buckets.set(key,[]);
    buckets.get(key).push(item);
  });
  // shuffle bucket order
  const keys=shuffle([...buckets.keys()]);
  const out=[];
  keys.forEach(k=>{
    const group=shuffle(buckets.get(k));
    out.push(...group);
  });
  return out;
}

async function load(){
  try{
    const r=await fetch(QUIZ_URL+'&_t='+Date.now(),{cache:'no-store'});
    const text=await r.text();
    const lines=text.split('\n').filter(l=>l.trim());
    let raw=[];
    for(let i=1;i<lines.length;i++){
      const c=parseCSV(lines[i]);
      if(c.length<9||!c[1])continue;
      const show=(c[13]||'').toLowerCase();
      if(show==='0'||show==='false'||show==='no')continue;
      const opts=[c[2]||'',c[3]||'',c[4]||'',c[5]||''].map(clean);
      const correct=findCorrect(c[6],opts);
      raw.push({q:c[1],opts,correct,subject:c[8]||'',topic:c[7]||'',job:c[10]||''});
    }

    // 1) Group-wise shuffle by Job → Subject → Topic
    let ordered=shuffleByCategory(raw);

    // 2) Shuffle options (keeping special ones pinned)
    qs=ordered.map(x=>{
      const newOpts=shuffleOptionsKept(x.opts);
      // Recompute correct index by matching text
      const correctText=x.opts[x.correct];
      const newCorrect=correctText!==undefined
        ? newOpts.findIndex(o=>clean(o)===clean(correctText))
        : -1;
      return {...x,opts:newOpts,correct:newCorrect};
    });

    qs.forEach((x,i)=>{if(x.correct===-1)invalidSet.add(i)});
    total=qs.length;ans=Array(total).fill(null);time=total*60;cur=0;
    $('title').textContent='All Jobs MCQs';
    $('count').textContent='0/'+total;
    startTimer();render();grid();renderEnd();stats();
  }catch(e){
    console.error(e);
    $('body').innerHTML='<div class="load">❌ Failed to load</div>';
  }
}

function startTimer(){
  clearInterval(timer);
  timer=setInterval(()=>{
    time--;const m=Math.floor(time/60),s=time%60;
    $('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    if(time<=0){clearInterval(timer);end()}
  },1000);
}

function stats(){
  let ok=0,bad=0,pend=0,inv=0;
  for(let i=0;i<total;i++){
    if(invalidSet.has(i)){inv++;continue}
    if(ans[i]===null){pend++;continue}
    if(ans[i]===qs[i].correct)ok++;else bad++;
  }
  let h='';
  h+=`<span class="stat ok">🎯 Correct <span class="n">${ok}</span></span>`;
  h+=`<span class="stat bad">❌ Wrong <span class="n">${bad}</span></span>`;
  h+=`<span class="stat pend">⏳ Pending <span class="n">${pend}</span></span>`;
  if(inv>0)h+=`<span class="stat inv">⚠️ Invalid <span class="n">${inv}</span></span>`;
  $('stats').innerHTML=h;
}

function render(){
  const x=qs[cur];if(!x)return;
  const isInv=invalidSet.has(cur);
  const done=ans[cur]!==null||isInv;
  const letters=['A','B','C','D'];
  let h=`<div class="q">${cur+1}. ${x.q}</div>`;
  x.opts.forEach((o,i)=>{
    let cls='opt';
    if(done && !isInv){
      if(i===x.correct)cls+=' ok';
      else if(i===ans[cur])cls+=' bad';
    }
    h+=`<button class="${cls}" data-i="${i}" ${done?'disabled':''}>
      <span class="k">${letters[i]}</span><span>${o||'(Empty)'}</span></button>`;
  });

  if(done && (x.subject||x.topic||x.job)){
    h+='<div class="chips">';
    if(x.subject)h+=`<span class="chip subject">📚 ${titleCase(x.subject)}</span>`;
    if(x.topic)h+=`<span class="chip topic">🏷️ ${titleCase(x.topic)}</span>`;
    if(x.job)h+=`<span class="chip job">💼 ${titleCase(x.job)}</span>`;
    h+='</div>';
  }

  if(isInv){
    h+=`<div class="invalid-msg">⚠️ Invalid question — correct answer not found in options</div>`;
  }

  h+=`<div class="bar">
    <button class="btn btn-outline" id="prev" ${cur===0?'disabled':''}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>
    <button class="btn" id="next" ${cur===total-1?'disabled':''}>
      Next
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>`;
  $('body').innerHTML=h;

  if(!isInv){
    $('body').querySelectorAll('.opt:not([disabled])').forEach(b=>{
      b.onclick=()=>{
        ans[cur]=+b.dataset.i;
        $('count').textContent=(ans.filter(a=>a!==null).length)+'/'+total;
        render();grid();stats();
      };
    });
  }
  $('prev')&&($('prev').onclick=()=>{cur--;render();grid();stats()});
  $('next')&&($('next').onclick=()=>{cur++;render();grid();stats()});
}

function renderEnd(){
  $('endWrap').innerHTML=`
    <button class="btn btn-green" id="end">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
      End Quiz
    </button>`;
  $('end').onclick=end;
}

function grid(){
  let h='';
  qs.forEach((x,i)=>{
    let c='dot';
    if(invalidSet.has(i))c+=' inv';
    else if(ans[i]!==null)c+=(ans[i]===x.correct?' ok':' bad');
    if(i===cur)c+=' cur';
    h+=`<button class="${c}" data-i="${i}">${i+1}</button>`;
  });
  $('grid').innerHTML=h;
  $('grid').querySelectorAll('.dot').forEach(d=>{
    d.onclick=()=>{cur=+d.dataset.i;render();grid();stats();scrollTo({top:0,behavior:'smooth'})};
  });
}

function end(){
  clearInterval(timer);
  const right=qs.filter((x,i)=>ans[i]===x.correct).length;
  const pct=Math.round((right/total)*100);
  let icon,msg;
  if(right===total){icon='🌟';msg='Perfect score!';}
  else if(pct>=70){icon='👏';msg='Great job!';}
  else{icon='💪';msg='Keep practicing!';}
  $('body').innerHTML=`
    <div style="text-align:center;padding:20px">
      <div class="result-icon">${icon}</div>
      <div style="font-size:2.6rem;font-weight:900;color:#0284c7">${right} / ${total}</div>
      <div style="color:#475569;margin:10px 0 20px;font-weight:600">
        ${msg} — ${pct}% correct
      </div>
      <button class="btn" onclick="location.reload()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Try again
      </button>
    </div>`;
  $('grid').innerHTML='';
  $('endWrap').innerHTML='';
  $('stats').innerHTML='';
}

load();
</script>
</body>
</html>
