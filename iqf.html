<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0f"><title>My Notes</title>
<style>
:root{--bg:#0a0b0f;--s:#16181f;--s2:#1c1f28;--b:#252832;--b2:#333847;--t:#eceef3;--t2:#9498a5;--t3:#6a6f7e;--br:#0ea5e9;--bs:rgba(14,165,233,.14);--bb:rgba(14,165,233,.32);--bt:#7dd3fc;--ok:#22c55e;--okb:rgba(34,197,94,.11);--er:#ef4444;--erb:rgba(239,68,68,.11);--wa:#f59e0b;--wab:rgba(245,158,11,.11);--in:#38bdf8;--inb:rgba(56,189,248,.11);--mb:rgba(148,152,165,.09);--sh:0 20px 40px -12px rgba(0,0,0,.55);color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f5f8fc;--s:#fff;--s2:#eef4fb;--b:#dde6f1;--b2:#c3d2e3;--t:#0a1520;--t2:#4a5b6e;--t3:#7a8b9e;--br:#0284c7;--bs:rgba(2,132,199,.09);--bb:rgba(2,132,199,.24);--bt:#0284c7;--ok:#16a34a;--okb:rgba(22,163,74,.09);--er:#dc2626;--erb:rgba(220,38,38,.09);--wa:#d97706;--wab:rgba(217,119,6,.09);--in:#0284c7;--inb:rgba(2,132,199,.09);--mb:rgba(90,95,110,.08);--sh:0 20px 40px -12px rgba(15,23,42,.25);color-scheme:light}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:16px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
svg{width:1em;height:1em;flex-shrink:0;pointer-events:none}
button,select,input{font:inherit;color:inherit}
.shell{max-width:1100px;margin:0 auto;padding:0 14px}
.bar{display:grid;grid-template-columns:1fr 50px;gap:8px;margin-top:14px}
.bar input,.bar button,.fp select,.ms summary,.ms-m input{background:var(--s);border:1.5px solid var(--b);border-radius:12px;outline:0;padding:0 14px;height:48px;font-size:.9rem}
.bar input:focus,.fp select:focus{border-color:var(--br)}
.bar button{position:relative;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--t2)}
.bar button.on{background:var(--br);border-color:var(--br);color:#fff}
.bar svg{width:18px;height:18px}
#bc{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:99px;background:var(--br);color:#fff;font:700 .64rem monospace;display:none;place-items:center}
.fp{display:none;margin:8px 0;padding:12px;background:var(--s);border:1px solid var(--b);border-radius:14px;gap:10px;flex-direction:column}
.fp.show{display:flex}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.fp select{width:100%;height:42px;font-size:.86rem;background:var(--bg)}
.ms{position:relative}.ms[open]{z-index:50}
.ms summary{height:42px;display:flex;align-items:center;cursor:pointer;list-style:none;font-size:.86rem;background:var(--bg);color:var(--t3)}
.ms summary.has{color:var(--bt);border-color:var(--bb);font-weight:600}
.ms summary::-webkit-details-marker{display:none}
.ms-m{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--s);border:1px solid var(--b2);border-radius:12px;box-shadow:var(--sh);padding:5px}
.ms-m input{width:100%;height:36px;font-size:.82rem;margin-bottom:4px}
.ms-l{max-height:min(300px,55vh);overflow-y:auto}
.opt{display:flex;gap:8px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.84rem;color:var(--t2)}
.opt:hover{background:var(--s2)}.opt.on{background:var(--bs);color:var(--bt)}.opt.off{opacity:.4}
.opt span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt i{font:normal .7rem monospace;color:var(--t3);padding:1px 6px;background:var(--mb);border-radius:99px}
.opt.on::before{content:"✓"}
.rab{padding:11px;border-radius:10px;background:var(--erb);border:1px solid var(--er);color:var(--er);font-weight:700;font-size:.82rem;cursor:pointer}
.rab:disabled{opacity:.4}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:3px;background:var(--s);border:1px solid var(--b);border-radius:11px}
.tabs button{padding:8px 2px;background:0;border:0;border-radius:8px;color:var(--t2);font-size:.7rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.tabs small{font:.58rem monospace;opacity:.7}
.tabs .on{background:var(--br);color:#fff}
.info{display:flex;justify-content:space-between;gap:8px;padding:10px 4px;color:var(--t3);font:.7rem monospace;flex-wrap:wrap}
.info b{color:var(--t2)}.info .pct{margin-left:6px;padding:1px 6px;border-radius:99px;background:var(--bs);color:var(--bt);font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.more{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 0 8px;font-size:.72rem;color:var(--t3)}
.more button{padding:11px 22px;background:var(--br);border:0;color:#fff;border-radius:10px;font-weight:600;cursor:pointer}
.card{--c:var(--b2);background:var(--s);border:1px solid var(--b);border-radius:11px;padding:12px 14px 10px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:7px;cursor:pointer}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.card.vimp{--c:var(--er)}.card.imp{--c:var(--wa)}.card.note{--c:var(--in)}
.card.rd{background:color-mix(in srgb,var(--okb) 55%,var(--s))}
.card.open{border-color:var(--br)}
.top,.bot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bot{padding-top:8px;border-top:1px dashed var(--b)}
.bot>div{display:flex;gap:6px;align-items:center}
.num,.badge,.rc,.st{font:700 .6rem monospace;white-space:nowrap}
.num{padding:1px 6px;border-radius:6px;background:var(--mb);color:var(--t3)}
.badge{padding:3px 8px;border-radius:99px;text-transform:uppercase;border:1px solid color-mix(in srgb,currentColor 35%,transparent)}
.badge.vimp{color:var(--er);background:var(--erb)}.badge.imp{color:var(--wa);background:var(--wab)}.badge.note{color:var(--in);background:var(--inb)}.badge.other{color:var(--t3);background:var(--mb)}
.ref,.cat{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:6px;padding:3px 9px;font-weight:700}
.ref{background:var(--bs);border:1px solid var(--bb);color:var(--bt);font-size:.66rem}
.cat{background:var(--s2);border:1px solid var(--b2);color:var(--t2);font-size:.58rem;text-transform:uppercase;letter-spacing:.06em}
.mem{display:-webkit-box;-webkit-line-clamp:20;-webkit-box-orient:vertical;overflow:hidden;font-size:.9rem;font-weight:500;color:var(--t);padding:7px 9px;margin:-2px -3px;border-radius:8px;text-decoration:none;word-break:break-word}
.mem:hover{background:var(--bs)}
.ric,.xh{width:34px;height:34px;border-radius:8px;border:1px solid var(--b);background:var(--s2);color:var(--t2);cursor:pointer;display:grid;place-items:center;padding:0}
.xh{border:0;background:0;color:var(--t3)}
.ric svg,.xh svg{width:16px;height:16px}
.ric.like.on{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.ric.dislike.on{background:var(--erb);border-color:var(--er);color:var(--er)}
.card.open .xh svg{transform:rotate(180deg)}
.rc{padding:2px 8px;border-radius:99px;background:var(--mb);display:inline-flex;align-items:center;gap:4px;color:var(--t3)}
.rc.h,.st.read{color:var(--ok)}.st{color:var(--t3)}
.det{display:none;padding-top:10px;border-top:1px solid var(--b);margin-top:8px}
.card.open .det{display:block}
.dr{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:6px 0;font-size:.8rem;color:var(--t2)}
.dr+.dr{border-top:1px solid var(--b)}
.dr small{font-size:.6rem;font-weight:700;text-transform:uppercase;color:var(--t3);padding-top:3px}
.state{padding:60px 20px;text-align:center;color:var(--t3)}.state h3{color:var(--t)}
footer{margin:40px 0 20px;padding-top:20px;border-top:1px solid var(--b);text-align:center;color:var(--t3);font-size:.74rem}
.fabs{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:80}
.fabs button{width:42px;height:42px;border-radius:12px;border:1px solid var(--b2);background:var(--s);color:var(--t2);box-shadow:var(--sh);font-size:18px;display:none}
.fabs .show{display:block}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--s);border:1px solid var(--b2);padding:11px 18px;border-radius:10px;font-size:.82rem;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.25s;z-index:500}
.toast.show{opacity:1}
</style></head><body>
<div class="shell">
<div class="bar"><input id="q" type="search" placeholder="Search rules, sections, memory…" autocomplete="off"><button id="ft" aria-label="Filters"><span id="fti"></span><span id="bc">0</span></button></div>
<div class="fp" id="fp">
<div class="row"><div id="category"></div><div id="status"></div></div>
<div class="row"><div id="reference"></div><select id="sort"><option value="default">Default order</option><option value="priority">Priority first</option><option value="unread">Unread first</option><option value="most">Most read first</option></select></div>
<button class="rab" id="rab">Reset all filters</button>
<div class="tabs" id="tabs"></div>
</div>
<div class="info"><div id="iL">Loading…</div><div id="iR"></div></div>
<div class="list" id="out"><div class="state">Fetching memory cards…</div></div>
<div class="more" id="more"></div>
<footer>Data · Google Sheets · Times in Pakistan Standard Time (UTC+5)</footer>
</div>
<div class="fabs"><button id="bot">⌄</button><button id="topb">⌃</button></div>
<div class="toast" id="toast"></div>
<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTR3op0RZuTMJ-HegiLJYV18VR97DAnZpcUPRWwMYRfr5pVVf_x6ZOYMfiS8aXIJQcTh2hHpsgqJ8ks/pub?output=csv",PAGE=200,TZ="Asia/Karachi";
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const fT=t=>t?new Date(t).toLocaleString("en-US",{timeZone:TZ,weekday:"short",month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"}):"—";
const fS=t=>new Date(t).toLocaleString("en-GB",{timeZone:TZ,day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:true});
const dk=t=>new Date(t).toLocaleDateString("en-CA",{timeZone:TZ}),today=()=>dk(Date.now());
const P={eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',chev:'<polyline points="6 9 12 15 18 9"/>',filter:'<path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>',up:'<path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>',dn:'<path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/>'};
const ico=(n,w=2)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
$("fti").innerHTML=ico("filter",2.4);

let ALL=[],VIEW=[],LOADED=0,READ={},REACT={},TAB="all",M=new Map();
const F={q:"",status:[],category:[],reference:[],sort:"default"},FIELDS=["category","status","reference"],PH={category:"All Categories",status:"All Priority",reference:"All References"};
const val=(r,f)=>String(r[f]||"").trim(),key=r=>val(r,"category")+"||"+val(r,"reference");
let tt;const toast=m=>{const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2400)};
addEventListener("scroll",()=>{const m=document.documentElement.scrollHeight-innerHeight;$("topb").classList.toggle("show",scrollY>300);$("bot").classList.toggle("show",scrollY<m-300&&m>300)},{passive:true});
$("topb").onclick=()=>scrollTo({top:0,behavior:"smooth"});$("bot").onclick=()=>scrollTo({top:1e9,behavior:"smooth"});

const parseCSV=t=>{const R=[];let r=[],f="",q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'&&t[i+1]=='"'){f+='"';i++}else if(c=='"')q=0;else f+=c}else if(c=='"')q=1;else if(c==","){r.push(f);f=""}else if(c=="\n"){r.push(f);R.push(r);r=[];f=""}else if(c!="\r")f+=c}if(f||r.length){r.push(f);R.push(r)}return R.filter(r=>r.some(c=>c.trim()))};
const HM={"row":"row","s no":"row","sr no":"row","sno":"row","cat":"category","ref":"reference","one-line memory":"memory","one line memory":"memory","one-liner":"memory","oneliner":"memory","mcq status":"status","mcqstatus":"status","mcq_status":"status"};
const norm=h=>{h=String(h||"").trim().toLowerCase().replace(/\s+/g," ").replace(/\.$/,"");return HM[h]||h};
const sm=raw=>{const l=String(raw||"").trim().toLowerCase().replace(/\s+/g,"");return["v.imp","vimp","veryimportant","v.important"].includes(l)?{c:"vimp",l:"Very Imp",r:0}:["imp","important"].includes(l)?{c:"imp",l:"Important",r:1}:["note","notes"].includes(l)?{c:"note",l:"Note",r:2}:{c:"other",l:raw||"—",r:3}};
const markRead=r=>{const k=r._k,n=Date.now(),d=dk(n),x=READ[k];READ[k]=x?{...x,count:x.count+(x.lastDay!==d?1:0),last:n,lastDay:d}:{count:1,first:n,last:n,lastDay:d}};
const react=(k,v)=>{REACT[k]?.type===v?delete REACT[k]:REACT[k]={type:v,ts:Date.now()}};

const tabOk=r=>{const k=r._k,t=REACT[k]?.type;return TAB=="all"||(TAB=="liked"?t=="like":TAB=="disliked"?t=="dislike":TAB=="read"?!!READ[k]:!READ[k])};
const pass=(r,ig)=>tabOk(r)&&FIELDS.every(f=>f===ig||!F[f].length||F[f].includes(val(r,f)));
const counts=f=>{const c={};ALL.forEach(r=>{const v=val(r,f);if(v&&pass(r,f))c[v]=(c[v]||0)+1});F[f].forEach(x=>{if(!(x in c))c[x]=0});const o=["V.Imp","Imp","Note"],ix=x=>{const i=o.indexOf(x);return i<0?99:i};return Object.keys(c).sort(f==="reference"?(a,b)=>(c[b]-c[a])||a.localeCompare(b):f==="status"?(a,b)=>ix(a)-ix(b)||a.localeCompare(b):undefined).map(v=>[v,c[v]])};

function ms(f){const el=$(f);el.innerHTML=`<details class="ms"><summary></summary><div class="ms-m"><input placeholder="Search…"><div class="ms-l"></div></div></details>`;const sum=el.querySelector("summary"),inp=el.querySelector("input"),list=el.querySelector(".ms-l");
 const draw=()=>{const q=inp.value.toLowerCase();sum.textContent=F[f].length?`${PH[f]} (${F[f].length})`:PH[f];sum.classList.toggle("has",!!F[f].length);
  list.innerHTML=counts(f).filter(([v])=>v.toLowerCase().includes(q)).map(([v,n])=>`<div class="opt ${F[f].includes(v)?"on":""} ${n||F[f].includes(v)?"":"off"}" data-v="${esc(v)}"><span>${esc(v)}</span><i>${n}</i></div>`).join("")||'<div class="state" style="padding:14px">No matches</div>'};
 inp.oninput=draw;list.onclick=e=>{const o=e.target.closest(".opt");if(!o||o.classList.contains("off"))return;const v=o.dataset.v;F[f]=F[f].includes(v)?F[f].filter(x=>x!==v):[...F[f],v];apply()};
 el.draw=draw;draw()}
document.addEventListener("click",e=>document.querySelectorAll(".ms[open]").forEach(d=>d.contains(e.target)||d.removeAttribute("open")));

const nF=()=>!!F.q+F.category.length+F.status.length+F.reference.length+(F.sort!=="default");
function apply(){const s=F.q.toLowerCase().trim(),c=r=>READ[r._k]?.count||0;
 VIEW=ALL.filter(r=>pass(r)&&(!s||Object.values(r).join(" ").toLowerCase().includes(s)));
 if(F.sort==="priority")VIEW.sort((a,b)=>sm(a.status).r-sm(b.status).r);else if(F.sort==="unread")VIEW.sort((a,b)=>(c(a)>0)-(c(b)>0));else if(F.sort==="most")VIEW.sort((a,b)=>c(b)-c(a));
 LOADED=Math.min(PAGE,VIEW.length);
 $("out").innerHTML=VIEW.length?VIEW.slice(0,LOADED).map((r,i)=>card(r,i+1)).join(""):'<div class="state"><h3>No cards found</h3><p>Try a different search or clear filters.</p></div>';
 more();info();tabs();FIELDS.forEach(f=>$(f).draw());
 const n=nF();$("bc").textContent=n;$("bc").style.display=n?"grid":"none";$("rab").disabled=!n;$("ft").classList.toggle("on",n>0||$("fp").classList.contains("show"))}

const card=(r,idx)=>{const m=sm(r.status),k=r._k,rec=READ[k],n=rec?.count||0,rx=REACT[k],tot=VIEW.length;
 const st=!rec?'<span class="st">○ Unread</span>':`<span class="st read">● ${rec.lastDay===today()?"Read today":"Read · "+fS(rec.last)}</span>`;
 const rows=[["Position",`${idx} of ${tot}`],["Row",r.row],["Category",r.category],["Reference",r.reference],["Memory",r.memory],["Status",r.status],["Read count",rec?`${n} day${n==1?"":"s"}`:"0"],["First read",rec?fT(rec.first):"—"],["Last read",rec?fT(rec.last):"—"],["Reaction",rx?rx.type==="like"?"👍 Liked":"👎 Disliked":"—"],["Reacted at",rx?fT(rx.ts):"—"]];
 return`<article class="card ${m.c} ${n?"rd":""}" data-key="${esc(k)}" data-i="${idx}"><div class="top"><span class="num">${idx} / ${tot}</span><span class="badge ${m.c}">${esc(m.l)}</span></div><span class="ref">${esc(r.reference||"—")}</span><span class="cat">${esc(r.category||"Uncategorized")}</span><a class="mem" href="https://www.google.com/search?q=${encodeURIComponent([r.reference,r.memory,r.category].filter(Boolean).join(" "))}" target="_blank" rel="noopener">${esc(r.memory)}</a><div class="bot"><div><button class="ric like ${rx?.type==="like"?"on":""}" data-act="like">${ico("up",2.2)}</button><button class="ric dislike ${rx?.type==="dislike"?"on":""}" data-act="dislike">${ico("dn",2.2)}</button></div><div><span class="rc ${n?"h":""}">${ico("eye")}${n}×</span>${st}<button class="xh">${ico("chev",2.6)}</button></div></div><div class="det">${rows.map(([l,v])=>`<div class="dr"><small>${l}</small><div>${esc(v||"—")}</div></div>`).join("")}</div></article>`};

$("out").onclick=e=>{const c=e.target.closest(".card");if(!c||e.target.closest(".det"))return;const r=M.get(c.dataset.key);if(!r)return;const a=e.target.closest("[data-act]")?.dataset.act,link=e.target.closest(".mem");
 markRead(r);if(a)react(c.dataset.key,a);
 const open=a?!c.classList.contains("open"):c.classList.contains("open");
 const t=document.createElement("div");t.innerHTML=card(r,+c.dataset.i);const n=t.firstChild;n.classList.toggle("open",open);c.replaceWith(n);info();if(a)tabs()};

function more(){const w=$("more"),rem=VIEW.length-LOADED;w.innerHTML=!VIEW.length?"":rem<=0?`✓ All ${VIEW.length} loaded`:`<div><b>${LOADED}</b> loaded · <b>${rem}</b> remaining</div><button id="lm">Load ${Math.min(PAGE,rem)} more</button>`;
 if($("lm"))$("lm").onclick=()=>{const p=LOADED;LOADED=Math.min(p+PAGE,VIEW.length);$("out").insertAdjacentHTML("beforeend",VIEW.slice(p,LOADED).map((r,i)=>card(r,p+i+1)).join(""));more();info()}}
function info(){const rd=VIEW.filter(r=>READ[r._k]).length,pc=VIEW.length?Math.round(rd*100/VIEW.length):0;
 $("iL").innerHTML=`<b>${Math.min(LOADED,VIEW.length)}</b>/<b>${VIEW.length}</b> of <b>${ALL.length}</b>`;$("iR").innerHTML=`<b style="color:var(--br)">${rd}</b>/<b>${VIEW.length}</b><span class="pct">${pc}% Read</span>`}
function tabs(){const rx=t=>Object.values(REACT).filter(r=>r.type===t).length,R=Object.keys(READ).length,N={all:ALL.length,read:R,unread:ALL.length-R,liked:rx("like"),disliked:rx("dislike")};
 $("tabs").innerHTML=Object.keys(N).map(v=>`<button class="${TAB===v?"on":""}" data-v="${v}"><span>${v[0].toUpperCase()+v.slice(1)}</span><small>${N[v]}</small></button>`).join("")}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){TAB=b.dataset.v;apply()}};

$("q").oninput=e=>{F.q=e.target.value;apply()};$("sort").onchange=e=>{F.sort=e.target.value;apply()};
$("ft").onclick=()=>{$("fp").classList.toggle("show");apply()};
$("rab").onclick=()=>{Object.assign(F,{q:"",status:[],category:[],reference:[],sort:"default"});$("q").value="";$("sort").value="default";apply();toast("Filters cleared.")};

(async()=>{try{const r=await fetch(CSV+"&_="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const R=parseCSV(await r.text());if(R.length<2)throw Error("Sheet is empty");

 ALL.forEach((r,i)=>{r._k=key(r)+"|"+i;M.set(r._k,r)});FIELDS.forEach(ms);apply()}catch(e){$("out").innerHTML=`<div class="state"><h3>Could not load data</h3><p>${esc(e.message)}</p></div>`}})();
