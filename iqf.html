                if (!forceRefresh && !isGuest) {
                    const saved = loadState();
                    if (saved) {
                        questions = saved.questions;
                        originalQuestions = saved.originalQuestions || saved.questions.map((q) => ({ ...q }));
                        total = saved.total || questions.length;
                        answers = saved.answers || new Array(questions.length).fill(null);
                        status = saved.status || new Array(questions.length).fill(null);
                        locked = saved.locked || new Array(questions.length).fill(false);
                        submitted = saved.submitted || false;
                        finished = saved.finished || false;
                        score = saved.score || 0;
                        currentQ = saved.currentQ || 0;
                        timeLeft = saved.timeLeft || total * 60;
                        selJobs = saved.selJobs || [];
                        selSubjs = saved.selSubjs || [];
                        invalidQs = saved.invalidQs || [];
                        updateAvailableSubjects();
                        applyQuizTitle();
                        renderSelectedSubjectsLine();
                        ui.tot.textContent = total;
                        ui.att.textContent = attemptedCount();
                        ui.refresh.disabled = false;
                        ui.refreshIcon.textContent = '⚙️';
                        ui.refreshIcon.classList.remove('refresh-spin');
                        updateTimerDisplay();
                        if (finished) { showResult(); return; }
                        resetToQuizView();
                        startTimer();
                        renderQuestion();
                        renderDots();
                        updateOverview();
                        if (mode === 'read') renderReadMode();
                        if (mode === 'facts') renderFactsMode();
                        return;
                    }
                }
                if (forceRefresh) { clearSavedState(); if (timerHandle) clearInterval(timerHandle); }
                fetch(withCacheBust(QUIZ_URL), { cache: 'no-store', headers: noCacheHeaders() })
                    .then((r) => r.text())
                    .then((text) => {
                        const lines = text.split('\n').filter((l) => l.trim());
                        originalQuestions = [];
                        for (let i = 1; i < lines.length; i++) {
                            const cols = parseCSVLine(lines[i]);
                            if (cols.length < 9) continue;
                            const qText = cols[1] ? cols[1].trim() : '';
                            if (!qText) continue;
                            const options = [cols[2] || '', cols[3] || '', cols[4] || '', cols[5] || ''].map((x) => x.trim());
                            const rawCorrect = cols[6] ? cols[6].trim() : '';
                            const correctIdx = resolveCorrectIndex(rawCorrect, options);
                            const showFlag = cols[13] ? cols[13].trim().toLowerCase() : '';
                            if (showFlag === '0' || showFlag === 'false' || showFlag === 'no') continue;
                            originalQuestions.push({
                                question: qText,
                                options,
                                correct: correctIdx,
                                correctText: rawCorrect || 'No answer',
                                topic: cols[7] || '',
                                subject: cols[8] || '',
                                job: cols[10] || '',
                                mcol: cols[12] || ''
                            });
                        }
                        updateAvailableSubjects();
                        let filtered = originalQuestions;
                        if (selJobs.length) filtered = filtered.filter((q) => selJobs.some((j) => sameText(q.job, j)));
                        if (selSubjs.length) filtered = filtered.filter((q) => selSubjs.some((s) => sameText(q.subject, s)));
                        if (!filtered.length) {
                            toast('No questions match filters. Loading all.', 'warning', 3000, false);
                            filtered = originalQuestions;
                            selJobs = [];
                            selSubjs = [];
                            updateAvailableSubjects();
                        }
                        questions = filtered.map((q) => {
                            const sh = shuffleArray(q.options);
                            const nc = sh.indexOf(q.options[q.correct]);
                            return { ...q, options: sh, correct: nc };
                        });
                        invalidQs = [];
                        questions.forEach((q, i) => {
                            if (q.correct === -1 && q.correctText && q.correctText.trim() && q.correctText !== 'No answer') {
                                invalidQs.push(i);
                            }
                        });
                        total = questions.length;
                        answers = new Array(total).fill(null);
                        status = new Array(total).fill(null);
                        locked = new Array(total).fill(false);
                        submitted = false;
                        finished = false;
                        score = 0;
                        currentQ = 0;
                        timeLeft = total * 60;
                        applyQuizTitle();
                        renderSelectedSubjectsLine();
                        ui.tot.textContent = total;
                        ui.att.textContent = 0;
                        ui.refresh.disabled = false;
                        ui.refreshIcon.textContent = '⚙️';
                        ui.refreshIcon.classList.remove('refresh-spin');
                        resetToQuizView();
                        updateTimerDisplay();
                        startTimer();
                        renderQuestion();
                        renderDots();
                        updateOverview();
                        if (mode === 'read') renderReadMode();
                        if (mode === 'facts') renderFactsMode();
                        closeBothPanels();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        if (forceRefresh) toast(`Loaded ${total} questions`, 'success', 2500, false);
                    })
                    .catch((err) => {
                        console.error(err);
                        ui.qCard.innerHTML = '<div style="padding:2rem;text-align:center;color:#dc2626;font-weight:600;">❌ Failed to load questions</div>';
                        ui.refresh.disabled = false;
                        ui.refreshIcon.textContent = '⚙️';
                        ui.refreshIcon.classList.remove('refresh-spin');
                        closeBothPanels();
                        toast('Failed to load questions', 'error');
                    });
            }

            // ---------- FETCH FACTS ----------
            function fetchFacts(callback) {
                if (factsLoaded) { if (callback) callback(); return; }
                if (factsLoading) return;
                factsLoading = true;
                ui.factsBox.innerHTML = '<div class="read-empty">🔄 Loading facts...</div>';
                fetch(withCacheBust(FACTS_URL), { cache: 'no-store', headers: noCacheHeaders() })
                    .then((r) => r.text())
                    .then((text) => {
                        const lines = text.split('\n').filter((l) => l.trim());
                        facts = [];
                        if (lines.length < 2) { factsLoaded = true; factsLoading = false; if (callback) callback(); return; }
                        const headerCols = parseCSVLine(lines[0]).map((h) => h.toLowerCase());
                        const findIdx = (keywords, fallback) => {
                            for (let k = 0; k < headerCols.length; k++) {
                                const h = headerCols[k];
                                if (keywords.some((kw) => h.includes(kw))) return k;
                            }
                            return fallback;
                        };
                        const qIdx = findIdx(['question'], 1);
                        const aIdx = findIdx(['answer'], 2);
                        const topicIdx = findIdx(['topic'], 3);
                        const subjIdx = findIdx(['subject'], 4);
                        const verifyIdx = findIdx(['is question and answer', 'verify', 'correct'], 5);
                        const createdIdx = findIdx(['created date', 'created'], 6);
                        const tagIdx = findIdx(['tag_common_word', 'tag'], 7);
                        let rowNum = 0;
                        for (let i = 1; i < lines.length; i++) {
                            const cols = parseCSVLine(lines[i]);
                            if (!cols.length) continue;
                            const question = cols[qIdx] ? cols[qIdx].trim() : '';
                            if (!question) continue;
                            rowNum++;
                            const rawVerify = cols[verifyIdx] ? cols[verifyIdx].trim() : '';
                            facts.push({
                                srno: rowNum,
                                question,
                                answer: cols[aIdx] ? cols[aIdx].trim() : '',
                                topic: cols[topicIdx] ? cols[topicIdx].trim() : '',
                                subject: cols[subjIdx] ? cols[subjIdx].trim() : '',
                                verify: interpretVerify(rawVerify),
                                created: cols[createdIdx] ? cols[createdIdx].trim() : '',
                                tag: cols[tagIdx] ? cols[tagIdx].trim() : ''
                            });
                        }
                        factsLoaded = true;
                        factsLoading = false;
                        if (callback) callback();
                    })
                    .catch((err) => {
                        console.error('Facts fetch error:', err);
                        factsLoading = false;
                        ui.factsBox.innerHTML = '<div class="read-empty" style="color:#dc2626;">❌ Failed to load facts</div>';
                    });
            }

            // ---------- FETCH PAPERS ----------
            async function fetchPapersWithCache() {
                try {
                    const r = await fetch(withCacheBust(PAPERS_URL), { cache: 'no-store', headers: noCacheHeaders() });
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    const text = await r.text();
                    try { localStorage.setItem(KEY_PAPERS_CACHE, text); } catch (e) {}
                    return text;
                } catch (err) {
                    const cached = localStorage.getItem(KEY_PAPERS_CACHE);
                    if (cached) return cached;
                    throw err;
                }
            }
            function buildPapersFromCSV(csvText) {
                const rows = parseFullCSV(csvText);
                if (rows.length < 2) return [];
                const headers = rows[0].map(h => h.toLowerCase());
                const findIdx = (kw, fb) => {
                    for (let i = 0; i < headers.length; i++) if (headers[i].includes(kw)) return i;
                    return fb;
                };
                const srnoIdx = findIdx('srno', 0);
                const titleIdx = findIdx('title of exam', 1);
                const instructionIdx = findIdx('instruction', 2);
                const yearIdx = findIdx('year', 3);
                const categoryIdx = findIdx('category', 4);
                const topicIdx = findIdx('essay topic', 5);
                const urduIdx = findIdx('urdu', 6);
                const subjectIdx = findIdx('paper_subject', 7);
                const requirementIdx = findIdx('requirement', 8);
                const solutionIdx = findIdx('solution', 9);
                const out = [];
                for (let i = 1; i < rows.length; i++) {
                    const r = rows[i];
                    if (!r.some(c => c !== '')) continue;
                    const topic = (r[topicIdx] || '').trim();
                    if (!topic || topic === 'Untitled essay') continue;
                    const rawSolution = (r[solutionIdx] || '').trim();
                    out.push({
                        srno: (r[srnoIdx] || String(i)).trim(),
                        examTitle: (r[titleIdx] || 'FPSC Competitive Examination').trim(),
                        instruction: (r[instructionIdx] || '').trim(),
                        year: (r[yearIdx] || '').trim(),
                        category: (r[categoryIdx] || 'General').trim(),
                        topic,
                        urduMeaning: (r[urduIdx] || '').trim(),
                        subject: (r[subjectIdx] || 'General').trim(),
                        requirement: (r[requirementIdx] || '').trim(),
                        solutionRaw: rawSolution,
                        hasValidLink: isValidLink(rawSolution)
                    });
                }
                return out;
            }
            async function loadPapersInline() {
                if (papersLoaded || papersLoading) return;
                papersLoading = true;
                ui.papersCardsGrid.innerHTML = '<div class="read-empty">🔄 Loading past papers…</div>';
                try {
                    const csvText = await fetchPapersWithCache();
                    papers = buildPapersFromCSV(csvText);
                    papersLoaded = true;
                    papersLoading = false;
                    populatePaperFilters();
                    renderPapersCards();
                    renderSelectedSubjectsLine();
                } catch (err) {
                    papersLoading = false;
                    ui.papersCardsGrid.innerHTML = '<div class="read-empty" style="color:#dc2626;">❌ Could not load past papers (offline?)</div>';
                }
            }
            function populatePaperFilters() {
                papersYearOptions = [...new Set(papers.map(p => p.year).filter(Boolean))].sort((a, b) => b.localeCompare(a));
                papersSubjectOptions = [...new Set(papers.map(p => p.subject).filter(Boolean))].sort();
                renderPaperPillMenu('year');
                renderPaperPillMenu('subject');
                updatePaperPillLabels();
            }
            function renderPaperPillMenu(which) {
                const wrap = which === 'year' ? ui.papersYearPillWrap : ui.papersSubjectPillWrap;
                const menu = which === 'year' ? ui.papersYearPillMenu : ui.papersSubjectPillMenu;
                const options = which === 'year' ? papersYearOptions : papersSubjectOptions;
                const current = which === 'year' ? papersYearFilter : papersSubjectFilter;
                const allLabel = which === 'year' ? 'All years' : 'All subjects';
                let html = '<button class="papers-filter-pill-item' + (current === '' ? ' active' : '') + '" data-value="">' + allLabel + '</button>';
                options.forEach((v) => {
                    const active = current === v;
                    html += '<button class="papers-filter-pill-item' + (active ? ' active' : '') + '" data-value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</button>';
                });
                menu.innerHTML = html;
                menu.querySelectorAll('.papers-filter-pill-item').forEach((btn) => {
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        const val = btn.getAttribute('data-value');
                        if (which === 'year') { papersYearFilter = val; } else { papersSubjectFilter = val; }
                        wrap.classList.remove('open');
                        updatePaperPillLabels();
                        renderPaperPillMenu(which);
                        renderPapersCards();
                    };
                });
            }
            function updatePaperPillLabels() {
                ui.papersYearPillLabel.textContent = papersYearFilter || 'All years';
                ui.papersSubjectPillLabel.textContent = papersSubjectFilter || 'All subjects';
            }
            function paperMatchesSearch(p, q) {
                if (!q) return true;
                const nq = q.toLowerCase();
                return [p.topic, p.urduMeaning, p.category, p.subject, p.requirement, p.year, p.srno, p.examTitle, p.solutionRaw]
                    .some(v => v && String(v).toLowerCase().includes(nq));
            }
            function renderPapersCards() {
                const q = papersSearchQuery.toLowerCase().trim();
                const isGuestLimited = isGuest;
                let filtered = papers.filter(p => {
                    if (!isGuestLimited) {
                        if (papersYearFilter && p.year !== papersYearFilter) return false;
                        if (papersSubjectFilter && p.subject !== papersSubjectFilter) return false;
                    }
                    if (!paperMatchesSearch(p, q)) return false;
                    return true;
                });
                if (isGuestLimited) {
                    filtered = filtered.slice(0, GUEST_PAPERS_LIMIT);
                    if (ui.guestPapersLock) ui.guestPapersLock.style.display = 'block';
                    if (ui.papersSearchBar) ui.papersSearchBar.style.display = 'none';
                } else {
                    if (ui.guestPapersLock) ui.guestPapersLock.style.display = 'none';
                    if (ui.papersSearchBar) ui.papersSearchBar.style.display = '';
                }
                if (!filtered.length) {
                    ui.papersCardsGrid.innerHTML = '<div class="read-empty">🔍 No past papers match your filters</div>';
                    ui.papersSearchCount.textContent = '0';
                    return;
                }
                let html = '';
                filtered.forEach((p, idx) => {
                    const expandId = 'p-' + idx + '-' + Math.random().toString(36).slice(2, 7);
                    let srHtml = '';
                    if (p.subject || p.requirement) {
                        srHtml = '<div class="card-subject-req">';
                        if (p.subject) srHtml += '<span class="subject-badge">📚 ' + escapeHtml(p.subject) + '</span>';
                        if (p.requirement) srHtml += '<span class="req-badge">📝 ' + escapeHtml(p.requirement) + '</span>';
                        srHtml += '</div>';
                    }
                    const ansBtn = p.hasValidLink
                        ? '<a class="answer-link" href="' + escapeHtml(p.solutionRaw) + '" target="_blank" rel="noopener noreferrer"><span>📄</span> Solved</a>'
                        : '<span class="answer-link disabled"><span>🔒</span> None</span>';
                    const solDetail = p.hasValidLink
                        ? '<a href="' + escapeHtml(p.solutionRaw) + '" target="_blank" rel="noopener" style="color:var(--sky-dark);text-decoration:underline;word-break:break-all;font-weight:600;">' + escapeHtml(p.solutionRaw) + '</a>'
                        : (p.solutionRaw ? '<span>' + escapeHtml(p.solutionRaw) + '</span>' : '<span style="color:var(--text-muted);font-style:italic;">Not available</span>');
                    html += '<div class="essay-card">' +
                        '<div class="card-head">' +
                            '<div class="card-meta">' +
                                '<span class="srno-badge">#' + escapeHtml(p.srno) + '</span>' +
                                '<span class="year-badge">📅 ' + escapeHtml(p.year) + '</span>' +
                            '</div>' +
                            srHtml +
                            '<div class="essay-title">' + escapeHtml(p.topic) + '</div>' +
                            (p.urduMeaning ? '<div class="urdu-meaning">' + escapeHtml(p.urduMeaning) + '</div>' : '') +
                            '<div class="category-chip">' + escapeHtml(p.category) + '</div>' +
                        '</div>' +
                        '<div class="card-body">' +
                            '<div class="action-row">' +
                                ansBtn +
                                '<div class="expand-toggle" data-target="' + expandId + '" role="button" tabindex="0">' +
                                    '<span>Details</span>' +
                                    '<span class="arrow">▼</span>' +
                                '</div>' +
                            '</div>' +
                            '<div id="' + expandId + '" class="extra-details">' +
                                '<div class="detail-item"><span class="detail-label">Exam</span><span class="detail-value">' + escapeHtml(p.examTitle) + '</span></div>' +
                                '<div class="detail-item"><span class="detail-label">Category</span><span class="detail-value">' + escapeHtml(p.category) + '</span></div>' +
                                '<div class="detail-item"><span class="detail-label">Paper Subject</span><span class="detail-value">' + escapeHtml(p.subject) + '</span></div>' +
                                '<div class="detail-item"><span class="detail-label">Requirement</span><span class="detail-value">' + (escapeHtml(p.requirement) || '—') + '</span></div>' +
                                '<div class="detail-item"><span class="detail-label">Year</span><span class="detail-value">' + escapeHtml(p.year) + '</span></div>' +
                                '<div class="detail-item"><span class="detail-label">Full instruction</span><div class="instruction-preview">' + escapeHtml(p.instruction) + '</div></div>' +
                                '<div class="detail-item"><span class="detail-label">Solution / Ref</span><span class="detail-value" style="font-size:.74rem;">' + solDetail + '</span></div>' +
                            '</div>' +
                        '</div>' +
                    '</div>';
                });
                ui.papersCardsGrid.innerHTML = html;
                ui.papersCardsGrid.querySelectorAll('.expand-toggle').forEach(toggle => {
                    toggle.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        const extra = document.getElementById(this.dataset.target);
                        if (!extra) return;
                        const open = extra.classList.contains('show');
                        extra.classList.toggle('show', !open);
                        this.classList.toggle('open', !open);
                    });
                });
                ui.papersSearchCount.textContent = q ? (filtered.length + ' found') : '';
                if (ui.papersSearchBar) ui.papersSearchBar.classList.toggle('has-text', ui.papersSearchInput.value.length > 0);
            }

            // ---------- GUEST LOCK ----------
            function promptGuestLock() {
                confirmBox('🔒', 'Login Required', `You have reached the ${GUEST_LIMIT}-MCQ guest limit. Please login to unlock all questions.`, '🔐 Login Now')
                    .then((ok) => { if (ok) triggerLogout(); });
            }

            // ---------- LOGOUT ----------
            function triggerLogout() {
                if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
                closeBothPanels();
                if (ui.jobsitesOverlay) ui.jobsitesOverlay.classList.remove('active');
                if (ui.cOverlay) ui.cOverlay.classList.remove('active');
                if (ui.papersYearPillWrap) ui.papersYearPillWrap.classList.remove('open');
                if (ui.papersSubjectPillWrap) ui.papersSubjectPillWrap.classList.remove('open');
                const pOverlay = document.getElementById('progressOverlay');
                if (pOverlay) pOverlay.classList.remove('active');
                const pinO = document.getElementById('pinOverlay');
                if (pinO) pinO.classList.remove('active');
                document.body.style.overflow = '';
                try { localStorage.removeItem(KEY_USER); localStorage.removeItem(KEY_QUIZ); } catch (e) {}
                try {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'SL_LOGOUT' }, '*');
                    } else {
                        // If we're top-level, reload or navigate to login
                        location.reload();
                    }
                } catch (e) {}
            }

            // ---------- RENDER QUESTION ----------
            function renderQuestion() {
                if (!questions.length) return;
                const q = questions[currentQ];
                const isAnswered = locked[currentQ] || submitted || finished;
                const letters = ['A', 'B', 'C', 'D'];
                const badge = renderMColBadge(q.mcol);
                let html = `<div class="q-text">${currentQ + 1}. ${q.question}</div>`;
                html += '<div class="options-list">';
                q.options.forEach((opt, i) => {
                    let cls = 'option-btn', icon = '';
                    if (answers[currentQ] === i) cls += ' selected-opt';
                    if (isAnswered) {
                        if (q.correct !== -1 && i === q.correct) { cls += ' correct'; icon = '<span class="icon-indicator">✓</span>'; }
                        if (answers[currentQ] === i && answers[currentQ] !== q.correct) { cls += ' wrong'; icon = '<span class="icon-indicator">✗</span>'; }
                    }
                    html += `<button class="${cls}" data-i="${i}" ${isAnswered ? 'disabled' : ''}><span class="letter">${letters[i]}</span><span>${opt || '(Empty)'}</span>${icon}</button>`;
                });
                html += '</div>';
                if (locked[currentQ] && !submitted && !finished) {
                    const ok = answers[currentQ] === q.correct;
                    html += `<div class="feedback-box ${ok ? 'correct-fb' : 'wrong-fb'}">${ok ? '✅ Correct!' : '❌ Correct: ' + (q.options[q.correct] || 'N/A')}</div>`;
                    const metaChips = [];
                    if (q.subject) metaChips.push(`<span class="meta-chip subject-chip">📚 ${titleCase(q.subject)}</span>`);
                    if (q.topic) metaChips.push(`<span class="meta-chip topic-chip">🏷️ ${titleCase(q.topic)}</span>`);
                    if (q.job) metaChips.push(`<span class="meta-chip job-chip">💼 ${titleCase(q.job)}</span>`);
                    if (metaChips.length) html += '<div class="q-meta-block">' + metaChips.join('') + '</div>';
                }
                ui.qCard.innerHTML = badge + '<div class="question-body">' + html + '</div>';
                ui.qCard.querySelector('.q-text').onclick = (e) => {
                    e.stopPropagation();
                    openGoogleSearch(q.question, q.subject, q.topic);
                };
                if (!submitted && !finished) {
                    ui.qCard.querySelectorAll('.option-btn:not([disabled])').forEach((btn) => {
                        btn.onclick = (e) => {
                            e.stopPropagation();
                            if (locked[currentQ] || submitted || finished) return;
                            locked[currentQ] = true;
                            answers[currentQ] = +btn.dataset.i;
                            renderQuestion();
                            renderDots(currentQ);
                            updateProgress();
                            updateOverview();
                            saveState();
                        };
                    });
                }
                const atGuestLimit = isGuest && currentQ >= GUEST_LIMIT - 1;
                ui.prev.disabled = currentQ === 0 || finished;
                ui.next.disabled = currentQ === total - 1 || finished || atGuestLimit;
                ui.endBtn.disabled = finished;
                ui.subBanner.style.display = submitted && !finished ? 'block' : 'none';
                updateProgress();
                saveState();
            }
            function renderMColBadge(value) {
                if (value == null || String(value).trim() === '') return '<div class="m-col-badge empty"><span class="q-mark">?</span></div>';
                const v = String(value).trim().toLowerCase();
                if (v === 'true') return `<div class="m-col-badge true"><svg viewBox="0 0 16 16" fill="none"><path d="M13.5 4.5L6 12L2.5 8.5" stroke="#0969da" stroke-width="2.8" stroke-linecap="round"/></svg></div>`;
                if (v === 'false') return `<div class="m-col-badge false"><svg viewBox="0 0 16 16" fill="none"><path d="M4 4L12 12M12 4L4 12" stroke="#cf222e" stroke-width="2.8" stroke-linecap="round"/></svg></div>`;
                return '<div class="m-col-badge empty"><span class="q-mark">?</span></div>';
            }
            function updateProgress() {
                ui.att.textContent = attemptedCount();
                ui.prog.style.width = (total ? (attemptedCount() / total) * 100 : 0) + '%';
                ui.tot.textContent = total;
            }
            function renderDots(activeIndex) {
                ui.dots.innerHTML = '';
                for (let i = 0; i < total; i++) {
                    const d = document.createElement('button');
                    d.className = 'grid-dot';
                    d.textContent = i + 1;
                    const isLocked = isGuest && i >= GUEST_LIMIT;
                    if (isLocked) { d.classList.add('locked-dot'); }
                    else if (invalidQs.includes(i)) { d.classList.add('invalid-dot'); }
                    else if (answers[i] !== null) {
                        if (submitted || finished) {
                            if (status[i] === true) d.classList.add('correct-dot');
                            else if (status[i] === false) d.classList.add('wrong-dot');
                            else d.classList.add('done-dot');
                        } else {
                            const q = questions[i];
                            d.classList.add(answers[i] === q.correct ? 'correct-dot' : 'wrong-dot');
                        }
                    } else { d.classList.add('pending-dot'); }
                    if (activeIndex !== undefined && i === activeIndex) d.classList.add('active-dot');
                    d.onclick = () => {
                        if (isLocked) { promptGuestLock(); return; }
                        currentQ = i;
                        renderQuestion();
                        renderDots(i);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };
                    ui.dots.appendChild(d);
                }
            }
            function updateOverview() {
                let done = 0, pending = 0, correct = 0, wrong = 0, invalid = 0;
                for (let i = 0; i < total; i++) {
                    if (invalidQs.includes(i)) { invalid++; continue; }
                    if (answers[i] !== null) {
                        done++;
                        if (submitted || finished) {
                            if (status[i] === true) correct++;
                            else if (status[i] === false) wrong++;
                        } else {
                            if (questions[i] && answers[i] === questions[i].correct) correct++;
                            else wrong++;
                        }
                    } else pending++;
                }
                ui.doneC.textContent = done;
                ui.pendC.textContent = pending;
                ui.corrC.textContent = correct;
                ui.wrongC.textContent = wrong;
                ui.invC.textContent = invalid;
                ui.invLeg.style.display = invalid > 0 ? 'inline-flex' : 'none';
            }

            // ---------- GRADE QUIZ ----------
            function gradeQuiz() {
                let correctCount = 0;
                for (let i = 0; i < questions.length; i++) {
                    const q = questions[i], a = answers[i];
                    if (invalidQs.includes(i) || q.correct === -1) { status[i] = null; continue; }
                    if (a !== null && a === q.correct) { status[i] = true; correctCount++; }
                    else if (a !== null) { status[i] = false; }
                    else { status[i] = null; }
                }
                score = correctCount;
                submitted = true;
                if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
                ui.subBanner.style.display = 'block';
                renderQuestion();
                renderDots();
                updateOverview();
                saveState();
            }
            function handleEndQuiz() {
                if (finished) return;
                if (!submitted) gradeQuiz();
                finished = true;
                if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
                ui.endBtn.disabled = true;
                showResult();
            }
            function showResult() {
                finished = true;
                if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
                ui.single.style.display = 'none';
                ui.result.style.display = 'block';
                $('endQuizBottom').style.display = 'none';
                ui.quizApp.classList.add('result-active');
                const displayTotal = isGuest ? Math.min(total, GUEST_LIMIT) : total;
                ui.score.textContent = score + ' / ' + displayTotal;
                if (isGuest) ui.rmsg.textContent = `👤 Guest mode: limited to ${GUEST_LIMIT} questions.`;
                else if (score === displayTotal) ui.rmsg.textContent = '🌟 Perfect score!';
                else if (score >= displayTotal * 0.7) ui.rmsg.textContent = '👏 Great job!';
                else ui.rmsg.textContent = '💪 Keep practicing!';
                ui.rdetails.innerHTML = '';
                const displayQs = isGuest ? questions.slice(0, GUEST_LIMIT) : questions;
                displayQs.forEach((q, i) => {
                    const div = document.createElement('div');
                    div.className = 'detail-item';
                    const inv = invalidQs.includes(i), ok = status[i] === true, wr = status[i] === false;
                    if (inv) div.classList.add('invalid-detail');
                    else if (ok) div.classList.add('correct-detail');
                    else if (wr) div.classList.add('wrong-detail');
                    else div.style.borderLeft = '5px solid #94a3b8';
                    const qEl = document.createElement('div');
                    qEl.className = 'detail-q';
                    qEl.textContent = `${i + 1}. ${q.question}`;
                    qEl.onclick = () => openGoogleSearch(q.question, q.subject, q.topic);
                    div.appendChild(qEl);
                    const aEl = document.createElement('div');
                    aEl.className = 'detail-answer';
                    if (inv) aEl.innerHTML = `⚠️ Invalid: "${q.correctText}" not in options.`;
                    else {
                        const userAns = answers[i] !== null && q.options[answers[i]] ? q.options[answers[i]] : 'Not answered';
                        const correctAns = q.correct !== -1 && q.options[q.correct] ? q.options[q.correct] : 'N/A';
                        if (q.correct === -1) aEl.innerHTML = '⚠️ No correct answer.';
                        else if (ok) aEl.innerHTML = `✅ Your answer: <span style="color:#059669;font-weight:700;">${userAns}</span>`;
                        else if (wr) aEl.innerHTML = `❌ Yours: <span style="color:#dc2626;font-weight:700;">${userAns}</span> &nbsp; Correct: <span class="correct-ans">${correctAns}</span>`;
                        else aEl.innerHTML = `⏭️ Skipped &nbsp; Correct: <span class="correct-ans">${correctAns}</span>`;
                    }
                    div.appendChild(aEl);
                    ui.rdetails.appendChild(div);
                });
                if (isGuest) {
                    const lock = document.createElement('div');
                    lock.style.cssText = 'text-align:center;padding:1.5rem;background:#e0f2fe;border-radius:16px;border:1.5px solid #0ea5e9;';
                    lock.innerHTML = `<div style="font-size:2rem;">🔒</div><h3 style="color:#0a1e3f;font-weight:800;margin:.4rem 0;">Unlock All Questions</h3><p style="color:#475569;font-size:.9rem;margin-bottom:1rem;">You viewed ${Math.min(total, GUEST_LIMIT)} of ${total} questions as a guest.</p><button id="resultLockLoginBtn" style="background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border:none;font-weight:700;padding:.8rem 2rem;border-radius:9999px;cursor:pointer;">🔐 Login Now</button>`;
                    ui.rdetails.appendChild(lock);
                    lock.querySelector('#resultLockLoginBtn').onclick = triggerLogout;
                }
                updateOverview();
                renderDots();
                updateProgress();
                saveState();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
            function restartQuiz() {
                clearSavedState();
                answers = new Array(questions.length).fill(null);
                status = new Array(questions.length).fill(null);
                locked = new Array(questions.length).fill(false);
                submitted = false;
                finished = false;
                score = 0;
                currentQ = 0;
                timeLeft = total * 60;
                if (timerHandle) clearInterval(timerHandle);
                ui.result.style.display = 'none';
                ui.single.style.display = 'block';
                ui.subBanner.style.display = 'none';
                ui.endBtn.disabled = false;
                $('endQuizBottom').style.display = 'flex';
                ui.quizApp.classList.remove('result-active');
                questions = questions.map((q) => {
                    const sh = shuffleArray(q.options);
                    const nc = sh.indexOf(q.options[q.correct]);
                    return { ...q, options: sh, correct: nc };
                });
                updateTimerDisplay();
                startTimer();
                renderQuestion();
                renderDots();
                updateOverview();
                if (mode === 'read') renderReadMode();
                if (mode === 'facts') renderFactsMode();
                saveState();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            // ---------- RESET TO QUIZ VIEW ----------
            function resetToQuizView() {
                ui.result.style.display = 'none';
                ui.single.style.display = 'block';
                ui.subBanner.style.display = 'none';
                ui.endBtn.disabled = false;
                $('endQuizBottom').style.display = 'flex';
                ui.quizApp.classList.remove('result-active');
            }

            // ---------- SET MODE ----------
            function setMode(newMode, silent) {
                mode = (newMode === 'read' || newMode === 'facts' || newMode === 'papers') ? newMode : 'mcq';
                ui.quizApp.classList.remove('read-mode-active', 'facts-mode-active', 'papers-mode-active', 'result-active');
                ui.result.style.display = 'none';
                $('endQuizBottom').style.display = 'flex';
                document.querySelectorAll('.desktop-nav-tab').forEach((tab) => {
                    tab.classList.toggle('active', tab.dataset.desktopMode === mode);
                });
                if (mode !== 'papers') {
                    ui.papersYearPillWrap.classList.remove('open');
                    ui.papersSubjectPillWrap.classList.remove('open');
                }
                if (mode === 'facts' || mode === 'papers') { closeDrawer(); }
                if (mode === 'mcq') {
                    applyQuizTitle();
                    renderSelectedSubjectsLine();
                    if (finished) {
                        ui.single.style.display = 'none';
                        ui.result.style.display = 'block';
                        $('endQuizBottom').style.display = 'none';
                        ui.quizApp.classList.add('result-active');
                    } else {
                        ui.single.style.display = 'block';
                    }
                } else if (mode === 'read') {
                    ui.quizApp.classList.add('read-mode-active');
                    applyQuizTitle();
                    renderSelectedSubjectsLine();
                    readVisibleLimit = PAGE_SIZE;
                    renderReadMode();
                } else if (mode === 'facts') {
                    ui.quizApp.classList.add('facts-mode-active');
                    applyQuizTitle();
                    renderSelectedSubjectsLine();
                    factsVisibleLimit = PAGE_SIZE;
                    if (!factsLoaded && !factsLoading) fetchFacts(() => renderFactsMode());
                    else renderFactsMode();
                } else if (mode === 'papers') {
                    ui.quizApp.classList.add('papers-mode-active');
                    applyQuizTitle();
                    renderSelectedSubjectsLine();
                    loadPapersInline();
                }
                try { localStorage.setItem(KEY_MODE, mode); } catch (e) {}
                if (!silent) {
                    try {
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: 'SL_SET_MODE_FROM_EDU', mode: mode }, '*');
                        }
                    } catch (e) {}
                }
            }

            // ---------- READ MODE ----------
            function readItemMatchesSearch(q, query) {
                if (!query) return true;
                const nq = query.toLowerCase();
                if (q.question && q.question.toLowerCase().includes(nq)) return true;
                if (q.subject && q.subject.toLowerCase().includes(nq)) return true;
                if (q.topic && q.topic.toLowerCase().includes(nq)) return true;
                if (q.job && q.job.toLowerCase().includes(nq)) return true;
                if (Array.isArray(q.options)) for (const opt of q.options) if (opt && String(opt).toLowerCase().includes(nq)) return true;
                return false;
            }
            function renderReadMode() {
                if (!questions.length) {
                    ui.readBox.innerHTML = '<div class="read-empty">No questions available</div>';
                    ui.readSearchCount.textContent = '';
                    if (ui.readLoadMoreBtn) ui.readLoadMoreBtn.classList.add('hidden');
                    return;
                }
                const letters = ['A', 'B', 'C', 'D'];
                const guestLimit = isGuest ? GUEST_LIMIT : questions.length;
                const limit = Math.min(readVisibleLimit, guestLimit);
                let html = '', shownCount = 0;
                questions.slice(0, limit).forEach((q, i) => {
                    if (!readItemMatchesSearch(q, readSearchQuery)) return;
                    shownCount++;
                    const inv = invalidQs.includes(i);
                    let optsHtml = '';
                    q.options.forEach((opt, oi) => {
                        const isCorrect = !inv && q.correct !== -1 && oi === q.correct;
                        optsHtml += `<div class="read-opt${isCorrect ? ' correct-opt' : ''}"><span class="ro-letter">${letters[oi]}</span><span>${opt || '(Empty)'}</span>${isCorrect ? '<span class="ro-check">✓</span>' : ''}</div>`;
                    });
                    const metaChips = [];
                    if (q.subject) metaChips.push(`<span class="rm-chip rm-subject">📚 ${titleCase(q.subject)}</span>`);
                    if (q.topic) metaChips.push(`<span class="rm-chip rm-topic">🏷️ ${titleCase(q.topic)}</span>`);
                    if (q.job) metaChips.push(`<span class="rm-chip rm-job">💼 ${titleCase(q.job)}</span>`);
                    html += `<div class="read-item">${renderMColBadge(q.mcol).replace('m-col-badge', 'read-mcol')}<div class="read-q" data-q="${encodeURIComponent(q.question)}" data-s="${encodeURIComponent(q.subject || '')}" data-t="${encodeURIComponent(q.topic || '')}"><span class="read-srno">${i + 1}</span>${q.question}</div><div class="read-options">${optsHtml}</div>${metaChips.length ? '<div class="read-meta">' + metaChips.join('') + '</div>' : ''}</div>`;
                });
                if (shownCount === 0) {
                    ui.readBox.innerHTML = '<div class="read-empty">🔍 No questions match "' + escapeHtml(readSearchQuery) + '"</div>';
                    ui.readSearchCount.textContent = '0';
                } else {
                    ui.readBox.innerHTML = html;
                    ui.readSearchCount.textContent = readSearchQuery ? (shownCount + ' found') : '';
                    ui.readBox.querySelectorAll('.read-q').forEach((el) => {
                        el.onclick = (e) => {
                            e.stopPropagation();
                            openGoogleSearch(decodeURIComponent(el.dataset.q), decodeURIComponent(el.dataset.s), decodeURIComponent(el.dataset.t));
                        };
                    });
                }
                const totalLimit = isGuest ? Math.min(GUEST_LIMIT, questions.length) : questions.length;
                const hasMore = !readSearchQuery && readVisibleLimit < totalLimit;
                if (ui.readLoadMoreBtn) {
                    if (hasMore) {
                        const remaining = totalLimit - readVisibleLimit;
                        const step = Math.min(PAGE_SIZE, Math.max(remaining, 0));
                        ui.readLoadMoreBtn.textContent = step > 0 ? `⬇️ +${step}` : '⬇️ +more';
                        ui.readLoadMoreBtn.classList.remove('hidden');
                        ui.readLoadMoreBtn.disabled = false;
                    } else {
                        ui.readLoadMoreBtn.classList.add('hidden');
                    }
                }
                updateSearchBarState(ui.readSearchBar, ui.readSearchInput);
            }

            // ---------- FACTS MODE ----------
            function factMatchesSearch(f, query) {
                if (!query) return true;
                const nq = query.toLowerCase();
                if (f.question && f.question.toLowerCase().includes(nq)) return true;
                if (f.answer && f.answer.toLowerCase().includes(nq)) return true;
                if (f.topic && f.topic.toLowerCase().includes(nq)) return true;
                if (f.subject && f.subject.toLowerCase().includes(nq)) return true;
                if (f.srno && String(f.srno).toLowerCase().includes(nq)) return true;
                if (f.created && f.created.toLowerCase().includes(nq)) return true;
                if (f.tag && f.tag.toLowerCase().includes(nq)) return true;
                if (f.verify && f.verify.toLowerCase().includes(nq)) return true;
                return false;
            }
            function getFactKey(f, i) {
                return String(i) + '::' + String(f.srno || f.question || '').trim().substring(0, 80);
            }
            function renderFactsMode() {
                if (!factsLoaded) {
                    if (!factsLoading) fetchFacts(() => renderFactsMode());
                    return;
                }
                if (!facts.length) {
                    ui.factsBox.innerHTML = '<div class="read-empty">No facts available</div>';
                    ui.factsDone.textContent = '0';
                    ui.factsTotal.textContent = '0';
                    ui.factsSearchCount.textContent = '';
                    if (ui.factsLoadMoreBtn) ui.factsLoadMoreBtn.classList.add('hidden');
                    return;
                }
                const guestLimit = isGuest ? GUEST_LIMIT : facts.length;
                const limit = Math.min(factsVisibleLimit, guestLimit);
                let html = '', shownCount = 0;
                facts.slice(0, limit).forEach((f, i) => {
                    if (!factMatchesSearch(f, factsSearchQuery)) return;
                    shownCount++;
                    const hasAnswer = f.answer && f.answer.trim() !== '';
                    const key = getFactKey(f, i);
                    const isRead = factsReadSet.has(key);
                    let cornerHtml = '';
                    if (f.verify === 'true') cornerHtml = '<span class="verify-corner true">✔</span>';
                    else if (f.verify === 'false') cornerHtml = '<span class="verify-corner false">✘</span>';
                    else cornerHtml = '<span class="verify-corner unknown">?</span>';
                    const metaChips = [];
                    const topicClean = (f.topic || '').trim().toLowerCase();
                    const subjectClean = (f.subject || '').trim().toLowerCase();
                    const sameTopicSubject = topicClean && subjectClean && topicClean === subjectClean;
                    if (f.subject) {
                        metaChips.push(`<span class="fm-chip">📚 ${escapeHtml(f.subject)}</span>`);
                        if (f.topic && !sameTopicSubject) metaChips.push(`<span class="fm-chip topic">🏷️ ${escapeHtml(f.topic)}</span>`);
                    } else if (f.topic) metaChips.push(`<span class="fm-chip topic">🏷️ ${escapeHtml(f.topic)}</span>`);
                    const displaySrno = i + 1;
                    html += `<div class="fact-card${isRead ? ' read-flag' : ''}" data-key="${encodeURIComponent(key)}" data-q="${encodeURIComponent(f.question)}" data-c="${encodeURIComponent(f.subject || f.topic || '')}">${cornerHtml}<div class="fact-head"><span class="fact-srno">${displaySrno}</span><span class="fact-question">${escapeHtml(f.question)} <span class="fact-search-hint">🔍</span></span></div><div class="fact-answer${hasAnswer ? '' : ' empty'}"><strong>Answer:</strong> ${hasAnswer ? escapeHtml(f.answer) : '—'}</div>${metaChips.length ? '<div class="fact-meta">' + metaChips.join('') + '</div>' : ''}</div>`;
                });
                if (shownCount === 0) {
                    ui.factsBox.innerHTML = '<div class="read-empty">🔍 No facts match "' + escapeHtml(factsSearchQuery) + '"</div>';
                    ui.factsSearchCount.textContent = '0';
                } else {
                    ui.factsBox.innerHTML = html;
                    ui.factsSearchCount.textContent = factsSearchQuery ? (shownCount + ' found') : '';
                    ui.factsBox.querySelectorAll('.fact-card').forEach((card) => {
                        card.onclick = (e) => {
                            e.stopPropagation();
                            const key = decodeURIComponent(card.dataset.key);
                            const q = decodeURIComponent(card.dataset.q);
                            const c = decodeURIComponent(card.dataset.c);
                            if (!factsReadSet.has(key)) {
                                factsReadSet.add(key);
                                saveFactsReadSet();
                                card.classList.add('read-flag');
                                updateFactsCounter();
                            }
                            openGoogleSearch(q, c, '');
                        };
                    });
                }
                const totalLimit = isGuest ? Math.min(GUEST_LIMIT, facts.length) : facts.length;
                const hasMore = !factsSearchQuery && factsVisibleLimit < totalLimit;
                if (ui.factsLoadMoreBtn) {
                    if (hasMore) {
                        const remaining = totalLimit - factsVisibleLimit;
                        const step = Math.min(PAGE_SIZE, Math.max(remaining, 0));
                        ui.factsLoadMoreBtn.textContent = step > 0 ? `⬇️ +${step}` : '⬇️ +more';
                        ui.factsLoadMoreBtn.classList.remove('hidden');
                        ui.factsLoadMoreBtn.disabled = false;
                    } else ui.factsLoadMoreBtn.classList.add('hidden');
                }
                updateFactsCounter();
                updateSearchBarState(ui.factsSearchBar, ui.factsSearchInput);
            }
            function updateFactsCounter() {
                const limit = isGuest ? Math.min(GUEST_LIMIT, facts.length) : facts.length;
                let done = 0;
                for (let i = 0; i < limit; i++) {
                    const key = getFactKey(facts[i], i);
                    if (factsReadSet.has(key)) done++;
                }
                ui.factsDone.textContent = done;
                ui.factsTotal.textContent = limit;
            }

            // ---------- SEARCH BAR STATE ----------
            function updateSearchBarState(bar, input) {
                if (!bar || !input) return;
                bar.classList.toggle('has-text', input.value.length > 0);
            }

            // ---------- PANELS (JOB/SUBJECT MULTI-SELECT) ----------
            const panels = {
                modal: { root: null, jobC: null, jobW: null, jobChips: null, jobSearch: null, jobDrop: null, subjC: null, subjW: null, subjChips: null, subjSearch: null, subjDrop: null },
                drawer: { root: null, jobC: null, jobW: null, jobChips: null, jobSearch: null, jobDrop: null, subjC: null, subjW: null, subjChips: null, subjSearch: null, subjDrop: null },
            };
            function closeAllDropdowns() {
                ['modal', 'drawer'].forEach((key) => {
                    panels[key].jobC.classList.remove('open');
                    panels[key].subjC.classList.remove('open');
                });
            }
            function renderChipsInto(container, items, onRemove) {
                container.innerHTML = '';
                items.forEach((item) => {
                    const chip = document.createElement('span');
                    chip.className = 'ms-chip';
                    chip.innerHTML = `<span class="ms-chip-text">${titleCase(item)}</span><button class="ms-chip-remove">×</button>`;
                    chip.querySelector('.ms-chip-remove').onclick = (e) => {
                        e.stopPropagation();
                        onRemove(item);
                    };
                    container.appendChild(chip);
                });
            }
            function renderJobDropdowns() {
                ['modal', 'drawer'].forEach((key) => {
                    const p = panels[key];
                    const search = jobSearchText.toLowerCase();
                    const filtered = [];
                    const seen = new Set();
                    originalQuestions.forEach((q) => {
                        if (q.job && !seen.has(q.job.toLowerCase())) {
                            seen.add(q.job.toLowerCase());
                            if (titleCase(q.job).toLowerCase().includes(search)) filtered.push(q.job);
                        }
                    });
                    p.jobDrop.innerHTML = '';
                    const allSelected = selJobs.length > 0 && selJobs.length === filtered.length;
                    const selectAll = document.createElement('div');
                    selectAll.className = 'ms-select-all-row' + (allSelected ? ' selected' : '');
                    selectAll.innerHTML = `<span class="ms-check">${allSelected ? '✓' : ''}</span><span>Select All Jobs</span>`;
                    selectAll.onclick = (e) => {
                        e.stopPropagation();
                        selJobs = allSelected ? [] : [...filtered];
                        updateAvailableSubjects();
                        renderJobChipsBoth();
                        renderJobDropdowns();
                        renderSubjectChipsBoth();
                        renderSubjectDropdowns();
                    };
                    p.jobDrop.appendChild(selectAll);
                    if (!filtered.length) {
                        p.jobDrop.innerHTML += '<div class="ms-no-results">No jobs found</div>';
                        return;
                    }
                    filtered.forEach((job) => {
                        const isSel = selJobs.some((j) => sameText(j, job));
                        const opt = document.createElement('div');
                        opt.className = 'ms-option' + (isSel ? ' selected' : '');
                        opt.innerHTML = `<span class="ms-check">${isSel ? '✓' : ''}</span><span class="ms-opt-label">${titleCase(job)}</span>`;
                        opt.onclick = (e) => {
                            e.stopPropagation();
                            selJobs = isSel ? selJobs.filter((j) => !sameText(j, job)) : [...selJobs, job];
                            updateAvailableSubjects();
                            renderJobChipsBoth();
                            renderJobDropdowns();
                            renderSubjectChipsBoth();
                            renderSubjectDropdowns();
                            p.jobC.classList.remove('open');
                        };
                        p.jobDrop.appendChild(opt);
                    });
                });
            }
            function renderSubjectDropdowns() {
                ['modal', 'drawer'].forEach((key) => {
                    const p = panels[key];
                    const search = subjSearchText.toLowerCase();
                    const filtered = availSubjs.filter((x) => titleCase(x).toLowerCase().includes(search));
                    p.subjDrop.innerHTML = '';
                    const allSelected = availSubjs.length > 0 && selSubjs.length === availSubjs.length;
                    const selectAll = document.createElement('div');
                    selectAll.className = 'ms-select-all-row' + (allSelected ? ' selected' : '');
                    selectAll.innerHTML = `<span class="ms-check">${allSelected ? '✓' : ''}</span><span>Select All Subjects</span>`;
                    selectAll.onclick = (e) => {
                        e.stopPropagation();
                        selSubjs = allSelected ? [] : [...availSubjs];
                        renderSubjectChipsBoth();
                        renderSubjectDropdowns();
                    };
                    p.subjDrop.appendChild(selectAll);
                    if (!filtered.length) {
                        p.subjDrop.innerHTML += `<div class="ms-no-results">${availSubjs.length ? 'No subjects found' : 'No subjects available'}</div>`;
                        return;
                    }
                    filtered.forEach((subj) => {
                        const isSel = selSubjs.some((s) => sameText(s, subj));
                        const opt = document.createElement('div');
                        opt.className = 'ms-option' + (isSel ? ' selected' : '');
                        opt.innerHTML = `<span class="ms-check">${isSel ? '✓' : ''}</span><span class="ms-opt-label">${titleCase(subj)}</span>`;
                        opt.onclick = (e) => {
                            e.stopPropagation();
                            selSubjs = isSel ? selSubjs.filter((s) => !sameText(s, subj)) : [...selSubjs, subj];
                            renderSubjectChipsBoth();
                            renderSubjectDropdowns();
                            p.subjC.classList.remove('open');
                        };
                        p.subjDrop.appendChild(opt);
                    });
                });
            }
            function renderJobChipsBoth() {
                const handler = (job) => {
                    selJobs = selJobs.filter((j) => !sameText(j, job));
                    updateAvailableSubjects();
                    renderJobChipsBoth();
                    renderJobDropdowns();
                    renderSubjectChipsBoth();
                    renderSubjectDropdowns();
                };
                renderChipsInto(panels.modal.jobChips, selJobs, handler);
                renderChipsInto(panels.drawer.jobChips, selJobs, handler);
            }
            function renderSubjectChipsBoth() {
                const handler = (subj) => {
                    selSubjs = selSubjs.filter((s) => !sameText(s, subj));
                    renderSubjectChipsBoth();
                    renderSubjectDropdowns();
                };
                renderChipsInto(panels.modal.subjChips, selSubjs, handler);
                renderChipsInto(panels.drawer.subjChips, selSubjs, handler);
            }
            function updateAvailableSubjects() {
                const set = new Set();
                originalQuestions.forEach((q) => {
                    if (!selJobs.length || selJobs.some((j) => sameText(q.job, j))) {
                        if (q.subject && q.subject.trim()) set.add(q.subject);
                    }
                });
                availSubjs = [...set];
                selSubjs = selSubjs.filter((s) => availSubjs.some((a) => sameText(a, s)));
            }

            // ---------- INIT PANELS ----------
            function initPanels() {
                ui.modalJobMsContainer = $('modalJobMsContainer');
                ui.modalJobMsWrapper = $('modalJobMsWrapper');
                ui.modalJobMsChips = $('modalJobMsChips');

            function fetchJobSites(callback) {
                if (jobSitesLoaded) { if (callback) callback(); return; }
                if (jobSitesLoading) return;
                jobSitesLoading = true;
                ui.jobsitesList.innerHTML = '<div class="jobsites-loading"><div class="spinner"></div><br>Loading job sites...</div>';
                fetch(withCacheBust(JOBSITES_URL), { cache: 'no-store', headers: noCacheHeaders() })
                    .then((r) => r.text())
                    .then((text) => {
                        const lines = text.split('\n').filter((l) => l.trim());
                        jobSites = [];
                        if (lines.length < 2) { jobSitesLoaded = true; jobSitesLoading = false; if (callback) callback(); return; }
                        const headerCols = parseCSVLine(lines[0]).map((h) => h.toLowerCase().trim());
                        const findIdx = (keywords, fallback) => {
                            for (let k = 0; k < headerCols.length; k++) {
                                const h = headerCols[k];
                                if (keywords.some((kw) => h.includes(kw))) return k;
                            }
                            return fallback;
                        };
                        const srnoIdx = findIdx(['srno', 'sr no', 's.no', 'serial'], 0);
                        const sectorIdx = findIdx(['sector'], 1);
                        const nameIdx = findIdx(['name of job', 'name', 'website'], 2);
                        const urlIdx = findIdx(['url', 'link'], 3);
                        for (let i = 1; i < lines.length; i++) {
                            const cols = parseCSVLine(lines[i]);
                            if (!cols.length) continue;
                            const name = cols[nameIdx] ? cols[nameIdx].trim() : '';
                            if (!name) continue;
                            jobSites.push({
                                srno: cols[srnoIdx] ? cols[srnoIdx].trim() : String(i),
                                sector: cols[sectorIdx] ? cols[sectorIdx].trim() : '',
                                name,
                                url: cols[urlIdx] ? cols[urlIdx].trim() : ''
                            });
                        }
                        jobSitesLoaded = true;
                        jobSitesLoading = false;
                        if (callback) callback();
                    })
                    .catch((err) => {
                        console.error('Job sites fetch error:', err);
                        jobSitesLoading = false;

            // ---------- PROGRESS REPORT ----------
            function buildQState(i) {
                const q = questions[i];
                if (!q) return 'pending';
                if (invalidQs.includes(i)) return 'invalid';
                if (answers[i] === null) return 'pending';
                if (q.correct === -1) return 'invalid';
                return answers[i] === q.correct ? 'correct' : 'wrong';
            }
            function getProgressData() {
                const displayTotal = isGuest ? Math.min(total, GUEST_LIMIT) : total;
                const displayQs = isGuest ? questions.slice(0, GUEST_LIMIT) : questions;
                const items = displayQs.map((q, i) => ({ idx: i, q, state: buildQState(i) }));
                const correct = items.filter(x => x.state === 'correct').length;
                const wrong = items.filter(x => x.state === 'wrong').length;
                const pending = items.filter(x => x.state === 'pending').length;
                const attempted = correct + wrong;
                const accuracy = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
                return { displayTotal, items, correct, wrong, pending, attempted, accuracy };
            }
            function applyProgressFilters(items) {
                let list = items;
                if (progressTab === 'attempted') list = list.filter(x => x.state === 'correct' || x.state === 'wrong');
                else if (progressTab === 'wrong') list = list.filter(x => x.state === 'wrong');
                else if (progressTab === 'pending') list = list.filter(x => x.state === 'pending');
                if (progressJobFilter) list = list.filter(x => sameText(x.q.job, progressJobFilter));
                return list;
            }
            function renderProgressReport() {

            document.addEventListener('click', (e) => {
                const wrap = document.getElementById('progressJobWrap');
                if (wrap && !wrap.contains(e.target)) wrap.classList.remove('open');
            });

            function csvEscape(v) {
                if (v == null) return '';
                const s = String(v);
                if (s.includes(',') || s.includes('"') || s.includes('\n') || s.includes('\r')) return '"' + s.replace(/"/g, '""') + '"';
                return s;
            }
            function downloadProgressCSV() {
                if (!questions.length) { toast('No quiz loaded to export.', 'warning'); return; }
                const displayQs = isGuest ? questions.slice(0, GUEST_LIMIT) : questions;
                const userName = user ? user.user : 'Guest';
                const s = getProgressData();
                const rows = [];
                rows.push(['meta_version','user','is_guest','exported_at','total','attempted','correct','wrong','pending','accuracy_percent','time_left_seconds','current_question_index','submitted','finished','selected_jobs','selected_subjects'].join(','));
                rows.push(['1', csvEscape(userName), isGuest ? '1' : '0', csvEscape(new Date().toISOString()), s.displayTotal, s.attempted, s.correct, s.wrong, s.pending, s.accuracy, timeLeft, currentQ, submitted ? '1':'0', finished ? '1':'0', csvEscape(selJobs.join(' | ')), csvEscape(selSubjs.join(' | '))].join(','));
                rows.push('');
                rows.push(['index','question','option_a','option_b','option_c','option_d','correct_answer','user_answer','is_correct','status','subject','topic','job'].join(','));
                displayQs.forEach((q, i) => {
                    const userAns = answers[i] !== null && q.options[answers[i]] ? q.options[answers[i]] : '';
                    const correctAns = q.correct !== -1 && q.options[q.correct] ? q.options[q.correct] : '';
                    let isCorrect = '', stat = 'pending';
                    if (answers[i] !== null) {
                        if (q.correct === -1) stat = 'invalid';
                        else if (answers[i] === q.correct) { isCorrect = '1'; stat = 'correct'; }
                        else { isCorrect = '0'; stat = 'wrong'; }
                    }
                    rows.push([i+1, csvEscape(q.question), csvEscape(q.options[0]||''), csvEscape(q.options[1]||''), csvEscape(q.options[2]||''), csvEscape(q.options[3]||''), csvEscape(correctAns), csvEscape(userAns), isCorrect, stat, csvEscape(q.subject||''), csvEscape(q.topic||''), csvEscape(q.job||'')].join(','));
                });
                const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `progress_${userName.replace(/[^a-z0-9]/gi,'_')}_${new Date().toISOString().slice(0,10)}.csv`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 2000);
                toast('Backup CSV downloaded.', 'success', 3000);
            }
            function parseCSVText(text) {
                const lines = [];
                let cur = [], field = '', inQ = false;
                for (let i = 0; i < text.length; i++) {
                    const c = text[i], n = text[i+1];
                    if (c === '"') {
                        if (inQ && n === '"') { field += '"'; i++; }
                        else inQ = !inQ;
                    } else if (c === ',' && !inQ) { cur.push(field); field = ''; }
                    else if ((c === '\n' || c === '\r') && !inQ) {
                        if (c === '\r' && n === '\n') i++;
                        if (field !== '' || cur.length > 0) { cur.push(field); lines.push(cur); cur = []; field = ''; }
                    } else field += c;
                }
                if (field !== '' || cur.length > 0) { cur.push(field); lines.push(cur); }
                return lines.filter(r => r.some(x => String(x).trim() !== ''));
            }
            function restoreFromCSV(text) {
                const lines = parseCSVText(text);
                if (lines.length < 3) throw new Error('CSV is too short.');
                let metaRow = null;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i][0] === '1' && lines[i][1] !== undefined) { metaRow = lines[i]; break; }
                }
                if (!metaRow) throw new Error('No meta row found.');
                let qHeaderIdx = -1;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i][0] === 'index' && lines[i][1] === 'question') { qHeaderIdx = i; break; }
                }
                if (qHeaderIdx === -1) throw new Error('Question header not found.');
                const meta = {
                    total: parseInt(metaRow[4] || '0', 10),
                    timeLeft: parseInt(metaRow[10] || '0', 10),
                    currentQ: parseInt(metaRow[11] || '0', 10),
                    submitted: metaRow[12] === '1',
                    finished: metaRow[13] === '1',
                    jobs: (metaRow[14] || '').split(' | ').filter(Boolean),
                    subjects: (metaRow[15] || '').split(' | ').filter(Boolean)
                };
                if (!questions.length) throw new Error('Load the quiz first, then restore.');
                if (questions.length < meta.total) throw new Error(`Backup has ${meta.total} questions, quiz has ${questions.length}. Reload quiz first.`);
                const qRows = [];
                for (let i = qHeaderIdx + 1; i < lines.length; i++) {
                    if (lines[i][0] && lines[i][1]) qRows.push(lines[i]);
                }
                if (!qRows.length) throw new Error('No question rows found.');
                const byQuestion = new Map();
                qRows.forEach(r => {
                    const qText = (r[1] || '').trim();
                    const userAnsText = (r[7] || '').trim();
                    if (qText) byQuestion.set(qText, { userAnsText });
                });
                let restoredCount = 0, correctRestored = 0, wrongRestored = 0;
                questions.forEach((q, i) => {
                    const match = byQuestion.get((q.question || '').trim());
                    if (!match) return;
                    const { userAnsText } = match;
                    if (userAnsText) {
                        const idx = q.options.findIndex(o => (o || '').trim() === userAnsText);
                        if (idx !== -1) {
                            answers[i] = idx;
                            locked[i] = true;
                            if (q.correct !== -1 && idx === q.correct) { status[i] = true; correctRestored++; }
                            else { status[i] = false; wrongRestored++; }
                            restoredCount++;
                        }
                    } else { answers[i] = null; locked[i] = false; status[i] = null; }
                });
                if (meta.timeLeft > 0) timeLeft = meta.timeLeft;
                if (meta.currentQ >= 0 && meta.currentQ < questions.length) currentQ = meta.currentQ;
                submitted = !!meta.submitted;
                finished = !!meta.finished;
                if (meta.jobs.length) selJobs = meta.jobs;
                if (meta.subjects.length) selSubjs = meta.subjects;
                updateTimerDisplay();
                renderQuestion();
                renderDots(currentQ);
                updateOverview();
                updateProgress();
                if (finished || submitted) showResult();
                saveState();
                return { restoredCount, correctRestored, wrongRestored };
            }

            // ---------- LOAD PAGE INTO STAGE ----------
            function loadPage(pageId) {
                const stage = $('pageStage');
                if (!stage) return;

                // Hide all existing frames
                document.querySelectorAll('.page-frame').forEach(el => {
                    el.style.display = 'none';
                    el.classList.remove('active');
                });

                // Remove any existing frame for this page if it exists
                const existingFrame = document.querySelector(`.page-frame[data-page-id="${pageId}"]`);
                if (existingFrame) existingFrame.remove();

                // Create new frame
                const wrap = document.createElement('div');
                wrap.className = 'page-frame active';
                wrap.dataset.pageId = pageId;
                wrap.style.position = 'relative';
                wrap.style.minHeight = 'calc(100vh - 100px)';
                wrap.style.opacity = '1';
                wrap.style.pointerEvents = 'auto';
                wrap.style.display = 'block';

                // Inject appropriate HTML
                let html = '';
                if (pageId === 'login') html = injectLoginPage();
                else if (pageId === 'schedule') html = injectSchedulePage();
                else if (pageId === 'syllabus') html = injectSyllabusPage();
                else if (pageId === 'eligibility') html = injectEligibilityPage();
                else if (pageId === 'edu') html = injectEduPage();

                wrap.innerHTML = html;

                if (pageId === 'login') initLoginPage(wrap);
                else if (pageId === 'schedule') initSchedulePage(wrap);

                else if (pageId === 'eligibility') initEligibilityPage(wrap);
                else if (pageId === 'edu') initEduPage(wrap);
