<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9">
<title>Self Learners</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
:root{--b:#0ea5e9;--d:#0284c7;--n:#0a1e3f;--l:#e2e8f0;--g:#059669;--r:#dc2626;--y:#f5b800;--bg:linear-gradient(135deg,#0ea5e9,#0284c7)}
body{background:#f4f6fa;display:flex;justify-content:center;min-height:100vh;color:#0f1419}
.w{width:100%;max-width:920px;padding:16px}
.top,.card{background:#fff;border:1px solid var(--l)}
.top{position:sticky;top:0;z-index:10;border-radius:16px;padding:10px 14px;margin-bottom:12px;box-shadow:0 8px 20px -6px rgba(10,30,63,.12);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card{border-radius:20px;padding:22px;box-shadow:0 20px 40px -12px rgba(10,30,63,.18)}
.tt{font-weight:800;color:var(--n);font-size:.95rem;flex:1;min-width:120px}
.rt{display:flex;gap:6px;align-items:center}
.pill,.tmr{font-weight:800;font-size:.62rem;padding:.28rem .6rem;border-radius:9999px}
.pill{background:#e0f2fe;color:var(--d);border:1px solid #7dd3fc}
.tmr{background:var(--bg);color:#fff}
.dots{background:0;border:0;width:32px;height:32px;border-radius:50%;cursor:pointer;color:#475569;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.dots:hover{background:#f1f5f9}
.dots span{width:4px;height:4px;border-radius:50%;background:currentColor}
.q{font-weight:700;font-size:1.1rem;color:var(--n);line-height:1.55;margin-bottom:16px;cursor:pointer;padding-right:22px;position:relative}
.q:hover{color:var(--d);text-decoration:underline;text-underline-offset:3px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--l);border-radius:9999px;padding:14px 18px;font-size:.95rem;font-weight:600;cursor:pointer;margin-bottom:10px;transition:.15s;color:#0f1419}
.opt:hover:not(:disabled){background:#e0f2fe;border-color:var(--b)}
.opt:disabled{cursor:default}
.k{background:#e0f2fe;color:var(--d);font-weight:800;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt.ok{background:#d1fae5;border-color:var(--g)}.opt.ok .k{background:var(--g);color:#fff}
.opt.bad{background:#fee2e2;border-color:var(--r)}.opt.bad .k{background:var(--r);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--l)}
.chip{font-size:.68rem;font-weight:700;padding:.3rem .7rem;border-radius:9999px}
.chip.subject{background:#e0f2fe;color:var(--d);border:1px solid #7dd3fc}
.chip.topic{background:#fff7dd;color:#92400e;border:1px solid #fcd34d}
.chip.job{background:var(--n);color:#f5b800}
.inv-msg{margin-top:10px;padding:10px 14px;background:#fee2e2;border:1.5px solid var(--r);border-left:5px solid var(--r);border-radius:12px;color:var(--r);font-weight:800;font-size:.85rem}
.bar{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{background:var(--bg);color:#fff;border:0;font-weight:700;font-size:.9rem;padding:.7rem 1.4rem;border-radius:9999px;cursor:pointer;transition:.15s;box-shadow:0 4px 12px rgba(2,132,199,.25)}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-o{background:#fff;color:var(--d);border:1.5px solid #bae6fd}
.btn-g,.dl{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 12px rgba(5,150,105,.3)}
.load{padding:60px;text-align:center;color:#475569;font-weight:600}
.grid,.stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.dot{width:28px;height:28px;border-radius:50%;background:#f4f6fa;border:2px solid transparent;font-size:.68rem;font-weight:700;color:#94a3b8;cursor:pointer;transition:.15s}
.dot:hover{transform:scale(1.12)}
.dot.ok{background:var(--g);color:#fff}.dot.bad{background:var(--r);color:#fff}.dot.inv{background:var(--y);color:var(--n)}
.dot.cur{border-color:var(--d);transform:scale(1.2);box-shadow:0 0 0 3px rgba(2,132,199,.2)}
.stat{font-size:.68rem;font-weight:800;padding:.32rem .7rem;border-radius:9999px;border:1.5px solid;background:#f8fafc;border-color:#cbd5e1;color:#475569}
.stat .n{font-weight:900;font-size:.75rem}
.stat.ok{background:#d1fae5;border-color:#10b981;color:var(--g)}
.stat.bad{background:#fee2e2;border-color:#fca5a5;color:var(--r)}
.stat.inv{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.ov{position:fixed;inset:0;background:rgba(10,30,63,.55);backdrop-filter:blur(6px);z-index:900;opacity:0;pointer-events:none;transition:.25s}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(92vw,400px);background:#fff;z-index:901;transform:translateX(105%);transition:transform .35s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px -12px rgba(10,30,63,.35)}
.dr.on{transform:none}
.dh{padding:14px 18px;background:var(--bg);color:#fff;display:flex;justify-content:space-between;align-items:center}
.dh h3{font-size:1rem;font-weight:800}
.dc{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-weight:800}
.db{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.fl{font-size:.72rem;font-weight:800;color:var(--n);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:block}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.mbtn{flex:1;padding:.6rem .5rem;border:1.5px solid var(--l);border-radius:12px;background:#fff;cursor:pointer;font-weight:700;font-size:.78rem;color:#475569;transition:.15s;min-width:0}
.mbtn:hover{border-color:var(--b);color:var(--d)}
.mbtn.on{background:var(--bg);color:#fff;border-color:var(--d)}
.fi{width:100%;padding:.7rem .9rem;border:1.5px solid var(--l);border-radius:12px;font-size:.85rem;outline:0;background:#f8fafc}
.fi:focus{border-color:var(--b);background:#fff;box-shadow:0 0 0 3px rgba(14,165,233,.12)}
.chbx,.cr{display:flex;flex-wrap:wrap;gap:6px}.chbx{margin-bottom:6px}.chbx:empty{display:none}
.cc{display:inline-flex;align-items:center;gap:4px;background:var(--b);color:#fff;font-size:.68rem;font-weight:700;padding:.25rem .55rem;border-radius:9999px}
.cc button{background:0;border:0;color:#fff;font-size:.85rem;cursor:pointer;font-weight:800}
.dd{position:relative}
.ddb{border:1.5px solid var(--l);border-radius:12px;padding:.55rem .7rem;min-height:42px;cursor:pointer;display:flex;align-items:center;font-size:.82rem;font-weight:600;color:#475569}
.ddb:hover{border-color:var(--b)}
.ar{margin-left:auto;font-size:.6rem;color:#94a3b8;transition:.2s}.dd.on .ar{transform:rotate(180deg)}
.ddm{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--l);border-radius:12px;box-shadow:0 16px 40px -10px rgba(10,30,63,.25);max-height:240px;overflow-y:auto;padding:.35rem;z-index:10;display:none}
.dd.on .ddm{display:block}
.ddi{padding:.5rem .7rem;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:.5rem}
.ddi:hover{background:#e0f2fe;color:var(--d)}
.ddi.sel{background:var(--b);color:#fff}
.ck{width:16px;height:16px;border:1.5px solid #cbd5e1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0}
.ddi.sel .ck{background:#fff;color:var(--d);border-color:#fff}
.dde{padding:.8rem;text-align:center;font-size:.78rem;color:#94a3b8;font-style:italic}
.cb{padding:.5rem .85rem;border:1.5px solid var(--l);border-radius:9999px;background:#fff;cursor:pointer;font-weight:700;font-size:.78rem;color:#475569;transition:.15s}
.cb:hover{border-color:var(--b);color:var(--d)}
.cb.on{background:var(--bg);color:#fff;border-color:var(--d)}
.cb.inv.on{background:linear-gradient(135deg,#f5b800,#d99e00);border-color:#d99e00;color:var(--n)}
.cb.vf.on{background:linear-gradient(135deg,#059669,#047857);border-color:#047857;color:#fff}
.cb.nvf.on{background:linear-gradient(135deg,#dc2626,#991b1b);border-color:#991b1b;color:#fff}
.drow{display:flex;gap:8px;margin-top:4px}
.dl{flex:1;padding:.85rem;border:0;border-radius:9999px;font-weight:800;font-size:.9rem;color:#fff;cursor:pointer}
.drs{padding:.85rem 1rem;border:1.5px solid var(--l);border-radius:9999px;font-weight:800;font-size:.9rem;color:#475569;background:#fff;cursor:pointer}
.drs:hover{border-color:var(--r);color:var(--r);background:#fee2e2}
.list{display:flex;flex-direction:column;gap:.75rem;margin-top:14px}
.li{background:#f8fafc;border:1.5px solid var(--l);border-left:4px solid var(--b);border-radius:14px;padding:.85rem 1rem;position:relative;cursor:pointer;transition:.15s}
.li:hover{background:#e0f2fe;border-left-color:var(--y)}
.li .lq{font-weight:700;color:var(--n);font-size:.9rem;line-height:1.5;padding-right:1.4rem}
.li .lq .sn{background:var(--b);color:#fff;font-weight:800;font-size:.68rem;padding:2px 8px;border-radius:9999px;margin-right:.5rem;display:inline-block}
.li .lo{margin-top:.5rem;display:flex;flex-direction:column;gap:.3rem}
.li .lop{display:flex;gap:.4rem;font-size:.82rem;line-height:1.5;padding:.4rem .6rem;background:#fff;border:1px solid var(--l);border-radius:8px;color:#475569}
.li .lop .lt{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#e0f2fe;color:var(--d);font-weight:800;font-size:.68rem;display:flex;align-items:center;justify-content:center}
.li .lop.ok{background:#d1fae5;border-color:var(--g);color:#065f46;font-weight:700}
.li .lop.ok .lt{background:var(--g);color:#fff}
.li .lm{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.3rem;font-size:.64rem;font-weight:700}
.li .lm .mc{padding:.2rem .55rem;border-radius:9999px;background:#fff;border:1px solid var(--l);color:#475569}
.li .lm .ms{background:#e0f2fe;color:var(--d)}
.li .lm .mt{background:#fff7dd;color:#92400e}
.li .lm .mj{background:var(--n);color:#f5b800}
.li.fact{border-left-color:var(--y)}
.li.fact .ans{margin-top:.5rem;padding-top:.5rem;border-top:1px dashed var(--l);font-size:.83rem;color:#047857;font-weight:600;line-height:1.5}
.li.fact .ans.empty{color:#94a3b8;font-style:italic;font-weight:500}
/* Very small verify icons (12px) */
.vfy{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#fff;line-height:1;box-shadow:0 0 0 1.5px #fff}
.vfy.t{background:var(--b)}.vfy.f{background:var(--r)}.vfy.u{background:#94a3b8}
/* MCQ question small verify badge */
.qvfy{position:absolute;top:2px;right:0;width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#fff;line-height:1}
.qvfy.t{background:var(--b)}.qvfy.f{background:var(--r)}.qvfy.u{background:#94a3b8}
</style></head>
<body>
<div class="w">
<div class="top"><div class="tt" id="tt">Loading…</div><div class="rt"><span class="pill" id="cnt">0/0</span><span class="tmr" id="tmr">00:00</span><button class="dots" id="dotsBtn"><span></span><span></span><span></span></button></div></div>
<div class="card"><div id="bd"><div class="load">🔄 Loading…</div></div><div class="grid" id="gd"></div><div class="stats" id="st"></div></div>
</div>
<div class="ov" id="ov"></div><aside class="dr" id="dr"></aside>

<script>
const U='https://docs.google.com/spreadsheets/d/e/2PACX-1vQyB_I39SsLmQC5C8O1KkzZEUgFPAIJQ95k0vFj9M-HX8vI9hsdLh0GFYYO8O1QFnvP4vWkAh3nmbd3/pub?output=csv';
const UF='https://docs.google.com/spreadsheets/d/e/2PACX-1vTRO-FPemOqN9exgEgDyt_x1KfNgTAxf0mOeg16c7THfRaaHg0mbgwuTrObcbIwJKSx2dWtrQCNcrCV/pub?output=csv';
let all=[],qs=[],ans=[],cur=0,time=0,tmr,total=0,pick=20,invMode=0,mode='mcq';
let facts=[],factsLoaded=0,fPick=20,fVerify='all';
const S={job:new Set,subject:new Set,topic:new Set},F={job:['💼 Jobs','All jobs'],subject:['📚 Subjects','All subjects'],topic:['🏷️ Topics','All topics']};
const $=i=>document.getElementById(i),
cl=s=>String(s??'').replace(/[\u200B-\u200D\uFEFF\u00A0]/g,' ').replace(/\s+/g,' ').trim(),
nk=s=>cl(s).toLowerCase(),
TC=s=>cl(s).replace(/(^|\s)\S/g,m=>m.toUpperCase()),
shuf=a=>{a=[...a];for(let i=a.length;i>1;){let j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a},
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
isSp=o=>/all\s+of\s+(the\s+)?above|none\s+of\s+(the\s+)?above|above\s+all|\bboth\b|^\s*none\s*$|all\s+of\s+these/i.test(cl(o)),
shufOpts=(o,ci)=>{
  const idx=[...o.keys()];
  const fixed=idx.filter(i=>isSp(o[i]));
  const free=shuf(idx.filter(i=>!isSp(o[i])));
  const order=new Array(o.length);
  fixed.forEach(i=>order[i]=i);
  let p=0;
  for(let i=0;i<order.length;i++) if(order[i]===undefined) order[i]=free[p++];
  return{opts:order.map(i=>o[i]),correct:ci<0?-1:order.indexOf(ci)};
},
shufCat=l=>{const b={};l.forEach(x=>(b[[x.job,x.subject,x.topic].map(nk).join('|')]??=[]).push(x));return shuf(Object.values(b)).flatMap(g=>shuf(g))},
findC=(raw,o)=>{const r=cl(raw);if(!r)return -1;const i=o.findIndex(x=>cl(x)===r);
  return i>=0?i:/^[A-Da-d]$/.test(r)?'abcd'.indexOf(r.toLowerCase()):/^[1-4]$/.test(r)?+r-1:-1},
pCSV=l=>{const r=[];let c='',q=0;for(let i=0;i<l.length;i++){const h=l[i];
  if(q){if(h=='"'){l[i+1]=='"'?(c+='"',i++):q=0}else c+=h}
  else if(h=='"')q=1;else if(h==','){r.push(cl(c));c=''}else c+=h}
  r.push(cl(c));return r};

/* Drawer HTML — both filter sets are always rendered; we toggle visibility by mode */
$('dr').innerHTML=`<div class="dh"><h3>⚙️ Filters</h3><button class="dc" id="dc">✕</button></div><div class="db">
<div><label class="fl">📖 View Mode</label><div class="modes" id="modes">
<button class="mbtn on" data-m="mcq">📝 MCQs</button>
<button class="mbtn" data-m="solved">📖 Solved</button>
<button class="mbtn" data-m="facts">💡 Facts</button>
</div></div>
<div><label class="fl">🔍 Search</label><input class="fi" id="sq" placeholder="Search…" autocomplete="off"></div>
<div class="mcq-only">
  <div data-k="job"><label class="fl">💼 Jobs</label><div class="chbx" id="jobc"></div><div class="dd" id="jobd"><div class="ddb"><span id="jobt"></span><span class="ar">▼</span></div><div class="ddm" id="jobm"></div></div></div>
  <div data-k="subject" style="margin-top:10px"><label class="fl">📚 Subjects</label><div class="chbx" id="subjectc"></div><div class="dd" id="subjectd"><div class="ddb"><span id="subjectt"></span><span class="ar">▼</span></div><div class="ddm" id="subjectm"></div></div></div>
</div>
<div class="facts-only" style="display:none">
  <div data-k="fsubject"><label class="fl">📚 Subjects</label><div class="chbx" id="fsubjectc"></div><div class="dd" id="fsubjectd"><div class="ddb"><span id="fsubjectt"></span><span class="ar">▼</span></div><div class="ddm" id="fsubjectm"></div></div></div>
  <div data-k="ftopic" style="margin-top:10px"><label class="fl">🏷️ Topics</label><div class="chbx" id="ftopicc"></div><div class="dd" id="ftopicd"><div class="ddb"><span id="ftopict"></span><span class="ar">▼</span></div><div class="ddm" id="ftopicm"></div></div></div>
</div>
<div class="mcq-only"><label class="fl"># MCQs to load</label><div class="cr" id="cr">
${[5,10,20,100,200,0,-1].map(n=>`<button class="cb${n<0?' inv':''}" data-n="${n}">${n<0?'⚠️ Invalids':n||'All'}</button>`).join('')}
</div></div>
<div class="facts-only" style="display:none"><label class="fl"># Facts to load</label><div class="cr" id="fr">
${[10,20,100,200,0].map(n=>`<button class="cb" data-n="${n}">${n||'All'}</button>`).join('')}
<button class="cb vf" data-v="t">✔️ Verified</button>
<button class="cb nvf" data-v="f">✘️ Not Verified</button>
</div></div>
<div class="drow"><button class="dl" id="lb">🔄 Load</button><button class="drs" id="rb">⟲ Reset</button></div></div>`;

const tgl=o=>[$('ov'),$('dr')].forEach(x=>x.classList.toggle('on',o)),
setPick=n=>{pick=n<0?0:n;invMode=n<0;document.querySelectorAll('#cr .cb').forEach(b=>b.classList.toggle('on',+b.dataset.n==n))},
setFPick=n=>{fPick=n;document.querySelectorAll('#fr .cb[data-n]').forEach(b=>b.classList.toggle('on',+b.dataset.n==n))},
setFVerify=v=>{fVerify=v;document.querySelectorAll('#fr .cb[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v))};

/* Toggle filters visible by mode */
function syncDrawer(){
  document.querySelectorAll('.mcq-only').forEach(x=>x.style.display=mode==='facts'?'none':'');
  document.querySelectorAll('.facts-only').forEach(x=>x.style.display=mode==='facts'?'':'none');
  $('sq').placeholder=mode==='facts'?'Search facts…':'Search question, topic, subject…';
  $('lb').textContent=mode==='facts'?'🔄 Load Facts':(mode==='solved'?'🔄 Load Solved':'🔄 Load Quiz');
}

/* Generic multi-select menu renderer. key = Set object, itemsMap = Map(nk → label) */
function menuBox(prefix,set,label,itemsMap,onChange){
  [...set].forEach(v=>itemsMap.has(v)||set.delete(v));
  const row=(v,t)=>{const on=v?set.has(v):!set.size;return `<div class="ddi${on?' sel':''}" data-v="${v}"><span class="ck">${on?'✓':''}</span>${t}</div>`};
  $(prefix+'m').innerHTML=itemsMap.size
    ? row('',label)+[...itemsMap].sort((a,b)=>a[1].localeCompare(b[1])).map(e=>row(...e)).join('')
    : '<div class="dde">No options</div>';
  $(prefix+'t').textContent=set.size?`${set.size} selected`:label;
  $(prefix+'c').innerHTML=[...set].map(v=>`<span class="cc">${itemsMap.get(v)||v} <button data-v="${v}">×</button></span>`).join('');
  if(onChange)onChange();
}

function buildMcqMenus(){
  const jobs=new Map();
  all.forEach(x=>{const r=cl(x.job);if(r&&!jobs.has(nk(r)))jobs.set(nk(r),TC(r))});
  menuBox('job',S.job,F.job[1],jobs);
  const subs=new Map();
  (S.job.size?all.filter(x=>S.job.has(nk(x.job))):all).forEach(x=>{const r=cl(x.subject);if(r&&!subs.has(nk(r)))subs.set(nk(r),TC(r))});
  [...S.subject].forEach(v=>subs.has(v)||S.subject.delete(v));
  menuBox('subject',S.subject,F.subject[1],subs);
}

function buildFactMenus(){
  const subs=new Map(),tps=new Map();
  facts.forEach(f=>{
    const s=cl(f.subject),t=cl(f.topic);
    if(s&&!subs.has(nk(s)))subs.set(nk(s),TC(s));
    if(t&&!tps.has(nk(t)))tps.set(nk(t),TC(t));
  });
  [...S.subject].forEach(v=>subs.has(v)||S.subject.delete(v));
  [...S.topic].forEach(v=>tps.has(v)||S.topic.delete(v));
  menuBox('fsubject',S.subject,F.subject[1],subs);
  menuBox('ftopic',S.topic,F.topic[1],tps);
}

async function load(){
  try{
    const t=await(await fetch(U+'&_t='+Date.now(),{cache:'no-store'})).text();
    all=t.split('\n').filter(l=>l.trim()).slice(1).map(pCSV)
      .filter(c=>c.length>=9&&c[1]&&!['0','false','no'].includes((c[13]||'').toLowerCase()))
      .map(c=>{const o=[2,3,4,5].map(i=>c[i]||'');return{q:c[1],opts:o,correct:findC(c[6],o),topic:c[7]||'',subject:c[8]||'',job:c[10]||'',mcol:c[12]||''}});
    buildMcqMenus();apply();
  }catch(e){console.error(e);$('bd').innerHTML='<div class="load">❌ Failed to load</div>'}
}

async function loadFacts(){
  if(factsLoaded) return;
  facts=[];
  try{
    const t=await(await fetch(UF+'&_t='+Date.now(),{cache:'no-store'})).text();
    const lines=t.split('\n').filter(l=>l.trim());
    if(lines.length<2){factsLoaded=1;return}
    const H=pCSV(lines[0]).map(h=>h.toLowerCase());
    const fi=(kw,fb)=>{for(let k=0;k<H.length;k++)if(kw.some(w=>H[k].includes(w)))return k;return fb};
    const qi=fi(['question'],1),ai=fi(['answer'],2),ti=fi(['topic'],3),si=fi(['subject'],4),vi=fi(['verify','correct'],5),ci=fi(['created'],6);
    for(let i=1;i<lines.length;i++){
      const c=pCSV(lines[i]);if(!c.length)continue;
      const q=c[qi]?c[qi].trim():'';if(!q)continue;
      const v=(c[vi]||'').trim().toLowerCase();
      facts.push({q,answer:c[ai]?c[ai].trim():'',topic:c[ti]?c[ti].trim():'',subject:c[si]?c[si].trim():'',verify:v==='true'||v==='yes'||v==='1'?'t':v==='false'||v==='no'||v==='0'?'f':'u',created:c[ci]?c[ci].trim():''});
    }
    factsLoaded=1;buildFactMenus();
  }catch(e){console.error(e);factsLoaded=1}
}

function apply(){
  tgl(0);
  if(mode==='facts'){renderFacts();return}
  const q=$('sq').value.trim().toLowerCase();
  let L=invMode?all.filter(x=>x.correct<0):all.filter(x=>
    (!S.job.size||S.job.has(nk(x.job)))&&(!S.subject.size||S.subject.has(nk(x.subject)))&&
    (!q||[x.q,x.subject,x.topic,x.job,...x.opts].some(s=>s.toLowerCase().includes(q))));
  L=shufCat(L);if(pick)L=L.slice(0,pick);
  qs=L.map(x=>{const r=shufOpts(x.opts,x.correct);return{...x,opts:r.opts,correct:r.correct}});
  total=qs.length;ans=Array(total).fill(null);cur=0;time=total*60;

  if(mode==='solved'){
    $('tt').textContent='📖 Solved';
    $('cnt').textContent=total+' items';$('tmr').style.display='none';
    clearInterval(tmr);$('st').innerHTML='';$('gd').innerHTML='';
    renderSolved();return;
  }

  $('tmr').style.display='';
  $('tt').textContent=invMode?'⚠️ Invalid Questions':S.job.size?`${S.job.size} Job(s) MCQs`:'All Jobs MCQs';
  $('cnt').textContent='0/'+total;
  clearInterval(tmr);
  if(total){tmr=setInterval(tick,1000);tick();}
  go(0,1);
}
function tick(){
  $('tmr').textContent=`${String(time/60|0).padStart(2,'0')}:${String(time%60).padStart(2,'0')}`;
  if(time<=0){clearInterval(tmr);return end();}
  time--;
}
function go(i,s){cur=i;render();grid();stats();if(s)scrollTo({top:0,behavior:'smooth'})}

/* Small verify dot HTML */
function vfyBadge(v,cls='vfy'){
  const c=v==='t'?'t':v==='f'?'f':'u';
  const t=v==='t'?'✔':v==='f'?'✘':'?';
  return `<span class="${cls} ${c}">${t}</span>`;
}

/* In MCQs — small verify badge from mcol column (col M) */
function mcolBadge(x){return vfyBadge(x.mcol?'t':'u','qvfy')}

function render(){
  const x=qs[cur];if(!x){$('bd').innerHTML='<div class="load">No questions match filters</div>';return;}
  const I=x.correct<0,d=ans[cur]!=null||I,last=cur==total-1;
  const vb=mcolBadge(x);
  $('bd').innerHTML=`<div class="q" data-qi="${cur}">${vb}${cur+1}. ${x.q}</div>`+
    x.opts.map((o,i)=>`<button class="opt${d&&!I?(i==x.correct?' ok':i==ans[cur]?' bad':''):''}" data-i="${i}" ${d?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${esc(o)||'(Empty)'}</span></button>`).join('')+
    (d&&(x.subject||x.topic||x.job)?`<div class="chips">${[['subject','📚'],['topic','🏷️'],['job','💼']].map(([k,e])=>x[k]?`<span class="chip ${k}">${e} ${TC(x[k])}</span>`:'').join('')}</div>`:'')+
    (I?'<div class="inv-msg">⚠️ Invalid question — correct answer not found in options</div>':'')+
    `<div class="bar"><button class="btn btn-o" id="pv" ${cur?'':'disabled'}>◀ Back</button><button class="btn${last?' btn-g':''}" id="nx">${last?'🏁 Finish':'Next ▶'}</button></div>`;
}
function grid(){
  $('gd').innerHTML=qs.map((x,i)=>`<button class="dot${x.correct<0?' inv':ans[i]!=null?(ans[i]==x.correct?' ok':' bad'):''}${i==cur?' cur':''}" data-i="${i}">${i+1}</button>`).join('');
}
function stats(){
  let k=0,w=0,p=0,v=0;
  qs.forEach((x,i)=>x.correct<0?v++:ans[i]==null?p++:ans[i]==x.correct?k++:w++);
  $('st').innerHTML=`<span class="stat ok">🎯 Correct <span class="n">${k}</span></span><span class="stat bad">❌ Wrong <span class="n">${w}</span></span><span class="stat">⏳ Pending <span class="n">${p}</span></span>`+(v?`<span class="stat inv">⚠️ Invalid <span class="n">${v}</span></span>`:'');
}
function end(){
  clearInterval(tmr);
  const r=qs.filter((x,i)=>ans[i]===x.correct).length,p=total?Math.round(r/total*100):0;
  $('bd').innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:3rem;margin-bottom:8px">${r==total?'🌟':p>=70?'👏':'💪'}</div><div style="font-size:2.6rem;font-weight:900;color:#0284c7">${r} / ${total}</div><div style="color:#475569;margin:10px 0 20px;font-weight:600">${r==total?'Perfect score!':p>=70?'Great job!':'Keep practicing!'} — ${p}% correct</div><button class="btn" onclick="location.reload()">⟳ Try again</button></div>`;
  $('gd').innerHTML=$('st').innerHTML='';
}

/* Solved — verify badge from mcol too */
function renderSolved(){
  if(!qs.length){$('bd').innerHTML='<div class="load">No questions match filters</div>';return}
  const L=['A','B','C','D'];
  $('bd').innerHTML='<div class="list">'+qs.map((x,i)=>{
    const meta=[x.subject&&`<span class="mc ms">📚 ${esc(TC(x.subject))}</span>`,x.topic&&`<span class="mc mt">🏷️ ${esc(TC(x.topic))}</span>`,x.job&&`<span class="mc mj">💼 ${esc(TC(x.job))}</span>`].filter(Boolean).join('');
    return `<div class="li" data-qi="${i}">${mcolBadge(x)}<div class="lq"><span class="sn">${i+1}</span>${esc(x.q)}</div>
      <div class="lo">${x.opts.map((o,j)=>`<div class="lop${j==x.correct?' ok':''}"><span class="lt">${L[j]}</span><span>${esc(o)||'(Empty)'}</span></div>`).join('')}</div>
      ${meta?`<div class="lm">${meta}</div>`:''}</div>`;
  }).join('')+'</div>';
}

function renderFacts(){
  $('tmr').style.display='none';clearInterval(tmr);$('gd').innerHTML='';$('st').innerHTML='';
  $('tt').textContent='💡 Facts';
  if(!factsLoaded){$('bd').innerHTML='<div class="load">🔄 Loading facts…</div>';loadFacts().then(()=>{buildFactMenus();renderFacts()});return}
  const q=$('sq').value.trim().toLowerCase();
  let L=facts.filter(f=>
    (!S.subject.size||S.subject.has(nk(f.subject)))&&
    (!S.topic.size||S.topic.has(nk(f.topic)))&&
    (!q||[f.q,f.answer,f.subject,f.topic].some(s=>s.toLowerCase().includes(q))));
  if(fVerify==='t')L=L.filter(f=>f.verify==='t');
  else if(fVerify==='f')L=L.filter(f=>f.verify!=='t');
  if(fPick)L=L.slice(0,fPick);
  $('cnt').textContent=L.length+' facts';
  if(!L.length){$('bd').innerHTML='<div class="load">No facts match</div>';return}
  $('bd').innerHTML='<div class="list">'+L.map((f,i)=>{
    const meta=[f.subject&&`<span class="mc ms">📚 ${esc(TC(f.subject))}</span>`,f.topic&&f.topic!==f.subject&&`<span class="mc mt">🏷️ ${esc(TC(f.topic))}</span>`].filter(Boolean).join('');
    return `<div class="li fact" data-fi="${i}">${vfyBadge(f.verify,'vfy')}
      <div class="lq"><span class="sn">${i+1}</span>${esc(f.q)}</div>
      <div class="ans${f.answer?'':' empty'}"><strong>Answer:</strong> ${esc(f.answer)||'—'}</div>
      ${meta?`<div class="lm">${meta}</div>`:''}</div>`;
  }).join('')+'</div>';
}

function gsearch(parts){
  window.open('https://www.google.com/search?q='+encodeURIComponent(parts.filter(Boolean).join(' ')),'_blank');
}

document.onclick=e=>{
  const t=e.target,c=s=>t.closest(s);
  const dd=c('.dd');
  document.querySelectorAll('.dd.on').forEach(x=>x!=dd&&x.classList.remove('on'));
  if(c('.ddb'))dd.classList.toggle('on');
  const it=c('.ddi,.cc button');
  if(it){
    const sec=c('[data-k]');
    if(sec){
      const k=sec.dataset.k;
      let set,rebuild;
      if(k==='job'){set=S.job;rebuild=buildMcqMenus}
      else if(k==='subject'){set=S.subject;rebuild=buildMcqMenus}
      else if(k==='fsubject'){set=S.subject;rebuild=buildFactMenus}
      else if(k==='ftopic'){set=S.topic;rebuild=buildFactMenus}
      const v=it.dataset.v;
      !v?set.clear():set.has(v)?set.delete(v):set.add(v);
      rebuild();
    }
  }
  const cn=c('#cr .cb');
  if(cn)setPick(+cn.dataset.n);
  const fn=c('#fr .cb[data-n]');
  if(fn)setFPick(+fn.dataset.n);
  const fv=c('#fr .cb[data-v]');
  if(fv)setFVerify(fVerify===fv.dataset.v?'all':fv.dataset.v);
  if(c('.mbtn')){mode=c('.mbtn').dataset.m;document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));syncDrawer();if(mode==='facts')loadFacts().then(()=>{buildFactMenus();renderFacts()});else apply()}
  if(c('#dotsBtn'))tgl(1);
  if(c('#dc,#ov'))tgl(0);
  if(c('#lb'))apply();
  if(c('#rb')){
    S.job.clear();S.subject.clear();S.topic.clear();
    $('sq').value='';setPick(20);setFPick(20);setFVerify('all');
    buildMcqMenus();if(factsLoaded)buildFactMenus();
  }
  const o=c('.opt');
  if(o&&!o.disabled){ans[cur]=+o.dataset.i;$('cnt').textContent=ans.filter(a=>a!=null).length+'/'+total;go(cur);}

  if(c('.q')){const x=qs[+c('.q').dataset.qi];
    const opts=x.opts.map((o,i)=>`${'ABCD'[i]}) ${o}`).join(' ');
    gsearch([x.q,opts,x.topic&&`Topic: ${x.topic}`,x.subject&&`Subject: ${x.subject}`,x.job&&`Job: ${x.job}`]);return;}
  if(c('.li')&&mode==='solved'){const x=qs[+c('.li').dataset.qi];
    const opts=x.opts.map((o,i)=>`${'ABCD'[i]}) ${o}`).join(' ');
    gsearch([x.q,opts,x.topic&&`Topic: ${x.topic}`,x.subject&&`Subject: ${x.subject}`,x.job&&`Job: ${x.job}`]);return;}
  if(c('.li')&&mode==='facts'){const f=facts[+c('.li').dataset.fi];
    gsearch([f.q,f.subject&&`Subject: ${f.subject}`,f.topic&&`Topic: ${f.topic}`]);return;}

  if(c('#pv'))go(cur-1);
  if(c('#nx'))cur==total-1?end():go(cur+1);
  if(c('.dot'))go(+c('.dot').dataset.i,1);
};

setPick(20);setFPick(20);setFVerify('all');syncDrawer();load();
</script>
</body></html>
