<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Reader & Sheet Writer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white shadow-xl rounded-2xl w-full max-w-lg p-8 border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Configurable Sheet Writer</h2>
        <p class="text-sm text-gray-500 mb-6">Reads from your configured CSV API and writes form entries to your Google Sheet.</p>

        <!-- Form Section -->
        <form id="dataForm" class="space-y-4 mb-8">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                <input type="text" id="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">
                Write to Sheet
            </button>
        </form>

        <!-- Status Box -->
        <div id="statusMessage" class="hidden mb-6 text-sm p-3 rounded-lg text-center"></div>

        <!-- CSV Data Preview Section -->
        <div class="border-t pt-4">
            <h3 class="text-sm font-semibold text-gray-700 mb-2">Data Read from CSV API:</h3>
            <div id="csvOutput" class="bg-gray-50 p-3 rounded-lg text-xs text-gray-600 max-h-40 overflow-y-auto border border-gray-200">
                Loading CSV data...
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION SECTION (EDIT HERE)
        // ==========================================
        const CONFIG = {
            csvApiUrl: "YOUR_CSV_FILE_API_URL_HERE",       // Paste your CSV API link here
            sheetUrl: "YOUR_GOOGLE_SHEET_URL_HERE",        // Paste your Google Sheet URL here for reference
            appScriptUrl: "YOUR_APPS_SCRIPT_WEB_APP_URL"   // Paste your deployed Apps Script Web App URL here
        };

        // 1. Read data from the CSV API on page load
        async function loadCsvData() {
            const outputDiv = document.getElementById('csvOutput');
            try {
                const response = await fetch(CONFIG.csvApiUrl);
                const csvText = await response.text();
                
                // Simple display of the fetched CSV content
                outputDiv.textContent = csvText.slice(0, 500) + (csvText.length > 500 ? '...' : '');
            } catch (error) {
                console.error("Error reading CSV:", error);
                outputDiv.textContent = "Failed to load data from CSV API.";
            }
        }

        // 2. Write form data to Google Sheet via Apps Script backend
        const form = document.getElementById('dataForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = "Writing...";
            statusMessage.classList.add('hidden');

            const payload = {
                targetSheetUrl: CONFIG.sheetUrl, // Passing sheet URL if needed by backend logic
                name: document.getElementById('name').value,
                email: document.getElementById('email').value
            };

            try {
                await fetch(CONFIG.appScriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                statusMessage.textContent = "Success! Data written to sheet.";
                statusMessage.className = "mb-6 text-sm p-3 rounded-lg text-center bg-green-50 text-green-700 border border-green-200 block";
                form.reset();
            } catch (error) {
                console.error("Error writing data:", error);
                statusMessage.textContent = "Failed to write data.";
                statusMessage.className = "mb-6 text-sm p-3 rounded-lg text-center bg-red-50 text-red-700 border border-red-200 block";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Write to Sheet";
            }
        });

        // Run CSV reader on load
        loadCsvData();
    </script>
</body>
</html>
