<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self Learners · Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* ... (all previous styles remain the same up to .brand) ... */
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: #eef4f9;
      border: 2px solid #dceaf3;
      flex-shrink: 0;
    }

    .brand-logo-placeholder {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #eef4f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #1a5a7a;
      border: 2px solid #dceaf3;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-text h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(145deg, #0b2a3b, #1b5a7a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
    }

    .brand-text small {
      background: #dceaf3;
      font-size: 0.65rem;
      font-weight: 600;
      color: #1a5a7a;
      padding: 0.05rem 0.9rem;
      border-radius: 40px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      align-self: flex-start;
    }

    /* ... (rest of styles remain the same) ... */
  </style>
</head>
<body>

<div class="quiz-wrapper" id="quizApp">
  <!-- header -->
  <div class="top-bar">
    <div class="brand">
      <!-- Logo will be inserted here by JavaScript -->
      <div id="logoContainer"></div>
      <div class="brand-text">
        <h1 id="quizTitle">Loading...</h1>
        <small id="quizSubtitle">Self Learners</small>
      </div>
    </div>
    <div class="time-score">
      <div class="timer" id="timerDisplay">⏱️ 00:00</div>
      <div class="score-pill">🎯 <span id="scoreNumber">0</span></div>
    </div>
  </div>

  <!-- rest of the HTML remains the same -->
  <div id="quizContent">
    <!-- ... -->
  </div>
</div>

<script>
  (function() {
    // ----- CONFIGURATION -----
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/1snRQ9V8cBfl9lOa2rJ9K26jXqe5FSgUdc4gbKbAh3ZU/export?format=csv&gid=1660453242';
    
    // ----- LOGO CONFIGURATION -----
    // Option 1: Direct image URL (if you can host it publicly)
    // const LOGO_URL = 'https://your-public-image-host.com/logo.png';
    
    // Option 2: Use Google Drive embed (requires sharing settings to "Anyone with the link")
    // const LOGO_URL = 'https://drive.google.com/uc?export=view&id=1HSG8m9oD2294rVVNOYekkbBJZlBKLfVL';
    
    // Option 3: Leave as placeholder (default)
    const LOGO_URL = null; // Set to null to use placeholder

    // ----- STATE -----
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let isAnswered = false;
    let quizCompleted = false;
    let quizTimedOut = false;
    let answerStatus = [];
    let timerInterval = null;
    let timeRemaining = 0;
    let totalQuestions = 0;
    let quizTitleText = 'Quiz';
    let quizSubtitleText = 'Self Learners';

    // DOM refs
    const progressFill = document.getElementById('progressFill');
    const qNumber = document.getElementById('qNumber');
    const qCategory = document.getElementById('qCategory');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackMessage = document.getElementById('feedbackMessage');
    const nextBtn = document.getElementById('nextBtn');
    const restartFromResult = document.getElementById('restartFromResult');
    const scoreNumber = document.getElementById('scoreNumber');
    const questionArea = document.getElementById('questionArea');
    const resultArea = document.getElementById('resultArea');
    const finalScore = document.getElementById('finalScore');
    const resultMessage = document.getElementById('resultMessage');
    const dotGrid = document.getElementById('dotGrid');
    const timerDisplay = document.getElementById('timerDisplay');
    const quizTitle = document.getElementById('quizTitle');
    const quizSubtitle = document.getElementById('quizSubtitle');
    const logoContainer = document.getElementById('logoContainer');
    const doneCount = document.getElementById('doneCount');
    const activeCount = document.getElementById('activeCount');
    const pendingCount = document.getElementById('pendingCount');
    const noAnswerCount = document.getElementById('noAnswerCount');

    // ----- LOGO RENDERER -----
    function renderLogo() {
      logoContainer.innerHTML = '';
      
      if (LOGO_URL) {
        const img = document.createElement('img');
        img.className = 'brand-logo';
        img.src = LOGO_URL;
        img.alt = 'Logo';
        img.onerror = function() {
          // If image fails to load, show placeholder
          this.replaceWith(createPlaceholder());
        };
        logoContainer.appendChild(img);
      } else {
        logoContainer.appendChild(createPlaceholder());
      }
    }

    function createPlaceholder() {
      const div = document.createElement('div');
      div.className = 'brand-logo-placeholder';
      div.textContent = '📘';
      return div;
    }

    // ----- FETCH & PARSE CSV -----
    function fetchQuestions() {
      questionText.textContent = '📥 Fetching questions from spreadsheet...';
      feedbackMessage.textContent = '⏳ Loading...';
      
      // Render logo immediately
      renderLogo();

      fetch(CSV_URL)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.text();
        })
        .then(csvText => {
          const parsed = parseCSV(csvText);
          if (parsed.length === 0) {
            throw new Error('No data found in CSV');
          }
          questions = parsed;
          totalQuestions = questions.length;
          answerStatus = new Array(questions.length).fill(null);
          
          // Update title from C2 (already parsed)
          updateTitle();
          startQuiz();
        })
        .catch(error => {
          console.error('Error loading CSV:', error);
          questionText.textContent = '❌ Failed to load questions. Please check the CSV link.';
          feedbackMessage.textContent = '⚠️ Error: ' + error.message;
          feedbackMessage.style.background = '#f5dddd';
        });
    }

    function parseCSV(text) {
      const lines = text.split('\n').filter(line => line.trim() !== '');
      if (lines.length < 2) return [];

      // Try to extract title from C2 (row 2, column 3)
      // In CSV, row 2 is index 1, column 3 is index 2
      if (lines.length > 1) {
        const secondRow = parseCSVLine(lines[1]);
        if (secondRow.length > 2) {
          quizTitleText = secondRow[2] ? secondRow[2].trim() : 'Quiz';
        }
      }

      // Try to extract sheet name from first line
      const firstLine = lines[0];
      if (firstLine.includes('quiz_1') || firstLine.includes('Sheet')) {
        quizSubtitleText = firstLine.replace(/[",]/g, '').trim() || 'Self Learners';
      }

      const result = [];

      // Start from row 3 (index 2) for actual questions
      for (let i = 2; i < lines.length; i++) {
        const cols = parseCSVLine(lines[i]);
        if (cols.length < 6) continue;

        const question = cols[4] ? cols[4].trim() : '';
        if (!question) continue;

        const options = [
          cols[5] ? cols[5].trim() : '',
          cols[6] ? cols[6].trim() : '',
          cols[7] ? cols[7].trim() : '',
          cols[8] ? cols[8].trim() : ''
        ];

        const correctAnswer = cols[9] ? cols[9].trim() : '';

        let correctIndex = -1;
        if (correctAnswer) {
          for (let j = 0; j < options.length; j++) {
            if (options[j] === correctAnswer) {
              correctIndex = j;
              break;
            }
          }
        }

        result.push({
          question: question,
          options: options,
          correct: correctIndex,
          correctText: correctAnswer || 'No answer in db'
        });
      }

      return result;
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuotes) {
          if (ch === '"' && (i + 1 < line.length && line[i + 1] === '"')) {
            current += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            current += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            result.push(current.trim());
            current = '';
          } else {
            current += ch;
          }
        }
      }
      result.push(current.trim());
      return result;
    }

    function updateTitle() {
      quizTitle.textContent = quizTitleText || 'Quiz';
      quizSubtitle.textContent = quizSubtitleText || 'Self Learners';
    }

    // ----- TIMER -----
    function startTimer() {
      timeRemaining = totalQuestions * 60;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timeRemaining--;
        updateTimerDisplay();

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          handleTimeout();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timeRemaining / 60);
      const secs = timeRemaining % 60;
      timerDisplay.textContent = `⏱️ ${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      timerDisplay.classList.remove('warning', 'danger');
      if (timeRemaining < 60) {
        timerDisplay.classList.add('danger');
      } else if (timeRemaining < 300) {
        timerDisplay.classList.add('warning');
      }
    }

    function handleTimeout() {
      quizTimedOut = true;
      quizCompleted = true;
      
      document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
      
      feedbackMessage.textContent = '⏰ Time is up! Quiz automatically submitted.';
      feedbackMessage.style.background = '#fff3cd';
      nextBtn.disabled = true;

      setTimeout(() => {
        showResult();
      }, 1500);
    }

    // ----- QUIZ FUNCTIONS (same as before) -----
    function startQuiz() {
      if (questions.length === 0) {
        questionText.textContent = '⚠️ No questions found in the spreadsheet.';
        return;
      }

      currentIndex = 0;
      score = 0;
      isAnswered = false;
      quizCompleted = false;
      quizTimedOut = false;
      answerStatus = new Array(questions.length).fill(null);
      scoreNumber.textContent = '0';
      resultArea.style.display = 'none';
      questionArea.style.display = 'block';
      
      renderQuestion(0);
      renderDots();
      updateLegendCounts();
      startTimer();
    }

    function renderQuestion(index) {
      const q = questions[index];
      if (!q) return;

      const total = questions.length;
      const progressPercent = ((index) / total) * 100;
      progressFill.style.width = `${progressPercent}%`;

      qNumber.textContent = `QUESTION ${index+1} OF ${total}`;
      qCategory.textContent = `📚 Question ${index+1}`;
      questionText.textContent = q.question;

      const letters = ['A', 'B', 'C', 'D'];
      optionsContainer.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="letter">${letters[idx]}</span> ${opt || '(Empty)'}`;
        btn.dataset.index = idx;
        btn.addEventListener('click', () => handleOptionClick(idx));
        if (!opt || quizTimedOut) {
          btn.style.opacity = '0.5';
          btn.style.cursor = 'not-allowed';
        }
        optionsContainer.appendChild(btn);
      });

      if (q.correct === -1) {
        feedbackMessage.innerHTML = `⚠️ No answer in db <span class="no-answer">(Column J doesn't match any choice)</span>`;
        feedbackMessage.style.background = '#fff3cd';
        if (!quizTimedOut && !quizCompleted) {
          setTimeout(() => {
            if (!isAnswered && !quizCompleted) {
              answerStatus[currentIndex] = null;
              isAnswered = true;
              nextBtn.disabled = false;
              renderDots();
              updateLegendCounts();
              feedbackMessage.innerHTML = `⏭️ Skipped (no answer in db) <span class="no-answer">Moving to next question</span>`;
              feedbackMessage.style.background = '#e9ecef';
            }
          }, 800);
        }
      } else {
        if (!quizTimedOut && !quizCompleted) {
          feedbackMessage.textContent = '✨ Select an answer';
          feedbackMessage.style.background = '#f0f4f9';
        }
      }

      isAnswered = false;
      if (!quizTimedOut && !quizCompleted) {
        nextBtn.disabled = true;
      } else {
        nextBtn.disabled = true;
      }

      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.disabled = quizTimedOut || quizCompleted;
        btn.classList.remove('correct', 'wrong');
      });

      resultArea.style.display = 'none';
      questionArea.style.display = 'block';

      renderDots();
      updateLegendCounts();
    }

    function handleOptionClick(selectedIdx) {
      if (isAnswered || quizTimedOut || quizCompleted) return;
      const q = questions[currentIndex];
      
      if (q.correct === -1) {
        feedbackMessage.innerHTML = `⚠️ No answer in db <span class="no-answer">(This question has no matching answer in Column J)</span>`;
        feedbackMessage.style.background = '#fff3cd';
        return;
      }

      const isCorrect = (selectedIdx === q.correct);
      const allOptions = document.querySelectorAll('.option-btn');

      allOptions.forEach(btn => btn.disabled = true);

      allOptions.forEach((btn, idx) => {
        if (idx === q.correct) {
          btn.classList.add('correct');
        } else if (idx === selectedIdx && !isCorrect) {
          btn.classList.add('wrong');
        }
      });

      if (isCorrect) {
        score += 1;
        feedbackMessage.textContent = '✅ Correct! +1 point';
        feedbackMessage.style.background = '#d4edda';
        answerStatus[currentIndex] = true;
      } else {
        feedbackMessage.textContent = `❌ The correct answer was "${q.options[q.correct]}"`;
        feedbackMessage.style.background = '#f5dddd';
        answerStatus[currentIndex] = false;
      }

      scoreNumber.textContent = score;
      isAnswered = true;
      nextBtn.disabled = false;
      renderDots();
      updateLegendCounts();
    }

    function goToNext() {
      if (!isAnswered || quizCompleted) return;
      if (currentIndex + 1 < questions.length) {
        currentIndex++;
        renderQuestion(currentIndex);
      } else {
        if (!quizTimedOut) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        showResult();
      }
    }

    function showResult() {
      quizCompleted = true;
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      questionArea.style.display = 'none';
      resultArea.style.display = 'block';

      const total = questions.length;
      finalScore.textContent = `${score} / ${total}`;
      progressFill.style.width = '100%';

      let msg = '';
      if (quizTimedOut) {
        msg = '⏰ Time ran out! ' + getScoreMessage(score, total);
      } else {
        msg = getScoreMessage(score, total);
      }
      resultMessage.textContent = msg;

      scoreNumber.textContent = score;
      nextBtn.disabled = true;
      renderDots();
      updateLegendCounts();
    }

    function getScoreMessage(score, total) {
      if (score === total) return '🌟 Perfect! You are a true Self Learner.';
      else if (score >= total * 0.7) return '👏 Great job! Keep growing every day.';
      else if (score >= total * 0.4) return '📖 Good effort! Review and try again.';
      else return '💪 Learning is a journey. Keep practicing!';
    }

    function renderDots() {
      dotGrid.innerHTML = '';
      const total = questions.length;
      for (let i = 0; i < total; i++) {
        const dot = document.createElement('div');
        dot.className = 'grid-dot';
        dot.textContent = i + 1;

        if (i === currentIndex && !quizCompleted && !quizTimedOut) {
          dot.classList.add('active');
        }
        
        if (questions[i] && questions[i].correct === -1) {
          dot.classList.add('no-answer-dot');
        } else if (answerStatus[i] === true) {
          dot.classList.add('answered');
        } else if (answerStatus[i] === false) {
          dot.classList.add('wrong-dot');
        }
        
        if (quizTimedOut && answerStatus[i] === null && questions[i] && questions[i].correct !== -1) {
          dot.classList.add('timeout');
        }
        
        dotGrid.appendChild(dot);
      }
    }

    function updateLegendCounts() {
      let done = 0, active = 0, pending = 0, noAns = 0;
      const total = questions.length;
      
      for (let i = 0; i < total; i++) {
        if (questions[i] && questions[i].correct === -1) {
          noAns++;
        } else if (answerStatus[i] === true || answerStatus[i] === false) {
          done++;
        } else if (i === currentIndex && !quizCompleted && !quizTimedOut) {
          active++;
        } else {
          pending++;
        }
      }
      
      doneCount.textContent = done;
      activeCount.textContent = active;
      pendingCount.textContent = pending;
      noAnswerCount.textContent = noAns;
    }

    function restartQuiz() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      
      if (questions.length === 0) {
        fetchQuestions();
        return;
      }
      
      startQuiz();
    }

    // ----- EVENT LISTENERS -----
    nextBtn.addEventListener('click', goToNext);
    restartFromResult.addEventListener('click', restartQuiz);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !nextBtn.disabled) {
        goToNext();
      }
    });

    // ----- INIT -----
    fetchQuestions();
  })();
</script>
</body>
</html>
