const render=()=>{C.innerHTML='';const letters='ABCD';q.forEach((q,i)=>{const d=document.createElement('div');d.className='all-q-item';d.dataset.qIdx=i;d.id=`q-${i}`;if(a[i]!==null&&q.correct!==-1&&!sub&&!cmp){d.classList.add(a[i]===q.correct?'correct-item':'wrong-item')}if(lk[i])d.classList.add('locked-item');if(sub||cmp){if(q.correct!==-1){if(s[i]===!0)d.classList.add('correct-item');else if(s[i]===!1)d.classList.add('wrong-item')}}const qt=document.createElement('div');qt.className='all-q-text';let badge=lk[i]&&!sub&&!cmp?' <span class="locked-badge">🔒 locked</span>':'';qt.innerHTML=`${i+1}. ${q.question}${badge} <span class="search-badge">🔍 search</span>`;qt.addEventListener('click',e=>{e.stopPropagation();search(q.question,e)});d.appendChild(qt);const od=document.createElement('div');od.className='all-q-options';q.options.forEach((o,oi)=>{const b=document.createElement('button');b.className='option-btn';b.innerHTML=`<span class="letter">${letters[oi]}</span> ${o||'(Empty)'}`;b.dataset.qIdx=i;b.dataset.optIdx=oi;if(a[i]===oi)b.classList.add('selected-opt');if(a[i]!==null&&q.correct!==-1&&!sub&&!cmp){if(oi===q.correct)b.classList.add('correct');if(oi===a[i]&&a[i]!==q.correct)b.classList.add('wrong')}if(lk[i]){b.disabled=!0;b.classList.add('locked-btn')}if(sub||cmp){b.disabled=!0;if(q.correct!==-1){if(oi===q.correct)b.classList.add('correct');else if(oi===a[i]&&a[i]!==q.correct)b.classList.add('wrong')}}else if(!lk[i]){b.addEventListener('click',function(e){e.stopPropagation();if(sub||cmp||lk[i])return;const p=this.closest('.all-q-item'),bs=p.querySelectorAll('.option-btn');lk[i]=!0;p.classList.add('locked-item');bs.forEach(b=>{b.disabled=!0;b.classList.add('locked-btn')});this.classList.add('selected-opt');a[i]=oi;bs.forEach(b=>b.classList.remove('correct','wrong'));if(q.correct!==-1){bs.forEach((b,oi)=>{if(oi===q.correct)b.classList.add('correct');if(oi===a[i]&&a[i]!==q.correct)b.classList.add('wrong')});p.classList.remove('correct-item','wrong-item');p.classList.add(a[i]===q.correct?'correct-item':'wrong-item')}const qe=p.querySelector('.all-q-text');if(!qe.querySelector('.locked-badge')){qe.innerHTML=qe.innerHTML.replace('</span>',' <span class="locked-badge">🔒 locked</span></span>')}upd();renderDots();overview();save()})}od.appendChild(b)});d.appendChild(od);C.appendChild(d)});SB.disabled=sub||cmp||!total;if(sub&&!cmp){BN.style.display='block';SB.textContent='✅ Submitted';SB.disabled=!0;EB.disabled=!1;EB.textContent='🏁 End Quiz'}else if(!sub&&!cmp){BN.style.display='none';SB.textContent='✅ Submit';SB.disabled=!total;EB.textContent='🏁 End Quiz';EB.disabled=!total}else if(cmp){EB.disabled=SB.disabled=!0}};
const grade=()=>{let c=0;for(let i=0;i<q.length;i++){const qn=q[i],ans=a[i],is=ans!==null&&ans===qn.correct;if(qn.correct===-1){s[i]=null;continue}if(is){c++;s[i]=!0}else if(ans!==null)s[i]=!1;else s[i]=null}sc=c;q.forEach((q,i)=>{const it=C.children[i];if(!it)return;const bs=it.querySelectorAll('.option-btn');bs.forEach((b,oi)=>{b.disabled=!0;b.classList.remove('selected-opt');if(q.correct!==-1){if(oi===q.correct)b.classList.add('correct');else if(oi===a[i]&&a[i]!==q.correct)b.classList.add('wrong')}});if(q.correct!==-1){if(s[i]===!0)it.classList.add('correct-item');else if(s[i]===!1)it.classList.add('wrong-item')}});sub=!0;SB.disabled=!0;SB.textContent='✅ Submitted';EB.disabled=!1;EB.textContent='🏁 End Quiz';BN.style.display='block';renderDots();overview();save()};
const handleSubmit=()=>{if(sub||cmp)return;grade();if(t){clearInterval(t);t=null}};
const handleEnd=()=>{if(cmp)return;if(!sub){grade();if(t){clearInterval(t);t=null}}cmp=!0;EB.disabled=SB.disabled=!0;showResult()};
const showResult=()=>{cmp=!0;if(t){clearInterval(t);t=null}V.style.display='none';RA.style.display='block';FT.classList.add('hidden-timer');const tot=q.length;FS.textContent=`${sc} / ${tot}`;P.style.width='100%';A.textContent=ga();RM.textContent=(to?'⏰ Time ran out! ':'')+getMsg(sc,tot);RD.innerHTML='';q.forEach((q,i)=>{const d=document.createElement('div');d.className='detail-item';const is=s[i]===!0,iw=s[i]===!1;if(is)d.classList.add('correct-detail');else if(iw)d.classList.add('wrong-detail');else d.style.borderLeft='6px solid #999';const qt=document.createElement('div');qt.className='detail-q';qt.textContent=`${i+1}. ${q.question}`;d.appendChild(qt);const ad=document.createElement('div');ad.className='detail-answer';const ua=a[i]!==null&&q.options[a[i]]?q.options[a[i]]:'Not answered',ca=q.correct!==-1&&q.options[q.correct]?q.options[q.correct]:'Not available';if(q.correct===-1){ad.innerHTML='<span style="color:#999;">⚠️ No correct answer in database.</span>'}else if(is){ad.innerHTML=`✅ Your answer: <span class="user-ans" style="color:#1f8b4c;">${ua}</span> (Correct)`}else if(iw){ad.innerHTML=`❌ Your answer: <span class="user-ans" style="color:#b33c3c;">${ua}</span> &nbsp; Correct: <span class="correct-ans">${ca}</span>`}else{ad.innerHTML=`⏭️ Skipped &nbsp; Correct: <span class="correct-ans">${ca}</span>`}d.appendChild(ad);RD.appendChild(d)});save()};
const getMsg=(s,t)=>{if(s===t)return'🌟 Perfect! You are a true Self Learner.';if(s>=t*.7)return'👏 Great job! Keep growing every day.';if(s>=t*.4)return'📖 Good effort! Review and try again.';return'💪 Learning is a journey. Keep practicing!'};
const renderDots=(active)=>{DG.innerHTML='';for(let i=0;i<total;i++){const d=document.createElement('button');d.className='grid-dot';d.textContent=i+1;const qn=q[i],has=a[i]!==null;if(sub||cmp){if(qn&&qn.correct===-1)d.classList.add('no-answer-dot');else if(s[i]===!0)d.classList.add('correct-dot');else if(s[i]===!1)d.classList.add('wrong-dot');else d.classList.add('pending-dot')}else{d.classList.add(has?'done-dot':'pending-dot')}if(active!==undefined&&i===active)d.classList.add('active-dot');d.addEventListener('click',e=>{e.stopPropagation();scrollQ(i)});DG.appendChild(d)}};
const overview=()=>{let d=0,p=0,c=0,w=0;for(let i=0;i<total;i++){if(a[i]!==null){d++;if(sub||cmp){if(s[i]===!0)c++;else if(s[i]===!1)w++}}else p++}DC.textContent=d;PC.textContent=p;if(sub||cmp){CL.style.display='inline-flex';WL.style.display='inline-flex';CC.textContent=c;WC.textContent=w}else{CL.style.display='none';WL.style.display='none'}};
const restart=()=>{if(t){clearInterval(t);t=null}clear();a=Array(q.length).fill(null);s=Array(q.length).fill(null);lk=Array(q.length).fill(!1);sub=cmp=to=!1;sc=0;time=total*60;RA.style.display='none';V.style.display='block';BN.style.display='none';SB.textContent='✅ Submit';SB.disabled=!1;EB.textContent='🏁 End Quiz';EB.disabled=!1;CL.style.display='none';WL.style.display='none';f=f.map(x=>{const s=shuf(x.options),n=s.indexOf(x.options[x.correct]);return{...x,options:s,correct:n}});q=f;total=q.length;T.textContent=total;render();upd();renderDots();overview();if(!cmp&&!sub&&total>0)startTimer();FT.classList.remove('hidden-timer');save();window.scrollTo({top:0,behavior:'smooth'})};
const refreshClick=()=>{MM.textContent='Progress will be reset.';CF.value=cat;MD.classList.add('active')};
const refreshConfirm=()=>{if(t){clearInterval(t);t=null}RA.style.display='none';V.style.display='block';fetchQ(!0,CF.value)};
MD.addEventListener('click',e=>{if(e.target===this)MD.classList.remove('active')});
SB.addEventListener('click',handleSubmit);EB.addEventListener('click',handleEnd);RR.addEventListener('click',restart);RB.addEventListener('click',refreshClick);MF.addEventListener('click',refreshConfirm);MC.addEventListener('click',()=>MD.classList.remove('active'));ST.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));BT.addEventListener('click',()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}));
QT.textContent='CSS Test (2026)';fetchQ(!1);
