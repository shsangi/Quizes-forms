<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Self Learners · GSheet Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f2f6fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }
    .quiz-wrapper {
      max-width: 880px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      padding: 2rem 2rem 1.8rem;
      box-shadow: 0 25px 50px -10px rgba(0,20,30,0.15), 0 8px 20px -8px rgba(0,0,0,0.04);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem 1.2rem;
      margin-bottom: 1.2rem;
    }
    .brand h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(145deg, #0b2a3b, #1b5a7a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .brand small {
      background: #dceaf3;
      font-size: 0.75rem;
      font-weight: 600;
      color: #1a5a7a;
      padding: 0.15rem 0.9rem;
      border-radius: 40px;
      text-transform: uppercase;
    }
    .time-score {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }
    .timer {
      font-weight: 600;
      font-size: 1.1rem;
      color: #0b2a3b;
      background: #eef4f9;
      padding: 0.3rem 1.2rem;
      border-radius: 60px;
    }
    .score-pill {
      background: #0b2a3b;
      color: white;
      font-weight: 600;
      padding: 0.3rem 1.6rem;
      border-radius: 60px;
      font-size: 0.95rem;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .score-pill span {
      background: #f0c27f;
      color: #0b2a3b;
      padding: 0.05rem 0.7rem;
      border-radius: 30px;
      margin-left: 0.4rem;
    }
    .progress-block {
      background: #e6edf5;
      height: 6px;
      border-radius: 20px;
      margin: 0.6rem 0 1.4rem 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2f7b9e, #4ba3c7);
      border-radius: 20px;
      transition: width 0.35s ease;
    }
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.4rem 1rem;
      margin-bottom: 0.4rem;
    }
    .q-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #1f4d66;
      background: #eaf1f8;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
    }
    .q-category {
      font-size: 0.8rem;
      font-weight: 500;
      color: #1f5672;
      background: rgba(26,90,122,0.06);
      padding: 0.15rem 1.2rem;
      border-radius: 30px;
      border: 1px solid rgba(26,90,122,0.08);
    }
    .question-text {
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.5;
      color: #0a212b;
      margin: 0.6rem 0 1.6rem 0;
      min-height: 4rem;
    }
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin-bottom: 1.6rem;
    }
    .option-btn {
      background: white;
      border: 1.5px solid #dce6ef;
      border-radius: 60px;
      padding: 0.8rem 1.8rem;
      font-size: 1rem;
      font-weight: 500;
      color: #1d3847;
      text-align: left;
      cursor: pointer;
      transition: all 0.12s;
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }
    .option-btn:hover:not(:disabled) {
      background: #f5faff;
      border-color: #6fa6c7;
      transform: scale(1.01);
    }
    .option-btn .letter {
      background: #e7f0f7;
      color: #1a5a7a;
      font-weight: 700;
      width: 30px;
      height: 30px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .option-btn.correct {
      background: #d8eddf;
      border-color: #1f8b4c;
      box-shadow: 0 0 0 2px rgba(31,139,76,0.15);
    }
    .option-btn.correct .letter { background: #1f8b4c; color: white; }
    .option-btn.wrong {
      background: #f5dddd;
      border-color: #b33c3c;
      box-shadow: 0 0 0 2px rgba(179,60,60,0.12);
    }
    .option-btn.wrong .letter { background: #b33c3c; color: white; }
    .option-btn:disabled { cursor: default; opacity: 0.7; }
    .option-btn:disabled:hover { transform: none; }
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 0.4rem 0 1.2rem 0;
    }
    .feedback-msg {
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      background: #f0f4f9;
      min-height: 2.6rem;
      display: flex;
      align-items: center;
      flex: 1;
    }
    .nav-group {
      display: flex;
      gap: 0.7rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid #0b2a3b;
      color: #0b2a3b;
      padding: 0.5rem 1.6rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-outline:hover { background: #0b2a3b; color: white; }
    .btn-primary {
      background: #0b2a3b;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.6rem 2.4rem;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(11,42,59,0.16);
      transition: 0.15s;
    }
    .btn-primary:hover:not(:disabled) { background: #1a4b62; transform: scale(1.02); }
    .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
    .overview-section {
      margin-top: 1.2rem;
      border-top: 1px solid #e2eaf2;
      padding-top: 1rem;
    }
    .overview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .overview-header span { font-weight: 600; font-size: 0.9rem; color: #1f4d66; }
    .legend {
      display: flex;
      gap: 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #2d5a72;
    }
    .legend-item { display: flex; align-items: center; gap: 0.3rem; }
    .legend-dot { width: 16px; height: 16px; border-radius: 30px; display: inline-block; }
    .legend-dot.done { background: #1f8b4c; }
    .legend-dot.active { background: #2f7b9e; }
    .legend-dot.pending { background: #dce6ef; }
    .grid-dots {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 0.2rem;
    }
    .grid-dot {
      width: 36px;
      height: 36px;
      border-radius: 30px;
      background: #dce6ef;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.8rem;
      color: #1d4b61;
      transition: 0.1s;
    }
    .grid-dot.active { background: #2f7b9e; color: white; box-shadow: 0 0 0 3px rgba(47,123,158,0.25); }
    .grid-dot.answered { background: #1f8b4c; color: white; }
    .grid-dot.wrong-dot { background: #b33c3c; color: white; }
    .result-card { text-align: center; padding: 1rem 0.5rem 0.5rem; display: none; }
    .result-card h2 { font-size: 2.2rem; font-weight: 700; color: #0b2a3b; }
    .result-score { font-size: 3.6rem; font-weight: 800; background: linear-gradient(135deg, #1a5a7a, #48a0c7); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0.3rem 0 0.2rem; }
    .result-msg { color: #1f4b61; font-size: 1.1rem; margin: 0.2rem 0 1.6rem; }
    .result-card .btn-outline { font-size: 1rem; padding: 0.7rem 2.8rem; }
    .loading { text-align: center; padding: 2rem; color: #1f4d66; font-weight: 500; }
    .error { color: #b33c3c; background: #f5dddd; padding: 1rem; border-radius: 1.5rem; margin: 1rem 0; display: none; }
    @media (max-width: 550px) {
      .quiz-wrapper { padding: 1.4rem 0.8rem; }
      .brand h1 { font-size: 1.4rem; }
      .question-text { font-size: 1.1rem; min-height: 3.2rem; }
      .option-btn { padding: 0.6rem 1rem; font-size: 0.9rem; }
      .action-bar { flex-direction: column; align-items: stretch; }
      .btn-primary { width: 100%; justify-content: center; }
      .nav-group { width: 100%; }
      .btn-outline { flex: 1; }
      .grid-dot { width: 32px; height: 32px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>

<div class="quiz-wrapper" id="quizApp">
  <div class="top-bar">
    <div class="brand"><h1>📘 Self <small>Learners</small></h1></div>
    <div class="time-score">
      <div class="timer" id="timerDisplay">⏱️ 174:22</div>
      <div class="score-pill">🎯 <span id="scoreNumber">0</span></div>
    </div>
  </div>

  <div id="quizContent">
    <div class="progress-block"><div class="progress-fill" id="progressFill"></div></div>

    <!-- loading / error -->
    <div id="loadingMessage" class="loading">📥 Loading questions from Google Sheet...</div>
    <div id="errorMessage" class="error"></div>

    <!-- question area -->
    <div id="questionArea" style="display:none;">
      <div class="q-meta">
        <span class="q-label" id="qNumber">QUESTION 1 OF 0</span>
        <span class="q-category" id="qCategory">📚</span>
      </div>
      <div class="question-text" id="questionText"></div>
      <div class="options-grid" id="optionsContainer"></div>
      <div class="action-bar">
        <div class="feedback-msg" id="feedbackMessage">✨ Select an answer</div>
        <div class="nav-group">
          <button class="btn-outline" id="restartBtn">⟳ Restart</button>
          <button class="btn-primary" id="nextBtn" disabled>Next →</button>
        </div>
      </div>
      <div class="overview-section">
        <div class="overview-header">
          <span>OVERVIEW</span>
          <div class="legend">
            <span class="legend-item"><span class="legend-dot done"></span> Done</span>
            <span class="legend-item"><span class="legend-dot active"></span> Active</span>
            <span class="legend-item"><span class="legend-dot pending"></span> Pending</span>
          </div>
        </div>
        <div class="grid-dots" id="dotGrid"></div>
      </div>
    </div>

    <!-- result -->
    <div class="result-card" id="resultArea">
      <h2>🏁 Quiz Complete</h2>
      <div class="result-score" id="finalScore">0 / 0</div>
      <p class="result-msg" id="resultMessage">Keep learning, Self Learner!</p>
      <button class="btn-outline" id="restartFromResult">⟳ Try again</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- CONFIG ----------
    // Replace with your Google Sheet CSV export URL (published as CSV)
    // For your sheet: https://docs.google.com/spreadsheets/d/1snRQ9V8cBfl9lOa2rJ9K26jXqe5FSgUdc4gbKbAh3ZU/export?format=csv
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1snRQ9V8cBfl9lOa2rJ9K26jXqe5FSgUdc4gbKbAh3ZU/export?format=csv";

    // ---------- STATE ----------
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let isAnswered = false;
    let quizCompleted = false;
    let answerStatus = []; // true=correct, false=wrong, null=pending

    // DOM refs
    const progressFill = document.getElementById('progressFill');
    const qNumber = document.getElementById('qNumber');
    const qCategory = document.getElementById('qCategory');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackMessage = document.getElementById('feedbackMessage');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const restartFromResult = document.getElementById('restartFromResult');
    const scoreNumber = document.getElementById('scoreNumber');
    const questionArea = document.getElementById('questionArea');
    const resultArea = document.getElementById('resultArea');
    const finalScore = document.getElementById('finalScore');
    const resultMessage = document.getElementById('resultMessage');
    const dotGrid = document.getElementById('dotGrid');
    const loadingMsg = document.getElementById('loadingMessage');
    const errorMsg = document.getElementById('errorMessage');

    // ---------- HELPERS ----------
    function parseCSVRow(row) {
      // Expected columns: Srno, question no, subject, topic, question, choice 1, choice 2, choice 3, choice 4, right answer
      if (row.length < 10) return null;
      return {
        srno: row[0]?.trim() || '',
        qno: row[1]?.trim() || '',
        subject: row[2]?.trim() || '',
        topic: row[3]?.trim() || '',
        question: row[4]?.trim() || '',
        choice1: row[5]?.trim() || '',
        choice2: row[6]?.trim() || '',
        choice3: row[7]?.trim() || '',
        choice4: row[8]?.trim() || '',
        right: row[9]?.trim() || ''
      };
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
      if (lines.length === 0) return [];
      // assume first row is header, skip it
      const result = [];
      for (let i = 1; i < lines.length; i++) {
        // handle quoted fields (simple approach)
        let row = [];
        let current = '';
        let inQuotes = false;
        const line = lines[i];
        for (let j = 0; j < line.length; j++) {
          const char = line[j];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(current.trim());
            current = '';
          } else {
            current += char;
          }
        }
        row.push(current.trim());
        const parsed = parseCSVRow(row);
        if (parsed && parsed.question) {
          result.push(parsed);
        }
      }
      return result;
    }

    // convert parsed rows to internal question format
    function toInternalQuestions(rows) {
      return rows.map((r, idx) => ({
        id: idx,
        category: r.subject || r.topic || 'General',
        question: r.question || 'No question',
        options: [r.choice1, r.choice2, r.choice3, r.choice4].filter(o => o !== ''),
        correct: (() => {
          const right = r.right.trim();
          if (right === '1' || right.toLowerCase() === 'a') return 0;
          if (right === '2' || right.toLowerCase() === 'b') return 1;
          if (right === '3' || right.toLowerCase() === 'c') return 2;
          if (right === '4' || right.toLowerCase() === 'd') return 3;
          const num = parseInt(right);
          if (!isNaN(num) && num >= 1 && num <= 4) return num - 1;
          return 0; // default to first
        })(),
        raw: r
      }));
    }

    // ---------- FETCH FROM SHEET ----------
    async function loadQuestions() {
      try {
        loadingMsg.style.display = 'block';
        errorMsg.style.display = 'none';
        errorMsg.textContent = '';
        const response = await fetch(SHEET_CSV_URL);
        if (!response.ok) throw new Error(`HTTP error ${response.status}`);
        const csvText = await response.text();
        const rows = parseCSV(csvText);
        if (rows.length === 0) throw new Error('No data found in sheet. Please check the sheet has data and is published.');
        questions = toInternalQuestions(rows);
        loadingMsg.style.display = 'none';
        questionArea.style.display = 'block';
        initQuiz();
      } catch (err) {
        loadingMsg.style.display = 'none';
        errorMsg.style.display = 'block';
        errorMsg.textContent = `❌ Failed to load from Google Sheet: ${err.message}. Please check the sheet is published and the URL is correct.`;
        // Keep question area hidden, show error
        questionArea.style.display = 'none';
        resultArea.style.display = 'none';
      }
    }

    // ---------- QUIZ ENGINE ----------
    function initQuiz() {
      currentIndex = 0;
      score = 0;
      isAnswered = false;
      quizCompleted = false;
      answerStatus = new Array(questions.length).fill(null);
      scoreNumber.textContent = '0';
      resultArea.style.display = 'none';
      questionArea.style.display = 'block';
      renderQuestion(0);
      nextBtn.disabled = true;
      progressFill.style.width = '0%';
      feedbackMessage.textContent = '✨ Select an answer';
      feedbackMessage.style.background = '#f0f4f9';
      renderDots();
    }

    function renderDots() {
      dotGrid.innerHTML = '';
      const total = questions.length;
      for (let i = 0; i < total; i++) {
        const dot = document.createElement('div');
        dot.className = 'grid-dot';
        dot.textContent = i + 1;
        if (i === currentIndex && !quizCompleted) dot.classList.add('active');
        if (answerStatus[i] === true) dot.classList.add('answered');
        else if (answerStatus[i] === false) dot.classList.add('wrong-dot');
        dotGrid.appendChild(dot);
      }
    }

    function renderQuestion(index) {
      const q = questions[index];
      if (!q) return;
      const total = questions.length;
      progressFill.style.width = `${((index) / total) * 100}%`;
      qNumber.textContent = `QUESTION ${index+1} OF ${total}`;
      qCategory.textContent = q.category || 'General';
      questionText.textContent = q.question;

      const letters = ['A', 'B', 'C', 'D'];
      optionsContainer.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="letter">${letters[idx]}</span> ${opt}`;
        btn.dataset.index = idx;
        btn.addEventListener('click', () => handleOptionClick(idx));
        optionsContainer.appendChild(btn);
      });

      feedbackMessage.textContent = '✨ Select an answer';
      feedbackMessage.style.background = '#f0f4f9';
      isAnswered = false;
      nextBtn.disabled = true;
      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.disabled = false;
        btn.classList.remove('correct', 'wrong');
      });
      resultArea.style.display = 'none';
      questionArea.style.display = 'block';
      quizCompleted = false;
      renderDots();
    }

    function handleOptionClick(selectedIdx) {
      if (isAnswered) return;
      const q = questions[currentIndex];
      const isCorrect = (selectedIdx === q.correct);
      const allOptions = document.querySelectorAll('.option-btn');
      allOptions.forEach(btn => btn.disabled = true);
      allOptions.forEach((btn, idx) => {
        if (idx === q.correct) btn.classList.add('correct');
        else if (idx === selectedIdx && !isCorrect) btn.classList.add('wrong');
      });
      if (isCorrect) {
        score += 1;
        feedbackMessage.textContent = '✅ Correct! +1 point';
        feedbackMessage.style.background = '#d4edda';
        answerStatus[currentIndex] = true;
      } else {
        feedbackMessage.textContent = `❌ The correct answer was ${String.fromCharCode(65 + q.correct)}.`;
        feedbackMessage.style.background = '#f5dddd';
        answerStatus[currentIndex] = false;
      }
      scoreNumber.textContent = score;
      isAnswered = true;
      nextBtn.disabled = false;
      renderDots();
    }

    function goToNext() {
      if (!isAnswered) return;
      if (currentIndex + 1 < questions.length) {
        currentIndex++;
        renderQuestion(currentIndex);
      } else {
        showResult();
      }
    }

    function showResult() {
      quizCompleted = true;
      questionArea.style.display = 'none';
      resultArea.style.display = 'block';
      const total = questions.length;
      finalScore.textContent = `${score} / ${total}`;
      progressFill.style.width = '100%';
      let msg = '';
      if (score === total) msg = '🌟 Perfect! You are a true Self Learner.';
      else if (score >= total * 0.7) msg = '👏 Great job! Keep growing every day.';
      else if (score >= total * 0.4) msg = '📖 Good effort! Review and try again.';
      else msg = '💪 Learning is a journey. Restart and improve!';
      resultMessage.textContent = msg;
      scoreNumber.textContent = score;
      nextBtn.disabled = true;
      renderDots();
    }

    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      isAnswered = false;
      quizCompleted = false;
      answerStatus = new Array(questions.length).fill(null);
      scoreNumber.textContent = '0';
      resultArea.style.display = 'none';
      questionArea.style.display = 'block';
      renderQuestion(0);
      nextBtn.disabled = true;
      progressFill.style.width = '0%';
      feedbackMessage.textContent = '✨ Select an answer';
      feedbackMessage.style.background = '#f0f4f9';
      renderDots();
    }

    // ---------- EVENT LISTENERS ----------
    nextBtn.addEventListener('click', goToNext);
    restartBtn.addEventListener('click', restartQuiz);
    restartFromResult.addEventListener('click', restartQuiz);

    // ---------- START ----------
    loadQuestions();
  })();
</script>
</body>
</html>
