<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Essay Collection</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: #eff6ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.05);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            min-height: 100dvh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px 16px 100px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 12px;
        }

        h1 {
            color: var(--text);
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0 0 6px 0;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin: 0;
        }

        /* Grid */
        .essay-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 640px) {
            .essay-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
            .container { padding: 28px 24px 100px; }
            h1 { font-size: 2rem; }
        }

        @media (min-width: 1024px) {
            .essay-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; }
            .container { padding: 32px 32px 100px; }
        }

        /* Cards */
        .essay-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        @media (hover: hover) {
            .essay-card:hover {
                transform: translateY(-3px);
                box-shadow: var(--shadow-lg);
            }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .card-title-group {
            flex-grow: 1;
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .card-title-group:active {
            opacity: 0.7;
        }

        .card-srno {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.35;
        }

        .card-nav-icon {
            background: var(--primary-light);
            border: none;
            color: var(--primary);
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: background 0.2s, transform 0.2s;
        }

        .card-nav-icon:hover {
            background: #dbeafe;
        }

        .card-nav-icon:active {
            transform: scale(0.95);
        }

        .card-nav-icon svg {
            width: 20px;
            height: 20px;
        }

        .card-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .card-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .card-classification {
            font-size: 0.8rem;
            color: #854d0e;
            background: #fefce8;
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 3px solid #eab308;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        /* Vocabulary */
        .vocab-section {
            margin-top: auto;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .vocab-toggle-btn {
            background: #f1f5f9;
            color: var(--primary);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .vocab-toggle-btn:hover {
            background: #e2e8f0;
        }

        .vocab-content {
            display: none;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-top: 10px;
            max-height: 280px;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        .vocab-content.active {
            display: block;
        }

        .vocab-content .vocab-item {
            border-bottom: 1px dashed #cbd5e1;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .vocab-content .vocab-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .vocab-content strong {
            color: var(--text);
            display: block;
            margin-bottom: 3px;
            font-weight: 600;
        }

        .vocab-content .urdu-text {
            font-family: 'Noto Nastaliq Urdu', serif;
            direction: rtl;
            text-align: right;
            font-size: 1.15em;
            line-height: 2;
            color: var(--text);
            margin: 4px 0;
        }

        /* Floating Refresh Button */
        .refresh-btn {
            position: fixed;
            bottom: 24px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s, transform 0.2s;
            z-index: 900;
        }

        .refresh-btn:hover {
            background: var(--primary-hover);
        }

        .refresh-btn:active {
            transform: scale(0.95);
        }

        .refresh-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .refresh-btn.loading svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
        }

        @media (min-width: 768px) {
            .modal-overlay {
                align-items: center;
                padding: 20px;
            }
        }

        .modal-content {
            background: #fff;
            width: 100%;
            height: 94dvh;
            max-width: 860px;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (min-width: 768px) {
            .modal-content {
                height: 90vh;
                border-radius: 16px;
                animation: fadeIn 0.25s ease;
            }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            padding: 14px 16px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            gap: 12px;
        }

        .modal-header-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .modal-header-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .action-btn {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 9px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, transform 0.15s;
        }

        .action-btn:active {
            transform: scale(0.97);
        }

        .copy-btn {
            background: var(--success);
            color: white;
        }

        .copy-btn:hover {
            background: #059669;
        }

        .copy-btn.copied {
            background: #0f172a;
        }

        .close-btn {
            background: var(--danger);
            color: white;
            width: 38px;
            height: 38px;
            padding: 0;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.1rem;
        }

        .close-btn:hover {
            background: #dc2626;
        }

        .modal-body {
            padding: 20px 18px 40px;
            overflow-y: auto;
            color: var(--text);
            -webkit-overflow-scrolling: touch;
            flex-grow: 1;
            overscroll-behavior: contain;
        }

        @media (min-width: 640px) {
            .modal-body {
                padding: 28px 32px 48px;
            }
        }

        /* Reading styles */
        .reading-essay-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            margin: 0 0 20px 0;
            line-height: 1.3;
            letter-spacing: -0.02em;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
        }

        @media (min-width: 640px) {
            .reading-essay-title {
                font-size: 1.75rem;
            }
        }

        .reading-outline-box {
            background: var(--primary-light);
            border-left: 4px solid var(--primary);
            padding: 16px 18px;
            margin-bottom: 28px;
            border-radius: 0 10px 10px 0;
            font-size: 0.95rem;
            color: #1e3a5f;
            line-height: 1.55;
        }

        .reading-outline-box strong {
            display: block;
            margin-bottom: 6px;
            color: var(--text);
            font-size: 1rem;
        }

        .modal-body h1 {
            font-size: 1.4rem;
            color: var(--text);
            margin: 1.6em 0 0.6em;
        }

        .modal-body h2,
        .modal-body h3 {
            color: var(--text);
            margin: 1.5em 0 0.5em;
            font-weight: 600;
        }

        .modal-body p {
            margin-bottom: 1.1em;
            line-height: 1.7;
        }

        .modal-body blockquote {
            border-left: 4px solid var(--primary);
            margin: 1.2em 0;
            padding: 12px 18px;
            color: #475569;
            font-style: italic;
            background: #f8fafc;
            border-radius: 0 8px 8px 0;
        }

        /* Loading & Error */
        .loading, .error {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.05rem;
            grid-column: 1 / -1;
            color: var(--text-secondary);
        }

        .error {
            color: var(--danger);
            font-weight: 600;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            margin-left: 10px;
            vertical-align: middle;
            animation: spin 0.7s linear infinite;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Essay Collection</h1>
            <p class="subtitle">Browse, read & explore essays</p>
        </header>

        <div id="essays-container" class="essay-grid">
            <div class="loading">Loading essays...</div>
        </div>
    </div>

    <!-- Floating Refresh Button -->
    <button class="refresh-btn" id="refreshBtn" onclick="forceRefresh()" title="Refresh Data" aria-label="Refresh essays">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>

    <!-- Reading Modal -->
    <div id="essayModal" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-header-title">Reading Essay</div>
                <div class="modal-header-actions">
                    <button class="action-btn copy-btn" id="copyBtn" onclick="copyEssayText()">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy
                    </button>
                    <button class="action-btn close-btn" onclick="closeModal()" aria-label="Close">✕</button>
                </div>
            </div>
            <div class="modal-body" id="modalBody" onscroll="saveScrollPosition()"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQT6SIpNx8XznQsOgvBHjsz_-HgNO_cmBvxZaIhDcnwgGwJpx932G6nHPv9aVo-p8GF1srqAHzn35u2/pub?output=csv'; 

        // --- STATE ---
        const container = document.getElementById('essays-container');
        const modal = document.getElementById('essayModal');
        const modalBody = document.getElementById('modalBody');
        const refreshBtn = document.getElementById('refreshBtn');
        const copyBtn = document.getElementById('copyBtn');
        
        let essaysData = []; 
        let currentEssayIndex = null; 
        let scrollSaveTimeout;

        // --- DATA FETCHING ---
        function loadEssays(forceRefresh = false) {
            if (!forceRefresh && essaysData.length === 0) {
                container.innerHTML = '<div class="loading">Loading essays...</div>';
            }
            refreshBtn.classList.add('loading');

            const fetchUrl = forceRefresh ? csvUrl + '&t=' + new Date().getTime() : csvUrl;

            Papa.parse(fetchUrl, {
                download: true,
                header: false, 
                dynamicTyping: true,
                complete: function(results) {
                    refreshBtn.classList.remove('loading');
                    const rawRows = results.data.slice(1); 
                    
                    essaysData = rawRows
                        .map((row, index) => {
                            const fullMarkdown = row[1] ? String(row[1]).trim() : '';
                            if (!fullMarkdown) return null;

                            // Title
                            let titleMatch = fullMarkdown.match(/^\s*#\s+(.+)$/m);
                            let title = titleMatch ? titleMatch[1].trim() : `Essay ${index + 1}`;

                            // Meta
                            let srNoMatch = fullMarkdown.match(/\*\*SR No:\*\*\s*(.+)/);
                            let dateMatch = fullMarkdown.match(/\*\*Date:\*\*\s*(.+)/);
                            let wordCountMatch = fullMarkdown.match(/\*\*Total Essay Word Count:\*\*\s*(.+)/);
                            let classMatch = fullMarkdown.match(/\*\*Primary Type:\*\*\s*(.+)/);
                            
                            let meta = {
                                srNo: srNoMatch ? srNoMatch[1].trim() : '',
                                date: dateMatch ? dateMatch[1].trim() : '',
                                wordCount: wordCountMatch ? wordCountMatch[1].trim() : '',
                                classification: classMatch ? classMatch[1].trim() : ''
                            };

                            // Outline
                            let outlineText = '';
                            let outlineMatch = fullMarkdown.match(/### Outline:\s*\n([\s\S]*?)(?=\n---|\n###|$)/i);
                            if (outlineMatch) {
                                outlineText = outlineMatch[1].trim();
                            }

                            // Vocabulary
                            let vocabHtml = '';
                            let vocabSplit = fullMarkdown.split(/### 📚 Vocabulary/i);
                            if (vocabSplit.length > 1) {
                                let rawVocab = vocabSplit[1];
                                let formattedVocab = rawVocab
                                    .replace(/\*\*(\d+)\s+(.+?)\*\*/g, '<div class="vocab-item"><strong>$1. $2</strong>') 
                                    .replace(/\*   \*\*Urdu:\*\*\s*(.+)/g, '<div class="urdu-text">$1</div>') 
                                    .replace(/\*   \*\*Synonyms:\*\*\s*(.+)/g, '<div><strong>Synonyms:</strong> $1</div>') 
                                    .replace(/\*   \*\*Antonyms:\*\*\s*(.+)/g, '<div><strong>Antonyms:</strong> $1</div></div>'); 
                                vocabHtml = formattedVocab;
                            }

                            // Essay Body
                            let essayBody = vocabSplit[0]; 
                            
                            if (titleMatch) essayBody = essayBody.replace(titleMatch[0], '');
                            essayBody = essayBody.replace(/\*\*\(PCS.*?\)\*\*/g, '');
                            essayBody = essayBody.replace(/\*\*SR No:\*\*.*?(?=\n\n|\n---|$)/is, '');
                            essayBody = essayBody.replace(/\*\*Date:\*\*.*?(?=\n\n|\n---|$)/is, '');
                            essayBody = essayBody.replace(/\*\*Total Essay Word Count:\*\*.*?(?=\n\n|\n---|$)/is, '');
                            essayBody = essayBody.replace(/### Outline:[\s\S]*?(?=\n---)/i, ''); 
                            essayBody = essayBody.replace(/### 📝 Classification of Essay[\s\S]*?(?=\n---)/i, '');
                            essayBody = essayBody.replace(/^[\s-]+/, '').trim();

                            const plainText = essayBody
                                .replace(/[#*`>_|]/g, '') 
                                .replace(/\n/g, ' ')      
                                .substring(0, 150) + '...';

                            return {
                                id: index,
                                title: title,
                                meta: meta,
                                outline: outlineText, 
                                bodyMarkdown: essayBody,
                                vocabHtml: vocabHtml,
                                previewText: plainText
                            };
                        })
                        .filter(item => item !== null);

                    if (essaysData.length === 0) {
                        container.innerHTML = '<div class="error">No valid essay data found.</div>';
                        return;
                    }

                    renderCards();
                    restoreLastState();
                },
                error: function(error) {
                    refreshBtn.classList.remove('loading');
                    container.innerHTML = `<div class="error">Error loading data: ${error.message}</div>`;
                }
            });
        }

        // --- RENDER CARDS ---
        function renderCards() {
            container.innerHTML = ''; 

            essaysData.forEach((essay, index) => {
                let metaParts = [];
                if (essay.meta.wordCount) metaParts.push(`📝 ${essay.meta.wordCount}`);
                if (essay.meta.date) metaParts.push(`📅 ${essay.meta.date}`);
                let metaString = metaParts.map(p => `<span>${p}</span>`).join('');

                let vocabSection = '';
                if (essay.vocabHtml) {
                    vocabSection = `
                        <div class="vocab-section">
                            <button class="vocab-toggle-btn" onclick="toggleVocab(event, ${index})">
                                📚 Show Vocabulary
                            </button>
                            <div class="vocab-content" id="vocab-${index}">
                                ${essay.vocabHtml}
                            </div>
                        </div>
                    `;
                }

                let classificationSection = '';
                if (essay.meta.classification) {
                    classificationSection = `
                        <div class="card-classification">
                            <strong>Classification:</strong> ${essay.meta.classification}
                        </div>
                    `;
                }

                const cardHTML = `
                    <div class="essay-card" id="card-${index}">
                        <div class="card-header">
                            <div class="card-title-group" onclick="openModal(${index})">
                                <span class="card-srno">${essay.meta.srNo ? essay.meta.srNo + '.' : ''}</span>
                                <span class="card-title">${essay.title}</span>
                            </div>
                            <button class="card-nav-icon" onclick="openModal(${index})" title="Read Essay" aria-label="Read essay">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </button>
                        </div>
                        <div class="card-meta">
                            ${metaString}
                        </div>
                        ${classificationSection}
                        ${vocabSection}
                    </div>
                `;
                
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // --- VOCABULARY TOGGLE ---
        function toggleVocab(event, index) {
            event.preventDefault(); 
            event.stopPropagation(); 
            
            const vocabDiv = document.getElementById(`vocab-${index}`);
            const btn = event.currentTarget;
            
            if (vocabDiv.classList.contains('active')) {
                vocabDiv.classList.remove('active');
                btn.innerHTML = '📚 Show Vocabulary';
            } else {
                vocabDiv.classList.add('active');
                btn.innerHTML = '📚 Hide Vocabulary';
            }
        }

        // --- MODAL ---
        function openModal(index) {
            if (!essaysData[index]) return;
            
            currentEssayIndex = index;
            const essay = essaysData[index];
            
            let readingHtml = `
                <div class="reading-essay-title">${essay.title}</div>
            `;
            
            if (essay.outline) {
                readingHtml += `
                    <div class="reading-outline-box">
                        <strong>📝 Part of Essay (Outline)</strong>
                        ${essay.outline}
                    </div>
                `;
            }
            
            readingHtml += marked.parse(essay.bodyMarkdown);
            
            modalBody.innerHTML = readingHtml;
            
            // Reset copy button
            copyBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy`;
            copyBtn.classList.remove('copied');
            
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; 

            const savedScroll = localStorage.getItem(`essay_scroll_${index}`);
            if (savedScroll) {
                setTimeout(() => {
                    modalBody.scrollTop = parseInt(savedScroll, 10);
                }, 50);
            } else {
                modalBody.scrollTop = 0; 
            }

            localStorage.setItem('last_open_essay', index);
        }

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
            localStorage.removeItem('last_open_essay');
            currentEssayIndex = null;
        }

        // --- COPY ---
        function copyEssayText() {
            if (currentEssayIndex === null) return;
            
            const essay = essaysData[currentEssayIndex];
            let textToCopy = `${essay.title}\n\n`;
            if (essay.outline) {
                textToCopy += `Part of Essay (Outline):\n${essay.outline}\n\n`;
            }
            textToCopy += essay.bodyMarkdown;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                copyBtn.innerHTML = `✅ Copied!`;
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy`;
                    copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert('Failed to copy text. Please try again.');
            });
        }

        // --- SCROLL PERSISTENCE ---
        function saveScrollPosition() {
            if (currentEssayIndex !== null) {
                clearTimeout(scrollSaveTimeout);
                scrollSaveTimeout = setTimeout(() => {
                    localStorage.setItem(`essay_scroll_${currentEssayIndex}`, modalBody.scrollTop);
                }, 100);
            }
        }

        function restoreLastState() {
            const lastEssay = localStorage.getItem('last_open_essay');
            if (lastEssay !== null && essaysData[lastEssay]) {
                openModal(parseInt(lastEssay, 10));
            }
        }

        // --- REFRESH ---
        function forceRefresh() {
            localStorage.clear();
            closeModal();
            loadEssays(true);
        }

        // --- EVENTS ---
        window.onclick = function(event) {
            if (event.target === modal) closeModal();
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && modal.style.display === 'flex') {
                closeModal();
            }
        });

        window.onload = () => loadEssays(false);
    </script>

</body>
</html>
