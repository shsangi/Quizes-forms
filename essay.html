<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Essay Collection</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #3498db;
            --primary-hover: #2980b9;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --text-light: #7f8c8d;
            --border: #e0e0e0;
            --success: #27ae60;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #2c3e50; font-size: 1.8em; margin: 0; }

        /* Grid Layout */
        .essay-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .essay-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .essay-grid { grid-template-columns: repeat(3, 1fr); } }

        /* Essay Cards */
        .essay-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
            border-top: 4px solid var(--primary);
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }

        /* Card Header: SRNO, TITLE, and READ BUTTON */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .card-title-group {
            flex-grow: 1;
        }

        .card-srno {
            font-size: 0.85em;
            font-weight: bold;
            color: var(--primary);
            margin-right: 5px;
        }
        .card-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1.3;
            display: inline;
        }

        /* Card Meta: WORDS, DATE */
        .card-meta {
            font-size: 0.8em;
            color: #7f8c8d;
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            border-bottom: 1px dashed #eee;
            padding-bottom: 10px;
        }

        /* Card Preview Text */
        .card-preview {
            font-size: 0.9em;
            color: #555;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 15px;
        }

        /* Outline Section */
        .card-outline {
            font-size: 0.8em;
            color: #555;
            background: #f0f8ff;
            padding: 8px 10px;
            border-radius: 4px;
            border-left: 3px solid var(--primary);
            margin-bottom: 15px;
        }
        .card-outline strong { color: #2c3e50; }

        /* Classification */
        .card-classification {
            font-size: 0.8em;
            color: #555;
            background: #fdfae6;
            padding: 5px 10px;
            border-radius: 4px;
            border-left: 3px solid #f1c40f;
            margin-bottom: 15px;
        }

        /* Vocabulary Toggle Section (At the bottom) */
        .vocab-section {
            margin-top: auto; 
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .vocab-toggle-btn {
            background: #f0f4f8;
            color: var(--primary);
            border: 1px solid #dcdde1;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        .vocab-toggle-btn:hover { background: #e1e8ed; }
        
        .vocab-content {
            display: none; 
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 15px;
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.85em;
        }
        .vocab-content.active { display: block; }
        
        /* Vocabulary list styling */
        .vocab-content p { margin: 0 0 10px 0; }
        .vocab-content strong { color: #2c3e50; display: block; margin-bottom: 2px; }
        .vocab-content .urdu-text { 
            font-family: 'Noto Nastaliq Urdu', serif; 
            direction: rtl; 
            text-align: right; 
            font-size: 1.1em; 
            line-height: 2;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        .vocab-content .vocab-item {
            border-bottom: 1px dashed #ddd;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .vocab-content .vocab-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        /* Card Actions (Read Essay Button top right) */
        .read-essay-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .read-essay-btn:hover { background: var(--primary-hover); }

        /* Floating Refresh Button */
        .refresh-btn {
            position: fixed; bottom: 25px; right: 25px; width: 56px; height: 56px;
            background-color: var(--primary); color: white; border: none; border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: background 0.2s, transform 0.2s; z-index: 900;
        }
        .refresh-btn:hover { background-color: var(--primary-hover); transform: rotate(30deg); }
        .refresh-btn svg { width: 24px; height: 24px; fill: currentColor; }
        .refresh-btn.loading svg { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Modal Styles */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); z-index: 1000;
            justify-content: center; align-items: flex-end;
        }
        @media (min-width: 768px) { .modal-overlay { align-items: center; } }

        .modal-content {
            background: #fff; width: 100%; height: 95vh; max-width: 900px;
            border-radius: 20px 20px 0 0; display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }
        @media (min-width: 768px) {
            .modal-content { height: 90vh; border-radius: 12px; animation: fadeIn 0.3s ease; }
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* Modal Header */
        .modal-header {
            padding: 12px 15px; background: #f8f9fa; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }
        .modal-header-title {
            font-weight: bold; font-size: 1.1em; color: #2c3e50;
        }
        .modal-header-actions { display: flex; gap: 10px; }
        
        .action-btn {
            border: none; border-radius: 6px; cursor: pointer;
            font-size: 0.85em; font-weight: bold; padding: 8px 12px;
            display: flex; align-items: center; gap: 5px; transition: background 0.2s;
        }
        .copy-btn { background: var(--success); color: white; }
        .copy-btn:hover { background: #219150; }
        .copy-btn.copied { background: #2c3e50; }
        
        .close-btn {
            background: #e74c3c; color: white; width: 34px; height: 34px;
            padding: 0; justify-content: center; border-radius: 50%;
        }
        .close-btn:hover { background: #c0392b; }

        .modal-body {
            padding: 20px; overflow-y: auto; color: var(--text);
            -webkit-overflow-scrolling: touch; flex-grow: 1;
        }

        /* Reading View Markdown Styles */
        .modal-body h1, .modal-body h2, .modal-body h3 { color: #2c3e50; margin-top: 1.5em; margin-bottom: 0.5em; }
        .modal-body p { margin-bottom: 1em; }
        .modal-body blockquote {
            border-left: 4px solid var(--primary); margin: 0; padding-left: 15px;
            color: #555; font-style: italic; background: #f9f9f9; padding: 10px 15px; border-radius: 0 5px 5px 0;
        }

        .loading, .error { text-align: center; padding: 40px 20px; font-size: 1.1em; grid-column: 1 / -1; }
        .error { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Essay Collection</h1>
        </header>
        <div id="essays-container" class="essay-grid">
            <div class="loading">Loading essays... Please wait.</div>
        </div>
    </div>

    <!-- Floating Refresh Button -->
    <button class="refresh-btn" id="refreshBtn" onclick="forceRefresh()" title="Refresh Data">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>

    <!-- Reading Modal -->
    <div id="essayModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-header-title">Reading Essay</div>
                <div class="modal-header-actions">
                    <button class="action-btn copy-btn" id="copyBtn" onclick="copyEssayText()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy
                    </button>
                    <button class="action-btn close-btn" onclick="closeModal()">✕</button>
                </div>
            </div>
            <div class="modal-body" id="modalBody" onscroll="saveScrollPosition()"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQT6SIpNx8XznQsOgvBHjsz_-HgNO_cmBvxZaIhDcnwgGwJpx932G6nHPv9aVo-p8GF1srqAHzn35u2/pub?output=csv'; 

        // --- STATE MANAGEMENT ---
        const container = document.getElementById('essays-container');
        const modal = document.getElementById('essayModal');
        const modalBody = document.getElementById('modalBody');
        const refreshBtn = document.getElementById('refreshBtn');
        const copyBtn = document.getElementById('copyBtn');
        
        let essaysData = []; 
        let currentEssayIndex = null; 
        let scrollSaveTimeout;

        // --- DATA FETCHING & PARSING ---
        function loadEssays(forceRefresh = false) {
            if (!forceRefresh && essaysData.length === 0) {
                container.innerHTML = '<div class="loading">Loading essays...</div>';
            }
            refreshBtn.classList.add('loading');

            const fetchUrl = forceRefresh ? csvUrl + '&t=' + new Date().getTime() : csvUrl;

            Papa.parse(fetchUrl, {
                download: true,
                header: false, 
                dynamicTyping: true,
                complete: function(results) {
                    refreshBtn.classList.remove('loading');
                    const rawRows = results.data.slice(1); 
                    
                    essaysData = rawRows
                        .map((row, index) => {
                            // FIX: Add .trim() here to remove hidden spaces or newlines
                            const fullMarkdown = row[1] ? String(row[1]).trim() : '';
                            if (!fullMarkdown) return null;

                            // 1. Extract Title
                            // FIX: Regex now handles possible spaces before the #
                            let titleMatch = fullMarkdown.match(/^\s*#\s+(.+)$/m);
                            let title = titleMatch ? titleMatch[1].trim() : `Essay ${index + 1}`;

                            // 2. Extract Meta
                            let srNoMatch = fullMarkdown.match(/\*\*SR No:\*\*\s*(.+)/);
                            let dateMatch = fullMarkdown.match(/\*\*Date:\*\*\s*(.+)/);
                            let wordCountMatch = fullMarkdown.match(/\*\*Total Essay Word Count:\*\*\s*(.+)/);
                            let classMatch = fullMarkdown.match(/\*\*Primary Type:\*\*\s*(.+)/);
                            
                            let meta = {
                                srNo: srNoMatch ? srNoMatch[1].trim() : '',
                                date: dateMatch ? dateMatch[1].trim() : '',
                                wordCount: wordCountMatch ? wordCountMatch[1].trim() : '',
                                classification: classMatch ? classMatch[1].trim() : ''
                            };

                            // 3. Extract Outline
                            let outlineText = '';
                            let outlineMatch = fullMarkdown.match(/### Outline:\s*\n([\s\S]*?)(?=\n---|\n###|$)/i);
                            if (outlineMatch) {
                                outlineText = outlineMatch[1].trim();
                            }

                            // 4. Extract Vocabulary Section
                            let vocabHtml = '';
                            let vocabSplit = fullMarkdown.split(/### 📚 Vocabulary/i);
                            if (vocabSplit.length > 1) {
                                let rawVocab = vocabSplit[1];
                                
                                let formattedVocab = rawVocab
                                    .replace(/\*\*(\d+)\s+(.+?)\*\*/g, '<div class="vocab-item"><strong>$1. $2</strong>') 
                                    .replace(/\*   \*\*Urdu:\*\*\s*(.+)/g, '<div class="urdu-text">$1</div>') 
                                    .replace(/\*   \*\*Synonyms:\*\*\s*(.+)/g, '<div><strong>Synonyms:</strong> $1</div>') 
                                    .replace(/\*   \*\*Antonyms:\*\*\s*(.+)/g, '<div><strong>Antonyms:</strong> $1</div></div>'); 
                                
                                vocabHtml = formattedVocab;
                            }

                            // 5. Extract Essay Body
                            let essayBody = vocabSplit[0]; 
                            
                            if (titleMatch) essayBody = essayBody.replace(titleMatch[0], '');
                            essayBody = essayBody.replace(/\*\*\(PCS.*?\)\*\*/g, '');
                            essayBody = essayBody.replace(/\*\*SR No:\*\*.*?(?=\n\n|\n---|$)/is, '');
                            essayBody = essayBody.replace(/\*\*Date:\*\*.*?(?=\n\n|\n---|$)/is, '');
                            essayBody = essayBody.replace(/\*\*Total Essay Word Count:\*\*.*?(?=\n\n|\n---|$)/is, '');
                            essayBody = essayBody.replace(/### Outline:[\s\S]*?(?=\n---)/i, ''); 
                            essayBody = essayBody.replace(/### 📝 Classification of Essay[\s\S]*?(?=\n---)/i, '');
                            essayBody = essayBody.replace(/^[\s-]+/, '').trim();

                            // Clean preview text
                            const plainText = essayBody
                                .replace(/[#*`>_|]/g, '') 
                                .replace(/\n/g, ' ')      
                                .substring(0, 150) + '...';

                            return {
                                id: index,
                                title: title,
                                meta: meta,
                                outline: outlineText, 
                                bodyMarkdown: essayBody,
                                vocabHtml: vocabHtml,
                                previewText: plainText
                            };
                        })
                        .filter(item => item !== null);

                    if (essaysData.length === 0) {
                        container.innerHTML = '<div class="error">No valid essay data found in Column B.</div>';
                        return;
                    }

                    renderCards();
                    restoreLastState();
                },
                error: function(error) {
                    refreshBtn.classList.remove('loading');
                    container.innerHTML = `<div class="error">Error loading data: ${error.message}.</div>`;
                }
            });
        }

        // --- RENDERING CARDS ---
        function renderCards() {
            container.innerHTML = ''; 

            essaysData.forEach((essay, index) => {
                // Build the top meta line: "Count of words, Date"
                let metaParts = [];
                if (essay.meta.wordCount) metaParts.push(essay.meta.wordCount);
                if (essay.meta.date) metaParts.push(essay.meta.date);
                let metaString = metaParts.join(' | ');

                // Build the vocabulary toggle
                let vocabSection = '';
                if (essay.vocabHtml) {
                    vocabSection = `
                        <div class="vocab-section">
                            <button class="vocab-toggle-btn" onclick="toggleVocab(event, ${index})">📚 Show Vocabulary</button>
                            <div class="vocab-content" id="vocab-${index}">
                                ${essay.vocabHtml}
                            </div>
                        </div>
                    `;
                }

                // Build outline section
                let outlineSection = '';
                if (essay.outline) {
                    outlineSection = `
                        <div class="card-outline">
                            <strong>Outline:</strong> ${essay.outline}
                        </div>
                    `;
                }

                // Build classification section
                let classificationSection = '';
                if (essay.meta.classification) {
                    classificationSection = `
                        <div class="card-classification">
                            <strong>Classification:</strong> ${essay.meta.classification}
                        </div>
                    `;
                }

                const cardHTML = `
                    <div class="essay-card" id="card-${index}">
                        <div class="card-header">
                            <div class="card-title-group">
                                <span class="card-srno">${essay.meta.srNo ? essay.meta.srNo + '.' : ''}</span>
                                <span class="card-title">${essay.title}</span>
                            </div>
                            <button class="read-essay-btn" onclick="openModal(${index})">
                                Read 
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </button>
                        </div>
                        <div class="card-meta">
                            ${metaString}
                        </div>
                        <div class="card-preview">${essay.previewText}</div>
                        
                        ${outlineSection}
                        ${classificationSection}
                        ${vocabSection}
                    </div>
                `;
                
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // --- VOCABULARY TOGGLE LOGIC ---
        function toggleVocab(event, index) {
            event.preventDefault(); 
            event.stopPropagation(); 
            
            const vocabDiv = document.getElementById(`vocab-${index}`);
            const btn = event.currentTarget;
            
            if (vocabDiv.classList.contains('active')) {
                vocabDiv.classList.remove('active');
                btn.innerHTML = '📚 Show Vocabulary';
            } else {
                vocabDiv.classList.add('active');
                btn.innerHTML = '📚 Hide Vocabulary';
            }
        }

        // --- MODAL LOGIC ---
        function openModal(index) {
            if (!essaysData[index]) return;
            
            currentEssayIndex = index;
            const essay = essaysData[index];
            
            modalBody.innerHTML = marked.parse(essay.bodyMarkdown);
            
            copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy`;
            copyBtn.classList.remove('copied');
            
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; 

            const savedScroll = localStorage.getItem(`essay_scroll_${index}`);
            if (savedScroll) {
                setTimeout(() => {
                    modalBody.scrollTop = parseInt(savedScroll, 10);
                }, 50);
            } else {
                modalBody.scrollTop = 0; 
            }

            localStorage.setItem('last_open_essay', index);
        }

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
            
            localStorage.removeItem('last_open_essay');
            currentEssayIndex = null;
        }

        // --- COPY TO CLIPBOARD LOGIC ---
        function copyEssayText() {
            if (currentEssayIndex === null) return;
            
            const essay = essaysData[currentEssayIndex];
            const textToCopy = `${essay.title}\n\n${essay.bodyMarkdown}`;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                copyBtn.innerHTML = `✅ Copied!`;
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy`;
                    copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert('Failed to copy text. Please try again.');
            });
        }

        // --- STATE PERSISTENCE ---
        function saveScrollPosition() {
            if (currentEssayIndex !== null) {
                clearTimeout(scrollSaveTimeout);
                scrollSaveTimeout = setTimeout(() => {
                    localStorage.setItem(`essay_scroll_${currentEssayIndex}`, modalBody.scrollTop);
                }, 100);
            }
        }

        function restoreLastState() {
            const lastEssay = localStorage.getItem('last_open_essay');
            if (lastEssay !== null && essaysData[lastEssay]) {
                openModal(parseInt(lastEssay, 10));
            }
        }

        // --- REFRESH LOGIC ---
        function forceRefresh() {
            localStorage.clear();
            closeModal();
            loadEssays(true);
        }

        // --- EVENT LISTENERS ---
        window.onclick = function(event) {
            if (event.target === modal) closeModal();
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && modal.style.display === 'flex') {
                closeModal();
            }
        });

        window.onload = () => loadEssays(false);
    </script>

</body>
</html>
