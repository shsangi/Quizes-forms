<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reading Collection</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-soft: #eff6ff;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --success: #059669;
            --success-soft: #ecfdf5;
            --success-border: #10b981;
            --danger: #dc2626;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 10px rgba(0,0,0,0.06);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            min-height: 100dvh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px 16px 110px; }

        header { text-align: center; margin-bottom: 24px; padding-top: 8px; }
        h1 { font-size: 1.6rem; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.03em; }
        .subtitle { margin: 0; font-size: 0.9rem; color: var(--text-secondary); }

        .essay-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media (min-width: 640px) {
            .essay-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; }
            .container { padding: 24px 20px 110px; }
            h1 { font-size: 1.8rem; }
        }
        @media (min-width: 1024px) {
            .essay-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
        }

        .essay-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            border-top: 4px solid var(--primary);
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
        }

        .essay-card.read {
            border-top-color: var(--success-border);
            background-color: var(--success-soft);
            border-color: #d1fae5;
        }

        @media (hover: hover) {
            .essay-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }

        .card-title-group {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 6px;
        }
        .card-title-group:active { opacity: 0.75; }
        .card-srno { font-size: 0.8rem; font-weight: 600; color: var(--primary); }
        
        .card-title {
            font-size: 1rem; font-weight: 600; color: var(--text); 
            line-height: 1.3; cursor: pointer; text-decoration: none;
        }
        .card-title:hover { text-decoration: underline; color: var(--primary); }

        .card-nav-icon {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--primary-soft); border: none; color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; cursor: pointer; transition: background 0.2s;
        }
        .card-nav-icon:active { background: #dbeafe; }
        .card-nav-icon svg { width: 18px; height: 18px; }

        .card-meta {
            font-size: 0.75rem; color: var(--text-secondary);
            display: flex; flex-wrap: wrap; gap: 10px;
            margin-bottom: 12px; padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .card-classification {
            font-size: 0.75rem; background: #fefce8; color: #854d0e;
            padding: 8px 10px; border-radius: 6px;
            border-left: 3px solid #eab308; margin-bottom: 12px; line-height: 1.4;
        }

        .vocab-section { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }

        .vocab-toggle-btn {
            width: 100%; background: #f8fafc; border: 1px solid var(--border);
            color: var(--primary); font-size: 0.85rem; font-weight: 600;
            padding: 10px 14px; border-radius: var(--radius-sm); cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 0.2s;
        }
        .vocab-toggle-btn:active { background: #f1f5f9; }

        .vocab-content {
            display: none; margin-top: 10px; max-height: 320px;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        .vocab-content.active { display: block; }

        .vocab-item {
            background: #f8fafc; border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
        }
        .vocab-item:last-child { margin-bottom: 0; }

        .vocab-word {
            font-size: 0.9rem; font-weight: 600; color: var(--text);
            margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
        }

        .vocab-word .number {
            background: var(--primary); color: white; font-size: 0.7rem;
            font-weight: 600; width: 20px; height: 20px; border-radius: 5px;
            display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        .vocab-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .vocab-link:hover { text-decoration: underline; color: var(--primary-hover); }

        .urdu-text {
            font-family: 'Noto Nastaliq Urdu', serif; direction: rtl; text-align: right;
            font-size: 1.15rem; line-height: 1.8; color: #1e293b;
            background: white; padding: 8px 12px; border-radius: 6px;
            border: 1px solid #e2e8f0; margin: 6px 0 8px;
        }

        .vocab-meta { display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem; }
        .vocab-meta-row { display: flex; gap: 6px; line-height: 1.4; }
        .vocab-label { font-weight: 600; color: var(--text-secondary); min-width: 72px; flex-shrink: 0; }
        .vocab-value { color: var(--text); }

        .refresh-btn {
            position: fixed; bottom: 24px; right: 20px; width: 56px; height: 56px;
            background: var(--primary); color: white; border: none; border-radius: 50%;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 900;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
        }
        
        .refresh-btn:active { transform: scale(0.85); }
        
        .refresh-btn.loading {
            animation: morphLoad 1.2s ease-in-out infinite;
            background: var(--primary-hover);
        }
        
        .refresh-btn.loading svg { animation: spin 0.8s linear infinite; }
        
        @keyframes morphLoad {
            0%   { transform: scale(1) rotate(0deg); border-radius: 50%; }
            50%  { transform: scale(0.85) rotate(180deg); border-radius: 35%; }
            100% { transform: scale(1) rotate(360deg); border-radius: 50%; }
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .refresh-btn svg { width: 24px; height: 24px; fill: currentColor; }

        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(5px);
            z-index: 1000; justify-content: center; align-items: flex-end;
        }
        @media (min-width: 768px) {
            .modal-overlay { align-items: center; padding: 24px; }
        }

        .modal-content {
            background: white; width: 100%; height: 94dvh; max-width: 860px;
            border-radius: 20px 20px 0 0; display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            animation: slideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @media (min-width: 768px) {
            .modal-content { height: 90vh; border-radius: 16px; animation: fadeIn 0.25s ease; }
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

        .modal-header {
            padding: 14px 16px; background: #f8fafc; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            flex-shrink: 0;
        }
        .modal-header-title {
            font-weight: 600; font-size: 1rem; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .modal-header-actions { display: flex; gap: 8px; flex-shrink: 0; }

        .action-btn {
            border: none; border-radius: 9px; font-size: 0.875rem;
            font-weight: 600; padding: 10px 14px;
            display: flex; align-items: center; gap: 6px;
            cursor: pointer; transition: background 0.2s;
        }
        .copy-btn { background: var(--success); color: white; }
        .copy-btn:active { background: #047857; }
        .copy-btn.copied { background: #0f172a; }

        .close-btn {
            background: var(--danger); color: white; width: 40px; height: 40px;
            padding: 0; justify-content: center; border-radius: 50%; font-size: 1.15rem;
        }
        .close-btn:active { background: #b91c1c; }

        .modal-body {
            padding: 22px 18px 48px; overflow-y: auto;
            -webkit-overflow-scrolling: touch; flex: 1;
            overscroll-behavior: contain;
        }
        @media (min-width: 640px) { .modal-body { padding: 28px 32px 50px; } }

        .reading-essay-title {
            font-size: 1.4rem; font-weight: 700; color: var(--text);
            margin: 0 0 20px; line-height: 1.3; letter-spacing: -0.02em;
            border-bottom: 2px solid var(--border); padding-bottom: 16px;
        }
        @media (min-width: 640px) { .reading-essay-title { font-size: 1.6rem; } }

        .reading-outline-box {
            background: var(--primary-soft); border-left: 4px solid var(--primary);
            padding: 16px 18px; margin-bottom: 28px; border-radius: 0 10px 10px 0;
            font-size: 0.95rem; color: #1e3a5f; line-height: 1.55;
        }
        .reading-outline-box strong {
            display: block; margin-bottom: 6px; color: var(--text); font-size: 1rem;
        }

        .modal-body h1 { font-size: 1.35rem; margin: 1.5em 0 0.6em; }
        .modal-body h2, .modal-body h3 { margin: 1.4em 0 0.5em; font-weight: 600; }
        .modal-body p { margin-bottom: 1.1em; line-height: 1.7; }

        .modal-body blockquote {
            border-left: 4px solid var(--primary); margin: 1.2em 0;
            padding: 12px 18px; background: #f8fafc; border-radius: 0 8px 8px 0;
            color: #475569; font-style: italic;
        }

        .loading, .error {
            text-align: center; padding: 60px 20px; grid-column: 1 / -1;
            color: var(--text-secondary); font-size: 1.05rem;
        }
        .error { color: var(--danger); font-weight: 600; }

        /* Bottom-to-top: reverse the visual order */
        .essay-grid.reverse {
            display: flex;
            flex-direction: column-reverse;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Reading Collection</h1>
            <p class="subtitle">Essays, news, books & random reads</p>
        </header>

        <div id="essays-container" class="essay-grid">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <button class="refresh-btn" id="refreshBtn" onclick="forceRefresh()" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>

    <div id="essayModal" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-header-title">Reading</div>
                <div class="modal-header-actions">
                    <button class="action-btn copy-btn" id="copyBtn" onclick="copyEssayText()">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy
                    </button>
                    <button class="action-btn close-btn" onclick="closeModal()" aria-label="Close">✕</button>
                </div>
            </div>
            <div class="modal-body" id="modalBody" onscroll="saveScrollPosition()"></div>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQT6SIpNx8XznQsOgvBHjsz_-HgNO_cmBvxZaIhDcnwgGwJpx932G6nHPv9aVo-p8GF1srqAHzn35u2/pub?output=csv'; 

        const container = document.getElementById('essays-container');
        const modal = document.getElementById('essayModal');
        const modalBody = document.getElementById('modalBody');
        const refreshBtn = document.getElementById('refreshBtn');
        const copyBtn = document.getElementById('copyBtn');
        
        let essaysData = []; 
        let currentEssayIndex = null; 
        let scrollSaveTimeout;

        // ---------- HELPERS ----------
        function createSearchLink(query) {
            if (!query || query.trim() === '') return '';
            const cleaned = query.replace(/["']/g, '').replace(/\s+/g, ' ').trim();
            const encoded = encodeURIComponent(cleaned);
            return `<a href="https://www.google.com/search?q=${encoded}" target="_blank" rel="noopener noreferrer" class="vocab-link">${query}</a>`;
        }

        function linkifyList(list) {
            if (!list) return '';
            return list.split(',').map(item => {
                const trimmed = item.trim();
                if (!trimmed) return '';
                return createSearchLink(trimmed);
            }).filter(Boolean).join(', ');
        }

        // Extract vocabulary from "## Vocabulary in Detail" (works for both formats)
        function extractVocab(markdown) {
            let vocabHtml = '';
            // Match either "### 📚 Vocabulary" OR "## Vocabulary in Detail"
            let vocabSplit = markdown.split(/###\s*📚\s*Vocabulary|##\s*Vocabulary in Detail/i);
            if (vocabSplit.length < 2) return { body: markdown, vocabHtml: '' };

            let rawVocab = vocabSplit[1];
            let items = [];

            // Pattern A: **1 Word** (first format)
            let regexA = /\*\*(\d+)\s+(.+?)\*\*[\s\S]*?(?=\*\*\d+\s+|$)/g;
            // Pattern B: ### 1. Word (second format)
            let regexB = /###\s*(\d+)\.\s*(.+?)\n([\s\S]*?)(?=\n###\s*\d+\.|$)/g;

            let match;
            let foundA = false;

            while ((match = regexA.exec(rawVocab)) !== null) {
                foundA = true;
                const number = match[1];
                const word = match[2].trim();
                const block = match[0];

                const urduMatch = block.match(/\*\*Urdu:\*\*\s*(.+)/i) || block.match(/\*\*Urdu Meaning:\*\*\s*(.+)/i);
                const defMatch = block.match(/\*\*English Definition:\*\*\s*(.+)/i);
                const synMatch = block.match(/\*\*Synonyms:\*\*\s*(.+)/i);
                const antMatch = block.match(/\*\*Antonyms:\*\*\s*(.+)/i);

                const urdu = urduMatch ? urduMatch[1].trim() : '';
                const engDef = defMatch ? defMatch[1].trim() : '';
                const synonyms = synMatch ? synMatch[1].trim() : '';
                const antonyms = antMatch ? antMatch[1].trim() : '';

                items.push(buildVocabItem(number, word, urdu, engDef, synonyms, antonyms));
            }

            // If Pattern A found nothing, try Pattern B
            if (!foundA) {
                while ((match = regexB.exec(rawVocab)) !== null) {
                    const number = match[1];
                    const word = match[2].trim();
                    const block = match[3];

                    const urduMatch = block.match(/\*\*Urdu Meaning:\*\*\s*(.+)/i) || block.match(/\*\*Urdu:\*\*\s*(.+)/i);
                    const defMatch = block.match(/\*\*English Definition:\*\*\s*(.+)/i);
                    const synMatch = block.match(/\*\*Synonyms:\*\*\s*(.+)/i);
                    const antMatch = block.match(/\*\*Antonyms:\*\*\s*(.+)/i);

                    const urdu = urduMatch ? urduMatch[1].trim() : '';
                    const engDef = defMatch ? defMatch[1].trim() : '';
                    const synonyms = synMatch ? synMatch[1].trim() : '';
                    const antonyms = antMatch ? antMatch[1].trim() : '';

                    items.push(buildVocabItem(number, word, urdu, engDef, synonyms, antonyms));
                }
            }

            vocabHtml = items.join('');
            return { body: vocabSplit[0], vocabHtml };
        }

        function buildVocabItem(number, word, urdu, engDef, synonyms, antonyms) {
            const wordLink = createSearchLink(word);
            const synLinks = linkifyList(synonyms);
            const antLinks = linkifyList(antonyms);

            return `
                <div class="vocab-item">
                    <div class="vocab-word">
                        <span class="number">${number}</span>
                        ${wordLink}
                    </div>
                    ${urdu ? `<div class="urdu-text">${urdu}</div>` : ''}
                    ${engDef ? `<div class="vocab-meta-row" style="margin-bottom:6px;"><span class="vocab-label">Definition</span><span class="vocab-value">${engDef}</span></div>` : ''}
                    <div class="vocab-meta">
                        ${synLinks ? `<div class="vocab-meta-row"><span class="vocab-label">Synonyms</span><span class="vocab-value">${synLinks}</span></div>` : ''}
                        ${antLinks ? `<div class="vocab-meta-row"><span class="vocab-label">Antonyms</span><span class="vocab-value">${antLinks}</span></div>` : ''}
                    </div>
                </div>
            `;
        }

        // ---------- UNIFIED PARSER ----------
        // Handles both structured essays AND random reading (news, books)
        function parseRow(row, index) {
            const fullMarkdown = row[1] ? String(row[1]).trim() : '';
            if (!fullMarkdown) return null;

            const rawStatus = row[2];
            const isReadFromSheet = rawStatus !== null && rawStatus !== undefined && String(rawStatus).trim() !== '';

            // Title: first # heading
            let titleMatch = fullMarkdown.match(/^\s*#\s+(.+)$/m);
            let title = titleMatch ? titleMatch[1].trim() : `Reading ${index + 1}`;

            // Metadata (only present in structured essays)
            let srNoMatch = fullMarkdown.match(/\*\*SR No:\*\*\s*(.+)/);
            let dateMatch = fullMarkdown.match(/\*\*Date:\*\*\s*(.+)/) || fullMarkdown.match(/\*\*Dated:\*\*\s*(.+)/i);
            let wordCountMatch = fullMarkdown.match(/\*\*Total Essay Word Count:\*\*\s*(.+)/);
            let classMatch = fullMarkdown.match(/\*\*Primary Type:\*\*\s*(.+)/);

            let meta = {
                srNo: srNoMatch ? srNoMatch[1].trim() : '',
                date: dateMatch ? dateMatch[1].trim() : '',
                wordCount: wordCountMatch ? wordCountMatch[1].trim() : '',
                classification: classMatch ? classMatch[1].trim() : ''
            };

            // Outline (only for structured essays)
            let outlineText = '';
            let outlineMatch = fullMarkdown.match(/### Outline:\s*\n([\s\S]*?)(?=\n---|\n###|$)/i);
            if (outlineMatch) outlineText = outlineMatch[1].trim();

            // Extract vocabulary
            const { body: bodyWithoutVocab, vocabHtml } = extractVocab(fullMarkdown);

            // Clean body
            let essayBody = bodyWithoutVocab;
            if (titleMatch) essayBody = essayBody.replace(titleMatch[0], '');
            essayBody = essayBody.replace(/\*\*\(PCS.*?\)\*\*/g, '');
            essayBody = essayBody.replace(/\*\*SR No:\*\*.*?(?=\n\n|\n---|$)/is, '');
            essayBody = essayBody.replace(/\*\*Date:\*\*.*?(?=\n\n|\n---|$)/is, '');
            essayBody = essayBody.replace(/\*\*Dated:\*\*.*?(?=\n\n|\n---|$)/is, '');
            essayBody = essayBody.replace(/\*\*Total Essay Word Count:\*\*.*?(?=\n\n|\n---|$)/is, '');
            essayBody = essayBody.replace(/### Outline:[\s\S]*?(?=\n---)/i, '');
            essayBody = essayBody.replace(/### 📝 Classification of Essay[\s\S]*?(?=\n---)/i, '');
            // Remove the leading horizontal rule if present
            essayBody = essayBody.replace(/^\s*---\s*\n/, '');
            essayBody = essayBody.replace(/^[\s-]+/, '').trim();

            return {
                id: index,                     // original index (for localStorage)
                title: title,
                meta: meta,
                outline: outlineText,
                bodyMarkdown: essayBody,
                vocabHtml: vocabHtml,
                isReadFromSheet: isReadFromSheet
            };
        }

        // ---------- LOAD ----------
        function loadEssays(forceRefresh = false) {
            if (!forceRefresh && essaysData.length === 0) {
                container.innerHTML = '<div class="loading">Loading...</div>';
            }
            refreshBtn.classList.add('loading');

            const fetchUrl = forceRefresh ? csvUrl + '&t=' + new Date().getTime() : csvUrl;

            Papa.parse(fetchUrl, {
                download: true,
                header: false, 
                dynamicTyping: true,
                complete: function(results) {
                    setTimeout(() => refreshBtn.classList.remove('loading'), 500);
                    const rawRows = results.data.slice(1); 
                    
                    let parsed = rawRows
                        .map((row, index) => parseRow(row, index))
                        .filter(item => item !== null);

                    if (parsed.length === 0) {
                        container.innerHTML = '<div class="error">No valid reading data found.</div>';
                        return;
                    }

                    // Assign serial numbers: last record gets 1, first gets total
                    const total = parsed.length;
                    parsed.forEach((item, idx) => {
                        item.meta.srNo = (total - idx).toString();
                    });

                    // Reverse for bottom-to-top display (newest first)
                    parsed.reverse();

                    essaysData = parsed;

                    renderCards();
                    restoreLastState();
                },
                error: function(error) {
                    refreshBtn.classList.remove('loading');
                    container.innerHTML = `<div class="error">Error loading data: ${error.message}</div>`;
                }
            });
        }

        // ---------- RENDER ----------
        function renderCards() {
            container.innerHTML = ''; 

            essaysData.forEach((essay, index) => {
                let metaParts = [];
                if (essay.meta.wordCount) metaParts.push(`📝 ${essay.meta.wordCount}`);
                if (essay.meta.date) metaParts.push(`📅 ${essay.meta.date}`);
                let metaString = metaParts.map(p => `<span>${p}</span>`).join('');

                let vocabSection = '';
                if (essay.vocabHtml) {
                    vocabSection = `
                        <div class="vocab-section">
                            <button class="vocab-toggle-btn" onclick="toggleVocab(event, ${index})">
                                📚 Show Vocabulary
                            </button>
                            <div class="vocab-content" id="vocab-${index}">
                                ${essay.vocabHtml}
                            </div>
                        </div>
                    `;
                }

                let classificationSection = '';
                if (essay.meta.classification) {
                    classificationSection = `
                        <div class="card-classification">
                            <strong>Classification:</strong> ${essay.meta.classification}
                        </div>
                    `;
                }

                const isReadLocally = localStorage.getItem(`essay_read_${essay.id}`) === 'true';
                const isRead = essay.isReadFromSheet || isReadLocally;
                const readClass = isRead ? 'read' : '';

                const titleSearchLink = createSearchLink(essay.title);

                const cardHTML = `
                    <div class="essay-card ${readClass}" id="card-${index}">
                        <div class="card-header">
                            <div class="card-title-group">
                                <span class="card-srno">${essay.meta.srNo ? essay.meta.srNo + '.' : ''}</span>
                                <span class="card-title">${titleSearchLink}</span>
                            </div>
                            <button class="card-nav-icon" onclick="openModal(${index})" aria-label="Read">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </button>
                        </div>
                        <div class="card-meta">${metaString}</div>
                        ${classificationSection}
                        ${vocabSection}
                    </div>
                `;
                
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // ---------- INTERACTIONS ----------
        function toggleVocab(event, index) {
            event.preventDefault(); 
            event.stopPropagation(); 
            
            const vocabDiv = document.getElementById(`vocab-${index}`);
            const btn = event.currentTarget;
            
            if (vocabDiv.classList.contains('active')) {
                vocabDiv.classList.remove('active');
                btn.innerHTML = '📚 Show Vocabulary';
            } else {
                vocabDiv.classList.add('active');
                btn.innerHTML = '📚 Hide Vocabulary';
            }
        }

        function openModal(index) {
            if (!essaysData[index]) return;
            
            currentEssayIndex = index;
            const essay = essaysData[index];
            
            localStorage.setItem(`essay_read_${essay.id}`, 'true');
            const cardElement = document.getElementById(`card-${index}`);
            if (cardElement) cardElement.classList.add('read');
            
            let readingHtml = `<div class="reading-essay-title">${essay.title}</div>`;
            
            if (essay.outline) {
                readingHtml += `
                    <div class="reading-outline-box">
                        <strong>📝 Part of Essay (Outline)</strong>
                        ${essay.outline}
                    </div>
                `;
            }
            
            readingHtml += marked.parse(essay.bodyMarkdown);
            
            modalBody.innerHTML = readingHtml;
            
            copyBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy`;
            copyBtn.classList.remove('copied');
            
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; 

            const savedScroll = localStorage.getItem(`essay_scroll_${essay.id}`);
            if (savedScroll) {
                setTimeout(() => {
                    modalBody.scrollTop = parseInt(savedScroll, 10);
                }, 50);
            } else {
                modalBody.scrollTop = 0; 
            }

            localStorage.setItem('last_open_essay_id', essay.id);
        }

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
            localStorage.removeItem('last_open_essay_id');
            currentEssayIndex = null;
        }

        function copyEssayText() {
            if (currentEssayIndex === null) return;
            
            const essay = essaysData[currentEssayIndex];
            let textToCopy = `${essay.title}\n\n`;
            if (essay.outline) {
                textToCopy += `Part of Essay (Outline):\n${essay.outline}\n\n`;
            }
            textToCopy += essay.bodyMarkdown;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                copyBtn.innerHTML = `✅ Copied!`;
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy`;
                    copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                alert('Failed to copy text. Please try again.');
            });
        }

        function saveScrollPosition() {
            if (currentEssayIndex !== null) {
                clearTimeout(scrollSaveTimeout);
                scrollSaveTimeout = setTimeout(() => {
                    const essay = essaysData[currentEssayIndex];
                    if (essay) {
                        localStorage.setItem(`essay_scroll_${essay.id}`, modalBody.scrollTop);
                    }
                }, 100);
            }
        }

        function restoreLastState() {
            const lastEssayId = localStorage.getItem('last_open_essay_id');
            if (lastEssayId !== null) {
                const idx = essaysData.findIndex(e => e.id == lastEssayId);
                if (idx !== -1) openModal(idx);
            }
        }

        function forceRefresh() {
            localStorage.clear();
            closeModal();
            loadEssays(true);
        }

        window.onclick = function(event) {
            if (event.target === modal) closeModal();
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && modal.style.display === 'flex') {
                closeModal();
            }
        });

        window.onload = () => loadEssays(false);
    </script>

</body>
</html>
