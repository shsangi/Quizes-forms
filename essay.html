<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essays Dashboard</title>
    
    <!-- 1. Load Marked.js (converts Markdown to HTML) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- 2. Load SheetJS (reads Excel .xlsx files) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .essay-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 25px;
            margin-bottom: 25px;
            border-top: 5px solid #3498db;
        }
        .essay-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #7f8c8d;
        }
        .essay-content {
            font-size: 1.05em;
        }
        /* Styles for the Markdown content */
        .essay-content h1, .essay-content h2, .essay-content h3 {
            color: #2c3e50;
        }
        .essay-content blockquote {
            border-left: 4px solid #3498db;
            margin: 0;
            padding-left: 15px;
            color: #555;
            font-style: italic;
            background: #f9f9f9;
            padding: 10px 15px;
        }
        .loading {
            text-align: center;
            font-size: 1.2em;
            color: #7f8c8d;
        }
        .error {
            color: #e74c3c;
            text-align: center;
            font-weight: bold;
            background: #fadbd8;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Essay Collection</h1>
        <div id="essays-container">
            <div class="loading">Loading essays... Please wait.</div>
        </div>
    </div>

    <script>
        // Your original Google Sheets URL
        const rawUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQT6SIpNx8XznQsOgvBHjsz_-HgNO_cmBvxZaIhDcnwgGwJpx932G6nHPv9aVo-p8GF1srqAHzn35u2/pub?output=xlsx';
        
        // We must use a CORS proxy to allow the browser to fetch the Excel file from Google
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(rawUrl);

        const container = document.getElementById('essays-container');

        async function loadEssays() {
            try {
                // Fetch the file through the proxy
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Network response was not ok");
                
                // Get the raw binary data
                const arrayBuffer = await response.arrayBuffer();
                
                // Parse the Excel file using SheetJS
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                
                // Get the first sheet
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // Convert the sheet data to JSON
                const data = XLSX.utils.sheet_to_json(worksheet);
                
                renderEssays(data);
                
            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="error">Error loading data. Please check the browser console for details. <br><br>Note: If you are opening this file directly from your computer (file://), your browser might block the request. Try using a local server or upload this HTML file to a website.</div>`;
            }
        }

        function renderEssays(data) {
            container.innerHTML = ''; // Clear loading message

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="error">No data found in the spreadsheet.</div>';
                return;
            }

            // Map through the rows. Ensure your headers exactly match: srno, essay_markdown, date
            data.forEach(row => {
                // Check if the required column exists
                if (row.essay_markdown) {
                    
                    // Convert Markdown to HTML
                    const parsedMarkdown = marked.parse(row.essay_markdown);
                    
                    // Format the date (checks if date is an Excel number or a string)
                    let dateStr = 'No date';
                    if (row.date) {
                        if (typeof row.date === 'number') {
                            // Convert Excel serial date to JS Date
                            dateStr = new Date((row.date - 25569) * 86400 * 1000).toLocaleDateString();
                        } else {
                            dateStr = new Date(row.date).toLocaleDateString();
                        }
                    }

                    const cardHTML = `
                        <div class="essay-card">
                            <div class="essay-header">
                                <span><strong>SR No:</strong> ${row.srno || 'N/A'}</span>
                                <span><strong>Date:</strong> ${dateStr}</span>
                            </div>
                            <div class="essay-content">
                                ${parsedMarkdown}
                            </div>
                        </div>
                    `;
                    
                    container.insertAdjacentHTML('beforeend', cardHTML);
                }
            });

            if (container.innerHTML === '') {
                container.innerHTML = '<div class="error">No valid essays found. Please check that your column header is exactly "essay_markdown".</div>';
            }
        }

        // Run the function on page load
        window.onload = loadEssays;
    </script>

</body>
</html>
