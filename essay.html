<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essays Dashboard</title>
    
    <!-- 1. Load Marked.js (converts Markdown to HTML) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- 2. Load PapaParse (reads CSV files easily) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .essay-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 25px;
            margin-bottom: 25px;
            border-top: 5px solid #3498db;
        }
        .essay-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #7f8c8d;
        }
        .essay-content {
            font-size: 1.05em;
        }
        /* Styles for the Markdown content */
        .essay-content h1, .essay-content h2, .essay-content h3 {
            color: #2c3e50;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }
        .essay-content blockquote {
            border-left: 4px solid #3498db;
            margin: 0;
            padding-left: 15px;
            color: #555;
            font-style: italic;
            background: #f9f9f9;
            padding: 10px 15px;
        }
        .essay-content p {
            margin-bottom: 1em;
        }
        .loading {
            text-align: center;
            font-size: 1.2em;
            color: #7f8c8d;
        }
        .error {
            color: #e74c3c;
            text-align: center;
            font-weight: bold;
            background: #fadbd8;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Essay Collection</h1>
        <div id="essays-container">
            <div class="loading">Loading essays... Please wait.</div>
        </div>
    </div>

    <script>
        // Your exact published CSV link
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQT6SIpNx8XznQsOgvBHjsz_-HgNO_cmBvxZaIhDcnwgGwJpx932G6nHPv9aVo-p8GF1srqAHzn35u2/pub?output=csv'; 

        const container = document.getElementById('essays-container');

        // Function to fetch and display data
        function loadEssays() {
            Papa.parse(csvUrl, {
                download: true,
                header: true, // Treats the first row as headers (srno, essay_markdown, date)
                dynamicTyping: true,
                complete: function(results) {
                    renderEssays(results.data);
                },
                error: function(error) {
                    container.innerHTML = `<div class="error">Error loading data: ${error.message}. Ensure the URL is correct and published to the web.</div>`;
                }
            });
        }

        // Function to render the essays to the HTML
        function renderEssays(data) {
            container.innerHTML = ''; // Clear loading message

            // Filter out empty rows and check for the essay column
            const validData = data.filter(row => row.essay_markdown && row.essay_markdown.trim() !== '');

            if (validData.length === 0) {
                container.innerHTML = '<div class="error">No valid essay data found. Please check that your column header is exactly "essay_markdown" and contains data.</div>';
                return;
            }

            validData.forEach(row => {
                // Extract data based on headers
                const srNo = row.srno || 'N/A';
                const rawMarkdown = row.essay_markdown || '';
                const rawDate = row.date || 'No date';
                
                // Convert Markdown to HTML using marked.js
                const parsedMarkdown = marked.parse(rawMarkdown);
                
                // Format the date
                let dateStr = rawDate;
                if (rawDate && rawDate !== 'No date') {
                    const dateObj = new Date(rawDate);
                    // Check if it's a valid date
                    if (!isNaN(dateObj.getTime())) {
                        dateStr = dateObj.toLocaleDateString();
                    }
                }

                // Create the card HTML
                const cardHTML = `
                    <div class="essay-card">
                        <div class="essay-header">
                            <span><strong>SR No:</strong> ${srNo}</span>
                            <span><strong>Date:</strong> ${dateStr}</span>
                        </div>
                        <div class="essay-content">
                            ${parsedMarkdown}
                        </div>
                    </div>
                `;
                
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Run the function on page load
        window.onload = loadEssays;
    </script>

</body>
</html>
