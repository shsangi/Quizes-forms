const tableBody = document.getElementById('tableBody');
const searchInput = document.getElementById('searchInput');
const categoryFilter = document.getElementById('categoryFilter');
const statusFilter = document.getElementById('statusFilter');
const countDisplay = document.getElementById('countDisplay');

function statusClass(s) {
  if (s === 'V.Imp') return 'vimp';
  if (s === 'Imp') return 'imp';
  return 'note';
}

function render(data) {
  if (data.length === 0) {
    tableBody.innerHTML = '<tr><td colspan="5" class="empty">No matching records found.</td></tr>';
    countDisplay.textContent = '0 of 334 records';
    return;
  }
  let html = '';
  for (const r of data) {
    html += `<tr>
      <td class="row-num">${r.row}</td>
      <td class="category">${r.cat}</td>
      <td class="ref">${r.ref}</td>
      <td class="memory">${r.mem}</td>
      <td><span class="status ${statusClass(r.status)}">${r.status}</span></td>
    </tr>`;
  }
  tableBody.innerHTML = html;
  countDisplay.textContent = `${data.length} of ${DATA.length} records`;
}

function filterData() {
  const q = searchInput.value.toLowerCase().trim();
  const cat = categoryFilter.value;
  const stat = statusFilter.value;

  const filtered = DATA.filter(r => {
    if (cat && r.cat !== cat) return false;
    if (stat && r.status !== stat) return false;
    if (q) {
      const hay = (r.cat + ' ' + r.ref + ' ' + r.mem + ' ' + r.status + ' ' + r.row).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  render(filtered);
}

searchInput.addEventListener('input', filterData);
categoryFilter.addEventListener('change', filterData);
statusFilter.addEventListener('change', filterData);

// Initial render
render(DATA);
</script>
