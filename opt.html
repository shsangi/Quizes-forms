<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>CSS Optional Subject Builder</title>
<style>
  /* ---------- THEME TOKENS ---------- */
  :root, [data-theme="dark"] {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --accent: #38bdf8;
    --ok: #22c55e;
    --danger: #ef4444;
    --warn: #f59e0b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #334155;
    --hover: #2e3d56;
    --grey: #64748b;
  }
  [data-theme="light"] {
    --bg: #f1f5f9;
    --panel: #ffffff;
    --panel-2: #e2e8f0;
    --accent: #0284c7;
    --ok: #16a34a;
    --danger: #dc2626;
    --warn: #d97706;
    --text: #0f172a;
    --muted: #64748b;
    --border: #cbd5e1;
    --hover: #f1f5f9;
    --grey: #94a3b8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    transition: background 0.2s, color 0.2s;
  }

  /* ---------- header ---------- */
  header {
    padding: 8px 12px 6px;
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .title-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  h1 { font-size: 0.95rem; margin: 0; font-weight: 700; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .version { font-size: 0.62rem; color: var(--muted); white-space: nowrap; }

  .theme-btn {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 9px; font-size: 0.68rem; cursor: pointer;
    display: flex; align-items: center; gap: 3px;
  }
  .theme-btn:active { background: var(--hover); }

  /* ---------- selected strip (TOP) ---------- */
  .selected-strip {
    margin-top: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 8px;
    max-height: 28vh;
    overflow-y: auto;
    flex: 0 0 auto;
    transition: border-color 0.2s;
  }
  .selected-strip.valid { border-color: var(--ok); }
  .strip-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px;
  }
  .strip-head .lbl { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .total-pill {
    font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--panel-2); color: var(--text);
    transition: background 0.2s, color 0.2s;
  }
  .total-pill.ok { background: rgba(34,197,94,0.2); color: var(--ok); }
  .total-pill.over { background: rgba(239,68,68,0.2); color: var(--danger); }
  .total-pill.valid-grey { background: var(--panel-2); color: var(--grey); }

  .chosen-list { list-style: none; padding: 0; margin: 0; }
  .chosen-list li {
    display: flex; justify-content: space-between; align-items: center;
    gap: 6px; padding: 4px 8px; border-radius: 6px;
    background: var(--panel-2); margin-bottom: 3px; font-size: 0.74rem;
    border-left: 3px solid transparent;
    transition: background 0.15s, opacity 0.2s;
  }
  .chosen-list li.violating { background: rgba(239,68,68,0.12); }
  .chosen-list li.g1  { border-left-color: #3b82f6; }
  .chosen-list li.g2  { border-left-color: #22c55e; }
  .chosen-list li.g3  { border-left-color: #a855f7; }
  .chosen-list li.g4  { border-left-color: #f59e0b; }
  .chosen-list li.g5  { border-left-color: #ec4899; }
  .chosen-list li.g6  { border-left-color: #06b6d4; }
  .chosen-list li.g7  { border-left-color: #f97316; }
  .chosen-list li.violating.g1, .chosen-list li.violating.g2,
  .chosen-list li.violating.g3, .chosen-list li.violating.g4,
  .chosen-list li.violating.g5, .chosen-list li.violating.g6,
  .chosen-list li.violating.g7 { border-left-color: var(--danger); }

  .chip-left { display: flex; align-items: center; gap: 6px; }
  .group-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }
  .g1 .group-dot { background: #3b82f6; }
  .g2 .group-dot { background: #22c55e; }
  .g3 .group-dot { background: #a855f7; }
  .g4 .group-dot { background: #f59e0b; }
  .g5 .group-dot { background: #ec4899; }
  .g6 .group-dot { background: #06b6d4; }
  .g7 .group-dot { background: #f97316; }

  .chosen-list.valid li { border-left-color: var(--grey) !important; background: var(--panel-2); }
  .chosen-list.valid .group-dot { background: var(--grey) !important; }

  .chosen-list .rm {
    color: var(--danger); background: none; border: none;
    font-size: 1rem; line-height: 1; cursor: pointer; padding: 0 2px;
  }
  .chosen-list.valid .rm { color: var(--grey); }
  .empty { color: var(--muted); font-size: 0.74rem; font-style: italic; padding: 2px 4px; }

  .status { font-size: 0.69rem; margin-top: 4px; min-height: 14px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
  .status.warn { color: var(--warn); }

  .hint {
    font-size: 0.67rem; padding: 5px 8px; border-radius: 6px;
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.4);
    color: var(--danger); margin-top: 4px; display: none;
  }
  .hint.show { display: block; }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex; gap: 6px; padding: 6px 12px;
    flex: 0 0 auto;
  }
  .toolbar button {
    flex: 1; padding: 5px 8px; border-radius: 7px; cursor: pointer;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); font-size: 0.72rem;
  }
  .toolbar button:active { background: var(--hover); }

  /* ---------- groups (scrollable) ---------- */
  #groups {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 0 12px 0;
    -webkit-overflow-scrolling: touch;
    /* huge bottom pad so Group VII clears the home bar / gesture area */
    padding-bottom: calc(140px + env(safe-area-inset-bottom, 0px));
    scroll-padding-bottom: 140px;
  }
  .group {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 6px;
    overflow: hidden;
    scroll-margin-bottom: 120px;
  }
  .group.violation { border-color: var(--danger); }
  .group-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; cursor: pointer; user-select: none;
    background: var(--panel-2); font-size: 0.78rem;
  }
  .group-header:active { background: var(--hover); }
  .group-title { font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .group-title small { color: var(--muted); font-weight: 400; margin-left: 2px; font-size: 0.64rem; }

  .group-badge { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .group[data-group="I"]   .group-badge { background: #3b82f6; }
  .group[data-group="II"]  .group-badge { background: #22c55e; }
  .group[data-group="III"] .group-badge { background: #a855f7; }
  .group[data-group="IV"]  .group-badge { background: #f59e0b; }
  .group[data-group="V"]   .group-badge { background: #ec4899; }
  .group[data-group="VI"]  .group-badge { background: #06b6d4; }
  .group[data-group="VII"] .group-badge { background: #f97316; }

  .chev { transition: transform 0.2s; color: var(--muted); font-size: 0.7rem; }
  .group.open .chev { transform: rotate(90deg); }
  .group-body { display: none; padding: 6px; }
  .group.open .group-body { display: block; }
  .rule { font-size: 0.64rem; color: var(--accent); padding: 2px 6px 4px; }
  .rule-flag { font-size: 0.64rem; color: var(--danger); padding: 0 6px 4px; font-weight: 600; }

  .subject {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent; margin-bottom: 3px; font-size: 0.75rem;
  }
  .subject:active { background: var(--hover); }
  .subject.selected { background: rgba(56,189,248,0.15); border-color: var(--accent); }
  .subject.selected.violating { background: rgba(239,68,68,0.15); border-color: var(--danger); }
  .marks { font-size: 0.67rem; color: var(--muted); }
  .subject.selected .marks { color: var(--accent); }
  .subject.selected.violating .marks { color: var(--danger); }

  /* ---------- floating jump-to-Group-VII button ---------- */
  .jump-btn {
    position: fixed;
    right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    z-index: 40;
    background: #f97316;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 9px 14px;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    display: flex; align-items: center; gap: 5px;
  }
  .jump-btn:active { transform: scale(0.96); }
  .jump-btn.hidden { display: none; }

  @media (min-width: 760px) {
    body { font-size: 14px; max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.1rem; }
    .selected-strip { max-height: 24vh; }
    .subject { padding: 8px 12px; font-size: 0.82rem; }
    .group-header { padding: 10px 14px; font-size: 0.85rem; }
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>CSS Optional Subject Builder</h1>
    <div class="header-right">
      <span class="version">v2.3</span>
      <button class="theme-btn" id="themeBtn" title="Toggle theme">🌙 Dark</button>
    </div>
  </div>

  <div class="selected-strip" id="selectedStrip">
    <div class="strip-head">
      <span class="lbl">Selected · target 600</span>
      <span class="total-pill" id="totalPill">0 / 600</span>
    </div>
    <ul class="chosen-list" id="chosenList">
      <li class="empty">No subjects selected yet.</li>
    </ul>
    <div class="status" id="status">Select subjects to begin.</div>
    <div class="hint" id="hintBox"></div>
  </div>
</header>

<div class="toolbar">
  <button id="expandAllBtn">Expand All</button>
  <button id="collapseAllBtn">Collapse All</button>
  <button id="resetBtn">Reset</button>
</div>

<div id="groups"></div>

<!-- Quick jump so Group VII is reachable without fighting the bottom edge -->
<button class="jump-btn" id="jumpBtn">⤓ Group VII</button>

<script>
/* ================= THEME ================= */
const themeBtn = document.getElementById("themeBtn");
const root = document.documentElement;

function applyTheme(theme) {
  root.setAttribute("data-theme", theme);
  themeBtn.textContent = theme === "dark" ? "🌙 Dark" : "☀️ Light";
  try { localStorage.setItem("css-builder-theme", theme); } catch(e) {}
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem("css-builder-theme"); } catch(e) {}
  const prefersLight = window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: light)").matches;
  applyTheme(saved || (prefersLight ? "light" : "dark"));
})();
themeBtn.addEventListener("click", () => {
  const current = root.getAttribute("data-theme") || "dark";
  applyTheme(current === "dark" ? "light" : "dark");
});

/* ================= DATA ================= */
const GROUPS = [
  { groupNumber:"I", name:"Commerce & Social Sciences",
    rule:"Select ONE (200 marks).", maxSubjects:1, maxMarks:200,
    subjects:[
      {name:"Accountancy & Auditing",marks:200},
      {name:"Economics",marks:200},
      {name:"Computer Science",marks:200},
      {name:"Political Science",marks:200},
      {name:"International Relations",marks:200}
    ]},
  { groupNumber:"II", name:"Sciences & Mathematics",
    rule:"ONE 200-mark OR up to TWO 100-mark (max 200).", maxSubjects:2, maxMarks:200,
    subjects:[
      {name:"Physics",marks:200},
      {name:"Chemistry",marks:200},
      {name:"Applied Mathematics",marks:100},
      {name:"Pure Mathematics",marks:100},
      {name:"Statistics",marks:100},
      {name:"Geology",marks:100}
    ]},
  { groupNumber:"III", name:"Administration & Governance",
    rule:"Select ONE (100 marks).", maxSubjects:1, maxMarks:100,
    subjects:[
      {name:"Business Administration",marks:100},
      {name:"Public Administration",marks:100},
      {name:"Governance & Public Policies",marks:100},
      {name:"Town Planning & Urban Management",marks:100}
    ]},
  { groupNumber:"IV", name:"History",
    rule:"Select ONE (100 marks).", maxSubjects:1, maxMarks:100,
    subjects:[
      {name:"History of Pakistan & India",marks:100},
      {name:"Islamic History & Culture",marks:100},
      {name:"British History",marks:100},
      {name:"European History",marks:100},
      {name:"History of USA",marks:100}
    ]},
  { groupNumber:"V", name:"Natural Sciences & Literature",
    rule:"Select ONE (100 marks).", maxSubjects:1, maxMarks:100,
    subjects:[
      {name:"Gender Studies",marks:100},
      {name:"Environmental Sciences",marks:100},
      {name:"Agriculture & Forestry",marks:100},
      {name:"Botany",marks:100},
      {name:"Zoology",marks:100},
      {name:"English Literature",marks:100},
      {name:"Urdu Literature",marks:100}
    ]},
  { groupNumber:"VI", name:"Law & Philosophy",
    rule:"Select ONE (100 marks).", maxSubjects:1, maxMarks:100,
    subjects:[
      {name:"Law",marks:100},
      {name:"Constitutional Law",marks:100},
      {name:"International Law",marks:100},
      {name:"Muslim Law & Jurisprudence",marks:100},
      {name:"Mercantile Law",marks:100},
      {name:"Criminology",marks:100},
      {name:"Philosophy",marks:100}
    ]},
  { groupNumber:"VII", name:"Social Sciences & Languages",
    rule:"Select ONE (100 marks).", maxSubjects:1, maxMarks:100,
    subjects:[
      {name:"Journalism & Mass Communication",marks:100},
      {name:"Psychology",marks:100},
      {name:"Geography",marks:100},
      {name:"Sociology",marks:100},
      {name:"Anthropology",marks:100},
      {name:"Punjabi",marks:100},
      {name:"Sindhi",marks:100},
      {name:"Pashto",marks:100},
      {name:"Balochi",marks:100},
      {name:"Persian",marks:100},
      {name:"Arabic",marks:100}
    ]}
];

const TARGET = 600;
const state = {};
GROUPS.forEach(g => state[g.groupNumber] = []);

const chipClass = { "I":"g1","II":"g2","III":"g3","IV":"g4","V":"g5","VI":"g6","VII":"g7" };

const groupsEl      = document.getElementById("groups");
const totalPill     = document.getElementById("totalPill");
const statusEl      = document.getElementById("status");
const hintBox       = document.getElementById("hintBox");
const chosenListEl  = document.getElementById("chosenList");
const selectedStrip = document.getElementById("selectedStrip");
const jumpBtn       = document.getElementById("jumpBtn");

/* ================= HELPERS ================= */
const subj = (g, n) => GROUPS.find(x => x.groupNumber === g).subjects.find(s => s.name === n);
const groupMarks = g => state[g].reduce((s, n) => s + subj(g, n).marks, 0);
const totalMarks = () => GROUPS.reduce((s, g) => s + groupMarks(g.groupNumber), 0);

function getViolations() {
  const v = [];
  GROUPS.forEach(g => {
    const sel = state[g.groupNumber];
    if (!sel.length) return;
    const m = groupMarks(g.groupNumber);
    if (sel.length > g.maxSubjects)
      v.push({group:g.groupNumber, type:"count",
        message:`Group ${g.groupNumber}: ${sel.length} picked — FPSC allows ${g.maxSubjects}. Remove ${sel.length-g.maxSubjects}.`});
    if (m > g.maxMarks)
      v.push({group:g.groupNumber, type:"marks",
        message:`Group ${g.groupNumber}: ${m} marks — cap is ${g.maxMarks}. Remove ${m-g.maxMarks}.`});
    if (g.groupNumber === "II" && sel.length > 1 &&
        sel.some(n => subj("II", n).marks === 200))
      v.push({group:"II", type:"mix",
        message:`Group II: a 200-mark subject can't be combined with another. Remove the extra subject(s).`});
  });
  const t = totalMarks();
  if (t !== TARGET)
    v.push({group:null, type:"total",
      message: t > TARGET
        ? `Total ${t} — over by ${t-TARGET}. Remove ${t-TARGET} marks.`
        : `Total ${t} — need ${TARGET-t} more marks.`});
  return v;
}

function violatingKeys() {
  const keys = new Set();
  GROUPS.forEach(g => {
    const sel = state[g.groupNumber];
    if (!sel.length) return;
    const m = groupMarks(g.groupNumber);
    const overCount = sel.length > g.maxSubjects;
    const overMarks = m > g.maxMarks;
    const mixII = g.groupNumber === "II" && sel.length > 1 &&
                  sel.some(n => subj("II", n).marks === 200);
    if (overCount || overMarks || mixII)
      sel.forEach(n => keys.add(`${g.groupNumber}|${n}`));
  });
  return keys;
}

/* ================= RENDER ================= */
function renderGroups() {
  groupsEl.innerHTML = "";
  GROUPS.forEach(g => {
    const d = document.createElement("div");
    d.className = "group";
    d.dataset.group = g.groupNumber;
    d.innerHTML = `
      <div class="group-header">
        <span class="group-title">
          <span class="group-badge"></span>
          Group ${g.groupNumber} — ${g.name}
          <small>${g.rule}</small>
        </span>
        <span class="chev">▶</span>
      </div>
      <div class="group-body">
        <div class="rule">${g.rule}</div>
        <div class="rule-flag" data-flag="${g.groupNumber}"></div>
      </div>`;
    d.querySelector(".group-header")
      .addEventListener("click", () => d.classList.toggle("open"));
    const body = d.querySelector(".group-body");
    g.subjects.forEach(s => {
      const row = document.createElement("div");
      row.className = "subject";
      row.dataset.group = g.groupNumber;
      row.dataset.subject = s.name;
      row.innerHTML = `<span>${s.name}</span><span class="marks">${s.marks}</span>`;
      row.addEventListener("click", () => toggle(g.groupNumber, s.name));
      body.appendChild(row);
    });
    groupsEl.appendChild(d);
  });
}

function toggle(g, n) {
  const sel = state[g];
  const i = sel.indexOf(n);
  if (i === -1) sel.push(n); else sel.splice(i, 1);
  updateUI();
}

/* ================= UPDATE ================= */
function updateUI() {
  const violations = getViolations();
  const flagged = violatingKeys();
  const total = totalMarks();
  const isValid = total === TARGET;

  document.querySelectorAll(".subject").forEach(row => {
    const g = row.dataset.group, s = row.dataset.subject;
    const isSel = state[g].includes(s);
    row.classList.toggle("selected", isSel);
    row.classList.toggle("violating", isSel && flagged.has(`${g}|${s}`));
  });

  GROUPS.forEach(g => {
    const gd = document.querySelector(`.group[data-group="${g.groupNumber}"]`);
    const flagEl = gd.querySelector(`.rule-flag[data-flag="${g.groupNumber}"]`);
    const gv = violations.filter(v => v.group === g.groupNumber);
    gd.classList.toggle("violation", gv.length > 0);
    flagEl.textContent = gv.length ? "⚠ " + gv.map(v => v.message).join(" ") : "";
  });

  totalPill.textContent = `${total} / ${TARGET}`;
  totalPill.className = "total-pill";
  if (isValid) totalPill.classList.add("valid-grey");
  else if (total > TARGET) totalPill.classList.add("over");
  else totalPill.classList.add("ok");

  selectedStrip.classList.toggle("valid", isValid);

  statusEl.className = "status";
  const tv = violations.find(v => v.type === "total");
  const rv = violations.filter(v => v.type !== "total");
  if (tv && tv.message.includes("over")) {
    statusEl.classList.add("err"); statusEl.textContent = "❌ " + tv.message;
  } else if (rv.length) {
    statusEl.classList.add("err"); statusEl.textContent = "❌ FPSC rule violation — see highlighted groups.";
  } else if (isValid) {
    statusEl.classList.add("ok"); statusEl.textContent = "✅ Valid FPSC combination — exactly 600 marks!";
  } else {
    statusEl.classList.add("warn"); statusEl.textContent = "⚠ " + tv.message;
  }

  if (violations.length) {
    hintBox.classList.add("show");
    hintBox.innerHTML = "<strong>To fix:</strong><br>• " +
      violations.map(v => v.message).join("<br>• ");
  } else {
    hintBox.classList.remove("show"); hintBox.innerHTML = "";
  }

  chosenListEl.classList.toggle("valid", isValid);
  chosenListEl.innerHTML = "";
  let any = false;
  GROUPS.forEach(g => {
    state[g.groupNumber].forEach(n => {
      any = true;
      const s = subj(g.groupNumber, n);
      const li = document.createElement("li");
      li.className = chipClass[g.groupNumber];
      if (flagged.has(`${g.groupNumber}|${n}`)) li.classList.add("violating");
      li.innerHTML = `
        <span class="chip-left">
          <span class="group-dot"></span>
          <span>G${g.groupNumber}: ${s.name} <span class="marks">(${s.marks})</span></span>
        </span>
        <button class="rm" title="Remove">×</button>`;
      li.querySelector(".rm").addEventListener("click", () => {
        state[g.groupNumber] = state[g.groupNumber].filter(x => x !== n);
        updateUI();
      });
      chosenListEl.appendChild(li);
    });
  });
  if (!any) chosenListEl.innerHTML = `<li class="empty">No subjects selected yet.</li>`;

  // hide jump button once user has scrolled near bottom
  updateJumpVisibility();
}

/* ================= JUMP TO GROUP VII ================= */
function updateJumpVisibility() {
  const nearBottom =
    groupsEl.scrollTop + groupsEl.clientHeight >= groupsEl.scrollHeight - 80;
  jumpBtn.classList.toggle("hidden", nearBottom);
}
jumpBtn.addEventListener("click", () => {
  const g7 = document.querySelector('.group[data-group="VII"]');
  if (!g7) return;
  g7.classList.add("open");
  g7.scrollIntoView({ behavior: "smooth", block: "end" });
  // extra nudge to clear the bottom safe area
  setTimeout(() => {
    groupsEl.scrollTop = groupsEl.scrollHeight;
  }, 350);
});
groupsEl.addEventListener("scroll", updateJumpVisibility, { passive: true });

/* ================= TOOLBAR ================= */
document.getElementById("expandAllBtn").addEventListener("click", () => {
  document.querySelectorAll(".group").forEach(g => g.classList.add("open"));
  updateJumpVisibility();
});
document.getElementById("collapseAllBtn").addEventListener("click", () => {
  document.querySelectorAll(".group").forEach(g => g.classList.remove("open"));
  updateJumpVisibility();
});
document.getElementById("resetBtn").addEventListener("click", () => {
  GROUPS.forEach(g => state[g.groupNumber] = []);
  updateUI();
});

/* ================= INIT ================= */
renderGroups();
updateUI();
document.querySelector('.group[data-group="I"]').classList.add("open");
</script>
</body>
</html>
