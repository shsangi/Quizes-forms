<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSS Optional Subject Combination Builder (600 Marks)</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --accent: #38bdf8;
    --ok: #22c55e;
    --danger: #ef4444;
    --warn: #f59e0b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .layout { display: grid; grid-template-columns: 1fr 360px; gap: 20px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .group {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .group.violation { border-color: var(--danger); }
  .group-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; cursor: pointer; user-select: none;
    background: var(--panel-2);
  }
  .group-header:hover { background: #2e3d56; }
  .group-title { font-weight: 600; }
  .group-title small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .chev { transition: transform 0.2s; color: var(--muted); }
  .group.open .chev { transform: rotate(90deg); }
  .group-body { display: none; padding: 8px; }
  .group.open .group-body { display: block; }
  .rule { font-size: 0.78rem; color: var(--accent); padding: 4px 8px 8px; }
  .rule-flag {
    font-size: 0.78rem; color: var(--danger); padding: 0 8px 8px;
    font-weight: 600;
  }

  .subject {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent; margin-bottom: 4px;
  }
  .subject:hover { background: #2e3d56; }
  .subject.selected {
    background: rgba(56, 189, 248, 0.15);
    border-color: var(--accent);
  }
  .subject.selected.violating {
    background: rgba(239, 68, 68, 0.15);
    border-color: var(--danger);
  }
  .marks { font-size: 0.8rem; color: var(--muted); }
  .subject.selected .marks { color: var(--accent); }
  .subject.selected.violating .marks { color: var(--danger); }

  .sidebar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    position: sticky; top: 24px; height: fit-content;
  }
  .sidebar h2 { font-size: 1rem; margin: 0 0 12px; }
  .total-box {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 12px; border-radius: 10px; background: var(--panel-2);
    margin-bottom: 12px;
  }
  .total-num { font-size: 1.6rem; font-weight: 700; }
  .total-num.ok { color: var(--ok); }
  .total-num.over { color: var(--danger); }
  .total-denom { color: var(--muted); font-size: 0.85rem; }
  .status { font-size: 0.85rem; margin-bottom: 8px; min-height: 20px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
  .status.warn { color: var(--warn); }

  .hint {
    font-size: 0.8rem; padding: 10px 12px; border-radius: 8px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5; margin-bottom: 12px;
    display: none;
  }
  .hint.show { display: block; }

  .chosen-list { list-style: none; padding: 0; margin: 0 0 12px; }
  .chosen-list li {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 8px 10px; border-radius: 8px; background: var(--panel-2);
    margin-bottom: 6px; font-size: 0.85rem;
    border-left: 3px solid transparent;
  }
  .chosen-list li.violating {
    border-left-color: var(--danger);
    background: rgba(239, 68, 68, 0.12);
  }
  .chosen-list .rm {
    color: var(--danger); cursor: pointer; font-weight: 700;
    background: none; border: none; font-size: 1rem; line-height: 1;
  }
  .empty { color: var(--muted); font-size: 0.85rem; font-style: italic; }
  button.reset {
    width: 100%; padding: 10px; border-radius: 8px; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--border); font-size: 0.85rem;
  }
  button.reset:hover { color: var(--text); border-color: var(--muted); }
</style>
</head>
<body>

<h1>CSS Optional Subject Combination Builder</h1>
<div class="subtitle">
  Select as many subjects as you like. The page highlights every FPSC rule violation
  and tells you exactly what to remove to reach exactly <strong>600 marks</strong>.
</div>

<div class="layout">
  <div id="groups"></div>

  <aside class="sidebar">
    <h2>Your Combination</h2>
    <div class="total-box">
      <span class="total-num" id="totalNum">0</span>
      <span class="total-denom">/ 600 marks</span>
    </div>
    <div class="status" id="status">Select subjects to begin.</div>
    <div class="hint" id="hintBox"></div>
    <ul class="chosen-list" id="chosenList">
      <li class="empty">No subjects selected yet.</li>
    </ul>
    <button class="reset" id="resetBtn">Reset Selection</button>
  </aside>
</div>

<script>
const GROUPS = [
  {
    groupNumber: "I",
    name: "Commerce & Social Sciences",
    rule: "FPSC: select exactly ONE subject (200 marks).",
    maxSubjects: 1,
    maxMarks: 200,
    subjects: [
      { name: "Accountancy & Auditing", marks: 200 },
      { name: "Economics", marks: 200 },
      { name: "Computer Science", marks: 200 },
      { name: "Political Science", marks: 200 },
      { name: "International Relations", marks: 200 }
    ]
  },
  {
    groupNumber: "II",
    name: "Sciences & Mathematics",
    rule: "FPSC: select ONE 200-mark subject OR up to TWO 100-mark subjects (max 200 marks).",
    maxSubjects: 2,
    maxMarks: 200,
    subjects: [
      { name: "Physics", marks: 200 },
      { name: "Chemistry", marks: 200 },
      { name: "Applied Mathematics", marks: 100 },
      { name: "Pure Mathematics", marks: 100 },
      { name: "Statistics", marks: 100 },
      { name: "Geology", marks: 100 }
    ]
  },
  {
    groupNumber: "III",
    name: "Administration & Governance",
    rule: "FPSC: select exactly ONE subject (100 marks).",
    maxSubjects: 1,
    maxMarks: 100,
    subjects: [
      { name: "Business Administration", marks: 100 },
      { name: "Public Administration", marks: 100 },
      { name: "Governance & Public Policies", marks: 100 },
      { name: "Town Planning & Urban Management", marks: 100 }
    ]
  },
  {
    groupNumber: "IV",
    name: "History",
    rule: "FPSC: select exactly ONE subject (100 marks).",
    maxSubjects: 1,
    maxMarks: 100,
    subjects: [
      { name: "History of Pakistan & India", marks: 100 },
      { name: "Islamic History & Culture", marks: 100 },
      { name: "British History", marks: 100 },
      { name: "European History", marks: 100 },
      { name: "History of USA", marks: 100 }
    ]
  },
  {
    groupNumber: "V",
    name: "Natural Sciences & Literature",
    rule: "FPSC: select exactly ONE subject (100 marks).",
    maxSubjects: 1,
    maxMarks: 100,
    subjects: [
      { name: "Gender Studies", marks: 100 },
      { name: "Environmental Sciences", marks: 100 },
      { name: "Agriculture & Forestry", marks: 100 },
      { name: "Botany", marks: 100 },
      { name: "Zoology", marks: 100 },
      { name: "English Literature", marks: 100 },
      { name: "Urdu Literature", marks: 100 }
    ]
  },
  {
    groupNumber: "VI",
    name: "Law & Philosophy",
    rule: "FPSC: select exactly ONE subject (100 marks).",
    maxSubjects: 1,
    maxMarks: 100,
    subjects: [
      { name: "Law", marks: 100 },
      { name: "Constitutional Law", marks: 100 },
      { name: "International Law", marks: 100 },
      { name: "Muslim Law & Jurisprudence", marks: 100 },
      { name: "Mercantile Law", marks: 100 },
      { name: "Criminology", marks: 100 },
      { name: "Philosophy", marks: 100 }
    ]
  },
  {
    groupNumber: "VII",
    name: "Social Sciences & Languages",
    rule: "FPSC: select exactly ONE subject (100 marks).",
    maxSubjects: 1,
    maxMarks: 100,
    subjects: [
      { name: "Journalism & Mass Communication", marks: 100 },
      { name: "Psychology", marks: 100 },
      { name: "Geography", marks: 100 },
      { name: "Sociology", marks: 100 },
      { name: "Anthropology", marks: 100 },
      { name: "Punjabi", marks: 100 },
      { name: "Sindhi", marks: 100 },
      { name: "Pashto", marks: 100 },
      { name: "Balochi", marks: 100 },
      { name: "Persian", marks: 100 },
      { name: "Arabic", marks: 100 }
    ]
  }
];

const TARGET = 600;

// state: { "I": ["Computer Science"], ... }  — unlimited selection allowed
const state = {};
GROUPS.forEach(g => state[g.groupNumber] = []);

const groupsEl    = document.getElementById("groups");
const totalNumEl  = document.getElementById("totalNum");
const statusEl    = document.getElementById("status");
const hintBox     = document.getElementById("hintBox");
const chosenListEl= document.getElementById("chosenList");
const resetBtn    = document.getElementById("resetBtn");

// ---------- helpers ----------
function subjectOf(groupNumber, name) {
  return GROUPS.find(g => g.groupNumber === groupNumber).subjects.find(s => s.name === name);
}
function groupMarks(groupNumber) {
  return state[groupNumber].reduce((sum, n) => sum + subjectOf(groupNumber, n).marks, 0);
}
function totalMarks() {
  return GROUPS.reduce((sum, g) => sum + groupMarks(g.groupNumber), 0);
}

// Returns an array of violation strings for the current selection
function getViolations() {
  const violations = [];

  GROUPS.forEach(g => {
    const sel = state[g.groupNumber];
    if (sel.length === 0) return;
    const marks = groupMarks(g.groupNumber);

    if (sel.length > g.maxSubjects) {
      violations.push({
        group: g.groupNumber,
        message: `Group ${g.groupNumber}: ${sel.length} subjects selected — FPSC allows only ${g.maxSubjects}. Remove ${sel.length - g.maxSubjects} subject(s).`,
        type: "count"
      });
    }
    if (marks > g.maxMarks) {
      violations.push({
        group: g.groupNumber,
        message: `Group ${g.groupNumber}: ${marks} marks selected — FPSC caps this group at ${g.maxMarks}. Remove ${marks - g.maxMarks} marks.`,
        type: "marks"
      });
    }
    // Group II special: cannot mix a 200-mark subject with any other
    if (g.groupNumber === "II" && sel.length > 1) {
      const has200 = sel.some(n => subjectOf("II", n).marks === 200);
      if (has200) {
        violations.push({
          group: "II",
          message: `Group II: a 200-mark subject cannot be combined with any other subject. Remove all but the 200-mark subject, or swap it for 100-mark subjects.`,
          type: "mix"
        });
      }
    }
  });

  const total = totalMarks();
  if (total !== TARGET) {
    violations.push({
      group: null,
      message: total > TARGET
        ? `Total is ${total} — over by ${total - TARGET} marks. Remove ${total - TARGET} marks to reach exactly 600.`
        : `Total is ${total} — need ${TARGET - total} more marks to reach 600.`,
      type: "total"
    });
  }

  return violations;
}

// Returns the set of "group|subject" pairs that are part of a violation,
// so we can highlight the specific over-limit rows.
function violatingKeys() {
  const keys = new Set();

  GROUPS.forEach(g => {
    const sel = state[g.groupNumber];
    if (sel.length === 0) return;
    const marks = groupMarks(g.groupNumber);

    // over count → flag every selected row in the group
    if (sel.length > g.maxSubjects) {
      sel.forEach(n => keys.add(`${g.groupNumber}|${n}`));
    }
    // over marks → flag every selected row in the group
    if (marks > g.maxMarks) {
      sel.forEach(n => keys.add(`${g.groupNumber}|${n}`));
    }
    // Group II mixing → flag every selected row
    if (g.groupNumber === "II" && sel.length > 1) {
      const has200 = sel.some(n => subjectOf("II", n).marks === 200);
      if (has200) sel.forEach(n => keys.add(`${g.groupNumber}|${n}`));
    }
  });

  return keys;
}

// ---------- render groups ----------
function renderGroups() {
  groupsEl.innerHTML = "";
  GROUPS.forEach(group => {
    const groupDiv = document.createElement("div");
    groupDiv.className = "group";
    groupDiv.dataset.group = group.groupNumber;

    const header = document.createElement("div");
    header.className = "group-header";
    header.innerHTML = `
      <span class="group-title">Group ${group.groupNumber} — ${group.name}
        <small>${group.rule}</small>
      </span>
      <span class="chev">▶</span>
    `;
    header.addEventListener("click", () => groupDiv.classList.toggle("open"));

    const body = document.createElement("div");
    body.className = "group-body";

    const rule = document.createElement("div");
    rule.className = "rule";
    rule.textContent = group.rule;
    body.appendChild(rule);

    const flag = document.createElement("div");
    flag.className = "rule-flag";
    flag.dataset.flag = group.groupNumber;
    body.appendChild(flag);

    group.subjects.forEach(subject => {
      const row = document.createElement("div");
      row.className = "subject";
      row.dataset.group = group.groupNumber;
      row.dataset.subject = subject.name;
      row.innerHTML = `<span>${subject.name}</span><span class="marks">${subject.marks} marks</span>`;
      row.addEventListener("click", () => toggleSubject(group.groupNumber, subject.name));
      body.appendChild(row);
    });

    groupDiv.appendChild(header);
    groupDiv.appendChild(body);
    groupsEl.appendChild(groupDiv);
  });
}

// ---------- toggle (allow multiple; validation is soft) ----------
function toggleSubject(groupNumber, subjectName) {
  const sel = state[groupNumber];
  const idx = sel.indexOf(subjectName);
  if (idx === -1) sel.push(subjectName);
  else sel.splice(idx, 1);
  updateUI();
}

// ---------- update UI ----------
function updateUI() {
  const violations = getViolations();
  const flagged = violatingKeys();

  // per-subject highlighting
  document.querySelectorAll(".subject").forEach(row => {
    const g = row.dataset.group;
    const s = row.dataset.subject;
    const isSel = state[g].includes(s);
    row.classList.toggle("selected", isSel);
    row.classList.toggle("violating", isSel && flagged.has(`${g}|${s}`));
  });

  // per-group outline + flag text
  GROUPS.forEach(g => {
    const groupDiv = document.querySelector(`.group[data-group="${g.groupNumber}"]`);
    const flagEl = groupDiv.querySelector(`.rule-flag[data-flag="${g.groupNumber}"]`);
    const groupViolations = violations.filter(v => v.group === g.groupNumber);
    if (groupViolations.length > 0) {
      groupDiv.classList.add("violation");
      flagEl.textContent = "⚠ " + groupViolations.map(v => v.message).join(" ");
    } else {
      groupDiv.classList.remove("violation");
      flagEl.textContent = "";
    }
  });

  // total
  const total = totalMarks();
  totalNumEl.textContent = total;
  totalNumEl.className = "total-num";
  if (total === TARGET) totalNumEl.classList.add("ok");
  else if (total > TARGET) totalNumEl.classList.add("over");

  // status
  statusEl.className = "status";
  const totalViolation = violations.find(v => v.type === "total");
  const ruleViolations = violations.filter(v => v.type !== "total");

  if (totalViolation && totalViolation.message.includes("over")) {
    statusEl.classList.add("err");
    statusEl.textContent = "❌ " + totalViolation.message;
  } else if (ruleViolations.length > 0) {
    statusEl.classList.add("err");
    statusEl.textContent = "❌ FPSC rule violation — see highlighted groups.";
  } else if (total === TARGET) {
    statusEl.classList.add("ok");
    statusEl.textContent = "✅ Valid FPSC combination — exactly 600 marks!";
  } else {
    statusEl.classList.add("warn");
    statusEl.textContent = "⚠ " + totalViolation.message;
  }

  // hint box: actionable list of what to remove
  if (violations.length > 0) {
    hintBox.classList.add("show");
    hintBox.innerHTML = "<strong>To fix:</strong><br>• " +
      violations.map(v => v.message).join("<br>• ");
  } else {
    hintBox.classList.remove("show");
    hintBox.innerHTML = "";
  }

  // chosen list
  chosenListEl.innerHTML = "";
  let any = false;
  GROUPS.forEach(g => {
    state[g.groupNumber].forEach(name => {
      any = true;
      const s = subjectOf(g.groupNumber, name);
      const li = document.createElement("li");
      li.className = flagged.has(`${g.groupNumber}|${name}`) ? "violating" : "";
      li.innerHTML = `
        <span>G${g.groupNumber}: ${s.name} <span class="marks">(${s.marks})</span></span>
        <button class="rm" title="Remove">×</button>
      `;
      li.querySelector(".rm").addEventListener("click", () => {
        state[g.groupNumber] = state[g.groupNumber].filter(n => n !== name);
        updateUI();
      });
      chosenListEl.appendChild(li);
    });
  });
  if (!any) {
    chosenListEl.innerHTML = `<li class="empty">No subjects selected yet.</li>`;
  }
}

// ---------- reset ----------
resetBtn.addEventListener("click", () => {
  GROUPS.forEach(g => state[g.groupNumber] = []);
  updateUI();
});

// ---------- init ----------
renderGroups();
updateUI();
document.querySelector('.group[data-group="I"]').classList.add("open");
</script>
</body>
</html>
