<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheet to Website</title>
    <!-- Include Tailwind CSS for quick, clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include PapaParse to parse CSV data easily -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 p-6">

    <div class="max-w-6xl mx-auto bg-white shadow-md rounded-lg overflow-hidden">
        <div class="px-6 py-4 bg-blue-600 text-white font-bold text-lg">
            My Spreadsheet Data
        </div>
        <div class="overflow-x-auto">
            <table id="csv-table" class="min-w-full divide-y divide-gray-200">
                <!-- Data will be injected here dynamically -->
            </table>
        </div>
    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTX16x-Eeh1mguy6se1B25x0hkRIzIme4pX71KlxpML_vZAD34mtlITIqFs8MCAVycXFFft82j1RZDc/pub?output=csv";

        Papa.parse(csvUrl, {
            download: true,
            header: false, // Set to true if your first row contains column headers
            complete: function(results) {
                const data = results.data;
                const table = document.getElementById('csv-table');
                let html = '';

                data.forEach((row, rowIndex) => {
                    html += `<tr class="${rowIndex === 0 ? 'bg-gray-100 font-semibold text-gray-700' : 'hover:bg-gray-50 text-gray-600'}">`;
                    row.forEach(cell => {
                        if (rowIndex === 0) {
                            html += `<th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">${cell}</th>`;
                        } else {
                            html += `<td class="px-6 py-4 whitespace-nowrap text-sm border-t border-gray-200">${cell}</td>`;
                        }
                    });
                    html += `</tr>`;
                });

                table.innerHTML = html;
            }
        });
    </script>

</body>
</html>
