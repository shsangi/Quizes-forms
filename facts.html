<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CSS Facts · Data Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            padding: 2rem 1.5rem;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.12);
            padding: 2rem 1.8rem 2.2rem;
        }

        /* Header */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-weight: 700;
            font-size: 1.7rem;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #0b2a3e;
        }

        .header h1 i {
            background: #e7eef6;
            padding: 10px 14px;
            border-radius: 50px;
            font-size: 1.3rem;
            color: #1e4a6b;
        }

        .stats {
            background: #eaf1f8;
            padding: 0.5rem 1.4rem;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1f3a4e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.8rem;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: #f1f6fa;
            border-radius: 60px;
            padding: 0.2rem 0.2rem 0.2rem 1.2rem;
            flex: 1 1 280px;
            border: 1px solid #dce6ef;
            transition: 0.2s;
        }

        .search-wrapper:focus-within {
            border-color: #3b7c9e;
            background: white;
            box-shadow: 0 4px 14px rgba(28, 78, 110, 0.08);
        }

        .search-wrapper i {
            color: #647b8e;
        }

        .search-wrapper input {
            border: none;
            background: transparent;
            padding: 0.7rem 1rem;
            width: 100%;
            font-size: 0.95rem;
            outline: none;
            color: #1a2f40;
        }

        .search-wrapper input::placeholder {
            color: #8fa3b5;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-group select {
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #d3dfe9;
            background: white;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1f3f55;
            cursor: pointer;
            outline: none;
            transition: 0.15s;
        }

        .filter-group select:hover {
            border-color: #9bb3c9;
        }

        .filter-group .clear-btn {
            background: transparent;
            border: 1px solid #d3dfe9;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #395f79;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-group .clear-btn:hover {
            background: #e2ebf3;
            border-color: #a7bccf;
        }

        /* Table */
        .table-wrap {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #eef4f8;
            background: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.93rem;
            min-width: 550px;
        }

        th {
            text-align: left;
            padding: 1rem 1.2rem;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #3d5b71;
            background: #f8fcff;
            border-bottom: 1px solid #e3ecf3;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        th i {
            margin-right: 8px;
            opacity: 0.7;
        }

        td {
            padding: 0.9rem 1.2rem;
            border-bottom: 1px solid #edf3f8;
            vertical-align: middle;
            line-height: 1.5;
            color: #1a3143;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f5faff;
        }

        .category-tag {
            display: inline-block;
            background: #e2ebf5;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: #1a4a66;
            white-space: nowrap;
        }

        .category-tag i {
            margin-right: 5px;
            font-size: 0.65rem;
        }

        .sno {
            font-weight: 500;
            color: #4b6a82;
            width: 50px;
        }

            padding: 3rem 1.2rem;
            text-align: center;
            font-size: 1rem;
            color: #5b7c94;

            td, th { padding: 0.7rem 0.6rem; }

</head>

        // ──────────────────────────────────────────────────────────────
        // 2. CSV parser (handles quoted fields)
        // ──────────────────────────────────────────────────────────────
        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length === 0) return [];

            const headers = lines[0].split(',').map(h => h.trim());
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const row = [];
                let field = '';
                let inQuotes = false;
                let j = 0;
                const line = lines[i];

                while (j < line.length) {
                    const ch = line[j];
                    if (ch === '"') {
                        if (inQuotes && line[j + 1] === '"') {
                            field += '"';
                            j += 2;
                        } else {
                            inQuotes = !inQuotes;
                            j++;
                        }
                    } else if (ch === ',' && !inQuotes) {
                        row.push(field.trim());
                        field = '';
                        j++;
                    } else {
                        field += ch;
                        j++;
                    }
                }
                row.push(field.trim());

                if (row.length >= 3) {
                    data.push({
                        srno: parseInt(row[0]) || i,
                        category: row[1] || 'Unknown',
                        fact: row[2] || ''
                    });
                }
            }
            return data;
        }

        // ──────────────────────────────────────────────────────────────

        let filteredData = [];

        const countDisplay = document.getElementById('countDisplay');

        // ──────────────────────────────────────────────────────────────
        // 4. Render
        // ──────────────────────────────────────────────────────────────
        function render() {
            const search = searchTerm.toLowerCase().trim();
            let result = allData;

            // Category filter
            if (currentCategory) {
                result = result.filter(item => item.category === currentCategory);
            }

            // Search filter
            if (search) {
                result = result.filter(item =>
                    item.fact.toLowerCase().includes(search) ||
                    item.category.toLowerCase().includes(search) ||
                    item.srno.toString().includes(search)
                );
            }

            filteredData = result;

            // Update count
            countDisplay.textContent = filteredData.length;

            // Render rows
            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="3"><i class="fas fa-search-minus"></i> No facts match your filter</td></tr>`;
                return;
            }

            let html = '';
            filteredData.forEach(item => {
                html += `<tr>
                    <td class="sno">${item.srno}</td>
                    <td><span class="category-tag"><i class="fas fa-tag"></i> ${item.category}</span></td>
                    <td class="fact-text">${item.fact}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        // ──────────────────────────────────────────────────────────────

            // Populate category dropdown
            const categories = [...new Set(allData.map(item => item.category))].sort();
            categoryFilter.innerHTML = '<option value="">All Categories</option>';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categoryFilter.appendChild(opt);
            });

            render();
        }

        // ──────────────────────────────────────────────────────────────
        // 6. Event listeners
        // ──────────────────────────────────────────────────────────────
        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            render();
        });

        categoryFilter.addEventListener('change', (e) => {
            currentCategory = e.target.value;
            render();
        });

        resetBtn.addEventListener('click', () => {
            searchInput.value = '';
            categoryFilter.value = '';
            searchTerm = '';
            currentCategory = '';
            render();
        });

        // ──────────────────────────────────────────────────────────────
        // 7. Start
        // ──────────────────────────────────────────────────────────────
        loadData();
    })();
</script>
</body>
</html>
