<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fact · srno + category</title>
    <!-- Tailwind via CDN + minimal custom touch -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* small category tag – sits at bottom, doesn't steal space */
        .cat-tag {
            font-size: 0.6rem;     /* tiny */
            letter-spacing: 0.02em;
            opacity: 0.65;
            margin-top: 0.25rem;
            border-top: 1px solid #e9edf2;
            padding-top: 0.35rem;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #4b5563;
            background: transparent;
        }
        .srno-badge {
            font-weight: 500;
            background: #f0f2f5;
            padding: 0.1rem 0.5rem;
            border-radius: 20px;
            font-size: 0.55rem;
            color: #1f2937;
        }
        .fact-text {
            font-size: 1rem;
            line-height: 1.5;
            word-break: break-word;
        }
        /* card uses flex column to push category to bottom */
        .card-fact {
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.15s ease;
        }
        .card-fact .body {
            flex: 1;
        }
        /* tiny extra polish */
        .card-fact:hover {
            box-shadow: 0 8px 18px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.02);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 sm:p-6 font-sans antialiased">

<div class="max-w-6xl mx-auto">
    <!-- header minimal -->
    <div class="flex items-center justify-between mb-6 flex-wrap gap-2">
        <h1 class="text-xl sm:text-2xl font-medium text-gray-800 tracking-tight">📋 Facts</h1>
        <span class="text-xs text-gray-400 bg-white px-3 py-1 rounded-full shadow-sm border border-gray-100">srno · category</span>
    </div>

    <!-- loading state -->
    <div id="loading" class="text-center text-gray-500 text-sm py-10">⏳ loading facts ...</div>

    <!-- card grid -->
    <div id="cards-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 auto-rows-fr">
        <!-- cards injected here -->
    </div>
</div>

<!-- PapaParse for CSV -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    (function() {
        // ----- CONFIG -----
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/1snRQ9V8cBfl9lOa2rJ9K26jXqe5FSgUdc4gbKbAh3ZU/export?format=csv&gid=1703040365';

        // expected columns: A=srno, B=catgory, C=fact
        // but we read dynamically; we'll map by header names (case-insensitive)
        const container = document.getElementById('cards-container');
        const loadingEl = document.getElementById('loading');

        // ----- helpers -----
        function getHeaderKey(row, ...candidates) {
            // return first candidate that exists as a key in row (case-insensitive)
            const keys = Object.keys(row);
            for (let cand of candidates) {
                const found = keys.find(k => k.trim().toLowerCase() === cand.toLowerCase());
                if (found) return found;
            }
            return null;
        }

        // ----- fetch & render -----
        async function fetchFacts() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const csvText = await response.text();

                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    trimHeaders: false,   // keep original casing, we handle later
                    complete: function(results) {
                        const rows = results.data.filter(row => {
                            // filter out completely empty rows
                            return Object.values(row).some(v => v && v.trim() !== '');
                        });

                        loadingEl.style.display = 'none';
                        container.innerHTML = '';

                        if (rows.length === 0) {
                            container.innerHTML = `<div class="col-span-full text-center text-gray-400 text-sm py-12">✨ no facts found</div>`;
                            return;
                        }

                        // detect header keys (case-insensitive)
                        const sample = rows[0];
                        const srnoKey = getHeaderKey(sample, 'srno', 's.no', 'sno', 'sr no', 'serial');
                        const catKey = getHeaderKey(sample, 'catgory', 'category', 'cat', 'categorie');
                        const factKey = getHeaderKey(sample, 'fact', 'facts', 'description', 'content');

                        // if no factKey found, fallback: use third column? but we'll warn
                        let fallbackFactKey = null;
                        if (!factKey) {
                            // get all keys and pick third if exists (C column)
                            const keys = Object.keys(sample);
                            if (keys.length >= 3) fallbackFactKey = keys[2];
                        }

                        // render each row as card
                        rows.forEach((row, idx) => {
                            // extract values using detected keys
                            const srno = srnoKey ? (row[srnoKey] || '').trim() : '';
                            const category = catKey ? (row[catKey] || '').trim() : '';
                            let fact = factKey ? (row[factKey] || '').trim() : '';
                            if (!fact && fallbackFactKey) fact = (row[fallbackFactKey] || '').trim();
                            // if still empty, use any value from row that is not srno/cat
                            if (!fact) {
                                const fallback = Object.values(row).find(v => v && v.trim() !== '');
                                if (fallback) fact = fallback.trim();
                            }

                            // fallback display
                            const displaySrno = srno || '—';
                            const displayCategory = category || 'uncategorized';
                            const displayFact = fact || '—';

                            // build card
                            const card = document.createElement('div');
                            card.className = 'card-fact bg-white rounded-xl border border-gray-200/70 p-5 shadow-sm hover:border-gray-300/80';

                            card.innerHTML = `
                                <div class="body">
                                    <div class="fact-text text-gray-800 leading-relaxed">
                                        ${displayFact}
                                    </div>
                                </div>
                                <div class="cat-tag">
                                    <span class="flex items-center gap-1.5">
                                        <span class="srno-badge">#${displaySrno}</span>
                                    </span>
                                    <span class="text-[0.55rem] uppercase tracking-wide text-gray-400 bg-gray-100/60 px-2 py-0.5 rounded-full">${displayCategory}</span>
                                </div>
                            `;

                            container.appendChild(card);
                        });
                    },
                    error: function(err) {
                        console.error('PapaParse error:', err);
                        loadingEl.innerHTML = `<p class="text-red-400 text-sm">⚠️ parsing error – check CSV</p>`;
                    }
                });
            } catch (error) {
                console.error('Fetch error:', error);
                loadingEl.innerHTML = `<p class="text-red-400 text-sm">⚠️ failed to load sheet. make sure CSV is published.</p>`;
            }
        }

        // kick off
        fetchFacts();
    })();
</script>

<!-- footnote: category at bottom, srno shown small -->
<div class="max-w-6xl mx-auto mt-6 text-[0.5rem] text-gray-300 text-center border-t border-gray-100/50 pt-3 tracking-wider">
    <span class="bg-white/50 px-2 py-0.5 rounded-full">srno · category · fact</span>
</div>
</body>
</html>
