        .header {

            gap: 1rem;
        }

            align-items: center;

        }

            color: #1e4a6b;
        }

            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1f3a4e;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .stats-badge i {
            font-size: 0.8rem;
        }

            display: flex;
            flex-wrap: wrap;
            align-items: center;

            padding-bottom: 0.8rem;

            display: flex;
            align-items: center;
            background: #f1f6fa;
            border-radius: 40px;

            border: 1px solid #dce6ef;

            flex: 0 1 220px;
            min-width: 140px;
        }

            border-color: #3b7c9e;
            background: white;
            box-shadow: 0 2px 10px rgba(28, 78, 110, 0.06);
        }

        .search-wrapper i {
            color: #7a93a8;
            font-size: 0.8rem;
        }

            border: none;
            background: transparent;
            padding: 0.45rem 0.7rem;
            width: 100%;
            font-size: 0.85rem;
            outline: none;
            color: #1a2f40;
        }

        .search-wrapper input::placeholder {
            color: #9aafc0;
            font-size: 0.8rem;
        }

        .category-chips {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            flex: 1;
        }

            display: inline-flex;
            align-items: center;
            gap: 5px;

            border-radius: 40px;
            font-size: 0.78rem;
            font-weight: 500;

            color: #1f4a66;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }

            background: #dde8f2;
        }

        .chip.active {
            background: #1f4a66;
            color: white;
            border-color: #1f4a66;
        }

        .chip i {
            font-size: 0.7rem;
        }

            padding: 0 0.5rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

            background: rgba(255,255,255,0.2);
        }

        .chip-all {
            background: #e8edf3;
        }

        .chip-all.active {
            background: #2c3e50;
            color: white;
        }

            background: transparent;
            border: 1px solid #d3dfe9;
            padding: 0.3rem 0.9rem;
            font-size: 0.75rem;
            color: #4f6f89;
        }

            background: #e2ebf3;
        }

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));

        // ──────────────────────────────────────────────────────────────
        // 2. CSV Parser
        // ──────────────────────────────────────────────────────────────
        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length === 0) return [];

            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const row = [];
                let field = '';
                let inQuotes = false;
                let j = 0;
                const line = lines[i];

                while (j < line.length) {
                    const ch = line[j];
                    if (ch === '"') {
                        if (inQuotes && line[j + 1] === '"') {
                            field += '"';
                            j += 2;
                        } else {
                            inQuotes = !inQuotes;
                            j++;
                        }
                    } else if (ch === ',' && !inQuotes) {
                        row.push(field.trim());
                        field = '';
                        j++;
                    } else {
                        field += ch;
                        j++;
                    }
                }
                row.push(field.trim());

                if (row.length >= 3) {
                    data.push({
                        srno: parseInt(row[0]) || i,
                        category: row[1] || 'Unknown',
                        fact: row[2] || ''
                    });
                }
            }
            return data;
        }

            countDisplay.textContent = filteredData.length;

            // Render cards
            if (filteredData.length === 0) {
                cardsGrid.innerHTML = `<div class="empty-state"><i class="fas fa-search-minus"></i> No facts match your filter</div>`;
                return;
            }

            let html = '';
            filteredData.forEach(item => {
                html += `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-sno">#${item.srno}</span>
                            <span class="card-category"><i class="fas fa-tag" style="font-size:0.6rem;"></i> ${item.category}</span>
                        </div>
                        <div class="card-fact">${item.fact}</div>
                        <div class="card-footer">
                            <i class="fas fa-bookmark" style="opacity:0.5;"></i>
                        </div>
                    </div>
                `;
            });
            cardsGrid.innerHTML = html;
        }

        // ──────────────────────────────────────────────────────────────
        // 5. Build Category Chips
        // ──────────────────────────────────────────────────────────────
        function buildChips() {
            const categories = [...new Set(allData.map(item => item.category))].sort();

            let html = `
                <div class="chip chip-all ${selectedCategory === '' ? 'active' : ''}" data-category="">
                    <i class="fas fa-th-list"></i> All
                    <span class="count">${allData.length}</span>
                </div>
            `;

            categories.forEach(cat => {
                const count = allData.filter(item => item.category === cat).length;
                const active = selectedCategory === cat ? 'active' : '';
                html += `
                    <div class="chip ${active}" data-category="${cat.replace(/"/g, '&quot;')}">
                        <i class="fas fa-tag"></i> ${cat}
                        <span class="count">${count}</span>
                    </div>
                `;
            });

            // Reset button as chip
            html += `
                <div class="chip reset-chip" id="resetChip">
                    <i class="fas fa-undo-alt"></i> Reset
                </div>
            `;

            categoryChips.innerHTML = html;

            // Add click listeners to chips
            document.querySelectorAll('.chip[data-category]').forEach(chip => {
                chip.addEventListener('click', function() {
                    const cat = this.dataset.category;
                    selectedCategory = cat;
                    searchTerm = ''; // clear search when clicking category
                    searchInput.value = '';
                    buildChips(); // rebuild to update active state
                    render();
                });
            });

            // Reset chip
            const resetChip = document.getElementById('resetChip');
            if (resetChip) {
                resetChip.addEventListener('click', function() {
                    selectedCategory = '';
                    searchTerm = '';
                    searchInput.value = '';
                    buildChips();
                    render();
                });
            }
        }

        // ──────────────────────────────────────────────────────────────
        // 6. Load Data
        // ──────────────────────────────────────────────────────────────
        function loadData() {
            allData = parseCSV(CSV_DATA);
            buildChips();
            render();
        }

        // ──────────────────────────────────────────────────────────────
        // 7. Event Listeners
        // ──────────────────────────────────────────────────────────────
        searchInput.addEventListener('input', function(e) {
            searchTerm = e.target.value;
            // If user types in search, clear category selection
            if (searchTerm.trim() !== '') {
                selectedCategory = '';
                buildChips(); // update chip active states
            }
            render();
        });

        // ──────────────────────────────────────────────────────────────
        // 8. Start
        // ──────────────────────────────────────────────────────────────
        loadData();
    })();
</script>
</body>
</html>
