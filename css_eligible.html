<script>
    function checkJobEligibility() {
        const dobInput = document.getElementById('dob').value;
        const cutoffInput = document.getElementById('cutoff').value;
        const category = document.getElementById('category').value;

        if (!dobInput || !cutoffInput) {
            alert("Please fill in both Date of Birth and Cut-Off Date!");
            return;
        }

        const dob = new Date(dobInput);
        const cutoffDate = document.getElementById('cutoff').valueAsDate;
        
        let birthYear = dob.getFullYear();
        let startExamYear = cutoffDate.getFullYear();

        let minAge = category === 'general30' ? 18 : 21;
        let maxAge = category === 'general35' ? 35 : 30;
        let maxAttempts = category === 'general35' || category === 'general30' ? 6 : 3;
        let ruleName = category === 'css' ? "CSS Exam (21-30 Years, 3 Attempts)" : "Govt Job Rule";

        // Calculate exact age on cutoff date
        let ageYears = cutoffDate.getFullYear() - dob.getFullYear();
        let m = cutoffDate.getMonth() - dob.getMonth();
        if (m < 0 || (m === 0 && cutoffDate.getDate() < dob.getDate())) {
            ageYears--;
        }

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';

        if (ageYears >= minAge && ageYears <= maxAge) {
            resultBox.className = "result eligible";
            document.getElementById('statusTitle').innerText = "Status: ELIGIBLE FOR THIS EXAM CYCLE ✅";
            document.getElementById('resDetails').innerText = `You are within the ${minAge}-${maxAge} age bracket.`;
        } else {
            resultBox.className = "result not-eligible";
            document.getElementById('statusTitle').innerText = "Status: NOT ELIGIBLE ❌";
            document.getElementById('resDetails').innerText = ageYears < minAge ? "Under minimum age." : "Overage for this bracket.";
        }

        document.getElementById('resAge').innerText = `Age on Cut-Off Date: ${ageYears} years`;
        document.getElementById('resWindow').innerText = `Criteria Rule: ${ruleName}`;

        // Accurate Lifetime Attempt Tracking
        let timelineList = document.getElementById('timelineList');
        timelineList.innerHTML = "";
        
        let firstEligibleYear = birthYear + minAge;
        let attemptTracker = 1;

        // Look back and forward to show true attempt numbers based on age 21
        for (let i = 0; i < 6; i++) {
            let targetYear = startExamYear + i;
            let yearAge = targetYear - birthYear;
            
            let li = document.createElement('li');
            if (yearAge >= minAge && yearAge <= maxAge) {
                if (attemptTracker <= maxAttempts) {
                    li.innerHTML = `<b>${targetYear} Exam</b> (Age ${yearAge}): <span style="color:green;">Eligible</span> — Lifetime Attempt <b>#${attemptTracker}</b> of ${maxAttempts}.`;
                    attemptTracker++;
                } else {
                    li.innerHTML = `<b>${targetYear} Exam</b> (Age ${yearAge}): <span style="color:orange;">Age-Eligible</span>, but max lifetime attempts (${maxAttempts}) exhausted.`;
                }
            } else {
                li.innerHTML = `<b>${targetYear} Exam</b> (Age ${yearAge}): <span style="color:red;">Not Eligible</span> (Outside age limits)`;
            }
            timelineList.appendChild(li);
        }
    }
</script>
