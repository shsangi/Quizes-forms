<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Eligibility & Future Attempts Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 520px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd1d9;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2575fc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1a5db6;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        .eligible {
            background-color: #e8f8f5;
            border: 1px solid #27ae60;
            color: #0e6251;
        }
        .not-eligible {
            background-color: #ffd2d2;
            border: 1px solid #e74c3c;
            color: #78281f;
        }
        .result h3 {
            margin-top: 0;
            font-size: 18px;
        }
        .result p {
            margin: 6px 0;
            font-size: 14px;
        }
        .timeline-box {
            margin-top: 12px;
            background: #ffffff;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #bdc3c7;
            color: #2c3e50;
        }
        .timeline-box ul {
            margin: 5px 0 0 20px;
            padding: 0;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Job Eligibility & Future Attempts</h2>
    
    <div class="form-group">
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob">
    </div>
    
    <div class="form-group">
        <label for="category">Target Job / Category Rule:</label>
        <select id="category">
            <option value="css">CSS / Competitive Exam (Min 21, Max 30 Yrs, 3 Attempts)</option>
            <option value="general30">Standard Govt Job (Min 18, Max 30 Yrs, 6 Attempts)</option>
            <option value="general35">Officer Scale / Upper Cap (Min 21, Max 35 Yrs, 6 Attempts)</option>
        </select>
    </div>

    <button onclick="checkJobEligibility()">Check Eligibility & Future Attempts</button>

    <div class="result" id="resultBox">
        <h3 id="statusTitle"></h3>
        <p id="resAge">Exact Age: </p>
        <p id="resWindow">Criteria Rule: </p>
        <p id="resDetails">Details: </p>
        
        <div class="timeline-box">
            <strong>Year-by-Year Attempt Outlook (Next 5 Years):</strong>
            <ul id="timelineList"></ul>
        </div>
    </div>
</div>

<script>
    function checkJobEligibility() {
        const dobInput = document.getElementById('dob').value;
        const category = document.getElementById('category').value;

        if (!dobInput) {
            alert("Please enter your date of birth!");
            return;
        }

        const dob = new Date(dobInput);
        const today = new Date();
        const currentYear = today.getFullYear();

        // Calculate exact age today
        let ageYears = today.getFullYear() - dob.getFullYear();
        let ageMonths = today.getMonth() - dob.getMonth();
        let ageDays = today.getDate() - dob.getDate();

        if (ageDays < 0) {
            ageMonths--;
            ageDays += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        }
        if (ageMonths < 0) {
            ageYears--;
            ageMonths += 12;
        }

        let minAge = 18;
        let maxAge = 30;
        let maxAttempts = 3;
        let ruleName = "";

        if (category === 'css') {
            minAge = 21;
            maxAge = 30; 
            maxAttempts = 3;
            ruleName = "CSS Exam (21-30 Years, 3 Attempts)";
        } else if (category === 'general30') {
            minAge = 18;
            maxAge = 30;
            maxAttempts = 6;
            ruleName = "Standard Govt Job (18-30 Years, 6 Attempts)";
        } else if (category === 'general35') {
            minAge = 21;
            maxAge = 35;
            maxAttempts = 6;
            ruleName = "Officer Scale (21-35 Years, 6 Attempts)";
        }

        const resultBox = document.getElementById('resultBox');
        const statusTitle = document.getElementById('statusTitle');
        const resAge = document.getElementById('resAge');
        const resWindow = document.getElementById('resWindow');
        const resDetails = document.getElementById('resDetails');
        const timelineList = document.getElementById('timelineList');

        resultBox.style.display = 'block';

        // Evaluate present eligibility status
        if (ageYears >= minAge && ageYears <= maxAge) {
            resultBox.className = "result eligible";
            statusTitle.innerText = "Status: ELIGIBLE TO APPLY RIGHT NOW ✅";
            resDetails.innerText = `You fall securely within the accepted age boundaries for this category today.`;
        } else if (ageYears < minAge) {
            let yearsToGo = minAge - ageYears;
            resultBox.className = "result not-eligible";
            statusTitle.innerText = "Status: NOT YET ELIGIBLE ❌";
            resDetails.innerText = `You are under the minimum age. You will become eligible when you turn ${minAge}.`;
        } else {
            resultBox.className = "result not-eligible";
            statusTitle.innerText = "Status: OVERAGE ❌";
            resDetails.innerText = `You have crossed the maximum upper age limit (${maxAge} years) for this bracket.`;
        }

        resAge.innerText = `Exact Age Today: ${ageYears} years, ${ageMonths} months, and ${ageDays} days`;
        resWindow.innerText = `Criteria Rule: ${ruleName}`;

        // Build Year-by-Year Outlook for the next 5 years
        timelineList.innerHTML = "";
        let simulatedAttemptCount = 1; // Tracks hypothetical attempt consumption order
        
        for (let i = 0; i < 6; i++) {
            let targetYear = currentYear + i;
            // Approximate age in that specific year (using birth year difference)
            let yearAge = targetYear - dob.getFullYear();
            
            let li = document.createElement('li');
            if (yearAge >= minAge && yearAge <= maxAge) {
                if (simulatedAttemptCount <= maxAttempts) {
                    li.innerHTML = `<b>${targetYear}</b> (Age ~${yearAge}): <span style="color:green;">Eligible</span> — Attempt <b>#${simulatedAttemptCount}</b> of ${maxAttempts} available.`;
                    simulatedAttemptCount++;
                } else {
                    li.innerHTML = `<b>${targetYear}</b> (Age ~${yearAge}): <span style="color:orange;">Age-Eligible</span>, but max attempt limit (${maxAttempts}) exhausted.`;
                }
            } else if (yearAge < minAge) {
                let diff = minAge - yearAge;
                li.innerHTML = `<b>${targetYear}</b> (Age ~${yearAge}): <span style="color:red;">Not Eligible</span> (Under minimum age by ~${diff} yr)`;
            } else {
                li.innerHTML = `<b>${targetYear}</b> (Age ~${yearAge}): <span style="color:red;">Not Eligible</span> (Crossed maximum age limit of ${maxAge})`;
            }
            timelineList.appendChild(li);
        }
    }
</script>

</body>
</html>
