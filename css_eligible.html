<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accurate Job Eligibility & Attempt Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 520px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd1d9;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .inline-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .inline-group input[type="checkbox"] {
            width: auto;
            margin: 0;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2575fc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1a5db6;
        }
        .btn-secondary {
            background-color: #6c757d;
            font-size: 14px;
            padding: 8px;
            margin-top: 0;
            width: auto;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        .eligible {
            background-color: #e8f8f5;
            border: 1px solid #27ae60;
            color: #0e6251;
        }
        .not-eligible {
            background-color: #ffd2d2;
            border: 1px solid #e74c3c;
            color: #78281f;
        }
        .result h3 {
            margin-top: 0;
            font-size: 18px;
        }
        .result p {
            margin: 6px 0;
            font-size: 14px;
        }
        .summary-box {
            background: #fdfefe;
            border: 1px solid #d5dbdb;
            padding: 12px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 14px;
        }
        .summary-box strong {
            color: #2c3e50;
        }
        .timeline-box {
            margin-top: 12px;
            background: #ffffff;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #bdc3c7;
            color: #2c3e50;
        }
        .timeline-box ul {
            margin: 5px 0 0 20px;
            padding: 0;
            font-size: 13px;
        }
        .fetch-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .highlight {
            font-weight: bold;
            color: #c0392b;
        }
        .success-text {
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Official Job Eligibility Checker</h2>
    
    <div class="form-group">
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" value="1997-03-11">
    </div>

    <div class="form-group">
        <label for="cutoff">Official Age Cut-Off Date (e.g., Dec 31 of exam year):</label>
        <div class="fetch-row">
            <input type="date" id="cutoff" value="2026-12-31">
            <button class="btn-secondary" onclick="fetchCurrentDate()" title="Simulate fetching from CSS website">Fetch Current Year Date</button>
        </div>
        <small style="color:#7f8c8d; display:block; margin-top:5px;">Note: The "Fetch" button simulates an API call. Real fetching requires a backend server.</small>
    </div>

    <div class="form-group">
        <label for="previousAttempts">Number of Previous Attempts (Optional):</label>
        <input type="number" id="previousAttempts" value="0" min="0" max="10">
    </div>

    <div class="inline-group">
        <input type="checkbox" id="appliedCurrentYear">
        <label for="appliedCurrentYear" style="margin-bottom: 0; font-weight: normal;">Already applied in the current year cycle?</label>
    </div>
    
    <div class="form-group">
        <label for="category">Target Job / Category Rule:</label>
        <select id="category">
            <option value="css">CSS / Competitive Exam (Min 21, Max 30 Yrs, 3 Attempts)</option>
            <option value="general30">Standard Govt Job (Min 18, Max 30 Yrs, 6 Attempts)</option>
            <option value="general35">Officer Scale / Upper Cap (Min 21, Max 35 Yrs, 6 Attempts)</option>
        </select>
    </div>

    <button onclick="checkJobEligibility()">Calculate Accurate Eligibility</button>

    <div class="result" id="resultBox">
        <h3 id="statusTitle"></h3>
        
        <div class="summary-box">
            <strong>📊 Status Summary:</strong><br>
            <span id="resAgeSummary"></span><br>
            <span id="resAttemptSummary"></span>
        </div>

        <p id="resAge">Age on Cut-Off Date: </p>
        <p id="resWindow">Criteria Rule: </p>
        <p id="resDetails">Details: </p>
        
        <div class="timeline-box">
            <strong>Year-by-Year Attempt Outlook:</strong>
            <ul id="timelineList"></ul>
        </div>
    </div>
</div>

<script>
    function fetchCurrentDate() {
        alert("Simulating fetch from CSS website... \n\nIn a real application, this would fetch the latest deadline.\nFor now, we will set the cut-off to the current year's Dec 31.");
        const today = new Date();
        const currentYear = today.getFullYear();
        const simulatedDeadline = `${currentYear}-12-31`;
        document.getElementById('cutoff').value = simulatedDeadline;
        document.getElementById('appliedCurrentYear').checked = true;
    }

    function checkJobEligibility() {
        const dobInput = document.getElementById('dob').value;
        const cutoffInput = document.getElementById('cutoff').value;
        const category = document.getElementById('category').value;
        let prevAttempts = parseInt(document.getElementById('previousAttempts').value) || 0;
        const isCurrentYearApplied = document.getElementById('appliedCurrentYear').checked;

        if (!dobInput || !cutoffInput) {
            alert("Please fill in both Date of Birth and Cut-Off Date!");
            return;
        }

        const dob = new Date(dobInput);
        const cutoffDate = new Date(cutoffInput);

        // Calculate exact age
        let ageYears = cutoffDate.getFullYear() - dob.getFullYear();
        let ageMonths = cutoffDate.getMonth() - dob.getMonth();
        let ageDays = cutoffDate.getDate() - dob.getDate();

        if (ageDays < 0) {
            ageMonths--;
            ageDays += new Date(cutoffDate.getFullYear(), cutoffDate.getMonth(), 0).getDate();
        }
        if (ageMonths < 0) {
            ageYears--;
            ageMonths += 12;
        }

        let minAge = 21;
        let maxAge = 30;
        let maxAttempts = 3;
        let ruleName = "";

        if (category === 'css') {
            minAge = 21; maxAge = 30; maxAttempts = 3;
            ruleName = "CSS Exam (21-30 Years, 3 Attempts)";
        } else if (category === 'general30') {
            minAge = 18; maxAge = 30; maxAttempts = 6;
            ruleName = "Standard Govt Job (18-30 Years, 6 Attempts)";
        } else if (category === 'general35') {
            minAge = 21; maxAge = 35; maxAttempts = 6;
            ruleName = "Officer Scale (21-35 Years, 6 Attempts)";
        }

        const resultBox = document.getElementById('resultBox');
        const statusTitle = document.getElementById('statusTitle');
        const resAgeSummary = document.getElementById('resAgeSummary');
        const resAttemptSummary = document.getElementById('resAttemptSummary');
        const resAge = document.getElementById('resAge');
        const resWindow = document.getElementById('resWindow');
        const resDetails = document.getElementById('resDetails');
        const timelineList = document.getElementById('timelineList');

        resultBox.style.display = 'block';
        timelineList.innerHTML = "";

        // --- CALCULATE ATTEMPTS REMAINING ---
        let attemptsUsed = prevAttempts;
        if (isCurrentYearApplied) {
            attemptsUsed += 1; 
        }
        let attemptsRemaining = Math.max(0, maxAttempts - attemptsUsed);

        // --- CALCULATE AGE REMAINING ---
        let yearsUntilOverage = maxAge - ageYears;
        let yearsUntilEligible = minAge - ageYears;

        // --- UPDATE SUMMARY BOXES ---
        // 1. Age Summary
        if (ageYears > maxAge) {
            resAgeSummary.innerHTML = `⏳ <strong>Age Limit:</strong> <span class="highlight">Overage by ${ageYears - maxAge} year(s).</span> You have exceeded the maximum age of ${maxAge}.`;
        } else if (ageYears < minAge) {
            resAgeSummary.innerHTML = `⏳ <strong>Age Limit:</strong> <span class="highlight">Underage.</span> You need ${yearsUntilEligible} more year(s) to reach the minimum age of ${minAge}.`;
        } else {
            resAgeSummary.innerHTML = `⏳ <strong>Age Limit:</strong> <span class="success-text">Within limits.</span> You have <strong>${yearsUntilOverage} year(s)</strong> left before reaching the maximum age of ${maxAge}.`;
        }

        // 2. Attempts Summary
        if (attemptsRemaining === 0) {
            resAttemptSummary.innerHTML = `🔢 <strong>Attempts:</strong> <span class="highlight">0 attempts remaining.</span> You have used ${attemptsUsed} of ${maxAttempts} allowed attempts.`;
        } else {
            resAttemptSummary.innerHTML = `🔢 <strong>Attempts:</strong> <span class="success-text">${attemptsRemaining} attempt(s) remaining.</span> You have used ${attemptsUsed} of ${maxAttempts} allowed attempts.`;
        }

        // --- FINAL ELIGIBILITY CHECK ---
        let isAgeEligible = (ageYears >= minAge && ageYears <= maxAge);
        let isAttemptEligible = (attemptsRemaining > 0);

        if (isAgeEligible && isAttemptEligible) {
            resultBox.className = "result eligible";
            statusTitle.innerText = "Status: ELIGIBLE FOR THIS EXAM CYCLE ✅";
            resDetails.innerText = `You meet both the age and attempt criteria for this cycle.`;
        } else if (!isAgeEligible && !isAttemptEligible) {
            resultBox.className = "result not-eligible";
            statusTitle.innerText = "Status: NOT ELIGIBLE ❌";
            resDetails.innerText = `You do not meet the age criteria, and you have also exhausted your attempts.`;
        } else if (!isAgeEligible) {
            resultBox.className = "result not-eligible";
            statusTitle.innerText = "Status: NOT ELIGIBLE (Age) ❌";
            resDetails.innerText = `You are outside the allowed age window (${minAge}-${maxAge} years).`;
        } else {
            resultBox.className = "result not-eligible";
            statusTitle.innerText = "Status: NOT ELIGIBLE (Attempts) ❌";
            resDetails.innerText = `You have used all ${maxAttempts} of your allowed attempts.`;
        }

        resAge.innerText = `Age on Cut-Off Date: ${ageYears} years, ${ageMonths} months, and ${ageDays} days`;
        resWindow.innerText = `Criteria Rule: ${ruleName}`;

        // --- YEAR-BY-YEAR OUTLOOK ---
        let startExamYear = cutoffDate.getFullYear();
        let simulatedAttemptsUsed = prevAttempts;
        
        for (let i = 0; i < 6; i++) {
            let targetExamYear = startExamYear + i;
            let simulatedCutoff = new Date(`${targetExamYear}-12-31`);
            
            let yearAgeYears = simulatedCutoff.getFullYear() - dob.getFullYear();
            let yearAgeMonths = simulatedCutoff.getMonth() - dob.getMonth();
            if (yearAgeMonths < 0 || (yearAgeMonths === 0 && simulatedCutoff.getDate() < dob.getDate())) {
                yearAgeYears--;
            }
            
            let li = document.createElement('li');
            let isSimAgeEligible = (yearAgeYears >= minAge && yearAgeYears <= maxAge);
            
            // Special handling for the current year checkbox
            let isCurrentYearBox = (i === 0 && isCurrentYearApplied);

            if (isCurrentYearBox) {
                simulatedAttemptsUsed++; // Count it as used
                li.innerHTML = `<b>${targetExamYear} Exam</b> (Age ${yearAgeYears} by Dec 31): <span style="color:green;">Eligible</span> — <b>Already Applied (Attempt #${simulatedAttemptsUsed})</b>`;
            } else if (isSimAgeEligible) {
                if (simulatedAttemptsUsed < maxAttempts) {
                    simulatedAttemptsUsed++;
                    li.innerHTML = `<b>${targetExamYear} Exam</b> (Age ${yearAgeYears} by Dec 31): <span style="color:green;">Eligible</span> — Attempt <b>#${simulatedAttemptsUsed}</b> of ${maxAttempts}.`;
                } else {
                    li.innerHTML = `<b>${targetExamYear} Exam</b> (Age ${yearAgeYears} by Dec 31): <span style="color:orange;">Age-Eligible</span>, but max attempts (${maxAttempts}) finished.`;
                }
            } else if (yearAgeYears < minAge) {
                li.innerHTML = `<b>${targetExamYear} Exam</b> (Age ${yearAgeYears} by Dec 31): <span style="color:red;">Not Eligible</span> (Under min age ${minAge})`;
            } else {
                li.innerHTML = `<b>${targetExamYear} Exam</b> (Age ${yearAgeYears} by Dec 31): <span style="color:red;">Not Eligible</span> (Overage > ${maxAge})`;
            }
            timelineList.appendChild(li);
        }
    }
</script>

</body>
</html>
