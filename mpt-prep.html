<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📊 Subject & Topic Tracker</title>
    <!-- Google Font & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f4f7fb;
            color: #1a2b3c;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            max-width: 1280px;
            width: 100%;
        }

        /* ---------- TOP BAR ---------- */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .top-bar h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f2b3d;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            letter-spacing: -0.01em;
        }

        .top-bar h1 i {
            color: #2a6b8f;
            font-size: 1.15rem;
        }

        .excel-link {
            background: #ffffff;
            border-radius: 30px;
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #0f2b3d;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0, 20, 30, 0.06);
            border: 1px solid #e2edf5;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .excel-link i {
            color: #1e7a5e;
            font-size: 0.75rem;
        }

        .excel-link:hover {
            background: #f0f7ff;
            border-color: #b8d4e8;
        }

        /* ---------- STATS BAR ---------- */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .stat-card {
            flex: 1 1 0;
            min-width: 120px;
            background: white;
            border-radius: 16px;
            padding: 0.8rem 1rem;
            box-shadow: 0 4px 14px -6px rgba(0, 30, 50, 0.08);
            border: 1px solid #eef4fa;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .stat-label {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #4a6a80;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .stat-label i {
            font-size: 0.65rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0c334a;
            line-height: 1.1;
        }

        .stat-value.covered {
            color: #147a4a;
        }

        .stat-value.pending {
            color: #a8690e;
        }

        /* ---------- FILTER BAR ---------- */
        .filter-bar {
            background: white;
            border-radius: 18px;
            padding: 0.7rem 1rem;
            box-shadow: 0 4px 14px -6px rgba(0, 30, 50, 0.08);
            border: 1px solid #eef4fa;
            margin-bottom: 1.2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem;
        }

        .filter-group {
            flex: 1 1 0;
            min-width: 140px;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .filter-group label {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #4a6a80;
            margin-left: 0.2rem;
        }

        .filter-group label i {
            margin-right: 4px;
            font-size: 0.6rem;
        }

        /* ---------- MULTI-SELECT ---------- */
        .multi-select-wrap {
            position: relative;
            width: 100%;
        }

        .multi-select-trigger {
            width: 100%;
            padding: 0.5rem 0.7rem;
            border-radius: 14px;
            border: 1.5px solid #d9e6f0;
            background: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1a2b3c;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
            transition: 0.2s;
            user-select: none;
            min-height: 36px;
        }

        .multi-select-trigger:hover {
            border-color: #b0cde0;
            background: #fafdff;
        }

        .multi-select-trigger.open {
            border-color: #2a6b8f;
            box-shadow: 0 0 0 2px rgba(42, 107, 143, 0.1);
        }

        .multi-select-trigger .placeholder {
            color: #8aa4b8;
            font-weight: 400;
        }

        .multi-select-trigger .selected-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
        }

        .multi-select-trigger i.chevron {
            font-size: 0.7rem;
            color: #4a6a80;
            transition: 0.2s;
        }

        .multi-select-trigger.open i.chevron {
            transform: rotate(180deg);
        }

        .multi-select-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 30px -8px rgba(0, 30, 50, 0.2);
            border: 1px solid #e2edf5;
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            padding: 0.4rem;
        }

        .multi-select-dropdown.open {
            display: block;
        }

        .multi-select-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0.6rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1a2b3c;
            transition: 0.15s;
            user-select: none;
        }

        .multi-select-option:hover {
            background: #f0f7ff;
        }

        .multi-select-option.selected {
            background: #e8f2fc;
            color: #0c4b6b;
        }

        .multi-select-option .check {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1.5px solid #c0d4e4;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.15s;
            background: white;
        }

        .multi-select-option.selected .check {
            background: #2a6b8f;
            border-color: #2a6b8f;
        }

        .multi-select-option .check i {
            font-size: 0.55rem;
            color: white;
            opacity: 0;
            transition: 0.15s;
        }

        .multi-select-option.selected .check i {
            opacity: 1;
        }

        .multi-select-actions {
            display: flex;
            gap: 0.4rem;
            padding: 0.3rem 0.4rem 0.1rem;
            border-top: 1px solid #eef4fa;
            margin-top: 0.2rem;
        }

        .multi-select-actions button {
            flex: 1;
            padding: 0.35rem;
            border-radius: 8px;
            border: 1px solid #d9e6f0;
            background: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c5777;
            cursor: pointer;
            transition: 0.15s;
        }

        .multi-select-actions button:hover {
            background: #f0f7ff;
            border-color: #b0cde0;
        }

        /* ---------- CARD GRID ---------- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 0.9rem;
        }

        /* ---------- CARD ---------- */
        .topic-card {
            background: white;
            border-radius: 16px;
            padding: 0.85rem 1rem;
            box-shadow: 0 5px 16px -8px rgba(0, 30, 50, 0.1);
            border: 1px solid #eef4fa;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            font-size: 0.8rem;
            line-height: 1.35;
            position: relative;
        }

        .topic-card:hover {
            box-shadow: 0 10px 24px -8px rgba(0, 50, 80, 0.15);
            transform: translateY(-2px);
            border-color: #d9e6f2;
        }

        .topic-card.covered {
            border-left: 4px solid #2e9b6e;
        }

        .topic-card.pending {
            border-left: 4px solid #e6a017;
        }

        /* row 1: srno + subject + marks */
        .card-row-1 {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.3rem 0.6rem;
        }

        .card-srno {
            background: #e9f0f7;
            border-radius: 30px;
            padding: 0.1rem 0.6rem;
            font-size: 0.65rem;
            font-weight: 700;
            color: #1a4a66;
            white-space: nowrap;
        }

        .card-subject {
            font-weight: 600;
            color: #0c334a;
            font-size: 0.85rem;
        }

        .card-marks {
            background: #e0f0fa;
            padding: 0.1rem 0.5rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 700;
            color: #146a8a;
            white-space: nowrap;
            margin-left: auto;
        }

        /* row 2: topic with srno */
        .card-row-2 {
            display: flex;
            align-items: flex-start;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .topic-srno-badge {
            background: #d9eaf5;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 700;
            color: #0c4b6b;
            padding: 0.1rem 0.5rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .topic-name {
            font-weight: 500;
            color: #1f3d51;
            word-break: break-word;
            font-size: 0.8rem;
        }

        /* row 3: url + status */
        .card-row-3 {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.1rem;
            flex-wrap: wrap;
        }

        .url-link {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background: #eef6fe;
            color: #18668a;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.7rem;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            transition: 0.2s;
            border: 1px solid #d3e6f2;
            white-space: nowrap;
        }

        .url-link i {
            font-size: 0.6rem;
        }

        .url-link:hover {
            background: #d8e9f8;
            border-color: #97c0db;
            color: #0a3e58;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.1rem 0.5rem;
            border-radius: 30px;
            white-space: nowrap;
        }

        .status-covered {
            background: #e2f5ec;
            color: #147a4a;
        }

        .status-pending {
            background: #fef3e0;
            color: #a8690e;
        }

        /* ---------- STATE MESSAGES ---------- */
        .state-message {
            padding: 3rem 2rem;
            text-align: center;
            background: white;
            border-radius: 28px;
            font-weight: 500;
            color: #2c5777;
            box-shadow: 0 8px 24px -8px rgba(0, 30, 50, 0.1);
            border: 1px solid #eef4fa;
            grid-column: 1 / -1;
        }

        .state-message i {
            font-size: 2rem;
            color: #6f9cbb;
            margin-bottom: 0.8rem;
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 3px solid #d3e6f2;
            border-radius: 50%;
            border-top-color: #2a6b8f;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ---------- MOBILE ---------- */
        @media (max-width: 640px) {
            body {
                padding: 0.7rem;
            }

            .top-bar h1 {
                font-size: 1.05rem;
            }

            .stats-bar {
                gap: 0.5rem;
            }

            .stat-card {
                padding: 0.6rem 0.8rem;
                min-width: 90px;
            }

            .stat-value {
                font-size: 1.2rem;
            }

            .filter-bar {
                flex-direction: column;
                gap: 0.5rem;
                padding: 0.7rem;
            }

            .filter-group {
                width: 100%;
                min-width: unset;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 0.7rem;
            }

            .topic-card {
                padding: 0.75rem 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- top bar -->
        <div class="top-bar">
            <h1>
                <i class="fas fa-graduation-cap"></i> Subject & Topic Tracker
            </h1>
            <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vRILNNrW889d6XpNKRQeUFbYC2mRcwk3SXxRBuMLM3QrygW7nuOsLjID4zJjN2CkhHJtosjYpDmkTmK/pub?output=xlsx" 
               class="excel-link" 
               target="_blank" 
               rel="noopener noreferrer">
                <i class="fas fa-file-excel"></i> Excel
            </a>
        </div>

        <!-- stats bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-layer-group"></i> Total Topics</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-check-circle"></i> Covered</div>
                <div class="stat-value covered" id="statCovered">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-clock"></i> Pending</div>
                <div class="stat-value pending" id="statPending">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label"><i class="fas fa-book"></i> Subjects</div>
                <div class="stat-value" id="statSubjects">0</div>
            </div>
        </div>

        <!-- filter bar with 3 multi-selects -->
        <div class="filter-bar">
            <!-- Subject multi-select -->
            <div class="filter-group">
                <label><i class="fas fa-book"></i> Subject</label>
                <div class="multi-select-wrap" id="subjectMultiWrap">
                    <div class="multi-select-trigger" id="subjectTrigger">
                        <span class="placeholder" id="subjectPlaceholder">All subjects</span>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="multi-select-dropdown" id="subjectDropdown"></div>
                </div>
            </div>

            <!-- Topic multi-select -->
            <div class="filter-group">
                <label><i class="fas fa-tag"></i> Topic</label>
                <div class="multi-select-wrap" id="topicMultiWrap">
                    <div class="multi-select-trigger" id="topicTrigger">
                        <span class="placeholder" id="topicPlaceholder">All topics</span>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="multi-select-dropdown" id="topicDropdown"></div>
                </div>
            </div>

            <!-- Status multi-select -->
            <div class="filter-group">
                <label><i class="fas fa-check-circle"></i> Status</label>
                <div class="multi-select-wrap" id="statusMultiWrap">
                    <div class="multi-select-trigger" id="statusTrigger">
                        <span class="placeholder" id="statusPlaceholder">All statuses</span>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="multi-select-dropdown" id="statusDropdown"></div>
                </div>
            </div>
        </div>

        <!-- cards grid -->
        <div id="cardsContainer" class="cards-grid">
            <!-- filled by JS -->
        </div>
    </div>

    <script>
        (function() {
            // --- config ---
            const SHEET_ID = '1D_wCGy3Rks9MXt84qpC4Ea2Qjo3uSgm0b-JBIh2_mmc';
            const GID = '0';
            const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;

            // --- dom ---
            const cardsContainer = document.getElementById('cardsContainer');
            const statTotal = document.getElementById('statTotal');
            const statCovered = document.getElementById('statCovered');
            const statPending = document.getElementById('statPending');
            const statSubjects = document.getElementById('statSubjects');

            // --- state ---
            let rawData = [];
            let filteredData = [];
            // multi-select state
            let selectedSubjects = new Set();
            let selectedTopics = new Set();
            let selectedStatuses = new Set(['covered', 'pending']); // default: both

            // --- helpers ---

            function parseCSV(csvText) {
                const rows = [];
                let currentRow = [];
                let currentField = '';
                let insideQuotes = false;

                for (let i = 0; i < csvText.length; i++) {
                    const char = csvText[i];
                    const nextChar = csvText[i + 1];

                    if (char === '"') {
                        if (insideQuotes && nextChar === '"') {
                            currentField += '"';
                            i++;
                        } else {
                            insideQuotes = !insideQuotes;
                        }
                    } else if (char === ',' && !insideQuotes) {
                        currentRow.push(currentField);
                        currentField = '';
                    } else if (char === '\n' && !insideQuotes) {
                        currentRow.push(currentField);
                        if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0].trim() !== '')) {
                            rows.push(currentRow);
                        }
                        currentRow = [];
                        currentField = '';
                    } else if (char === '\r') {
                        continue;
                    } else {
                        currentField += char;
                    }
                }
                if (currentField !== '' || currentRow.length > 0) {
                    currentRow.push(currentField);
                    if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0].trim() !== '')) {
                        rows.push(currentRow);
                    }
                }
                return rows;
            }

            function mapRowsToObjects(rows) {
                if (!rows.length) return [];
                const headers = rows[0].map(h => h.trim().toLowerCase());

                const findIndex = (keywords) => {
                    for (let i = 0; i < headers.length; i++) {
                        const h = headers[i];
                        if (keywords.some(k => h.includes(k))) return i;
                    }
                    return -1;
                };

                const srnoIdx = findIndex(['srno', 'sr no', 's.no']);
                const subjectMarksIdx = findIndex(['subject with marks', 'subject', 'marks']);
                const topicSrnoIdx = findIndex(['topic with srno', 'topic with sr no', 'topic']);
                const urlIdx = findIndex(['url', 'link']);

                const dataRows = rows.slice(1);
                const result = [];

                for (const row of dataRows) {
                    if (row.length < 3) continue;

                    const srno = (srnoIdx !== -1 ? row[srnoIdx] : row[0] || '').trim();
                    const subjectWithMarks = (subjectMarksIdx !== -1 ? row[subjectMarksIdx] : row[1] || '').trim();
                    const topicWithSrno = (topicSrnoIdx !== -1 ? row[topicSrnoIdx] : row[2] || '').trim();
                    const url = (urlIdx !== -1 ? row[urlIdx] : row[3] || '').trim();

                    let subject = subjectWithMarks;
                    let marks = '';
                    const marksMatch = subjectWithMarks.match(/\((\d+)\)|\[(\d+)\]|(\d+)\s*$/);
                    if (marksMatch) {
                        marks = marksMatch[1] || marksMatch[2] || marksMatch[3] || '';
                        subject = subjectWithMarks.replace(/\((\d+)\)|\[(\d+)\]|\s*\d+\s*$/, '').trim();
                        if (!subject) subject = subjectWithMarks;
                    } else {
                        const parts = subjectWithMarks.split(' - ');
                        if (parts.length === 2) {
                            subject = parts[0].trim();
                            marks = parts[1].trim();
                        } else {
                            subject = subjectWithMarks;
                        }
                    }

                    let topic = topicWithSrno;
                    let topicSrno = '';
                    const topicSrnoMatch = topicWithSrno.match(/\(([^)]+)\)|\[([^\]]+)\]/);
                    if (topicSrnoMatch) {
                        topicSrno = topicSrnoMatch[1] || topicSrnoMatch[2] || '';
                        topic = topicWithSrno.replace(/\(([^)]+)\)|\[([^\]]+)\]/, '').trim();
                        if (!topic) topic = topicWithSrno;
                    } else {
                        const parts = topicWithSrno.split(/[-:]/);
                        if (parts.length >= 2) {
                            topicSrno = parts[0].trim();
                            topic = parts.slice(1).join(' ').trim();
                        } else {
                            topic = topicWithSrno;
                        }
                    }

                    if (!topicSrno && /^[A-Za-z0-9]+$/.test(topicWithSrno.trim()) && topicWithSrno.trim().length < 6) {
                        topicSrno = topicWithSrno.trim();
                        topic = '';
                    }

                    const hasUrl = url && url !== '#' && url !== '—' && url.trim() !== '';
                    const status = hasUrl ? 'covered' : 'pending';
                    const topicDisplay = topicSrno !== '—' ? `${topicSrno} – ${topic}` : topic;

                    result.push({
                        srno: srno || '—',
                        subject: subject || '—',
                        marks: marks || '—',
                        topicSrno: topicSrno || '—',
                        topic: topic || '—',
                        topicDisplay: topicDisplay || '—',
                        url: hasUrl ? url : '#',
                        hasUrl: hasUrl,
                        status: status
                    });
                }
                return result;
            }

            // --- stats ---
            function updateStats(data) {
                const total = data.length;
                const covered = data.filter(d => d.status === 'covered').length;
                const pending = data.filter(d => d.status === 'pending').length;
                const subjects = new Set(data.map(d => d.subject).filter(s => s !== '—')).size;

                statTotal.textContent = total;
                statCovered.textContent = covered;
                statPending.textContent = pending;
                statSubjects.textContent = subjects;
            }

            // --- multi-select builder ---
            function buildMultiSelect(container, options, selectedSet, onUpdate) {
                const dropdown = container.querySelector('.multi-select-dropdown');
                const trigger = container.querySelector('.multi-select-trigger');
                const placeholder = container.querySelector('.placeholder');
                const selectedText = container.querySelector('.selected-text') || null;

                // clear dropdown
                dropdown.innerHTML = '';

                // "Select All" / "Clear All" actions
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'multi-select-actions';
                const selectAllBtn = document.createElement('button');
                selectAllBtn.textContent = 'Select All';
                selectAllBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    options.forEach(opt => selectedSet.add(opt.value));
                    onUpdate();
                    updateTriggerText();
                    renderDropdown();
                });
                const clearAllBtn = document.createElement('button');
                clearAllBtn.textContent = 'Clear All';
                clearAllBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedSet.clear();
                    onUpdate();
                    updateTriggerText();
                    renderDropdown();
                });
                actionsDiv.appendChild(selectAllBtn);
                actionsDiv.appendChild(clearAllBtn);
                dropdown.appendChild(actionsDiv);

                function renderDropdown() {
                    // remove existing options (but keep actions)
                    const existingOptions = dropdown.querySelectorAll('.multi-select-option');
                    existingOptions.forEach(el => el.remove());

                    options.forEach(opt => {
                        const div = document.createElement('div');
                        div.className = 'multi-select-option' + (selectedSet.has(opt.value) ? ' selected' : '');
                        div.innerHTML = `
                            <span class="check"><i class="fas fa-check"></i></span>
                            <span>${escapeHtml(opt.label)}</span>
                        `;
                        div.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (selectedSet.has(opt.value)) {
                                selectedSet.delete(opt.value);
                            } else {
                                selectedSet.add(opt.value);
                            }
                            onUpdate();
                            updateTriggerText();
                            renderDropdown();
                        });
                        dropdown.appendChild(div);
                    });
                }

                function updateTriggerText() {
                    if (selectedSet.size === 0) {
                        placeholder.textContent = 'All ' + (container.dataset.type || 'items');
                        placeholder.style.display = 'inline';
                        if (selectedText) selectedText.style.display = 'none';
                    } else {
                        placeholder.style.display = 'none';
                        if (selectedText) {
                            selectedText.style.display = 'inline';
                            selectedText.textContent = `${selectedSet.size} selected`;
                        } else {
                            // create selected text element if not exists
                            const span = document.createElement('span');
                            span.className = 'selected-text';
                            span.textContent = `${selectedSet.size} selected`;
                            trigger.insertBefore(span, trigger.querySelector('.chevron'));
                        }
                    }
                }

                // toggle dropdown
                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isOpen = dropdown.classList.contains('open');
                    // close all other dropdowns
                    document.querySelectorAll('.multi-select-dropdown.open').forEach(d => d.classList.remove('open'));
                    document.querySelectorAll('.multi-select-trigger.open').forEach(t => t.classList.remove('open'));
                    if (!isOpen) {
                        dropdown.classList.add('open');
                        trigger.classList.add('open');
                    } else {
                        dropdown.classList.remove('open');
                        trigger.classList.remove('open');
                    }
                });

                // close on outside click
                document.addEventListener('click', (e) => {
                    if (!container.contains(e.target)) {
                        dropdown.classList.remove('open');
                        trigger.classList.remove('open');
                    }
                });

                // initial render
                renderDropdown();
                updateTriggerText();
            }

            // --- filter logic ---
            function applyFiltersAndRender() {
                filteredData = rawData.filter(item => {
                    // Subject filter
                    if (selectedSubjects.size > 0 && !selectedSubjects.has(item.subject)) return false;
                    // Topic filter
                    if (selectedTopics.size > 0 && !selectedTopics.has(item.topicDisplay)) return false;
                    // Status filter
                    if (selectedStatuses.size > 0 && !selectedStatuses.has(item.status)) return false;
                    return true;
                });

                updateStats(filteredData);
                renderCards(filteredData);
            }

            // --- render cards ---
            function renderCards(data) {
                if (!data.length) {
                    cardsContainer.innerHTML = `
                        <div class="state-message">
                            <i class="fas fa-search"></i>
                            No matching topics found.<br>
                            <span style="font-size:0.8rem; opacity:0.7;">Try adjusting filters</span>
                        </div>`;
                    return;
                }

                const fragment = document.createDocumentFragment();

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `topic-card ${item.status === 'covered' ? 'covered' : 'pending'}`;

                    const row1 = document.createElement('div');
                    row1.className = 'card-row-1';
                    row1.innerHTML = `
                        <span class="card-srno">#${escapeHtml(item.srno)}</span>
                        <span class="card-subject">${escapeHtml(item.subject)}</span>
                        ${item.marks !== '—' ? `<span class="card-marks">${escapeHtml(item.marks)}</span>` : ''}
                    `;
                    card.appendChild(row1);

                    const row2 = document.createElement('div');
                    row2.className = 'card-row-2';
                    if (item.topicSrno !== '—' || item.topic !== '—') {
                        row2.innerHTML = `
                            ${item.topicSrno !== '—' ? `<span class="topic-srno-badge">${escapeHtml(item.topicSrno)}</span>` : ''}
                            <span class="topic-name">${escapeHtml(item.topic !== '—' ? item.topic : '')}</span>
                        `;
                    } else {
                        row2.innerHTML = `<span class="topic-name" style="opacity:0.6;">—</span>`;
                    }
                    card.appendChild(row2);

                    const row3 = document.createElement('div');
                    row3.className = 'card-row-3';
                    if (item.hasUrl) {
                        row3.innerHTML = `
                            <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="url-link">
                                <i class="fas fa-external-link-alt"></i> Open
                            </a>
                            <span class="status-badge status-covered"><i class="fas fa-check-circle"></i> Covered</span>
                        `;
                    } else {
                        row3.innerHTML = `
                            <span class="status-badge status-pending"><i class="fas fa-clock"></i> Pending</span>
                        `;
                    }
                    card.appendChild(row3);

                    fragment.appendChild(card);
                });

                cardsContainer.innerHTML = '';
                cardsContainer.appendChild(fragment);
            }

            function escapeHtml(unsafe) {
                if (unsafe === null || unsafe === undefined) return '';
                return String(unsafe)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // --- populate filters ---
            function populateFilters(data) {
                const subjects = new Set();
                const topics = new Set();

                data.forEach(item => {
                    if (item.subject && item.subject !== '—') subjects.add(item.subject);
                    if (item.topicDisplay && item.topicDisplay !== '—') topics.add(item.topicDisplay);
                });

                // build multi-select options
                const subjectOptions = Array.from(subjects).sort().map(s => ({ value: s, label: s }));
                const topicOptions = Array.from(topics).sort().map(t => ({ value: t, label: t }));

                // build subject multi-select
                const subjectWrap = document.getElementById('subjectMultiWrap');
                subjectWrap.dataset.type = 'subjects';
                buildMultiSelect(subjectWrap, subjectOptions, selectedSubjects, applyFiltersAndRender);

                // build topic multi-select
                const topicWrap = document.getElementById('topicMultiWrap');
                topicWrap.dataset.type = 'topics';
                buildMultiSelect(topicWrap, topicOptions, selectedTopics, applyFiltersAndRender);

                // build status multi-select (static options)
                const statusOptions = [
                    { value: 'covered', label: '✅ Covered' },
                    { value: 'pending', label: '⏳ Pending' }
                ];
                const statusWrap = document.getElementById('statusMultiWrap');
                statusWrap.dataset.type = 'statuses';
                buildMultiSelect(statusWrap, statusOptions, selectedStatuses, applyFiltersAndRender);

                // rebuild status trigger text
                const statusTrigger = document.getElementById('statusTrigger');
                const statusPlaceholder = document.getElementById('statusPlaceholder');
                if (selectedStatuses.size === 0) {
                    statusPlaceholder.textContent = 'All statuses';
                } else if (selectedStatuses.size === 2) {
                    statusPlaceholder.textContent = 'All statuses';
                } else {
                    statusPlaceholder.textContent = selectedStatuses.has('covered') ? 'Covered only' : 'Pending only';
                }
            }

            // --- load data ---
            async function loadData() {
                cardsContainer.innerHTML = `
                    <div class="state-message">
                        <div class="spinner"></div>
                        <div>Loading topics…</div>
                    </div>`;

                try {
                    const response = await fetch(CSV_URL);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const csvText = await response.text();

                    if (csvText.trim().startsWith('<!DOCTYPE') || csvText.trim().startsWith('<html')) {
                        throw new Error('Received HTML instead of CSV');
                    }

                    const rows = parseCSV(csvText);
                    if (rows.length < 2) throw new Error('No data rows');

                    rawData = mapRowsToObjects(rows);
                    if (rawData.length === 0) throw new Error('No parsed data');

                    populateFilters(rawData);

                    // set default selected statuses to both
                    selectedStatuses.clear();
                    selectedStatuses.add('covered');
                    selectedStatuses.add('pending');

                    // reset filters
                    selectedSubjects.clear();
                    selectedTopics.clear();

                    applyFiltersAndRender();

                } catch (error) {
                    console.error('Load error:', error);
                    cardsContainer.innerHTML = `
                        <div class="state-message">
                            <i class="fas fa-exclamation-triangle" style="color:#c06b4a;"></i>
                            <div style="margin-bottom:0.4rem;"><strong>Couldn't load sheet</strong></div>
                            <div style="font-size:0.8rem; opacity:0.8;">${escapeHtml(error.message)}</div>
                            <div style="margin-top:1rem; font-size:0.8rem;">Showing sample cards.</div>
                        </div>`;

                    setTimeout(() => {
                        const sample = [
                            { srno: '1', subject: 'Mathematics', marks: '92', topicSrno: 'T1', topic: 'Algebra', topicDisplay: 'T1 – Algebra', url: 'https://example.com/math', hasUrl: true, status: 'covered' },
                            { srno: '2', subject: 'Physics', marks: '88', topicSrno: 'P2', topic: 'Mechanics', topicDisplay: 'P2 – Mechanics', url: '#', hasUrl: false, status: 'pending' },
                            { srno: '3', subject: 'Chemistry', marks: '79', topicSrno: 'C3', topic: 'Organic', topicDisplay: 'C3 – Organic', url: 'https://example.com/chem', hasUrl: true, status: 'covered' },
                            { srno: '4', subject: 'Biology', marks: '85', topicSrno: 'B4', topic: 'Genetics', topicDisplay: 'B4 – Genetics', url: '#', hasUrl: false, status: 'pending' },
                            { srno: '5', subject: 'Computer Science', marks: '95', topicSrno: 'CS1', topic: 'Algorithms', topicDisplay: 'CS1 – Algorithms', url: 'https://example.com/cs', hasUrl: true, status: 'covered' },
                            { srno: '6', subject: 'Mathematics', marks: '92', topicSrno: 'T2', topic: 'Calculus', topicDisplay: 'T2 – Calculus', url: '#', hasUrl: false, status: 'pending' }
                        ];
                        rawData = sample;
                        populateFilters(rawData);
                        selectedStatuses.clear();
                        selectedStatuses.add('covered');
                        selectedStatuses.add('pending');
                        selectedSubjects.clear();
                        selectedTopics.clear();
                        applyFiltersAndRender();
                    }, 200);
                }
            }

            // init
            loadData();
        })();
    </script>
</body>
</html>
