<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📊 Subject & Topic Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f4f7fb;
            color: #1a2b3c;
            padding: 0.8rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            max-width: 1280px;
            width: 100%;
        }

        /* ---------- TOP BAR ---------- */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.7rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .top-bar h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f2b3d;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            letter-spacing: -0.01em;
        }

        .top-bar h1 i {
            color: #2a6b8f;
            font-size: 1rem;
        }

        .sheet-link {
            background: #ffffff;
            border-radius: 30px;
            padding: 0.3rem 0.9rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: #0f2b3d;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0, 20, 30, 0.06);
            border: 1px solid #e2edf5;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            white-space: nowrap;
        }

        .sheet-link i {
            color: #1a7a5e;
            font-size: 0.7rem;
        }

        .sheet-link:hover {
            background: #f0f7ff;
            border-color: #b8d4e8;
        }

        /* ---------- COMPACT STATS ROW ---------- */
        .stats-row {
            display: flex;
            flex-direction: row;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .stats-row::-webkit-scrollbar {
            display: none;
        }

        .stat-chip {
            flex: 1 1 0;
            min-width: 0;
            background: white;
            border-radius: 12px;
            padding: 0.45rem 0.5rem;
            box-shadow: 0 3px 10px -5px rgba(0, 30, 50, 0.1);
            border: 1px solid #eef4fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 0.05rem;
            transition: 0.2s;
        }

        .stat-chip:hover {
            box-shadow: 0 5px 14px -5px rgba(0, 50, 80, 0.15);
            transform: translateY(-1px);
        }

        .stat-chip .chip-label {
            font-size: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #6a8ba5;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            white-space: nowrap;
            line-height: 1;
        }

        .stat-chip .chip-label i {
            font-size: 0.5rem;
        }

        .stat-chip .chip-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0c334a;
            line-height: 1.1;
        }

        .stat-chip .chip-value.covered {
            color: #147a4a;
        }

        .stat-chip .chip-value.pending {
            color: #a8690e;
        }

        /* ---------- FILTER BAR ---------- */
        .filter-bar {
            background: white;
            border-radius: 16px;
            padding: 0.6rem 0.9rem;
            box-shadow: 0 4px 14px -6px rgba(0, 30, 50, 0.08);
            border: 1px solid #eef4fa;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-group {
            flex: 1 1 0;
            min-width: 130px;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .filter-group label {
            font-size: 0.55rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #4a6a80;
            margin-left: 0.2rem;
        }

        .filter-group label i {
            margin-right: 3px;
            font-size: 0.55rem;
        }

        /* ---------- MULTI-SELECT ---------- */
        .multi-select-wrap {
            position: relative;
            width: 100%;
        }

        .multi-select-trigger {
            width: 100%;
            padding: 0.4rem 0.6rem;
            border-radius: 12px;
            border: 1.5px solid #d9e6f0;
            background: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1a2b3c;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
            transition: 0.2s;
            user-select: none;
            min-height: 32px;
        }

        .multi-select-trigger:hover {
            border-color: #b0cde0;
            background: #fafdff;
        }

        .multi-select-trigger.open {
            border-color: #2a6b8f;
            box-shadow: 0 0 0 2px rgba(42, 107, 143, 0.1);
        }

        .multi-select-trigger .placeholder {
            color: #8aa4b8;
            font-weight: 400;
        }

        .multi-select-trigger .selected-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
        }

        .multi-select-trigger i.chevron {
            font-size: 0.65rem;
            color: #4a6a80;
            transition: 0.2s;
        }

        .multi-select-trigger.open i.chevron {
            transform: rotate(180deg);
        }

        .multi-select-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px -8px rgba(0, 30, 50, 0.2);
            border: 1px solid #e2edf5;
            max-height: 240px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            padding: 0.35rem;
        }

        .multi-select-dropdown.open {
            display: block;
        }

        /* search box inside dropdown */
        .multi-select-search {
            width: 100%;
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            border: 1.5px solid #d9e6f0;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1a2b3c;
            outline: none;
            transition: 0.2s;
            margin-bottom: 0.25rem;
            background: #fafdff;
        }

        .multi-select-search:focus {
            border-color: #2a6b8f;
            background: #ffffff;
            box-shadow: 0 0 0 2px rgba(42, 107, 143, 0.1);
        }

        .multi-select-search::placeholder {
            color: #8aa4b8;
            font-weight: 400;
        }

        .multi-select-option {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.4rem 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            color: #1a2b3c;
            transition: 0.15s;
            user-select: none;
        }

        .multi-select-option:hover {
            background: #f0f7ff;
        }

        .multi-select-option.selected {
            background: #e8f2fc;
            color: #0c4b6b;
        }

        .multi-select-option .check {
            width: 15px;
            height: 15px;
            border-radius: 4px;
            border: 1.5px solid #c0d4e4;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.15s;
            background: white;
        }

        .multi-select-option.selected .check {
            background: #2a6b8f;
            border-color: #2a6b8f;
        }

        .multi-select-option .check i {
            font-size: 0.5rem;
            color: white;
            opacity: 0;
            transition: 0.15s;
        }

        .multi-select-option.selected .check i {
            opacity: 1;
        }

        .multi-select-actions {
            display: flex;
            gap: 0.35rem;
            padding: 0.25rem 0.35rem 0.1rem;
            border-top: 1px solid #eef4fa;
            margin-top: 0.15rem;
        }

        .multi-select-actions button {
            flex: 1;
            padding: 0.3rem;
            border-radius: 7px;
            border: 1px solid #d9e6f0;
            background: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            color: #2c5777;
            cursor: pointer;
            transition: 0.15s;
        }

        .multi-select-actions button:hover {
            background: #f0f7ff;
            border-color: #b0cde0;
        }

        /* ---------- CARD GRID ---------- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 0.8rem;
        }

        /* ---------- CARD ---------- */
        .topic-card {
            background: white;
            border-radius: 14px;
            padding: 0.75rem 0.9rem;
            box-shadow: 0 4px 14px -7px rgba(0, 30, 50, 0.1);
            border: 1px solid #eef4fa;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            font-size: 0.78rem;
            line-height: 1.3;
            position: relative;
        }

        .topic-card:hover {
            box-shadow: 0 8px 22px -8px rgba(0, 50, 80, 0.15);
            transform: translateY(-2px);
            border-color: #d9e6f2;
        }

        .topic-card.covered {
            border-left: 4px solid #2e9b6e;
        }

        .topic-card.pending {
            border-left: 4px solid #e6a017;
        }

        /* TOP ROW: subtopic (left) + URL nav (right) */
        .card-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .card-subtopic {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            min-width: 0;
            flex: 1;
        }

        .card-subtopic .subtopic-code {
            background: #d9eaf5;
            border-radius: 30px;
            font-size: 0.55rem;
            font-weight: 700;
            color: #0c4b6b;
            padding: 0.1rem 0.45rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .card-subtopic .subtopic-name {
            font-weight: 600;
            color: #0c334a;
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* URL nav button top right */
        .card-nav {
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            background: #eef6fe;
            color: #18668a;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.6rem;
            padding: 0.15rem 0.55rem;
            border-radius: 30px;
            transition: 0.2s;
            border: 1px solid #d3e6f2;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .card-nav i {
            font-size: 0.55rem;
        }

        .card-nav:hover {
            background: #d8e9f8;
            border-color: #97c0db;
            color: #0a3e58;
        }

        /* MID ROW: Srno + Percentage + Subject (with count) */
        .card-mid-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.3rem 0.5rem;
        }

        .card-srno {
            background: #e9f0f7;
            border-radius: 30px;
            padding: 0.1rem 0.5rem;
            font-size: 0.6rem;
            font-weight: 700;
            color: #1a4a66;
            white-space: nowrap;
        }

        .card-percentage {
            background: #e0f0fa;
            padding: 0.1rem 0.45rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 700;
            color: #146a8a;
            white-space: nowrap;
        }

        .card-subject-with-count {
            font-weight: 500;
            color: #1f3d51;
            font-size: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .card-subject-with-count .count-badge {
            color: #6a8ba5;
            font-weight: 500;
            font-size: 0.7rem;
        }

        /* Category count row */
        .card-category-count {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.65rem;
            color: #4a6a80;
            font-weight: 500;
            background: #f5f9fd;
            border-radius: 8px;
            padding: 0.2rem 0.5rem;
            border: 1px solid #e6eef6;
        }

        .card-category-count i {
            font-size: 0.55rem;
            color: #6a8ba5;
        }

        .card-category-count .cat-count {
            font-weight: 700;
            color: #146a8a;
            margin-left: auto;
            background: #e0f0fa;
            padding: 0.05rem 0.4rem;
            border-radius: 20px;
            font-size: 0.6rem;
        }

        /* STATUS ROW with checkmark */
        .card-status-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .status-check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
            font-size: 0.55rem;
        }

        .status-check.covered {
            background: #2e9b6e;
            color: white;
        }

        .status-check.pending {
            background: #e6a017;
            color: white;
        }

        .status-text {
            font-size: 0.65rem;
            font-weight: 600;
            color: #2c5777;
        }

        .status-text.covered {
            color: #147a4a;
        }

        .status-text.pending {
            color: #a8690e;
        }

        /* ---------- STATE MESSAGES ---------- */
        .state-message {
            padding: 3rem 2rem;
            text-align: center;
            background: white;
            border-radius: 28px;
            font-weight: 500;
            color: #2c5777;
            box-shadow: 0 8px 24px -8px rgba(0, 30, 50, 0.1);
            border: 1px solid #eef4fa;
            grid-column: 1 / -1;
        }

        .state-message i {
            font-size: 2rem;
            color: #6f9cbb;
            margin-bottom: 0.8rem;
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 2rem;
            height: 2rem;
            border: 3px solid #d3e6f2;
            border-radius: 50%;
            border-top-color: #2a6b8f;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ---------- MOBILE ---------- */
        @media (max-width: 640px) {
            body {
                padding: 0.6rem;
            }

            .top-bar h1 {
                font-size: 1rem;
            }

            .stat-chip {
                padding: 0.4rem 0.35rem;
                border-radius: 10px;
            }

            .stat-chip .chip-value {
                font-size: 0.95rem;
            }

            .stat-chip .chip-label {
                font-size: 0.45rem;
            }

            .stat-chip .chip-label i {
                font-size: 0.45rem;
            }

            .filter-bar {
                flex-direction: column;
                gap: 0.4rem;
                padding: 0.6rem;
            }

            .filter-group {
                width: 100%;
                min-width: unset;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 0.6rem;
            }

            .topic-card {
                padding: 0.65rem 0.75rem;
            }
        }

        @media (max-width: 380px) {
            .stat-chip .chip-label {
                font-size: 0.4rem;
            }

            .stat-chip .chip-value {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- top bar with Google Sheet link -->
        <div class="top-bar">
            <h1>
                <i class="fas fa-graduation-cap"></i> Subject & Topic Tracker
            </h1>
            <a href="https://docs.google.com/spreadsheets/d/1D_wCGy3Rks9MXt84qpC4Ea2Qjo3uSgm0b-JBIh2_mmc/edit?gid=0#gid=0" 
               class="sheet-link" 
               target="_blank" 
               rel="noopener noreferrer">
                <i class="fas fa-table"></i> Google Sheet
            </a>
        </div>

        <!-- compact stats row -->
        <div class="stats-row">
            <div class="stat-chip">
                <div class="chip-label"><i class="fas fa-layer-group"></i> Total</div>
                <div class="chip-value" id="statTotal">0</div>
            </div>
            <div class="stat-chip">
                <div class="chip-label"><i class="fas fa-check-circle"></i> Covered</div>
                <div class="chip-value covered" id="statCovered">0</div>
            </div>
            <div class="stat-chip">
                <div class="chip-label"><i class="fas fa-clock"></i> Pending</div>
                <div class="chip-value pending" id="statPending">0</div>
            </div>
            <div class="stat-chip">
                <div class="chip-label"><i class="fas fa-book"></i> Subjects</div>
                <div class="chip-value" id="statSubjects">0</div>
            </div>
        </div>

        <!-- filter bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <label><i class="fas fa-book"></i> Subject</label>
                <div class="multi-select-wrap" id="subjectMultiWrap">
                    <div class="multi-select-trigger" id="subjectTrigger">
                        <span class="placeholder" id="subjectPlaceholder">All subjects</span>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="multi-select-dropdown" id="subjectDropdown"></div>
                </div>
            </div>

            <div class="filter-group">
                <label><i class="fas fa-tag"></i> Topic</label>
                <div class="multi-select-wrap" id="topicMultiWrap">
                    <div class="multi-select-trigger" id="topicTrigger">
                        <span class="placeholder" id="topicPlaceholder">All topics</span>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="multi-select-dropdown" id="topicDropdown"></div>
                </div>
            </div>

            <div class="filter-group">
                <label><i class="fas fa-check-circle"></i> Status</label>
                <div class="multi-select-wrap" id="statusMultiWrap">
                    <div class="multi-select-trigger" id="statusTrigger">
                        <span class="placeholder" id="statusPlaceholder">All statuses</span>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="multi-select-dropdown" id="statusDropdown"></div>
                </div>
            </div>
        </div>

        <!-- cards grid -->
        <div id="cardsContainer" class="cards-grid"></div>
    </div>

    <script>
        (function() {
            const SHEET_ID = '1D_wCGy3Rks9MXt84qpC4Ea2Qjo3uSgm0b-JBIh2_mmc';
            const GID = '0';
            const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;

            const cardsContainer = document.getElementById('cardsContainer');
            const statTotal = document.getElementById('statTotal');
            const statCovered = document.getElementById('statCovered');
            const statPending = document.getElementById('statPending');
            const statSubjects = document.getElementById('statSubjects');

            let rawData = [];
            let filteredData = [];
            let selectedSubjects = new Set();
            let selectedTopics = new Set();
            let selectedStatuses = new Set(['covered', 'pending']);

            // Counts per subject and per subtopic category
            let subjectCounts = {};
            let subtopicCounts = {};

            function parseCSV(csvText) {
                const rows = [];
                let currentRow = [];
                let currentField = '';
                let insideQuotes = false;

                for (let i = 0; i < csvText.length; i++) {
                    const char = csvText[i];
                    const nextChar = csvText[i + 1];

                    if (char === '"') {
                        if (insideQuotes && nextChar === '"') {
                            currentField += '"';
                            i++;
                        } else {
                            insideQuotes = !insideQuotes;
                        }
                    } else if (char === ',' && !insideQuotes) {
                        currentRow.push(currentField);
                        currentField = '';
                    } else if (char === '\n' && !insideQuotes) {
                        currentRow.push(currentField);
                        if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0].trim() !== '')) {
                            rows.push(currentRow);
                        }
                        currentRow = [];
                        currentField = '';
                    } else if (char === '\r') {
                        continue;
                    } else {
                        currentField += char;
                    }
                }
                if (currentField !== '' || currentRow.length > 0) {
                    currentRow.push(currentField);
                    if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0].trim() !== '')) {
                        rows.push(currentRow);
                    }
                }
                return rows;
            }

            function mapRowsToObjects(rows) {
                if (!rows.length) return [];
                const headers = rows[0].map(h => h.trim().toLowerCase());

                const findIndex = (keywords) => {
                    for (let i = 0; i < headers.length; i++) {
                        const h = headers[i];
                        if (keywords.some(k => h.includes(k))) return i;
                    }
                    return -1;
                };

                const srnoIdx = findIndex(['srno', 'sr no', 's.no']);
                const subjectMarksIdx = findIndex(['subject with marks', 'subject', 'marks']);
                const topicSrnoIdx = findIndex(['topic with srno', 'topic with sr no', 'topic']);
                const urlIdx = findIndex(['url', 'link']);

                const dataRows = rows.slice(1);
                const result = [];

                for (const row of dataRows) {
                    if (row.length < 3) continue;

                    const srno = (srnoIdx !== -1 ? row[srnoIdx] : row[0] || '').trim();
                    const subjectWithMarks = (subjectMarksIdx !== -1 ? row[subjectMarksIdx] : row[1] || '').trim();
                    const topicWithSrno = (topicSrnoIdx !== -1 ? row[topicSrnoIdx] : row[2] || '').trim();
                    const url = (urlIdx !== -1 ? row[urlIdx] : row[3] || '').trim();

                    let subject = subjectWithMarks;
                    let marks = '';
                    const marksMatch = subjectWithMarks.match(/\((\d+)\)|\[(\d+)\]|(\d+)\s*$/);
                    if (marksMatch) {
                        marks = marksMatch[1] || marksMatch[2] || marksMatch[3] || '';
                        subject = subjectWithMarks.replace(/\((\d+)\)|\[(\d+)\]|\s*\d+\s*$/, '').trim();
                        if (!subject) subject = subjectWithMarks;
                    } else {
                        const parts = subjectWithMarks.split(' - ');
                        if (parts.length === 2) {
                            subject = parts[0].trim();
                            marks = parts[1].trim();
                        } else {
                            subject = subjectWithMarks;
                        }
                    }

                    // Parse topic: split into category code (like 1.1) and topic name
                    let topic = topicWithSrno;
                    let topicSrno = '';
                    // Try to match patterns like "1.1 Basic Arithmetic" or "1.1 - Basic Arithmetic" or "Basic Arithmetic (1.1)"
                    const codeMatch = topicWithSrno.match(/^(\d+\.\d+)\s*[-–]?\s*(.+)/);
                    if (codeMatch) {
                        topicSrno = codeMatch[1];
                        topic = codeMatch[2].trim();
                    } else {
                        const topicSrnoMatch = topicWithSrno.match(/\(([^)]+)\)|\[([^\]]+)\]/);
                        if (topicSrnoMatch) {
                            topicSrno = topicSrnoMatch[1] || topicSrnoMatch[2] || '';
                            topic = topicWithSrno.replace(/\(([^)]+)\)|\[([^\]]+)\]/, '').trim();
                        } else {
                            const parts = topicWithSrno.split(/[-:]/);
                            if (parts.length >= 2) {
                                topicSrno = parts[0].trim();
                                topic = parts.slice(1).join(' ').trim();
                            } else {
                                topic = topicWithSrno;
                            }
                        }
                    }

                    if (!topicSrno && /^[A-Za-z0-9.]+$/.test(topicWithSrno.trim()) && topicWithSrno.trim().length < 8) {
                        topicSrno = topicWithSrno.trim();
                        topic = '';
                    }

                    const hasUrl = url && url !== '#' && url !== '—' && url.trim() !== '';
                    const status = hasUrl ? 'covered' : 'pending';
                    // category key: e.g. "1.1 Basic Arithmetic" — group by code + topic name
                    const categoryKey = topicSrno !== '—' ? `${topicSrno} ${topic}` : topic;

                    result.push({
                        srno: srno || '—',
                        subject: subject || '—',
                        marks: marks || '—',
                        topicSrno: topicSrno || '—',
                        topic: topic || '—',
                        topicDisplay: topicSrno !== '—' ? `${topicSrno} – ${topic}` : topic,
                        categoryKey: categoryKey || '—',
                        url: hasUrl ? url : '#',
                        hasUrl: hasUrl,
                        status: status
                    });
                }
                return result;
            }

            function computeCounts(data) {
                subjectCounts = {};
                subtopicCounts = {};

                data.forEach(item => {
                    if (item.subject && item.subject !== '—') {
                        subjectCounts[item.subject] = (subjectCounts[item.subject] || 0) + 1;
                    }
                    const key = item.categoryKey;
                    if (key && key !== '—') {
                        subtopicCounts[key] = (subtopicCounts[key] || 0) + 1;
                    }
                });
            }

            function updateStats(data) {
                const total = data.length;
                const covered = data.filter(d => d.status === 'covered').length;
                const pending = data.filter(d => d.status === 'pending').length;
                const subjects = new Set(data.map(d => d.subject).filter(s => s !== '—')).size;

                statTotal.textContent = total;
                statCovered.textContent = covered;
                statPending.textContent = pending;
                statSubjects.textContent = subjects;
            }

            // Build multi-select with optional search
            function buildMultiSelect(container, options, selectedSet, onUpdate, enableSearch) {
                const dropdown = container.querySelector('.multi-select-dropdown');
                const trigger = container.querySelector('.multi-select-trigger');
                const placeholder = container.querySelector('.placeholder');

                dropdown.innerHTML = '';

                // search box (only if enabled)
                let searchInput = null;
                if (enableSearch) {
                    searchInput = document.createElement('input');
                    searchInput.type = 'text';
                    searchInput.className = 'multi-select-search';
                    searchInput.placeholder = 'Search...';
                    searchInput.addEventListener('input', () => {
                        renderDropdown(searchInput.value);
                    });
                    searchInput.addEventListener('click', (e) => e.stopPropagation());
                    dropdown.appendChild(searchInput);
                }

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'multi-select-actions';
                const selectAllBtn = document.createElement('button');
                selectAllBtn.textContent = 'All';
                selectAllBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    // select all visible (filtered) options
                    const visibleOpts = options.filter(opt => {
                        if (!searchInput || !searchInput.value) return true;
                        return opt.label.toLowerCase().includes(searchInput.value.toLowerCase());
                    });
                    visibleOpts.forEach(opt => selectedSet.add(opt.value));
                    onUpdate();
                    updateTriggerText();
                    renderDropdown(searchInput ? searchInput.value : '');
                });
                const clearAllBtn = document.createElement('button');
                clearAllBtn.textContent = 'Clear';
                clearAllBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedSet.clear();
                    onUpdate();
                    updateTriggerText();
                    renderDropdown(searchInput ? searchInput.value : '');
                });
                actionsDiv.appendChild(selectAllBtn);
                actionsDiv.appendChild(clearAllBtn);
                dropdown.appendChild(actionsDiv);

                function renderDropdown(filterText) {
                    // remove existing options (but keep search and actions)
                    const existingOptions = dropdown.querySelectorAll('.multi-select-option');
                    existingOptions.forEach(el => el.remove());

                    let filteredOptions = options;
                    if (filterText && filterText.trim() !== '') {
                        const q = filterText.toLowerCase().trim();
                        filteredOptions = options.filter(opt => opt.label.toLowerCase().includes(q));
                    }

                    if (filteredOptions.length === 0) {
                        const emptyDiv = document.createElement('div');
                        emptyDiv.className = 'multi-select-option';
                        emptyDiv.style.opacity = '0.5';
                        emptyDiv.style.cursor = 'default';
                        emptyDiv.innerHTML = `<span style="padding: 0.3rem 0;">No matches found</span>`;
                        dropdown.appendChild(emptyDiv);
                        return;
                    }

                    filteredOptions.forEach(opt => {
                        const div = document.createElement('div');
                        div.className = 'multi-select-option' + (selectedSet.has(opt.value) ? ' selected' : '');
                        div.innerHTML = `
                            <span class="check"><i class="fas fa-check"></i></span>
                            <span>${escapeHtml(opt.label)}</span>
                        `;
                        div.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (selectedSet.has(opt.value)) {
                                selectedSet.delete(opt.value);
                            } else {
                                selectedSet.add(opt.value);
                            }
                            onUpdate();
                            updateTriggerText();
                            renderDropdown(searchInput ? searchInput.value : '');
                        });
                        dropdown.appendChild(div);
                    });
                }

                function updateTriggerText() {
                    if (selectedSet.size === 0) {
                        placeholder.textContent = 'All ' + (container.dataset.type || 'items');
                        placeholder.style.display = 'inline';
                    } else {
                        placeholder.style.display = 'none';
                        let selectedText = trigger.querySelector('.selected-text');
                        if (!selectedText) {
                            selectedText = document.createElement('span');
                            selectedText.className = 'selected-text';
                            trigger.insertBefore(selectedText, trigger.querySelector('.chevron'));
                        }
                        selectedText.textContent = `${selectedSet.size} selected`;
                        selectedText.style.display = 'inline';
                    }
                }

                trigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isOpen = dropdown.classList.contains('open');
                    document.querySelectorAll('.multi-select-dropdown.open').forEach(d => d.classList.remove('open'));
                    document.querySelectorAll('.multi-select-trigger.open').forEach(t => t.classList.remove('open'));
                    if (!isOpen) {
                        dropdown.classList.add('open');
                        trigger.classList.add('open');
                        if (searchInput) {
                            searchInput.value = '';
                            setTimeout(() => searchInput.focus(), 50);
                        }
                        renderDropdown('');
                    }
                });

                document.addEventListener('click', (e) => {
                    if (!container.contains(e.target)) {
                        dropdown.classList.remove('open');
                        trigger.classList.remove('open');
                    }
                });

                renderDropdown('');
                updateTriggerText();
            }

            function applyFiltersAndRender() {
                filteredData = rawData.filter(item => {
                    if (selectedSubjects.size > 0 && !selectedSubjects.has(item.subject)) return false;
                    if (selectedTopics.size > 0 && !selectedTopics.has(item.topicDisplay)) return false;
                    if (selectedStatuses.size > 0 && !selectedStatuses.has(item.status)) return false;
                    return true;
                });

                updateStats(filteredData);
                renderCards(filteredData);
            }

            // ---------- CARD RENDERING with category count ----------
            function renderCards(data) {
                if (!data.length) {
                    cardsContainer.innerHTML = `
                        <div class="state-message">
                            <i class="fas fa-search"></i>
                            No matching topics found.<br>
                            <span style="font-size:0.8rem; opacity:0.7;">Try adjusting filters</span>
                        </div>`;
                    return;
                }

                const fragment = document.createDocumentFragment();

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `topic-card ${item.status === 'covered' ? 'covered' : 'pending'}`;

                    // ===== TOP ROW: Subtopic (left) + URL nav (right) =====
                    const topRow = document.createElement('div');
                    topRow.className = 'card-top-row';

                    const subtopicDiv = document.createElement('div');
                    subtopicDiv.className = 'card-subtopic';
                    subtopicDiv.innerHTML = `
                        ${item.topicSrno && item.topicSrno !== '—' ? `<span class="subtopic-code">${escapeHtml(item.topicSrno)}</span>` : ''}
                        <span class="subtopic-name">${escapeHtml(item.topic !== '—' ? item.topic : '—')}</span>
                    `;
                    topRow.appendChild(subtopicDiv);

                    if (item.hasUrl) {
                        const navLink = document.createElement('a');
                        navLink.href = item.url;
                        navLink.target = '_blank';
                        navLink.rel = 'noopener noreferrer';
                        navLink.className = 'card-nav';
                        navLink.innerHTML = `<i class="fas fa-external-link-alt"></i> Open`;
                        topRow.appendChild(navLink);
                    }

                    card.appendChild(topRow);

                    // ===== MID ROW: Srno + Percentage + Subject (with count) =====
                    const midRow = document.createElement('div');
                    midRow.className = 'card-mid-row';

                    const srnoSpan = document.createElement('span');
                    srnoSpan.className = 'card-srno';
                    srnoSpan.textContent = `#${item.srno}`;
                    midRow.appendChild(srnoSpan);

                    if (item.marks && item.marks !== '—') {
                        const pctSpan = document.createElement('span');
                        pctSpan.className = 'card-percentage';
                        pctSpan.textContent = `${item.marks}%`;
                        midRow.appendChild(pctSpan);
                    }

                    const subjectSpan = document.createElement('span');
                    subjectSpan.className = 'card-subject-with-count';
                    const subjCount = subjectCounts[item.subject] || 1;
                    subjectSpan.innerHTML = `${escapeHtml(item.subject)} <span class="count-badge">(${subjCount})</span>`;
                    midRow.appendChild(subjectSpan);

                    card.appendChild(midRow);

                    // ===== CATEGORY COUNT ROW =====
                    const catKey = item.categoryKey;
                    const catCount = subtopicCounts[catKey] || 1;
                    if (catKey && catKey !== '—') {
                        const catRow = document.createElement('div');
                        catRow.className = 'card-category-count';
                        catRow.innerHTML = `
                            <i class="fas fa-tags"></i>
                            <span>${escapeHtml(catKey)}</span>
                            <span class="cat-count">${catCount} topic${catCount > 1 ? 's' : ''}</span>
                        `;
                        card.appendChild(catRow);
                    }

                    // ===== STATUS ROW with checkmark =====
                    const statusRow = document.createElement('div');
                    statusRow.className = 'card-status-row';
                    if (item.hasUrl) {
                        statusRow.innerHTML = `
                            <span class="status-check covered"><i class="fas fa-check"></i></span>
                            <span class="status-text covered">Covered</span>
                        `;
                    } else {
                        statusRow.innerHTML = `
                            <span class="status-check pending"><i class="fas fa-clock"></i></span>
                            <span class="status-text pending">Pending</span>
                        `;
                    }
                    card.appendChild(statusRow);

                    fragment.appendChild(card);
                });

                cardsContainer.innerHTML = '';
                cardsContainer.appendChild(fragment);
            }

            function escapeHtml(unsafe) {
                if (unsafe === null || unsafe === undefined) return '';
                return String(unsafe)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            function populateFilters(data) {
                const subjects = new Set();
                const topics = new Set();

                data.forEach(item => {
                    if (item.subject && item.subject !== '—') subjects.add(item.subject);
                    if (item.topicDisplay && item.topicDisplay !== '—') topics.add(item.topicDisplay);
                });

                const subjectOptions = Array.from(subjects).sort().map(s => ({ value: s, label: s }));
                const topicOptions = Array.from(topics).sort().map(t => ({ value: t, label: t }));

                const subjectWrap = document.getElementById('subjectMultiWrap');
                subjectWrap.dataset.type = 'subjects';
                buildMultiSelect(subjectWrap, subjectOptions, selectedSubjects, applyFiltersAndRender, false);

                // Topic multi-select WITH search
                const topicWrap = document.getElementById('topicMultiWrap');
                topicWrap.dataset.type = 'topics';
                buildMultiSelect(topicWrap, topicOptions, selectedTopics, applyFiltersAndRender, true);

                const statusOptions = [
                    { value: 'covered', label: '✅ Covered' },
                    { value: 'pending', label: '⏳ Pending' }
                ];
                const statusWrap = document.getElementById('statusMultiWrap');
                statusWrap.dataset.type = 'statuses';
                buildMultiSelect(statusWrap, statusOptions, selectedStatuses, applyFiltersAndRender, false);
            }

            async function loadData() {
                cardsContainer.innerHTML = `
                    <div class="state-message">
                        <div class="spinner"></div>
                        <div>Loading topics…</div>
                    </div>`;

                try {
                    const response = await fetch(CSV_URL);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const csvText = await response.text();

                    if (csvText.trim().startsWith('<!DOCTYPE') || csvText.trim().startsWith('<html')) {
                        throw new Error('Received HTML instead of CSV');
                    }

                    const rows = parseCSV(csvText);
                    if (rows.length < 2) throw new Error('No data rows');

                    rawData = mapRowsToObjects(rows);
                    if (rawData.length === 0) throw new Error('No parsed data');

                    computeCounts(rawData);

                    populateFilters(rawData);

                    selectedStatuses.clear();
                    selectedStatuses.add('covered');
                    selectedStatuses.add('pending');
                    selectedSubjects.clear();
                    selectedTopics.clear();

                    applyFiltersAndRender();

                } catch (error) {
                    console.error('Load error:', error);
                    cardsContainer.innerHTML = `
                        <div class="state-message">
                            <i class="fas fa-exclamation-triangle" style="color:#c06b4a;"></i>
                            <div style="margin-bottom:0.4rem;"><strong>Couldn't load sheet</strong></div>
                            <div style="font-size:0.8rem; opacity:0.8;">${escapeHtml(error.message)}</div>
                            <div style="margin-top:1rem; font-size:0.8rem;">Showing sample cards.</div>
                        </div>`;

                    setTimeout(() => {
                        const sample = [
                            { srno: '1', subject: 'General Abilities (60 MCQs)', marks: '60', topicSrno: '1.1', topic: 'Basic Arithmetic', topicDisplay: '1.1 – Basic Arithmetic', categoryKey: '1.1 Basic Arithmetic', url: 'https://example.com/math', hasUrl: true, status: 'covered' },
                            { srno: '2', subject: 'General Abilities (60 MCQs)', marks: '60', topicSrno: '1.2', topic: 'Basic Arithmetic', topicDisplay: '1.2 – Basic Arithmetic', categoryKey: '1.2 Basic Arithmetic', url: 'https://example.com/ratios', hasUrl: true, status: 'covered' },
                            { srno: '3', subject: 'General Abilities (60 MCQs)', marks: '60', topicSrno: '1.3', topic: 'Basic Arithmetic', topicDisplay: '1.3 – Basic Arithmetic', categoryKey: '1.3 Basic Arithmetic', url: 'https://example.com/averages', hasUrl: true, status: 'covered' },
                            { srno: '4', subject: 'General Abilities (60 MCQs)', marks: '60', topicSrno: '1.4', topic: 'Basic Arithmetic', topicDisplay: '1.4 – Basic Arithmetic', categoryKey: '1.4 Basic Arithmetic', url: '#', hasUrl: false, status: 'pending' },
                            { srno: '5', subject: 'General Abilities (60 MCQs)', marks: '60', topicSrno: '2.1', topic: 'Algebra', topicDisplay: '2.1 – Algebra', categoryKey: '2.1 Algebra', url: 'https://example.com/algebra', hasUrl: true, status: 'covered' },
                            { srno: '6', subject: 'General Abilities (60 MCQs)', marks: '60', topicSrno: '2.2', topic: 'Algebra', topicDisplay: '2.2 – Algebra', categoryKey: '2.2 Algebra', url: '#', hasUrl: false, status: 'pending' },
                            { srno: '7', subject: 'English (40 MCQs)', marks: '40', topicSrno: '3.1', topic: 'Grammar', topicDisplay: '3.1 – Grammar', categoryKey: '3.1 Grammar', url: 'https://example.com/grammar', hasUrl: true, status: 'covered' },
                            { srno: '8', subject: 'English (40 MCQs)', marks: '40', topicSrno: '3.2', topic: 'Vocabulary', topicDisplay: '3.2 – Vocabulary', categoryKey: '3.2 Vocabulary', url: '#', hasUrl: false, status: 'pending' }
                        ];
                        rawData = sample;
                        computeCounts(rawData);
                        populateFilters(rawData);
                        selectedStatuses.clear();
                        selectedStatuses.add('covered');
                        selectedStatuses.add('pending');
                        selectedSubjects.clear();
                        selectedTopics.clear();
                        applyFiltersAndRender();
                    }, 200);
                }
            }

            loadData();
        })();
    </script>
