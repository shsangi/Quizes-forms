<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Read CSV Google Sheet</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h2>Google Sheet CSV Viewer</h2>
    <div id="table-container">Loading...</div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQfcgGgESJ_GlCR7EnCJAl34LBhJbCFAv3S7qcxujKNb44bukCymdC5vqc4WVEmJULVPF7U3fqQOigL/pub?output=csv';

        fetch(csvUrl)
            .then(response => response.text())
            .then(data => {
                const rows = data.split('\n').map(row => row.split(','));
                let html = '<table>';
                
                rows.forEach((row, rowIndex) => {
                    html += '<tr>';
                    row.forEach(cell => {
                        // Clean up quotes if present
                        const cleanCell = cell.replace(/^"|"$/g, '').trim();
                        const tag = rowIndex === 0 ? 'th' : 'td';
                        html += `<${tag}>${cleanCell}</${tag}>`;
                    });
                    html += '</tr>';
                });
                
                html += '</table>';
                document.getElementById('table-container').innerHTML = html;
            })
            .catch(error => {
                document.getElementById('table-container').innerHTML = 'Error loading CSV data. Note: Cross-Origin Resource Sharing (CORS) restrictions might apply if opened locally; try running it via a local web server.';
                console.error('Error:', error);
            });
    </script>

</body>
</html>
